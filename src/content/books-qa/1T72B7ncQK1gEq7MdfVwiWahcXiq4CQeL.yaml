bolumler:
  - baslik: "Hızlı Bakış"
    sorular:
      - soru: "Bu kitap tek cümlede ne iddia ediyor?"
        cevap: |
          İrade doğuştan verili bir güç değil, **enerjini bir muhasebeci gibi yöneterek**
          ve düzenli çalışmayla terbiye edilen bir alışkanlıktır; kararlılık "dişini sıkmak"
          değil, stratejik bir enerji ekonomisidir.
      - soru: "Yazar hangi yaygın inanışın yanlış olduğunu söylüyor? (Kitabın
          \"düşmanı\" kim?)"
        cevap: |
          İki düşmanı var: birincisi **tembellik** — Payot'ya göre bütün ahlaksızlıkların anası,
          çünkü boş kalan zihne dürtüler yerleşir. İkincisi, dönemin edebiyatının ve bazı
          doktorların yaydığı bahaneler: "aşk hayatın tek amacıdır", "kendini tutmak sağlığa
          zararlıdır" gibi iddiaları, irade zayıflığını örtbas eden uydurmalar olarak sertçe reddeder.
      - soru: "Bu kitabı okumasam kaçıracağım en değerli 3 fikir ne?"
        cevap: |
          1. **Kısır döngü teşhisi:** Tembellik insanı gevşetip dürtülere iter; dürtülerin
             yorgunluğu tekrar tembelliğe sürükler — ikisi müttefiktir, ayrı ayrı yenilmez.
          2. **Enerji transferi:** Fazla enerji bastırılmaz, başka hesaba aktarılır —
             zihinsel çalışmaya veya fiziksel aktiviteye.
          3. **Göğüs göğüse savaşma, kaç:** Dürtüyle doğrudan savaşmak onu güçlendirir;
             çözüm hatırlatıcı ortamlardan uzak durmak ve zihni dolu tutmaktır.
  - baslik: "Derinleştirme"
    sorular:
      - soru: "Kitabın omurgası olan zihinsel model/framework nedir?"
        cevap: |
          **Enerji ekonomisi:** Kendine, bütçesini yöneten bir muhasebeci gibi davran.
          Enerji fizyolojik bir gerçekliktir; israf edilebilir (gece hayatı, hayaller,
          dağınık hazlar) ya da hesaplar arası transferle geleceğin entelektüel ve mesleki
          sermayesine yatırılabilir. Düzenli çalışma bu bütçenin hem geliri hem sigortasıdır.
      - soru: "Kitaptaki hangi kavramlar birbirine bağlı?"
        cevap: |
          Tembellik ↔ dürtüler kısır döngüsü merkezdedir; "boş zihin" bu döngünün kapısı,
          "düzenli çalışma" hem akademik araç hem savunma mekanizmasıdır. Enerji transferi
          ilkesi, kaçınma/hijyen stratejisiyle birleşerek pratik yöntemi oluşturur.
  - baslik: "Uygulama"
    sorular:
      - soru: "Bu kitabı okuduktan sonra yarın sabah farklı yapacağım ilk şey ne
          olmalı?"
        cevap: |
          Zihnini boş bırakan ilk saati bul ve oraya **düzenli, küçük bir çalışma bloğu** koy —
          Payot'ya göre savaş iradeyle değil takvimle kazanılır. Enerjini dağıtan bir
          alışkanlığı yasaklamak yerine yerine ne koyacağını yaz (transfer ilkesi).
      - soru: "Kitaptaki fikirleri kendi projeme uygularsam neye benzer?"
        cevap: |
          Motivasyon beklemeden çalışan bir sistem kurmak: bildirimsiz bir çalışma ortamı
          (kaçınma/hijyen), günün aynı saatinde başlayan kısa odak blokları (düzenli çalışma)
          ve dağılan dikkati suçlamak yerine onu projenin başka bir görevine yönlendirmek
          (enerji transferi).
  - baslik: "Eleştiri ve Bağlam"
    sorular:
      - soru: "Kitap yazıldığından bu yana hangi iddiaları eskidi, hangileri hâlâ
          geçerli?"
        cevap: |
          Cinsellik ve ahlak üzerine verdiği hükümler ile dönemin tıbbına yaptığı atıflar
          19. yüzyıl sonunun izlerini taşır ve bugün tartışmalıdır. Buna karşılık çekirdek
          teşhisi — boş zihnin dürtülere yenik düşmesi, iradenin strateji ve ortam tasarımıyla
          çalışması — dikkat ekonomisi çağında yazıldığı günden daha güncel duruyor.
ozet:
  - baslik: Kitabın Yapısı ve 5 Parçalı Okuma Haritası
    icerik: >-
      Kitap, irade terbiyesini psikolojik, fizyolojik ve sosyolojik boyutlarıyla
      ele alan, teoriden pratiğe uzanan beş ana kitaptan (bölümden)
      oluşmaktadır. Bu yapı, sorunun teşhisi, pratik mücadele alanları, dış
      etkenler, içsel silahlar ve psikolojik mekanizmanın işleyişi olarak
      mükemmel bir mantıksal silsile izler.


      **Kitabın 5 Mantıksal Parçası:** Yazarın orijinal kurgusunda yer alan 5
      'Kitap', derinlemesine analiz için tam olarak 5 mantıksal parçaya karşılık
      gelmektedir: 1. Teşhis ve Teori, 2. Sahadaki Düşmanlar, 3. Çevresel
      Faktörler, 4. Bireysel Silahlar, 5. Zihnin ve Duyguların Makine Dairesi.


      - Parça 1 (Meseleye Giriş): Zihinsel engellerin (yanlış inançlar ve
      isteksizlik) temizlenmesi.

      - Parça 2 (Kişiye Özel Tavsiyeler): Enerjiyi sömüren pratik düşmanların
      (cinsellik, kötü arkadaş, bahaneler) teşhisi ve defedilmesi.

      - Parça 3 (Çevrenin Önemi): Öğretmenler ve kitaplar gibi dış müttefiklerin
      doğru kullanımı.

      - Parça 4 (İç Kaynaklarımız): Tefekkür, eylem ve bedensel sağlık ile
      iradenin içeriden inşası.

      - Parça 5 (İrade Psikolojisi): Düşünce ve duygu dinamiklerini kullanarak
      aklın nihai zaferinin kurgulanması.


      Jules Payot'nun *İrade Terbiyesi*, yalnızca tavsiyeler veren bir kişisel
      gelişim kitabı değil; insan psikolojisini temel alan, adeta mühendislik
      titizliğiyle kurgulanmış bir strateji rehberidir. Kitabı derinlemesine
      incelemeye başlamadan önce, yazarın zihnindeki haritayı okumak zorundayız.
      Eser, yazarın bizzat 'Kitap' olarak adlandırdığı 5 ana kısımdan oluşur. Bu
      5 kısım, sonraki okumalarımız için kusursuz bir '5 mantıksal parça'
      oluşturmaktadır. İşte bölüm bölüm İrade Terbiyesi'nin anatomisi:


      ### Parça 1: Meseleye Giriş (Temel Felsefe ve Teşhis)


      **Birinci Bölüm: Mücadele Edilecek Düşman: İsteksizlik**

      İrade zayıflığının ve düzenli çaba göstermekten kaçınmanın (tembelliğin)
      en büyük düşmanımız olduğu anlatılır. Anlık parlamalar yerine sürekli ve
      tek amaca yönelik çalışmanın kalıcı başarıyı getireceği vurgulanır.


      **İkinci Bölüm: Amacımızı Unutmayalım**

      Zihinsel çalışmanın ve dikkatin hayati önemi açıklanır. Bir fikrin veya
      hedefin zihinde sürekli tutularak, tefekkür ve sabırla nasıl olgunlaşması
      ve güçlenmesi gerektiği anlatılır.


      **Üçüncü Bölüm: İrade Terbiyesinde Cesaret Kırıcı Teoriler**

      Karakterin değişmezliğini savunan kadercilik ile insanın anında
      değişebileceğini savunan kolaycı özgür irade teorileri çürütülür. Gerçek
      iradenin ancak psikoloji kanunları öğrenilerek ve uzun soluklu sabırlı bir
      çabayla inşa edilebileceği savunulur.


      ### Parça 2: Kişiye Özel Tavsiyeler (Pratik Düşmanlarla Savaş)


      **Birinci Bölüm: Mücadele Edilecek Düşman: Cinsel Dürtüler ve Şehvet**

      Gençlerin enerjisini tüketen şehvet ve bedensel hazların irade üzerindeki
      yıkıcı etkisi incelenir. Bu dürtülerle doğrudan savaşmak yerine, aklı
      meşgul ederek ve fiziksel enerjiyi başka yönlere kanalize ederek kaçınma
      stratejileri önerilir.


      **İkinci Bölüm: Mücadele Edilecek Düşman: Kötü Arkadaşlar**

      Çalışma şevkini kıran, amaçsız ve tembel arkadaş çevrelerinin zararları
      anlatılır. Öğrencinin bu tür ortamlardan uzak durup, kendi hedeflerine
      uygun, küçük ama kaliteli bir çevre kurması gerektiği vurgulanır.


      **Üçüncü Bölüm: Mücadele Edilecek Düşman: Tembellik Bahaneleri**

      Tembelliğin kendini meşrulaştırmak için ürettiği 'zamanım yok' veya 'uygun
      ortam yok' gibi mazeretler (sofizmler) çürütülür. Başarının, büyük
      şehirlerin imkanlarında değil, kişinin kendi iç disiplininde ve
      konsantrasyonunda yattığı gösterilir.


      **Dördüncü Bölüm: Çalışmanın Verdiği Mutluluk**

      Tembelliğin aslında gizli bir eziyet ve sıkıntı kaynağı olduğu belirtilir.
      Düzenli ve iradeli çalışmanın ise insana öz saygı, bağımsızlık ve kalıcı
      bir iç huzuru (mutluluk) getireceği anlatılır.


      ### Parça 3: Çevrenin Önemi (Dış Müttefikler)


      **Birinci Bölüm: Toplumsal Destek ve Öğretim Görevlileri**

      İnsanın sosyal bir varlık olarak çevresinden nasıl etkilendiği ve
      öğretmenlerin irade eğitimindeki kritik rolü tartışılır. Yükseköğretimde
      sırf bilgi yüklemek yerine, hocaların gençlere çalışma metodu ve moral
      aşılaması gerektiği vurgulanır.


      **İkinci Bölüm: Büyük Üstatların Etkisi**

      Yaşayan çevrenin vasat veya yetersiz kaldığı durumlarda, ölülerin yani
      büyük düşünürlerin eserlerinin nasıl rehberlik edeceği anlatılır.
      Nitelikli kitapların, gençlerin moralini yükselten en güçlü destekçiler
      olduğu belirtilir.


      ### Parça 4: İç Kaynaklarımız (Bireysel Silahlar)


      **Birinci Bölüm: İrade Terbiyesinde Tefekkürün Önemi**

      Düşüncelerin tek başına harekete geçirici gücü olmadığı, tefekkürle (derin
      düşünme) duygularla beslenmesi gerektiği açıklanır. Zihnin dış
      uyaranlardan arındırılarak belirli bir hedefe kilitlenmesinin yolları
      aranır.


      **İkinci Bölüm: Tefekkür Nedir ve Nasıl Yapılır?**

      Kelimelerle yüzeysel düşünmek yerine, soyut hedeflerin zihinde
      somutlaştırılarak detaylıca hayal edilmesi öğretilir. Sigara gibi kötü
      alışkanlıkların zararlarını ya da çalışmanın faydalarını zihinde canlı
      tutmanın pratik yolları sunulur.


      **Üçüncü Bölüm: İrade Terbiyesinde Hareketin Önemi**

      Tefekkürle uyanan duyguların, anında küçük de olsa fiziksel eylemlere
      dökülerek alışkanlık haline getirilmesi gerektiği vurgulanır. 'Yaptığın
      işi yap' kuralıyla her gün düzenli adımlar atmanın önemi işlenir.


      **Dördüncü Bölüm: İrade Terbiyesinde Beden Sağlığının Önemi**

      Zihinsel enerjinin ve iradenin, bedensel sağlığa (sindirim, solunum, uyku)
      doğrudan bağlı olduğu kanıtlanır. Aşırı yeme ve hareketsizliğin zihni
      uyuşturduğu; açık hava ve dengeli beslenmenin ise iradeyi keskinleştirdiği
      anlatılır.


      ### Parça 5: İrade Psikolojisi (Makine Dairesi)


      **Birinci Bölüm: Düşüncelerin İrade Terbiyesindeki Rolü**

      Salt akli düşüncelerin insanı harekete geçiren dürtüler karşısında tek
      başına zayıf kaldığı incelenir. İradenin eyleme dönüşmesi için fikirlerin
      mutlaka güçlü duygularla beslenmesi ve çağrışım yasalarının bilinçli
      kullanılması gerektiği aktarılır.


      **İkinci Bölüm: Duygusal Hallerin İrade Terbiyesindeki Rolü**

      İnsanı asıl yönlendiren ve eyleme iten gücün mantık değil, derin hisler ve
      heyecanlar olduğu detaylandırılır. Başarılı bir irade eğitiminin, bizi
      hedefe götürecek faydalı duyguları güçlendirme ve zararlıları pasifize
      etme yeteneğine dayandığı savunulur.


      **Üçüncü Bölüm: Aklın Gücü**

      Aklın, içgüdüler ve duygular üzerinde doğrudan anlık bir gücü olmasa da,
      zamanı ve dikkati silah olarak kullanarak dolaylı bir hakimiyet
      kurabileceği kanıtlanır. Olumsuz bahaneleri reddedip olumlu telkinlere
      odaklanarak aklın sonunda duygusal bedeni nasıl yöneteceğinin stratejisi
      çizilir.
  - baslik: Parça 1 · Meseleye Giriş — Teşhis ve Teori
    icerik: >-
      *Neden sürekli çalışıyor gibi görünüp hiçbir şey başaramıyoruz? Yüz yıllık
      bir başyapıt, zihnimizdeki yanılgıları ve görünmez düşmanımız tembelliği
      nasıl yeneceğimizi anlatıyor.*


      Romalı İmparator Caligula'nın tarihe geçen o meşhur, kan dondurucu
      dileğini bilir misiniz? Düşmanlarının tek bir kafası olmasını isterdi ki,
      onu tek bir kılıç darbesiyle uçurabilsin [1]. Bizler de kendi iç
      dünyamızdaki düşmanlarla—odaklanma sorunlarımız, ertelemelerimiz,
      isteksizliğimiz—savaşırken çoğu zaman bu yanılgıya düşeriz. İrade
      zayıflığı dediğimiz o koca canavarı tek bir motivasyon patlamasıyla, tek
      bir kahramanlık anıyla yok etmek isteriz [1, 5]. Ancak Fransız eğitimci ve
      düşünür Jules Payot, *İrade Terbiyesi* adlı başyapıtının Meseleye Giriş
      bölümünde bizleri acı bir gerçekle yüzleştirir: İrademizin karşısındaki
      düşman, tek bir kılıç darbesiyle ölecek bir canavar değil, tıpkı yerçekimi
      gibi her saniye, her an bizi aşağı çeken sürekli bir kuvvettir [1]. Eğer
      iradenizi inşa etmek, derslerinizde, kariyerinizde veya hayatınızda ipleri
      elinize almak istiyorsanız, önce düşmanı doğru tanımalı ve zihninizdeki o
      sahte haritaları yırtıp atmalısınız. Gelin, Payot'nun kaleminden, adım
      adım kendi zihnimizin röntgenini çekelim.


      ### Bölüm 1: İsteksizlik ve Tembelliğin Anatomisi - Görünmez Düşmanımız


      Payot, analizine insan doğasının en temel gerçeğini saptayarak başlar:
      İnsan doğası gereği rahata düşkündür ve tembellik, tıpkı yerçekimi kanunu
      gibi son derece doğal bir düşüştür [1]. Buna karşın, kararlı bir irade
      ayakta kalabilmek için sürekli ve düzenli bir güce ihtiyaç duyar [1, 5].
      Çoğumuz, içimizdeki bu eylemsizliği, geçici ve şiddetli tutkularla
      (örneğin sınava bir gün kala gelen o panik dolu çalışma isteğiyle)
      yenebileceğimizi sanırız [5, 12]. Oysa Payot, tutkuların doğası gereği
      kısa sürdüğünü ve ne kadar şiddetli olurlarsa o kadar çabuk söndüklerini
      hatırlatır [5]. 


      Günlük hayatımıza bir bakalım. Herbert Spencer'ın da isabetle belirttiği
      gibi, insanların büyük bir çoğunluğu 'aklını en az şekilde kullanarak'
      hayattan geçip gitmenin yollarını arar [13]. Eğitim sistemimizin kalbinde
      bile bu çürümüşlük yatar. Maneuvrier'in deyişiyle, birçok öğrenci, sadece
      ezberleyerek asgari çabayla sınıf geçmeyi, ardından da itibarlı olması
      gerekmeyen, beynini yormayacağı, adeta 'bir saat misali aynı hareketlerin
      tekrar edildiği' bir devlet dairesi koltuğuna yerleşmeyi hayal eder [14].
      Hatta avukatlık, doktorluk veya profesörlük gibi başlangıçta zihinsel efor
      gerektiren meslekler bile, zamanla rutine binerek beynin melekelerini
      köreltir [14, 15]. 


      Peki tembellik tek bir yüzle mi karşımıza çıkar? Hayır, Payot bu noktada
      adeta bir cerrah gibi tembelliği üç farklı maskesiyle teşhis eder:


      1. **Uyuşuk Tembellik (Somnolent Laziness):** Bu, teşhisi en kolay
      olanıdır. Saatlerce uyuyan, halsizce uyanan, her şeyi isteksizce yapan
      gençlerdir [15]. Bunlar, sabahı yatakta öldürüp öğleden sonrayı kafelerde
      gazetelerin küçük ilanlarına kadar okuyarak (çünkü bu hiçbir çaba
      gerektirmez) geçirirler [15, 16]. Payot, bu insanları Aziz Jerome'un
      tasvirine benzetir: 'Ellerinde kılıçları havada bekleyen ama hiçbir zaman
      indirmeyen heykeller' [16]. Mutluluğun çaba gerektiren (okumak, müze
      gezmek, ormanda yürümek) zevklerinden mahrum, umutsuz bir kısır döngü
      içindedirler [16].


      2. **Anlık Patlamalarla Gelen Tembellik:** Düzenli çalışmaktan kaçanların
      sığınağıdır. Payot, Arapların anlık bir enerjiyle büyük bir imparatorluk
      kurduklarını ancak yollar, okullar ve sanayi gibi 'düzenli çaba'
      gerektiren yapıları inşa edemedikleri için bu imparatorluğu
      koruyamadıklarını anlatır [12]. Sınav arifesinde kırbaçlanmış gibi
      çalışan, sonrasında uzun dinlenmelere yatan öğrenci de tam olarak budur
      [12]. Oysa eksik olan, aylarca ve yıllarca süren az ama düzenli efordur
      [12].


      3. **Dağınık Tembellik (Scattered Laziness):** İşte modern çağın en büyük
      tuzağı! Bu kişi görünüşte hiç boş durmaz. Brunetiere'in Racine üzerine
      yazdığı makaleleri okur, biraz jeolojiye bakar, gazeteleri karıştırır,
      çeviri yapar [2]. Arkadaşları onun bu çalışkanlığına hayran kalır [2].
      Ancak Payot, bunu kesin bir dille 'tembellik' olarak nitelendirir [2].
      Neden mi? Çünkü bu, zihni zorlayan 'tek bir amaca odaklanma' zorluğundan
      kaçışın kılıfıdır [2]. Fenelon'un o muhteşem benzetmesiyle, bu zihin
      'rüzgarlı bir odada yanan mum' gibidir [2]. Zihne giren fikirler, bir
      otelde konaklayan geçici müşteriler gibi gelir ve iz bırakmadan giderler
      [6, 17]. 


      Eğitim sistemimiz de maalesef bu dağınık tembelliği besler. Öğrenciler
      felsefe, matematik veya tarih çalışırken araştırmak ve kendi örneklerini
      bulmak yerine, sadece 'kelimelerle' düşünüp hocanın verdiğini ezberlerler
      [17, 18]. Moliere'in Jourdain karakteri gibi bilmeden konuşurlar [17].
      Üniversite profesörleri de bu tembellikten nasibini alır; La Fontaine'in
      masalındaki ateşteki kestaneleri çıkaran rakun gibi, yaratıcı düşünceye
      ihtiyaç duymadan sabit materyalleri tekrarlarlar [19, 20]. Ernest Renan'ın
      uyardığı gibi, kütüphanelerde biriken milyonlarca cilt eser, eğer
      arkasında güçlü bir odaklanma yoksa sadece Mont-Blanc dağından 40 kat
      yüksek bir kağıt yığını olmaktan öteye gitmez [20]. 


      Payot'nun eğitim sistemimize eleştirisi çarpıcı bir askeri analojiyle
      zirveye ulaşır: Eskiden topçu obüsleri hedefe ulaşmadan yüzeyde patlar ve
      etkisiz kalırdı; şimdilerde ise geliştirilen tapalar sayesinde mermi
      toprağın derinliklerine inip orada infilak ederek her şeyi paramparça
      ediyor [8]. Eğitim sistemimiz ise zihnimize bu 'derine inme' yeteneğini
      vermeyi unutmuştur [8]. Öğrenci, onca ders arasında yüzeyde koşuştururken,
      lise sonrası üniversiteye geçtiğinde tamamen rehbersiz kalır [21]. Adeta
      can yeleğiyle yüzmeyi öğrenip sonra korumasızca okyanusa atılmış gibidir
      [21].


      **Bu bölümün özü:** Tembellik sadece yataktan çıkmamak değildir; çoğu
      zaman çok çalışıyormuş gibi görünerek asıl odaklanılması gereken zor
      hedeften kaçma sanatıdır. İrade ise tek bir hedefe yöneltilmiş sürekli ve
      bilinçli bir dikkatin eseridir.


      ### Bölüm 2: Odaklanma Sanatı ve Tohumu Büyütmek - Amacımızı Unutmayalım


      Sorunu tanımladık. Peki, içimizdeki o dağınık enerjiyi nasıl
      toparlayacağız? Payot, çalışmaya dair içgüdüsel bir saygımız olduğunu
      söyler [22]. Öğrencilerin sabah beşte kalktıkları yalanını uydurmaları
      veya çalışmalarını abartmaları bile, aslında iradeye duydukları gizli
      hayranlığın ve kendi tembelliklerinden duydukları utancın bir kanıtıdır
      [22, 23]. Bizim görevimiz bu küçük saygı kırıntısını alıp kalıcı bir
      alışkanlığa dönüştürmektir [23].


      Bunun için 'dikkat' kavramını doğru anlamak zorundayız. Dikkat, gergin
      tutulan kesintisiz bir yay değildir; aksine bazen şiddetli, bazen sakin
      ama birbirini takip eden irili ufaklı, düzenli gayretlerin toplamıdır [23,
      24]. Eser vermek, anlık bir hevesle değil, bir fikrin veya duygunun
      yavaşça olgunlaşmasıyla mümkündür [9, 24]. 


      Payot bu durumu muazzam örneklerle açıklar: Sanat eserleri ve büyük
      buluşlar, bir gençlik hayalinin, yolda okunan iki satırın, bir sohbetin
      zihinde yıllarca işlenmesiyle doğar [9]. Goethe, ölümsüz eseri Faust'un
      fikrini zihninde tam otuz yıl boyunca gezdirmiştir [9]. Tohum, toprak
      altında otuz yıl olgunlaşmış, etrafındaki her tecrübeden (seyahat, sohbet)
      beslenerek can suyunu bulmuştur [9]. Benzer şekilde Newton yerçekimini
      'sürekli düşünerek' keşfetmiş, Darwin ise sadece odaklandığı meselelere
      yoğunlaşarak o devasa bilimsel devrimi yapmıştır [10].


      Fikirlerin içimizde olgunlaşması, kimyadaki billurlaşma (kristalizasyon)
      gibidir [10, 25]. Laboratuvardaki bir sıvının içindeki moleküllerin
      muhteşem bir kristale dönüşmesi için 'sükunete', yani rahat bırakılmaya
      ihtiyacı vardır [10, 25]. Eğer o kabı sürekli sallar, dikkatimizi
      dağıtırsak o kristal oluşmaz. Zihnimizdeki fikirler de, onlara samimi bir
      itina ve odaklanma sunmadığımız sürece güçlenemez ve iradeyi ateşleyemez
      [9, 25].


      **Bu bölümün özü:** Gerçek zihinsel üretim ve irade, fikirlerin zihnimizde
      bir tohum gibi ekilip, sabırla, sükunetle ve dış dünyadan gelen (faydalı)
      her türlü deneyimle yavaş yavaş beslenmesiyle kristalleşir.


      ### Bölüm 3: Zihnimizi Tutsak Eden İki Yanılgı - Cesaret Kırıcı Teoriler


      Eğer iradenin düzenli bir çaba gerektirdiğini kabul ediyorsak, yola
      çıkmadan önce zihnimizde bize 'bu iş imkansız' veya 'bu iş çok kolay'
      diyen zehirli felsefeleri temizlemek zorundayız [26]. Payot, irade
      terbiyesinin önünü tıkayan iki zıt ama eşit derecede zararlı (cesaret
      kırıcı) teoriye savaş açar.


      **Birinci Yanılgı: Karakterin Değişmezliği (Kadercilik - Determinizm)**

      Kant ve Schopenhauer gibi dev felsefecilerin savunduğu, Herbert Spencer'ın
      da uzun vadeli (evrimsel) bir versiyonunu sunduğu bu teoriye göre;
      karakterimiz doğuştan gelir ve değiştirilemez [3]. Schopenhauer'a göre bir
      egoisti eğitimle değiştiremezsiniz; onu belki sadece 'büyük çıkarlar'
      göstererek yanıltabilirsiniz ama içindeki kötülüğü söküp atmak, bir kediyi
      fare kovalamaktan vazgeçirmek kadar imkansızdır [3, 27]. Spencer ise
      karakterin ancak binlerce yıllık evrimle, sosyal çevrenin törpülemesiyle
      değişebileceğini, yirmi yıllık bir öğrenci hayatında bunun pek de mümkün
      olmadığını iddia eder [27, 28].


      Payot bu fikri 'çocukça' bulur ve reddeder [3]. Eğer atalarımızın genetik
      mirasına karşı çıkamayacaksak, irade eğitimine başlamadan pes etmemiz
      gerekir [28]. Schopenhauer, hayatının bir döneminde hata yapan insanın her
      zaman hata yapacağını savunurken [29], Payot insanların çoğunun zaten
      zekalarını kullanmadıklarını, modanın ve toplumun rüzgarıyla tıpkı
      Güneş'in etrafında sorgusuzca dönen Dünya gibi sürüklendiklerini belirtir
      [29, 30]. Bir egoist bile yeri geldiğinde, yarım saatliğine de olsa canını
      feda edebilecek kadar karakterinin dışına çıkabiliyorsa, insan karakteri
      Kant'ın sandığı gibi 'homojen, sabit bir blok' olamaz [30, 31]. Karakter
      karmaşıktır ve üzerinde çalışmaya müsaittir [31]. Bu kaderci teori, sadece
      kendi tembelliğimizi haklı çıkarmak için sarıldığımız süslü bir bahanedir.


      **İkinci Yanılgı: Kolaycı Özgür İrade Teorisi**

      Kadercilik ne kadar kötümserse, bu teori de o kadar tehlikeli bir
      iyimserlik taşır. Bu görüş, insanın 'sadece isteyerek' kendi üzerinde
      anında egemenlik kurabileceğini savunur [31]. Payot, bu teorinin, kişiyi
      ıslah etmenin kolay ve doğal bir şeymiş gibi gösterdiği için insanlığa ve
      psikolojiye büyük zarar verdiğini belirtir [4, 32]. Eski çağlarda çocuklar
      ancak sekiz yıllık sert bir disiplinle başarıya ulaşabileceklerini
      bilirken, bugün sadece istemenin yeteceği sanılıyor [4]. 


      Nasıl ki Fransa, 1870'teki yıkıcı yenilgisinden sonra sadece 'Büyük Fransa
      olalım' diyerek değil, yirmi yıllık sabırlı, kan ter içindeki bir çabayla
      yeniden ayağa kalktıysa; bireyin de kendine hakim olması öyle bir anda
      gerçekleşmez [32]. Öğretmenlerin 'Siz nasıl isterseniz öyle olur!' sözleri
      büyük bir yalandır; kimse bize o 'istemeyi' nasıl elde edeceğimizi
      öğretmemiştir [32]. 


      Payot noktayı şöyle koyar: Özgürlük, doğuştan gelen bir hak veya basit bir
      olgu değildir; o kazanılması gereken bir 'ödüldür' [33]. Tıpkı satrançta
      taşların nasıl ilerlediğini bilmeden tecrübeli bir rakibe karşı oynamanın
      anlamsız olması gibi, psikoloji yasalarını (dikkat, duyguların çağrışımı)
      bilmeden zihnimizle savaşmak da hüsranla biter [7, 11]. İrademizin ve
      özgürlüğümüzün tek garantisi, bu psikoloji kurallarını öğrenmek, hayata
      dair bir plan yapmak ve rüzgarı kendi lehimize kullanmayı bilmektir [7,
      11, 34].


      **Bu bölümün özü:** İrademiz ne taştan yontulmuş değiştirilemez bir
      kaderdir, ne de tek bir dilekle gerçekleşecek bir sihir; o ancak aklın ve
      psikolojinin yasaları kullanılarak, bir mimar sabrıyla tuğla tuğla inşa
      edilebilecek bir kaledir.


      **Sonuç:** Jules Payot’nun yüz yılı aşkın bir süre önce koyduğu bu
      teşhisler, bugün sosyal medya bildirimleri, sürekli yenilenen haber
      akışları ve 'aynı anda on sekiz işi birden yapma' yanılgısı içinde boğulan
      modern insan için çok daha büyük bir anlam ifade ediyor. Birinci Kitap,
      bize acı ilacı içirdi ve zihnimizdeki engelleri temizledi. Tembelliğimizin
      maskelerini düşürdük, odaklanmanın ne olduğunu anladık ve değişimin
      imkansız olduğunu söyleyen felsefeleri çöpe attık. Şimdi sıra, bu
      temizlenmiş araziye irademizin temellerini nasıl atacağımızda.


      **Bu parçanın özü:** İrade zayıflığı doğuştan gelen bir lanet değil,
      psikolojik yasaların yanlış kullanılmasının bir sonucudur; sorunu çözmek
      için öncelikle tembelliğin farklı maskelerini (dağınık çalışma, uyuşukluk)
      tanımak ve zihnimizdeki cesaret kırıcı hatalı inançları yıkmak gerekir
      [1-4].
  - baslik: Parça 2 · Kişiye Özel Tavsiyeler — Sahadaki Düşmanlar
    icerik: >-
      1. Mücadele Edilecek Düşman: Cinsel Dürtüler ve Şehvet

      Dostum, irade terbiyesi serüvenimizde artık teorik tartışmaları bir kenara
      bırakıp sahaya iniyoruz; çünkü Jules Payot bu bölümde, zihinsel enerjimizi
      adeta bir kara delik gibi yutan en somut iki düşmanımızla yüzleştiriyor
      bizi: Tembellik ve nefse düşkünlük, yani şehvet

      . Bu ikisi birbirinden bağımsız rastgele düşmanlar değildir; aksine,
      aralarında kusursuz ve ölümcül bir iş birliği vardır

      . Tembellik, insanı gevşeterek ahlaki açıdan tamamen korunaksız bir hale
      getirir ve kişiyi şehvete, bedensel hazlara doğru iter

      . Aynı şekilde, ahlaki çöküntü ve şehvetin bedende yarattığı o ağır
      tahribat da dönüp dolaşarak kişiyi yeniden tembelliğin kucağına fırlatır

      . Payot, ihtirasların insanı nasıl insanlıktan çıkardığını, gözünü kör
      edip beynini kararttığını ve bu dürtüler devam ettiği sürece adeta
      hayvanlar gibi hareket etmemize neden olduğunu çok çarpıcı bir dille
      anlatır

      . Ancak yazarımız burada ahlaki bir vaaz vermekten ziyade, bir mimar gibi
      düşünmemizi ister; tıpkı bir mimarın yerçekimi kanununu binalarını
      sağlamlaştırmak için kendi lehine çevirmeyi bilmesi gibi, biz de
      içimizdeki bu psikolojik güçleri tanımalı ve onları lehimize çevirmeyi
      öğrenmeliyiz

      . Bize zarar veren, tembelliğe sebep olan tüm güçleri kısmak, bize
      canlılık verenleri ise ortaya çıkarmak zorundayız

      .

      Özellikle lise yıllarından sonra, üniversite eğitimi için büyük bir şehre
      gelen gençlerin durumu kritik bir aşamadır

      . Aile baskısından, ödevlerden ve sıkı denetimden kurtulan genç, kendini
      bir anda devasa bir özgürlük alanında, hem de fizyolojik değişimlerinin
      zirvesinde bulur

      . İşte bu dönemde genç, Beaumarchais'nin Cherubin karakterinde resmettiği
      gibi, henüz seveceği kadını bile seçmeden sadece "sevmeyi sevdiği",
      romantik ve coşkulu bir döneme girer

      . Ne var ki bu Herkülümsü enerji doğru bir amaca kanalize edilmezse, genç
      kendini çalışmanın zorluğundan kaçıp pembe hayallerin, verimsiz aşk
      romanlarının ve tembelliğin içinde bulur

      . Payot, bu yaşlarda kurulan o uzun, pembe hayallerin gencin hayati işlere
      odaklanmasına nasıl engel olduğunu, odasında yalnız başına çalışmanın
      gence ne kadar itici gelmeye başladığını vurgular

      .

      Peki bu zihinsel savurganlığın toplumsal kökeninde ne yatar? Payot,
      parmaklarını dönemin acımasız evlilik kurallarına basar: Sosyal gelenekler
      ve başlık parası (veya çeyiz/maddi beklentiler) gibi zorunluluklar
      yüzünden, bir gencin evlenebilmesi için sekiz ila on yıl beklemesi, otuz
      yaşına kadar dişiyle tırnağıyla çalışması gerekmektedir

      ,

      . Gençliğin en güzel on yılı, fiziksel ihtiyaçlar ile kötü alışkanlıklar
      arasında sıkışıp heba olmaktadır

      . Yazarımızın buna bulduğu çözüm ise son derece radikaldir: Erken
      evlenmekten çekinmeyin, bunun için gerekirse o süslü çeyizlerden ve
      maddiyattan vazgeçin!

      . Payot, sürekli korse takan, havasız ortamlarda bir "sera meyvesi" gibi
      yetiştirilen, operalara gidip romantik kitaplar okuyan zengin ve sosyetik
      kızların gerçek hayatla yüzleştiklerinde nasıl darmadağın olduklarını
      anlatır

      . Bunun yerine, erkeğin eksiklerini görebilen, şefkatli, becerikli,
      zorluklara omuz omuza göğüs gerebilecek dürüst bir işçi sınıfı kızıyla
      veya sade bir hanımla evlenmenin, kişisel ve zihinsel gelişim için çok
      daha değerli olduğunu savunur

      . Ünlü düşünür John Stuart Mill'in, eşi Harriet Taylor Mill'den övgüyle
      bahsetmesini örnek göstererek; akılcı ve gözlem yeteneğine sahip tek bir
      kadının varlığının, bir düşünür için bir harem dolusu kadından çok daha
      kıymetli olduğunu hatırlatır

      .

      Eğer evlilik hemen mümkün değilse, gencin bu cinsel dürtülerle, fuhuşla
      veya sokak hayatıyla baş başa kalmasının bedeli çok ağırdır

      . Hayat kadınlarıyla ilişkiye girmenin sonuçları sadece ahlaki değil,
      korkunç derecede fizikseldir

      . Bu ortamlara giren gençler çok çabuk yaşlanır, gözlerinin feri söner,
      göz altları morarır, kas ve omurilik yetmezlikleri başlar; daha otuzlu
      yaşlarda nevralji, kalp hipertrofisi ve görme kayıplarıyla boğuşurlar

      . İşin kötüsü, bu bedensel çöküş hafızayı ve aklı da vurur; dikkat
      dağılır, akıl o kıvraklığını yitirir ve hayat kaygısız, iğrenç bir
      tembelliğe sürüklenir

      .

      Bu noktada Payot, cinselliği bir "enerji bütçesi" meselesi (hesaplar arası
      transfer) olarak ele alır

      . Nasıl ki midemiz boşaldığında açlık hissediyorsak, cinsel organlarda
      biriken sıvılar da aklı sürekli meşgul eder; ancak bu, midenin aksine bir
      eksiklik değil, "harcanması gereken bir fazla enerji" durumudur

      . Ve bu bütçedeki fazla enerjiyi, zihinsel bir çalışmaya veya fiziksel bir
      aktiviteye transfer etmek mümkündür

      ,

      . Üstelik bu azgınlığın en büyük tetikleyicilerinden biri de Tolstoy'un
      deyimiyle "aygır gibi" tıka basa yemek yememiz, ağır et tüketmemiz,
      kafelerin sağlıksız sıcak ortamlarında oturmamız ve sabahları yumuşak
      yataklarda uykuyu uzatmamızdır

      ,

      . Sabah uykuları iradeyi adeta eritir

      .

      Yazarımız edebiyatın ve tıbbın bu konudaki yanıltıcı tavrına da ateş
      püskürür. Carlyle'in, Thackeray'yi eleştirirken Fransız usulü "aşkı
      hayatın tek amacı gibi göstermesini" kınamasını haklı bulur; çünkü aşk
      hayatın sadece kısa bir döneminde yaşanan, diğer önemli işlerimizden
      yalnızca biridir

      . İkinci sınıf edebiyat eserleri ve bazı doktorların "aşksız hayatın boş
      olduğu" veya "iffetli olmanın sağlığa zararlı olduğu" yönündeki 1500
      sayfalık kitapları, gençlerin iradesizliğini meşrulaştırmak için
      uydurulmuş zehirli yalanlardır

      ,

      ,

      ,

      . Zührevi hastalıkların ölümcüllüğüne karşın, kendini tutmanın bedene
      inanılmaz bir zindelik ve enerji verdiğini hatırlatır

      ,

      .

      Peki bu dürtülerle nasıl savaşacağız? Payot'nun stratejisi net: "Göğüs
      göğüse çarpışma, kaç!"

      . Cinsel arzularla doğrudan savaşmaya kalkmak, onları düşünmek anlamına
      geleceğinden onları daha da güçlendirir

      . Akılda pusuda yatan bu düşünceleri uyandıracak resimlerden, romanlardan
      (örneğin Diderot okumaktan), muhabbetlerden ve kötü arkadaşlardan derhal
      uzaklaşmak gerekir

      . Şehvet başlangıçta cılızdır; eğer aklı verimli ve keyifli bir çalışmayla
      sürekli meşgul edersek, bu dürtüler kendine tutunacak bir dal bulamaz

      ,

      . Tembellik, ahlaksızlıkların anasıdır; akıl boş kaldığında hayaller
      devreye girer ve dürtüler oraya yerleşir

      ,

      . Ayrıca genç adam, bu "pembe" sanılan ancak hastalıklı ve masraflı olan
      sahte ilişkilere harcadığı parayı ve zamanı bir kağıda dökmelidir

      ,

      . Barlarda kaprisli kadınlara harcanan o paralarla Alpler'de,
      Pireneler'de, Hollanda'da veya İtalya'da yapılabilecek o muhteşem
      seyahatleri, gezilebilecek müzeleri düşünmek, gencin gözünü açması için
      yeterli olacaktır

      ,

      .

      Bu bölümün özü: Cinsel dürtüler ve şehvet, zihni boş kalmış ve bedeni
      tembelliğe alışmış bir gencin enerjisini sömüren en yıkıcı düşmanlardır.
      Bu düşmanla doğrudan savaşmak yerine; bedeni erken kalkmak ve az yemekle
      terbiye etmek, enerjiyi entelektüel hedeflere "transfer" etmek ve cinsel
      çağrışım yapan tüm ortamlardan akıllıca kaçmak tek geçerli stratejidir.

      2. Mücadele Edilecek Düşman: Kötü Arkadaşlar

      Sevgili dostum, içimizdeki o karanlık dürtülerle nasıl baş edeceğimizi
      konuştuktan sonra, şimdi tehlikenin dışarıdan gelen, güler yüzlü ama bir o
      kadar da sinsi olan formuna geliyoruz: Kötü arkadaşlar

      . İrade terbiyesinde arkadaş seçimi, adeta geleceğimizin mimarisini
      belirleyen en kritik yapıtaşlarından biridir. Payot'ya göre, bir arkadaş
      fıgürünün o masum gülümsemesinin arkasında, aslında istikbalimizin en
      azılı düşmanı pusuda bekliyor olabilir

      .

      Yazarımız üniversite ortamlarındaki tehlikeli arkadaş tiplerini ustalıkla
      sınıflandırır. İlk grupta, maddi durumu iyi olan, aileden zengin, gelecek
      kaygısı taşımayan gençler vardır

      . Bunlar değerler eğitiminden yoksun oldukları için kendi gençliklerini
      hunharca harcarlar; yaşları ilerledikçe de emek veren, çalışan insanları
      küçümseyip onlarla alay etmeyi bir marifet sanırlar

      . İkinci ve çok daha "azılı" grup ise pesimist (karamsar) tiplerdir

      . Bunlar, işten kaçan, tembelliği içselleştirmiş, kıskanç ve haset
      karakterlerdir

      . Sürekli depresyon yayarlar; kendi eksikliklerinin farkında
      olduklarından, içlerindeki o aşağılık kompleksiyle başkalarının da
      çalışmasını engellemek, onları da kendi bataklıklarına çekmek için
      ellerinden geleni yaparlar

      .

      Bir de sırf "tembel" olduğu için tehlikeli olanlar vardır ki, bunlar seni
      sürekli barlara, kafelere davet ederek işinden alıkoyar

      . Özellikle büyük bir şehre gelip ailesinden uzaklaşan ve "özgürlük"
      sarhoşluğu yaşayan Fransız öğrenciler (Almanlardan farklı olarak alkole de
      düşkünlerse), bu içi boş ama sözde kanaat önderi olan "havalı"
      arkadaşların çekimine kolayca kapılırlar

      . Bu tembeller, zayıf karakterli gençleri adeta bir köle gibi peşlerinden
      sürükler, onların zamanını, akıl sağlığını ve iradesini tüketirler

      . Ünlü düşünür Chesterfield'in dediği gibi: "Sadece kendi başlarına
      kalsalar, bu kadar ahlaksızlığa yeltenmezlerdi."

      .

      Böyle ortamlara çekilen bir genç, o an çok eğlendiğini, çok mutlu olduğunu
      sanır. Oysa Payot bu durumu çok çarpıcı bir metaforla açıklar: Onların
      mutluluğu, tıpkı karanlıkta belli belirsiz parlayan "çürük bir odun"
      gibidir; uzaktan ışıldar ama yaklaştığınızda içinin kof ve çürümüş
      olduğunu görürsünüz

      . Kendine hakim olan akıllı bir genç, bu içi boş kalabalığın fikirlerinin
      ve sözde eğlencelerinin aslında bir eziyet ve tehlike barındırdığını çok
      iyi bilir

      . Bu yüzden arkadaşlarının o ısrarlı taleplerini kibarca ama tavizsiz,
      kararlı bir şekilde reddetmelidir

      . Dahası, Payot bize harika bir psikolojik kalkan önerir: Onların o
      yerici, saçma sapan muhabbetlerini dinlerken, tıpkı bir "ruh sağlığı
      doktorunun, akli dengesi yerinde olmayan hastasını dinlediği gibi"
      dinlemeliyiz; yani söylenenlere zerre kadar inanmadan ve etkilenmeden!

      . Sırf onlar beni sevsin, dışlamasın diye verimli çalışma mutluluğumu,
      sağlığımı neden onlara feda edeyim ki?

      .

      Payot, öğrencinin arkadaş grubuna karşı her zaman sempatik ve sevecen
      görünmesini, ancak kendi sınırlarını çizmesini öğütler

      . Bırakın onlar kafelere gidip vasatlığın içinde boğulsunlar; siz
      kütüphanenize veya müzelerinize dönün

      . Kafelere takılmanın en büyük tehlikesi, Jonathan Swift'in Gulliver'in
      Gezilerinde anlattığı o meşhur sahneye benzer: Gulliver sahilde uyurken,
      cüce Lilliputlular onu parmak kalınlığındaki dev halatlarla değil,
      binlerce minicik iplikle yere çivilemişlerdir

      . İşte kafelere takılmak, ara sıra yapılan o "küçük" kaçamaklar, o masum
      görünen alışkanlıklar da böyledir; yavaş yavaş, binlerce minik kazıkla
      iradenizi yere çiviler, sonunda temiz hava yerine sigara dumanına ve
      atalete (eylemsizliğe) esir olursunuz

      .

      Dahası, dikkatimizi dağıtan düşmanlar sadece insanlar değildir; gazeteler
      ve dergi yığınları da zihnimizi parçalayan harici düşmanlardır

      . Gazete okumak, beyni lüzumsuz haberlerle doldurarak tıpkı zararlı
      uyarıcılar gibi zihne anlık ve akut bir darbe vurur

      . Gazeteleri okuduktan sonra sinirlenmeyen, gereksiz bir yorgunluk
      hissetmeyen var mıdır?

      .

      Son olarak, bu dış çevre bağlamında "taşra sosyetesi" (yüksek zümre)
      illüzyonuna da değinir yazar. Taşrada veya büyük şehirde, aklın ve
      karakterin değil de sadece paranın ve gösterişin hakim olduğu, ahlakın
      yerle bir edildiği o "sosyetik" çevreye girmek bir ayrıcalık değil,
      felakettir

      . Aptallık bulaşıcıdır; kültürden yoksun bu ön yargılı çevrede genç, yavaş
      yavaş acıma ve hakkaniyet duygusunu kaybeder, kariyer planlarından
      uzaklaşır

      . Marivaux'nun o harika tanımıyla, böyle bir grubun parçası olan kişi
      "sadece seyreden, dinleyen ama asla düşünmeyen", pencereden boş boş dışarı
      bakan birine dönüşür

      .

      Bu bölümün özü: Zamanımızı, odaklanmamızı ve ahlaki pusulamızı çalan kötü
      arkadaşlar ve boş çevreler, irade terbiyesindeki en büyük sabotajcılardır.
      Akıllı bir genç; kalabalıkların sahte ışıltısına kapılmamalı, "hayır"
      demeyi bilmeli ve kendini minik alışkanlıkların ipleriyle yere
      çiviletmeden, seçkin ve hedefleri olan dar bir dost çemberi kurmalıdır.

      3. Mücadele Edilecek Düşman: Tembellik Bahaneleri

      Gelelim insan zekasının kendi kendini kandırmaktaki o muazzam ve bir o
      kadar da trajik ustalığına. Dostum, tembellik sadece "hiçbir şey yapmama"
      arzusu değildir; o aynı zamanda kendi varlığını meşrulaştırmak,
      vicdanımızı rahatlatmak için zekamızı kiralayan bir avukattır

      . Payot, tembelliğin içimizde ürettiği bu mantıklı görünen ama aslında
      tamamen aldatıcı olan mazeretlere "sofizmler" (yanıltmacalar) der

      . Tıpkı eski bir hikayede "şeytanın, avını ikna edebilmek için oltanın
      ucuna taktığı yemi kişinin zaafına göre sürekli değiştirmesi" gibi,
      tembellik de her defasında bizi avlayacak o süslü ve sinsi bahaneyi bulur

      . Zayıf ve savunmasız irademiz, kendini aklamak için bu bahaneye dünden
      razıdır

      .

      Peki nedir bu en yaygın bahaneler? Üniversite öğrencilerinin, özellikle de
      geçinmek için özel ders veren veya çalışan gençlerin dilinden düşürmediği
      birinci yalan şudur: "Zamanım yok!"

      . Oysa Payot, zihinsel çalışma için günde sadece birkaç saatin fazlasıyla
      yeterli olduğunu savunur

      . Hatta avukatlık, doktorluk veya profesörlük gibi en itibarlı meslekler
      bile bir süre sonra rutine bağlar ve zihni köreltmeye başlar; öğretim
      görevlisinin akşam hissettiği yorgunluk zihinsel bir yorgunluk değil,
      saatlerce konuşmaktan kaynaklanan kas yorgunluğudur

      . Gençlerin birçoğu sorgulandığında aslında günde üç dört saat boş
      vakitleri olduğunu itiraf ederler, ancak "büyük bir eser veya çalışma için
      en az altı saat kesintisiz zamana ihtiyaçları olduğuna" kendilerini
      inandırdıkları için o üç saati de çöpe atarlar

      . Payot onlara şöyle seslenir: Sadece günde üç saat çalışın! Göreceksiniz
      ki, günde 3 saatlik düzenli çalışma ile 6 ayda alacağınız verim, günde 6
      saat çalışarak 3 ayda alacağınız verimden çok daha kalıcı ve faydalıdır

      . Gottfried Leibniz'in o muazzam uyarısını hatırlatır yazar: "Beynimi
      parlatacağım diye ne kadar aşırı çalışırsanız, o kadar köreltirsiniz."

      .

      Bir diğer tembel türü ise zamanı olduğunu kabul eder ama bu kez de "işe
      koyulmanın, o havaya girmenin çok uzun sürdüğünü, zihni yorgunken verim
      alamayacağını" iddia eder

      . Bu da koca bir yalandır. Payot, sabah ne kadar uykulu olursanız olun,
      sadece on beş dakikalık bir irade zorlamasıyla zihnin açılacağını ve
      çalışma havasına girileceğini belirtir; uyuşukluk aslında zihinde değil,
      tamamen "istekte"dir

      .

      Gelelim en tehlikeli, en entelektüel bahaneye: "Mekan ve İmkan Bahanesi"
      (Fransa için Paris bahanesi). Öğrenciler, büyük şehirlere, örneğin Paris'e
      gitmeden, o devasa laboratuvarlara ve kütüphanelere erişmeden asla
      başarılı olamayacaklarına, taşrada köreleceklerine inanırlar

      . Tecrübeli insanların bile desteklediği bu "merkezileşme" yanılgısı,
      gencin hevesini kırmak için uydurulmuş en büyük sofizmlerden biridir

      ,

      . Payot, tarih sayfalarını açar ve önümüze devasa kanıtlar serer:
      Descartes, Spinoza, Kant, Rousseau, Darwin, Stuart-Mill, Spencer ve
      Tolstoy! Bu büyük düşünürlerin neredeyse hepsi fikirlerini devasa
      şehirlerin gürültüsünde değil, yalnızlıkta, sükunet içinde ve taşrada
      üretmişlerdir

      . Paris, eserlerin yaratılması için değil, sadece "pazarlanması ve şöhret
      bulunması" için bir mecradır; tıpkı bir katilin Paris'te cinayet
      işlediğinde tüm ülkenin duyması gibi

      .

      Alman doğa bilimci Ernst Haeckel'in o sarsıcı tespitini hatırlatır yazar:
      "Üniversitelerin bilimsel buluşları, büyüklükleriyle ters orantılıdır!"

      . Devasa ve muhteşem laboratuvarlarda, uyuşuk bir beyinle sadece ziyan
      olursunuz; önemli olan kısıtlı imkanlarla büyük işler başarma heyecanıdır

      . Peki ya devasa kütüphaneler? Payot'ya göre, binlerce kitaba sınırsız
      erişimi olan biri, araştırmak ve kendi fikrini üretmek yerine hazıra
      konmaya meyleder

      . Oysa kısıtlı kaynağı olan bir genç, elindeki üç beş kitabı derinlemesine
      okur, üzerine düşünür ve onları zihninde mükemmel bir şekilde organize
      eder

      . Bunu, "dağınık ve kalabalık bir askeri birlik (büyük kütüphane) ile tam
      teçhizatlı, disiplinli, elit bir askeri birliğin (kısıtlı ama iyi
      sindirilmiş bilgi)" karşılaştırmasıyla açıklar

      .

      Üstelik büyük şehir, Jules Huret'nin edebi gelişim üzerine
      araştırmalarında belirttiği gibi, gençleri daracık dairelere hapseden,
      fabrika bacalarının gökyüzünü kapattığı, stresli, gürültülü ve huzursuz
      bir koşuşturmadan ibarettir

      . Orada insan kaybolur. Oysa "taşra" demek sükunet demektir, manastır
      dinginliği demektir

      . Orada kafanız rahat olur, düşünceleriniz yavaş yavaş olgunlaşır, temiz
      havada kalbinizin pompaladığı oksijenle zihniniz berraklaşır

      ,

      . Gerçek yetenek ve gelişim dışarıdan içeriye (imkanlardan insana) doğru
      değil, "içeriden dışarıya" doğru gerçekleşir

      . Dünyayı ikiye ayırmak gerekirse, bu "Paris'te olanlar ve olmayanlar"
      değil; "istekli, kararlı olanlar ve zayıf iradeli tembeller" şeklindedir

      . İstekli adam kısıtlı imkanla harikalar yaratır; tembele ise dünyanın en
      büyük kütüphanesini verseniz, kapağını bile açmaz

      .

      Bu bölümün özü: Tembellik, "zamanım yok", "işe odaklanamıyorum" veya
      "bulunduğum şehirde imkan yok" gibi zekice kılıflara (sofizmlere)
      bürünerek irademizi felç eder. Oysa zihinsel üretim devasa
      laboratuvarların veya bitmez tükenmez boş saatlerin değil; sükunet içinde,
      kısıtlı imkanları derinlemesine kullanan kararlı ve odaklanmış bir zihnin
      "içeriden dışarıya" doğru patlamasının eseridir.

      4. Çalışmanın Verdiği Mutluluk

      Ve nihayet dostum, onca düşmanla, onca engelle ve zihnimizin ürettiği
      bahanelerle savaştıktan sonra ulaştığımız o muazzam zirve: Çalışmanın
      insana bahşettiği o saf, devredilemez mutluluk

      . Eğer hayatı hiçbir şey üretmeden, vaktimizi sadece boş işlerle
      harcayarak geçirirsek; yaşımız kemale erip dönüp arkamıza baktığımızda
      hissedeceğimiz şey koca bir "hiçlik" ve dehşettir

      . Tembel insan için zaman, onu yavaş yavaş ölüme götüren ve elinden hiçbir
      şey gelmeden, istemeye istemeye bindirildiği hızlı bir tren gibidir;
      geçmişi nafile bir rüya, bugünü ise anlamsız bir bekleyiştir

      ,

      .

      Oysa düzenli çalışan insan için durum bambaşkadır. Tıpkı tohum eken bir
      çiftçinin hasat zamanı ürününü alması gibi, iradesiyle üreten insan da her
      yeni günde emeğinin karşılığını, toplumun saygısını ve somut bir eser
      bırakmanın onurunu yaşar

      . İnsanın içindeki o "Yaşadığımı hissediyorum!" çığlığı, sadece ve sadece
      çalışmayı bir alışkanlık haline getirmekle duyulabilir

      . Tembel insanın asla tadamayacağı bir coşkudur bu. Hatta Pascal, Maer'e
      yaptığı bir seyahatte sağlık sorunları yüzünden mecburen hiçbir şey
      yapmadan yatmak zorunda kaldığında, "tembelliğin bir insanda asla
      kabullenemeyeceği, en katlanılmaz özellik olduğunu" bizzat yaşayarak
      öğrenmiştir

      . Darwin'in bir gazetede çıkan şu sözü ne kadar da manidardır: "Bir asker
      veya çiftçi hayat koşullarından şikayet ediyorsa, onu işsiz bırakın (asıl
      ceza budur)!"

      .

      Payot, tembel insanı Antik Yunan tiyatrosundan alınma o vurucu kavramla
      tanımlar: "Hotontimorümenos", yani "kendi kendisinin celladı"

      . Tembellik, insanın kendi bedenine ve aklına yapabileceği en ağır
      işkencedir

      . Hele bir de mirasa konmuş, çalışmak zorunda olmayan ama beyni boş kalmış
      insanları düşünün; sıkıntıdan patlarlar, problemlerini uyuşturucularda
      veya cinsel aşırılıklarda arar, kendi kendilerini zehirlerler

      . Zira "şeytan tembellerden beslenir"; meşguliyeti olmayan beyin, kendi
      sıkıntılarını tıpkı geviş getiren bir hayvan gibi sürekli çiğner durur ve
      kendini tüketir

      . Tembel, lortlar gibi yaşasa bile hayat ona eziyettir, çünkü
      hareketsizlik keyif vermez; gerçek zevk çabanın tam kalbindedir

      .

      Çalışmak kelimesinin zihinlerde eziyet, yorgunluk ve acı ile
      eşleştirilmesi insanlık adına büyük bir trajedidir

      . Psikolojinin en basit kuramlarından biri der ki: Aşırıya kaçılmadığı
      sürece tüm çalışmalar insanı mutlu eder

      . Payot bu durumu ünlü düşünür Montaigne'in "erdem" tanımıyla açıklar.
      Montaigne'e göre erdem, insanların sandığı gibi ulaşılmaz bir Kafdağı'nın
      tepesinde, korkutucu, tehlikeli kayalıkların arkasında bekleyen bir
      hayalet değildir; aksine yaklaştıkça güzelleşen, verimli ve güzel
      kırlardaki çiçekler gibidir, ulaşan için yolu gölgelik ve çiçeklidir

      . İşte zihinsel çalışma da tam olarak böyledir! Gençlere çalışmanın, o
      verimli kırlardaki çiçekler gibi doğal bir haz olduğunu öğretmeliyiz

      .

      Dahası, tembel insan varlığını ve eğlencesini sürdürmek için daima
      başkalarına muhtaçtır; "çalışmak özgürlüktür" kuralı gereği, çalışmayan
      kişi sürekli başkalarının hizmetine ve onayına bağımlı kalır

      . Yunan filozof Epiktetos, hayatı "bizden kaynaklananlar" ve "bizden
      kaynaklanmayanlar" olarak ikiye ayırır ve tüm acılarımızın "bizden
      kaynaklanmayan" şeylere (yani dışa) bağımlı olmaktan çıktığını söyler

      . Tembelin mutluluğu tamamen başkalarına bağlıyken, çalışkan insan kendi
      ürettiği işle, kendi kendine yeterek mutlu olur

      .

      Ve nihayet zaman akıp gittiğinde, yaşlılık gelip çattığında ne olur?
      Tembel için yaşlılık karanlık, dar ve karamsar bir sondur. Oysa çalışkan
      insan, gençliğin o anlamsız egoist zevkleri geride kaldığında, kültürel ve
      zihinsel birikiminin meyvelerini toplar

      . Quinet'in o muazzam itirafını hatırla: "Yaşlılık geldiğinde, onu bana
      anlatılan karanlık ve soğuk tablodan çok daha sempatik, gençliğimden çok
      daha huzurlu buldum. Hiç olmadığım kadar geniş ufuklara sahip oldum...
      Hiçbir şeye değişmem bugünümü!"

      . Zihnen çalışan insanın, hem içsel bir huzuru hem de çevresine yaydığı
      doğal bir otoritesi vardır; bu, lüksün, paranın veya sahte şöhretin asla
      satın alamayacağı, sadece ter ve iradeyle kazanılmış o asil, kalıcı ve
      yenilmez mutluluktur

      .

      Bu bölümün özü: Çalışmak, sanıldığının aksine bir külfet veya eziyet
      değil, insanın kendi kendini var etme, bağımsızlaşma ve hayatını
      anlamlandırma sürecidir. Tembellik insanı içten içe kemirip kendi
      kendisinin celladı (hotontimorümenos) yaparken; düzenli iradi çaba, kişiye
      gençliğinde özgürlük, yaşlılığında ise geniş ufuklu, asil ve sarsılmaz bir
      iç huzuru bahşeder.
  - baslik: Parça 3 · Çevrenin Önemi — Dış Müttefikler
    icerik: >-
      *Kendi içimizde kopardığımız fırtınalar yetmez. Jules Payot’ya göre irade;
      doğru öğretmenler, özenle seçilmiş dostlar ve 'ölümsüz üstatların'
      rüzgarıyla şişen bir yelkendir.*


      Dostum, irade terbiyesi serüvenimizde şu ana kadar hep iç dünyamızın
      dehlizlerinde dolaştık. Tembelliğimizin maskelerini düşürdük, cinsel
      dürtülerimizin o sinsi enerjisini nasıl yöneteceğimizi konuştuk ve
      bahanelerimizi lime lime ettik. Belki de kendi kendine, 'Tamamdır, ben bu
      işi kafamda çözerim, kapıları kilitler ve dünyayı dışarıda bırakarak
      irademi çelik gibi yaparım' dedin. Jules Payot, işte tam bu noktada, İrade
      Terbiyesi’nin Üçüncü Kitabı’nda o kilitli kapıları kırarak içeri giriyor
      ve seni çok sert bir gerçekle yüzleştiriyor: *Tek başına başaramazsın.*
      İrade, sadece kişisel ve izole bir çaba değildir; çevrenin, toplumun,
      öğretmenlerin ve hatta yüzyıllar önce ölmüş büyük düşünürlerin desteğine
      muhtaç, devasa bir sosyal organizasyondur. Eğer iç kaynaklarınla tek
      başına savaşıyorsan, silahını teslim etme vaktin gelmiş demektir. Şimdi,
      bu yalnızlık illüzyonundan kurtulup, dış dünyadaki devasa rüzgarları
      yelkenlerimize nasıl dolduracağımızı adım adım inceleyelim.


      ### Bölüm 1: Toplumsal Baskının Gücü ve Öğretmenlerin İhaneti


      İnsanoğlu, doğası gereği başkalarının gözleriyle var olan bir canlıdır.
      Dış dünyanın bizim hakkımızdaki düşünceleri, içimizde nükleer bir enerji
      yaratabilir. Stuart Mill ve Alexander Bain gibi düşünürlerin tartıştığı
      üzere, toplumu harekete geçiren şey çoğunlukla dışarıdan gelen bir
      teşviktir. Payot, bu toplumsal beklentinin (kamuoyu baskısının) insan
      üzerinde nasıl mucizeler yarattığını tarihten vurucu örneklerle açıklar.


      Antik Atina'yı düşün! Küçücük bir coğrafyadan dünya tarihini değiştiren
      filozofların, şairlerin ve sanatçıların fışkırmasının sebebi neydi? Sadece
      genetik mi? Hayır! Atina halkının entelektüel başarıya ve estetiğe duyduğu
      o muazzam hayranlık, yani 'toplumsal destek' o dehaları doğurdu. Ya
      Sparta? Spartalı bir çocuğun, hırsızlık yaptığı anlaşılmasın diye
      kıyafetinin altına sakladığı tilki karnını deşip etini parçalarken, sadece
      'korkak ve hırsız' damgası yememek için yüzünde en ufak bir acı belirtisi
      göstermeden öylece durmasını sağlayan güç neydi? İrade mi? Evet, ama o
      iradeyi doğuran şey Sparta toplumunun o ezici beklentisiydi. Düşmanlarına
      esir düşen Kızılderililerin, akıl almaz işkenceler altında gülümsüyor
      olmasını salt bir 'istisna' veya 'doğaüstü bir güç' olarak açıklayamayız.
      O gülümsemenin arkasında, toplumun 'cesaret' mefhumuna yüklediği muazzam
      baskı yatar.


      Bunu bugünün modern dünyasına, hatta kendi hayatımıza uyarlayalım. Modern
      plazalarda, fabrikalarda sırf daha lüks yaşamak, bir statü sembolü elde
      etmek için insanların birbirini ezmesini sağlayan motor güç de bu kamuoyu
      baskısı değil midir? Beden eğitimi öğretmenleri bunu çok iyi bilir; bir
      yüzücü veya buz patencisi, kendisini izleyen bir kalabalık olduğunda,
      yalnızken sergilediği performansın çok üzerine çıkar. Payot burada harika
      ve çok samimi bir örnek veriyor: Kendi mahallenizde, tanıdıklarınızın
      arasında dilencilik yaptığınızı düşünün, bir de kılık değiştirip hiç
      kimsenin sizi tanımadığı uzak bir şehirde dilendiğinizi düşünün. Ya da
      üzerine giydiği kıyafetin yakışmadığını düşünen bir kadının sokakta
      yürürken çektiği o tarifsiz içsel acıyı hayal edin. Payot'nun kendi
      itirafıyla, üniversite yıllarında dirseklerine kadar inen bir şal giydiği
      için bütün gözlerin kendi üzerinde olduğunu sanıp acı çekmesi... Hepimiz
      başkalarının bakışlarının esiriyiz! Peki, madem davranışlarımız üzerinde
      böylesine 'despotik' ve korkunç bir etkisi olan bir güç var, biz bu gücü
      neden kendi irademizi terbiye etmek, başarıya ulaşmak için kullanmıyoruz?


      **Eğitim Sisteminin Büyük Çöküşü ve Hapisten Çıkan Öğrenci**


      İşte tam burada Payot, eğitim sistemini ve üniversite hocalarını adeta
      topa tutuyor. Lise yıllarında çocuk; öğretmenlerinin, ailesinin ve
      arkadaşlarının gözetimi altındadır. Ödevini yapmadığında azarlanır,
      başarılı olduğunda övülür. Yani o toplumsal baskı (dış kalkan) çocuğun
      etrafını sarmıştır. Ancak lise bitip de üniversiteye kapağı attığı an, o
      kalkan bir anda yok olur. Üniversite birinci sınıf öğrencisi, hapisten
      yeni çıkmış bir mahkumun o sersemletici, zehirli şaşkınlığını yaşar! Bütün
      baskılar bitmiştir! Bu sahte özgürlüğün sarhoşluğuyla genç, gece ikilere
      kadar barlarda, kafelerde sabahlamayı, dilediği gibi yaşamayı bir marifet
      sanır. Ailesi uzakta, hocası ise ulaşılmaz bir 'kürsüde'dir. Zayıf iradeli
      olanlar bu girdapta boğulur gider. Ancak zeki ve özellikle ekonomik olarak
      başarılı olmaya 'mecbur' olan dar gelirli öğrenciler, bu sahte
      sarhoşluktan çabuk ayılırlar. Çünkü onların kaybedecek zamanı yoktur.


      İşte bu noktada en büyük görev kime düşüyor biliyor musunuz? Üniversite
      profesörlerine! Ama ne yazık ki modern akademide (ve Fransa'daki
      yükseköğretimde) iğrenç ve canavarcasına bir anlayış hakimdir:
      *'Üniversite hocası lise öğretmeni gibi bir eğitimci değildir; o bir bilim
      insanıdır. Görevi sadece gerçeği araştırmaktır, öğrencinin ruhuna dokunmak
      değil.'* Payot bu fikre isyan eder. Eğer hoca sadece laboratuvarında
      araştırma yapsaydı bu doğru olabilirdi; ama o, her ay vezneden bir
      'öğretmen' maaşı almaktadır! Öyleyse gençlerin o yalnızlık ve çaresizlik
      anlarında onlara yön vermek zorundadır.


      Payot, hocaların öğrencilerin geçmişini, hayallerini, kaygılarını zerre
      kadar bilmediğinden yakınır. Oysa bir profesörün dudaklarından dökülecek
      ufak bir cesaretlendirme sözü, o yalnız gence dünyaları bahşedebilir.
      Alman filozof Fichte'nin öğrencileriyle kurduğu birebir temas sayesinde
      Alman gençliğini nasıl ayağa kaldırdığı; veya Fransa'da Lavisse'in başıboş
      gençleri bir araya toplayıp onlara hedefler vererek nasıl muazzam bir güç
      yarattığı bunun kanıtıdır. Eğitim, öğrencinin beynine tıka basa bilgi
      doldurmak, iğrenç bir ansiklopediyi yutmasını beklemek değildir. Bu
      ezberci 'loto' sistemi (ki tıp, fen veya hukuk müfredatlarına bakarsanız
      bunu görürsünüz) öğrenciyi bilimden iğrendirir.


      Gerçek bir hoca, tıpkı Sokrates'in Platon'a yaptığı gibi, öğrenciyle 'can
      cana' iletişim kurarak, ona bilgiyi değil 'çalışma metodunu' ve 'bilimsel
      eleştiri ahlakını' aşılayandır. Büyük dehalar (Newton veya Darwin)
      kafalarını lüzumsuz bilgilerle dolduran 'ayaklı sözlükler' değillerdi.
      Onlar, hedeflerine hizmet etmeyen her kitabı kenara iten, zihinlerindeki
      tohumu (fikri) otuz yıl boyunca özenle büyüten, bilgiyi filtreleyen gerçek
      savaşçılardı. Profesörün asıl övüncü, o muhteşem görünümlü, içi boş amfi
      dersleri değil; öğrencisiyle laboratuvarda, çalışma masasında birebir
      dirsek çürütüp onu ateşlemesidir.


      ### Bölüm 2: Büyük Üstatların Etkisi - Ölülerle Dostluk Kurmak


      Peki ya şanssızsak? Ya etrafımızdaki öğretmenler sadece maaşını alıp
      giden, vizyonsuz ve ruhsuz memurlardan ibaretse? Ya liseden sonraki o
      'hapisten çıkmış' özgürlük anımızda, bizi barlara ve kahvehanelere
      çekiştiren kalitesiz bir arkadaş grubunun ortasına düştüysek? Dış çevremiz
      adeta bir bataklıksa, irademizi besleyecek o dış desteği nereden
      bulacağız?


      Jules Payot’nun bu duruma bulduğu çözüm, ruhunuzu sarsacak cinsten: *Eğer
      yaşayanlar size yardım edemiyorsa, yüzünüzü ölülere dönün!* Evet dostum,
      doğru duydun. Hayatı, canlılardan çok daha iyi aktarabilen ölüler vardır.
      Onlar; kitapların raflarında sessizce bekleyen, tarihin gördüğü en büyük
      düşünürler, o muazzam 'büyük şahsiyetler ordusu'dur.


      Bunu sadece romantik bir tavsiye olarak düşünme. Payot, bu muazzam
      müttefiklerin insanın hayatını nasıl kurtardığını göstermek için efsanevi
      tarihçi Jules Michelet'nin o tüyler ürperten anısını bizimle paylaşır:
      Michelet, gençliğinde korkunç bir sefalet içindedir. Karamsarlığın dibe
      vurduğu, içindeki şüphelerin ve düşmanlarının onunla adeta alay ettiği,
      ateşin bile yanmadığı buz gibi soğuk bir odada, perşembe sabahıdır. Akşama
      eve ekmek girip girmeyeceği belli değildir. Her şey bitmiş, umut
      tükenmiştir. Genç adam, donmuş ellerine bakar, o çaresizlik anında birden
      içinde stoacı, sarsılmaz bir yaşam enerjisi, bir 'eril canlılık' hisseder.
      Soğuktan kaskatı kesilmiş elini, o meşe masasına var gücüyle, gururla
      vurur! Peki, her şeyin bittiği o buz gibi odada, o aç adamın içine o
      ateşi, o diriliş enerjisini kim koymuştur? Michelet bunu şöyle itiraf
      eder: *'Her gün beraber olduğum kişiler, yani en sevdiğim yazarlar! O
      muhteşem grup beni içine çekiyordu.'*


      İşte 'ölülerle dostluk' budur! Çevrendeki vasat, vizyonsuz insanların
      dedikodularından sıyrılıp, Marcus Aurelius, Seneca, Spinoza veya Sokrates
      ile masaya oturmaktır. John Stuart Mill'in babasının, oğlu zorluklarla baş
      etmeyi öğrensin diye yatağının başucuna özel kitaplar koyması boşuna
      değildir. Robinson Crusoe'nun o adadaki bitmek bilmez sabrı ve
      yaratıcılığı; Condorcet'nin anlattığı Turgot'nun hayatı veya Platon'un
      Sokrates'i... Düşünsene, üzerinden iki bin yıl geçmiş olmasına rağmen
      Sokrates'in o sarsılmaz iradesi, idamla yargılanırken bile hakikatten
      zerre taviz vermeyen o devasa ruhu, bugün hala gencecik bir öğrencinin
      damarlarındaki kanı kaynatabiliyor.


      Payot bu noktada modern eğitime çok ince ama can alıcı bir eleştiri
      getirir: *'Katolik Kilisesi'nin azizleri var. Peki ya bizim laik
      azizlerimiz nerede?'* Bir genç, Spinoza'nın eserlerini okuyup da evrendeki
      küçüklüğümüzü fark ederek o ilahi sükunete, o derin huzura nasıl kapılmaz?
      Modern eğitim sisteminin en büyük günahı, bize bu 'Yüzyılların en büyük
      şahsiyetlerinin' hayatlarını, onların irade savaşlarını anlatan başucu
      kitapları sunmamış olmasıdır. Klasik eğitimin amacı salt dilbilgisi
      kuralları öğretmek mi olmalıdır, yoksa o metinlerin arkasındaki devasa
      ruhların erdemini, sarsılmaz karakterini gençlere aşılamak mı?


      Bu yüzden, eğer etrafındaki kalabalıklar senin hedeflerine gülüyorsa,
      senin sabah erken kalkıp çalışmanı veya zihinsel gelişimini anlamıyorsa,
      hiç üzülme. Yalnız değilsin. Odanın kapısını kapat, kitabını aç ve
      insanlık tarihinin en asil, en yenilmez, en parlak zihinleriyle baş başa
      kal. Onlar seni asla yargılamaz, seni asla tembelliğe itmezler. Tam
      tersine, zayıf düştüğün her an, tıpkı Michelet'nin meşe masasına vurduğu
      gibi, senin de yumruğunu masaya vurmanı ve ayağa kalkmanı sağlarlar.


      **Sonuç:** Sonuç olarak, irade terbiyesi ne sadece içeriden dışarıya, ne
      de sadece dışarıdan içeriye doğru gelişen tek yönlü bir yoldur. İçsel
      tefekkürümüz ne kadar güçlü olursa olsun, etrafımızdaki rüzgarları
      (öğretmenler, arkadaşlar, sosyal baskı ve kitaplar) yelkenimize doldurmayı
      öğrenemezsek, yolculuğumuz bir eziyete dönüşür. Öğretmenlerimizi birer
      rehber yapmalı, vasatlıktan uzak durmalı ve en önemlisi, kütüphanemizdeki
      o 'büyük ruhların' fısıltılarını kendimize pusula yapmalıyız. Çünkü insan,
      en çok vakit geçirdiği beş kişinin ortalamasıdır; ve bu beş kişinin illa
      hayatta olması gerekmez!


      **Bu parçanın özü:** İrade her ne kadar bireysel bir içsel savaş gibi
      görünse de, aslında sosyal baskı, çevresel beklentiler ve entelektüel rol
      modelleri (örneğin kitaplar) tarafından şekillendirilen ve desteklenen
      sosyal bir olgudur.
  - baslik: Parça 4 · İç Kaynaklarımız — Tefekkür, Eylem, Beden
    icerik: >-
      *Jules Payot’dan iradenin makine dairesine yolculuk: Neden çok düşünüp az
      yapıyoruz? Küçük alışkanlıklar, nefes egzersizleri ve '15 dakikanın'
      mucizesi üzerine yüzyıllık bir rehber.*


      Sevgili dostum, irade terbiyesi serüvenimizde şu ana kadar hep
      düşmanlarımızı tanıdık. İsteksizliğin o sinsi doğasını, cinsel dürtülerin
      enerjimizi nasıl sömürdüğünü, kötü arkadaşların bizi nasıl zehirlediğini
      ve bahanelerimizin (sofizmlerin) zekamızı nasıl esir aldığını gördük. Dış
      dünyadan, yani öğretmenlerden ve ölümsüz üstatlardan (kitaplardan) nasıl
      destek alacağımızı da konuştuk. Ancak şimdi, kapıları dış dünyaya kapatıp
      kendi içimize, o devasa makine dairesine inme vakti geldi. Jules Payot,
      Dördüncü Kitap’ta bize eşsiz bir cephanelik sunuyor: İç Kaynaklarımız. Bu
      cephanelikte üç büyük silahımız var: Fikirleri duygularla birleştiren bir
      simya sanatı olan 'Tefekkür', bu simyayı gerçeğe dönüştüren 'Eylem' ve tüm
      bu sistemi ayakta tutan 'Beden Sağlığı'. Gelin, kendi iç dünyamızın mimarı
      olmaya, zihnimizi ve bedenimizi nasıl kusursuz bir uyumla
      çalıştıracağımıza adım adım, o harika tarihi anekdotlarla birlikte
      bakalım.


      ### Bölüm 1: Zihnin Simyası: Tefekkürün Gücü ve Yanılsamaların Yıkılışı


      Tefekkür (derin düşünme) kelimesi günümüzde o kadar yanlış anlaşılıyor ki,
      çoğu insan bunu boş boş 'hayal kurmak' veya bulutlara bakıp pembe rüyalara
      dalmak sanıyor. Oysa Payot'ya göre tefekkür, zihni rastlantısal
      sürüklenmelerden kurtarıp, belirli bir amaca yönelik olarak duygusal bir
      güç merkezi haline getirme sanatıdır. Eğitim sistemi bize 'bilgi' yükler;
      yani aklı donatır. Ancak tefekkür, aklı güçlendirir, gerçeği sadece
      bilmemizi değil, onu derinden hissetmemizi (sevmeyi veya ondan nefret
      etmeyi) sağlar.


      Bu süreci anlamak için Payot muazzam bir kimya analojisi kullanır:
      **Billurlaşma (Crystallization)**. Bir laboratuvarda, içinde binlerce
      molekül bulunan bir sıvının içine küçük bir kristal atarsanız, aynı türden
      moleküller garip bir çekim gücüyle o kristalin etrafında toplanmaya
      başlar. Eğer o kabı haftalarca, aylarca sükunet içinde, hiç kıpırdatmadan
      bırakırsanız, ortaya sarsılmaz, muhteşem bir kristal yapı çıkar. Ancak o
      kabı sürekli sallar, her gün içine çomak sokar ve karıştırırsanız, o
      kristal asla büyüyemez, cılız kalır. 


      İşte modern insanın zihni de o sürekli sallanan kaba benzer! İçimizde
      'çalışmalıyım, başarılı olmalıyım' diye zayıf bir fikir (kristal) doğar.
      Ancak biz sükunet içinde kalıp bu fikrin etrafına duygularımızı
      toplamasına izin vermeyiz. Her gün zihnimize yığınla gazete haberi, boş
      dedikodular, sosyal medyanın gürültüsü, kafelerdeki anlamsız muhabbetler
      dolar. Yatağından taşmış, şelaleden aşağı gürül gürül düşen bir nehrin o
      kulakları sağır eden gürültüsü içinde, o zayıf fikir kristalleşemeden
      parçalanır gider. Channing'in o vurucu sözünü hatırla: 'Afrika'nın ücra
      köşelerindeki ülkelerin bize yabancı olması gibi, bazı insanlar da kendi
      kendilerine yabancıdır.' Dışarıda o kadar çok yaşarız ki, kendi içimize
      bakmaya cesaretimiz bile kalmaz; rüzgarda savrulan, kendi yönünü tayin
      edemeyen yapraklar gibi sürükleniriz.


      İşte psikoloğun (yani kendi üzerimizde çalışırken bizzat bizim) görevi, bu
      laboratuvarı korumaya almaktır. Aklımızdan faydalı bir düşünce geçtiğinde
      onu yavaşlatmalı, uçup gitmesine engel olmalı, dikkatimizi ona vererek
      etrafında faydalı duyguların (kristallerin) toplanmasını sağlamalıyız.
      İşimize yaramayan, bizi zehirleyen düşünceleri ise zihnimizden söküp
      atmalıyız. Bunu yaparken dilin ve toplumun bize dayattığı o 'sahte'
      kelimelerden de kurtulmamız gerekir. Max Müller'in muazzam bir tespiti
      vardır: Kültürlü bir İngiliz üç ila dört bin kelimeyle düşünürken, büyük
      üstatlar on beş, yirmi bin kelime kullanır. Sıradan insan, kelimelerin
      içini toplumun önyargılarıyla doldurur. Örneğin 'Güç' dediğinizde sıradan
      bir insanın aklına Sezar, Napolyon, askeri ordular veya zorbalık gelir;
      ahlaki güç, irade veya sükunet gelmez. 'Mutluluk' deyince akla para, alkış
      ve şöhret gelir. 


      Toplumun bu 'velveleci' (çok gürültü çıkaran) adamları baş tacı etmesi,
      genci yanıltır. Oysa dünya tarihine yön verenler, çok bağırıp çağıran
      politikacılar değil, odasında sessizce tefekkür edenlerdir! Fransız
      kimyager Georges Ville'in tarım bilimi için buldukları veya o fakir,
      kapıcısının bile haline acıyarak güldüğü Andre Marie Ampere'in elektrik
      üzerine buluşları, insanlık tarihini Bismarck ve Moltke gibi savaş
      çığırtkanlarının toplamından çok daha fazla etkilemiştir. Ancak gürültü
      her zaman hakikati örter. İşte tefekkür, Platon'un mağara alegorisindeki o
      zincirleri kırıp, duvardaki gölgelere (toplumun yalanlarına) değil,
      dışarıdaki gerçek güneşe bakma, kendi öz fikrimizi inşa etme ve
      kararlarımızı (ister IV. Henri ister Napolyon gibi olsun) eyleme geçmeden
      önce o sükunet odasında (billurlaşma evresinde) alma sanatıdır.


      **Bu bölümün özü:** Tefekkür, zihnimizi dış dünyanın gürültüsünden ve
      zehirli kelimelerinden yalıtarak, zayıf fikirlerimizi duygularla besleyip
      sarsılmaz birer irade kristaline dönüştürme sanatıdır. Sessizce düşünen
      bir beyin, gürültü koparan binlerce politikacıdan daha büyük bir tarihsel
      güce sahiptir.


      ### Bölüm 2: Pratik Tefekkür Sanatı: Kelimelerin Ötesine Geçmek


      Peki tefekkür denen bu simyayı pratikte nasıl yapacağız? Dostum, en büyük
      düşmanımız yine kendi zihnimizin kolaya kaçmasıdır. Bizler genellikle
      detaylıca düşünmek yerine, işin kolayına kaçıp sadece 'kelimelerle'
      düşünürüz. 'Çalışırsam annem ve babam çok mutlu olur' deriz. Bu cümle o
      kadar soğuk, o kadar soyuttur ki, sabahın altısında o sıcacık yataktan
      çıkman için sana zerre kadar enerji vermez. Papağan gibi tekrarlanan bu
      kelimelerin hiçbir hükmü yoktur.


      Jules Payot, tefekkürün bir 'tiyatro sahnesi' kurmak olduğunu söyler.
      Zihnini bir yönetmen gibi kullanmalısın! Kelimenin ötesine geç ve o anı
      detaylarıyla yaşa: Çalıştığın, o sınavı geçtiğin veya o eseri yazdığın
      gün, babanın akşam yemeğinde dostlarına senden bahsederkenki o gururlu
      duruşunu, annenin yaz tatilindeki o içten ve huzurlu tebessümünü, küçük
      kız kardeşinin abisiyle/ablasıyla nasıl övündüğünü iliklerine kadar
      hisset! Bu zihinsel tablo (imge), o kuru kelimelerden bin kat daha fazla
      duygusal enerji üretir ve iradeni ateşler.


      Bu yöntem sadece iyi duyguları beslemek için değil, bizi zehirleyen
      alışkanlıkları yok etmek için de kullanılır. Kötü bir alışkanlığın
      zararlarını sadece 'bilmek' yetmez, ondan 'iğrenmek' gerekir. Payot,
      muazzam bir 'karabiber tanesi' analojisi yapar: Eğer bir karabiber
      tanesini çiğnemeden bütün olarak yutarsanız, dilinizde hiçbir acı tat
      bırakmaz. Ama onu dişlerinizle ezer, çiğnerseniz dilinizi yakar, sizi
      öksürtür ve gözlerinizi yaşartır. İşte tembelliğin veya şehvetin
      zararlarını yüzeysel olarak 'biliyorum zararlı' deyip geçiştirmek (yutmak)
      hiçbir işe yaramaz. Onları zihninizde uzun uzun 'çiğnemelisiniz'!
      Gençliğini barlarda heba ettikten sonraki o baş ağrısını, cüzdanındaki o
      boşluğu, yaşıtların kariyer basamaklarını çıkarken senin hissedeceğin o
      ezikliği ve çöküntüyü detaylarıyla hayal etmelisin ki, ruhun o eylemden
      gerçekten tiksinsin.


      Fenelon'un o vurucu kavun örneğini hatırla: Doktoru hastasına kavun yemeyi
      yasaklamıştır çünkü her yediğinde hastanın durumu ağırlaşmaktadır. Ancak
      hasta, ölüm korkusuyla kavunu kendisi yemese bile, masada başkalarının
      yemesinden haz alır, gidip onu koklar ve etrafında dolanır. İşte biz de
      tembelliğe veya bizi bozan ortamlara karşı böyle olmamalıyız! Sadece o
      eylemi yapmamak yetmez; o eylemi hatırlatan, bizi o ortama çeken 'her
      şeyden', o kavunun kokusundan bile nefret etmeliyiz. 


      Tolstoy'un sigara üzerine yaptığı o derin tespiti düşünelim: İnsanlar
      sigarayı fiziksel bir ihtiyaçtan çok, 'aklın derinliklerini uyuşturmak'
      için içerler. Çünkü bir şey üzerine derinlemesine kafa yormak zahmetlidir;
      tam o sırada sigara yakılır ve zihnin o keskin odağı sislerin içinde
      uyuşturulur. Sigaranın aklı nasıl uyuşturduğunu zihninde çiğnediğinde, o
      dumandan tiksinmeye başlarsın.


      Tefekkür anlarında, okulların açılmasından önceki tatil dönüşlerinde
      dağlarda, deniz kenarlarında (Alpler, Bretagne sahilleri) tek başına
      yapılacak yürüyüşler; sabah uyanır uyanmaz veya gece yarısı sessizliğinde
      zihnin başıboş kalmasına izin vermeden yapılacak zihinsel provalar hayati
      önem taşır. Kendi kendinize yüksek sesle konuşun, notlar alın, yazı yazın
      (çünkü yazı yazmak gözü, eli ve beyni aynı anda çalıştırarak düşünceyi
      sabitler). Bilincinize giren o zehirli ön yargıları (Örn: 'Paris'e
      gitmeden başaramam' yalanını) tefekkürünüzün o acımasız mahkemesinde
      yargılayın ve paramparça edin.


      **Bu bölümün özü:** Tefekkür, kelimelerin o soğuk hapishanesinden çıkıp
      hedefleri zihinde canlı, detaylı bir sinema filmi gibi izleme sanatıdır.
      Kötü alışkanlıkların zararlarını bir karabiber tanesi gibi çiğneyerek
      onlardan iğrenmeli, iyi hedeflerin sonuçlarını ise iliklerimize kadar
      hissederek (somutlaştırarak) irademizi ateşlemeliyiz.


      ### Bölüm 3: Eylemin Kutsallığı: Küçük Alışkanlıkların Devasa Gücü


      Tefekkür ettik, içimizdeki duyguları şahlandırdık, düşmandan tiksindik ve
      hedefe aşık olduk. Peki bitti mi? Hayır! Duygular, tıpkı yelkenleri
      şişirecek bir gemi bulamayıp boşlukta esip sönen rüzgarlar gibidir. Eğer
      içimizde uyandırdığımız o muazzam enerji, sıcağı sıcağına bir 'eyleme'
      (harekete) dönüşmezse, hiçbir işe yaramadan buharlaşıp gider. Zihinsel bir
      karar, fiziksel bir eylemle mühürlenmek zorundadır.


      Ancak eylem dediğimizde çoğumuzun aklına Mont-Blanc Dağı'na tırmanmak gibi
      devasa, kahramanca bir kerelik atılımlar gelir. Oysa doğanın baş
      muhasebecisi 'Zaman'dır ve onun hesabı küçük ama sürekli yatırımlarla
      tutulur. Payot, ünlü hatip Bossuet'nin sözünü hatırlatır: 'Ani çıkışların
      büyük düşüşleri olur. Mütevazı, küçük bir tohum gibi basit alışkanlıklar
      büyük davranışlara dönüşür.' (Qui spernit modica paulatim decidet - Küçük
      şeyleri küçümseyen, yavaş yavaş yok olur). Gerçek cesaret, savaş
      meydanında bir kez kılıç sallamak değil; sabahın yedisinde o yataktan
      fırlayıp Descartes veya Leibniz okumaktır! Tembellik yapma arzuna rağmen
      üşenmeyip o kalın sözlüğü raftan almak ve bilmediğin o tek kelimenin
      anlamına bakmaktır. İşte irade, bu sayısız, isimsiz ve tek başına anlamsız
      gibi görünen 'küçük zaferlerin' toplamıdır.


      Eğer bir arkadaşın, çalışma saatinde seni dışarı çağırıyorsa, o an
      içindeki o reddetme dürtüsünü hemen eyleme dök ve 'Hayır' de! Eve dönerken
      seni tembelliğe ve lüzumsuz harcamaya itecek o kafenin önünden geçmek
      zorundaysan, sırf iradeni eğitmek için karşı kaldırıma geç ve adımlarını
      hızlandır. Bu küçük kas hareketleri, zamanla beyninde sarsılmaz otobanlar
      (alışkanlıklar) inşa edecektir. Üstelik bir karar aldığında bunu çevrene
      (arkadaşlarına, ailene) duyur! İnsanın o 'başkalarının onayını alma ve
      rezil olmama' korkusu, seni o eylemi yapmaya mecbur bırakacak muazzam bir
      dış zırh oluşturur.


      Zaman konusunda kendimizi nasıl kandırdığımıza bir bakalım. Öğrenci hep
      'zamanım yok' der. Payot otuz saniyede o matematiği önümüze serer: Günde 8
      saat uyku, tuvalet/giyinme, yemek ve sindirim, ulaşım, birkaç mektup veya
      ziyaret derken (çalışan biri için bile) günün 16 saati uçar gider. Geriye
      tefekkür etmek, derinleşmek ve kendini inşa etmek için taş çatlasın 5
      saatin kalır! (Eğer boş laf yapıyorsan o da gider). Bu yüzden zamanın bir
      saniyesi bile kutsaldır. Darwin'in oğlunun babası hakkında anlattığı o
      anıyı hatırla: Darwin zamanın değerini öyle iyi bilirdi ki, 'işe başlamaya
      değmez' denilecek kısacık anları bile asla ziyan etmez, hemen bir şeyler
      okur veya not alırdı. Fransız hukukçu François d'Aguesseau, sırf karısının
      akşam yemeğini hazırlamasını beklerken geçen o lüzumsuz 'on beş dakikalar'
      içinde koskoca bir kitap yazmıştır! Çeyrek dakikaları (15 dakikaları)
      birleştirdiğinizde bir yılda nasıl devasa bir dağ (zaman) yarattığına
      inanamazsınız.


      Bu süreci yönetmenin en altın kuralı ise Romalılardan gelir: **Age Quod
      Agis (Yaptığın İşi Yap)**. Aynı anda birçok işle meşgul olmak, aslında
      hiçbir şey yapmamanın en sinsi kılıfıdır. François de Sales'in dediği
      gibi: 'Şeytan, hiçbirini bitiremeyip kendimizi kötü hissedelim diye bize
      aynı anda birçok iş yapmayı fısıldar.' Bir kitabı okurken aklın yazacağın
      makaledeyse, makale yazarken aklın diğer kitaptaysa zihnin paramparça
      olur. Hollandalı devlet adamı Johan de Witt'e, onca devlet işi arasında
      nasıl olup da eğlenmeye bile vakit bulabildiğini sorduklarında verdiği
      cevap tarihe geçmiştir: 'Çok basit; her şeyi sırayla yapıyorum ve ertesi
      güne iş bırakmıyorum!' 


      Lord Chesterfield oğluna sabah gardırobunu dizerken bile tek bir hamlede,
      zaman kaybetmeden sırayla yapmasını öğütler. Gerçi Romalı şair Horace'ın
      banyoda yıkanırken bile vakit kaybetmemek için kitap okuyup ıslatması
      biraz abartı olabilir, ancak felsefe aynıdır: Bir işe başladın mı, onu
      bitir! Jules Michelet, 30'lu yaşlarında ardı arkası kesilmeyen baş
      ağrılarından şikayetçiydi. Dostu Goncourt'a, artık aynı anda hem okuyup
      hem yazmayı bıraktığını, sadece 'yazmaya' (tek bir işe) odaklandığını ve
      ertesi sabah kalktığında tüm hastalıklarının ve baş ağrılarının mucizevi
      bir şekilde geçtiğini anlatır! Çünkü yarım bırakılan işler, zihinde askıda
      kalan sekmeler gibidir; beynin RAM'ini tüketir, insanı yorar ve çıldırtır.
      Biten bir iş ise beyne 'zafer' hissi verir ve onu dinlendirir.


      **Bu bölümün özü:** İrade, tek bir büyük kahramanlık değil; her gün
      sözlüğe bakmak, sabah aynı saatte kalkmak gibi küçük, mütevazı eylemlerin
      damla damla birikerek oluşturduğu bir okyanustur. 'Zamanım yok' yalanını
      çöpe atıp, 'Age quod agis' (Sadece yaptığın işi yap) kuralıyla çeyrek
      dakikaları bile birer esere dönüştürmek, irade sahibi insanın en büyük
      zaferidir.


      ### Bölüm 4: Fizyolojik Temel: İradenin Bedensel Kökleri ve Enerji
      Ekonomisi


      Buraya kadar zihnimizi ve alışkanlıklarımızı nasıl eğiteceğimizi konuştuk.
      Ancak Payot, antik bir Yunan tapınağının kapısına asılı olan 'Geometri
      bilmeyen giremez' yazısını irade eğitimine uyarlar: **'Sağlık kurallarına
      uymayan bu kapıdan giremez!'** Çünkü irade ve onun en keskin kılıcı olan
      'dikkat', tamamen sinir sistemimizin emrindedir. Eğer sinirleriniz
      zayıflamış, bedeniniz bitap düşmüş veya mideniz isyan etmişse, isterseniz
      dünyanın en derin felsefesini düşünün, o yataktan kalkacak iradeyi
      bulamazsınız. Ünlü biyolog Huxley'in ürpertici satranç analojisinde dediği
      gibi: Doğa, karşımızdaki acımasız ve sabırlı bir satranç ustasıdır.
      Yaptığınız hiçbir hatayı (sağlıksız beslenme, uykusuzluk, hareketsizlik)
      affetmez ve sizi o masada mat eder. Beden, akordu kusursuz yapılmış bir
      enstrüman gibi olmalıdır ki, zihin onun üzerinde o muazzam besteyi
      (iradeyi) çalabilsin.


      Peki bu bedeni nasıl akort edeceğiz? İlk ve en büyük savaş alanımız:
      **Beslenme (Mide)**. 


      Modern insanın (özellikle gençlerin ve zihnen çalışanların) en büyük
      hatası, ihtiyaç duyduklarından çok daha fazla yemek yemeleri, özellikle de
      proteini (azotlu besinleri) abartmalarıdır. Bilimsel olarak yetişkin bir
      insanın hücre yenilenmesi için günde yaklaşık 75 gram proteine (yaklaşık
      307 kalori) ihtiyacı vardır. Günlük toplam enerji ihtiyacımız
      (karbonhidrat ve yağlarla birlikte) 2800 ila 3400 kalori arasındadır.
      Ancak bizler, özellikle et tüketimini o kadar abartıyoruz ki, bu ihtiyaç
      fazlası protein vücutta albümin birikmesine ve organların yorulmasına
      neden oluyor. 


      Bir düşünün! Bağırsaklarımızı düz bir zemine yaysak yaklaşık 5
      metrekarelik bir alan kaplar. Midenin asit salgılaması, peristaltik
      (kasılma) hareketleri, pankreasın çırpınışı... Tüm bu sindirim sistemi, o
      devasa porsiyonları öğütmek için vücudunuzdaki enerjinin yarısını sömürür!
      Mideniz tıka basa doluyken kan başınıza hücum eder, ayaklarınız üşür ve
      üzerinize bir ağırlık çöker. İşte o ağırlık, iradenizin ölümüdür.
      Beyninizin o ince fikirleri işlemesi gereken enerji, midenizde o lüzumsuz
      lokmaları öğütmek için harcanmaktadır. Öğün sayınız önemli değildir, ancak
      porsiyon miktarınız ve besin dengeniz (protein-karbonhidrat-yağ)
      iradenizin kaderini belirler.


      İkinci büyük silahımız: **Oksijen ve Nefes Jimnastiği**.


      Eğitim sistemimizin o havasız, pis kokulu amfileri ve gençlerin kapalı
      odalarda, soba/kalorifer dibinde uyuşarak saatlerce oturması beyni
      zehirler. Zihnen çalışan kişinin temiz havaya bir madenci kadar ihtiyacı
      vardır. Sağır ve dilsiz insanların, konuşarak akciğerlerini
      çalıştırmadıkları için, önlerindeki mumu bile söndüremeyecek kadar cılız
      ciğerlere sahip olmaları tesadüf müdür? 


      Masa başında kambur durarak çalışmak, göğüs kafesini daraltır ve beyne
      giden oksijeni keser. Fransız hekim M. Lagrange'ın ısrarla önerdiği 'Nefes
      Jimnastiği' hayat kurtarıcıdır: Sabah kalktığınızda pencereyi açın,
      kollarınızı yavaşça yanlara açarak yukarı kaldırın, ayak uçlarınızda
      (büyümeye çalışır gibi) yükselin ve ciğerlerinizi o temiz havayla
      doldurun. Bu basit esneme ve nefes alma işlemi, akciğerlerin dibinde
      büzüşmüş, oksijen gitmeyen o minik vezikülleri (kesecikleri) açar,
      omurgayı dikleştirir. Antoine Lavoisier'in ta 1789'da kanıtladığı gibi,
      kas egzersizi yapan bir beden, dinlenme halindekinden üç kat daha fazla
      oksijen tüketir. Paul Bert'in muazzam tespitiyle; kaslar sadece birer et
      yığını değil, karbonik asidi atan ve oksijeni vücuda sabitleyen 'yardımcı
      solunum organlarıdır'!


      Ancak sporu yanlış anlıyoruz. Payot, o dönem Fransa'da çok moda olan,
      öğrencileri kas yığınına çeviren abartılı İngiliz atletik eğitim sistemini
      sertçe eleştirir. Wilkie Collins ve Matthew Arnold gibi akıllı
      İngilizlerin bile kendi sistemlerini eleştirip bu spor tutkunlarını
      'barbarlar ve zevksizler' olarak nitelendirdiğini hatırlatır. Zihinsel
      çalışan bir gencin ihtiyacı olan şey, boyun ve baş bölgesini tehlikeye
      atan, bedeni bitap düşüren o ağır vücut geliştirme (veya İngiliz tipi ağır
      atletizm) değildir. Bizim örnek almamız gereken, bedeni aşırı yormadan
      sağlıklı ve esnek tutmayı amaçlayan ölçülü 'İsveç jimnastik sistemidir'.
      Unutma: Sinir sistemi tek bir havuza bağlıdır. Enerjini devasa kaslar
      yapmak için halterlere (veya ağır idmanlara) harcarsan, zihinsel üretime
      (iradeye) bütçe kalmaz. Büyük buluşlar, insanlık tarihini değiştiren
      zaferler Pasteur'ün, Ampere'in, Malebranche'ın beyniyle kazanılmıştır; kas
      yığınlarıyla değil. En kaslı insan bile bir gorili dövemez, bir atı
      geçemez. Bizi insan yapan ve üstün kılan şey zekamızdır; spor bizi
      hayvanlaştırmak için değil, zihnimizi oksijenle yıkamak için bir araç
      olmalıdır.


      Son olarak: **Aktif Dinlenme ve Uyku**. 


      Dinlenmek, tembellik yapmak demek değildir. Sanat eleştirmeni John
      Ruskin'in enfes bir lafı vardır: 'Hak edilmiş dinlenme, öküzün ahırda
      geviş getirmesi değildir.' Gerçek dinlenme, aktif olandır. Hareketsiz
      oyunlar (kağıt oyunları vb.) bedeni yorar. Bunun yerine bahçe işleri
      yapın, marangozlukla uğraşın, yazın yüzün, kışın buz pateni yapın. Nehirde
      kürek çekin. Tatillerde sırt çantanızı alıp Voj dağlarında veya Alplerde
      uzun yürüyüşlere çıkın. 


      Zihinsel bir konuyu çalışırken takıldınız mı? Oturup başınızı ellerinizin
      arasına alıp kendinize eziyet etmeyin. Çıkın, ormanda veya deniz kenarında
      (Lorraine ormanları veya Akdeniz kıyıları) yürüyün. Payot, en iyi
      fikirlerinin o yürüyüşlerde geldiğini; John Stuart Mill'in 'Mantık' isimli
      o devasa eserini, Hindistan bürosuna yürüyerek gidip gelirken zihninde
      yazdığını söyler. Rodolphe Töpffer'in dediği gibi: 'Bilgiyi masada
      alırsın, ama onu yürüyerek, doğayı izleyerek öğütür ve hayata geçirirsin.'


      Peki ya uyku? Uyku en verimli dinlenmedir ancak onu da zehir etmemek
      gerekir. Akşam saat 4'ten sonra vücut ısısı düşer ve alınan ağır gıdalar
      kanda birikir. Beyin yavaşlar. Gece yarısı saatlerce çalışıp kendini
      zorlamak, ertesi günün tüm enerjisini çöpe atmaktır. Gece 12'yi asla
      geçmeyin. Öte yandan sabahları çok aşırı erken (örneğin sabah 4-5 gibi)
      kalkmak da çözüm olmayabilir. Payot, bir fırıncının evinde kalırken her
      gün sabah 5'te uyanmak zorunda kaldığında, o saatteki çalışmasının verimli
      olduğunu ama günün geri kalanında nasıl bir 'zombi' gibi halsiz
      dolaştığını itiraf eder. Önemli olan uykuyu yeteri kadar almak,
      uyandığında yatakta miskinlik yapmamak ve günün o 'berrak' saatlerini
      ocağa (çalışmaya) odun atmak için kullanmaktır.


      **Bu bölümün özü:** İrade ve dikkat, midenin ve akciğerlerin doğrudan
      kölesidir. Aşırı et tüketiminden kaçınıp mideyi hafifletmeden, doğru nefes
      jimnastiği ve yürüyüşlerle bedeni oksijene boğmadan ve abartılı vücut
      sporları (kas inşası) yerine aktif zihinsel dinlenmeyi seçmeden o muazzam
      irade kalesini inşa etmek fizyolojik olarak imkansızdır.


      **Sonuç:** Dördüncü Kitap'ın sonuna geldiğimizde anlıyoruz ki, irade
      terbiyesi aslında bir 'kendini gerçekleştirme' mühendisliğidir. Dış
      dünyanın gürültüsünden tefekkürle korunmak, o sükunette yeşeren fikirleri
      'Age quod agis' kuralıyla küçük ama yıkılmaz eylemlere dönüştürmek ve bu
      muazzam sistemi, doğru beslenen, oksijene doymuş bir bedenle şaha
      kaldırmak... Tüm bu iç kaynaklar, doğanın o acımasız satranç masasında
      bizi mat olmaktan kurtaracak ve kendi hayatımızın ustası yapacak o
      kusursuz üçlü ittifaktır.


      **Bu parçanın özü:** İrade sadece 'istemekle' değil; düşüncelerin
      duygularla beslenip tefekkür (billurlaşma) yoluyla güçlendirilmesi, bu
      gücün anında küçük ve düzenli eylemlere dökülerek alışkanlığa
      dönüştürülmesi ve tüm bu sürecin kusursuz işleyen, sağlıklı bir bedensel
      makine ile desteklenmesiyle inşa edilir.
  - baslik: Parça 5 · İrade Psikolojisi — Aklın Zaferi
    icerik: >-
      *Doğru olanı biliyoruz ama neden yapamıyoruz? İrade Terbiyesi'nin muazzam
      finali: Düşüncenin güçsüzlüğü, duyguların diktatörlüğü ve aklın o sinsi,
      muhteşem zaferi.*


      Dostum, geldik yolculuğumuzun en can alıcı, en sarsıcı noktasına. Buraya
      kadar tembelliği tanımladık, şehvetle savaştık, çevrenin rüzgarını
      yelkenimize doldurmayı öğrendik ve tefekkürün laboratuvarına girdik. Ancak
      hepimizin kalbinin derinliklerinde kanayan o kadim yara hala duruyor:
      *'Neden doğru olanı bildiğim halde yapamıyorum?'* Neden sigaranın zararlı
      olduğunu zihnimin en ince kıvrımlarına kadar bildiğim halde o pakete
      uzanıyorum? Neden sınavın veya o büyük projenin hayatımı kurtaracağını
      adım gibi bildiğim halde yataktan çıkamıyorum? Jules Payot, *İrade
      Terbiyesi*’nin Beşinci ve son kitabı olan *İrade Psikolojisi*’nde, bizi
      işte bu acı verici paradoksla yüzleştiriyor. Hazırsan, zihnimizin o
      karanlık makine dairesine iniyoruz. Filozofların yüzyıllardır tartıştığı
      'akıl mı, duygu mu?' savaşının anatomisini çıkaracak ve sana o zayıf, o
      cılız mantığın, devasa ve vahşi duyguları nasıl dize getirdiğinin sırrını
      vereceğiz.


      ### Bölüm 1: Entellektüel Bir Yanılsama - Düşüncelerin Tek Başına
      Güçsüzlüğü


      Biz insanlar, özellikle de eğitimli olanlarımız, çok büyük bir
      yanılsamanın kurbanıyızdır: Fikirlerin dünyayı değiştirebileceğini
      sanırız. Fransız düşünür Alfred Fouillée'nin o ünlü 'güçlü düşünceler'
      teorisini hatırla. Fouillée, güçlü bir düşüncenin tek başına insanı
      harekete geçireceğini savunuyordu. Ancak Payot, bu entelektüel kibri bir
      balyoz gibi parçalar: *'Düşünce tek başına bir hiçtir; o, ancak bir
      duyguyla birleştiğinde güce dönüşür!'*


      Bunu anlamak için psikolog Théodule-Armand Ribot'nun o sarsıcı klinik
      vakalarına bir göz atalım. Ribot, beyni kusursuz çalışan ama duygusal
      merkezleri tamamen hissizleşmiş hastaları inceler. Bu hastalar her şeyi
      bilir, anlar, mantık yürütür. Ama önlerine imzalamaları gereken hayat
      memat meselesi bir belge koyduğunuzda, ellerini kaldırıp o imzayı
      atamazlar. Çünkü harekete geçiren o 'istek (duygu)' motoru bozulmuştur.
      Aksine, yine Ribot'nun anlattığı başka bir vakada; bedeni felçli,
      arabasında kımıldamadan yatan bir adam, arabasının tekerleği yoldan geçen
      bir kadını ezmek üzereyken duyduğu o muazzam panik ve dehşet hissiyle
      (duyguyla) bir anda arabasından dışarı fırlar! İşte dostum, kaslarımıza
      emir veren, bizi yatağımızdan fırlatan şey soğuk, steril mantığımız değil;
      sıcak, yakıcı ve evcilleşmemiş duygularımızdır.


      Kendi hayatlarımıza bakalım. Molière'in ünlü Cimri'si (Harpagon)
      karakterine gülüp geçen bir cimri düşünün; kendi halini o sahnede görür,
      mantıken anlar ama zerre kadar değişmez. Ya da alkolikleri ele alalım. Bir
      alkolik, o kadehi dikerken karaciğerinin iflas edeceğini, ailesinin
      dağılacağını mantıken bilmez mi? Bal gibi bilir. Peki neden duramaz? Çünkü
      o bilgi, o 'düşünce' henüz 'acı (duygu)' haline gelmemiştir. Ne zaman ki
      ilk alkol komasına girer, ciğerlerinde o cehennem ateşini hisseder ve
      sokaklarda sefalet içinde kalır; işte o zaman *'Bilseydim!'* diye feryat
      eder. Oysa biliyordu! Eksik olan bilgi değil, ızdırabın o somut, o yakıcı
      duygusuydu.


      Payot bu durumu kendi yaşadığı muazzam bir anıyla anlatır. Bir gün Alp
      Dağları'nda, Buet kasabası yakınlarında, sonu görünmeyen karlı ve dik bir
      uçurumdan aşağı kaymaya başlar. Saniyelerce aşağı sürüklenir. O an bilinci
      tamamen açıktır: 'Ölebilirim, tehlikedeyim' diye düşünür. Zihni kusursuz
      bir şekilde durumu analiz eder. Yüz metre sürüklendikten sonra bir şekilde
      kayalıklara tutunur ve durur. Batonuna yaslanıp ayağa kalkar. İşte tam o
      anda, tehlike geçmişken, birdenbire kalbi yerinden çıkacak gibi atmaya
      başlar, soğuk terler döker, dizlerinin bağı çözülür ve şiddetli bir
      titreme nöbetine girer. Neden mi? Çünkü o ana kadar sadece soğuk bir
      'tehlike düşüncesi' olan şey, o saniyede bir 'korku duygusuna'
      dönüşmüştür!


      Ölüm düşüncesini ele alalım. Hepimiz öleceğimizi biliriz. Ama bu bilgi
      öylesine soyut, öylesine soğuktur ki günlük hayatımızda zerre kadar etki
      yaratmaz. Hırsla, egoizmle saldırmaya devam ederiz. Ta ki, Charles
      Dickens'ın *Oliver Twist* adlı romanında anlattığı o muazzam sahneye
      kadar: İdama mahkum edilmiş bir suçlu, mahkeme salonunda yargıcın ağzından
      dökülen o soğuk 'idam' kelimelerini dinlerken aslında hiçbir şey
      hissetmez. Fakat gözü tesadüfen mahkeme kürsüsünün parmaklıklarına kayar;
      parmaklıklardan birinin ucu kırıktır. Suçlu bir an, 'Acaba bunu tamir
      ederler mi?' diye düşünür. Ve işte o absürt saniyede, kendisinin o kırık
      parmaklığın tamir edildiğini göremeyecek kadar ölüme yakın olduğu *hissi*
      şimşek gibi beynine çakar! O saniyede titremeye, dehşet içinde terlemeye
      başlar. Düşünce, duyguya dönüşmüş ve bedeni esir almıştır.


      **Çağrışım Yasası (Law of Association) ve Kelimelerin Büyüsü**

      Peki biz, bu soğuk düşünceleri nasıl duygulara bağlayacağız? Psikolojinin
      o muazzam silahı olan 'Çağrışım Yasası' ile! Zihnimizdeki fikirler,
      zincirleme bir reaksiyonla birbirine bağlıdır. Payot Korsika'da, Bastia
      iskelesinde gezerken bir fabrikanın düdüğü öter. O düdük sesi, eski
      vapurların sesine o kadar benzemektedir ki, Payot'nun zihninde bir anda
      denizin, dağların ve geçmiş yılların o muazzam coşkusu (duygusu) canlanır.
      Sadece bir ses, koskoca bir hatıra ve duygu zincirini tetiklemiştir.


      İrade terbiyesinde yapmamız gereken şey, kendi zihnimizde bu 'fabrika
      düdüklerini' bilinçli olarak kurmaktır! Çalışmak istemediğinde, o soğuk
      'çalışmalıyım' fikrini al; onu annenin gururla gülümsemesi, babanın
      arkadaşlarına seni anlatırken hissettiği o göğüs kabarması gibi sıcak,
      yakıcı ve somut duygularla lehimle! Dahası, bu çağrışımı güçlendirmek için
      kelimelerin o dört boyutlu büyüsünü kullan: Oku, yüksek sesle telaffuz et,
      duy ve yaz! Yazmak; beyni, gözü ve kasları (motor imge) aynı anda
      çalıştırdığı için, o zayıf düşünceyi beyninize çelik halatlarla bağlar.


      **Bu bölümün özü:** Entelektüel bilgi ve soğuk mantık, insanı harekete
      geçirmek için tek başına tamamen etkisizdir. İrade; ancak ve ancak, o kuru
      düşüncelerin, 'çağrışım yasası' ve zihinsel provalar kullanılarak sıcak,
      sarsıcı ve gerçek duygularla lehimlenmesiyle ateşlenen bir motordur.


      ### Bölüm 2: Diktatörün Anatomisi - Duygusal Hallerin Despotizmi


      Fikirlerin ne kadar zayıf olduğunu anladığımıza göre, şimdi o tahtta
      oturan gerçek diktatöre, 'Duygulara' yakından bakalım. Duygularımız, tıpkı
      Beethoven’ın o aheste, ağır ama ihtişamlı bestelerine benzer. Yüzeyde
      hangi notalar çalarsa çalsın, derinden derine sürekli tekrar eden,
      ruhumuzu esir alan o temel, bas bir ezgi vardır. İnsanoğlunun en ilkel
      hali 'acı'dan kaçma ve 'haz'za ulaşma eğilimidir. Tüm kaslarımız,
      sinirlerimiz nesiller boyunca atalarımızdan bize bu tepkilerle
      kodlanmıştır. Yani bizler, irademizin dışında işleyen devasa bir
      fizyolojik determinizmin (belirlenimciliğin) mirasçılarıyız.


      Duyguların gücü o kadar dehşet vericidir ki, sadece kaslarımızı değil,
      gerçeklik algımızı da büsbütün bozarlar. Molière'in *Misanthrope*
      (İnsandan Kaçan) eserini düşünün. Aşık bir adam, sevdiği kadının o soluk
      ve hastalıklı yüzüne baktığında ne görür? Kusuru mu? Asla! 'Yasemin
      çiçeğinin o muhteşem beyazlığını' görür! Karanlık ve korkutucu bir orman,
      aşıkların gözünde 'sevimli bir sığınak' gibi görünür. Gece yarısı tek
      başına yolda yürürken içine 'korku' duygusu düşen bir adamın zihni,
      rüzgarda hışırdayan sıradan bir yaprak sesini, kendisine doğru koşan bir
      katilin ayak sesleri olarak çevirir. Duygu, gerçeği kovar ve yerine kendi
      uydurduğu halüsinasyonu koyar.


      Daha da kötüsü, bu kaba ve güçlü duygular, içimizdeki o ince, naif ve
      gerçek hisleri de ezer geçer. Modern toplumun en büyük hastalığı olan 'El
      alem ne der?' (Kamuoyu) baskısı, bizi içi boş birer kuklaya çevirmez mi?
      En acılı anlarımızda bile toplumun bizden beklediği o 'makbul' hüznü
      takınırız. Gerçek hislerimizin üzerine, toplumun diktiği o yalan duvarı
      çekeriz. Akıl denen kraliçe, tahtında oturup süslü nutuklar atan ama
      ülkesinde (bedeninde) hiçbir hükmü geçmeyen sembolik bir figürdür sadece.
      Zeka, duyguların ona dikte ettiği kararları onaylamak, o kararlara
      mantıklı kılıflar bulmak için çırpınan bir avukattan farksızdır.


      İşte tam bu yüzden, Stuart Mill çok haklı olarak, 'Kendi nefsine hakim
      olmanın en büyük koşulu, güçlü bir duygusallığa sahip olmaktır' der.
      Dünyayı yerinden oynatanlar, o soğukkanlı, hesap kitap yapan ruhsuzlar
      değildir. En tutkulu, kalbi en şiddetli çarpan insanlar; o tutkuyu 'görev'
      ve 'irade' bilincine kanalize ettiklerinde, tarihin gördüğü en sarsılmaz
      irade kahramanlarına dönüşürler. Spinoza veya Pascal, o derin felsefi
      sistemleri sırf zekaları çok parlak olduğu için kurmadılar. Onlar,
      evrendeki hiçliğimizi, Tanrı'nın o muazzam gücünü iliklerine kadar, yakıcı
      bir şekilde 'hissettiler'. Ancak o zaman, o soğuk matematiksel felsefe
      alev aldı ve dünyayı aydınlattı.


      Toplumları yönlendiren de duygulardır, fikirler değil! Sözde dinine çok
      bağlı ama içi fesatlık (kıskançlık duygusu) dolu bir burjuva kadınının,
      ayinden çıkar çıkmaz arkadaşının kuyusunu kazdığını görmez miyiz? Veya
      insan haklarından, eşitlikten dem vuran (fikir) bir politikacının, üstü
      başı kirli bir garibanla aynı odada kaldığında hissettiği o tiksinti
      (duygu) yüzünden odayı nasıl terk etmek istediğine şahit olmaz mıyız?
      Corneille'in *Caius Gracchus* trajedisinde, anaçlık gibi dünyanın en ilkel
      ve en güçlü içgüdüsü olan evlat sevgisinin bile, 'vatanseverlik' gibi daha
      yüksek bir alevle (duyguyla) nasıl yer değiştirebildiğini ve bir annenin
      (Cornélie) vatan için evladını nasıl feda edebildiğini okuruz. 'Seven adam
      için hiçbir şey yorucu değildir' (Qui amat non laborat) sözü, psikolojinin
      temel yasasıdır.


      Fakat bu yasada bizi dehşete düşüren, irademizi felç eden fizyolojik bir
      pranga vardır. Bir uyaranla karşılaştığımızda, iç organlarımız otonom
      (bizden bağımsız) olarak tepki verir. Karşıdan bir köpek havlayarak
      üzerinize koştuğunda, beyniniz daha durumu analiz etmeden kalbiniz deli
      gibi atmaya, bağırsaklarınız kasılmaya, solunumunuz hızlanmaya başlar.
      Ünlü biyolog Huxley'nin dediği gibi; doğa, kuralları acımasızca işleyen
      sabırlı bir satranç ustasıdır ve bizler onun taşlarıyız. O his geldiğinde,
      organlara 'Dur!' diyemezsiniz.


      Payot bu çaresizliği kendi babalık tecrübesiyle, tüyler ürperten bir
      dürüstlükle anlatır: Bir sabah, çocuğunun komşuda olmadığını, muhtemelen
      evlerinin yanından geçen nehrin kenarında oynamaya gittiğini öğrenir. O
      saniyede zihni ona, 'Korkma, muhtemelen başka bir yerdedir, mantıklı ol'
      der. Akıl devrededir. Ancak beden? Beden isyan etmiştir! Kalbi göğüs
      kafesini kıracak gibi atar, saç dipleri diken diken olur, elleri titrer,
      midesine kramplar girer. Akıl o korkuyu reddetse de, bedendeki o vahşi
      fizyolojik fırtına dinmez. Yarım saat sonra çocuk sapasağlam bulunur! Her
      şey yolundadır. Peki duygu biter mi? Hayır! Kalp atışları hemen normale
      dönmez. O bedende biriken enerji, o öfke, bu kez yer değiştirmek için
      çırpınır ve masum bakıcıya patlamak, onu azarlamak ister. Bedenin o
      fizyolojik ataleti, mantığın ne dediğini zerre kadar umursamaz!


      İşte durum budur. Organlarımıza ve bu vahşi duygulara doğrudan müdahale
      edemeyiz. O halde savaş bitti mi? Teslim mi olmalıyız?


      **Bu bölümün özü:** Duygularımız; algılarımızı bozan, mantığımızı susturan
      ve kalp atışı, sindirim gibi doğrudan müdahale edemeyeceğimiz fizyolojik
      tepkilerle bedenimizi esir alan vahşi diktatörlerdir. Eğer insan sadece
      bugünü yaşayan bir canlı olsaydı, o vahşi duyguların karşısında aklın
      savaşı tamamen umutsuz ve kaybedilmiş bir vaka olurdu.


      ### Bölüm 3: Aklın Dolaylı Zaferi - İrade ve Strateji Sanatı


      Eğer doğrudan kalbimize, midemize, o ani yükselen öfkeye veya şehvete
      'Dur!' diyemiyorsak, aklın bu savaşta hiçbir rolü yok mu? Kaderimize boyun
      eğip içgüdülerimizin esiri mi olacağız? Hayır dostum! Akıl, zayıftır ama
      inanılmaz derecede sinsi, kurnaz ve stratejiktir! Aklın, elinde doğrudan
      kılıç olmasa da, onun en büyük müttefiki 'Zaman'dır. Akıl, cephe
      savaşından kaçıp, düşmanı arka yollardan kuşatan dahi bir komutan gibidir.


      **Birinci Strateji: Kasların Yönetimi (Duygunun Dışa Vurumunu Boğmak)**

      Aklımız iç organlarımıza hükmedemez; doğru. Kalbimi yavaşlatamam. Ama
      aklım 'Çizgili Kaslarıma' hükmedebilir! Koluma, bacağıma, yüz kaslarıma
      emir verebilirim. Psikolojinin evrensel kuralı şudur: Duygu ve o duygunun
      dışa vurumu (beden dili) ayrılmaz bir bütündür. Biri zayıflarsa diğeri de
      yok olur. Pascal ve Cizvit tarikatının kurucusu Ignatius de Loyola bu
      sırrı yüzyıllar önce keşfetmişti: *'İçinde o inancı, o duyguyu hissetmiyor
      musun? O zaman inanıyormuş gibi diz çök, dua ediyormuş gibi kaslarını
      hareket ettir; duygu peşinden gelecektir.'* Aynı şekilde felsefeci
      Dugald-Stewart, dostu Burke'ün sırf yüzünü ve kaslarını kızgın bir adamın
      şekline sokarak gerçekten nasıl öfke krizine girebildiğini anlatır.
      Katolik cenaze törenlerinin o ağır, kasvetli ritüelleri (kas ve beden
      hareketleri), en inançsız insanı bile ağlatacak bir duygu durumuna sokar.


      Madem kasları hareket ettirmek duyguyu doğuruyor; o halde kasları
      'durdurmak' da duyguyu öldürür! Öfkeden delirmek üzere misin? Yumrukların
      sıkılıyor, dişlerin gıcırdıyor, nefesin hızlanıyor. Akıl işte tam o an
      devreye girmeli! Antik Roma'daki o meşhur komut gibi: *'Quos ego!'* (Şimdi
      size gösteririm / Kendinize gelin!). Akıl kaslara emir verir:
      *'Yumruklarını gevşet! Yüz kaslarını serbest bırak! Zorla da olsa gülümse!
      Derin nefes al!'* O an kalbin hala hızlı atıyor olabilir ama dışarıdaki o
      fiziksel ablukayı, o motor tepkiyi kestiğin an, içerideki o öfke veya
      şehvet ateşi havasız kalıp sönmeye mahkumdur.


      **İkinci Strateji: Kılavuz Balığı Öldürmek (Bahaneleri Çürütmek)**

      Tüm tutkular kördür. Köpek balıklarının gözleri iyi görmez, koku
      alamazlar. O devasa canavarların hedefini bulması için, onların önüne
      düşüp onlara yol gösteren küçük 'kılavuz balıklara' ihtiyaçları vardır.
      İşte şehvet, tembellik, egoizm gibi devasa tutkuların kılavuz balıkları da
      aklın ürettiği **'bahanelerdir (illüzyonlardır)'**. Tutku, zekayı rehin
      alır ve kendini haklı çıkarmak için ona yalanlar uydurtur. Bir despot,
      halkı sömürdüğünü kabul etmez; 'Onlar kendi kendilerini yönetemeyecek
      kadar cahil' bahanesini uydurur.


      Beaumarchais'nin *Figaro'nun Düğünü* eserindeki o ergen, içi içine
      sığmayan Cherubin'i hatırla. Şehvetten gözü dönmüş haldedir: *'Ah! O bir
      kadın! O bir kız! O bir kadın!'* diye kendi kendine parklarda aşk nidaları
      atar. Karşısına o an Marceline çıkar. Akıl o an bir büyüteç görevi
      görmelidir! Eğer Cherubin bir an durup mantığıyla Marceline'in o yaşlı,
      çirkin ve budala gerçekliğine yakından baksaydı, içindeki o şehvet ateşi
      bir anda iğrenmeye dönüşüp sönecekti. İşte akıl, tutkunun dayandığı o
      illüzyonu, o 'kılavuz balığı' gerçekle yüzleştirerek öldürür.


      Peki ama insan, kendi kendine yalan söyleyerek (iradi bir yalanla) kendini
      ikna edebilir mi? Evet! Filozof Leibniz'in o sinsi stratejisine kulak
      verelim: İki seçenek arasında kaldığında, avantajlı gördüğün tarafın 'iyi'
      özelliklerine o kadar çok odaklan ki, diğer tarafın varlığını zihninden
      sil! Bir genç, evleneceği kadının ailesinde geçmişte karanlık işler
      olduğunu duyduğunda ne yapar? Bunu araştırmayı reddeder! Çünkü o kızı
      istiyordur. Gözünü o gerçeğe kapatır ve zamanla o gerçek zihninde yok
      olur. Zira hafızanın en büyük kuralı şudur: *Üzerinde düşünülmeyen, dikkat
      verilmeyen her hatıra ve düşünce ölmeye, silinmeye mahkumdur.* Akıl,
      tehlikeli düşünceleri beslemeyi reddederek onları açlıktan öldürebilir.


      **Üçüncü Strateji: Taktiksel Geri Çekilme ve Düşmanı Yormak**

      Bazen düşman (duygu) o kadar büyüktür ki, doğrudan saldırmak intihardır.
      Fırtına patladığında gemiyi dalgaların üzerine süremezsin. İçinde o feci
      şehvet arzusu veya korkunç bir tembellik hissi uyandığında, akıl hemen bir
      'taktiksel geri çekilme' (uzlaşma) başlatmalıdır. Doğrudan savaşma! Oturup
      da 'Bunu yapmamalıyım, bu günah, bu tembellik' diye düşünmek bile o
      fırtınayı besler. 


      Bunun yerine kalk! Odanı havalandır. Yüksek sesle bir şeyler oku. Seyahat
      kitapları karıştır. Hemen bir arkadaşını ziyarete git. Konuş, yürü,
      zihnini fiziksel olarak başka bir rotaya sok! Düşmanı yor. Hevesi geçene,
      fırtına dinene kadar bekle. Ve işin en güzel tarafı nedir biliyor musun?
      Bazen bu savaşlarda yenilmek bile muazzam bir silahtır! O gün tembelliğe
      veya arzularına yenik mi düştün? İş bittikten sonra ağzında kalan o iğrenç
      tadı, o vicdan azabını, o fizyolojik çöküntüyü ve zihinsel boşluğu al; onu
      zihninde bir karabiber tanesi gibi tekrar tekrar çiğne! O iğrenme
      duygusunu öyle bir büyüt ki, bir dahaki sefere düşman kapıya dayandığında
      elindeki en büyük silahın o 'mide bulantısı' olsun.


      Sonuç olarak dostum, irademizi terbiye etmek, granit bir kayayı oymak
      demek değildir. Kötü davranışların tuğlalarını tek tek çekip, yerlerine
      iyi alışkanlıkların tuğlalarını koyma sanatıdır. Milli eğitim müfredatının
      bize sadece ezber bilgi yükleyip, bu 'kendine hakim olma' sanatını asla
      öğretmemesi insanlık adına büyük bir cinayettir. Gerçek başarı, gerçek
      mutluluk; dış dünyayı fethetmekte değil, içimizdeki o vahşi hayvanı aklın
      ve zamanın o kurnaz ittifakıyla ehlileştirip, muazzam bir iç huzura ve
      çalışma ahlakına kavuşmaktadır.


      **Bu bölümün özü:** Akıl, içimizdeki vahşi ve deterministik duygularla yüz
      yüze savaşacak güce sahip değildir. Ancak akıl; bedenin kaslarına
      dışarıdan hükmederek, tutkuların dayandığı bahaneleri yok ederek ve
      'zaman'ı kullanarak dikkatini başka yöne kaydırmak suretiyle, o vahşi
      düşmanı aç bırakıp dolaylı ama kesin bir zafer kazanır.


      **Sonuç:** Beşinci Kitap'ın son satırlarını okuduğumuzda, Jules Payot'nun
      *İrade Terbiyesi* aslında bize şunu haykırıyor: Bizler, içgüdülerin,
      hormonların ve toplumun görünmez ipleriyle oynatılan birer kuklayız.
      Ancak, bu prangaların nasıl çalıştığını—çağrışım yasalarını, kaslarımızın
      duygulara etkisini, bahanelerimizin sahteliğini—öğrendiğimiz an, o ipleri
      kesip kendi kaderimizin ustası olabiliriz. İrade, sihirli bir düğme değil;
      sabır, zaman ve aklın kurnazca kullanıldığı stratejik bir şaheserdir.


      **Bu parçanın özü:** İrade, salt aklın diktatörlüğü ile değil; aklın
      zayıflığını kabul edip, 'duyguların' o muazzam ateşini kendi lehine
      kullanarak (çağrışım ve kas yönetimiyle) elde edilen stratejik ve dolaylı
      bir zaferdir.
