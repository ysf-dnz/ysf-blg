  - baslik: Kitabın Yapısı ve Yol Haritası
    icerik: |-
      Parça A: Öğrenmenin ve Hafızanın Temelleri (Bölüm 1-2) Bu parça, öğrenmenin gerçekleşmesi için gereken biyolojik ve psikolojik önkoşulları inceler.
      ### Bölüm 1: Öğrenmek İçin Verimli Koşullar: İnsanın dikkat süresinin kısa olmasından dolayı öğrenme sürecinin ufak seanslara bölünmesi ve dinlenme sürelerinin hesaba katılması gerekir
      . Ezberlemek yerine bilginin altında yatan kavramları öğrenmek ve zorluklarla yüzleşerek "yaratıcı başarısızlık" sürecinden geçmek, bilgiyi beynimize kalıcı bir şekilde kazır
      .
      ### Bölüm 2: Hafızada Tutma: Hafıza; kodlama, saklama ve çıkarma evrelerinden oluşur ve beynin doğal unutma eğrisiyle başa çıkmak için sürekli tekrar şarttır
      . Bilgiyi pasif bir şekilde zihne doldurmaktansa, bilgi kartları (flashcards) gibi araçlarla hiçbir ipucu olmadan "bilgi çıkarma alıştırması" yapmak, hafızayı geliştirmenin en etkili yoludur
      .
      Parça B: Stratejik Uygulamalar ve Aktif Öğrenme (Bölüm 3-4) Bu parça, bilgiyi uzun süreli hafızaya almak için kullanılması gereken en etkili ve kanıtlanmış çalışma tekniklerini barındırır.
      ### Bölüm 3: Aktif Öğrenme Teknikleri: Özetleme veya metin vurgulama gibi pasif teknikler yerine zihni aktif olarak sürece dahil eden detaylı sorgulama, kendi kendine açıklama (Feynman Tekniği) ve dönüşümlü çalışma teknikleri kullanılmalıdır
      . Bu teknikler, kavramları sorgulamanızı ve farklı bilgiler arasında güçlü köprüler kurmanızı sağlayarak ezberin ötesinde derin bir anlayış yaratır
      .
      ### Bölüm 4: Yığmadan, Aralıklı Tekrarlama: Çalışma süresini uzatmaktansa tekrarların sıklığına odaklanan "aralıklı çalışma", bilgileri kısa süreli hafızadan uzun süreli hafızaya aktarmanın en verimli yoludur
      . Son dakika ezberi yapmanın kaçınılmaz olduğu durumlarda bile aralıklı çalışmayı taklit etmek, bilgi kartları ve nimonik (hafıza geliştirme) akrostişler kullanarak bilgiyi büyük parçalar halinde kodlamak hız kazandırır
      .
      Parça C: Motivasyon ve Doğru Zihniyet (Bölüm 5-6) Bu parça, öğrenmeyi baltalayan psikolojik engelleri ve zihinsel hataları nasıl aşacağımızı, öğrenmeyi nasıl eğlenceli hale getireceğimizi gösterir.
      ### Bölüm 5: Öğrenmeyi İkinci Plana Atın: Öğrenmeyi kendi başına sıkıcı bir zorunluluk olarak görmek yerine, onu daha büyük ve motive edici bir hedefin parçası haline getirerek ikinci plana atmak süreci hızlandırır
      . Rozetler, seviye atlama veya sosyal rekabet gibi oyunlaştırma stratejileri, beynin görev zorluğunu unutup doğrudan başarıya ve gelişime odaklanmasını sağlar
      .
      ### Bölüm 6: Öğrenirken Yapılan Hatalar: Sabit fikirli olmak yerine, çaba ve azimle zekânın gelişebileceğine inanan "gelişime açık bir tavır" benimsemek, engelleri ve eleştirileri birer fırsat olarak görmenizi sağlar
      . Ayrıca, herkesin tek bir sabit "öğrenme tarzı" olduğu yanılgısına düşmemek ve Cornell Yöntemi gibi sistemlerle not alırken zihinsel çaba sarf etmek, bilgiyi kişiselleştirerek kalıcı kılar
      .
      Parça D: Ustalaşma ve Bilgiyi Aktarma (Bölüm 7-8) Bu parça, bir konuyu basitçe öğrenmenin ötesine geçip uzmanlık seviyesine ulaşmayı ve bilgiyi başkalarına öğreterek pekiştirmeyi hedefler.
      ### Bölüm 7: Uzmanlık Oluşturmak: Herhangi bir alanda usta olmak, sadece saatlerce alıştırma yapmayı değil; hataları tespit eden ve zayıf yönleri hedefleyen "planlı çalışma" yapmayı gerektirir
      . Dreyfus Modeli ile mevcut yetenek seviyenizi belirlemek ve Pareto Prensibi (80/20 kuralı) sayesinde sonuçların %80'ini getiren en kritik %20'lik bilgiye odaklanmak, uzmanlığa giden yolu radikal bir biçimde kısaltır
      .
      ### Bölüm 8: Öğrenmeyi Öğretmek: Öğrenme piramidine göre, bilgiyi başkalarına öğretmek, sürece en yüksek katılımı sağlayan ve öğrenmeyi %90 oranında kalıcı kılan en aktif yöntemdir
      . Öğretme esnasında sorulan stratejik sorular ve dürüst geribildirimler sayesinde kişi kendi bilgi boşluklarını keşfeder; üstelik "çırak etkisi" motivasyonuyla, başkasına faydalı olabilmek için konuları çok daha derinden öğrenir
      .
      Parça E: Sürdürülebilir Başarı (Bölüm 9) Bu parça, anlık öğrenme hedeflerinden ziyade, hayat boyu devam edecek otomatik bilişsel alışkanlıklar oluşturmayı kapsar.
      ### Bölüm 9: Öğrenme Alışkanlıkları: Başarılı öğrenme; motivasyonun düştüğü ve hayal kırıklığı yaşandığı anlarda bile hedefe bağlı kalmayı sağlayan kararlılık ile dürtüleri kontrol etme alışkanlıklarına dayanır
      . Esnek düşünerek farklı bakış açıları geliştirmek, öğrenilenleri daima sorgulayıp kalitesini test etmek ve soyut kavramları basitleştirmek için metaforlar kullanmak zihni her koşulda öğrenmeye hazır tutar
      .
  - baslik: Parça A · Öğrenmenin ve Hafızanın Temelleri (Bölüm 1-2)
    icerik: |-
      Harika bir başlangıç! Gel seninle kitabın bu ilk iki bölümünü, yazarın argümanlarını adım adım takip ederek, sanki karşılıklı kahve içiyormuşuz gibi ama konunun ciddiyetini ve bilimsel ağırlığını hiç kaybetmeden, derinlemesine yeniden anlatalım. Kitaptaki hiçbir detayı, örneği veya vaka çalışmasını atlamadan, bu kavramların zihnimizde tam olarak oturmasını sağlayacağız.
      ### Bölüm 1: Öğrenmek İçin Verimli Koşullar
      Öğrenme sürecini genellikle doğduğumuz andan itibaren üzerinde hiçbir kontrolümüz olmayan, pasif bir eylem gibi düşünürüz
      . Okul yıllarında hepimiz, öğretmenin bize sunduğu bilgi akışının karşısında duran birer "priz" gibiydik; bilgiyi alır ve sınavlarda ne kadarını kusursuzca geri verebildiğimizle ölçülürdük
      . Ancak yazarın da üstüne basarak söylediği gibi, öğrenmek sadece izleyip kontrol edemeyeceğimiz otomatik bir süreç kesinlikle değildir
      . Aksine, beynimizin bir kapasitesi, öğrenme yeteneğimizi kısıtlayan ya da artıran iç ve dış faktörler vardır
      . Çölde kayak yapmayı öğrenemeyeceğin gibi, zihnini doğru koşullara hazırlamadan da verimli öğrenemezsin
      .
      Dikkat Süresi ve Zamanın Yönetimi Yazarın ilk iddia ettiği şey, insan dikkatinin sandığımızdan çok daha kırılgan olduğudur
      . Bunu anlamak için çok çarpıcı bir örnek veriyor: 2006 yılından beri hayatımızda olan TED (Teknoloji Gösterileri ve Dizaynı) konuşmaları
      . Neden dünyanın en ilham verici liderleri sahnede sadece 18 dakika konuşuyor? TED küratörü Chris Anderson’ın dediği gibi, bu süre bir konuyu ciddiyetle ele almak için yeterince uzun, ancak insanların dikkatini kaybetmeden dinleyebilmeleri için yeterince kısadır
      . Hollywood filmleri 150 dakikaya kadar çıkabilir (2016'da filmlerin yarısı 2 saat veya daha kısaydı), ancak film izlemek görsel bir şölen olduğu için pasif bir eylemdir ve beyin ekstra enerji harcamaz
      . TED konuşmaları ise sahnede tek bir kişinin fikirlerini aktardığı son derece aktif, yoğun ve katılım gerektiren bir süreçtir; bu yüzden kısa olmak zorundadır
      .
      İşte tam bu noktada veriler can sıkıcı bir gerçeği yüzümüze vuruyor: Sağlıklı bir yetişkinin ortalama dikkat süresi sadece 15 dakikadır
      . Hatta Microsoft'un yaptığı bir araştırma, anlık konsantrasyon süremizin (attention span) ortalama 8.25 saniyeye kadar düştüğünü iddia ediyor; yani 9 saniye boyunca odaklanabilen bir Japon balığından bile daha kötü durumdayız!
       Bu durum, beynin bir noktada yorulup kendini sıfırlamak için aralara ihtiyaç duymasına neden oluyor
      .
      Peki buna çözüm ne? Louisiana Eyalet Üniversitesi'nden (LSU) Ellen Dunn’a göre, yeni bir şeyler öğrenmek için ideal süre 30 ile 50 dakika arasıdır
      . 30 dakikadan azı verimsiz, 50 dakikadan fazlası ise beynin tek seferde kaldırabileceğinden çok daha ağır bir yüktür; bu yüzden her seans arasına 5-10 dakikalık molalar konulmalıdır
      . Yazar bunu 1950'lerde William Dement ve Nathaniel Kleitmann'ın keşfettiği biyolojik ritimlerle de destekliyor. İnsan bedeni, uyanıkken de uykudayken de 90 dakikalık döngüler halinde, yani gün içi ritimle (ultradian rhythm) çalışır
      . Bu ritim uyarılma ile başlar, zirveye çıkar ve sonra strese geriler. Büyük 24 saatlik günlük ritmin (circadian rhythm) içinde bu 90 dakikalık periyotları anlamak, günümüzü planlamak için harika bir rehberdir
      .
      Kısacası yazarın buradaki sonucu şudur: Öğrenmeyi uzun saatlere yaymak yerine kısa süreli periyotlara bölmelisin
      . Uzun süreli planlamada kendini "sabah çayırkuşu" mu yoksa "gece baykuşu" mu olarak tanımladığına göre takvimini ayarlamalı, seanslarını ise LSU'nun önerdiği gibi 30-50 dakika arasında ya da Pomodoro tekniğindeki gibi (25 dakika çalışma, 5 dakika mola) küçük parçalara (chunking) ayırmalısın
      . Zihnimizin bir çocuktan veya Japon balığından farksız olduğunu kabul etmek süreci yönetmenin ilk adımıdır
      .
      Gerçeklerden Önce Kavramları Anlamak Yazarın ikinci büyük argümanı, ezberlemenin (sadece gerçekleri zihne yığmanın) işe yaramadığıdır. Araştırmacı Roger Säljö'nün 1979'da belirttiği gibi, öğrenmeyi yüzeysel öğrenme (surface learning) ve derinlemesine öğrenme (deep learning) olarak ikiye ayırabiliriz
      . Yüzeysel öğrenme sadece bilgi edinme ve ezberdir; derinlemesine öğrenme ise anlam çıkarma ve kavramaktır
      . Bazen 30 rastgele nesneyi hatırlamak için ezber yapmak iyidir, ancak karmaşık konularda ezber, gerçekleri birbirinden kopuk, izole adacıklar halinde zihne hapseder ve kısa süreli hafızadan hızla silinip gitmelerine neden olur
      .
      Yazar bunu harika bir örnekle açıklıyor: ABD'deki "Miranda (susma) hakkı" tarihini çalışıyorsun diyelim
      . Eğer sadece davacıların isimlerini, tarihleri, Yüksek Mahkeme yargıçlarını ve oy sayılarını ezberlersen, bu bilgilerin hiçbir anlamı olmaz
      . Ancak büyük kavramlara (concept learning / kavram öğrenimi) odaklanırsan iş değişir
      . Yani savunma makamının hakları, polis prosedürleri gibi çatı kavramları anladığında, altındaki detaylar bir yapbozun parçaları gibi yerini bulur ve hatta tarihleri/olayları tahmin bile edebilirsin
      .
      Günlük hayattan çok tanıdık analojiler de var: Makarna sosu yaparken sadece tarifi (önce soğan, sonra sarımsak) ezberlersen sadece o yemeği yaparsın
      . Ama soğanı kavurmanın "tat tabanı oluşturduğunu", kaynatmanın "malzemeleri dağıttığını" ve dinlendirmenin "tatları bağladığını" kavramsal olarak anlarsan, çorba, acı sos veya yahni de yapabilirsin
      . Vergilerin mantığını anlayan bir işletme sahibi, ritmin nasıl çalıştığını bilen bir müzisyen, genel stratejiyi anlayan bir satranç oyuncusu ya da sıcak/soğuk suyun renklere etkisini bilen bir kuru temizlemeci; hepsi ezberin ötesine geçip kavramı öğrenmiştir
      . Ayrıca sezgisel öğrenme (heuristic learning) sayesinde, dünyadaki önyargılarımızı (örneğin bir doğum günü partisinde nasıl davranılır, cenazede nasıl davranılır) yeni bilgileri kategorize etmek için kullanabiliriz
      .
      Yaratıcı Başarısızlık: Hüsranı Kucaklamak Öğrenme söz konusu olduğunda en büyük yanılgımız, zorlanmayı veya başarısızlığı kötü bir şey sanmamızdır
      . Yazar, Singapur Ulusal Eğitim Enstitüsü'nden Manu Kapur’un "yaratıcı başarısızlık" (productive failure) kavramını anlatıyor
      . Öğrenciye en başta her şeyi hazır verip elinden tutmak aslında en iyi yol değildir
      . Kapur'un deneyinde öğrencilere zor problemler verilir; birinci gruba öğretmen yardım eder, ikinci gruba ise hiçbir yardım verilmez
      . Tahmin edeceğin gibi öğretmen destekli grup soruları çözer, diğer grup bocalayıp çözemez
      . Ancak asıl sihir sonraki testte ortaya çıkar: Kendi başlarına debelenip başarısız olan grup, problemin kökünü, doğasını ve olası çözümlerin yapısını öylesine derinlemesine analiz etmiştir ki, yeni bir testte öğretmen destekli grubu açık ara farkla yenerler!
       Kapur buna "gizli fayda" diyor
      .
      Kapur'un yaratıcı başarısızlık için üç şartı var: 1) Zorlayan ama tamamen pes ettirmeyen problemler seçmek, 2) Kendi süreçlerini açıklama fırsatı vermek, 3) İyi ve kötü çözümleri kıyaslamaya izin vermek
      . Bu durum çocuk yetiştirmede "aşırı ebeveynlik" (over-parenting) yapanların (Queensland Teknoloji Üniversitesi'nden Judith Locke'un çalışması) çocuklarını korurken aslında onların problem çözme yetilerini nasıl sakatladığına benziyor
      . Biz de kendimize böyle yapıyoruz! Hemen sonuca ulaşmak istiyoruz.
      Peki bunu nasıl lehimize çeviririz? Öncelikle zihnimizi "büyüme moduna" (growth mode) sokmalıyız; yani amacın sadece mükemmel sonuç değil, yeni bilgiler edinmek olduğunu kabullenmeliyiz
      . Sonrasında, sürecimizi tıpkı bir şefin tarifi ya da bir dedektifin kanıtları incelemesi gibi resmî belgelerle (log defteri/günlük) kayıt altına almalıyız
      . Bahçene sebze ektiğinde ekinler ölüyorsa, notlarına bakıp toprağı mı yanlış seçtiğini yoksa bitkileri çok mu yakın ektiğini bulabilirsin; satış hedeflerini tutturamıyorsan ses tonunu mu yoksa ağını mı (networking) geliştirmen gerektiğini analiz edebilirsin
      . Son olarak, pes etme noktasına geleceğini baştan kabullenmeli ve bu hüsranı hissettiğinde sorundan uzaklaşıp objektifliğini geri kazanmak için molalar planlamalısın
      .
      Bu bölümün özü: İnsan dikkati inanılmaz derecede kısadır; bu yüzden öğrenmeyi beynin biyolojik ritimlerine uygun ufak seanslara (30-50 dakika) bölmek ve sık sık mola vermek şarttır. Ayrıca, bilgileri izole gerçekler halinde ezberlemek yerine arkasındaki kapsayıcı kavramları anlamaya çalışmalı ve süreçte karşılaşacağın zorlanma ve başarısızlıkları, bilgiyi zihnine kalıcı olarak kazıyan "yaratıcı" bir fırsat olarak kucaklamalısın
      .
      ### Bölüm 2: Hafızada Tutma
      Öğrenmek dediğimiz şey aslında beynimizdeki sinirsel bağlantıları değiştirme sanatıdır
      . Eğer yeni edindiğin bir bilgiyi, o an geldiğinde hafızanın derinliklerinden çekip çıkaramıyorsan, maalesef öğrenme gerçekleşmemiş demektir
      . Yazar burada hafızayı bir depo, öğrenmeyi de bu depoyu doldurma ve düzenleme işlemi olarak ele alıyor. Hafızanın çalışması üç temel adımdan oluşuyor:
      Kodlama (Encoding): Bilginin duyularımız (gözümüz, kulağımız vb.) aracılığıyla bilincimize girmesidir
      . Bir kafede çalan müziğe dikkat etmeden oturmak bilinçaltı bir kodlamayken, odaklanarak okumak bilinçli bir kodlamadır
      . Kodlama aşamasında ne kadar dikkat ve odaklanma sarf edersen, bilgi kısa süreli hafızadan uzun süreli hafızanın kapılarına o kadar yaklaşır; örneğin pasifçe TV izlerken kodlama çok zayıftır
      .
      Saklama (Storage): Bilgi duyularımızdan geçtikten sonra üç farklı depodan birine gider: duyusal hafıza, kısa süreli hafıza ve uzun süreli hafıza
      . Sınava çalıştığın bir geceyi düşün; bilgiyi duyusal hafızadan çıkarıp, en azından ertesi güne kadar kalması için kısa süreli ile uzun süreli hafıza arasında bir yere (belirsiz bir bölgeye) zorla itersin
      . Bu genellikle sadece soluk bir iz bırakır
      .
      Çıkarma (Retrieval): Bu adım anılarımızı asıl kullandığımız, yani "öğrendim" dediğimiz kısımdır
      . Bir ipucuyla veya aniden bilgiyi geri getirebilmektir
      .
      Unutmanın Doğası ve Hatırlama Yolları Yazar çok rahatlatıcı bir gerçeğin altını çiziyor: Unutmak aslında bilgiyi kafanın içinde bulamaman değil, o bilginin en başında beynine yeterince güçlü gömülmemiş olması, yani saklama evresindeki bir başarısızlıktır
      . Hafızayı ortaya çıkarmanın (geri çağırmanın) üç yolu vardır:
      Hatırlama (Recall): En güçlü ve en zor olanıdır. Hiçbir dış ipucu olmadan, boş bir kâğıda dünyadaki tüm başkentleri yazabilmek gibidir
      . Ciddi bir tekrar ve önem atfetme gerektirir
      .
      Anımsama (Recognition): Bir ipucu yardımıyla bilgiyi bulmaktır. Dünyanın tüm başkentlerini sayamazsın belki ama baş harflerini veya kafiyeli bir kelime duyduğunda tak diye bulursun
      . Nimonik (hafıza geliştirici) yöntemler tamamen bu anımsama prensibine dayanır
      .
      Yeniden Öğrenme (Relearning): En zayıf formdur. Bir konuya aşina olduğunu sanırsın ama kitabı açtığında pazartesi 30 dakika, salı 15 dakika harcayarak aslında onu tekrar baştan öğrenirsin. Yani bilgi, uzun süreli hafıza duvarını aşamamıştır
      .
      Bu süreçteki en büyük baş belamız, psikolog Hermann Ebbinghaus'un meşhur ettiği "Unutma Eğrisi"dir (Forgetting Curve)
      . Ebbinghaus'un grafiğine göre, pazartesi günü Fransız Devrimi hakkında bir şey okursan, dört gün sonra yarısını, bir hafta sonra ise sadece %30'unu hatırlarsın
      . Eğer hiçbir tekrar yapmazsan elde kalan sadece %10'dur!
       Ancak bilgiyi düzenli aralıklarla gözden geçirirsen, unutma eğrisi yavaşça düzleşir, yatay bir çizgi halini alır ve hafızada tutma oranı %100'e geri sıçrar
      . Unutma hızını yavaşlatan iki şey vardır: bilginin kişisel olarak taşıdığı önem (ne kadar güçlü olduğu) ve tekrar etme sıklığı
      . O yüzden yazar, kendimize en azından günlük hayatta "anımsama" (recognition) hedefini koymamızı öneriyor; örneğin bir şarkının sözlerini sıfırdan söyleyemesen bile melodiyi duyunca eşlik edebilmek gibi
      .
      En Güçlü Silahımız: Bilgi Çıkarma Alıştırması Öğrenmeyi hep beynimize dışarıdan bilgi "doldurmak" olarak algılarız; hoca anlatır, biz not alırız
      . Bu tamamen pasif bir biriktirmedir
      . Hızlı öğrenmenin gerçek sırrı ise aktif olmaktan, yani edindiğimiz bilgiyi beynimizin dışına "çıkarmaktan" geçer
      . Buna "Bilgi Çıkarma Alıştırması" (Retrieval Practice) deniyor
      .
      Bu tekniğin gücünü kanıtlayan harika bir deney var: Araştırmacı Pooja Agarwal, 2011 yılında ortaokul sosyal bilgiler öğrencilerini tam bir buçuk yıl boyunca gözlemliyor
      . Öğretmen dersini normal şekilde işlemeye devam ederken, araştırmacılar işlenen konuların üçte birini kapsayan habersiz, düzenli testler (bilgi çıkarma alıştırması) uyguluyorlar
      . Hatta öğretmenin haberi olmasın ve soruları sızdırmasın diye test sırasında onu sınıftan çıkarıyorlar
      . Sonuçlar inanılmaz! Ünite sonu sınavlarında, öğrenciler sadece bu habersiz testlerde karşılaştıkları (üçte birlik kısımdaki) sorularda, diğer konulara kıyasla tam bir harf notu daha yüksek başarı gösteriyorlar
      . Üstelik Agarwal, görsel veya çoktan seçmeli sorulardansa (anımsama), sıfırdan hatırlama (recall) gerektiren zorlu soruların hafızayı çok daha güçlü bir şekilde geliştirdiğini kanıtlıyor
      . Beyni zorlayarak bilgiyi çağırmak, pasifçe not okumaktan fersah fersah daha etkilidir
      .
      Bilgi Kartları (Flashcards) ve Doğru Kullanımı Bilgi çıkarma alıştırmasının en popüler aracı bilgi kartlarıdır
      . Kartın önünde soru/resim, arkasında cevap vardır
      . Ancak birçok öğrenci bunu bile pasif kullanır: Karta bakar, cevabı bildiğini içinden geçirir ve kartı çevirir
      . Yazarın uyarısı çok net: Bu, alıştırma değildir! Birkaç saniye beklemek, beyni gerçekten zorlamak ve kartı çevirmeden önce cevabı "sesli" olarak söylemek zorundasın
      .
      Hatta yazar Rachel Adragna'nın çok yaratıcı bir "İnteraktif Bilgi Kartı" sistemini öneriyor
      . Klasik ön/arka kart setini bitirdikten sonra, kendini daha da zorlamak için ikinci bir "talimat" destesi hazırlayabilirsin
      . Diyelim ki bir kavramı öğrendin, talimat destesinden bir kart çekiyorsun:
      "Bu kavramı sade Türkçe ile tekrar yaz."
      "Bu kavramı sahneleyen bir film ya da roman senaryosu yaz."
      "Bu kavramı gerçek hayatta yaşanabilecek bir olayı tarif etmek için kullan."
      "Bu kavramın zıttını tanımla."
      "Bu kavramın bir resmini çiz."
      Bu interaktif yaklaşım sayesinde bilgi sadece ezberlenmiş bir cümle olmaktan çıkıyor, gerçek hayatta karşılığı olan, farklı yönlerden bağlantılar kurulmuş, kırılmaz bir anıya dönüşüyor
      .
      Bu bölümün özü: Öğrenmek sadece bilgiyi kodlamak değil, onu uzun süreli hafızada saklamak ve zamanın yıkıcı "unutma eğrisiyle" savaşarak bilgiyi geri çağırabilmektir. Bilgiyi pasif bir şekilde tekrar tekrar okumak yerine; beyninizi ipuçları olmadan bilgiyi hatırlamaya zorlayan aktif "bilgi çıkarma alıştırmaları" (özellikle yüksek sesle uygulanan interaktif bilgi kartları) kullanmak, hafızanızı bir süngere çevirmenin en bilimsel yoludur
      .
  - baslik: Parça B · Stratejik Uygulamalar ve Aktif Öğrenme (Bölüm 3-4)
    icerik: |-
      Harika bir ilerleme kaydediyoruz! Şimdi seninle kitabın en can alıcı, o "nasıl çalışmalıyım" sorusuna tam olarak cevap veren Parça B'sine (Bölüm 3 ve 4) dalıyoruz. Bu bölümlerde yazar, yıllardır doğru bildiğimiz yanlışları yüzümüze vuruyor ve yerine bilimsel olarak kanıtlanmış, beynimizi adeta bir bilgi süngerine çevirecek stratejiler koyuyor. Çayını veya kahveni tazele, çünkü bu yöntemler çalışma hayatını tamamen değiştirecek.
      ### Bölüm 3: Aktif Öğrenme Teknikleri
      Öğrenme sürecini genellikle bir metni okumak ve onu zihnimize kazımaya çalışmak olarak düşünürüz. Ancak yazarın iddia ettiği çok çarpıcı bir gerçek var: Bugüne kadar okullarda bize öğretilen veya kendi kendimize keşfettiğimiz çalışma yöntemlerinin birçoğu aslında koca bir zaman kaybı!
      Doğru Bildiğimiz Yanlışlar: 5 Zayıf Teknik Araştırmacı John Dunlosky ve ekibi 2013 yılında, öğrencilerin en çok kullandığı 10 farklı öğrenme tekniğini inceleyen devasa bir araştırma yapıyor
      . Amaç, hangi tekniğin gerçekten uzun süreli hafızaya katkı sağladığını bulmak
      . Dunlosky'nin ekibinin sonuçlarına göre, öğrencilerin en popüler bulduğu ve adeta vazgeçilmezi olan 5 teknik, "düşük faydalı" yani verimsiz olarak etiketleniyor
      ! Bakalım neymiş bunlar:
      Özetleme (Summarization): Bir metnin ana hatlarını çıkarmak mantıklı görünse de, öğrenciler özel bir eğitim almadıkları sürece metnin içindeki gereksiz detaylarda boğulup asıl fikri kaçırıyorlar
      . Yani teoride iyi ama pratikte çoğumuz bunu yanlış yapıyoruz
      .
      Vurgulama (Highlighting): Hepimizin elinden o fosforlu kalemler geçmiştir, değil mi? Metnin altını veya üstünü rengarenk çizmek... Ancak araştırmacılar, aşırı zor bir metin olmadığı sürece vurgulamanın öğrenmeyi aslında azalttığını söylüyor
      . Neden mi? Çünkü fosforlu kalemle çizmek, sana bilgiyi anladığın gibi sahte bir özgüven (illusion of competence) veriyor ama aslında o bilgiler zihninde bağlantısız, izole adacıklar olarak kalıyor
      . Arabanın motoru bozukken üstünü cilalamak gibi!
      Hafıza Geliştirme (Mnemonic Techniques): "Fıstıkçı Şahap" gibi akrostişler anahtar kelimeleri hatırlamak için harikadır ama derinlemesine öğrenme ve kavramları anlama konusunda uzun vadede çok zayıftır
      .
      Görsel Kullanımı (Visual Imagery for Text): Okunan metni zihinde veya kâğıt üzerinde resmetmek soyut bir yöntem olsa da, faydası sadece görsel hatırlama testleriyle sınırlı kalıyor
      .
      Tekrar Okuma (Rereading): Sınavdan önceki gece notları tekrar tekrar okumak evrensel bir gelenektir. Ancak Dunlosky, eğer bu okumalar arasında uzun zaman aralıkları yoksa bunun neredeyse hiçbir işe yaramadığını söylüyor
      . Sadece konuya "aşina" oluyorsun ama derinlemesine bir anlayış kazanmıyorsun
      .
      Peki Ne İşe Yarıyor? En Etkili 3 Aktif Teknik Madem pasif yöntemler işe yaramıyor, o zaman zihnimizi aktif olarak sürece dahil etmeliyiz
      . Dunlosky'nin "yüksek ve ortalama faydalı" bulduğu tekniklerden Alıştırma Sınavları'nı (Bilgi Çıkarma) önceki bölümde konuşmuştuk, Aralıklı Çalışma'yı ise bir sonraki bölümde ele alacağız
      . Geriye ustalaşmamız gereken 3 devasa teknik kalıyor:
      1. Detaylı Sorgulama (Elaborative Interrogation): Sherlock Holmes Olmak Eğer etrafında 7 yaşlarında bir çocuk olduysa, o meşhur "neden zincirini" bilirsin
      . "Yağmur nereden geliyor?" (Bulutlardan). "Neden bulutlar yere düşmüyor?" "Neden güneşli günlerde yağmıyor?" diye bitmek bilmeyen bir merakla sorarlar
      . İşte Detaylı Sorgulama, bu çocuksu merakın yetişkin konularına uyarlanmış halidir
      .
      Bu teknikte amaç, bir gerçeğin sadece "ne" olduğunu ezberlemek değil, "neden" ve "nasıl" doğru olduğunu bir dedektif gibi sorgulayarak açıklamalar yaratmaktır
      . Bir çiçeğin bölümlerini (taçyaprağı, erkek organ vs.) kuru kuruya ezberlemek sana bir şey katmaz; asıl soru her bir parçanın bitkinin yaşamında ne işe yaradığıdır
      .
      Yazar harika bir örnek veriyor: 1930'lardaki Büyük Buhran'ı (Büyük Ekonomik Kriz) çalışıyorsun diyelim
      .
      Bu neydi? Dünya tarihindeki en büyük ekonomik çöküş
      .
      Buna ne sebep oldu? 1929 Borsa çöküşü, bankaların iflası, tarımsal kuraklık
      .
      Borsa neden çöktü? Marj satışları (margin sales) yüzünden
      .
      Marj satışı nedir? İnsanların ödünç parayla hisse senedi almasıdır. Kredi patlayınca herkes iflas etti
      . İşte bu zincir sayesinde, tarihi olaylar birbirinden kopuk tarihler olmaktan çıkıp, sebep-sonuç ilişkisiyle birbirine bağlanan güçlü bir ağa dönüşür
      . Bu tekniği matematiğe, insan biyolojisine (yüksek tansiyonun sebepleri) veya edebiyata bile uygulayabilirsin
      .
      2. Kendi Kendine Açıklama (Self-Explanation) ve Feynman Tekniği Kendi kendine açıklama, en basit tabiriyle "yüksek sesle düşünmektir"
      . Karşılaştığın bir problemi nasıl çözeceğini, adımlarını ve tercihlerinin sebeplerini kendi kendine konuşarak anlatırsın
      .
      Diyelim ki bir arkadaşının düğününde DJ'lik yapacaksın
      . Problem ne? Oynatma listesi hazırlamak
      . Kendi kendine soruyorsun: "Genelde ne çalarım? Klasikleri. Peki çift ne seviyor? Yerel modern müzik. Ben bunu biliyor muyum? Hayır. Nasıl bulurum? İnternetten Billboard veya Wikipedia listelerine bakarım."
      . Bu basit iç monolog, beyninin problemi çözerken nasıl çalıştığını fark etmeni sağlar
      . Üstelik bir konuyu kendi kendine açıklarken cümlelerin çok karmaşık ve destansı oluyorsa (örneğin kuantum mekaniğini eski deneylerle aşırı uzun anlatıyorsan), bu konuyu aslında anlamadığının en büyük kanıtıdır
      .
      Bu noktada yazar, bu yöntemin en ünlü ve özel hali olan Feynman Tekniği'nden (Feynman Technique) bahsediyor
      . Adını ünlü fizikçi Richard Feynman'dan alan bu teknik 4 adımdan oluşur:
      Birinci Adım: Kavramı seç. (Örneğin: Kütle çekimi)
      .
      İkinci Adım: Kavramı, o konu hakkında hiçbir şey bilmeyen birine anlatır gibi en sade ve basit dilinle kâğıda yaz
      . "Eee, kütle çekimi işte ya!" diyorsan, yandın. Bu adım kör noktalarını yüzüne vurur
      .
      Üçüncü Adım: Açıklayamadığın ve tıkandığın o kör noktaları bul. Kitaba geri dön, eksiklerini tamamla ve tekrar basitçe ifade etmeyi dene
      .
      Dördüncü Adım: Bir benzetme (analoji) kullan! Öğrendiğin şeyi günlük hayattan bir şeye benzet
      . Örneğin: "Kütle çekimi, ayağını havuza soktuğunda suyun yüzeyindeki bir yaprağın ayağına doğru çekilmesi gibidir."
      . Bu benzetmeyi yapabiliyorsan, o bilgi artık senindir ve temelini beton gibi sağlamlaştırmışsındır
      .
      3. Dönüşümlü Çalışma (Interleaved Practice) Yazarın son tekniği, çoğumuzun çalışma mantığına tamamen ters köşe yaptırıyor. Çoğumuz "Blok Çalışma" yaparız; yani önce A konusunu tamamen bitirir, sonra B'ye, sonra C'ye geçeriz (AAABBBCCC)
      . Tıpkı tatlıyı yemeden önce tabaktaki tüm sebzeleri zorla bitirmek gibi!
      .
      Ancak dönüşümlü çalışma, bu düzeni bozar ve konuları birbirine karıştırır (ABCABCABC)
      . Örneğin, cebir çalışıyorsan sadece üslü sayılara odaklanmak yerine; üslü sayılar, sonra grafik çizimi, sonra köklü sayılar arasında gidip gelmelisin
      . Veya Shakespeare çalışıyorsan, komedileri, trajedileri ve tarihsel oyunları karışık okumalısın
      .
      Neden mi? Araştırmalar, dönüşümlü çalışmanın blok çalışmaya göre öğrenmede ve bilgiyi tutmada tam %43 daha verimli olduğunu kanıtlamıştır
      ! Blok çalışmada beynin tembelleşir, formülü bir kere buldu mu hep aynı stratejiyi uygular
      . Ancak dönüşümlü çalışmada karşına sürekli farklı bir problem çıktığı için beynin kısa süreli hafızayı sürekli yenilemek ve her seferinde farklı bir çözüm stratejisi bulmak zorunda kalır
      .
      Dikkat etmen gereken tek kural, bunu "çoklu görev" (multitasking) ile karıştırmamaktır
      . Yani bir yandan kimya, bir yandan edebiyat, bir yandan seramik çalışırsan beynin iflas eder
      . Tek seans içinde birbiriyle alakalı 3-4 konuyu döndürmelisin
      . Örneğin; sanat teorisi, sanat teknikleri ve 60'lar pop sanatı gibi birbirini besleyen konuları karıştırmak, aralarındaki beklenmedik köprüleri (bağlantıları) keşfetmeni sağlar
      .
      Bu bölümün özü: Özet çıkarma ve fosforlu kalemle çizme gibi pasif çalışma yöntemleri, beyninize sadece konuyu anladığınız yanılgısını verir ve vakit kaybıdır. Bunun yerine beyninizi yoran ve bilgiyi dışarı çekmeye zorlayan "detaylı sorgulama", karmaşık konuları çocuklara anlatır gibi basitleştiren "Feynman Tekniği" ve konuları birbirine karıştırarak beyni sürekli tetikte tutan "dönüşümlü çalışma" gibi aktif stratejiler kullanmalısınız.
      ### Bölüm 4: Yığmadan, Aralıklı Tekrarlama
      Önceki bölümde nasıl çalışacağımızı gördük, şimdi ise "ne zaman ve hangi sıklıkla" çalışacağımıza bakıyoruz. Yazar, beynimizi bir atlete benzetiyor. Bir atlet tek seansta kendini tükenene kadar zorlarsa ne olur? Ya aşırı yorulur ve antrenman çöp olur ya da sakatlanır
      . Aynı şekilde, beynin de yeni bir bilgiyi işlemek, sindirmek ve fiziksel nöron bağlantıları kurmak için dinlenmeye ve toparlanmaya ihtiyacı vardır
      .
      Aralıklı Çalışma (Spaced Repetition) Programı Yazar bu kavramı zihnimize kazımak için somut bir çalışma takvimi örneği veriyor: Diyelim ki İspanyol tarihi çalışıyorsun. Sınavdan önceki gece 3 saat durmadan (yığarak) çalışmak yerine şöyle bir program yapıyorsun
      :
      Pazartesi 10.00: Konuyu ilk kez öğren, 5 sayfa not çıkar.
      Pazartesi 20.00: Pasif okumadan kaçın, notları aktif geri çağırma (hatırlama) ile 20 dakika gözden geçir.
      Salı 10.00: Notları 15 dakika tekrar et.
      Çarşamba 16.00: Notlara bakmadan bilgiyi kendi kendine test et, sadece unuttukların için notlara bak. (10 dakika)
      Perşembe 18.00: 10 dakikalık hızlı bir gözden geçirme.
      Cuma 10.00: 10 dakikalık aktif hatırlama seansı.
      Bu tabloya baktığında, hafta boyunca aslında sadece 75 dakika fazladan çalışmış oldun! Ancak dersi tam 6 kez beyninde döndürdün
      . Cuma günü geldiğinde artık herhangi bir sınava hazırsın çünkü beyne bilgileri birbirine bağlaması için gereken o "soluklanma" boşluklarını verdin
      .
      Bu tekniğin gücü, dil öğreniminde dünyaca ünlü Paul Pimsleur'un işitsel programında da kendini gösteriyor
      . Pimsleur, yeni bir kelimeyi beyne kazımak için tekrar sürelerini gitgide uzatan bir sistem buldu: 5 saniye, 25 saniye, 2 dakika, 10 dakika, 1 saat, 5 saat, 1 gün, 5 gün, 25 gün, 4 ay ve 2 sene!
      . Yani bir konuya saatlerce kapanmak yerine, o bilgiyle ne kadar sıklıkla karşılaştığın önemlidir
      . İlk öğrenme anından hemen sonra yapılan kısa tekrarlar işin sırrıdır
      .
      Gerçek Dünyada Kaçınılmaz Olan: Ezber (Yığma/Cramming) Yazar çok samimi bir itirafta bulunuyor: Her ne kadar aralıklı çalışmanın en doğrusu olduğunu bilsek de, yoğun hayatlarımızda, işten veya okuldan yorgun geldiğimizde bazen son dakika ezberi yapmaktan (yığma yapmaktan) başka çaremiz kalmaz
      . Peki yumurta kapıya dayandığında ne yapacağız?
      Amacımız bilgiyi sonsuza kadar öğrenmek değil, sadece sınavı geçecek kadar "kısa süreli hafızadan uzun süreli hafızanın hemen girişine" itmek olacak
      . Eğer sınav yarınsa ve 3 saatlik bir çalışma süren varsa, bu 3 saati blok halinde masaya gömülerek harcama. Aralıklı çalışmayı küçük ölçekte "taklit et"
      . Mesela uyanır uyanmaz 1 saat, öğlen 12.00'de, 16.00'da ve akşam 21.00'de bölerek çalış
      . Tekrarların sırasını karıştır (dönüşümlü çalışma) ve sürekli kendini test et
      .
      Kısa süreli hafızamız aynı anda ortalama 7 farklı eşyayı/bilgiyi aklında tutabilir
      . Yazar bunu havada birden fazla top çevirmeye (juggling) benzetiyor; eninde sonunda o toplar yere düşecek ama sınav anına kadar onları havada tutabilirsin
      . Bu aşamada en büyük silahlarımız Bilgi Kartları (Flashcards) ve Nimonik (Hafıza Geliştirme) yöntemleridir.
      Bilgi Kartları ve Bilgiyi Paketleme Son dakika ezberinde bilgi kartları hayat kurtarır çünkü seni pasif okumadan çıkarıp, kartın arkasını hatırlamaya (aktif çıkarma) zorlar
      . Yazar bilgi kartlarından maksimum verim almak için iki farklı deste yapmamızı öneriyor
      :
      İlk Deste: Sadece kelime ve tek cümlelik kısa tanımlardan oluşsun.
      İkinci Deste: Tek bir kavram/kelime arkasında muazzam miktarda bilgi barındırsın
      . Kısa süreli hafızan sadece 7 parça bilgi alabildiğine göre, bu parçaların küçük lokmalar yerine koca koca bilgi paketleri (chunking) olması senin yararınadır!
      . Ayrıca, çalışırken bilemediğin veya yanlış bildiğin kartları her zaman destenin önüne koy ki, hatalarınla daha sık yüzleşip onları hızlıca aşabilesin
      . Ve unutma, kartın arkasındaki cevabı sesli olarak söylemek zorundasın!
      .
      Nimonik Yöntemler (Akrostişler) Kısa vadede çok fazla ham bilgiyi akılda tutmanın en eğlenceli ve etkili yolu, onlara bir anlam yükleyerek hafıza oyunları oynamaktır
      . Yazarın verdiği günlük hayat örnekleri hepimizin çocukluğundan tanıdıktır: Gökkuşağının renklerini sırasıyla ezberlemek için "KuTu SaYaMaM" (Kırmızı, Turuncu, Sarı, Yeşil, Mavi, Mor) demek
       veya gezegenlerin güneşe uzaklığını hatırlamak için "Meraklı Veli Dünyadan Mars'a Jeton Satmaya Uçtu. Neden?" (Merkür, Venüs, Dünya, Mars, Jüpiter, Satürn, Uranüs, Neptün) cümlesini kurmak gibi
      . Saçma bile olsa, beynin bu eğlenceli ve tanıdık kalıpları kolayca hatırlar ve sana sınavı geçirtir
      .
      Bu bölümün özü: Beynimiz bilgiyi saatlerce süren uzun ve yorucu maratonlarda değil, aralarına zaman giren sık tekrarlarla sindirir; bu yüzden çalışma süresini uzatmaktansa tekrarların sıklığına odaklanmalısınız. Son dakika çalışmasının (yığma/ezber) kaçınılmaz olduğu kriz anlarında bile, bu aralıklı süreci küçük zaman dilimlerinde taklit etmeli; bilgileri akrostişler ve bilgi kartları yardımıyla büyük bloklar halinde paketleyerek kısa süreli hafızanızın kapasitesini hacklemelisiniz.
  - baslik: Parça C · Motivasyon ve Doğru Zihniyet (Bölüm 5-6)
    icerik: |-
      Harika ilerliyoruz! Kahveni tazele, çünkü şimdi kitabın en zihin açıcı, ezber bozan ve bizi kendi psikolojimizle yüzleştiren Parça C kısmına, yani 5. ve 6. bölümlere derinlemesine dalıyoruz. Yazar burada öğrenmenin önündeki görünmez zihinsel duvarları nasıl yıkacağımızı ve süreci nasıl bir oyun parkına çevirebileceğimizi çok çarpıcı kanıtlarla anlatıyor. Hiçbir detayı atlamadan, adım adım ilerleyelim.
      ### Bölüm 5: Öğrenmeyi İkinci Plana Atın
      Öğrenmek deyince çoğumuzun aklına dişini sıkarak masaya oturmak, saatlerce ter dökmek ve sıkıcı metinlerle boğuşmak gelir. Ancak yazar, Albert Einstein'ın oğlu Hans'a söylediği o meşhur sözle çok farklı bir iddia ortaya atıyor: "Öğrenmenin en iyi yolu, zamanın nasıl geçtiğini anlamadığın kadar zevk aldığın bir şeyi yapmaktır"
      . Yazarın buradaki temel argümanı şudur: Eğer öğrenme sürecini kendi başına bir "görev" olmaktan çıkarıp, çok daha büyük ve heyecan verici bir hedefin "yan etkisi" haline getirirseniz, öğrenmeyi ikinci plana atmış (putting learning on the back burner) olursunuz ve beyin bu süreci hissetmeden, adeta su içer gibi tamamlar
      .
      Gerçek Hayattan Güçlü Kanıtlar: İspanyolca, AIM ve Gitar Yazar bu iddiasını o kadar içten anekdotlarla kanıtlıyor ki, eminim sen de kendi hayatından benzer anılar bulacaksın. İlk örneği kendi lise yıllarından: Yazarın İspanyolca dersinde derse hiç ilgisi olmayan ama yazarın çok hoşlandığı Jessica adında bir kız vardır
      . Yazar sadece bu kızın ilgisini çekmek, ona derslerde yardım edebilmek ve onunla iletişimde kalabilmek gibi son derece motive edici bir hedef koyar önüne
      . Sonuç? Kızı etkilemek için en bilinmedik İspanyolca kelimeleri, deyimleri ve referansları adeta bir sünger gibi emer
      . Amacı İspanyolca öğrenmek değildir; amacı kızı etkilemektir
      . İspanyolca öğrenmek bu büyük hedefin sadece bir aracı haline gelmiş ve zorlu öğrenme süreci ikinci planda kalarak inanılmaz hızlanmıştır
      .
      İkinci örnek yazarın erkek kardeşinden geliyor. İnternetin yeni popülerleştiği yıllarda, ergenlerin sosyalleşmek için kullandığı AOL Instant Messenger (AIM) adında bir sohbet programı vardır
      . Kardeşi bu programa takıntılı hale gelir çünkü arkadaşlarıyla aynı anda sohbet etmek, doğru zamanda doğru şakayı patlatmak ve onlardan geri kalmamak zorundadır
      . Sadece bir iki hafta içinde kardeşinin klavye kullanma hızı dörde katlanır!
      . Kardeşi klavye kursuna gitmemiştir; onun tek amacı arkadaşlarıyla dalga geçilmeden konuşabilmektir
      . Hızlı yazmayı öğrenmek, sosyal hayatta kalma güdüsünün arkasına gizlenmiştir
      .
      Üçüncü anekdot ise üniversite yurdundaki bir arkadaştan: Yurtta herkesin gitar çalıp klasik rock parçalarıyla eğlendiği, sosyalleştiği bir ortam vardır
      . Dışlanmış hisseden bu arkadaş, sadece o odaya girebilmek, gruba dahil olabilmek ve eğlenceye katılabilmek için birinden gitar ödünç alır ve kendi kendine çalmaya başlar
      . Amacı usta bir müzisyen olmak değil, yalnızlıktan kurtulmaktır
      . Başta kısık sesle çalarken, ekiple bağ kurdukça özgüveni artar ve gruba ayak uydurmak için en zorlu soloları bile öğrenir
      .
      Tüm bu örneklerin bizi getirdiği sonuç şudur: Doğru motivasyonla öğrenmek bir eziyet değil, istediğiniz hayata ulaşmanın bir parçasıdır
      . Eğer bir hedefiniz yoksa, kendinize becerinizi kullanacağınız ama öğrenmeyi hissettirmeyecek oyunlar bulun; coğrafya öğrenmek için oyunlar oynamak veya yazmayı hızlandırmak için klavye oyunları oynamak gibi
      . Öğrenmeyi varış noktası değil, yolculuğun ta kendisi yapın
      .
      Motivasyon Yoksa Ne Yapacağız? 10-Dakika Kuralı ve Eyleme Geçmek Yazar burada çok gerçekçi bir itirafta bulunuyor: Her zaman ilham perilerinin gelmesini veya sihirli bir motivasyon bulmayı bekleyemeyiz
      . İşte böyle anlar için yazarın "10-Dakika Kuralı" adını verdiği harika bir cankurtaran simidi var
      . Bu kural iki yönlü çalışır:
      Eğer bir derse veya işe hiç başlamak istemiyorsan, kendine "Sadece 10 dakika yapıp bırakacağım" de
      . O 10 dakika dolduğunda eylemsizlik kırıldığı ve bir ivme kazandığın için genellikle durmazsın
      .
      Ne zaman çalışmayı bırakıp masadan kalkmak istersen, bırakmadan önce kendine "Sadece 10 dakika daha" de
      . Motivasyonun bitse de bu küçük disiplin kuralı seni her seferinde hedefine bir adım daha yaklaştırır
      .
      Bununla bağlantılı olarak yazar, araştırmacı Dan Coyle'un "Üçte İki Kuralı"ndan bahsediyor
      . Yeni bir şey öğrenirken zamanın sadece 3'te 1'ini okumaya ve araştırmaya ayırmalı, geri kalan 3'te 2'lik devasa dilimi doğrudan yapmaya ve pratik etmeye (doing) ayırmalısın
      . Sadece YouTube'dan videolar izleyerek veya kitap okuyarak gitarı eline aldığında bir Jimi Hendrix olamazsın
      . Teorik bilgi, deneyimle birleşmeden o gerçek uzmanlık dediğimiz "sezgi ve yargı" yetisini oluşturmaz
      .
      Öğrenmeyi Oyunlaştırmak (Gamification) Öğrenmeyi eğlenceli ve fark edilmez kılmanın en büyük hilesi oyunlaştırmadır (gamification)
      . İnsanları zorunluluklarla motive etmek zordur ama işin içine oyunların o bağımlılık yapıcı özelliklerini katarsan herkes yarışa girer
      . Örneğin bir ofiste satıcılara sadece kota koymak yerine onlara rütbeler verirsen (satış somonu, satış ton balığı, köpekbalığı, balina vb.), çalışan sadece o rütbeyi (rozetleri) almak için satışı artırmaya başlar; asıl iş ikinci planda kalır ama sonuç büyür
      .
      Bunun dünyadaki en çarpıcı örneği McDonald's Monopoly oyunudur
      . McDonald's müşterilere menü aldıkça kuponlar verir
      . Müşteriler büyük ödülü kazanmak için Monopoly tahtasını tamamlamaya çalışır (uzun vadeli motivasyon) veya kupondan çıkan anında bedava patates/içecek ödülünü alır (kısa vadeli motivasyon)
      . İnsanlar o kadar bağımlı hale gelir ki, sadece oyunda bir adım ilerlemek veya küçük bir bedava ürün için normalde yiyeceklerinden çok daha fazla McDonald's ürünü satın alırlar
      . Bu strateji 2010'da ABD'de satışları %5.6 oranında artırmıştır!
      . İnsanlar, tıpkı panayırlarda bir dolarlık oyuncak ayıyı kazanmak için on dolar harcayıp kum torbası fırlattıkları gibi, sürecin zorluğunu unutur ve oyunun içindeki gelişim hissine bağımlı olurlar
      .
      Bunu kendi hayatımıza da CrossFit salonlarının kullandığı SugarWOD uygulaması gibi araçlarla uygulayabiliriz
      . Yaptığın idmanı sisteme girmek, arkadaşlarının istatistiklerini görmek, onlarla rekabet etmek ve puan/seviye kazanmak; idmanın fiziksel acısını unutturup seni o sosyal baskı ve rekabetin hazzına odaklar
      .
      Bu bölümün özü: Kendi kendine öğrenmek çoğu insanı motive etmek için yeterli değildir ve bu çok doğal bir şeydir
      . Öğrenmeyi, sosyal ilişkiler, rekabet veya McDonald's Monopoly örneğindeki gibi oyunlaştırma stratejileri ile daha büyük ve heyecan verici bir hedefin içine gizleyerek ikinci plana attığınızda; beyniniz öğrenme zahmetini unutur ve tamamen başarı hissine odaklanır
      .
      ### Bölüm 6: Öğrenirken Yapılan Hatalar
      Öğrenme yolculuğunda bazen doğru teknikleri uygulasak bile, zihnimizin derinliklerindeki zehirli inançlar ve farkında olmadan düştüğümüz tuzaklar bizi sabote edebilir
      . Yazar bu bölümde, hepimizin düştüğü o büyük hataları ve zihniyet problemlerini masaya yatırıyor.
      Sabit Fikirli Olmak vs. Gelişime Açık Olmak (Fixed vs. Growth Mindset) Stanford Üniversitesi'nden Dr. Carol Dweck'in onlarca yıllık araştırmasına göre, insanların öğrenmeye karşı temel olarak iki farklı tavrı vardır: Sabit kalmak (fixed mindset) veya gelişime açık olmak (growth mindset)
      .
      Eğer sabit bir tavra sahipsen, zekânın ve yeteneğin genetik olduğuna, doğuştan geldiğine inanırsın
      . "Benim matematiğe kafam basmıyor" veya "Ben zeki değilim" diyerek kaderine boyun eğersin
      . Sabit fikirli insanlar, etrafa "zeki görünmek" için sadece kolayca başarabilecekleri işleri seçerler; çaba gerektiren işlerden, zorluklardan ve eleştirilerden kaçarlar
      . Başkalarının başarısı onları tehdit eder çünkü bu, kendi yetersizliklerini yüzlerine vurur
      .
      Ancak gelişime açık bir tavra sahipsen, zekânın tıpkı bir kas gibi çabayla, pratikle ve zorlanmayla geliştirilebileceğine inanırsın
      . Bu tavırda başarısızlık ölümcül bir son değil, daha zeki olmaya giden yolda atılmış bir adımdır
      . Engellerden korkmaz, eleştiriyi bir rehber olarak dinler ve başkalarının başarısından ilham alırsın
      .
      Dweck bu iki zihniyetin nasıl çocukluktan itibaren içimize işlediğini kanıtlamak için dört yaşındaki çocuklarla harika bir deney yapıyor
      . Çocuklara iki seçenek sunuluyor: Ya daha önce başarıyla tamamladıkları kolay bir yapbozu tekrar yapacaklar ya da yeni ve daha zor bir yapbozu deneyecekler
      . Sabit tavırlı çocuklar, zeki görünme garantisi olan kolay yapbozu seçip güvenli alanda kalıyorlar
      . Gelişime açık çocuklar ise bu duruma şaşırarak "Neden aynı şeyi tekrar yapayım ki, yeni bir şey öğrenmek varken!" deyip zor olanı seçiyorlar çünkü onların amacı zeki görünmek değil, zeki olmaktır
      .
      Columbia Üniversitesi Beyin Dalgaları Laboratuvarı'nda yetişkinlerle yapılan diğer bir deney durumu daha da netleştiriyor
      . İnsanlara sorular soruluyor ve beyin dalgaları izleniyor. Sabit zihniyetli insanlar, sadece mevcut yeteneklerini öven geri bildirimlere dikkat kesiliyor; yanlış cevap verdiklerinde ise doğrusunun ne olduğunu dinlemiyorlar bile (çünkü yanlış yapmak onların egosunda çoktan bir 'başarısızlık' etiketi yemiştir)
      . Gelişime açık olanlar ise tam tersine, yanlışlarının nedenini öğrenmek için geri bildirimlere pür dikkat odaklanıyorlar
      .
      Peki bu zehirli sabit zihniyetten nasıl kurtulacağız? Dweck'in "gelişime açık tavır müdahalesi" burada devreye giriyor: İletişim dilimizi değiştirmek
      . Birini (veya kendinizi) överken onun doğuştan gelen yeteneğini ÖVMEYİN ("Ne kadar zekisin", "Çok yeteneklisin" demek felakettir)
      . Bunun yerine onun Gelişimini, çabasını ve sürecini övün! "Bu zorluğun üstesinden gelme şeklini takdir ettim", "Bu projeye harcadığın emek beni çok etkiledi" diyerek, zekânın değil çabanın ödüllendirildiğini zihne kazıyın
      .
      En Büyük Efsane: "Öğrenme Tarzları" (Myth of Learning Styles) Okullarda, eğitim seminerlerinde hep duyduğumuz o meşhur efsaneye geldik: "Ben görsel öğrenirim", "Ben işitsel öğrenirim", "Ben dokunarak (kinestetik) öğrenirim"
      . Yıllarca bize her insanın farklı bir beyin yapısı olduğu ve bilgiyi sadece kendi "tarzında" alırsa öğrenebileceği pompalandı
      . Hatta oksipital lob görseli, temporal lob işitseli yönetir diyerek bunu biyolojik bir kılıfa bile soktular
      .
      Ancak yazar bombayı patlatıyor: Beynin bilgiyi sadece tek bir "tarzda" öğrendiğini kanıtlayan TEK BİR bilimsel araştırma bile yoktur!
      . Bristol Üniversitesi'nden Paul Howard-Jones bunu koca bir "nöromit" (beyin efsanesi) olarak tanımlıyor
      . İnsanların elbette kişisel tercihleri olabilir ama birine "Ben görsel öğreniciyim" demek, onu diğer tüm kaynaklara karşı körleştiren ve gelişimi durduran bir kendini tatmin mekanizmasıdır
      .
      Doğru yaklaşım nedir? Tüm stilleri acımasızca karıştırmak!
      . Eğer beyzbolu öğrenmek istiyorsan sadece diyagramlara (görsel) bakarak kalma; kitap oku, maç spikerlerini dinle, Ken Burns'ün belgeselini izle ve sahaya çıkıp topa vur (fiziksel)
      . Tarih veya matematik çalışırken de aynı şekilde sesli, yazılı ve görsel her türlü içeriğe beyninizi maruz bırakın; kendinizi tek bir hayali kategoriye zincirlemeyin
      .
      Aktif Not Alma ve Cornell Yöntemi Yaptığımız bir diğer büyük hata da derste veya toplantıda, hocanın verdiği PowerPoint çıktılarını alıp pasifçe okumaktır
      . Yazar, başkasının hazırladığı bir düzeni kendi beyninize zorla sokamayacağınızı söylüyor
      . Bilgiyi aktif olarak kendi kelimelerinizle yazmak, zihinsel bir çaba gerektirir ve bu çaba öğrenmenin ta kendisidir
      . Yazar Peter Brown'ın Aklında Kalsın kitabında kanıtladığı gibi, notları birebir kopyalayan öğrenciler, kendi kelimeleriyle özetleyerek not alan öğrencilere göre çok daha başarısız olmuşlardır; çünkü çaba azaldıkça öğrenme de azalır
      .
      İyi bir not alma süreci; not alma, düzenleme, analiz etme ve üzerine düşünme aşamalarından oluşur
      . Bunu kusursuz yapan sistem ise Cornell Yöntemi'dir
      . Bu yöntemde kağıdı (elle yazmanız şarttır) şöyle bölersiniz
      :
      Sağ Sütun (Notlar): Dersi veya konuyu dinlerken ana fikirleri buraya kısa ve öz maddeler, tablolar halinde yazarsınız
      .
      Sol Sütun (İpucu): Ders bittikten sonra sağdaki karmaşık notları analiz eder, en önemli anahtar kelimeleri ve filtrelediğiniz devasa kavramları çok daha düzenli bir şekilde bu ince sütuna geçirirsiniz
      .
      Alt Kısım (Özet): En altta ayırdığınız birkaç santimlik boşluğa ise, tüm bu sayfadaki notları sadece birkaç kelimeyle ve en vurucu cümlelerle özetlersiniz
      .
      Cornell Yöntemi sayesinde bilginin başkasının zihnine göre değil, sizin kendi beyninizin yapısına uyumlu hale gelmesini sağlarsınız ve sınavdan önce sadece "Özet" ve "İpucu" kısımlarına bakarak tüm konuyu saniyeler içinde hatırlayabilirsiniz
      . Bu not alma ve belgeleme alışkanlığını sadece okulda değil; işte, günlük hayat sorunlarında bile kullanmak, hayatınıza inanılmaz bir değer katar
      .
      Bu bölümün özü: Öğrenmeye nasıl yaklaşıyorsunuz? Sabit fikirli bir tavırla mı, yoksa gelişime açık bir tavırla mı? Gelişime açık bir tavra sahip olduğunuzdan emin olmalısınız çünkü bu, öğrenebileceğinize ve gelişebileceğinize inanmanızı sağlar
      . Ayrıca öğrenme tarzlarının bir fark yarattığı inancına kapılmamalı, her türlü bilgi kaynağına açık olmalı ve Cornell Yöntemi gibi sistemlerle not alırken maksimum zihinsel çabayı sarf ederek bilgiyi kalıcı hale getirmelisiniz
      .
  - baslik: Parça D · Ustalaşma ve Bilgiyi Aktarma (Bölüm 7-8)
    icerik: |-
      Harika bir yolculuğa çıkıyoruz! Öğrenmenin sadece bilgi yutmak değil, o bilgiyi yoğurmak, şekillendirmek ve bir başkasına aktararak ustalaşmak olduğunu anlatan, kitabın belki de en can alıcı bölümlerine geldik. Görev tanımına uygun olarak, bu bölümleri özetlemek yerine yazarın tüm argümanlarını, örneklerini ve verilerini adım adım takip ederek, sanki karşılıklı kahve içiyormuşuz gibi sana yeniden ve en ince detayına kadar anlatacağım.
      İşte başlıyoruz!
      BÖLÜM 7: Uzmanlık Oluşturmak (Building Expertise)
      Öğrenme dünyasına adım attığımızda, eninde sonunda bazı konularda ustalaşmak, yani o işin piri olmak isteriz
      . Birçoğumuz uzmanlığın doğuştan gelen mistik bir yetenek olduğunu düşünse de yazarımız bizi hemen bu yanılgıdan kurtarıyor; dünya çapında bir uzman olmanın denenmiş, kanıtlanmış ve tamamen stratejik bir yaklaşım gerektiren yolları vardır
      .
      10.000 Saat Kuralı ve Ötesi
      Uzmanlık dendiğinde akla ilk gelen efsanelerden biriyle, meşhur 10.000 Saat Kuralı (10,000 Hour Rule) ile başlayalım. Bilim insanı Anders Ericsson, 1993 yılında Berlinli kemancılar üzerine yaptığı araştırmada çok çarpıcı bir veri elde ediyor: En üst düzey, kelimenin tam anlamıyla "dünya çapındaki" kemancıların her biri o güne kadar 10.000 saatten fazla pratik yapmışken, onlardan bir alt seviyede çalanların pratik süresi yaklaşık 4.000 saatte kalmıştı
      . Malcolm Gladwell, popüler kitabı Çizginin Dışındakiler (Outliers)'de The Beatles veya Bill Gates gibi isimlerin başarılarının sırrını bu kurala dayandırarak fikri tüm dünyaya duyurdu
      . Buradan çıkaracağımız ilk iddia şudur: Bizi başarıya ulaştıran şey genlerimiz veya üstün zekâmız değil; sabır, zaman ve yeterliliktir
      . Yemek yapmaktan yazılıma kadar her alanda bu kuralı bir temel olarak görebiliriz, zira hayran olduğumuz hiçbir lider oraya bir gecede ışınlanmadı
      .
      Ancak yazar argümanı burada bırakmıyor ve bizi bir virajdan döndürüyor: Sadece körü körüne zaman harcamak yeterli mi? Princeton Üniversitesi'nin yaptığı daha güncel ve detaylı bir araştırma, yoğun pratiğin toplam gelişimde sadece %12'lik bir fark yarattığını ortaya koyuyor
      . Evet, %12 vasat ile uzmanı ayırmak için dikkate değer bir orandır, ancak tek başına bir mucize değildir
      . Üstelik bu saat kuralı en çok kuralları belli olan oyun, müzik ve spor gibi alanlarda işe yararken, eğitim ve profesyonel kariyer gibi alanlarda aynı etkiyi yaratmıyor
      . Sonuç? Zamanı sadece "harcamak" değil, "akıllıca kullanmak" zorundayız
      .
      Planlı Çalışma (Deliberate Practice)
      İşte tam bu noktada, o 10.000 saati nasıl geçirmemiz gerektiğini anlatan Planlı Çalışma (Deliberate Practice) kavramı devreye giriyor
      . Planlı çalışma, sıradan tekrarların aksine, tamamen performansı iyileştirmeye odaklanmış, hedefi olan, sistematik bir süreçtir
      . Neden mi? Çünkü bilinçsiz tekrarlar sadece kötü alışkanlıklarımızı kalıcı hale getirir
      . Ayakkabı bağcıklarını bağlamayı ilk öğrendiğin zamanı düşün; başlarda her bir ilmeği bilinçli atarken, şimdi bunu düşünmeden, tamamen otomatik yapıyorsun
      . Eğer bağcığı yanlış bağlamayı otomatikleştirseydin, bu senin zayıflığın olurdu.
      Bunu somutlaştırmak için yazar, Bilgisayar Bilimleri profesörü Cal Newport'un ayrık matematik (discrete math) dersindeki ustalığına mercek tutuyor. Bu ders karmaşık teorilere ispat bulmakla ilgilidir
      . Newport sadece derse girip not tutmakla yetinmedi; hocasının verdiği tüm yapıları kâğıtlara kopyaladı, tek başına o ispatları çözmeye çalıştı, anlamadığı yerde saatlerce internet ve kitap kaynaklarını taradı, tıkandığında gidip hocasına sordu
      . Dönem sonuna yaklaştığında, elindeki onlarca ispatı kolay hatırlayabileceği şekilde sınıflandırdı, zorlandığı problemlere "agresif bir şekilde" ve tamamen anlayana kadar saldırdı
      . Sonuç olarak, finalden o güne kadar alınmış en yüksek notu alarak dersi geçti
      . İşte planlı çalışma budur: Konuyu parçalara böl, zayıf halkanı bul, geri bildirim al ve o zayıflığı yok edene kadar yoğun bir odakla tekrar et
      .
      Yazar bu sürecin çalışması için üç altın kural veriyor:
      Sadece yapın (Just do it): İnternetten bir felaket haberi okumak ya da video izlemek pasif bir süreçtir. Eğer o felaket için bağış yapmıyor veya edindiğiniz bilgiyi gerçek dünyada kullanmıyorsanız, aktif çalışmıyorsunuz demektir
      .
      Kendinizi ölçün (Measure yourself): Okuduğunuz sayfa sayısı, klavyede dakikada yazdığınız kelime, çektiğiniz şınav... Metriği olmayan şey geliştirilemez
      .
      Geribildirim alın (Get feedback): Hem işi yapıp hem kendini objektif değerlendirmek neredeyse imkânsızdır. Tıpkı bir sporcunun ufak hatalarını gören bir koça ihtiyaç duyması gibi
      . Çevrenizde bir koç yoksa bile, Coursera, Udemy gibi platformlar veya araba tamirinden yazılıma kadar internetteki binlerce forum size bu geri bildirimi sağlayabilir
      .
      Yetenek Edinirken Dreyfus Modeli (Dreyfus Model of Skill Acquisition)
      Peki, çıraklıktan ustalığa geçerken hangi aşamada olduğumuzu nasıl anlarız? 1980 yılında UC Berkeley'de Stuart ve Hubert Dreyfus kardeşlerin geliştirdiği 18 sayfalık Dreyfus Modeli, bugün bile bir yeteneğin neresinde olduğumuzu ölçmek için en iyi haritadır
      . Model bizi 5 aşamadan geçirir:
      Acemilik (Novice): Boş bir sayfasınız. Sadece kuralları öğrenir ve zamanınızın çoğunu bu katı kuralları uygulamaya harcarsınız
      .
      İleri başlangıç (Advanced Beginner): Kuralları gerçek dünyaya uygulamaya başlarsınız. Hatalar yaparsınız ama ilerlersiniz. Pratik ve teori yarı yarıyadır
      .
      Yeterlilik (Competence): Neyi dikkate alıp neyi görmezden geleceğinizi bilirsiniz. Hatalar devam etse de onlardan ders çıkarırsınız. Artık pratik, kural ezberinden daha ağır basar
      .
      Beceriklilik (Proficiency): Konuya hâkimsinizdir. Başkalarını gözlemler, yeni şeyler denersiniz. Bilgi edinme evresi bitmiş, hareketlerinizi bilinçsiz bir alışkanlığa dönüştürme evresi başlamıştır
      .
      Uzmanlık (Expertise): Artık hiç düşünmeden, refleks olarak o işi mükemmel yaparsınız. Dışarıdan "büyülü" görünen bu performans, aslında önceki 4 aşamadaki yoğun terin sonucudur
      .
      Litemind.com'un da belirttiği gibi, acemilerin katı kurallara ihtiyacı varken, bir uzmanı kurallara boğmak onun büyüsünü bozar
      . Bunu mutfaktan bir analojiyle anlatalım: Makarnayı haşlamayı ilk öğrendiğinizde acemisinizdir (kurallar önemlidir), ardından kavanozda hazır sosla spagetti yapmaya geçersiniz. Ama süslü bir restoranda tavada alevler çıkartarak şov yapmak (uzmanlık) için henüz erkendir
      . Sürecin ortalarındayken hata diye bir şey yoktur; şekerin yerine rezene tohumu koymayı, yağlı boya yerine sulu boya kullanmayı, vergi hesaplarken kısayollar denemeyi bu orta aşamalarda, yani deney evresinde yapmalısınız
      .
      Konuyu pekiştirmek için yazar yeterliliğin dört aşamasını da hatırlatıyor:
      Bilinçsiz yetersizlik: Neyi bilmediğini bile bilmemek
      .
      Bilinçli yetersizlik: Neyi yanlış yaptığını bilmek ama düzeltememek
      .
      Bilinçli yeterlilik: Tüm gün odaklanırsan işi doğru yapabilmek
      .
      Bilinçsiz yeterlilik: Hiç düşünmeden, doğaçlama bir şekilde harikalar yaratmak
      .
      Pareto Prensibi: 80/20 Kuralı (Pareto Principle)
      Uzmanlaşırken her bilgi kırıntısına aynı değeri mi vermeliyiz? Hayır. 20. yüzyılın başlarında İtalyan ekonomist Vilfredo Pareto, İtalya'daki servetin %80'inin nüfusun %20'sinin elinde olduğunu matematiksel olarak kanıtladı
      . Bu muazzam keşif, hayatın her alanına uyarlanabilen 80/20 Kuralı'nı doğurdu: Çıktıların %80'i, girdilerin sadece %20'sinden gelir
      .
      Örnekler çarpıcıdır: Bir şirkette satışların %80'i müşterilerin %20'sinden gelir. Çalışanların %20'si, sonuçların %80'ini üretir. Mutluluğumuzun %80'i hayatımızdaki ilişkilerin %20'sine bağlıdır. Hatta seyahat anılarımızın %80'i, deneyimlediğimiz şeylerin sadece %20'sidir
      . Uzmanlık yolunda da durum böyledir: Öğrenmeniz gereken asıl sihirli alan, o konunun belkemiğini oluşturan %20'lik kısımdır
      .
      Dil uzmanı Gabriel Wyner'ın harika verilerine bakalım. Wyner, yeni bir dil öğrenirken sadece en çok kullanılan 1.000 kelimeye odaklanırsanız o dilde yazılanların %70'ini, 2.000 kelimeyle ise %80'ini anlayabileceğinizi söyler
      . Dilbilimci Dr. Paul Nation ise işi daha da ileri götürüyor: İngilizcede sadece 10 adet kelime (the, be, of, and, a, to, in, he, have, it) günlük konuşmaların tam %25'ini oluşturur! Ve sadece 100 kelime bilirseniz, kurulan tüm cümlelerin %49'unu anlayabilirsiniz
      . İngilizcede 250.000 kelime olduğu düşünülürse, 100 kelime (dilin %0,00004'ü) ile cümlelerin yarısını anlamak Pareto Prensibinin ne kadar şaşırtıcı bir gerçek olduğunun kanıtıdır
      . Dr. Alexander Arguelles de insanların günde ortalama 750 kelime kullandığını, dünyadaki hemen her derdinizi anlatmak için 2.500 kelimenin yettiğini doğrular
      .
      Başka örnekler de var: Futbol koçları takımın maç kazandıran %20'lik oyun planlarına odaklanırlar. Microsoft, sistemlerindeki yazılım hatalarının (bug) %80'inin, kod dizinlerinin sadece %20'sinden kaynaklandığını keşfetmiştir
      . Günlük hayatta bile yemeklerimizin %80'ini mutfaktaki baharatların %20'siyle yaparız
      . Kısacası uzman olmak; detaylarda boğulmak değil, asıl fark yaratan o stratejik %20'yi bulup üzerine gitmektir
      .
      Bu bölümün özü: Uzmanlık sadece saatlerce pratik yapmakla değil, zayıf yönleri hedef alan, ölçülebilir ve geribildirimli bir "planlı çalışma" ile mümkündür. Dreyfus Modeli ile gelişim aşamalarınızı takip ederek ne zaman kuralcı ne zaman yenilikçi olacağınızı bilebilir, Pareto Prensibi sayesinde de enerjinizi size %80 sonuç getirecek o sihirli %20'lik alana odaklayarak ustalığa giden yolu radikal bir biçimde kısaltabilirsiniz.
      BÖLÜM 8: Öğrenmeyi Öğretmek (Teaching to Learn)
      Öğrenmenin sadece dışarıdan içeriye bilgi depolamak olduğunu sanıyorsanız, yazarımız şimdi tüm ezberleri bozuyor. Bir başkasının yüzünde o bilginin "ışıldadığını" görmek eşsizdir; fakat asıl büyü, başkasına bir şey öğretirken kendi beyninizde gerçekleşen devrimdedir
      . Madalyonun iki yüzü vardır ve öğretmek, usta bir öğrenici olmanın en keskin kılıcıdır
      .
      Öğrenme Piramidi (The Learning Pyramid)
      Bilgiyi ne kadar içselleştirdiğimizi gösteren efsanevi Öğrenme Piramidi (Yaşantı Konisi), pasif ve aktif öğrenme arasındaki dev uçurumu gözler önüne serer
      . Veriler sadece bir yol gösterici olsa da oranlar tokat gibidir:
      Yalnızca derste dinlediğinizin %5'ini,
      Okuduğunuzun %10'unu,
      Görsel ve işitsel araçlarla izlediğinizin %20'sini,
      Uygulamalı bir gösterime tanık olduğunuzun %30'unu hatırlarsınız
      . Bunlar pasif taraftır. Ancak işin içine siz girerseniz:
      Bir grupla tartışırsanız %50'sini,
      Bilgiyi bizzat uygulayarak pratik yaparsanız %75'ini,
      Bir başkasına öğretirseniz veya hemen kullanırsanız tam %90'ını öğrenirsiniz!
      Ana fikir nettir: Bilgi ile ne kadar "meşgul" olursanız, o kadar kalıcı olur
      . Tıpkı Feynman Tekniğinde olduğu gibi, birine bir konuyu anlatmak, aralardaki kopuklukları ve boşlukları acımasızca yüzünüze vurur
      . O an "Bunu biliyorum, şimdilik geçeyim" diyemezsiniz; karşınızdakinin sorularına cevap vermek için konunun tüm bağlarını kurmak zorundasınızdır
      .
      Örneğin, fotoğrafçılık öğreniyorsunuz diyelim. Sadece bir kitap okumak size %15 fayda sağlar. Videolar izlemek veya tartışma gruplarına katılmak fena değildir
      . Ancak fotoğrafçılık tekniklerini bir arkadaşınıza anlatmak için tahtanın başına geçtiğinizde, o %90'lık sihir devreye girer. Öğretmek için beyninizdeki bilgiyi kırmak, lokmalara ayırmak, dışarı çekmek ve başkasının anlayacağı şekilde yeniden inşa etmek zorundasınızdır
      . İçinizden ne kadar çok bilgiyi dışarı "çekerseniz", o bilgi kökleriyle beyninize o kadar sağlam tutunur
      .
      Çırak Etkisi (The Protégé Effect)
      Eğitim dünyasında, başkasına öğreten insanların konuyu çok daha doğru hatırlayıp etkili uyguladığı gerçeğine Çırak Etkisi (Protégé Effect) deniyor
      . Öğretmenlerin aynı sınavlarda, ders anlatmayan meslektaşlarından daha yüksek not almaları tesadüf değildir
      .
      Stanford Üniversitesi araştırmacıları bu etkiyi test etmek için dâhiyane bir yöntem buldular: Eğitsel Ajanlar (Teachable Agents - TA)
      . Sekizinci sınıf öğrencileri iki gruba ayrıldı. Bir gruba, öğrendikleri biyoloji kavramlarını bir "yapay zekâ ajanı"na (sanal bir çırağa) öğretmeleri söylendi. Öğrenciler bir kavram haritası çiziyor, sanal çırak bu haritayı kullanarak sorulara cevap veriyor ve yanlış yaptığında öğrenci hatayı bulup haritayı güncelliyordu
      . Diğer gruptan ise sadece kendileri için kavram haritası yapmaları istendi
      . Sonuç muazzamdı: Eğitsel ajan kullanan öğrenciler hem konuyla çok daha fazla vakit geçirmiş hem de motivasyonları zirveye çıkmıştı
      .
      Stanford'lu bilim insanları bu "çırak" sihrinin 3 psikolojik temelini şöyle açıklıyor:
      Kendini koruma tamponu (Ego-protective buffer): Başarısızlığı kişisel bir yıkım olmadan tatma imkânı. "Ben başarısız olmadım, sadece sanal karakterime daha iyi öğretmeliyim" diyerek duygusal çöküntü yaşamıyorlar
      .
      Bilgiyi sürekli artan bir şey olarak görmek (Malleable knowledge): Öğrenci, tekrar ve gözden geçirmenin işe yaradığını bizzat çırağının gelişimi üzerinden görebilir
      .
      Sorumluluk hissi (Sense of responsibility): Düşünen bir başka "varlığa" karşı sorumlu hissetmek, bilginin doğruluğu için ekstra ter dökmeye motive eder
      .
      Eğer gerçek bir öğrenciniz yoksa üzülmeyin. Quora.com veya Reddit gibi forumlar, ciddi sorular soran insanlarla doludur. Bir konuyu pekiştirmek istiyorsanız, oraya girip insanlara cevaplar yazmak Çırak Etkisi'ni tetiklemek için harika bir yoldur
      .
      Stratejik Sorular (Strategic Questions)
      Birine bir şey öğretirken sadece konuşmak yetmez; asıl sanat doğru soruları sormaktır. Sorular, öğrencinin beyniyle sizin aranızda bir ayna görevi görür
      . Michael Bungay Stanier, Koçluk Alışkanlığı (The Coaching Habit) adlı kitabında, sorunları kökünden çözmek için 7 sihirli soru tanımlamıştır
      :
      "Aklında ne var?" (What's on your mind?): Kontrolü karşıya veren, sorunun kapısını aralayan bir marş motorudur
      .
      "Başka?" (And what else?): Stanier'in favorisidir. İnsanlar nasılsın dendiğinde önce "iyiyim" der, asıl dertleri sonra dökülür. İlk cevap genelde yüzeyseldir, bu soru derine inmenizi sağlar
      .
      "Senin için gerçek zorluk nedir?" (What's the real challenge here for you?): Odak noktasını genel bir problemden, kişinin "kendi" algısına ve eylem gücüne çeker
      .
      "Sen ne istiyorsun?" (What do you want?): Doğrudan hedefe kilitlenmeyi sağlar
      .
      "Ben nasıl yardımcı olabilirim?" (How can I help?): Bu "tembel soru"dur. Kurtarıcı rolüne bürünüp hemen çözüm sunmanızı engeller; öğrencinin kendi çözüm çerçevesini çizmesini zorunlu kılar
      .
      "Eğer buna 'evet' diyorsan, neye 'hayır' diyorsun?" (If you're saying yes to this, what are you saying no to?): Stratejik bir farkındalık sorusudur. Alınan bir kararın fırsat maliyetini (feda edilenleri) gösterir
      .
      "Senin için en çok ne yararlı oldu?" (What was most useful for you?): İşte bu, seansın "öğretme anı"dır. Tüm o konuşmanın zihinde bıraktığı asıl kazanımı pekiştirir
      .
      Yazar bunu bir senaryoyla somutlaştırıyor: Bir sanat müzesi için kitap hazırlayan bir baş tasarımcı, projedeki kopukluktan dolayı proje yöneticisine gelir
      . Yönetici "Aklında ne var?" diyerek başlar (İletişim kopukluğu). "Başka?" (Bazı kişiler işi yavaşlatıyor). "Senin için gerçek zorluk nedir?" (Ekibe dışarıdan atandığım için uyum sağlayamıyorum). "Sen ne istiyorsun?" (Ekibimin görünürlüğü artsın). "Ben nasıl yardımcı olabilirim?" (Ekip içi bariyerleri yıkacak vakit bulamıyorum, yardım et). "Neye hayır diyorsun?" (Ekibin içe kapanmasına hayır diyorum). Ve sonunda "Ne yararlı oldu?" (Farklı yaklaşımlar denemem gerektiğini gördüm) diyerek süreci inanılmaz bir aydınlanmayla (öğretme anıyla) kapatır
      .
      Sağlıklı Geribildirimler Verin (Constructive Feedback)
      Birilerine bir şey öğretirken ya da yol gösterirken en keskin aracımız geribildirim vermektir. Ancak bu ince bir sanattır. Auckland Üniversitesi'nden Helen Timperley ve John Hattie, bunun kurallarını şöyle belirliyor
      :
      Açık ve net olun (Be clear and specific): "Aferin" veya "Olmamış" gibi boş laflar çöptür. "Hesaplamalarındaki detaycılığın harika" ya da "Sunumda sayılarda gergindin" gibi spesifik doneler verin
      .
      Ne kadar erken, o kadar iyi (The sooner the better): Minnesota Üniversitesi araştırması kanıtlıyor: Olay biter bitmez verilen anlık geribildirim, zihinsel bir kopukluk olmadığı için günlerce sonra verilenden kat kat daha etkilidir
      .
      Bir hedef gösterin (Show a goal): Yaptığı şeyin büyük resimde nereye oturduğunu ona hatırlatın ("Bu yazı tezinin kalbi olacak")
      .
      Dikkatli olun (Be careful): Olumlu geribildirim beyni açarken, olumsuz geribildirim defansif kalkanları kaldırır. Dürüst ama nazik olun, darbeyi yumuşatın ("Herkes burada zorlanır, halledeceğiz")
      .
      Bir planla bitirin (End with a plan): Çözüm yolları olmayan bir eleştiri sadece yıkıcıdır. Konuşmayı mutlaka bir yol haritasıyla bitirin
      .
      Tabii işin bir de Başkalarından Geribildirim Almak kısmı var. Gerçekten öğrenmek istiyorsak egomuzu bir kenara bırakmalı ve doğrudan "Bunu nasıl daha farklı yapabilirdim?" diye açık açık sormalıyız
      . Farklı departmanlardan, arkadaşlardan havuzu ne kadar genişletirsek, o kadar objektif bir aynaya sahip oluruz
      .
      En iyi öğretmenler, aslında öğrencilerinden en çok şeyi öğrenenlerdir. Empati, problem çözme ve karşısındakinin yerine geçebilme sanatı, sizi usta bir öğreniciye dönüştürür
      .
      Bu bölümün özü: Öğrenme Piramidi'nin zirvesinde yer alan "öğretme" eylemi, sahip olduğunuz bilginin açıklarını kapatıp onu beyninize sarsılmaz bir şekilde kazıyan en aktif öğrenme yöntemidir. İster Çırak Etkisi ile sanal/gerçek bir öğrenciye karşı sorumluluk hissederek çalışın, ister stratejik sorular sorarak geribildirim sanatını konuşturun; başkasının beyninde bir ampul yakmaya çalışmak, kendi beyninizdeki tüm şalterleri kaldırmanın en kesin yoludur.
  - baslik: Parça E · Sürdürülebilir Başarı (Bölüm 9)
    icerik: |-
      Harika bir yolculuğun sonuna, kitabın en bütünleştirici kısmı olan Parça E'ye (Bölüm 9) geldik! Bugüne kadar beynin nasıl çalıştığını, hangi tekniklerin işe yarayıp hangilerinin yaramadığını ve kendi psikolojimizi nasıl yöneteceğimizi konuştuk. Ancak yazarımız Peter Hollins'in de fark ettiği çok kritik bir şey var: Dünyanın en iyi tekniklerine sahip olabilirsin ama bunları birer reflekse, yani hayat boyu sürecek otomatik bir alışkanlığa dönüştürmediğin sürece hepsi bir noktada sönüp gidecektir.
      Gel seninle yazarın argümanlarını adım adım takip ederek, hiçbir örneği veya detayı atlamadan, bu bölümü sanki karşılıklı bir masada oturup bu felsefeyi hayatımıza nasıl entegre edeceğimizi tartışıyormuşuz gibi derinlemesine yeniden anlatalım.
      Öğrenmenin Zirvesi Olarak Alışkanlıklar, Kararlılık ve Dürtü Kontrolü
      Öğrenme sürecini genellikle aktif bir düşünme eylemi olarak tanımlarız. Ancak yazar, argümanına çok ilginç bir ters köşeyle, alışkanlıkların doğasını tanımlayarak başlıyor. Alışkanlıklar dediğimiz şeyler, bilinçaltımızda yatan ve en ufak bir düşünceye dahi ihtiyaç duymadan, tamamen otomatik olarak çalışan davranış düzenleridir
      . Eğer bir şeyi alışkanlık haline getirmeden, sadece irade gücüyle yapmaya çalışırsan, başarısız olma ihtimalin inanılmaz derecede artar
      . Neden mi? Çünkü yeni bir bilgiyi öğrenmeye çalışırken, bir yandan da "nasıl hareket etmen gerektiğini" düşünmek, beynin aynı anda iki zorlu işi yapmaya çalışması demektir
      . Düşünsene, manuel vitesli bir araba kullanmayı ilk öğrendiğin günü hatırla; hem debriyajı kavramaya çalışıp hem de yan koltuktaki haritadan yol bulmaya çalışmak gibi bir şeydir bu. İkisini aynı anda yapamazsın. İşte bu yüzden yazarın temel iddiası şudur: Alıştırma yapmak ve bir eylemi alışkanlık haline getirmek, öğrenmenin aslında "son noktasıdır"
      . Bir konuyu o kadar iyi öğrenirsin ki, artık istesen de farklı bir şekilde düşünemez veya hareket edemezsin
      .
      Peki, bizi bu nihai noktaya ulaştıracak o sihirli güç nedir? Yazar burada Kararlılık (Grit) kavramını masaya yatırıyor. Kararlılık, basitçe bir inatçılık değil; bir göreve odaklı kalabilme, onu tamamlayana kadar pes etmeme ve "soruna yapışıp onun seni yenmesine izin vermeme" yeteneğidir
      . Yazarın argüman zincirine göre, kararlı insanlar sadece kafalarını duvara vuran insanlar değildir; onlar durmak istedikleri, tükendikleri anlarda bile sorunlara saldırmak için yeni stratejiler geliştiren kişilerdir
      . Sistematik olarak farklı yaklaşımlar denerler, geribildirim toplarlar ve bakış açılarını değiştirmeye son derece açıklardır
      . Gerçek kararlılık, hayal kırıklığının en derin olduğu anlarda bile hırslı ve gayretli kalabilmektir
      .
      Bunu kanıtlamak için yazar, tarihten üç devasa figürü örnek veriyor. Eğlence dünyasının zirvesindeki Walt Disney, imparatorluğunu kurmadan önce birçok kez iflas etmiştir
      . Thomas Edison, dünyayı aydınlatan o ampulü bulmadan önce tam bin kez başarısızlığa uğramıştır
      . Belki de en çarpıcı olanı, dünyanın gelmiş geçmiş en büyük basketbolcusu kabul edilen Michael Jordan'ın, lise yıllarında "yeterince iyi olmadığı" gerekçesiyle koçları tarafından takımdan kesilmiş (oynatılmamış) olmasıdır
      . Tüm bu örnekler bizi şu sonuca götürür: Bu insanlar üstün zekâlarıyla değil, hayal kırıklığı karşısında geri adım atmayan kararlılıklarıyla o noktaya gelmişlerdir.
      Bizim gibi günlük hayat koşturmacasındaki insanlar içinse bu durum, her an kontrolü kaybettiğimizi hissettiğimizde bizi yolda tutacak alışkanlıklar edinmekle mümkündür
      . Yazar, rol modeller belirlemenin ve onların engelleri nasıl aştığını öğrenmenin bize ilham verecek harika bir kaynak olduğunu söylüyor
      . Öğrenme sürecinde kararlılık demek; hayal kırıklığı anlarında sabretmek, aktif öğrenme alıştırmalarının eninde sonunda işe yarayacağına güvenmek ve deneme-yanılmanın bu işin kaçınılmaz bir parçası olduğunu kabullenmektir
      .
      Kararlılığın ayrılmaz bir parçası ise Dürtüleri Yönlendirmek (Impulse Control) yani iç disiplindir. Yazar bu kavramı; sakin kalmak, düşünceli davranmak, ne yaptığının bilincinde olmak ve eyleme geçmeden önce seçenekleri tartmak olarak tanımlıyor
      . Etkili liderler tam da bunu yapar; aceleci davranmak yerine büyük resmi değerlendirirler
      . Bu noktada yazar, Benjamin Franklin'in o efsanevi sözünü hatırlatıyor: "Akla ilk gelen arzuyu baskılamak, onu takip edenleri tatmin etmekten daha kolaydır."
      . Bu söz öğrenme psikolojisi için bir mihenk taşıdır. Öğrenirken yaşadığımız duygusal iniş çıkışlar, özellikle de "boşa uğraşıyorum" hissi, içimizdeki en yıkıcı duygudur ve bize sürekli "zararın neresinden dönsen kârdır, bırak bu işi" dedirtir
      . İşte dürtü kontrolü, bu pes etme dürtüsünü ilk anında yakalayıp bastırmaktır. Engeli aşmak için adımlarımızı geriye doğru takip etmek, "kendi kendine açıklama" yöntemini devreye sokmak ve ani bir hareketin (pes etmenin) büyük vizyonumuzu nasıl çöpe atacağını düşünmek, dürtü yönetiminin ta kendisidir
      .
      Bu bölümün özü: Öğrenmeyi kalıcı kılan şey, onu üzerine düşünmeyeceğiniz otomatik alışkanlıklara dönüştürmektir. Bu noktaya ulaşmak için, hayal kırıklığı ve "boşa uğraşıyorum" hissinin getirdiği pes etme dürtülerini Benjamin Franklin'in tavsiye ettiği gibi ilk anında bastırmalı; Disney veya Edison gibi karşılaştığınız engelleri aşmak için sistematik stratejiler geliştiren bir kararlılık (grit) inşa etmelisiniz.
      Esnek Düşünme Sanatı ve İsabetli Olmayı Hedeflemek
      Yazarın argüman zincirinde, kararlılıkla yola devam eden bir zihnin ihtiyaç duyacağı en önemli araçlardan biri Esnek Düşünme (Flexible Thinking) becerisidir. Yazarın iddiası şudur: Sorunlara tek bir doğru varmış gibi değil, birçok farklı açıdan bakabilme yeteneği hayatın her alanında paha biçilemezdir
      . Zihinsel olarak esnek insanlar, yeni bir bilgi öğrendiklerinde veya mevcut fikirlerine tamamen zıt bir sonuçla karşılaştıklarında inatlaşmaz, fikirlerini akıcı bir şekilde değiştirebilirler
      .
      Bu esnekliği kazanmanın en iyi yolu "önsezi ve hayal gücünü" kullanmaktır
      . Yazar harika bir düşünce deneyi öneriyor: Bir olayın muhtemel sonuç aralığını; en aşırı iyimserlikten en karanlık karamsarlığa kadar hayal et
      . Gerçekleşecek olan sonuç muhtemelen bu iki ucun arasında bir yerde olacaktır ama zihnini bu uçlara kadar esnetmek, bakış açını inanılmaz derecede genişletir
      . Bu soyut kavramı yazar, çok net bir günlük hayat analojisiyle somutlaştırıyor: Başkalarının yerine geçebilmek (empati). Diyelim ki belirli bir aromaya sahip bir yiyeceği çok seviyorsun. Sırf sen o aromayı seviyorsun diye, sadece o yemeğin satıldığı bir restoran açarsan müşterilerin dolup taşacağı anlamına gelir mi? Tabii ki hayır! O halde esnek düşünmeli ve "Eğer öyle değilse, onları nasıl ilgili hale getirebiliriz?" diye sormalısın
      .
      Öğrenme sürecinde esnek düşünmek; kişisel eğilimlerini ve "hemen kesin bir cevaba ulaşma" içgüdünü kırmak demektir
      . Duygularını kontrol etmez ve çaresizliğe kapılırsan, yeni bir yetenek edinemezsin
      . Yazar bunu önceki bölümlerdeki "kendi kendine açıklama" yöntemiyle birleştiriyor. Esnek düşünmek; edebi bir metni incelerken bilimsel bir metot kullanmayı denemek ya da bir matematik problemini çözerken edebi bir metafor kullanmak gibi sınırları ihlal eden alternatif yollar bulmaktır
      . Hatta yazar çok pratik bir ipucu veriyor: Tıkandığında ve aklına hiçbir şey gelmediğinde, alfabeyi bir uyarıcı olarak kullanıp kelimeler türeterek zihnini o blokajdan kurtarabilirsin
      .
      Esnekliğin hemen ardındansa yazar, görünüşte zıt ama aslında onu tamamlayan İsabetli Olmayı Hedeflemek (Striving for Accuracy) kavramına geçiyor. Bu kavramın özünü "İki düşün, bir söyle" atasözüyle özetliyor
      . Esnek düşünürken çok farklı yollara sapabiliriz ama sonuçlandırırken isabetli olmalıyız. Yazarın iddiası; isabetli olmayı hedeflemenin, bizi kritik hatalar yapmaktan, kötü alışkanlıklar edinmekten ve yanlış bilgilerle donanmaktan koruduğudur
      . Bu sadece doğru sonucu bulmak değil, aynı zamanda yaptığınız işte bir "mükemmeliyetçi" itibarı kazanmaktır
      .
      Yazar bunu pekiştirmek için çok çeşitli alanlardan kanıtlar ve örnekler sunuyor: Bir bütçe hazırlıyorsun diyelim, aynı denklemin cevabını doğrulamak için farklı kaynaklar kullanmalısın
      . Veya tarihsel olaylar hakkında bir yazı yazıyorsan, olayların tarih sırasını tek bir yerden değil, birçok farklı kaynaktan doğrulamalısın
      . Bir trigonometri denklemini çözdüğünde, sağlamasını yapmak için onu farklı yöntemlerle birden çok kez çözmelisin
      . Siyaset bilimi dersi için bir araştırma yapıyorsan, ziyaret ettiğin haber sitelerinin güvenilirliğini mutlaka sorgulamalı ve doğrulamalısın
      . Hatta ahşap işçiliği yapıyorsan bile, işe başlamadan önce aletlerinin iyi durumda ve doğru ayarlanmış olduğundan emin olmalısın; yazar buna profesyonellerin yaptığı gibi basit bir "kalite kontrol uygulaması" diyor
      .
      Peki isabetli olmanın düşmanı nedir? Yazar çok net: Kestirme yollar
      . Öğrenme esnasında cevaba hemen ulaşmak için kestirmeleri kullanmak, kişisel zihinsel sürecinizi çöpe atmaktır. Bir sorunun cevabını hemen bir arkadaşına sormak veya internetten (Google'dan) saniyeler içinde okuyup geçmek çok cazip gelebilir
      . Yazar "Google'ı kullanmayın" demiyor; ancak başkalarının veya internetin sunduğu o renkli fikirlerin her zaman doğru olmadığını, asıl önemli olanın o bilgiyi kendi "zihinsel sürecinizden" geçirerek kişisel bir öğrenme deneyimi yaşamanız olduğunu vurguluyor
      . Kendi güvenilir kaynaklar listenizi oluşturun, sunumunuzda içinize sinmeyen bir şey varsa onu göz ardı etmeyin ve kendi bulduklarınızı bile acımasızca sorgulayın
      .
      Bu bölümün özü: Öğrenme sürecinde karşılaştığınız sorunlara, tıpkı kendi sevdiği yemeği satmaya çalışan bir restoran sahibinin müşterilerin gözünden bakması gerektiği gibi çok boyutlu ve esnek (flexible) yaklaşmalısınız. Ancak bu esnekliği eyleme dökerken; cevabı Google'dan kopyalamak gibi kestirme yollardan kaçınarak, tıpkı bir ahşap ustasının aletlerini kontrol etmesi gibi kendi bulgularınızı birden fazla kaynaktan doğrulayan "isabetli ve mükemmeliyetçi" bir zihinsel kalite kontrol süreci işletmelisiniz.
      Şüphecilik, Soru Sorma ve Metaforlarla Düşünmek
      Geldik kitabın ve yazarın argüman zincirinin son büyük yapıtaşlarına. Kendi bulgularımızı nasıl doğrulayacağımızı gördük, peki ya etrafımızdaki dünyaya nasıl yaklaşacağız? Yazar burada Soru Sorma ve Sorunları Ortaya Çıkarma (Questioning and Posing Problems) eylemini güçlü bir araç olarak sunuyor. İddiası şu: Bizi ve inandıklarımızı sorgulayacak, hatta düşünmeyi hiç tercih etmeyeceğimiz engelleri zihnimizde kasten oluşturmak harika bir antrenmandır
      .
      Yazarın sunduğu sorular (sorun çıkarma senaryoları) gerçekten zihin açıcı:
      "New Mexico'ya uzaylıların indiğiyle ilgili elimde ne kanıt var?"
      "Mutluluğun peşinde koşmam taviz veremeyeceğim bir hak mı, yoksa ben mi yanlış okudum?"
      "Arabamın lastiklerinin basıncının 20 psi'nin altına düşmesine müsaade edersem ne olur?"
      "İflas etmenin başka yolları nelerdir?"
      "En güzel ekmeği nasıl pişiririm?"
      Bu soruların ortak noktası nedir? Bizi konfor alanımızdan çıkarıp araştırma yapmaya, bildiğimizi sandığımız şeyleri test etmeye zorlamalarıdır. Yazar bunu açıkça "Şüphecilik veya Kuşkuculuk (Skepticism)" olarak adlandırıyor ve bunun kanıtlanıp doğrulanmayan hiçbir şeye tam olarak inanmamak anlamına geldiğini söylüyor
      . Kendini sorgulamak asla bir zayıflık değildir; aksine, dışarıdan gelebilecek zorlukları önceden tahmin edip evimizin sıcaklığında, güvenli bir şekilde "gerçek dünya hazırlığı" yapmamızı sağlayan bir yetenektir
      .
      Bu şüpheciliği eğitim alanına taşıdığımızda, bir öğrencinin eğitmeninin anlattığı hikâyeyi sorgulaması inanılmaz değerlidir
      . Yazar bunu tarihi ve sanatsal tabuları yıkarak örneklendiriyor: Tarihte bize kahramanlık ya da hainlik hikâyeleriyle anlatılan karakterler gerçekten anlatıldıkları kadar iyi ya da kötüler miydi?
      . Sanat tarihinde duyduğumuz Kübist ressamlar gerçekten natüralizme tamamen karşı mıydılar?
      . Bir kitabı, bir insanı veya bir ifadeyi —sonunda o ifade tamamen doğru çıksa bile— çapraz sorguya çekmek, o konunun büyük resmini ve köklerini çok daha derinlemesine anlamamızı sağlar
      .
      Öğrenmeyi hızlandıran son ve en yaratıcı araç ise Metaforlarla Düşünmek (Thinking with Metaphors) yöntemidir. Yazar çok ironik bir gerçeğe parmak basıyor: Metaforlar, benzetmeler ve mukayeseler aslında edebiyatın araçlarıdır; ancak öğrenme dünyasında en çok kimya, fizik, matematik ve finans gibi son derece katı ve teknik alanlarda işe yararlar!
      . Neden mi? Çünkü bu konular yapıları gereği fazlasıyla soyuttur ve insan beyni soyut olanı kavramak için yaratıcı ve tanıdık bir sunuma ihtiyaç duyar
      . Bir matematiksel ispatı bir metaforla açıklayabilirseniz, karmaşıklığı paramparça edip en sade haliyle sunmuş olursunuz
      .
      Tarihteki dâhiler tam olarak böyle yapmıştır. Yazarın örnekleri muazzam: Albert Einstein, o akıl almaz görecelilik (izafiyet) kuramını açıklarken, kendisini uzayda hızla hareket eden bir ışık hüzmesinin üzerinde, yüzüne bir ayna tutarken hayal etmiş ve bu metaforla ifade etmiştir
      . Charles Darwin, türlerin kökeni gibi biyolojiyi kökünden sarsan devasa teorisini açıklarken, kollarını açan dallarıyla "hayat ağacı" benzetmesini kullanmıştır
      . Ülke liderleri ve başkanlar, halka hitap ederken ulusal zorlukları aşılmaz dağlara, milletin dayanıklılığını güçlü ordulara ve ekonomik/sosyal yeniden doğuşu ise bahar mevsimine benzetmişlerdir
      . Metaforlar, en karmaşık fikirleri bile herkesin anlayabileceği şekilde resmettiğimiz tuvallerimizdir
      .
      Peki biz bu metaforları nasıl üreteceğiz? Yazar bunu, geçmiş tecrübelerimizi yeni durumlara uyarlamak, yani "tecrübeyle öğrenmek" olarak tanımlıyor
      . Önceden bildiklerimizi beynimizden dışarı çekip onlara yeni anlamlar yükleyeceğiz. Bunun için yazar beyin fırtınası yaparken şu kalıpları (açık uçlu soruları) kullanmamızı öneriyor
      :
      "Bu fikir bana [.....] hatırlatıyor."
      "Bu fikri gerçek hayatta gördüm, tıpkı [.....] gibi."
      "Bu fikirle ilgili şöyle bir olay var..."
      "Eğer bu fikirle ilgili bir hikâye anlatsaydım şöyle olurdu..."
      Yazar bölümü çok güçlü bir kapanışla bitiriyor: Toplumda "alışkanlıklar" kelimesi genellikle zararlı şeylermiş, birer bağımlılıkmış gibi algılanır. Ancak etkili öğrenme bilimi; iç disiplinimizi güçlendiren, bizi yolda tutan bu iyi alışkanlıklara aşıktır
      . Alışkanlıklarımız kim olduğumuzu belirler ve yeni bir iyi alışkanlık edinmek için asla geç değildir
      .
      Bu bölümün özü: Öğrenme sürecinizde "şüphecilik" (skepticism) yaklaşımını benimseyerek, tarihi figürlerden fiziksel yasalara kadar her bilgiyi çapraz sorguya almalı ve zihninizde kasten engeller yaratmalısınız. Sorguladığınız bu soyut ve karmaşık teknik bilgileri ise; tıpkı Einstein ve Darwin'in yaptığı gibi edebi "metaforlar" ve tanıdık günlük hayat benzetmeleri kullanarak beyninizde herkesin anlayabileceği, basit ve sarsılmaz birer tabloya dönüştürme alışkanlığı kazanmalısınız.
