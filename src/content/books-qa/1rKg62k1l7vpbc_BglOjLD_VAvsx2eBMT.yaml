ozet:
  - baslik: Kitabın Yapısı ve Yol Haritası
    icerik: |-
      İsteğiniz doğrultusunda, Keach Hagey tarafından yazılan "The Optimist: Sam Altman, OpenAI, and the Race to Invent the Future" adlı kitabın tam yapısını, 2-3 cümlelik Türkçe içerik özetlerini ve gelecekteki incelemelerde kullanabileceğiniz 5 mantıksal parçaya (Part) ayrılmış halini aşağıda sunuyorum.
      KİTABIN TAM YAPISI VE BÖLÜM (CHAPTER) İÇERİKLERİ
      Önsöz (Prologue) Peter Thiel ve Sam Altman'ın bir akşam yemeğindeki görüşmeleri üzerinden yapay zeka doomer'lığı (kıyametçiliği) ve Silikon Vadisi kültürü ele alınır
      . Altman'ın iyimser kişiliği tanıtılırken, OpenAI CEO'luğundan kovulma krizine giden yolun ilk ipuçları verilir
      .
      ### Bölüm 1: Chicago (Chapter 1) Sam Altman'ın babası Jerry Altman'ın Chicago'daki sosyal konut ve sivil toplum alanındaki çalışmaları ile ailenin Yahudi göçmen kökenleri anlatılır
      . Jerry'nin idealist yapısı ve tıp öğrencisi Connie ile tanışıp aile kurmaları detaylandırılır
      .
      ### Bölüm 2: St. Louis (Chapter 2) Altman ailesinin St. Louis'e taşınmasıyla Sam'in çocukluk ve ilk gençlik yılları ele alınır
      . Sam'in bilgisayarlara olan erken ilgisi, üstün yetenekli bir çocuk olarak okul hayatı ve muhafazakar bir çevrede eşcinsel kimliğini keşfetme süreci aktarılır
      .
      ### Bölüm 3: "Where Are You?" (Chapter 3) Sam'in Stanford Üniversitesi'ne başlaması, harıl harıl kod yazan Nick Sivo ile tanışarak romantik bir ilişkiye yelken açması ve ilk girişimcilik adımlarını atması işlenir
      . Arkadaşlarıyla birlikte cep telefonları için konum tabanlı bir uygulama (Viendo/Radiate) geliştirip Paul Graham'ın yeni başlattığı Y Combinator programına başvurmaları anlatılır
      .
      ### Bölüm 4: Among the "Nerd's Nerds" (Chapter 4) Paul Graham'ın "Y Combinator" adlı efsanevi girişimcilik kuluçka merkezini nasıl kurduğu ve Altman'ın bu gruptaki benzersiz konumu açıklanır
      . Sam'in sadece parlak bir yazılımcı değil, aynı zamanda yatırımcılarla erken yaşta devasa vizyonlar üzerinden pazarlık yapabilen stratejik bir iş adamı profili çizdiği vurgulanır
      .
      ### Bölüm 5: "Stopping Out" (Chapter 5) Altman ve kurucu ortaklarının şirketlerine odaklanmak için Stanford'dan ayrılmaları ("stopping out") ve Sequoia Capital'dan devasa bir tohum yatırımı almaları anlatılır
      . Şirketin isminin "Loopt" olarak değişmesi ve Silikon Vadisi ekosisteminde teknoloji dünyasının önemli isimleriyle tanışmaları detaylandırılır
      .
      ### Bölüm 6: "Where You At?" (Chapter 6) Loopt uygulamasının Boost Mobile ve Sprint gibi büyük operatörlerle yaptığı anlaşmalar sayesinde piyasaya çıkışı ve hızla büyümesi ele alınır
      . Ancak kullanıcıların 7/24 konum paylaşımını "ürkütücü" bulmalarıyla başlayan kullanıcı kaybı ve Altman'ın agresif gizlilik/regülasyon savunuculuğuna girişmesi incelenir
      .
      ### Bölüm 7: From "Weak" to "Cool" (Chapter 7) Steve Jobs'un iPhone'u piyasaya sürmesiyle hücresel iletişim sektörünün tamamen değişmesi ve Loopt'un Apple ekosistemine girmek için verdiği mücadele anlatılır
      . Başlarda uygulamayı "zayıf" bulan Jobs'un fikrini değiştiren Altman'ın, Apple geliştirici konferansında sahneye çıkarak büyük bir ün kazanması aktarılır
      .
      ### Bölüm 8: The Douchebag Badge (Chapter 8) Foursquare gibi yeni rakiplerin yükselişiyle Loopt'un ivme kaybetmesi ve "parlak nesne sendromu" (shiny object syndrome) nedeniyle Altman ile çalışanları arasında yaşanan liderlik krizleri ele alınır
      . Hatalarına rağmen Silikon Vadisi elitleriyle ilişkilerini sıkı tutan Altman'ın, Loopt'u 43 milyon dolara Green Dot şirketine satıp yeni ufuklara yelken açması işlenir
      .
      ### Bölüm 9: "A Ride on a Rocket" (Chapter 9) Altman'ın Loopt sonrası Peter Thiel'in desteğiyle kendi yatırım fonu Hydrazine Capital'i kurması ve Stripe, Airbnb gibi efsanevi şirketlere erken aşama melek yatırımlar yapması anlatılır
      . Geniş vizyonuyla yatırımcıları büyüleyen Altman'ın, 2014 yılında bizzat Paul Graham tarafından Y Combinator'ın başkanı olarak seçildiği sürece odaklanılır
      .
      ### Bölüm 10: "Sam Altman for President" (Chapter 10) Y Combinator'ı bir startup fabrikasından çıkarıp devasa bilimsel moonshot'ları (nükleer enerji vb.) finanse eden bir deve dönüştürmesi işlenir
      . Bu süreçte Altman'ın siyasete duyduğu yoğun ilgi, Evrensel Temel Gelir (UBI) projeleri ve Kaliforniya Valiliği'ne hatta başkanlığa adaylık fikrini değerlendirmesi ele alınır
      .
      ### Bölüm 11: "A Manhattan Project for AI" (Chapter 11) Büyük teknoloji şirketlerinin (özellikle Google/DeepMind) yapay zeka tekelinden korkan Elon Musk ve Sam Altman'ın bir araya gelmesi ve AGI yolunda kâr amacı gütmeyen OpenAI laboratuvarını kurmaları anlatılır
      . Ilya Sutskever ve Greg Brockman gibi efsanevi araştırmacıların 1 milyar dolarlık vaatlerle şirkete nasıl çekildiği ve girişimin manifestosu aktarılır
      .
      ### Bölüm 12: Altruists (Chapter 12) Etkin Fedakârlık (Effective Altruism - EA) hareketinin felsefesi ve bu akımın OpenAI'ın yönetim kademesiyle olan organik bağı incelenir
      . OpenAI'ın erken dönem projelerindeki bocalayışları, vizyon arayışları ve Open Philanthropy'den alınan bağışın şirket hedeflerindeki etkisi detaylandırılır
      .
      ### Bölüm 13: Pivoting to Profit (Chapter 13) OpenAI'ın araştırma için gereken korkunç devasa "compute" (işlem gücü) maliyetlerini karşılamak adına mecburen "capped-profit" (kâr tavanlı) bir modele geçmesi ele alınır
      . Şirketin kontrolünü tamamen isteyen Elon Musk'ın talebinin reddedilmesi üzerine yaşanan ayrılık ve Microsoft ile yapılan tarihi milyar dolarlık bulut-bilişim/yatırım anlaşması anlatılır
      .
      ### Bölüm 14: Products (Chapter 14) Transformers mimarisinin icadıyla GPT-2 ve GPT-3'ün ortaya çıkışı, yapay zekanın şaşırtıcı yazım gücüne ulaşması ve bu modellerin ürünleşmeye başlaması işlenir
      . Yapay zekanın tehlikelerine odaklanan güvenlik araştırmacıları (Dario Amodei ve ekibi) ile ürün odaklı ekip arasında çıkan çatışma sonucu Anthropic'in kuruluşu anlatılır
      .
      ### Bölüm 15: ChatGPT (Chapter 15) OpenAI'ın InstructGPT çalışmaları ile DALL-E 2'yi duyurmasının ardından, GPT-4 öncesi bir sohbet arayüzü olan ChatGPT'nin Kasım 2022'de efsanevi çıkışı anlatılır
      . Ürünün Google'da "kırmızı kod" alarmı verdirmesi, 100 milyon kullanıcıya rekor sürede ulaşması ve Altman'ın yapay zeka regülasyonları için küresel bir devlet başkanları turuna çıkması aktarılır
      .
      ### Bölüm 16: The Blip (Chapter 16) Bağımsız OpenAI yönetim kurulunun, İlya Sutskever ve Mira Murati'nin de geri bildirimleriyle Altman'ı "yeterince dürüst olmamakla" suçlayarak şok edici bir şekilde şirketten kovması incelenir
      . Sadece beş gün süren büyük krizin ardından Microsoft'un desteği ve çalışanların istifa isyanı sonucunda Altman'ın CEO koltuğuna çok daha güçlü biçimde dönmesi detaylandırılır
      .
      ### Bölüm 17: Prometheus Unbound (Chapter 17) Kriz sonrası OpenAI'ın yeni yönetim kuruluyla yoluna devam etmesi, Altman'ın kişisel hayatındaki gelişmeler (evliliği) ve 7 trilyon dolarlık devasa çip tedarik vizyonu ele alınır
      . Ilya Sutskever'in şirketten ayrılışına ve Elon Musk ile devam eden hukuki savaşlara rağmen OpenAI'ın kâr amacı güden dev bir şirkete dönüşerek 157 milyar dolar değerlemeye ulaşması işlenir
      .
      Sonsöz (Epilogue) Altman'ın dünyayı dönüştüren teknolojik vizyonunun yanı sıra ailesiyle yaşadığı (özellikle kız kardeşi Annie ile devam eden dava süreci) kişisel ve dramatik sorunlar son kez gözden geçirilir
      . Yapay Zeka Çağı'na (Intelligence Age) ulaşma yolunda ilerleyen Altman'ın, tüm eleştirilere ve düşmanlıklara rağmen insan dehasına ve evrenin fethedilebileceğine dair sarsılmaz inancıyla kitap noktalanır
      .
      DERİNLEMESİNE İNCELEME İÇİN 5 MANTIKSAL PARÇA (KİTAP BÖLÜMLEMESİ)
      Kitabı sonraki adımlarda detaylıca inceleyebilmeniz için içerik ve kronolojik dönüm noktalarını baz alarak şu 5 ana faza ayırdım:
      Parça 1: Kökler, Karakter ve İlk Adımlar (Önsöz, Bölüm 1 - 4)
      Kapsam: Sam Altman'ın aile geçmişi, çocukluğu, üstün zekasının ilk pırıltıları, eşcinselliğini keşfetme süreci, Stanford yılları ve "Viendo/Radiate" fikriyle girişimcilik dünyasına ilk atılımı. Y Combinator'ın efsanevi ilk öğrenci grubuna girmesiyle Silikon Vadisi mentalitesini kavraması.
      Parça 2: Silikon Vadisi Sınavı ve Loopt Macerası (Bölüm 5 - 8)
      Kapsam: Okulu bırakıp tamamen şirketine (Loopt) odaklandığı dönem. Sequoia gibi devlerden yatırım koparma süreci, Steve Jobs ve telekom şirketleriyle yapılan çetin müzakereler, Foursquare gibi rakiplerle mücadele ve başarısız giden bir şirketi Green Dot'a satarak yaptığı ilk "zarardan kârla çıkış" (exit) süreci.
      Parça 3: Y Combinator Liderliği ve OpenAI'ın Doğuşu (Bölüm 9 - 11)
      Kapsam: Altman'ın melek yatırımcı olarak devasa ün ve servet kazanması (Stripe, Airbnb yatırımları), Paul Graham'dan Y Combinator başkanlığını devralması. Vizyonunun nükleer enerji ve UBI gibi devasa konulara genişlemesi ve Elon Musk ile bir araya gelerek kâr amacı gütmeyen OpenAI'ı kurmaları.
      Parça 4: Güvenlik, Etkin Fedakarlık ve Kâra Geçiş (Bölüm 12 - 14)
      Kapsam: Effective Altruism (Etkin Fedakârlık) ideolojisinin ve yapay zeka risk korkusunun OpenAI içine sızması. Araştırma laboratuvarının AGI hedefi uğruna gereken devasa bütçe (compute) baskısıyla "capped-profit" modeline geçmesi, Elon Musk'ın şirketi terk etmesi ve GPT modellerinin inşasıyla ürünleşme ve şirket içi felsefi bölünmeler (Anthropic'in ayrılışı).
      Parça 5: ChatGPT Devrimi, Yönetim Krizi ve Yeni Çağ (Bölüm 15 - 17, Sonsöz)
      Kapsam: DALL-E ve ChatGPT'nin dünyayı sarsması, Google'ın tahtının sallanması. Akabinde bağımsız yönetim kuruluyla yaşanan "kovulma/Geri Dönüş" (The Blip) süreci. Sam Altman'ın zaferi, trilyon dolarlık yapay zeka altyapı vizyonu ve OpenAI'ı Silikon Vadisinin klasik dev bir kâr odaklı şirketine tamamen dönüştürme yolculuğu.
  - baslik: Parça 1 · Kökler, Karakter ve İlk Adımlar (Önsöz, Bölüm 1-4)
    icerik: |-
      Harika bir derinlemesine okuma yolculuğuna çıkıyoruz. İsteğine uygun olarak, yazar Keach Hagey'in argümanlarını, sunduğu tüm kanıtları, anekdotları ve vaka analizlerini adım adım takip ederek bu ilk dört bölümü (ve önsözü) sana bir arkadaşımla derin bir sohbet ediyormuşuz gibi, ama konunun ciddiyetini de bir an olsun elden bırakmadan, detaylıca yeniden anlatacağım. Kavramların orijinallerini koruyacak, soyut yerlerde analojilerle zihninde canlandırmanı sağlayacağım. Başlıyoruz.
      Önsöz (Prologue): Silikon Vadisi’nin Zirvesi, İyimserliğin Bedeli ve Yapay Zeka Kıyameti
      Hikayemiz, Kasım 2023'te, Los Angeles'ın Sanat Bölgesi'nde, eski bir banka binasından bozma avangart Japon restoranı YESS'te başlıyor
      . Ünlü risk sermayedarı (venture capitalist) Peter Thiel, kocası Matt Danzeisen için bir doğum günü partisi veriyor ve yanında, on yıldan uzun süre önce ilk yatırım fonunu desteklediği, şimdi ise OpenAI'ın CEO'su olarak yapay zeka devriminin yüzü haline gelmiş olan Sam Altman oturuyor
      . Yazar, bu sahneyi bize sıradan bir akşam yemeği olarak değil, Silikon Vadisi'nin felsefi bir çatışma alanı olarak sunuyor. Çünkü Thiel, Altman'ın ChatGPT ile elde ettiği devasa başarıya (sadece 3 ayda 100 milyon kullanıcıya ulaşarak tarihin en hızlı büyüyen uygulaması olması)
       rağmen inanılmaz derecede endişeli
      . Neden mi? Çünkü Thiel'e göre OpenAI, "EA" (Effective Altruism - Etkin Fedakârlık) felsefesini benimseyen "yapay zeka güvenlikçileri" (AI safety people) tarafından ele geçirilmiş durumda
      .
      Thiel'in argüman zinciri burada çok net: Yıllar önce Eliezer Yudkowsky adında bir yapay zeka dehasını kanatları altına almıştı, ancak Yudkowsky zamanla son derece "black-pilled" (umutsuzluğa kapılmış) ve "Luddite" (teknoloji düşmanı) birine dönüşmüştü
      . Yudkowsky'nin argümanı kabaca şuydu: "Yapay zeka gelip hepimizi öldürene kadar yapabileceğiniz tek şey Burning Man'e gidip uyuşturucu kullanmaktır"
      . Hatta Time dergisinde, eğer mevcut üretken yapay zeka (generative AI) araştırmaları durdurulmazsa "Dünya üzerindeki herkes kelimenin tam anlamıyla ölecek" diye yazmıştı
      . Thiel, Altman'ı bu felsefenin şirketini içeriden çürüttüğü konusunda uyarıyor: "Eliezer'in şirketindeki insanların yarısını bu saçmalıklara inanmaya nasıl programladığını anlamıyorsun" diyor
      .
      Altman ise bu kıyamet senaryolarına gözlerini devirmemek için kendini zor tutuyor ve vejetaryen yemeğiyle oynarken iyimserliğini koruyor
      . "Elon (Musk) için de bu geçerliydi ama ondan kurtulduk" diyerek, Musk'ın yapay zeka geliştirmeyi "iblis çağırmak" olarak nitelendirmesine atıfta bulunuyor
      . Ardından, kendisine güvenmeyip kendi rakip laboratuvarlarını kurmak için 2020'de ayrılan bir grup OpenAI çalışanını kastederek "Sonra Anthropic insanları vardı, onlarla da yollarımızı ayırdık" diyor
      . Altman'a göre panik yapacak bir şey yok; şirket 80 milyar doların üzerinde bir değerlemeye (valuation) ulaşıp çalışanlarına sahil evleri aldıracak bir roketin üzerinde gidiyor
      . Yazar, Altman'ın bu noktadaki temel gücünü açıklıyor: O sadece bir kodlayıcı değil, vizyoner bir anlaşma yapıcı, 19. yüzyıl tabiriyle bir "promoter" (teşvik edici, pazarlamacı)
      . Mentoru Paul Graham'dan öğrendiği "add a zero" (bir sıfır ekle) etosuyla, ne kadar imkansız görünürse görünsün, vizyonunu milyarlara ulaştırma yeteneğine sahip
      .
      Ancak yazar, Thiel'in karamsarlığının tam da bu noktada isabetli olduğunu gösteriyor. Onlar restoranda kutlama yaparken, OpenAI'ın bağımsız kâr amacı gütmeyen (nonprofit) yönetim kurulu, Altman'ı kovmak için gizli toplantılar yapıyor
      . Bu çok garip bir yapı; yatırımcılara, şirketin amacının (tüm insanlığa fayda sağlamak) finansal getiri sağlamaktan daha önemli olduğu açıkça söylenmiş, hatta insanlığın çıkarı için gerekirse paralarının sıfırlanabileceği uyarısı yapılmıştı
      . Altman, Mark Zuckerberg gibi ebedi kral olmasını sağlayacak süper oy haklarına sahip değildi, hatta şirkette neredeyse hiç hissesi (equity) yoktu
      . Yazarın vardığı sonuç çarpıcıdır: Yönetim kurulu, Altman'ı yapay zekayı çok hızlı geliştirdiği için değil, onun Silikon Vadisi'nin standart, yatırımcıyı parmağında oynatan "kurucu CEO" (founder-friendly) dehasından ve perde arkasındaki devasa gücünden korktukları, ona güvenemedikleri için kovmuştur
      . Nitekim yazar Altman ile aylar önce San Francisco'daki eski bir mayonez fabrikası olan isimsiz OpenAI ofisinde görüştüğünde
      , ofisin bir tarikat gibi iyilik saçan (cultish do-goodery) havasını (Stanford kütüphanesine benzeyen okuma odaları, plak çalarlar, merkezi bir merdiven) gözlemlemiş
       ve Altman'ın aslında teknoloji değil "inanç sattığı" (selling belief) sonucuna varmıştır
      . Altman tüm bunları sadece dünyayı dönüştürmek için yapmaktadır. Hatta nükleer füzyon (Helion), ömür uzatma, Evrensel Temel Gelir (UBI - Worldcoin) gibi devasa felsefi yatırımlarıyla kendi deyimiyle "tüm geleceği yapmak" (make the whole future) istemektedir
      . Altman için her şey bir rüyadır (Advaita felsefesi) ve rüyada her şey mümkündür
      .
      Bu bölümün özü: Silikon Vadisi, yapay zekanın insanlığı yok edebileceğine inanan karamsarlar ile her sorunun teknolojiyle çözülebileceğine inanan iyimserler arasında ikiye bölünmüştür. Sam Altman bu radikal iyimserliğin vücut bulmuş halidir; ancak onun teknolojiden ziyade "inanç satma" konusundaki bu manipülatif ve dizginlenemez gücü, kendi kurduğu şirketin yönetim kurulunu bile dehşete düşürerek onun kısa süreliğine kovulmasına zemin hazırlamıştır.
      ### Bölüm 1: Chicago - Bir İdealistin ve Bir Savaşçının Birleşimi (Kökler)
      Bu bölüm, Sam Altman'ın nasıl bir genetik ve kültürel mirasın ürünü olduğunu çok derin bir aile geçmişiyle anlatıyor. Yazar Hagey, hikayeye 1983'te Chicago'da başlıyor. Chicago'nun ilk siyah belediye başkanı Harold Washington'ın yemin töreninde coşkulu bir kalabalık var
      . Kalabalığın içinde, bu taban hareketinin (grassroots effort) parçası olmuş otuzlu yaşlarının başındaki Jerry Altman (Sam'in babası) gururla izliyor
      . Yazar, Jerry'nin karakterini burada bir vaka analiziyle kuruyor: O bir sokak eylemcisi değildi; kapılara ölü fare çivileyen meşhur organizatörler Gale Cincotta ve Shel Trapp ile çalışıyordu ama kendi uzmanlık alanı finans ve "uygun fiyatlı konut" (affordable housing) projeleriydi
      . Jerry'nin temel argümanı şuydu: Şirketlere, yoksullara konut yapmanın kendi kârlarına olduğunu gösterebilirsek devasa bir etki yaratabiliriz
      . Nitekim vergi kanunundaki bir boşluğu kullanarak Aetna gibi dev şirketleri ikna etmiş, hatta Dan Rostenkowski ile çalışarak bugün hala kullanılan federal Düşük Gelirli Konut Vergi Kredisi (Low-Income Housing Tax Credit) programının mimarlarından biri olmuştur
      . Jerry, kapalı kapılar ardında iş dünyasıyla toplumu uzlaştıran iyimser bir anlaşma yapıcıydı
      .
      Peki Jerry bu vizyonu nereden aldı? Yazar, bizi Yahudi göçmen aile tarihine götürüyor. Sam Altman'ın büyük-büyükbabası Harry Altman, 1904'te Rus-Japon Savaşı'nda Sibirya'da savaşmamak için Polonya'dan (Płock) kaçıp ABD'ye geliyor
      . Eşi Birdie ise gerçek bir savaşçı; Georgia'da aldıkları ticari bina anlaşması ters gidince mahkemeye gidip Georgia Yüksek Mahkemesi'nde davayı kazanacak kadar çetin bir iş kadını
      . Aile ayakkabıcılığa giriyor (Altman's Shoes). Jerry'nin babası Jack Altman ise İkinci Dünya Savaşı'nda uçmuş, daha sonra St. Louis'te Deb Shoe Company'yi kurup zengin olmuş, işkolik ve baskıcı bir baba
      . Ailede büyük bir travma var: Jack'in eşi (Jerry'nin annesi) Sylvia, 1958'de düşüp kalçasını kırdıktan sonra enfeksiyondan sadece 36 yaşında ölüyor
      . Jack hemen sekreteri Thelma ile evleniyor. 7 yaşındaki Jerry Thelma'yı anne gibi benimserken, abisi ve ablası reddediyor ve ailede asla kapanmayan bir çatlak oluşuyor
      . Jerry, St. Louis'in katı ırk ayrımcılığına (redlining) ve meşhur Pruitt-Igoe gibi başarısız devasa toplu konut projelerine bizzat şahit olarak büyüyor
      . İşkolik babasına benzememeye yemin ediyor; zenginleşmek yerine dünyayı iyileştirmeye (do good) karar veriyor
      . Wharton'da okuyor, Hartford'da güneş enerjisi kooperatifleri gibi uçuk vizyonlar deniyor
      , ilk eşi Megan O'Neill'den boşandıktan sonra Chicago'da yukarıda bahsettiğimiz konut politikası dehasına dönüşüyor
      .
      Gelelim anne tarafına. Sam'in annesi Connie Gibstine, Jerry'nin tam zıttı bir profildir: Hırslı, son derece rekabetçi, pratik ve doğrudan
      . Gibstine ailesi de Rusya'dan gelmiş, şapkacılıktan gayrimenkule geçmiş bir ailedir
      . Connie'nin büyükbabası Herman, şapka fabrikasını gece açık bırakıp çıkan yangından sonra sigorta dolandırıcılığından kaçıp tutuklanmış, sonra St. Louis'te gayrimenkul işine dönmüş tuhaf bir karakterdir
      . Connie'nin babası Marvin ise tam bir "bilim insanı zihnine" (science brain) sahiptir; bir radyologdur, evinin bodrumuna ranzalı ve tuvaletli koca bir nükleer sığınak (bomb shelter) inşa etmiştir (Soğuk Savaş paranoyası) ve sürekli kısa dalga radyo (ham radio) üzerinden dünyayla konuşur
      . Connie, babasının izinden giderek dermatolog olur. Çok çalışkandır. Chicago'da asistanlık yaparken 1980'lerde AIDS krizinin en korkunç yüzünü görür, genç eşcinsel erkeklerin gözleri önünde eriyip gitmesi onda derin bir fiziksel güvenlik travması yaratır
      .
      Connie ve Jerry evlenirler
      . Hatta Connie, sırf Jerry'yi "odaklamak" için onunla birlikte Loyola Üniversitesi'nde gece hukuk fakültesine bile yazılır; hamileyken baro sınavlarına girer
      . Nisan 1985'te Sam doğar
      . Sam daha bebekken bile bir "yetişkin" gibidir. 2 yaşındayken VCR'a kendi başına Susam Sokağı kasetlerini takar, parkta kaydıraktan kaymak yerine annesiyle oturup "bebekleri" (kendisinden büyük çocukları) izlemek ister
      . 3 yaşında St. Louis'i aramak için "alan kodlarının" mantığını kavrar
      . Ancak Chicago'da hayat zordur, Jerry sürekli iş için seyahat etmektedir. Connie, market arabalarının çalınmasını engellemek için kurulan direklerden tutun da vergilere kadar her şeyden sıkılmıştır. Dört çocuklu (Sam, Max, Jack, Annie) aile, daha kolay bir yaşam için St. Louis banliyölerine (Clayton) geri dönmeye karar verir
      .
      Bu bölümün özü: Sam Altman'ın DNA'sı iki güçlü mirasın sentezidir: Baba tarafından gelen, iş dünyasıyla toplumsal faydayı inatçı bir iyimserlikle aynı masada buluşturan vizyoner anlaşma yapma yeteneği ve anne tarafından gelen, asla pes etmeyen, acımasız bir iş ahlakı ile bilimsel-analitik zeka. Altman, imkansız gibi görünen büyük projeleri işte bu genetik kombinasyon sayesinde hem tasarlayabilmiş hem de satabilmiştir.
      ### Bölüm 2: St. Louis - Özel Bir Çocuğun Şekillenmesi ve İlk Başkaldırılar (Çocukluk)
      Altman ailesi, St. Louis'in Clayton banliyösüne, Grimm masallarından fırlamış gibi duran evlerin olduğu, güvenli ve düzenli Hillcrest mahallesine taşınır
      . Yazarın burada sunduğu iddia şudur: Sam Altman'ın insanlığın doğası gereği ortak iyilik etrafında örgütlenebileceğine dair sarsılmaz inancı, tam da çocukluğunu geçirdiği bu steril ve düzenli banliyö hayatından kaynaklanmaktadır (yıllar sonra petrikor -yağmur sonrası toprak kokusu- üzerinden duyduğu nostalji bunun kanıtıdır)
      . Ancak evde gizli bir gerilim vardır. Jerry, inandığı "kutuplaşmacı olmayan" sivil toplum modelini St. Louis'te uygulamakta zorlanmaktadır çünkü buranın belediye başkanı federal fonları yoksul konutları yerine zengin bölgelere ve patronaj işlerine harcamaktadır
      . Jerry bu duruma çok öfkelense de sesini nadiren yükseltir
      . Connie ise Jerry'nin dünyayı kurtarmak uğruna sürekli seyahat etmesine ve çocukları ona bırakmasına öfkelidir
      . Ailenin en küçük çocuğu Annie'nin sonradan belirttiği gibi, Jerry eve geldiğinde Connie'nin pasif agresif tavırlarına boyun eğip sessizce bulaşıkları yıkayan bir babaya dönüşmüştür
      .
      Buna rağmen Connie, çocuklarına her gün "istediğiniz her şey olabilirsiniz" mesajını aşılamaktadır
      . Akşam yemeklerinde matematik oyunları ve "20 Soru" oynanır, Sam her oyunda (örneğin Samurai kart oyununda) kuralı kendi koyup kazanmayı kafaya takan bir çocuktur
      . Kardeşler arasında (Max matematik dehasıdır, Jack her standart testten tam puan alır, Annie çok zekidir) "Annemin en sevdiği" (Mom's favorite) olmak için kıyasıya ama şakayla karışık bir rekabet vardır, hatta bu yazılı tişörtler bile bastırılır
      . Ancak Sam'in özel yanı zekasından çok, yetişkin dünyasına duyduğu tuhaf rahatlık ve annesine olan derin sadakatidir. Connie, Sam için "10 yaşındayken onu New York'a bıraksanız hayatını nasıl kuracağını çözerdi" der
      . Aile, Reform Yahudiliği'nin ilerici sinagogu olan Central Reform Congregation'a (CRC) gider. Sam burada "Tikkun Olam" (dünyayı onarmak) kavramıyla büyür; sinagogun mozaiklerinde dövmeli trans bir mesih tasviri bile vardır
      . Bu sosyal adalet temeli Altman'ın ileride yapay zekayı bir kamu malı olarak görme vizyonunu şekillendirecektir.
      Sam'in teknolojiyle tanışması 8. yaş gününde alınan Mac LC II bilgisayarı ile olur
      . İlkokulda bilgisayar laboratuvarındaki BASIC diliyle "Birden milyona kadar tüm asal sayıları yazdır" gibi komutlar yazar, ama sıkılır. O yaşlarda yatağında oturup "Ya bu bilgisayar her satırı benim yazmamı beklemek yerine kendi kendine düşünmeyi öğrenirse?" diye hayal kurar. İlkokul öğretmenleri bile yapamadıkları işlemleri ona sorarlar
      . Ancak devlet ortaokulu onun için bir kaostur; sınıfta bir öğrencinin fiziksel olarak dışarı atılmasına şahit olunca, bölgenin en seçkin ve zorlu özel okulu olan John Burroughs School'a (JBS) 7. sınıftan itibaren geçiş yapar
      .
      John Burroughs, öğrencileri ezici bir akademik baskı altına alan ama dolaplara kilit bile vurulmayan güvenli bir yerdir
      . Sam burada parlar. Sadece bilgisayarlarla (C++ kitabı okuması) değil, aynı zamanda felsefe ve politikayla da ilgilenir. Okul müdürü onu sosyolog Malcolm Gladwell'e benzetir
      . Yazar burada ilginç bir kanıt sunar: Sam, Jet Ski ile Miami'den Bahamalar'a gitmek isteyen bir arkadaşına, o yaşta bir gencin bilmesinin imkansız olduğu deniz telsizi frekansları ve dört zamanlı motor teknolojisiyle ilgili detaylı tavsiyeler verir
      . Çünkü Sam, yaz kamplarında tüplü dalış öğrenmiş ve dedesi Marvin gibi "kısa dalga radyo" (ham radio) kulübüne katılmıştır. Sam'in en büyük yeteneği, teknoloji ve ekstrem bilgileri kullanarak her türlü insanla iletişim kurabilmesidir
      .
      Bu yıllardaki en büyük içsel mücadelesi eşcinsel olduğunu keşfetmesidir. 12 yaşında gay olduğunu anlar, ancak Orta Batı'nın muhafazakar ortamında bu büyük bir yüktür
      . AOL sohbet odaları (AIM) onun için bir kurtarıcı olur; anonim olarak diğer insanlarla iletişim kurar
      . 16 yaşında annesine açıldığında, annesinin ilk tepkisi (Chicago'daki AIDS hastalarını hatırlayarak) fiziksel güvenliği için dehşete düşmek olur ve "Emin misin?" diye sorar. Sam'in cevabı tokat gibidir: "Sen kendi cinselliğini düşünmedin anne, çünkü sen normaldin. Farklı olduğunda bunu fark edersin."
       Lisedeki yakın grubu Sally Che ve ileride erkek arkadaşı olacak Nathan Watters'tır. Coffee Cartel'de gece yarılarına kadar kahve içip çalışırlar, Blink-182 dinleyip annesinin arabasında 90 milde koltuk değiştirme gibi tehlikeli ve adrenalin dolu işler yaparlar
      . Watters, Sam'in Oscar Wilde'ın Dorian Gray'in Portresi kitabına takıntılı olduğunu ve sürekli bir "gençlik arayışında" olduğunu söyler
      . Lise son sınıfta okul idaresi, Gay Straight Alliance'ın düzenlediği eşcinsel farkındalık toplantısına KLIFE adlı Hristiyan grubun katılmamasına izin verince, Sam büyük bir liderlik örneği gösterir. Sabah toplantısında tüm okula karşı kürsüye çıkar ve idarenin bu kararının "korkunç bir mesaj verdiğini" söyleyerek açıkça isyan eder
      . Bu olay okulda büyük yankı uyandırır.
      Üniversite başvuru zamanı geldiğinde Harvard, Stanford ve tam burslu UNC (Morehead-Cain) kazanır. Maddi olarak aileyi zorlamamak için UNC'ye gitmeyi teklif etse de, annesi gay ve Yahudi bir çocuk için Güney'in uygun olmayacağını düşünerek onu hayalindeki Stanford'a gönderir
      .
      Bu bölümün özü: Sam Altman'ın çocukluğu ve ilk gençliği, hem aşırı entelektüel hem de duygusal olarak son derece steril ama beklentileri yüksek bir çevrede geçmiştir. Eşcinsel kimliğini keşfetmesi ve bu uğurda otoriteye karşı çıkması, ona toplumun koyduğu sınırları (ister teknolojik ister sosyal olsun) sarsılmaz bir özgüven ve yüksek risk toleransıyla aşabileceğini öğretmiştir.
      ### Bölüm 3: "Where Are You?" - Stanford, Paul Graham ve İlk Kırılma Noktası (İlk Girişim)
      Yıl 2005, Stanford Üniversitesi. Nisan ayında yağmurlu bir sabahta, 18 yaşındaki ikinci sınıf öğrencisi Sam Altman, erkek arkadaşı Nick Sivo'nun Batı kampüsündeki izole FroSoCo yurdundaki yatağında uyanır
      . Bu, onun hayatının en kritik 36 saati olacaktır. Yazar burada Sivo'yu tanıtıyor: Teksaslı, Mormon, Eagle Scout, kendini tamamen kodlamaya adamış ve Microsoft'un QBasic dillerini kendi kendine öğrenmiş solgun tenli bir deha
      . İkili ilk yıl CS106X bilgisayar bilimi sınıfında tanışmış, Altman'ın elindeki tuhaf, şekilden şekle giren Compaq TC1000 "laplet" bilgisayarı Sivo'nun dikkatini çekmiştir
      .
      Altman, Stanford'daki ilk yılını tam bir çılgınlık içinde geçirmiştir. Gay evliliğini savunan ulusal düzeyde hırslı yazılar yazmış, Peter Thiel'in kurduğu muhafazakar Stanford Review'a savaş açmıştır
      . Diğer yandan kodlamada o kadar saplantılıdır ki, bir ödevde hata mesajı alınca, derleyiciyi (compiler) baştan aşağı parçalayarak yeniden yazmıştır (bunu arkadaşı Blake Ross "espresso makinesini yaprak motifi hatalı diye baştan kablolamak" olarak tanımlar)
      . Altman'ın bitmek bilmeyen hırsı için en iyi örnek, birinci sınıfta eline bir Excel tablosu alıp gelecekte üzerinde çalışmak istediği konuları sıralamasıdır: 1) Yapay Zeka, 2) Nükleer Enerji, 3) Eğitim
      . Yaz aylarında Andrew Ng'nin otonom helikopter laboratuvarında çalışarak GPS ve konum teknolojilerini öğrenir ve Sivo ile çıkmaya başlarlar
      . Ayrıca kampüs dışında Bay 101 adlı köhne bir kumarhanede düşük limitli poker oynayarak "risk yönetimini" öğrenir ve kazandığı parayla sürekli Apple hissesi alır
      .
      Bu dönemde cep telefonu sektörü büyük bir değişim geçirmektedir. ABD Kongresi (FCC), acil durumlar için tüm cep telefonlarına konum belirleme zorunluluğu (E911) getirmiştir (Sprint gibi operatörler cihazlarına fiziksel GPS çipleri takmaktadır)
      . Gizlilik savunucuları bunu bir "gözetim sistemi" olarak görse de Altman, bu yasal zorunluluğu devasa bir iş fırsatı olarak görür. Yanında yurdundan arkadaşı matematik dehası Alok Deshpande ve işin sunum/pazar araştırma kısmını halledecek Peter Deming vardır
      . Fikir basittir: İnsanların cep telefonlarında en çok sorduğu soru "Neredesin?" (Where are you?) sorusudur. Google Haritalar daha yeni çıkmıştır. Onlar ise arkadaşlarınızın konumunu haritada canlı olarak gösteren "Viendo" (İspanyolca "görme") adlı bir sosyal ağ tasarlarlar. Hedef kitle elbette kampüste her an birbirini bulmak isteyen özgür ve sorumsuz üniversite öğrencileridir
      .
      Ekip, Stanford BASES (Girişimci Öğrenciler İşletme Birliği) iş planı yarışmasına katılır. Yazar burada Altman'ın "Gerçeklik Çarpıtma Alanı"na (Reality Distortion Field - Steve Jobs'un efsanevi ikna gücü) sahip olduğunu vurgular
      . Sahnede ürünü öyle bir satar ki, yarışmayı kazanırlar ve jürideki 20'li yaşlarının sonundaki New Enterprise Associates (NEA) yatırımcısı Patrick Chung'ın aklını başından alırlar. Chung, McKinsey kökenli, takım elbiseli bir adamdır
      . Altman'a "Bunu gerçekten yapmak istiyor musunuz?" diye sorar ve Sprint'in CTO'su ile bir toplantı ayarlayabileceğini söyler
      . Ancak tek bir şartı vardır: Eğer yatırımcılar ikna olursa, okulu bırakmak (dropping out veya onların yumuşattığı haliyle stopping out) zorundadırlar
      .
      Aynı günün akşamı Altman'ı çok daha kritik bir sınav beklemektedir. Efsanevi hacker ve yazar Paul Graham (PG), sevgilisi Jessica Livingston ve eski ortaklarıyla "Y Combinator" adında yeni bir yatırım/kuluçka modeli başlatmıştır
      . Yaz Stajı programı gibi olan "Summer Founders Program", öğrenci gruplarına 6.000 dolar verip 3 ay boyunca Cambridge'de onları kuluçkaya alacaktır
      . (Bu miktar MIT'nin yaz stajı maaşına eşittir). Altman'ın ekibindeki Sivo ve Deshpande'nin Goldman Sachs ve benzeri yerlerde yaz stajları olduğu için programa katılmak istemezler
      . Altman ise 32 soruluk başvuruyu tek başına doldurur
      . YC'den mülakat daveti gelince, Stanford'daki yarışma ile aynı haftasonuna denk düştüğünü görür. PG, "Daha ikinci sınıfsın, seneye başvur" dese de Altman itiraz eder: "İkinci sınıfım ve mülakata geliyorum."
       Kırmızı göz (red-eye) gece uçuşuyla Boston'a iner, lise arkadaşı Rick Pernikoff'un frat (öğrenci birliği) evinin zemininde uyur ve sabah mülakata gider
      .
      YC'nin Garden Street'teki yeşil, sanatsal ama derme çatma binasında 25 dakikalık mülakata girer
      . PG ve ekibi Altman'ın olgunluğu karşısında büyülenirler. PG, "Görüşmenin üçüncü dakikasında, 'Ah, demek Bill Gates 19 yaşındayken böyle biriydi' diye düşündüm" diyecektir
      . Altman da sonunda ait olduğu insanları, kendi gibi düşünenleri bulduğunu hisseder
      . Pazar akşamı PG arar ve Viendo'nun kabul edildiğini, hatta Y Combinator'ın yatırım yaptığı ilk şirket olduklarını söyler
      . Sadece 36 saat içinde Altman, hayatını değiştirecek yatırımcılarla tanışmış ve Silikon Vadisi'nin gelecekteki en güçlü ağının merkezine yerleşmiştir.
      Bu bölümün özü: Sam Altman'ın Stanford'daki yılları, parlak zekasıyla akademik sınırları zorlamasından ziyade, "doğru anı" yakalayıp risk alabilme ve yatırımcıları manipüle etme becerisini keşfettiği dönemdir. Telefonların GPS ile donatılması gibi bürokratik bir hamleyi kişisel bir teknoloji fırsatına dönüştürmesi ve okulu bırakma pahasına Paul Graham'ın radarına girmesi, onun girişimci zekasının ilk büyük kanıtıdır.
      ### Bölüm 4: Among the "Nerd's Nerds" - Y Combinator, Silikon Vadisi Kültürü ve Telekom Devleriyle Dans
      Bu bölüm, Paul Graham'ın (PG) Silikon Vadisi'nde yarattığı kültürü ve Sam Altman'ın bu kültür içindeki eşsiz konumunu inceliyor. Yazar öncelikle PG'nin bir profilini çıkarıyor. PG, her daim kargo şort ve sandalet giyen, milyoner olduktan sonra kimseye kendini beğendirmek zorunda olmayan bir "hacker"dır
      . Felsefe, yapay zeka ve resim okumuştur. 1995'te arkadaşı Robert Tappan Morris (tarihteki ilk bilgisayar solucanını yazan kişi) ile galerileri internete taşımak için Artix'i kurarlar
      . Ancak galerilerin bunu istemediğini fark edince (çünkü sanat piyasası şeffaflık istemez), sistemi "insanların istediği bir şeye" dönüştürüp, web sitesi yapma aracı olan Viaweb'i kurarlar ve Yahoo'ya 49 milyon dolara satarlar
      . PG'nin en büyük dersi şudur: Kurucular çok dar düşünmektedir. "İnsanların İstediği Bir Şeyi Yapın" (Make Something People Want) felsefesi buradan doğar
      .
      PG'nin bir diğer büyük davası "Risk Sermayedarı İğrençliğinin Birleşik Teorisi"dir (A Unified Theory of VC Suckage). PG'ye göre geleneksel VC'ler açgözlü, korkak ve zorbadır
      . Çok para yönettikleri için şirketlerin değerlemelerini şişirirler ve en ufak sorunda teknik bilgiye sahip orijinal kurucuları kovup yerlerine saçları düzgün taranmış, teleprompter'dan metin okuyan "haber sunucularını" (newscasters) CEO yaparlar
      . PG ve bankacılıktan gelip bu sisteme isyan eden sevgilisi Jessica Livingston, VC dünyasını içeriden yıkmak için Y Combinator'ı kurarlar
      . Model şudur: Az sayıda şirkete milyonlarca dolar vermek yerine, kod yazabilen ama iş dünyasını bilmeyen çok sayıda gence ("batch" yani parti/grup halinde) 6.000 dolar gibi küçük can suyu (seed funding) verip onları mentorlukla büyütmek
      . Salı akşamları yapılan yemeklerde onlara yatırım dünyasında nasıl hayatta kalacaklarını öğretirler.
      Altman, YC'nin bu ilk yaz programına Cambridge'de başlar
      . Etrafı, Reddit'i kuran Steve Huffman ve Alexis Ohanian (başlangıçta yemek siparişi fikriyle gelmişlerdi), Kiko'yu kuran Justin Kan ve Emmett Shear, Infogami'yi kuran Aaron Swartz gibi gerçek dehalarla çevrilidir
      . Ancak Altman bu "ineklerin ineği" (nerd's nerds) tayfasından farklıdır. Arkadaşı Huffman'ın dediği gibi: "Biz sadece teknolojiyi seviyorduk, dünyadan bihaberdik. Sam ise çok daha iş ve başarı odaklıydı. Sanki acelesi vardı ve başka bir yerde olması gerekiyordu."
       Altman'ın kargo şortunun cepleri, test yapmak için kullandığı onlarca farklı model telefonla doludur. Hatta arkadaşı Gurevich ona "Kardeşim, testis kanseri olacaksın" diye takılır
      . Sam geceleri o kadar çok kod yazar ve sadece ramen yer ki, gerçekten iskorbüt (scurvy) hastalığına yakalandığını iddia eder
      . Ancak diğerleri sadece kod yazarken, Altman bir taraftan da büyük VC'lerle masaya oturmaktadır; oyunun kurallarını bilen tek kişidir
      .
      En kritik an, NEA'dan Patrick Chung'ın onu Sprint'in CTO'su Wing Lee ile tanıştırmaya Kansas City'ye götürmesidir
      . Wing Lee, karşısında 19 yaşında ufak tefek bir çocuk görünce şok olur ("Nerede kurucunuz?"). Lee, Sprint PCS ile 1990'larda mobil veriyi başlatan efsanevi bir mühendistir. Japonya'daki Harajuku kızlarından ilham alarak fotoğraflı mesajlaşmayı (picture mail) getirmiş ve büyük para kazandırmıştır
      . Şimdi yeni bir "katil uygulama" (killer app) aramaktadır. Altman ona Radiate'i (Viendo'nun yeni adı) "Mobildeki Facebook" olarak satar
      . Lee büyülenir. Ancak gizlilik endişeleri olduğu için, projeyi önce uyuşturucu satıcıları ve gençlerin kimliksiz kullandığı, gizliliğe pek takılmayan "Boost Mobile" adlı alt markalarında test etmeye karar verir
      .
      Yaz sonunda YC'nin Angel Day (Melek Yatırımcı Günü) etkinliği yapılır. Etkinliğe Stephen Wolfram (ve 10 yaşındaki oğlu) gibi isimler gelir. Kiko harika bir fikir olarak görülür (sonra Google tarafından ezilecek ve eBay'de satılacaktır). Reddit, PG'nin kişisel desteğiyle ayakta kalır ve ertesi yıl Condé Nast'a 10 milyon dolara satılarak YC'nin adını duyurur
      . Ancak o odadaki herkes, yatırımcılar ve PG dahil, en potansiyelli ve gerçek anlamda iş adamı gibi duran kişinin Sam Altman olduğu ve Radiate'in en büyük fırsat olduğu konusunda hemfikirdir
      .
      Bu bölümün özü: Y Combinator, Silikon Vadisi'nde "kravatlı yöneticilerin" yerine "kod yazan kurucuların" gücü elinde tuttuğu yeni bir çağ başlatmıştır. Sam Altman, bu yeni dönemin kusursuz bir hibritidir: Hem geceler boyu kod yazan ve scurvy olacak kadar kendini işe adayan bir 'hacker', hem de devasa telekom yöneticilerini ve milyarder yatırımcıları büyüleyebilecek kadar kurnaz bir vizyoner iş adamı. Bu özellikleriyle, akranları sadece ürün geliştirirken, o daha ilk aydan "oyunun kurallarını" baştan yazmaya başlamıştır.
