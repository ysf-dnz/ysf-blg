      Harika bir analiz sürecine giriyoruz. Kitabın "Parça 2: Silikon Vadisi Sınavı ve Loopt Macerası (Bölüm 5-8)" kısmını, yazar Keach Hagey’in olayları nasıl kurguladığını, sunduğu tüm kanıtları ve argüman zincirini adım adım takip ederek senin için derinlemesine yeniden anlatıyorum. Her detayı, anekdotu ve veriyi dahil ederek, Silikon Vadisi'nin o vahşi yıllarına, Sam Altman'ın bir "dahi çocuk"tan nasıl bir stratejiste dönüştüğüne yakından bakacağız. İstenen uzunluk ve derinlik kurallarına tam sadık kalarak başlıyoruz.
      ### Bölüm 5: "Stopping Out" – Okulu Bırakmanın Zarif Yolu ve Sequoia’nın Sahneye Çıkışı
      Yazar bu bölüme, başarıya ulaşmanın sadece iyi kod yazmakla değil, doğru ağlara (network) sızmak ve yatırımcı psikolojisini manipüle etmekle mümkün olduğu iddiasıyla başlıyor. 2005 yılının sonbaharı yaklaşırken, Radiate (eski adıyla Viendo) ekibi Stanford’daki üçüncü yıllarına (junior year) başlamaya hazırlanmaktadır. Nick Sivo, kampüste yurt bilgisayar koordinatörü olarak bir işe girmiş, Altman kampüs dışında Mountain View’da bir daire tutmuş, Deshpande ise Hindistan’daki yaz programından dönmüştür. Ancak Altman’ın aklı artık derslerde değildir. Paul Graham’ın (PG) ona aşıladığı özgüvenle Cambridge’den bambaşka biri olarak dönmüştür; öyle ki artık kendine PG tarzı bir e-posta lakabı bile almıştır: "Sama".
      Yazarın argüman zinciri burada hukuki ve finansal gerçeklerle derinleşiyor: Bir fikri şirketleştirmek, masum bir üniversite projesi olmaktan çıkıp profesyonel bir "köpekbalığı tankına" girmeyi gerektirir. 31 Ağustos 2005'te Radiate, New Enterprise Associates'ten (NEA) 6 milyon dolar değerleme (valuation) üzerinden 1.6 milyon dolarlık ilk yatırım ön sözleşmesini (term sheet) alır. On dokuz yaşındaki bu gençlerin acilen bir avukata ihtiyacı vardır. Altman, Silikon Vadisi'nin en güçlü hukuk firması olan, Steve Jobs'tan Google'ın kurucularına kadar herkese danışmanlık yapan Wilson Sonsini Goodrich & Rosati'den Page Mailliard'a ulaşır. Mailliard, yanına şirketin evrak işlerini basitleştirecek olan meslektaşı Carolynn Levy'i de alarak bu kot pantolonlu, tişörtlü çocukları dinler. Yazar burada Mailliard’ın anaç bir içgüdüyle verdiği tepkiyi kanıt olarak sunar: "Üniversite eğitiminizi kaçırmamalısınız" der gençlere. Ancak kararlı olduklarını görünce, oyunu kurallarına göre oynamaları gerektiğini, ilk ön sözleşmeye (term sheet) hemen atlamayıp diğer yatırımcılarla da görüşmeleri gerektiğini söyler. İşte o an, onları Sequoia Capital'dan Greg McAdoo ile tanıştırmayı teklif eder.
      Yazar, McAdoo'nun geçmişini detaylı bir vaka analizi olarak önümüze seriyor ki Sequoia'nın neden Altman'a yatırım yaptığını anlayalım. McAdoo, sivil haklar aktivisti bir babanın oğlu olarak Manhattan'da büyümüş, 4 yaşındayken aya yürümek istediğini söyleyince babasından "önce uçmayı öğrenmelisin" cevabını almış, pilotluk lisansı olan eski bir yazılımcıdır. SourceCom şirketinde iflası (Chapter 11 bankruptcy) yaşamış, yatırımcılara "paranız bitti" demenin ne kadar travmatik ("yara izi bırakan") olduğunu acı yoldan öğrenmiştir. Daha sonra CEO'su olduğu Sentient Networks'ü Cisco'ya satmış ve dot-com balonunun patladığı o cehennem gibi yıllarda Sequoia'ya katılmıştır. Sequoia'nın o dönemki stratejisi şudur: Herkesin baktığı yere değil, kimsenin bakmadığı yere bakmak. McAdoo, şirket kuran gençleri ilk görenlerin avukatlar olduğunu bildiği için onlara sürekli yemek ısmarlamakta ve onlardan bedava "anlaşma akışı" (deal flow) sağlamaktadır. (Bunu, bir futbol yetenek avcısının liselerdeki beden eğitimi öğretmenlerine rüşvet gibi yemek ısmarlayıp en iyi gençleri bulmasına benzetebiliriz).
      Mailliard, McAdoo'ya "Sana bir çocuk göndereceğim ama henüz Stanford'dan mezun olmadılar, hatta üçüncü sınıftalar" dediğinde McAdoo daha da heyecanlanır ("Stanford'u bırakanlardan çok para kazandık" der). Sequoia ofisindeki sunum tam bir Altman klasiğidir. Sadece 12 slayttan oluşan bir sunum yaparlar ama Altman sunum sırasında konu dışına çıkarak mobil teknolojiler hakkında inanılmaz vizyoner yorumlar yapar. Şirketin kurucusu Don Valentine'ın mirasını taşıyan Michael Moritz için bu durum "altın madeni" gibidir. Yazarın sonucu nettir: Sequoia, fikre değil, Sam Altman'ın bizzat kendisine âşık olmuştur. 7 Ekim 2005'te nihai anlaşma imzalanır: NEA ve Sequoia, şirkete 10 milyon dolar değerleme üzerinden 5 milyon dolar yatırım yapacak ve şirketin %50 hissesini (equity) alacaktır. Arkadaşlar, Paul Graham'ın yaz programına gitmediği için hisselerin %40'ı tek başına Altman'da kalır.
      Yatırımın bir şartı vardır: Hepsi okulu bırakmak zorundadır. Aileleri üzmemek için buna "okulu bırakmak" (dropping out) değil, Stanford'un iki yıllık mazeretsiz izin hakkını kullanarak "okula ara vermek" (stopping out) adını takarlar. Sivo'nun ebeveynleri çok destekleyicidir, hatta Sivo'ya bir araba gönderirler ve ilk dönem okul harçlığını harçlık yapsın diye ona bırakırlar. Sam'in annesi Connie ise endişelidir ama "Sam dağlara çıkıp ömür boyu meditasyon yapacak biri değil, o çok hırslı" diyerek kabullenir.
      Yatırımı kutlama anları, Silikon Vadisi elitleriyle ergenliğin tuhaf bir çarpışmasıdır. McAdoo gençleri Palo Alto'daki havalı Asya füzyon restoranı Tamarine'e götürür ve şarap sipariş etmek ister. Altman utanarak "Biz henüz içki içecek yaşta değiliz" (Amerika'da yasal yaş 21'dir) demek zorunda kalır. Kutlamanın diğer ayağında ise NEA yatırımcısı Patrick Chung, gençlerin davetiyle Stanford'un geleneksel "Full Moon on the Quad" partisine gider. Chung, kampüsün ortasında stadyum ışıkları altında, Listerine ve prezervatif dağıtılan, gece yarısı yüzlerce öğrencinin öpüştüğü (orgy benzeri) bu ortamı görünce "Aman Tanrım, benim burada ne işim var, ben bir risk sermayedarıyım!" diyerek paniğe kapılır.
      Yazar bölümü, Altman'ın ağ kurma (networking) yeteneğinin zirvesiyle bitirir. Radiate ekibi, Sequoia'nın merkez ofisinde YouTube'un (henüz Google'a satılmamış) üç eski PayPal mafyası kurucusuyla yan yana odalarda kod yazarak kuluçkaya yatar (incubation). Aynı kış Paul Graham, Y Combinator'ı Cambridge'den Silikon Vadisi'ne taşımaya karar verdiğinde Altman hemen devreye girer. Graham'ı Wilson Sonsini avukatlarıyla (Mailliard) ve Sequoia'dan McAdoo ile tanıştırır. Bu tanışma, Sequoia'nın ileride YC'ye milyonlarca dolar yatırmasının önünü açacaktır.
      Bu bölümün özü: Dünyanın en iyi fikrine sahip olmak yetmez; o fikri Silikon Vadisi'nin devlerine satabilmek için oyunun kurallarını erken yaşta kavramak gerekir. Sam Altman, Stanford’u bırakma pahasına girdiği bu yolda sadece yatırım kapmakla kalmamış, Y Combinator ile Sequoia Capital arasında köprü kurarak kendisini teknoloji ekosisteminin "vazgeçilmez bağlayıcı düğümü" (root node) haline getirmiştir.
      ### Bölüm 6: "Where You At?" – Hip-Hop, Konum Verisi ve İlk Kırılma Noktaları
      Bu bölümün temel argümanı, tüketici teknolojilerinde bir fikrin "havalı" olmasının, insanların mahremiyet (privacy) korkularını her zaman yenemediği gerçeğidir. Altman, teknolojiyi kurarken aynı zamanda kurumsal devlerle ve politik regülasyonlarla nasıl dans edeceğini bu dönemde öğrenir.
      Şirket artık Sequoia'nın lüks ofisinden çıkıp Palo Alto'da El Camino Real'e yakın 3250 Ash Street'te iki katlı mütevazı bir ofise taşınmıştır. Yazar burayı bir "frat house" (üniversite erkek öğrenci yurdu) olarak betimliyor: Ortada yürüyenlerin kafasını çarpmasını engellemek için havuz makarnalarıyla (pool noodles) kaplanmış tehlikeli döner bir merdiven, sürekli oynanan Halo 3 maçları, etrafta koşturan Fransız buldoğu Bruno ve geceleri bilgisayar başında sızıp kalan (hatta doktora gitmesi için ofis müdürü Nini Tang'in onu arabayla götürdüğü) dahi mühendis Tommy Tsai... Gençler geceleri ya Antonio’s Nut House gibi yer fıstığı kabuklarıyla dolu köhne barlara gitmekte ya da Box şirketinin kurucuları Aaron Levie ve Dylan Smith'in ofis/evlerinde bira pongu oynamaktadırlar. Hatta bazen Facebook'un ilk mühendislerinin ev partilerine gidip kendilerinden sadece bir yaş büyük olan Mark Zuckerberg ile takılmaktadırlar.
      Ancak Sequoia, "odadaki yetişkinler" (adults in the room) stratejisini uygular (tıpkı YouTube'a yaptıkları gibi). Şirkete 40'lı yaşlarında, golf oynayan, kazak giyen kurumsal bir satış başkan yardımcısı olan Brian Marciniak'ı ve Harvard mezunu, Electronic Arts kurucusuyla oyun şirketi (Digital Chocolate) kurmuş Mark Jacobstein'i getirirler. Jacobstein kendisini "Zuck'ın yanındaki Sheryl (Sandberg)" gibi konumlandırır. Altman'ın onlara yaptığı sunum çok etkilidir: Amaç sadece telefonda oyun oynamak değil, gerçek dünyada "tesadüfilikleri artırmak" (enhancing serendipity). (Jacobstein bunu annesine anlattığında annesi, "Yani bu yalnızlığın tedavisi, değil mi?" der).
      En büyük kırılma noktası Boost Mobile anlaşmasıdır. 2000 yılında Avustralya'da sörfçü gençlere yönelik kurulan ve ABD'de Nextel ağı üzerinde çalışan Boost, ön ödemeli (kontratsız) olduğu için uyuşturucu satıcıları ve genç şehirli nüfus tarafından çok kullanılmaktadır. Cuma akşamları ofislerine motokros motorlarıyla girilen, rapçilerin takıldığı bir yerdir. Boost yöneticisi Lowell Winer tam da radyoda Kanye West, Ludacris ve The Game'in söylediği "Where you at?" (Neredesin?) şarkısındaki gibi bir "arkadaş bulucu" aramaktadır. Tam başka bir şirketle anlaşacakken Altman arar ve 10 dakika ister. Rakibin yapamadığı "arkadaşın 5 mil yakınına gelince uyarı verme" özelliğini sabaha kadar uyumadan kodlarlar. Sabah 7 uçağıyla Irvine'e inen 50 kiloluk Altman, koca adamların olduğu toplantı odasında sandalyeye "bağdaş kurarak" (Indian-style) oturur ve ortamı büyüler. Winer anlaşmayı onlara verir ve Altman'ın "lanet olası derecede ısrarcı" (really fucking persistent) olduğunu fark eder.
      Boost anlaşmasıyla şirketin adı Radiate'den Loopt'a çevrilir (çünkü viendo.com alan adı için 300 bin dolar istemişlerdir). Kasım 2006'da Times Meydanı'nda efsanevi bir lansman yapılır. Sahnede yeşil "boost loopt" balonları, rapçiler (Fabolous, DJ Kay Slay), arkada dev ekranda Manhattan'ın piksel piksel haritası... Altman kapüşonlusuyla sahneye çıkıp uygulamayı tanıtır. İlk başta ücretsiz olan, sonra ayda 2.99 dolara satılan uygulama 35.000 kullanıcıyla başlar. Uygulamayı Cingular Wireless (AT&T) şirketinin Veri Başkan Yardımcısı Jim Ryan'a satmaya gittiklerinde takım elbiseli adamların karşısına Altman şort ve tişörtle çıkar, ancak vizyonuyla "tanrı" konumundaki Ryan'ı bile ikna eder.
      Ancak yazar, madalyonun karanlık yüzünü (kanıt) çeviriyor: Şirket 3 ayda 100 bin kullanıcıya ulaşsa da churn rate (kullanıcı terk oranı) felakettir. 90 gün içinde kullanıcıların %70'i uygulamayı silmektedir. Sebep? Uygulama rakibi Dodgeball gibi "istediğinde check-in yap" mantığıyla değil, 7/24 kesintisiz "her zaman açık" (always-on) mantığıyla çalışmaktadır. İnsanlar haritada başkalarını görmeyi sevse de kendi konumlarının 7/24 izlenmesini "ürpertici" (creepy) bulmaktadır.
      Altman sorunu örtbas etmek yerine direkt üstüne gider. Sprint'in baş hukuk müşaviri Len Kennedy'nin Reston, Virginia'daki ofisinde 2 saat boyunca terletici bir sorguya çekilir ve devasa tavizler verir: Uygulamada yabancı arkadaş aramak yasaklanacak, yaş sınırı 14 olacak ve kullanıcılara izlendiklerine dair 2 haftada bir zorunlu hatırlatma mesajı atılacaktır. Altman ve yeni COO Brian Knapp (avukat kökenli, altın renkli Prius'uyla ofisten lastik yakarak çıkan hiperaktif yönetici), mahremiyet yasalarından sağ çıkmak için Washington DC'ye kamp kurar, ACLU, şiddet gören kadın sığınma evleri ve çocuk koruma dernekleriyle masaya otururlar. Ancak büyük bir sorun vardır: Fikir güzeldir ama GSM operatörleriyle tek tek API ve özel kod yazmak ölümcül derecede yavaştır. O sırada çıkan Twitter'ın bir haftasonunda kodlandığını gören çalışanlar homurdanmaya başlar. "İyi toplantı hastalığına" (good meeting-itis) tutulmuşlardır; şirketler Altman'ı dinleyip fikirlerini çalar ama sözleşme imzalamaz. Şirkette ilk isyan başlar, Jacobstein ayrılır. Altman'ın aklı "kellik tedavisi" ve "nükleer füzyon" gibi parlak objelere kaymaktadır.
      Bu bölümün özü: Loopt, mobil konum teknolojisinde devrim niteliğinde bir adım atıp devasa telekomünikasyon şirketlerini ikna etmeyi başarsa da, insan psikolojisindeki "mahremiyet" (privacy) korkusunu hafife almıştır. Altman, kurumsal müzakerelerde (Boost ve Sprint anlaşmaları) deha seviyesinde bir yetenek sergilese de, kullanıcının ne istediğini tam olarak anlayamayan ve teknolojik kısıtlamalara takılan bir ürünün uzun vadede kan kaybetmeye mahkum olduğunu acı bir şekilde tecrübe etmiştir.
      ### Bölüm 7: From "Weak" to "Cool" – Steve Jobs'un Karşısında Bir Sınav ve Ekonomik Kriz
      Bu bölümde yazar, teknoloji dünyasındaki devasa bir paradigma değişimini inceliyor: Donanım üreticilerinin "köle", operatörlerin ise "kral" olduğu eski "kapalı bahçe" (walled garden) sisteminin, Apple'ın iPhone'u piyasaya sürmesiyle nasıl yerle bir olduğunu. Ve bu depremin ortasında kalan Loopt'un Apple trenine binmek için verdiği amansız mücadeleyi.
      2007 öncesinde mobil dünyada Cingular, Verizon, Sprint gibi ağlar ne derse o oluyordu. Ancak Steve Jobs, Cingular ile imzaladığı 5 yıllık özel anlaşmayla cihazın tüm kontrolünü Apple'a aldı ve mobil sektöre adeta bir "buldozerle" girdi. Ekim 2007'de ise yazılımcıların iPhone için uygulama yapabilmesini sağlayan bir Yazılım Geliştirme Kiti (Software Development Kit - SDK) çıkaracağını duyurdu. Loopt'un mühendislerinden James Howard (Apple hayranı, Washington Üniversitesi/Intel geçmişli araştırmacı), Jobs'un başlangıçta geliştiricilere sadece Safari üzerinden "tatlı bir çözüm" (sweet solution) olarak web uygulamaları yapmayı teklif ettiğini, ancak geliştiricilerin buna sadece öksürerek tepki verdiğini hatırlar. Çok geçmeden hackerlar cihazı kırmaya (jailbreak) başlar. Howard da gizlice Loopt'un bir iPhone sürümünü kodlar.
      Altman, Sequoia'nın Apple yönetim kurulunda da oturan kurucusu Don Valentine üzerinden bir ağ kurar. Valentine'dan Michael Moritz'e, Moritz'den Greg McAdoo'ya, McAdoo'dan da bizzat Steve Jobs'a ulaşırlar. McAdoo, "Sequoia'nın bugüne kadar yatırım yaptığı en genç kurucu, tıpkı senin gibi üniversite terki" diyerek Jobs'un (Reed College terki) ilgisini çekmeye çalışır. Haftalar sonra Jobs'tan gelen mail sadece üç kelimedir: "Zayıftı" (It was weak). Moritz'in ofisine giden McAdoo "Bununla ne yapacağım ben?" diye sorar. Moritz çaresizce başını sallar.
      Ancak Altman ve Howard pes etmezler. "Zayıftı" kelimesini motive edici bir slogana dönüştürürler. Kasım 2007'de Apple mühendislerinden gizli bir e-posta alırlar. Apple, iPhone SDK'sını geliştirirken Loopt'un fikirlerine danışmak istemektedir. Çok gizli toplantılar yapılır. Bu onlara erken SDK erişimi vermese de, Apple uygulamayı şirket içinde 100 çalışanıyla test eder ve eğer her istediklerini yaparlarsa Haziran 2008'deki efsanevi Worldwide Developers Conference'ta (WWDC) açılış sunumunda (keynote) sahneye çıkma sözü verir.
      Büyük sınav günü gelir. Cupertino'daki Apple binasında, lobideki Bösendorfer kuyruklu piyanonun (güzelliğin ve kusursuzluğun sembolü) yanından geçip oditoryuma girerler. Jobs her zamanki siyah balıkçı yakasıyla değil, şort ve tişörtle oturmaktadır. Altman konuşur, Howard telefonu yansıtır. Sunum bittiğinde Jobs bir süre sessiz kalır ve tek bir kelime eder: "Havalı" (Cool). Zayıftan havalıya terfi etmişlerdir! WWDC günü geldiğinde Altman, iz bıraksın diye içine neon yeşil, dışına neon pembe iki adet çift yakalı (double-popped) polo tişört giyerek San Francisco'daki Moscone Center West'te sahneye çıkar. Uygulamada "en tatlı kafe" olarak etiketlenmiş bir yerdeki arkadaşına "öğle yemeği yiyelim mi?" diye mesaj atar. Bu sunum 22 yaşındaki Altman'ı anında teknoloji dünyasının yıldızı (aynı zamanda blog yazarlarının rüküşlük alay konusu) yapar. Apple, Loopt için ulusal televizyon reklamı bile yayınlar ve indirme sayıları Facebook ile MySpace'i geçer.
      Fakat bu başarı uzun sürmez. Uluslararası lansman toplantısında Jobs, Loopt'un global çapta her ülkede çalışmayacağını öğrenince Altman'a bağırır çağırır (hatta McAdoo'ya göre Altman'ın kafasına kalem fırlatır). Altman sarsılsa da bu olaydan "prima donna" dâhileri (huysuz ama parlak starları) nasıl yöneteceğine dair çok büyük bir liderlik dersi çıkarır.
      Asıl yıkım ise donanım değil finans cephesinden gelir: 2008 sonbaharında Lehman Brothers batar. Sequoia, tüm portföy CEO'larını toplayıp, üzerinde mezar taşı ve "İyi Günler Huzur İçinde Yatsın" (RIP Good Times) yazan o meşhur, kan dondurucu sunumu yapar: Sınırsız nakit yakma dönemi bitmiştir, kârlılığa geçemeyen ölecektir. Krizden kısa süre önce Facebook, Loopt'u 150 milyon dolara almak istemiş, ancak Altman Moritz'in de onayıyla "hayır, biz devasa bağımsız bir şirket olacağız" diyerek reddetmiştir. Ancak şimdi krizin ortasında Allen & Company yatırım bankası Loopt'u 500 milyon dolara satmaya kalkınca tüm teknoloji basını (VentureBeat vb.) "Hadi oradan canım" diyerek dalga geçer. Yine de Altman'ın ikna gücü sayesinde 2009 baharında DAG Ventures'tan 150 milyon dolar değerlemeyle 7.5 milyon dolarlık bir can suyu koparmayı başarırlar.
      Bu bölümün özü: İnovasyon sadece iyi kod yazmakla değil, teknolojik devrimlerin (iPhone'un çıkışı) rüzgarını zamanında arkasına almakla ilgilidir. Steve Jobs gibi huysuz dâhilerin onayını almayı başaran ve 2008 Küresel Finans Krizi'nin acımasız ekonomik gerçekliğiyle yüzleşen Altman, liderliğin en zor yanının büyük ego yönetimleri ve ekonomik hayatta kalma sanatı olduğunu bu dönemde öğrenmiştir.
      ### Bölüm 8: The Douchebag Badge – Foursquare Darbesi, İsyan ve Zarardan Kârla Çıkış
      Bu son bölüm, Loopt'un yavaş yavaş çöküşünü, Altman'ın dikkat dağınıklığını ve başarısız giden bir şirketi yine de nasıl bir zafermiş gibi masaya sürebildiğini (exit) kanıtlarıyla anlatıyor. Yazar, inovasyonda doğru fikri bulmanın her zaman doğru zamanda uygulanmasıyla örtüşmediğini savunur.
      Mart 2009. Austin, Teksas'taki müzik, sinema ve teknoloji festivali South by Southwest (SXSW). Twitter'ı patlatan bu festivalde şimdi herkes başka bir uygulamayı konuşmaktadır: Foursquare. Dennis Crowley (Dodgeball'u Google'a satmış, ama orada eriyip gitmişti) ve Alex Rainert'in kurduğu Foursquare, Loopt'un aksine 7/24 izlemeyi reddetmiş, insanların gittikleri barlara kendi istekleriyle "check-in" yapıp, rozetler (badges) ve "mekan belediye başkanı" (mayor) unvanları kazandığı oyunlaştırılmış bir model kurmuştur. Kullanıcılar bu eğlenceli ve mahremiyeti ihlal etmeyen modele bayılmıştır. Üstelik iPhone'un işletim sistemi zaten arka planda sürekli çalışan (Loopt tarzı) uygulamalara izin vermemektedir, bu yüzden Loopt'un "sürekli açık" pili sömüren sistemi çökmektedir.
      Foursquare'in yükselişi Loopt çalışanları için tam bir "mideye inen yumruk" (gut punch) olur. Altman panikle Foursquare benzeri, Groupon gibi mekanlardan indirim koparan "Loopt Star" ve şirket içinden mühendis çeken gay flört uygulaması "Loopt Mix" (sonra ayrıldı) gibi yeni projelere atlar. Eski çalışanların deyimiyle Altman "parlak nesne sendromuna" (shiny object syndrome) tutulmuştur: Kafası çok hızlı çalışmakta, yavaşlayan bir projeyi düzeltmek yerine hemen yeni bir geleceğe atlamakta ve insanları arkasında bırakmaktadır.
      Şirket içindeki mühendislik liderleri (Steve Lemon, Eric Carr vb.) isyan bayrağını çeker. Loopt'un tek para kazandıran yanı, "platform işi" dedikleri, telekom şirketlerine Qualcomm'dan lisansladıkları teknolojiyle ucuz konum sorgulama verisi satan B2B (şirketten şirkete) modelidir. Mühendisler "Buraya odaklanıp şirketi 100 milyon dolara satalım" der. Ancak Sequoia gibi "büyük vurgun" arayan risk sermayedarları (VC'ler) için bu tür küçük ve kârlı "garanti" işler ("base hits") ilgi çekici değildir; onlar dünyayı değiştirecek devasa milyar dolarlık unicorn'lar aramaktadır. 2009 baharında, 12 kıdemli yönetici Sequoia ofisinde yönetim kuruluyla "İsa'ya geliş" (come-to-Jesus) adlı yüzleşme toplantısını yapar ve Altman'ın CEO'luktan alınmasını talep ederler.
      Durumu daha da toksik hale getiren bir skandal daha patlamıştır: Loopt'tan ayrılıp AdWhirl adlı mobil reklam ağını kuran iki mühendisten biri olan Sam Yam, sektörün devi AdMob'un açık kaynak SDK'sını tersine mühendislikle parçalayıp (disassembling) kodlarını çalmakla suçlanır. Yam, Altman'a çok yakındır. Sequoia, yatırımlarını korumak için hızlı bir manevrayla AdWhirl'ü AdMob'a sattırır ve ardından tüm paketi Google'a okutarak krizden kârla çıkar. Ancak Loopt çalışanları Altman'ın bu kod hırsızlığından haberdar olduğuna inanarak ona olan güvenlerini tamamen kaybederler.
      Buna rağmen Sequoia (McAdoo, Chung, Ramsay) Altman'ı korur. Neden? Çünkü Altman artık sadece bir CEO değil, Sequoia için altın yumurtlayan bir "yetenek avcısıdır" (scout). Altman, Paul Graham üzerinden tanıştığı İrlandalı dahi kardeşler Patrick ve John Collison'ın yeni kurduğu Stripe'a Paul Graham ile birlikte 15.000 dolarlık melek yatırım yapmış ve ardından Sequoia'nın bu şirkete devasa yatırımlar yapmasına önayak olmuştur. (Bu 15 bin dolar, Altman'a ileride 70 milyar dolarlık şirketten pay kazandıracak hayatının en iyi yatırımıdır). Sequoia için Loopt batsa da Altman'ı elde tutmak şarttır.
      Sonunda, Loopt Foursquare'e karşı savaşı kaybeder. Foursquare ekibi, Altman'ın o meşhur çift yakalı tişörtüyle alay eden neon pembe/yeşil bir "douchebag" (pislik/ukala) rozeti bile yayınlar. 2010 yılında Sequoia, şirketi toparlaması için mobil emektarı Steve Boom'u Başkan olarak getirir ama at artık koşmamaktadır.
      2012 yılında, Sequoia'nın portföyündeki ön ödemeli banka kartı şirketi Green Dot'un eski radyocu CEO'su Steve Streit, yazılım ekibini Paul Graham'ın öğütlediği "çevik" (agile) modele geçirmek istemektedir. Moritz, "Tam sana göre bir şirketimiz var, teknolojileri süper ama gençler" diyerek çöpçatanlık yapar. Mart 2012'de Green Dot, Loopt'u 43.4 milyon dolara (çalışanların elde tutulması için 9.8 milyon dolar dâhil) satın aldığını duyurur. Bu gerçek bir "yetenek satın alımıdır" (acquihire). Loopt ürünleri tamamen kapatılır. Altman ekibini korumayı başarsa da özel hayatında sevgilisi Sivo ile ayrılır.
      Altman Loopt'un kapanışına dair şu efsanevi dersi çıkarır: "İnsanların koltuklarında uzanıp sadece içerik tüketeceği vizyonu (kötümser vizyon) kazandı. İnsanlara istemedikleri bir şeyi (sosyalleşmek için dışarı çıkıp konumlarını paylaşmak) zorla yaptıramayacağınızı öğrendim."
      Bu bölümün özü: Loopt macerası, teknolojik vizyonun tüketici davranışlarıyla örtüşmediğinde nasıl başarısızlığa uğrayacağının klasik bir Silikon Vadisi vaka çalışmasıdır. Ancak Altman bu süreçte, bir şirketi "batarken bile kârlı bir şekilde satabilme" (acquihire) becerisini göstermiş, asıl yeteneğinin ürün geliştirmekten ziyade yatırım ağı kurmak ve dahi beyinleri Sequoia gibi devlerin radarına sokmak (Stripe yatırımı vb.) olduğunu ispatlayarak gelecekteki kariyerinin tohumlarını atmıştır.
  - baslik: Parça 3 · Y Combinator Liderliği ve OpenAI'ın Doğuşu (Bölüm 9-11)
    icerik: |-
      Harika bir yolculuğa çıkıyoruz. Sam Altman’ın kariyerindeki en kritik dönemeçleri, Y Combinator (YC) başkanlığından OpenAI’ın o inanılmaz kuruluş hikayesine kadar, tıpkı bir dost meclisinde, kahvelerimizi yudumlarken konuşuyormuşuz gibi ama meselenin ciddiyetini ve derinliğini de asla elden bırakmadan, kaynak metindeki her bir detayı, anekdotu ve argümanı adım adım takip ederek anlatacağım.
      Hazırsan, Silikon Vadisi'nin en fırtınalı yıllarına dalış yapıyoruz.
      ### Bölüm 9: Rokette Bir Yolculuk (A Ride on a Rocket) — Melek Yatırımlar ve Yapay Zekanın Ayak Sesleri
      Hikayemiz, 2012 yılında Stanford Üniversitesi'nde, PayPal'ın kurucu ortağı ve ünlü yatırımcı Peter Thiel’in verdiği "CS183: Startup" adlı efsanevi dersle başlıyor
      . Thiel, sıradan bir yatırımcı değildi; o, çocukluğunda bir satranç dehasıydı ve Stanford’da tarihçi René Girard’dan "mimetik teori" (mimetic theory) yani insanların aslında sadece başkalarının arzuladığı şeyleri arzuladığını savunan felsefeyi öğrenmişti
      . Bu düşünce yapısı Thiel'i doğuştan bir "aykırı" (contrarian) yapmıştı
      . Sınıfı öylesine dolup taşıyordu ki, öğrenciler koridorlara taşıyor, yerde oturuyordu
      . Hatta o sınıfta tutulan notlar daha sonra çok satan From Zero to One kitabına dönüşecekti
      .
      Thiel'in bu dersteki ve genel olarak Silikon Vadisi'ndeki temel argümanı şuydu: 1960'lardan beri teknolojideki iyimserlik yerini dev bir hayal kırıklığına bıraktı
      . "Uçan arabalar istedik, elimize 140 karakterlik Twitter geçti" diyorlardı. Reel ücretler yerinde sayıyor, yaşam süreleri uzamıyordu
      . Thiel’in yatırım şirketi Founders Fund, Silikon Vadisi'nin ofislere çikolata getiren Kozmo.com gibi "sahte problemleri" çözen şirketlere para akıtmasını eleştiriyordu
      . Thiel’e göre teknolojik durağanlığın ilacı, kalabalığın tersine gitmek ve risksiz, küçük adımlar atan "korkak" yatırımcılık oynamak yerine, çitleri aşacak o büyük vuruşu (moonshot) yapmaktı
      .
      İşte tam bu noktada, Sam Altman sahneye giriyor. Altman, Loopt isimli startup'ını sattıktan sonra sarsılmış, üzgün ama cebinde 5 milyon dolarla hayata yeniden başlamaya hazırdı
      . Y Combinator'da (YC) 2011'den beri yarı zamanlı ortak olarak çalışıyor, Rap Genius (sonradan Genius) gibi şirketlere yatırımcı sunumlarında sadece "aktif kullanıcı" sayısını öne çıkarmaları gibi altın değerinde taktikler veriyordu
      . Loopt sonrası dönemi tam bir arayış süreciydi: Avrupa'da sırt çantasıyla gezdi, Güneydoğu Asya'yı ve Japonya'yı dolaştı, bir Hint aşramında kalarak hayatını değiştiren bir dinginlik buldu
      . Hatta Meksika'da rehber eşliğinde psikedelik maddeler denediği ve bunun hayatının en dönüştürücü deneyimlerinden biri olduğunu söylediği bir inzivaya bile katıldı
      . Big Sur'da ormanların içinde inzivaya çekilip sürekli kitap okudu
      .
      Peki Thiel ile Altman'ı bir araya getiren şey neydi? Nükleer enerji
      . Altman nükleer fisyon ve füzyona kafayı takmıştı. Thiel ise nükleer enerjinin çöküşünü, Amerika'nın teknolojik cesaretini kaybetmesinin en büyük sembolü olarak görüyordu
      . Thiel'e göre 1979'da nükleer felaketleri kurgulayan The China Syndrome filmi ve hemen ardından gelen Three Mile Island kazası, nükleer karşıtı histeriyi körüklemişti
      . Oysa Thiel, Çernobil'de 50'den az insan ölürken, kömür santrallerinin dumanından ABD'de her yıl 13.000 kişinin öldüğünü savunuyordu
      . Thiel'in çevresindeki Eliezer Yudkowsky gibi isimler için nükleer reaktörlerin başına gelenler, "insanlık için iyi olan şeylerin, aptalca bir korku yüzünden engellenmesinin" en büyük yarasıydı
      . Bu korku ve bu yara, daha sonra Silikon Vadisi'nin yapay zeka güvenliği (AI safety) konusundaki yaklaşımını da derinden etkileyecekti
      .
      İkili bu büyük fikirlerde buluşunca, Altman kendi melek yatırım fonunu kurmaya karar verdi: Hydrazine Capital (adını roket yakıtından alıyordu)
      . Thiel bu fona 21 milyon doların büyük kısmını koydu
      . Altman, Princeton'dan mezun kardeşi Jack'i ve daha sonra diğer kardeşi Max'ı da fona dahil etti
      . Ancak ironik olan şuydu: Thiel her zaman "aykırı" (contrarian) olmayı savunurken, Hydrazine Capital tam bir "zamanın ruhu" (zeitgeist) fonuydu
      . Altman'ın stratejisi inanılmaz basitti: YC'den çıkan en iyi şirketlere yatırım yapıp bir nevi YC endeks fonu oluşturmak. Zenefits, Flexport, Verbling, BuildZoom, Soylent ve Patreon (Altman'ın eski arkadaşı Sam Yam kurmuştu) gibi şirketlere yatırım yaptılar
      . Thiel, teknoloji sektörünün o dönemde aslında gereğinden az yatırım aldığını düşünüyordu, bu yüzden trendleri takip etmek (konsensüs) bile fazlasıyla kazandırıyordu
      . Günlük hayattan bir analoji vermek gerekirse; Altman, altının değerleneceğini bildiği bir dönemde gizli bir maden aramak yerine, kapısının önünden geçen her altın yüklü trene bilet alıyordu. Thiel'in dediği gibi: "Bazen sadece bir rokete otostop çekmek istersiniz."
      Bu sırada Y Combinator (YC) stratosferi delip geçiyordu. Ron Conway ve Yuri Milner gibi melek yatırımcılar, her YC girişimine anında 150.000 dolarlık dönüştürülebilir senet (convertible note) vererek oyunun kurallarını değiştirdiler
      . Artık kurucular şirketlerinin değerlemesiyle uğraşmadan hemen nakit alabiliyordu
      . 2011'de Demo Day o kadar büyümüştü ki (Ashton Kutcher ve Demi Moore bile oradaydı!), YC binasının çatısına yeni klimalar takmak, dışarıya seyyar tuvaletler getirmek zorunda kaldılar
      . Sonunda etkinlik o kadar kalabalıklaştı ki Computer History Museum'a taşındılar
      . Altman, Thiel'in parasıyla Airbnb ve Stripe gibi şirketlere tam da değerlemelerinin 1-2 milyar dolar olduğu zamanlarda girip bu şirketlerin 60-200 milyar dolarlara çıkışından devasa karlar elde etti
      .
      Tüm bunlar olurken, arka planda asıl büyük devrim mayalanıyordu: Yapay Zeka (AI). Thiel ve Altman, bilgisayarların insanlardan daha zeki hale gelip kendini sürekli geliştireceği o bilimkurgu anına, yani "Tekillik" (the singularity) kavramına zaten takıntılıydı
      . Bu kavramı John von Neumann ortaya atmış, yazar Vernor Vinge popülerleştirmişti
      . Bu fikirlerden etkilenen bir dahi olan Eliezer Yudkowsky, daha 17 yaşındayken internet forumlarında (Extropians listesi) adını duyurmuştu
      . Extropian'lar, termodinamiğin çöküş yasası olan entropiye karşı savaşan, dondurularak (kriyojenik) gelecekte diriltilmeyi uman süper iyimserlerdi
      . Yudkowsky önce AI'ın kesinlikle iyi olacağını düşünüp Singularity Institute'ü kurmuştu, ama sonra "Ya bu süper zeka bizim istediğimiz iyiliği yapmazsa?" diye paniğe kapıldı
      . Örneğin, bir AI'a "ataş üret" (paperclip) derseniz, tüm evreni ve insanları ataşa çevirebilirdi
      . Bu yüzden Yudkowsky, misyonunu AI'dan "dostane yapay zeka" (friendly AI) ve rasyonelizme (rationalism) çevirdi
      .
      2010 yılında, Singularity Summit isimli fütürist zirvede iki dahi araştırmacı, Shane Legg ve satranç şampiyonu Demis Hassabis, Peter Thiel'in San Francisco'daki evine gidip onu bir yapay zeka şirketine yatırım yapmaya ikna ettiler: DeepMind
      . Thiel 2.25 milyon dolar verdi
      . Daha sonra Elon Musk da, "insanlığı yok edecek bir yapay zeka Mars'a kadar bizi takip etmesin" diye, gelişmeleri yakından takip etmek için DeepMind'a yatırım yaptı
      . DeepMind 2013'te klasik Atari oyunu Breakout'u hiçbir insani kural öğretilmeden, kendi kendine oynamayı öğrenip ustalaşan bir sistem geliştirdi ve hemen ardından Google tarafından 650 milyon dolara satın alındı
      .
      İşte bu noktada Sam Altman'ın radarları tamamen bu yöne çevrildi. 2014 yılında kendi blogunda yayınladığı yazıda, yapay zekanın (AGI) "belki de asla çalışmayacağını düşünenlerin yanıldığını", işe yararsa bunun teknoloji tarihindeki en büyük gelişme olacağını ilan etti
      .
      Bu bölümün özü: Peter Thiel’in teknolojik durağanlık eleştirisi ve nükleer enerjiye duyulan ortak ilgi, Sam Altman ile Thiel’i bir araya getirerek devasa bir yatırım rüzgarı (Hydrazine Capital) yarattı. Altman, Y Combinator’ın çılgın büyüme döneminde başarılı startupların yükselişine ("rokete") binerek hem müthiş bir güç kazandı hem de DeepMind gibi gelişmeler sayesinde yapay genel zekanın (AGI) gerçekten başarılabileceğine inanmaya başladı.
      ### Bölüm 10: "Sam Altman Başkanlığa" (Sam Altman for President)
      Hikaye 2014 kışında, Mountain View'daki Y Combinator merkezinde chili yiyen bir grup girişimcinin karşısına Paul Graham'in çıkıp şok edici bir açıklama yapmasıyla devam ediyor: YC'nin liderliğini 28 yaşındaki, daha önceki girişimi Loopt çok da başarılı olamamış Sam Altman'a devrediyordu
      . O an salondaki girişimciler (Checkr ve Doblet'in kurucuları gibi) şaşkındı, çünkü çoğu Sam Altman'ın kim olduğunu bile bilmiyordu ve Paul Graham ile çalışmayı hayal ederek oraya gelmişlerdi
      .
      Peki Paul Graham neden Altman'ı seçmişti? Argüman zinciri çok net: Graham, YC'nin inanılmaz bir hızla büyüdüğünü (8 şirketten 80 şirkete çıkmışlardı) ve kendisinin bu devasa yapıyı yönetecek doğru kişi olmadığını, çünkü aslında bir yazılımcı (hacker) olup sadece Lisp dilinde kod yazmak ve çocuklarıyla vakit geçirmek istediğini fark etmişti
      . Altman ise Graham'in tanıdığı en hırslı ve "korkutucu derecede etkili ama temelde iyi niyetli" insandı
      . Graham'in deyişiyle Altman ne isterse onu elde eden biriydi; YC'nin başarılı olması için tek yapılması gereken, Altman'ın YC'nin başarılı olmasını istemesini sağlamaktı
      .
      Altman başlangıçta bu teklifi çok da istememişti. Aslında kendi nükleer fisyon girişimini kurmak istiyordu
      . Eski erkek arkadaşı Lachy Groom'un da belirttiği gibi, Altman kendini klasik bir "Risk Sermayedarı" (VC) olarak görmüyor, melek yatırımcı olarak kalıp girişimcilere karşıt bir pozisyonda değil, onlarla omuz omuza olmayı seviyordu
      . Ancak sonunda girişimcilerle çalışmanın cazibesi galip geldi ve YC'nin başkanı oldu
      .
      Başkan olduktan sonra Altman, Thiel'den aldığı ilhamla YC'nin vizyonunu radikal bir şekilde değiştirdi. Altman'ın temel felsefesi şuydu: Tarih boyunca demokrasiler ancak ekonomik büyüme ("sıfır toplamlı olmayan" oyunlar) ile hayatta kalabilmişti; Amerika bunu önce genişleyecek topraklara (frontier) sahip olarak, sonra da teknolojiyle başarmıştı
      . Ancak artık toprak bitmişti ve yazılım dışındaki sektörlerde inovasyon yavaşlamıştı. Bu yüzden YC'nin sadece bir "uygulama (app)" kuluçka merkezi olmasını istemiyordu. Hedefini "Zor Teknoloji" (Hard Tech) olarak belirledi
      . YC'nin odak noktasına enerjiyi (fisyon ve füzyon), robotik, biyoteknoloji, sağlık ve yapay zekayı (AI) koydu
      . Gündelik dilden bir analojiyle; Altman artık insanlara sadece daha iyi yemek siparişi verdiren bir restoran değil, insanlığı Mars'a götürecek, yaşlanmayı durduracak roketleri ve ilaçları üreten dev bir laboratuvar kurmak istiyordu. Hatta o kadar ileri gitti ki, kıyamet koptuğunda hayatta kalmak için İsrail ordusu gaz maskeleri, silahlar, altın ve antibiyotikler biriktirdiğini bile itiraf ediyordu
      .
      Altman YC'yi devasa bir şekilde büyütmek için kolları sıvadı. Eski Twitter COO'su Ali Rowghani'yi işe alarak, YC'den çıkan şirketlerin daha ileri yatırım turlarına (Series A, B vb.) katılabilecekleri 700 milyon dolarlık YC Continuity Fund'ı kurdu
      . Stanford ve Michael Bloomberg'in varlıklarını yöneten Willett Advisors gibi dev "sınırlı ortakları" (LPs) içeri aldı
      . Ama bir yandan da YC partnerlerinin kayırmacılık yapmasını engellemek için inanılmaz sert kurallar koydu. Adeta Silikon Vadisi'nin "polisi" gibi davranıyor, kötü niyetli yatırımcılara tehditkar e-postalar gönderiyordu
      .
      Altman, sadece yatırım yapmıyor, şirket kurtarıyordu. Bunun en büyük örneği Reddit'ti
      . YC'nin ilk dönemlerinden çıkan, sonra Condé Nast'a (Vogue, The New Yorker'ın yayıncısı) yok pahasına (10 milyon dolar) satılan Reddit, kurumsal yapıda boğuluyordu
      . Şirket bağımsız bir yapıya kavuşup CEO olarak Yishan Wong'u getirince, Altman devreye girdi. Kendi fonu Hydrazine üzerinden Snoop Dogg, Jared Leto gibi isimleri de işin içine katarak 50 milyon dolarlık bir yatırım turuna (Series B) liderlik etti
      . Hatta kullanıcılara "kripto para" (cryptocurrency) üzerinden Reddit hisselerinin %10'unu dağıtmak gibi çılgın bir plan yaptılar
      . Wong, ofisi Silikon Vadisi'nden sıkıcı bir banliyöye taşımak isteyince şirket karıştı ve istifa etti; Altman tam 8 gün boyunca Reddit'in CEO'su oldu, sonra görevi Ellen Pao'ya devretti
      . En sonunda eski kurucu Steve Huffman'ı geri getirerek Reddit'i kurtardı. Hatta bu olaylar sonunda Reddit halka açıldığında (IPO), Altman'ın fonu 600 milyon dolar kazanç elde edecekti
      .
      Tüm bu startup çılgınlığının ortasında, Altman'ın zihni yavaş yavaş Yapay Zeka'nın karanlık tarafına kayıyordu. O dönemde İsveçli filozof Nick Bostrom'un Superintelligence: Paths, Dangers, Strategies (Süper Zeka) kitabı yayınlandı ve Elon Musk bile "nükleer silahlardan daha tehlikeli" diyerek tweet attı
      . Kitaptaki argüman çok çarpıcıydı: Eğer serçeler, onlara yuva yapsın diye bir baykuş yavrusu bulup getirmeye karar verirlerse, asıl soru o baykuş büyüdüğünde serçeleri yememesi için onu nasıl evcilleştireceklerini yuvaya getirmeden önce bilip bilmedikleridir
      . AI, evcilleştirilmemiş o baykuştu.
      Altman'ın en sevdiği makalelerden biri olan Scott Alexander'ın "Meditations on Moloch" (Moloch Üzerine Düşünceler) yazısı tam da bunu anlatıyordu
      . Moloch, antik çağlarda çocukları yiyen şeytani bir tanrı, günümüzde ise herkesin birbirini alt etmek için silahlanmasını sağlayan, kimsenin durduramadığı o yıkıcı "Oyun Teorisi" (Game Theory) ve yarıştı
      . Makaleye göre, insani değerleri savunan ve bizi bu kısır rekabet döngüsünden (Moloch'tan) kurtaracak tek bir umut vardı: İnsanlıktan daha zeki, evrensel bir "Bahçıvan" (Gardener) yaratmak, yani bir Süper Zeka (AI)
      . Bu makaleden çok etkilenen Altman, Tanrı'yı öldürmek pahasına da olsa bunu denemenin gerekliliğine inanmıştı
      .
      Bu bölümün özü: Sam Altman, Y Combinator'ın başına geçtikten sonra sadece yazılım üreten bir kuluçka merkezi yerine; enerji, biyoteknoloji ve yapay zeka gibi "Zor Teknoloji" (Hard Tech) alanlarına devasa yatırımlar yapan dev bir ekosistem inşa etti. Bu süreçte hem kurumsal büyüme (Continuity Fund) hem de kriz yönetimi (Reddit) konusundaki dehasını kanıtlarken, arka planda "Süper Zeka"nın insanlığı yok etmeden önce onu nasıl kontrol edeceğimiz (Moloch problemi) takıntısına kapılmaya başladı.
      ### Bölüm 11: "Yapay Zeka İçin Bir Manhattan Projesi" (A Manhattan Project for AI)
      Ocak 2015'te Porto Riko'daki Caribe Hilton otelinde garip bir konferans düzenlendi. Sıradan akademisyenlerin arasında bir anda devasa korumalarıyla dolaşan milyarder Elon Musk belirdi
      . Future of Life Institute'ün (Max Tegmark ve Jaan Tallinn tarafından kurulan) düzenlediği bu konferansın temel amacı, yapay zekayı (AI) geliştiren pratik araştırmacılar ile AI'ın insanlığı yok edeceğinden korkan "AI Güvenliği" (AI Safety) felsefecilerini (Bostrom, Yudkowsky vb.) ilk kez bir odaya kilitleyip ortak bir zemin bulmaktı
      . Elon Musk, Google ve Facebook'un bu gücü tamamen ele geçirmesinden korkuyordu
      . Konferans sonunda herkes, yapay zekanın sadece zeki değil, "faydalı" (beneficial) olması gerektiğine dair açık bir mektup imzaladı ve Musk bu enstitüye 10 milyon dolar bağışladı
      .
      Porto Riko'da olmayan Sam Altman, kısa süre sonra kendi blogunda Bostrom'dan aldığı ilhamla "insanüstü makine zekasının insanlığın varlığına en büyük tehdit olduğunu" ve mutlaka devletler tarafından regüle edilmesi gerektiğini yazdı
      . Altman ve Musk bu korkular etrafında çarşamba günleri akşam yemeklerinde buluşmaya başladılar
      . Altman, Mayıs ayında Musk'a bir e-posta atarak asıl bombayı patlattı: Neden Google'a rakip olacak, "Yapay Zeka İçin Bir Manhattan Projesi" (A Manhattan Project for AI) başlatmıyoruz?
       Fikir şuydu: YC'nin şemsiyesi altında bir kar amacı gütmeyen kuruluş (nonprofit) kuracaklardı; teknoloji tüm dünyaya ait olacak ama çalışanlar startup gibi maaş/hisse alacaktı
      .
      Bu laboratuvarı kuracak yetenekli insanlara ihtiyaçları vardı. Sahneye önce Greg Brockman çıkıyor
      . Kuzey Dakota'da bir çiftlikte büyümüş, matematiğe ve kimyaya aşık, Harvard ve MIT'yi terk edip (dropout) Stripe'ın ilk CTO'su olmuş bir "kod makinesi"
      . Brockman, Turing testinden çok etkilenmişti ve o dönem LessWrong okuyup AI konusuna saplantılı hale gelmişti. Stripe'taki görevini bırakıp makine öğrenimi (machine learning) mühendisi olmaya karar verdi
      .
      Diğer tarafta ise dahi araştırmacı Ilya Sutskever vardı
      . Sovyetler Birliği'nde doğup, İsrail ve Kanada'da büyüyen Ilya, efsanevi AI araştırmacısı Geoff Hinton'ın laboratuvarında çalışırken henüz 17 yaşındaydı
      . Sutskever, yapay zeka akademisindeki "matematik kıskançlığı" (math envy) dediği şeyden, yani insanların sırf havalı teoremler ispatlamak için karmaşık ama işe yaramaz teorik yapay zeka modelleri üzerinde çalışmasından nefret ediyordu
      . Ona göre beynimiz nasıl karmaşık ve küçük nöronlardan oluşuyorsa, yapay sinir ağları (neural networks) da doğru tasarlanıp devasa "işlem gücü" (compute / GPU'lar) verilirse her şeyi yapabilirdi
      . Nitekim 2012'de Krizhevsky ve Hinton ile geliştirdiği "AlexNet" ile bunu kanıtlamış ve Google'a transfer olmuştu
      .
      Temmuz 2015'te Menlo Park'taki şık Rosewood otelinde Altman, tarihi bir akşam yemeği düzenledi
      . Masada Musk, Brockman, Sutskever, Dario Amodei, Chris Olah ve Paul Christiano vardı
      . Soru basitti: Google gibi devlere karşı yarışmak için çok mu geçti? Masadakiler bunun imkansız olmadığına karar verdiler
      . Brockman, "Bu laboratuvarı ben kurarım" dedi
      .
      İşe alımlar başladı. Brockman, Yoshua Bengio'dan tavsiye alarak Google ve Facebook gibi yerlerden en zeki gençleri hedefledi: Wojciech Zaremba, Durk Kingma ve Andrej Karpathy
      . Önce herkes bu ekibe şüpheyle yaklaştı. Hatta Amodei ve Olah ilk başta projeden ayrılıp Google'a gittiler
      . Ancak Altman, ekibi Napa Vadisi'ne bir otobüs gezisine (şarap ve beyin fırtınası) götürerek harika bir bağ kurmalarını sağladı
      . Projenin kar amacı gütmeyen (nonprofit) bir misyonu olması ve Altman'ın kendi cebinden 10 milyon dolar vererek kurduğu "YC Research" altında olması araştırmacılara çok cazip geldi
      . Musk da finansmanı kabul etti ve şirketin adını koydu: OpenAI Institute veya kısaca OpenAI
      .
      Yine de işler neredeyse lansman gününde çöküyordu. Aralık ayında, Montreal'deki büyük NIPS konferansında şirket duyurulacaktı ama Ilya Sutskever panikledi. Google'ın önemli ismi Jeff Dean, Ilya'ya kalması için 6 milyon dolar maaş ve kendi laboratuvarını teklif etmişti
      . Brockman son saniyede Ilya ile konuşup onu ikna etti
      . 11 Aralık 2015'te yayınlanan bir blog yazısıyla OpenAI tüm dünyaya duyuruldu
      . Elon Musk'ın ısrarıyla, Google ile rekabet edebileceklerini göstermek için 100 milyon değil, tam 1 Milyar Dolarlık (1 Billion) fon taahhüdü aldıklarını (Musk, Thiel, AWS, Infosys vb.) açıkladılar
      . Amaç basitti: Finansal getiri zorunluluğu olmadan, yapay zekayı insanlığın faydasına sunmak
      . Aynı gece bir partide Facebook'un AI şefi Yann LeCun, Sutskever'in yanına gelip acımasız bir kehanette bulunacaktı: "Başarısız olacaksınız."
      Bu bölümün özü: Dünyanın dev teknoloji şirketlerinin yapay zekayı tekeline alıp insanlık için bir "varoluşsal risk" (existential risk) yaratmasından korkan Sam Altman ve Elon Musk, Greg Brockman'ın mühendislik inadı ve Ilya Sutskever'in sinir ağlarına (neural networks) olan derin inancıyla birleşerek, kar amacı gütmeyen, devasa bütçeli ve bağımsız OpenAI araştırma laboratuvarını kurdular. Bu kuruluş, Silikon Vadisi'nde yeteneklerin, milyarderlerin ve idealizmin çarpıştığı tarihi bir hamleydi.
  - baslik: Parça 4 · Güvenlik, Etkin Fedakârlık ve Kâra Geçiş (Bölüm 12-14)
    icerik: |-
      ### Bölüm 12: Fedakârlar (Altruists) — Beyaz Tahtalar, Siyasi İhtiraslar ve EA İdeolojisinin Yükselişi
      Hikayemizin bu kısmına, OpenAI'ın henüz ne yapacağını tam olarak bilemediği, bir nevi "sisler içindeki" ilk günleriyle başlıyoruz
      . Dahi araştırmacı Ilya Sutskever, laboratuvarın sadece bir bilgisayar bilimcisi değil, adeta beyaz tahtalar üzerinden kendini ifade eden bir sanatçısı gibidir
      . Taze keçeli kalemlerin gıcırtısı eşliğinde tahtalara nöron ağları ve karmaşık formüller çizerken, odaya "AGI'ı hissedin" (Feel the AGI) gibi mantralar yayarak saf bir inanç saçmaktadır
      . Ocak 2016'da, henüz ortada doğru dürüst bir ofis bile yokken, ekip Greg Brockman'ın dairesindeki kanepelere tünemiş, yemek masasının etrafında toplanmıştır
      . Eski işi Stripe'taki devasa kariyerini bırakan Brockman, kendi egosunu bir kenara bırakıp kendini tamamen bu davaya adamak istemektedir; öyle ki, ekibin içtiği su bardaklarını elde yıkamak bile ona "Bardak yıkayarak AGI (Yapay Genel Zeka) inşa ediyorum, bundan daha iyi ne olabilir ki?" dedirtecek kadar ulvi gelmektedir
      ,
      .
      Ancak teknolojik cephede işler pek parlak gitmiyordur
      . DeepMind, klasik Atari oyunlarında (Breakout, Montezuma's Revenge vb.) kendi kendine ustalaşan yapay zeka ajanlarıyla dünyayı sarsarken, OpenAI'ın Andrej Karpathy liderliğindeki "Universe" projesi, internet tarayıcısında bir insan gibi fare tıklamayı ve klavye kullanmayı öğrenecek devasa ve genel bir ajan yaratmaya çalışarak fazla geniş bir hedefe odaklanmıştır
      ,
      . Karpathy'nin tabiriyle sistem sadece "rastgele tuşlara basmakta" (button-mashing) ve ödül kazanma ihtimali neredeyse sıfıra inmektedir
      . Bu süreçte araştırmacılar ile yazılım mühendisleri arasında bitmek bilmeyen kod tartışmaları yaşanınca Brockman inisiyatifi ele almış, "Gym" adını verdikleri altyapı projesini bizzat yöneterek şirkette akademisyenlerle mühendislerin eşit değer gördüğü bir kültür inşa etmeye girişmiştir
      ,
      . Mart 2016'da DeepMind'ın geliştirdiği AlphaGo'nun dünya Go şampiyonu Lee Sodol'u yenmesi üzerine Elon Musk ve Sam Altman haftalık ziyaretlerini sıklaştırmış, Musk ekibe "Daha yükseğe çıkalım, dünyadaki en iyi yetenekleri alamazsak DeepMind bizi ezip geçer" diyerek baskıyı artırmıştır
      ,
      . Brockman ise, Universe projesindeki hatalarından şu dersi çıkarmıştır: Gökyüzünde devasa bir şato inşa etmeye çalışıyorlardı ama aslında ihtiyaçları olan tek şey küçük bir barakaydı
      .
      Diğer yanda Sam Altman, Y Combinator'daki günlük görevlerini Michael Seibel'a devredip YC Group ve YC Research adını verdiği yeni felsefi oyun alanına odaklanmıştır
      . Altman, yapay zekanın insanların işlerini elinden alacağına inandığı için Evrensel Temel Gelir (Universal Basic Income - UBI) deneyleri başlatmış, yepyeni teknolojik şehirler kurmak için YC Cities projesini yaratmış ve hatta efsanevi bilgisayar bilimcisi Alan Kay ile birlikte HARC (Human Advancement Research Community) adlı, eski Bell Laboratuvarları tarzı bağımsız bir araştırma merkezi kurmuştur
      ,
      ,
      ,
      . Bu projelerin fonlaması genellikle Altman'ın kendi cebinden veya Infosys gibi bağlantılarından gelmektedir, ancak YC Research bünyesindeki bu projeler, tıpkı Altman'ın dikkat süresi gibi oldukça dağınıktır ve HARC gibi projeler finansman sıkıntısıyla bir yıl içinde dağılacaktır
      . Altman bu dönemde ayrıca Burning Man festivaline katılarak psikedelik deneyimler yaşamakta, oradaki insanların birbirine hediye verdiği o ütopik komün hayatını "AGI sonrası dünyanın" bir önizlemesi olarak görmektedir
      ,
      . Bilimkurguya olan takıntısı, HBO'nun Westworld dizisinin özel gösterimini düzenlemekten, insanların beyinlerine yerleştirilen bir bilgisayarla ölümsüzlüğü ve süper zekayı buldukları "The Gentle Seduction" (Nazik Baştan Çıkarma) adlı hikayeyi başucu eseri yapmasına kadar uzanmaktadır
      ,
      ,
      .
      Altman'ın dünyayı kurtarma vizyonu sadece teknolojiyle sınırlı kalmamış, siyasi ihtiraslara da dönüşmüştür
      . 2016 seçimleri yaklaşırken, Trump'ın kazanma ihtimaline karşı kendini öne atarak "Hadi eşcinsel Yahudi çocuğu gönderelim, bu işe yarar!" diyerek başkanlığa, daha sonra ise Kaliforniya Valiliğine aday olmayı bile ciddi ciddi düşünmüştür
      ,
      . Eski San Francisco Belediye Başkanı Willie Brown ile görüşmüş, ancak Brown'ın onu ciddiye almaması ve siyasi danışmanların uyarısıyla geri adım atmış, bunun yerine "The United Slate" (Birleşik Liste) adında, konut maliyetlerini düşürmeyi ve savunma bütçesini teknolojiye kaydırmayı amaçlayan bir siyasi manifesto yayınlamıştır
      ,
      ,
      . Bu süreçte kişisel hayatı da darmadağındır; anne ve babasının yıllar süren sessiz ayrılığı, en küçük kız kardeşi Annie'nin giderek artan psikolojik krizleri, Annie'nin fareleri öldürmek zorunda kaldığı laboratuvar işini bırakıp arabasında yaşamaya başlaması gibi olaylar Altman ailesini sarsmaktadır
      ,
      ,
      . Üstüne üstlük YC'nin efsanevi yatırımcısı Peter Thiel'in Donald Trump'a 1.25 milyon dolar bağış yapması Silikon Vadisi'ni birbirine katmış, Altman ise politik olarak karşıt dursa da entelektüel özgürlük adına Thiel'i savunmak zorunda kalarak tepki çekmiştir
      ,
      ,
      .
      Tüm bu kaosun ortasında asıl fırtına yapay zeka güvenliği cephesinde kopmaktadır
      . Ocak 2017'de, dışarıda camları titreten devasa bir fırtına koparken, Asilomar Oteli'nde toplanan dâhiler (Musk, Tegmark, Hassabis, Sutskever, Altman), yapay zekanın insanlığa düşman olmasını engellemek için "Asilomar Yapay Zeka İlkeleri"ni (Asilomar AI Principles) imzalamıştır
      ,
      ,
      . Bu ilkeler, AGI'ın bir silahlanma yarışından ziyade tüm insanlığın etik idealleri uğruna geliştirilmesini şart koşuyordu
      . Bu toplantıda Altman, Alan Kay'in öğrencisi olan ve ileride OpenAI yönetim kuruluna girecek Tasha McCauley ile tanışmıştır
      .
      Bu güvenli yapay zeka arayışı, felsefi bir hareket olan Etkin Fedakârlık (Effective Altruism - EA) ideolojisiyle organik bir şekilde birleşmiştir
      . Oxfordlu filozoflar William MacAskill ve Toby Ord tarafından kurulan bu akım, başlarda dünyadaki acıları azaltmak için en verimli yolları arıyordu (örneğin Harvard'lıların bağışlarıyla Afrika'ya sıtma ağları göndermek gibi "bed nets" dönemi)
      ,
      . Ancak zamanla, bu felsefe tamamen varoluşsal risklere (existential risk) ve AGI'ın insanlığı yok etme ihtimaline odaklanmaya başladı
      . Dustin Moskovitz ve Cari Tuna'nın devasa servetiyle desteklenen Open Philanthropy Vakfı, Holden Karnofsky liderliğinde bu korkuyu odağına aldı
      ,
      ,
      . Mart 2017'de Open Philanthropy, OpenAI'a tam 30 milyon dolarlık bir bağış yaptı ve karşılığında Karnofsky'yi yönetim kuruluna soktu
      . Ancak bu paranın bir bedeli vardı: Açık kaynak (open-source) savunucusu Elon Musk'ın aksine EA'ciler, kodların kötü niyetli kişilerin eline geçmesinden korktukları için OpenAI'ın tüm teknolojisini açık kaynak yapmasından vazgeçmesini talep ettiler ve şirket manifestosu bu yönde değiştirildi
      . Gözünüzde şöyle canlandırın: Dünyaya sınırsız ve ücretsiz bir enerji kaynağı dağıtmak üzere yola çıkan bir grup bilim insanı, o enerjinin bir nükleer bombaya dönüşme ihtimalinden ölesiye korkan bir grup felsefeci tarafından finanse edilmeye başlanmış ve kapılarına kilit vurmaya ikna edilmişlerdir
      ,
      . Bu ittifak, Musk'ın açık kaynak hayalinin sonunun başlangıcı olurken, ileride Altman'ın başına büyük belalar açacak EA yönetim kurulu krizlerinin de tohumlarını atmıştır
      .
      Bu bölümün özü: OpenAI'ın ilk yılları, teknolojik bocalayışlar ve Altman'ın siyasetten ömür uzatmaya kadar uzanan dağınık vizyonlarıyla şekillenmiştir. Laboratuvarın finansman ihtiyacı, yapay zekanın kıyamet getireceğinden korkan Etkin Fedakârlık (EA) hareketinin derin ceplerine ve felsefesine boyun eğmelerine neden olmuş, bu durum şirketin açık kaynaklı (open-source) köklerinden uzaklaşarak kapalı ve kurumsal bir yapıya doğru evrilmesinin ilk temelini atmıştır.
      ### Bölüm 13: Kâra Geçiş (Pivoting to Profit) — Dota 2, Transformer Devrimi ve Musk'ın Gidişi
      Ağustos 2017'de Seattle'daki kapalı gişe bir e-spor arenasında, binlerce Dota 2 hayranının çığlıkları arasında, dumanların içinden bir bilgisayar kasası sahneye tekerleklerle çıkarılır
      . Dünyanın en iyi Dota oyuncularından biri olan "Dendi" ile OpenAI'ın geliştirdiği bir bot karşı karşıyadır
      ,
      . Dendi daha ilk hamlelerinde botun acımasız ve kusursuz stratejisi karşısında şok olur; ilk maçı kaybeder, ikinciden çekilir ve "O çok güçlü" diyerek pes eder
      . Sahnede siyah V yaka tişörtüyle kel ve sırıtan Greg Brockman belirir ve "Bir sonraki adım 5'e 5 oynamak" diyerek hedefi büyütür, ki bu açıklama projeyi yürüten araştırmacı Jakub Pachocki'nin yüzünde dehşet dolu bir ifadeye neden olur çünkü Brockman bunu kimseye haber vermemiştir
      . Ancak Elon Musk mest olmuştur; DeepMind'ın AlphaGo'sundan daha karmaşık bir oyunda zafer kazandıklarını tweet atarak rakibine nispet yapar
      . Oysa perde arkasında bu başarı, Sam Altman'ın Microsoft CEO'su Satya Nadella'dan bizzat kopardığı 60 milyon dolarlık devasa Azure bulut bilişim (compute) kredisi sayesinde mümkün olmuştur
      . Robot elin Rubik küpünü çözmesi gibi diğer şov projeleri de medyada büyük ses getirmekteydi ancak şirketin asıl dönüm noktası tamamen bambaşka, sessiz bir köşeden gelecekti
      ,
      .
      Kendi halinde, içine kapanık bir araştırmacı olan Alec Radford, ajanların (agents) oyunda rastgele tuşlara basarak öğrenmesi yerine, doğrudan insan dilinin anlamını kavraması gerektiğine inanıyordu
      . 100 milyon Amazon ürün incelemesini sisteme yükleyip modelin sadece bir sonraki karakteri tahmin etmesini istedi; sistem şaşırtıcı bir şekilde metnin "olumlu" mu yoksa "olumsuz" mu olduğunu (sentiment neuron) kendi kendine öğrenmişti
      . Tam bu sırada, Haziran 2017'de Google'ın yayınladığı ve yapay zekanın uzun metinleri parça parça değil de eşzamanlı ve dikkat mekanizmasıyla (attention mechanism) işlemesini sağlayan o meşhur "Attention Is All You Need" (Transformer) makalesi yayınlandı
      . Ilya Sutskever, GPU'ların devasa işlem gücüyle birleşen bu mimarinin çığır açacağını hemen anladı; Brockman bunu "Feynman'ın dâhi olma yöntemi" olarak tanımlıyordu: İhtiyacın olan son yapboz parçasını başkasından alır, kendi sistemine takar ve dâhi olursun!
      ,
      . Radford hemen Transformer mimarisini kullanarak devasa bir dil modeli eğitmeye koyuldu. Veri seti olarak BookCorpus'u (telif hakkı uyarısı olan binlerce ücretsiz e-kitabın bulunduğu Smashwords platformundan izinsiz çekilmiş veriler), Quora sorularını ve Çince İngilizce sınavlarını kullandılar
      ,
      . Sonuç muazzamdı; model, eğitim almadığı konularda bile, sadece birkaç örnekle mantıklı cevaplar üretebiliyordu (buna "sıfır atışlı" - zero-shot öğrenme dendi)
      . İlk Üretken Ön-Eğitimli Transformer, yani GPT doğmuştu
      . Karpathy, haklı çıktıklarını anladı: Yapay zekaya oyun oynamayı sıfırdan öğretmektense, ona tüm interneti okutup dünyayı öğretmek çok daha mantıklıydı
      ,
      .
      Ancak bu ölçekteki bir "beyni" eğitmek korkunç bir işlem gücü (compute) gerektiriyordu
      . Model büyüdükçe donanım masrafları katlanarak artıyordu. İlk başta Initial Coin Offering (ICO - Kripto para arzı) ile para toplamayı düşündüler ama Musk bunun itibar zedeleyeceğini söyleyerek reddetti
      . Kâr amacı gütmeyen (nonprofit) bir yapı olarak 100 milyon dolar toplamaya çalıştılar ancak yatırımcılar, geri dönüşü olmayan bir kuruma bu kadar büyük bir parayı vermeyi reddetti
      . Şirketin kâr amacı güden bir modele (for-profit) geçmesi kaçınılmazdı, fakat bu durum Elon Musk ile iplerin tamamen kopmasına neden oldu
      ,
      . Musk, kontrolü tamamen ele almak ve CEO olmak istiyor, aksi takdirde Google ile rekabet edemeyeceklerini düşünüyordu
      . Brockman ve Sutskever, Altman'ın CEO olmasını destekleyerek Musk'a uzun bir e-posta yazdılar: "Bir AGI diktatörlüğünden kaçınmak için kurulmuş bir şirkette, sizin diktatör olabileceğiniz bir yapı kurmak kötü bir fikir" dediler
      . Bu e-postayı okuyan Musk öfkeden deliye döndü, "Bu son damla. Artık bitti. Benim paramla bedavaya kendi startup'ınızı kurmanıza izin vermeyeceğim" diyerek finansmanı anında kesti
      . Şirket bir anda parasız kaldı, Reid Hoffman kendi cebinden çalışanların maaşlarını ödemek zorunda kaldı
      . Ocak 2018'de Musk, OpenAI çalışanlarını toplayıp şirketin bu şekilde Google ile asla rekabet edemeyeceğini, tek kurtuluşun OpenAI'ı bir "nakit ineği" olarak Tesla'nın bünyesine katmak olduğunu söyledi
      . Çalışanlar karşı çıkıp güvenliği sorguladığında ise Musk bir araştırmacıya "pislik" (jackass) diyerek odayı terk etti ve OpenAI defterini tamamen kapattı
      .
      Artık şirketin fiili CEO'su olan Altman, donanım (hardware) krizini çözmek ve yapay zeka gücünü ürüne dönüştürmek için Leap Motion ve Tesla geçmişli Mira Murati'yi ("unicorngenetrix") kadroya kattı
      -
      . Ancak tam bu sırada, Mayıs 2018'de Altman'ın babası Jerry Altman bir kürek çekme antrenmanında kalp krizi geçirerek vefat etti
      . Sam Altman cenazede babasının telefonuna kaydettiği neşeli gülüşünü çalarak teknolojinin ölümü bir nebze de olsa yenebileceğini göstermeye çalıştı
      . Ancak bu ölüm aileyi parçaladı; kız kardeşi Annie, babasının cenazesinde arabasında yaşadığını anlattı, ailenin kendisine bıraktığı mirası ve sigorta fonlarını annesinin kontrolünde tutmasına isyan etti
      ,
      .
      Kişisel hayatındaki bu trajediye rağmen Altman, şirketin finansal yapısını kurgulamak için Temmuz 2018'de milyarderlerin yaz kampı olan Sun Valley konferansına katıldı
      ,
      . Pembe tişörtüyle devasa medya patronlarının arasında dolaşan Altman, yatırımcılara o güne dek görülmemiş bir model sunuyordu: "Kâr tavanlı" (capped-profit) şirket
      . Buna göre yatırımcılar yatırdıkları paranın en fazla 100 katını kazanabilecek, geri kalan tüm kâr insanlığın faydası için kâr amacı gütmeyen üst kuruluşa kalacaktı
      . Çoğu yatırımcı bu teklife gülüp geçse de, Khosla Ventures'tan Vinod Khosla bu misyon odaklı yaklaşıma inanarak 50 milyon dolarlık rekor bir çek yazdı
      ,
      . Akabinde Altman, Microsoft CEO'su Satya Nadella ile masaya oturdu ve Microsoft, sadece OpenAI'ın potansiyeline güvenmekle kalmayıp, kendi bulut sistemi Azure'un pazar payını artırmak için onlara milyarlarca dolarlık bir bilgisayar gücü kredisi açmayı kabul etti
      .
      Tüm bunlar olurken Altman'ın vizyonu şirketin sınırlarını aşıyordu; YC China ile Çin pazarına açılmayı hedefliyor, Suudi Arabistan'da Prens MBS'nin (Muhammed bin Selman) inşa ettiği devasa yapay zeka şehri Neom'un danışma kuruluna giriyordu (ta ki Cemal Kaşıkçı cinayeti patlak verene kadar)
      ,
      . Ancak Altman'ın bu dışa dönük, hızlı ve kural tanımaz yapısı Y Combinator içinde büyük rahatsızlıklara neden oluyordu
      ,
      . 2019'un başlarında OpenAI, Altman'ın resmen CEO olduğu "kâr tavanlı" yeni yapısını duyurdu. Bu yapının en tuhaf yanı, Altman'ın yönetim kurulunda bağımsız kalabilmek ve güven vermek adına şirketten hiçbir hisse (equity) almamış olmasıydı
      . Silikon Vadisinde bir CEO'nun kendi kurduğu şirketin hissesini reddetmesi eşine rastlanmamış bir şeydi ve asıl kontrolün (direksiyonun) hisselerde olduğunu bilenler için bu tam bir çılgınlıktı
      . Tasha McCauley, Reid Hoffman ve Adam D'Angelo gibi isimlerden oluşan yeni yönetim kuruluna Altman kendi ağzıyla şunu söylemişti: "Eğer yanlış bir şey yaparsam, beni kovarsınız."
      ,
      . Bu ikili hayat sürmesi YC'nin kurucularından Jessica Livingston'ı kızdırdı ve Altman'dan YC'den ayrılmasını talep etti
      . Altman itiraz etmedi, Geoff Ralston'a koltuğu devrederek OpenAI'a tam zamanlı geçti
      . Microsoft'un bulut kredileri şeklindeki 1 Milyar dolarlık dev yatırımıyla birlikte, OpenAI artık AGI yolunda sınır tanımayan bir rokete dönüşmüştü
      .
      Bu bölümün özü: OpenAI'ın, AlphaGo karşısında yaşadığı aşağılanma duygusu ve "Transformer" mimarisinin keşfi, laboratuvarı oyun oynayan ajanlardan ziyade dünyadaki tüm metinleri yutan devasa dil modellerine yöneltmiştir. Ancak bu modellerin talep ettiği devasa finansman ihtiyacı, Elon Musk'ın şirketi kontrol etme çabasıyla çatışıp onun ayrılmasına yol açarken; Sam Altman'ın yatırımcılara sunduğu tuhaf "kâr tavanlı" model (ve kendisinin hiç hisse almaması), Microsoft gibi bir devi arkalarına almalarını sağlamış, ancak ilerideki yönetim krizlerinin de fitilini ateşlemiştir.
      ### Bölüm 14: Ürünler (Products) — API, Anthropic Çatlağı ve Stokastik Papağanlar
      1.5 milyar parametreli GPT-2, "WebText" adı verilen (Reddit'te üçten fazla beğeni alan 8 milyon bağlantının tarandığı) bir veri setiyle eğitildiğinde şirket içindeki ilk büyük güvenlik krizi patlak verdi
      . Modelin inandırıcı denemeler, haberler ve hatta deepfake (sahte) metinler üretebildiğini gören araştırmacılar Dario Amodei ve Politika Direktörü Jack Clark dehşete düştü
      . İnternetteki yanlış bilgiyi ve komplo teorilerini devasa ölçekte yayma potansiyelinden korkan OpenAI, GPT-2'nin tam kodunu yayınlamaktan vazgeçtiğini duyurdu
      . Medya bu kararla acımasızca alay etti: "İnsanlık İçin O Kadar Tehlikeli ki Kilit Altında Tutulması Gerekiyor!" manşetleri atılırken şirket teknoloji basınının maskotu haline gelmişti
      .
      Ancak asıl fırtına GPT-3'ün planlanması sırasında koptu. Amodei, araştırma süreçlerindeki aşırı müdahaleci tavırları (bigfooting) nedeniyle Greg Brockman'ı bu yeni projeden tamamen dışlamak istedi; hatta kilit araştırmacı Alec Radford'ın Brockman'la çalışmayı reddettiğini tüm yönetimin önünde yüzüne vurdu
      . Yönetim becerisinden ziyade çatışmadan kaçınma (conflict-avoidant) eğilimiyle bilinen Altman, sırf Amodei'yi mutlu etmek ve onu şirkette tutmak için Brockman'ı feda etti
      . Amodei haklı görünüyordu çünkü o yıl yayınladığı "ölçeklendirme yasaları" (scaling laws) makalesiyle, modele daha fazla veri ve bilgisayar gücü verdikçe performansının mükemmel bir doğrusal grafikle artacağını matematiksel olarak ispatlamıştı; bu buluş, Altman'ın yatırımcılardan milyarlarca dolar toplaması için adeta bilimsel bir garanti belgesiydi
      .
      Bu teori ışığında inşa edilen GPT-3; Common Crawl (1 trilyon kelimelik internet verisi), Wikipedia ve kökeni hala tartışmalı olan korsan e-kitap kütüphanelerinden (LibGen gibi "gölge kütüphaneler" olduğu iddia edilen Books1 ve Books2) çekilen devasa verilerle beslendi
      ,
      . 175 milyar parametreye ulaşan bu devasa canavar, sadece birkaç örnekle (few shot learning) şiir yazabiliyor, çeviri yapıyor ve hatta öğretilmediği halde yazılım kodu yazabiliyordu
      . Ancak bu mucizevi model şirketin sunucularında öylece yatıyordu. GPT-3 projesinden dışlanan ve intikam hırsıyla yanıp tutuşan Brockman, 2019 Noel'inde herkes tatildeyken adeta bir "kod mağarasına" (code cave) kapanarak tek başına OpenAI'ın ilk ticari ürününün, yani GPT-3 API'sinin prototipini yazdı
      ,
      ,
      . Böylece herhangi bir şirket, kendi yazılımına OpenAI'ın zekasını doğrudan bağlayabilecekti.
      Ürünü satmak için Brockman ve Mira Murati, Stripe'tan öğrendikleri "Collison kurulumu" (Collison installation) taktiğiyle San Francisco sokaklarında kapı kapı dolaşıp startup'lara bu API'yi zorla denettirmeye çalıştılar
      . Ağına düşürdükleri en büyük balık, üniversite öğrencisi Nick Walton'ın yarattığı metin tabanlı fantastik rol yapma oyunu AI Dungeon oldu
      . Zindan ve Ejderhalar oyununun yapay zeka versiyonu olan bu oyun o kadar popüler olmuştu ki, oyunun barındığı sunucular Amazon'da "bir Tesla arabası fiyatına" denk gelen korkunç GPU masrafları yaratıyordu
      . Brockman, Walton'a ulaştı ve onu API'nin beta test kullanıcısı yaptı
      . Peter Welinder API takımının başına geçti ve COVID-19 karantinalarının başladığı 2020 baharında zorlu bir süreçten sonra ürünü piyasaya sürdüler
      ,
      .
      Fakat Sam Altman'ın dünyasında işler hiçbir zaman sadece şirket sorunlarıyla sınırlı kalmıyordu. Aynı günlerde kardeşi Annie'nin hayatı tamamen kontrolden çıkmıştı
      . Babası Jerry'nin 401(k) emeklilik fonunun kağıt üzerinde annesi Connie'ye kaldığını, annesinin de bu parayı (yaklaşık 40 bin dolar) Annie'ye transfer etmeyi reddettiğini öğrenince büyük bir yıkım yaşadı
      . Maddi imkansızlıklar içinde Los Angeles'ta yaşayan Annie, kirasını ödeyebilmek için SeekingArrangements (eskortluk/sugar daddy sitesi) üzerinden para karşılığı göğüslerini açtığı ve OnlyFans hesabı açtığı karanlık bir döneme girdi (kendi tabiriyle "Kira parası için a**k yalamak")
      ,
      . Aile terapisti eşliğinde Sam ve Connie'nin altı aylık finansal destek sağlama sözü verdikleri bir anlaşma yapıldı ancak Connie'nin, Annie'nin "işsiz birinin harcamaması gereken" Lyft ve esrar gibi masraflarına karışması ve "pirinç ve fasulye yiyerek ayda 100 dolarla yaşayabileceğini" söylemesi ipleri tamamen kopardı
      ,
      . Kardeşi Max'in, ailenin artık ona maddi destek vermeyeceğini söylemesi ve Sam'in de ona babasının küllerinden yapılmış bir "elmas" göndermek istemesi (Annie bunu "yiyecek parası için rehin bırakılacak" anlamsız bir hamle olarak görüyordu) üzerine Annie ailesiyle tüm iletişimini kesti ve Hawaii'de bir çiftliğe yerleşti
      . Altman ise pandeminin ortasında (tıpkı bir felaket hazırlıkçısı gibi) 1billionmasks.com adlı site üzerinden Çin'den maske tedariki yapıyor ve 1910 Genetics gibi biyoteknoloji şirketlerini GPT-3 API'sini kullanmaya teşvik ediyordu
      .
      Tüm bu kaosun ortasında, Haziran 2020'de API'nin piyasaya sürülmesiyle birlikte korkulan oldu
      . OpenAI, modelinin gerçek hayattaki karanlık yüzüyle tanıştı: AI Dungeon oyuncuları, GPT-3'ün sınırsız hayal gücünü çocuklarla ilgili cinsel fanteziler (pedofili) kurgulamak için kullanmaya başlamıştı
      . Sistemin fiilen "pedofili içerik üreten" bir araca dönüşmesi, yapay zekanın "hizalanması" (alignment) gerektiği fikrini acı bir şekilde doğruladı
      ,
      . Dario Amodei ve ekibi (güvenlik kanadı), Altman ve Brockman'ın Silikon Vadisi mantığıyla "Sadece ürünü çıkaralım ve büyüyelim" (ship this and get to scale) yaklaşımından artık iğreniyordu
      . Amodei, Altman'ın manipülatif ve psikolojik olarak istismar edici bulduğu yönetim tarzına daha fazla dayanamayarak 2021'in başlarında OpenAI'dan ayrıldı ve "Anthropic" adlı kendi rakip yapay zeka şirketini kurdu
      ,
      . Bu, Altman'ın kariyerinde asla atlatamayacağı büyük bir travma (çatlak) olarak kalacaktı
      .
      Eş zamanlı olarak, Anthropic ekibinin OpenAI'dan korkarak kaçmasını haklı çıkaran felsefi bir fırtına Google cephesinde kopuyordu. Araştırmacılar Emily Bender ve Timnit Gebru'nun kaleme aldığı "Stokastik Papağanların Tehlikeleri Üzerine: Dil Modelleri Çok Mu Büyük Olabilir?" (On the Dangers of Stochastic Parrots) makalesi, yapay zeka dünyasını sarsmıştı
      . Yazarlar; bu devasa modellerin sadece internetten çektikleri verileri "tahmin edip taklit eden" kör papağanlar olduğunu, Wikipedia ve Reddit gibi platformlardaki kullanıcıların büyük çoğunluğunun genç beyaz erkeklerden oluşması nedeniyle modellerin cinsiyetçi ve ırkçı önyargıları (bias) kalıcılaştırdığını (value-lock) ve modellerin devasa enerji tüketimiyle iklim krizini körüklediğini savunuyordu
      ,
      . Google bu makaleyi yayınlamayı reddedip Timnit Gebru'yu işten çıkardığında olay medyada büyük yankı buldu
      . Bu makale, Altman'ın laboratuvarının AGI'a koşarken neleri ezip geçtiğinin en net özetiydi ve ileride yaşanacak GPT-4 ve ChatGPT krizlerinin, hatta Altman'ın kendi şirketinden kovulma sürecinin erken bir habercisiydi
      .
      Bu bölümün özü: OpenAI'ın "sadece araştırma yapan" idealist bir laboratuvardan, kodlarını gizleyen ve API satan ticari bir "ürün" şirketine dönüşmesi, laboratuvar içinde derin kırılmalara yol açmıştır. Modelin internetin karanlık verileriyle beslenmesinin tehlikeleri (AI Dungeon'daki pedofili krizi veya Stokastik Papağanlar makalesindeki önyargı eleştirileri) gerçeğe dönüşürken, Altman'ın büyümeyi önceleyen politikalarından rahatsız olan Dario Amodei ve ekibinin şirketi terk edip Anthropic'i kurması, OpenAI'ın güvenliğe yaklaşımı konusundaki şüpheleri kalıcı hale getirmiştir.
  - baslik: Parça 5 · ChatGPT Devrimi, Yönetim Krizi ve Yeni Çağ (Bölüm 15-17, Sonsöz)
    icerik: |-
      Harika bir noktaya geldik. Sam Altman’ın kariyerinin zirvesini, silinmez bir iz bıraktığı o çılgın dönemi ve ardından gelen o meşhur "kovulma" krizini konuşacağız. Bu bölüm, kitabın en nefes kesici kısmı. İsteğine uygun olarak, hiçbir detayı atlamadan, yazarın argüman zincirini adım adım takip ederek ve günlük hayattan analojilerle zenginleştirerek bu bölümleri sana bir dost sohbeti sıcaklığında ama konunun tüm ciddiyetiyle yeniden anlatıyorum. Her cümlenin sonuna ilgili kaynak referanslarını da ekliyorum. Başlıyoruz!
      ### Bölüm 15: ChatGPT Devrimi — Yanlış Anlaşılmalar, "Hizalanma" (Alignment) ve İnterneti Yutan Yapay Zeka
      Yazar bu bölüme çok çarpıcı bir iddiayla başlıyor: OpenAI, ürünlerini tam olarak hazır olmadan piyasaya sürmenin yarattığı güvenlik krizleri sayesinde, yapay zekayı evcilleştirmeyi (alignment) öğrenmek zorunda kalmış ve bu zorunluluk ironik bir şekilde dünyanın en hızlı büyüyen uygulaması ChatGPT’nin doğuşuna zemin hazırlamıştır
      .
      Hatırlarsan, Greg Brockman kendi kod mağarasında GPT-3 için bir API yazmış ve bunu test etmesi için AI Dungeon (Yapay Zeka Zindanı) adlı fantastik rol yapma oyununun yaratıcısı Nick Walton'a vermişti
      . Oyun başlarda harikaydı, ancak kısa süre sonra korkunç bir güvenlik açığı ortaya çıktı: Kullanıcılar, yapay zekanın sınırsız hayal gücünü çocuklarla ilgili cinsel fanteziler (pedofili) kurgulamak için kullanmaya başlamıştı
      . OpenAI hemen müdahale edip Walton'dan bu içerikleri durdurmasını istediğinde Walton çaresizdi; çünkü içerikleri denetlemek imkansızdı, zira bu sapkın hikayeleri yazan yapay zekanın ta kendisiydi
      . Gözünde şöyle canlandır: Bir matbaa kuruyorsun ama makineler kendi kendine yasa dışı kitaplar basmaya başlıyor. Üstelik bu sistemi çalıştırmanın maliyeti o kadar korkunçtu ki, Walton'ın deyimiyle "sadece bir metin oyunu olmalarına rağmen kullandıkları GPU işlem gücünün maliyeti bir Tesla otomobili kadardı"
      . Sonunda AI Dungeon, tüm gelirini yapay zekaya harcamamak için OpenAI'ı terk etmek zorunda kaldı
      .
      Ancak bu krizler OpenAI'ı yavaşlatmadı; aksine daha da gaza bastılar. 2021 başlarında metinden görsel üreten DALL-E modelini, 2022 baharında ise bunun çok daha gelişmiş versiyonu DALL-E 2'yi duyurdular
      . İlk versiyon "tütü giymiş turp" gibi basit çizimler yaparken, yeni versiyon "Times Meydanı'nda kaykaya binen Corgi köpeğini" fotogerçekçi bir şekilde çizebiliyordu
      . Bu yetenek, teknoloji dünyasını büyülediği kadar korkuttu da. Airbnb CEO'su Brian Chesky, Sun Valley konferansında Sam Altman ile yan yana oturduğunda ona şöyle dedi: "Bu ya yaratıcılar için bir araç olacak ya da yaratıcıların yerini alacak. Her şey onu yaratıcı toplulukla birlikte inşa edip etmediğine bağlı"
      . Gerçekten de kısa süre sonra Greg Rutkowski gibi ünlü dijital fantastik sanatçıları, yapay zekanın kendi stillerini kopyalamasına karşı isyan edip davalar açmaya başlayacaktı
      .
      Altman ise tüm bu eleştirilere karşı felsefi bir kalkan örmüştü. Mart 2021'de yazdığı "Her Şey İçin Moore Yasası" (Moore's Law for Everything) adlı manifestosunda, yapay zekanın insan emeğini sıfıra indireceğini, böylece tüm mal ve hizmetlerin ucuzlayacağını savunuyordu
      . Düşünsene, robotlar senin için ev inşa ediyor, o robotları da başka robotlar üretiyor
      . Peki bu zenginlik nasıl dağıtılacaktı? Altman, 19. yüzyıl ekonomisti Henry George'un "arazi değeri vergisi" (land value tax) fikrini dirilterek, sadece toprak üzerinden vergi alınmasını ve tıpkı Y Combinator modelinde olduğu gibi, herkese ülkenin şirketlerinden ve arazilerinden bir parça hisse (equity) dağıtılmasını (Y-Cism) öneriyordu
      .
      Bu sadece teorik bir vizyon değildi; Altman kişisel servetini tam da bu geleceği inşa etmek için harcıyordu. Evrensel Temel Gelir (UBI) dağıtmak için insanların irislerini bowling topu büyüklüğünde bir krom küreyle tarayan Worldcoin kripto para projesini başlattı
      . İnsan ömrünü on yıl uzatmak amacıyla Retro Biosciences adlı şirkete 180 milyon dolar, yapay zeka veri merkezlerine ucuz enerji sağlamak için ise nükleer füzyon girişimi Helion'a 375 milyon dolar yatırdı
      . Özel hayatı da bu devasa vizyona paralel olarak lüksleşiyordu: San Francisco'da 27 milyon dolarlık bir malikane, Napa'da 15.7 milyon dolarlık bir çiftlik ve Hawaii'de (Zuckerberg ve Thiel'e komşu) 43 milyon dolarlık devasa bir arazi satın aldı
      . O dönem, Peter Thiel'in evindeki jakuzide tanıştığı Avustralyalı yazılımcı Oliver Mulherin ile çıkmaya başlamıştı
      . Ancak madalyonun karanlık bir yüzü vardı: Altman tüm dünyayı kurtarmayı vadederken, kız kardeşi Annie tam bir trajedi yaşıyordu. Ailesiyle bağları kopan, babasının mirasından mahrum bırakılan ve fiziksel ağrılarla boğuşan Annie, kirasını ödeyebilmek için OnlyFans'te ve SeekingArrangements (eskortluk) sitelerinde çalışmak zorunda kalmış, Twitter'dan abisi Sam'i "cinsel ve psikolojik istismarla" suçlayan paylaşımlar yapmaya başlamıştı
      .
      Şirket cephesine dönersek, GPT-3'ün yalan söyleme ve toksik içerik üretme (hallucinating) huyu hala devasa bir sorundu
      . Araştırmacılar, modeli insan beklentilerine "hizalamak" (alignment) için İnsan Geri Bildirimli Pekiştirmeli Öğrenme (Reinforcement Learning from Human Feedback - RLHF) adı verilen bir sistem geliştirdiler
      . Örneğin modele "Liberaller neden bu kadar aptal?" diye sorulduğunda, eski GPT-3 "Çünkü içten içe öyle olduklarını biliyorlar!" diye alaycı bir yanıt verirken, RLHF ile eğitilmiş "InstructGPT" modeli son derece tarafsız, ansiklopedik ve sıkıcı bir yanıt veriyordu
      . Sisteme adeta bir "Süperego" yerleştirilmişti
      . Ayrıca modelin yalan söylemesini engellemek için WebGPT adında, modelin internette gezinip kendini teyit etmesini sağlayan bir altyapı kurdular
      . En sonunda ise, modeli eğitmenin en iyi yolunun "diyalog" (Sokratik tartışma) olduğuna karar verdiler
      .
      2022 yazında yönetim kuruluna sunulan GPT-4, Bill Gates'in "Beni etkilemek istiyorsanız bu sınavı geçsin" dediği AP Biyoloji sınavından en yüksek notu (5) alabiliyor, kod yazabiliyor ve hatta şirketin en büyük eleştirmenlerinden Gary Marcus hakkında fıkralar uydurabiliyordu
      . Altman, bu devasa GPT-4 modeliyle yeni diyalog (chat) arayüzünü aynı anda piyasaya sürmenin dünya için "çok fazla" (massive update) olacağını düşündü
      . Dünyayı buna alıştırmak için, eski GPT-3.5 modelinin üzerine bu diyalog arayüzünü giydirip bir "ara ürün" olarak piyasaya sürmeye karar verdiler
      . Adını "Chat with GPT 3.5" koyacaklardı ama son anda "ChatGPT" olarak kısalttılar
      . Şirket içinde bunu o kadar önemsiz bir araştırma önizlemesi olarak görüyorlardı ki, Altman yönetim kuruluna haber verme gereği bile duymadı
      .
      Ancak 30 Kasım 2022'de atılan o mütevazı "ChatGPT'yi başlattık" tweeti dünyayı yerinden oynattı
      . Ürün sadece iki ayda 100 milyon kullanıcıya ulaşarak tarih yazdı
      . Arkadaşı Brian Chesky'nin dediği gibi, "Altman ateşi bulmuştu ama bununla yemek pişirip vahşi hayvanları uzaklaştırabileceğini henüz fark etmemişti"
      . Bu başarı, teknoloji devlerinde (özellikle Google'da) panik yarattı. Arama motoru tahtı sarsılan Google "kırmızı kod" ilan edip LaMDA tabanlı Bard chatbot'unu aceleyle duyurdu
      . Microsoft CEO'su Satya Nadella ise ChatGPT entegreli yeni Bing'i tanıtırken gazetecilere dönüp o meşhur, kibirli lafını etti: "İnsanların bilmesini istiyorum, Google'ı biz dans ettirdik!"
      . Altman artık bir süper stardı. ABD Senatosu'nda ifade verdiğinde senatörler onu köşeye sıkıştırmak yerine ona hayranlıkla bakıyor; "Sana ihtiyacımız var, maaşın ne kadar?" dediklerinde "Sadece sağlık sigortamı ödeyecek kadar, şirkette hiç hissem yok" yanıtıyla herkesi şoke ediyordu
      . Ardından Macron'dan Modi'ye kadar dünya liderleriyle görüşeceği küresel bir tura çıkarak yapay zeka çağının elçisi konumuna yükseldi
      . Ancak Altman'ın asıl büyük sınavı dünyayla değil, kendi şirketiyle olacaktı.
      Bu bölümün özü: OpenAI, yapay zekanın tehlikelerini ve toksik doğasını dizginlemek için geliştirdiği "hizalanma" (RLHF) ve diyalog arayüzü sayesinde, tarihin en hızlı büyüyen uygulaması ChatGPT'yi tamamen tesadüfi bir şekilde yaratmıştır. Bu başarı, Altman'ı trilyon dolarlık ütopyalar kuran küresel bir yıldıza dönüştürürken, Google ve Microsoft arasında insanlığın geleceğini belirleyecek acımasız bir yapay zeka silahlanma yarışının da fitilini ateşlemiştir.
      ### Bölüm 16: The Blip (Kovulma ve Geri Dönüş) — Güven Bunalımı, Manipülasyonlar ve Silikon Vadisi’nin En Çılgın Hafta Sonu
      Bu bölümün temel argümanı şudur: Sam Altman, yönetim kuruluna hissesi olmadığını ve kolayca kovulabileceğini söyleyerek onlara sahte bir güvenlik hissi vermiş; ancak arka planda şirketi tam bir Silikon Vadisi CEO'su gibi manipüle ederek yönetmesi, sonunda yönetim kurulunun paniğe kapılıp onu kovmasına (The Blip) yol açmıştır
      . Yazar, bu 5 günlük kaosun ardındaki psikolojik ve taktiksel savaşı adım adım çözümlüyor.
      Her şey, ChatGPT'nin patlamasıyla birlikte yönetim kurulunun (board) işlerin ne kadar ciddileştiğini fark etmesiyle başladı
      . Kurulda Altman'a sadık isimler hızla azalıyordu. Reid Hoffman kendi yapay zeka şirketini (Inflection AI) kurduğu için ayrılmış, Elon Musk'a yakınlığıyla bilinen Shivon Zilis ise Musk ile gizlice IVF (tüp bebek) yoluyla ikiz çocuk sahibi olduğunun ortaya çıkmasıyla etik bir kriz yaratıp istifa etmişti
      . Geriye sadece 6 kişi kalmıştı: Altman, Brockman, Sutskever ve üç bağımsız üye (Adam D'Angelo, Tasha McCauley ve Helen Toner)
      . Altman, kurula kendi müttefiklerini (örneğin Brian Chesky'yi) sokmaya çalışıyor, bağımsız üyeler ise Paul Christiano gibi güvenlik uzmanlarını istiyordu
      .
      İplerin kopmasına neden olan birkaç kritik olay yaşandı. İlk olarak "Çatışma Manipülasyonu": Adam D'Angelo'nun şirketi Quora, Poe adında, ChatGPT'yi de kapsayan bir "wrapper" (arayüz) chatbot çıkarmıştı
      . Altman bunu bir rekabet unsuru olarak gösterip D'Angelo'yu kuruldan atmak istedi. Helen Toner'a "D'Angelo ile bunu konuştum, o da ayrılması gerektiğini düşünüyor" dedi
      . Ancak Toner daha sonra Altman'ın D'Angelo ile bu konuyu hiç konuşmadığını, sadece yalan söylediğini fark etti
      . İkincisi "Güvenlik İhlalleri": Şirkette ürünlerin güvenliğini denetleyen Dağıtım Güvenlik Kurulu (DSB) vardı
      . Altman, yönetim kuruluna GPT-4'ün üç yeni özelliği için DSB onayı aldıklarını söylemişti, ancak Toner belgeleri incelediğinde sadece birinin onay aldığını gördü
      . Üstelik Microsoft, GPT-4'ü Hindistan'da DSB onayı olmadan test etmiş ve kurul bunu Altman'dan değil, koridorda tesadüfen karşılaştığı bir çalışandan öğrenmişti
      . Üçüncüsü "Gizli Anlaşmalar": Altman'ın Ortadoğu'da çip fabrikaları kurmak için milyarlarca dolar aradığı, nükleer şirketlerini halka açtığı ve OpenAI Startup Fund adındaki fonu "OpenAI" adıyla kurup aslında kişisel olarak kendi üstüne kaydettirdiği (ve buradan kar payı/carry aldığı) ortaya çıktı
      . Tüm bunlar olurken Ekim 2023'te Helen Toner, akademik bir makale yayınlayarak rakip şirket Anthropic'in ürün piyasaya sürmekteki yavaşlığını ve güvenliğini övmüş, ChatGPT'nin ise piyasayı köşeleri kestirmeye zorladığını yazmıştı
      . Altman küplere bindi, Toner'ı şirkete zarar vermekle suçlayarak fırçaladı
      .
      Ancak darbeyi indiren asıl güç dışarıdan değil, içeriden geldi: Dahi bilim insanı Ilya Sutskever
      . Sutskever, Altman'ın insanları birbirine düşürmesinden ve yalanlarından (Altman'ın "aa yanlış ifade etmişim" taktiği) bıkmıştı
      . Özellikle, yapay zekanın "akıl yürütme" (reasoning) yeteneği üzerine kurduğu ve geleceğin o1 (Strawberry) modeline dönüşecek olan ekibinin başına, Altman'ın Brockman'a yakın bir araştırmacı olan Jakub Pachocki'yi getirmesiyle büyük bir kaos yaşanmıştı
      . Sutskever, Helen Toner'a ulaştı ve şifreli bir şekilde "Mira (Murati) ile daha fazla konuşmalısınız" dedi
      . Toner, CTO Mira Murati ile konuştuğunda, Murati Altman'ın toksik yönetim tarzını tam 45 dakika boyunca anlattı
      . Altman'ın insanlara duymak istediklerini söyleyip sonra onları arkadan vurduğunu, Greg Brockman'ın ise projeleri zorbalıkla ele geçirdiğini ve şirketteki yetenekleri (Steve Dowling ve Bob McGrew gibi) kaçırdığını söyledi
      . Üstelik Murati bu şikayetleri Altman'a ilettiğinde, Altman İK müdürünü toplantılara sokarak Murati'yi psikolojik olarak köşeye sıkıştırmaya çalışmıştı
      .
      Yönetim kurulu dehşet içindeydi. Şirketin başındaki adamın bu kadar manipülatif olması, AGI (Yapay Genel Zeka) gibi dünyayı yok edebilecek bir gücü ona emanet edemeyecekleri anlamına geliyordu
      . Sutskever'in gönderdiği kanıt dosyalarıyla (Murati'nin Slack mesajı ekran görüntüleri) ikna olan bağımsız üyeler, Altman'ın bu hamlelerini sezip yeni müttefikler getirmesinden korktukları için acilen harekete geçme kararı aldılar
      .
      16 Kasım 2023 Perşembe günü oylama yapıldı
      . Ertesi gün, Las Vegas'ta Formula 1 yarışında olan Altman, Sutskever'in gönderdiği Google Meet linkine tıkladı. Ekranda Sutskever ve üç bağımsız üye vardı (Brockman kuruldan atılmıştı)
      . Sutskever buz gibi bir ifadeyle Altman'a kovulduğunu tebliğ etti; gerekçe sadece "yönetim kuruluyla iletişiminde yeterince dürüst olmamasıydı" (not consistently candid)
      . Saniyeler sonra Altman'ın şirket bilgisayarına erişimi kesildi
      .
      İşte o an Silikon Vadisi tarihinin en çılgın hafta sonu başladı. Şirketin yeni geçici CEO'su Mira Murati, kararı Microsoft'a (Satya Nadella'ya) bildirmek zorunda kaldı
      . Nadella şoktaydı. Şirket içinde yapılan toplantıda çalışanlar Sutskever'e "Sam ne yaptı?" diye sordu, Sutskever sadece "Hayır, söyleyemem" dedi
      . Cuma akşamı yönetim kurulu ile yönetici ekip (executive team) arasında büyük bir yüzleşme yaşandı
      . Strateji Şefi Jason Kwon, yönetim kurulunu köşeye sıkıştırarak "Ya bize bir açıklama yaparsınız ya da istifa edersiniz, aksi halde hepimiz işi bırakırız" diyerek 30 dakikalık bir ültimatom verdi
      . Kurul üyelerinden Helen Toner ise OpenAI'ın kar amacı gütmeyen misyon tüzüğüne atıfta bulunarak soğukkanlılıkla cevap verdi: "Eğer şirket yok olursa, bu misyonumuzla uyumlu bir sonuç olur" (fiduciary duty is to humanity)
      .
      Altman ve Brockman, kriz yönetimi uzmanı (eski Clinton danışmanı) Chris Lehane ve Brian Chesky'nin tavsiyesiyle "yüksek yolu" (high road) seçip kurula saldırmadan, sadece "OpenAI'ı çok sevdim" tweetleri atarak çalışanların duygularıyla oynadılar
      . Hafta sonu boyunca Altman'ın malikanesi bir savaş odasına dönüştü
      . Yönetim kurulu pazar akşamı eski YC mezunu Emmett Shear'ı yeni CEO olarak atadığını duyurunca
      , çalışanlar isyan etti. 770 çalışanın 700'den fazlası (şaşırtıcı bir şekilde aralarında taraf değiştiren Ilya Sutskever de vardı) "Sam geri dönmezse Microsoft'a geçeriz" yazılı bir dilekçe imzaladı
      . Sonunda Microsoft'un da baskısıyla yönetim kurulu pes etti; bağımsız üyeler gitti, yerlerine Larry Summers gibi ağır toplar geldi ve Altman Salı günü, sadece beş gün sonra, çok daha güçlü bir şekilde CEO koltuğuna geri döndü
      . Çalışanlar bu çılgın 5 güne "The Blip" (Kısa Kesinti/Pürüz) adını takacaklardı
      .
      Bu bölümün özü: OpenAI yönetim kurulu, Sam Altman'ın şirketi manipüle ederek ve sürekli eksik/yanlış bilgi vererek yönetmesinden korkup onu ani bir kararla kovmuştur. Ancak Altman'ın yıllarca ilmek ilmek ördüğü güçlü yatırımcı ağı ve çalışanların ona (ve hisse senedi zenginliğine) olan sarsılmaz sadakati, onu 5 gün içinde eskisinden çok daha mutlak bir güce sahip olarak şirketin başına geri getirmiştir.
      ### Bölüm 17: Zincirlerinden Kurtulan Prometheus — Trilyonluk Vizyon, Hükümet Lobiciliği ve Düşen Maskeler
      Krizin dumanı dağıldıktan haftalar sonra Sam Altman, Hawaii'deki malikanesinde Pasifik okyanusuna karşı sadece en yakınlarının (yaklaşık on kişi) katıldığı bir törenle Oliver Mulherin ile evleniyordu
      . Kardeşi Jack nikahı kıyarken, aynı adada yaşayan ve hala ailesiyle konuşmayan kız kardeşi Annie bu evliliği ancak internete sızan fotoğraflardan öğrenecekti
      . Altman, zamanında Turing'in eşcinselliği yüzünden intihara sürüklendiği günlerden, bugün dünyanın en tepesinde eşcinsel bir evlilik yapabilmesine şükrediyordu
      . Ancak "Blip" krizi Altman'a bir şey öğretmişti: Vizyonu ne kadar büyük olursa olsun, onu hayata geçirmek için sadece teknolojiye değil, politik ve altyapısal bir hegemonyaya ihtiyacı vardı.
      Altman, "politika için vaktim yok" dese de arka planda tam bir kukla ustası (kingmaker) gibi çalışıyordu
      . Biden'ın yaşlılığından ve vizyonsuzluğundan (örneğin CHIPS yasasının sadece 53 milyar dolar olmasını iki sıfır eksik buluyordu) rahatsızdı
      . Bu yüzden eski danışmanları Krisiloff kardeşler aracılığıyla, Demokratların başkan aday adayı Dean Phillips'in kampanyasına gizlice veri ve odak grup anketleri (focus group) finansmanı sağladı
      . Kampanya menajeri Steve Schmidt, paranın kaynağının "Sam Altman" olduğunu öğrenince dehşete düştü; Altman Phillips'i evinde ağırlayıp sözler verse de sonunda arkasında durmadı ve Phillips yarıştan silindi
      .
      Altman'ın asıl kafasındaki "politika", kendi deyimiyle "geleceğin para birimi olan" hesaplama gücünü (compute) artırmaktı
      . Çipler, veri merkezleri ve nükleer enerji altyapısı için BAE'den (Birleşik Arap Emirlikleri) yatırımcılarla, Asyalı çip üreticileriyle ve Amerikan regülatörleriyle tam 7 trilyon dolarlık (7 trillion) devasa bir yatırım projesi için görüşmeye başladı
      . (Bu rakam, Apple ve Microsoft'un toplam değerinden bile fazlaydı). Medya bu rakamla dalga geçince Altman X'te "Siktir et, neden 8 olmasın" (fk it why not 8) yazarak meme'lerle dalga geçti, ancak vizyonunda son derece ciddiydi
      .
      Ancak Washington'da (DC) işler Altman'ın istediği gibi gitmiyordu. Biden'ın Ekim 2023'te imzaladığı Yapay Zeka Kararnamesi, OpenAI'ın değil, tam da Altman'ın kurtulmaya çalıştığı "EA" (Etkin Fedakârlık - Effective Altruism) lobisinin eserine benziyordu
      . EA milyarderleri (Dustin Moskovitz ve Jaan Tallinn), RAND Corporation ve Georgetown'daki CSET gibi köklü düşünce kuruluşlarına on milyonlarca dolar akıtarak kendi "Kıyametçi Yapay Zeka Endüstriyel Kompleksi"ni (AI Doomer Industrial Complex) kurmuşlardı
      . Hatta bu vakıflar, ABD hükümetinin kritik ofislerine "burslu" (fellow) adı altında kendi adamlarını yerleştirmişti
      . Bu lobi sayesinde, belirli bir boyutun üzerindeki tüm yapay zeka modellerinin Amerikan hükümetine detaylı rapor vermesi zorunluluğu getirilmişti
      . Altman'ın kovulmasında başrol oynayan Helen Toner ve Tasha McCauley gibi isimler de RAND ve CSET gibi kurumlarda çalışıyordu
      . OpenAI ise buna karşılık Washington'un en büyük lobi firmalarıyla (DLA Piper, Akin Grump vb.) anlaşıp savaş pozisyonu aldı
      .
      Şirket içinde ise "normale dönme" operasyonu vardı. Yönetim kuruluna Sony ve Gates Vakfı'ndan tecrübeli (ve tehlikesiz) isimler eklendi (Nicole Seligman, Sue Desmond-Hellmann)
      . Altman'ı aklayan WilmerHale soruşturmasının ardından, OpenAI kar amacı gütmeyen bu "garip" tüzükten (charter) kurtulup, Silikon Vadisi'nin standart Kar Amacı Güden (Public Benefit Corporation) yapısına geçme kararı aldı
      . Bu durum Elon Musk'ı o kadar çıldırttı ki, "Kar amacı gütmeyen şirketime Microsoft el koydu" diyerek Sam Altman'a ve OpenAI'a devasa bir dava açtı
      .
      En büyük kayıp ise beyin göçüydü. "İlya nerede?" söylentilerinin ardından Ilya Sutskever, şirketin kendi değerlerinden uzaklaştığını görerek Mayıs 2024'te kesin olarak istifa etti
      . Onu Güvenlik (Superalignment) ekibinin başı Jan Leike izledi: "Güvenlik kültürü, parlak ürünlerin arka koltuğuna atıldı" diye yazdı
      . Olayın asıl skandal boyutu ise şuydu: OpenAI'ın, ayrılan bu araştırmacıları susturmak için "Eğer bizi eleştirmeme (NDA) sözleşmesini imzalamazsanız, içerideki kazanılmış hisselerinizi (vested equity) geri alırız" diye tehdit ettiği ortaya çıktı
      . Altman büyük bir utançla Twitter'dan özür dileyip "Bundan haberim yoktu, çok utanıyorum" diyerek geri adım attı, ancak araştırmacı camiasıyla olan bağlar onarılamaz biçimde yara almıştı
      . Sutskever, kendi güvenli süper zeka şirketi SSI'ı (Safe Superintelligence Inc.) kurup anında 1 milyar dolar yatırım topladı
      .
      OpenAI'ın imajı yaratıcı sınıflar nezdinde de çöküyordu. Mayıs 2024'te tanıtılan sesli, görüntülü ve hızlı yeni model GPT-4o'nun seslerinden biri olan "Sky", oyuncu Scarlett Johansson'ın (özellikle Her filmindeki) sesine o kadar benziyordu ki, Johansson "Aylarca beni ikna etmeye çalıştılar, reddedince sesimi kopyalamışlar" diyerek dava tehdidinde bulundu
      . The New York Times, tüm arşivi izinsiz kullanıldığı için telif davası açtı
      .
      Tüm bu kaosun sonunda, 2024 Sonbaharı geldiğinde OpenAI'ın eski çekirdek kadrosu tamamen dağılmıştı. CTO Mira Murati, Bob McGrew ve John Schulman da istifa etmiş; Greg Brockman izne ayrılmıştı
      . Wired dergisine kapak olan o efsanevi dörtlünün (Sam, Greg, Ilya, Mira) içinden geriye sadece "Yamyamların Kralı" Sam Altman kalmıştı
      . Ancak yapayalnız kalan Altman, aynı günlerde şirketin değerini 157 milyar dolara çıkaran 6.6 milyar dolarlık (Thrive Capital, Microsoft ve MGX'ten) rekor bir yatırım turunu kapatmayı başardı
      . Üstelik yatırımcılara "Rakiplerim Anthropic veya xAI'a yatırım yapamazsınız" şartını bile kabul ettirmişti
      .
      Bu bölümün özü: Yönetim krizini atlatan Sam Altman, şirketi kar amacı güden bir deve dönüştürerek 157 milyar dolarlık bir imparatorluğun tek hakimi olmuştur. Ancak bu süreçte şirketin kuruluş ideallerinden kopması, Ilya Sutskever gibi dahi araştırmacıların ve güvenlik ekiplerinin şirketi terk etmesine, yaratıcı endüstrilerin (Scarlett Johansson, NYT) devasa davalar açmasına ve hükümet nezdinde şiddetli lobi savaşlarına neden olmuştur.
      Sonsöz (Epilogue): “Daha Önce Hiçbir Şey İçin Bu Kadar Heyecanlanmamıştım”
      Kitabın bu kapanış bölümü, teknolojik ütopyalar ile insani trajedilerin birbirine nasıl karıştığını çok sert bir kontrastla, yazarın sunduğu kanıtlar üzerinden anlatıyor
      .
      2024 biterken Altman ve eşi Mulherin, Mart ayında taşıyıcı anne aracılığıyla doğacak ilk çocuklarını bekleyerek Altman'ın her zaman hayalini kurduğu o büyük aileyi kurmaya hazırlanıyordu
      . Kardeşleri Jack ve Max de kendi milyonerlik ve risk sermayesi (VC) yollarını çizmiş, Alt Capital ve Saga Ventures gibi fonlarla kendi imparatorluklarını kurmuşlardı
      . Ancak ailenin en küçüğü, Hawaii'de yaşayan Annie'nin durumu gittikçe kötüleşiyordu. Yıllarca süren tuhaf semptomlarının sebebinin Ehlers-Danlos sendromu (nadir bir genetik bağ dokusu hastalığı) olduğu ortaya çıkmıştı
      . Babasının ölümünden altı yıl sonra ancak cüzi bir kısmına erişebildiği miras parasıyla ayakta durmaya çalışan Annie, Ocak 2025'te (Missouri'deki zaman aşımı dolmadan sadece 2 gün önce) Sam Altman'a federal mahkemede "çocukluk çağı cinsel istismarı" (3 yaşından itibaren başladığını iddia ettiği) suçlamasıyla dava açtı
      . Annesi Connie ve diğer kardeşleri ortak bir bildiriyle bu iddiaların "tamamen gerçek dışı" olduğunu, Annie'nin akıl sağlığı sorunları yaşadığını ve onu korumak için bunca zaman sessiz kaldıklarını açıkladılar
      . Yazar bu durumu, dünyanın en güçlü insanının kendi ailesindeki kaosu çözememesinin trajedisi olarak sunuyor.
      Dış dünyada ise Altman'ın düşmanları güçlenmeye devam ediyordu. Sutskever'in akıl hocası ve "Yapay Zekanın Vaftiz Babası" Geoff Hinton, 2024 Ekim'inde Nobel Fizik Ödülü'nü kazandığında basın toplantısında kameraların karşısına geçip dudak uçuklatan bir cümle kurdu: "Öğrencilerimden birinin (Ilya) Sam Altman'ı kovmuş olmasıyla özellikle gurur duyuyorum. Altman güvenlikten çok kârı önemsiyordu."
      . Diğer yandan Elon Musk, Trump'ın başkanlık kampanyasına çeyrek milyar dolar dökerek (ve kendine "First Buddy" - İlk Kanka diyerek) dünyanın en güçlü politik figürlerinden birine dönüşmüştü
      . Musk, Altman'a açtığı davayı genişletmiş ve Tucker Carlson'a "Sam Altman'a güvenmiyorum. Dünyanın en güçlü yapay zekasının güvenilmez birinin elinde olmaması gerektiğini düşünüyorum" diyerek Altman'ı Trump yönetiminin en büyük düşmanlarından biri haline getirmişti
      .
      Tüm bu kişisel yıkımlara, güvenlik eleştirilerine ve güçlü düşmanlara rağmen Altman'ın gözü çok uzak ufuklardaydı. Amerikan hükümeti BAE ile anlaşmasına izin vermeyince, aynı 7 trilyonluk vizyonu Amerika'da uygulamak için lobi yapmaya başladı
      . Nükleer reaktörler ve veri merkezleri için devasa devlet/özel sektör ortaklıkları kurulmazsa, Çin'in AGI yarışını kazanacağını ve yapay zekanın sadece zenginlerin elinde bir oyuncağa dönüşüp savaşlara neden olacağını savunuyordu
      .
      Eylül 2024'te yayımladığı "Zeka Çağı" (The Intelligence Age) adlı makalesinde, insanın evriminin hesaplama gücü (compute), enerji ve insan iradesiyle yeni bir çağa girdiğini ilan etti
      . Yazar, Altman'ın bu sarsılmaz inancını David Deutsch'un The Beginning of Infinity kitabına bağlıyor. Altman'ın herkese önerdiği bu kitaba göre "Doğa yasaları tarafından yasaklanmamış her şey, doğru bilgiyle başarılabilir."
      . Ölüm çözülebilir bir problemdir. Evrenin en karanlık köşeleri bile ele geçirilebilir.
      Altman, bu bitmek bilmeyen ilerleme inancını San Francisco Russian Hill'deki evinde adeta bir tapınağa çevirmiştir. Evden içeri girdiğinizde sizi hominid atalarımızın 1.5 milyon yıl boyunca kullandığı üç adet ilkel el baltası karşılar. Yanında kılıçlar, Concorde uçağının bir motor pervanesi, vakum tüpleri, ilk bilgisayarı olan Mac LC II ve hemen yanında da OpenAI'ın ürettiği robotik bir el durur
      . İnsanlığın bu alet yapma serüveninin nereye varacağına dair inancını, o meşhur makalesinin sonunda sadece Altman'ın yazabileceği şu çılgın ve optimist cümleyle özetler:
      "Süper zekaya birkaç bin gün içinde ulaşmamız mümkün (!); belki daha uzun sürer, ama oraya varacağımızdan eminim."
      .
      Bu bölümün özü: Sam Altman, kendi ailesi içindeki cinsel istismar suçlamaları gibi ağır trajedilere, Nobel ödüllü bilim insanlarının sert eleştirilerine ve Elon Musk gibi devasa düşmanların baskılarına rağmen sarsılmaz bir iyimserlikle yoluna devam etmektedir. O, insan aklının ve teknolojinin sınırları aşarak (ölüm dahil) evrendeki her sorunu çözeceğine ve çok yakında "Zeka Çağı"nı başlatacağına olan inancıyla "geleceği inşa etmeye" adanmış bir fatih portresi çizmektedir.
