      BÖLÜM 6: Neşelenin
      Bütün zamanların en çok izlenen TED konuşmasının hangisi olduğunu hiç düşündünüz mü? Eğlenceli bir komedyen, dünyaca ünlü bir yıldız ya da sansasyonel bir sihirbaz bekliyorsanız yanılıyorsunuz. Açık ara farkla birinci sırada olan, Sir Ken Robinson'ın okulların yaratıcılığı nasıl öldürdüğü üzerine yaptığı eğitim reformu hakkındaki 18 dakikalık konuşmasıdır
      . Conan O'Brien veya Oprah Winfrey gibi popüler isimlerin bile bu videonun popülerliğine yaklaşamamış olmasının sırrı nedir
      ? Yazar Carmine Gallo'ya göre formül basittir: İnsan beyni yeniliği görmezden gelemez ve mizahı sever; bu ikisini birleştirdiğinizde "sunum altını" elde edersiniz
      ,
      .
      Savunmaları Kırmak ve Mizahın Gücü Robinson, eğitim gibi sıkıcı bulunabilecek eski bir sorunu tartışmak için yepyeni bir yaklaşım olan mizahı kullanmıştır
      . Konuşmasına, "Eğer bir yemek davetindeyseniz ve eğitim alanında çalıştığınızı söylerseniz... birisi 'Ne iş yapıyorsunuz?' derse ve siz de eğitim alanında çalıştığınızı söylerseniz, yüzlerinden kanın çekildiğini görebilirsiniz. 'Aman Tanrım, neden ben? Bu bütün hafta çıktığım tek gece,' der gibidirler," diyerek başlar ve hemen ardından salonu kahkahalara boğar
      . Konuşması boyunca izleyicisini hem düşündürüp hem güldürmeyi başarır. Örneğin; çizim dersinde Tanrı'nın resmini çizdiğini söyleyen ve öğretmeninin "Ama kimse Tanrı'nın nasıl göründüğünü bilmiyor" demesi üzerine "Bir dakika sonra bilecekler" yanıtını veren 6 yaşındaki küçük kız hikayesi
       bunlardan biridir. Ya da Shakespeare'in de bir zamanlar 7 yaşında olduğunu, İngilizce sınıfında oturup canının sıkıldığını ve babası tarafından "Git yat ve kalemini bırak, öyle konuşmayı da bırak, herkesin kafasını karıştırıyorsun" diye yatağa gönderildiğini anlattığı o muazzam zihin oyunu
      . Hatta, kendi oğlunun Los Angeles'a taşınırken 4 haftadır tanıdığı "hayatının aşkı" Sarah'dan ayrılacağı için çok üzüldüğünü, kendilerinin ise taşınma sebebinin zaten o kızı geride bırakmak olduğunu söyleyerek izleyiciyi yıkar geçirir
      . Son olarak, üniversite profesörlerinin bedenlerini sadece "kafalarını toplantılara götürmek için bir taşıma formu" olarak gördüklerini esprili bir dille ifade eder
      ,
      .
      Peki mizah neden bu kadar işe yarar? Yazar Sır #6'yı şöyle açıklar: Kendinizi (ya da konunuzu) çok ciddiye almayın
      . Mizah kullanmak, izleyicinin savunmalarını azaltarak mesajınıza daha açık hale gelmelerini sağlar ve sizi daha sevimli kılar
      . The Buying Brain (Satın Alan Beyin) kitabının yazarı Dr. A.K. Pradeep'e göre, insan beyni dikkat çeken, yeni ve akıllı şeyler aramak için eğitilmiştir
      ,
      . Mizah, beynin tepki vermeye donanımlı olduğu bir araçtır ve mesajınızı yepyeni kılar
      .
      Psikolog Rod A. Martin, The Psychology of Humor (Mizahın Psikolojisi) adlı çalışmasında mizahın "kendini sevdirme taktiği" olarak grup hiyerarşisinde statüyü güçlendirdiğini ve kabul edilmeyi kolaylaştırdığını savunur
      ,
      . Gülmek, Martin'in "etki başlatma" dediği, başkalarında olumlu duygular uyandıran, grup kaynaşmasını sağlayan bir mekanizmadır
      . Üstelik araştırmalar, esprili insanların cana yakın, zeki ve hayal gücü kuvvetli olarak algılandığını, hatta çöpçatanlık sitelerinde mizah anlayışının yüzde 80'in üzerinde bir oranla en çok arzulanan özellik olduğunu kanıtlamaktadır
      .
      İş dünyasında mizahın etkisini inceleyen Fabio Sala'nın Harvard Business Review için yaptığı "Gülmek Kazandırır" (Laughing All the Way to the Bank) çalışması çok çarpıcı bir gerçeği ortaya koyar. Sala, olağanüstü performansa sahip yöneticilerin saatte 17,8 kez, ortalama yöneticilerin ise saatte 7,5 kez mizah kullandığını ve yöneticilerin ikramiye miktarları ile mizah kullanımları arasında doğrudan pozitif bir bağlantı olduğunu keşfetmiştir
      ,
      . Kısacası, ne kadar komikseniz cüzdanınız o kadar doludur. Ancak kilit nokta, komik olmaya çalışmak değil, duygusal zeka ile pozitif mizahı ustaca harmanlamaktır
      .
      Tehlikeli Sular: Fıkra Anlatmaktan Kaçının Burada çok kritik bir uyarısı var yazarın: Profesyonel bir komedyen değilseniz, sahnede asla fıkra anlatmayın
