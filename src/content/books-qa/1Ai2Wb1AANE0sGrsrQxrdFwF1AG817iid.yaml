  - baslik: Kitabın Yapısı ve Yol Haritası
    icerik: |-
      "TED Gibi Konuş" (Talk Like TED) kitabının kaynaklarda belirtilen içindekiler tablosuna ve bölüm içeriklerine göre tam yapısı ile 5 mantıksal parçaya bölünmüş hali aşağıdadır:
      Kitabın Tam Yapısı ve Bölüm Özetleri
      Giriş: Fikirler Yirmi Birinci Yüzyılın Geçer Akçesidir Fikirlerin, ancak etkili bir şekilde iletildiklerinde dünyayı değiştirebilecek güce sahip olduğunu vurgular
      . TED konferanslarının olağanüstü başarısını örnek göstererek, iyi bir konuşmacının fikirlerini nasıl paketleyip sunduğuna dair genel çerçevenin önemini açıklar
      .
      1. BÖLÜM: DUYGUSAL
      1. İçinizdeki Ustayı Çıkarın: Etkili bir sunumun temelinde konuşmacının anlattığı konuya duyduğu derin tutku ve bağlılık yatar
      . Bilimsel araştırmalar, tutkunun izleyiciye doğrudan bulaştığını ve kendi ilham almayan birinin başkasına ilham veremeyeceğini göstermektedir
      .
      2. Hikaye Anlatma Sanatında Ustalaşın: İzleyicinin kalbine ve aklına ulaşmanın en etkili yolunun sadece veriler vermek değil, kişisel ya da markalara ait hikayeler anlatmak olduğunu savunur
      . Hikayeler, konuşmacı ile dinleyicinin beyin dalgalarını "senkronize" ederek aradaki direnç duvarlarını yıkar
      .
      3. Sohbet Edin: Sahnede kusursuz ve doğal görünmenin ardında aslında içeriği tam anlamıyla içselleştirmeyi sağlayan saatler süren provaların yattığını belirtir
      . Konuşma hızını, jestleri ve beden dilini sanki yakın bir arkadaşınızla sohbet ediyormuş gibi rahat bir seviyeye getirmenin önemi vurgulanır
      .
      2. BÖLÜM: YENİ
      4. Bana Yeni Bir Şey Öğretin: İnsan beyninin yeniliğe karşı genetik bir zaafı olduğunu ve daima dikkat çeken yeni şeyler aradığını anlatır
      . İzleyiciye tamamen farklı paketlenmiş veya eski bir sorunu çözmenin taze yollarını sunan taze bilgilerin, onların dünya görüşünü nasıl değiştirebileceği işlenir
      .
      5. Ağızları Açık Bırakan Anlar Yaratın: Her sunumun, izleyicinin aklına kazınacak şok edici, çarpıcı veya şaşırtıcı bir zirve anına ihtiyacı olduğunu savunur
      . "Duygu yüklü olaylar" olarak bilinen bu anların, beyne dopamin salgılatarak mesajın çok daha uzun süre hatırlanmasını sağladığı bilimsel olarak açıklanır
      .
      6. Neşelenin: Mizahın, dinleyicilerin savunmasını düşürerek onları mesajınıza karşı çok daha alıcı ve sempatik hale getirdiği vurgulanır
      . Ancak sahnede fıkra anlatmak yerine; kişisel anekdotlar, analojiler veya eğlenceli görsellerle doğal ve güvenli bir mizah oluşturulması gerektiği tavsiye edilir
      .
      3. BÖLÜM: AKILDA KALICI
      7. 18 Dakika Kuralına Bağlı Kalın: İdeal bir sunum uzunluğunun 18 dakika olduğunu, bunun ötesindeki sürelerin izleyicide "kavramsal birikmişliğe" ve zihinsel yorgunluğa yol açtığını açıklar
      . Konuyu kısa, öz ve "Üç Kuralı"na uygun bir mesaj haritasıyla aktarmanın, dinleyicinin anksiyetesini azaltıp akılda kalıcılığı artırdığı gösterilir
      .
      8. Çoklu Duyusal Deneyimlerle Zihinsel Bir Resim Boyayın: Metin dolu PowerPoint slaytlarının devrinin kapandığını, bunun yerine görsel, işitsel ve dokunsal uyarım sağlayan multimedya öğelerinin kullanılması gerektiğini savunur
      . Slaytlarda bol fotoğraf ve sahne malzemesi kullanmanın, beynin bilgiyi "ikili kodlama" ile hafızaya çok daha derin kazımasına yardımcı olduğu belirtilir
      .
      9. Şeridinizde Kalın: Sahnede asla olmadığınız biri gibi davranmamanız, şeffaf ve tamamen özgün olmanız gerektiği anlatılır
      . Dinleyicilerin sahteliği anında sezeceği; bu nedenle konuşmacının kendi zayıflıklarını, hikayesini ve hislerini açıkça paylaşacak cesareti göstermesinin en büyük ikna gücü olduğu vurgulanır
      .
      Derinlemesine İnceleme İçin 5 Mantıksal Parça (A-E)
      Gelecekteki derinlemesine analizlerinizi sistemli bir şekilde yürütebilmek adına, kitabın mevcut olan 3 ana bölümünü alt kırılımlara ayırarak 5 mantıksal parçaya (A-E) bölebiliriz:
      Parça A: İlhamın Temelleri (Giriş ve 1. Bölüm) Etkili iletişimin günümüzdeki değeri ve konuşmacının kendi içsel "tutkusunu" keşfetme süreci. (Fikirlerin değeri ve sunumda ustanın inşası).
      Parça B: Empati ve Bağ Kurma (Bölüm 2 ve 3) İzleyici ile beyinden beyne bağ kurmayı sağlayan hikayeleştirme teknikleri ve provalarla sağlanan sohbet doğallığı / beden dili yönetimi.
      Parça C: Zihni Uyandırma Stratejileri (Bölüm 4 ve 5) Beynin yenilik arayışını doyuracak taze bilgiler sunma ve sunumun ortasında unutulmayacak "vay canına" (duygu yüklü) anları tasarlama kurgusu.
      Parça D: Bilişsel Yükü Hafifletme (Bölüm 6 ve 7) Mizah yoluyla ortamı ısıtıp savunmaları kırma ve beynin glikoz (enerji) tüketimini optimize eden 18 dakikalık "Üç Kuralı" sınırlandırmaları.
      Parça E: Çarpıcı Sahneleme ve Özgünlük (Bölüm 8 ve 9) Bilgiyi yalnızca kelimelerle değil çoklu duyusal (resim, ses, nesne) deneyimlerle paketleme ve konuşmacının sahnede kendi benliğini (şeridini) cesurca koruması.
  - baslik: Parça A · İlhamın Temelleri (Giriş ve Bölüm 1)
    icerik: |-
      Harika bir yolculuğa başlıyoruz! Kitabın bu ilk mantıksal parçası (Parça A), aslında tüm iletişim çabalarımızın üzerine inşa edileceği sarsılmaz temeli atıyor. Gelin, Carmine Gallo’nun "TED Gibi Konuş" kitabının Giriş ve 1. Bölümünü, yazarın ayak izlerini adım adım takip ederek, sanki karşılıklı kahve içip sohbet ediyormuşuz gibi, ama tüm verileri ve bilimsel derinliği de koruyarak yeniden anlatalım.
      GİRİŞ: Fikirler Yirmi Birinci Yüzyılın Geçer Akçesidir
      Gündelik hayatta paranın her kapıyı açtığına, dünyayı döndüren şeyin ekonomik güç olduğuna inanırız, değil mi? Ancak yazarımız Carmine Gallo, kitabın daha ilk satırlarında bizi sarsıcı bir iddiayla karşılıyor: Yirmi birinci yüzyılın asıl geçer akçesi, yani en değerli para birimi fikirlerdir
      . Ancak burada çok kritik bir eşik var. Bir fikriniz altın değerinde olabilir, fakat onu topraktan çıkarıp, işleyip, parlatıp karşısınızdakine sunamadığınız sürece o altının hiçbir değeri yoktur
      . Fikirler ancak etkili bir biçimde paketlenip sunulduklarında dünyayı değiştirebilecek o muazzam güce kavuşurlar
      .
      Gallo bu iddiasını kanıtlamak için bizi iki zıt ama eşit derecede efsanevi TED konuşmacısının dünyasına götürüyor. Mart 2012'de sahneye çıkan vatandaşlık hakları avukatı Bryan Stevenson'ı düşünün
      . Sahneye çıkıyor ve tam 18 dakika boyunca hiçbir PowerPoint slaytı, görsel veya sahne malzemesi kullanmadan konuşuyor
      . Sadece anlatısının gücünü kullanıyor
      . Sonuç mu? TED tarihinde en uzun süre ayakta alkışlanan kişi oluyor ve izleyiciler, onun kurumu olan Eşit Adalet İnisiyatifi'ne tam 1 milyon dolar bağışlıyor
      . Bu, konuşmasının her bir dakikası için 55 bin doların üzerinde bir değer demek!
      .
      Diğer tarafta ise Profesör David Christian var. Stevenson'ın aksine, Christian 18 dakikaya evrenin 13 milyar yıllık tarihini sığdırdığı sürükleyici konuşmasında ilginç grafiklerle dolu slaytlar kullanıyor
      . O da Stevenson gibi milyonlarca kez izleniyor ve okullarda "Büyük Tarih" adında yeni bir hareket başlatıyor
      . Görünüşte tarzları tamamen zıt olan bu iki adamın sırrı nedir? Gallo'ya göre her ikisi de ikna etmenin ilmini ve sanatını çözmüş, en iyi sunumların arkasındaki "dokuz sırrı" kullanmışlardır
      .
      Peki, bu "paylaşmaya değer fikirler" platformu olan TED nasıl bu kadar devasa bir fenomene dönüştü? Aslında her şey 1984 yılında Richard Saul Wurman'ın bir defalık bir etkinliğiyle (Teknoloji, Eğlence ve Dizayn) başlıyor
      . 2001'de Chris Anderson konferansı satın alıyor
      . 2006 yılında ise TED.com kurularak dünyaya açılıyor
      . Sadece Al Gore, Ken Robinson ve Tony Robbins gibi isimlerin ilk videolarıyla deneme yapılan site, izleyicilerden öyle coşkulu bir yanıt alıyor ki, Anderson'ın deyimiyle "paylaşmaya değer fikirler" etrafında dönen bir dünya hoparlörüne dönüşüyor
      . Kasım 2012'ye gelindiğinde videolar 1 milyar izlenmeyi aşıyor, günde 1,5 milyon kez izleniyor ve 90 dile çevriliyordu
      . Artık Hollywood yıldızlarından (Ben Affleck) rock efsanelerine (Bono) ve teknoloji liderlerine (Sheryl Sandberg) kadar herkes, ciddiye alınmak ve dünyayı değiştiren fikirlerini duyurmak için TED sahnesine çıkıyor
      . Daphne Zuniga'nın o harika benzetmesiyle, bu platform "zihin için adeta bir Cirque du Soleil" haline gelmiştir
      .
      Yazar, bu sırların sadece TED'e veya belli başlı dehalara özgü olmadığını özellikle vurguluyor
      . Kendi yazdığı ve dünya çapında çok satan Steve Jobs'un Sunum Sırları kitabına atıfta bulunarak, Jobs'un 2005 yılında Stanford Üniversitesi'nde yaptığı (ve 15 milyondan fazla izlenen) ünlü "Zamanınız kısıtlı..." konuşmasının aslında tamamen bir "TED-gibi" konuşma formatında olduğunu söylüyor
      . İşin özü, bu teknikler herkesin öğrenebileceği bir şablona dayanmaktadır
      .
      Gallo, kitabını oluştururken aslında 1915'te Dale Carnegie'nin yazdığı "Topluluk Önünde Konuşma Sanatı" kitabının 21. yüzyıl versiyonunu yazmayı hedeflemiştir
      . Carnegie, kısa konuşmayı, hikaye anlatmayı ve coşkuyu sezgisel olarak savunmuştu
      . Fakat Gallo'nun elinde Carnegie'de olmayan bir şey var: Modern sinirbilim ve fMRI (fonksiyonel manyetik rezonans görüntüleme) cihazları
      . Artık beynin bir bilgiyi duyduğunda hangi bölgelerinin aydınlandığını bilimsel olarak kanıtlayabiliyoruz
      .
      Sonuç olarak yazar, Daniel Pink'in deyişiyle "artık hepimizin satıcı olduğu" bu dünyada
      , fikirlerimizi karşımızdakine kabul ettirmek zorundayız diyor
      . Bunu yapabilmek için de harika bir sunumun üç bileşene sahip olması gerekir: Duygusal (yüreğe dokunan), Yeni (yeni bir şey öğreten) ve Akılda Kalıcı (içeriği unutulmaz yollarla sunan)
      .
      Bu bölümün özü: Fikirler, 21. yüzyılın en değerli hazinesidir; ancak bu hazine, sadece doğru ambalajlanıp etkili bir şekilde sunulduğunda değer kazanır. İster dünyanın en prestijli sahnesinde olun ister küçük bir ofis toplantısında, beynin çalışma prensiplerine uygun, duygusal, yeni ve akılda kalıcı iletişim tekniklerini kullanmak, insanları ikna etmenin ve harekete geçirmenin tek bilimsel yoludur.
      BÖLÜM 1: İçinizdeki Ustayı Çıkarın
      Bir an için alev alev yanan, çevresine muazzam bir ısı ve ışık saçan bir şömine hayal edin. Eğer o şöminenin içine sadece ıslak odunlar atarsanız, en iyi çırayı ya da kibriti kullansanız bile o ateşi yakamazsınız. İşte topluluk önünde konuşmada veya herhangi bir fikri savunmada "tutku", o kuru, çıtır çıtır yanan odunlardır. Sizde o ateş (tutku) yoksa, karşınızdakini ısıtmanız (ikna etmeniz) imkansızdır. Yazarımız 1. Bölüme bu güçlü iddiayla başlıyor ve bize Sır #1'i veriyor: İçinizdeki ustayı çıkarın; sunum konunuza olan benzersiz ve anlamlı bağınızı belirlemek için derinlere inin
      .
      Bu iddianın en çarpıcı kanıtı olarak karşımıza Aimee Mullins çıkıyor. Mullins, ilk doğum gününden önce bacakları diz altından kesilmiş bir bebek olarak hayata "engelli" etiketiyle başlamış biridir
      . Ancak o bu durumu bir eksiklik olarak değil, kendine verilen "süper güçler" olarak yeniden tanımladı
      . Georgetown Üniversitesi'nde yarıştı, 1996 Engelliler Olimpiyatları'nda 3 dünya rekoru kırdı ve 12 çift bacağıyla TED sahnesine 1.85 boyunda çıktı
      . Mullins protezlerle ilgilenmiyordu; o, insan potansiyelini ortaya çıkarma konusunda tutkuluydu
      . Aynı şekilde Victoria's Secret podyumlarında yürüyen Cameron Russell da sahneye çıkıp 30 saniye içinde kıyafetini değiştirdiğinde, amacının modellikten bahsetmek olmadığını gösterdi
      . Onun tutkusu, o "genetik piyangonun" ve manipüle edilmiş fotoğrafların ardındaki gerçeği göstererek genç kızların özgüvenini artırmaktı
      .
      Gallo, yıllarca dünyanın en büyük şirketlerinin (Starbucks, Zappos, Intel, vs.) CEO'larına koçluk yaparken onlara "Neye tutkunuz var?" diye sorduğunu anlatıyor
      . Starbucks'ın kurucusu Howard Schultz'un tutkusu kahve satmak değil, insanlara ev ve iş arasında "üçüncü bir yer" sunmaktı
      . Zappos'un kurucusu Tony Hsieh ayakkabılara değil, "mutluluk sunmaya" tutkuluydu
      . Kaliforniya Çilek Komitesi CEO'sunun tutkusu sadece meyve değil, göçmen ailesinin çilek sayesinde ulaştığı "Amerikan rüyasıydı"
      . Gallo, Steve Jobs'tan ilhamla soruyu şu şekilde güncelliyor: "Sizin içinizi şenlendiren nedir?"
      . Konuştuğunuz konu, sizin kimliğinizin bir parçası, varoluşunuzun nüvesi olmalıdır. Sizi ateşleyen şeyi bulduğunuzda, karşınızdakini de ateşlersiniz
      .
      Bu durumun harika örneklerinden biri "dünyanın en mutlu adamı" Matthieu Ricard'dır
      . Ricard beynini fMRI cihazına bağlatan ve mutluluk seviyesi bilimsel literatürde emsali görülmemiş derecede yüksek çıkan bir Budist rahiptir
      . Ricard mutludur, çünkü mutluluğu bilgelik, özgecilik ve merhametten gelen bir "seçim" olarak benimsemiştir
      . Eğer konuşmacı kendi içinde bu coşkuyu ve tutkuyu yaşıyorsa, Larry Smith'in o meşhur "Neden harika bir kariyere sahip olamayacaksınız?" konuşmasındaki gibi, kendi işini sadece "çalışmak" olarak görmez; başarısız olma veya gülünç görünme korkusunu yıkarak tutkusunun peşinden giden bir usta olur
      .
      Peki ama tutku sadece soyut bir his midir? Kesinlikle hayır! İşin içine bilim giriyor. Pace Üniversitesi'nden Melissa Cardon, "Girişimcilik Tutkusu (EP)" üzerine çığır açan bir araştırma yaptı
      . Cardon tutkuyu, birey için derin anlamı olan bir şeye duyulan yoğun olumlu duygu olarak tanımladı
      . Daha da önemlisi, Tech Coast Angels yatırımcı grubu üzerinde bir deney yapıldı
      . 241 şirket sunumu dinlendi ve 41 tanesi finanse edildi
      . Yatırımcıların karar vermesindeki 13 kriter incelendiğinde, girişimcinin eğitimi, yaşı veya deneyimi değil; "algılanan tutku ve hevesi" en önemli 3. kriter olarak ortaya çıktı!
      . Yani, eğer bir konuda tutkulu değilseniz, yatırımcılar (veya dinleyiciler) bu sahteliği anında fark eder ve size yatırım yapmaz
      .
      Kendini konuya derinden bağlamanın en ikonik örneklerinden biri Dr. Jill Bolte Taylor'dır. Kardeşinin şizofrenisi nedeniyle beyni anlamaya adanmış bir nöroanatomist olan Dr. Jill, bizzat kendisi ağır bir sol beyin felci geçiriyor
      . Bir felç anında, konuşma ve hareket yetisini kaybederken beyninin "Vay canına, bu müthiş! Kendi beynimi içeriden inceliyorum" demesi ve kendini evrenle bir (Nirvana'da) hissetmesi, tutkunun zirvesidir
      . 8 yıl süren iyileşmesinin ardından anlattığı bu hikaye 10 milyon izlenmiş, TIME 100 listesine girmesini sağlamıştır
      . Dr. Jill o ödülleri sadece bilim yaptığı için değil, hikayesini anlatacak tutkuya sahip olduğu için almıştır
      .
      Üstelik Dr. Pascale Michelon'ın işaret ettiği "nöroplastisite" kavramına göre, tutkulu olduğunuz konuyu defalarca anlattıkça beyniniz fiziksel olarak değişir
      . Londra taksicilerinin yol bulma merkezi olan hipokampuslarının veya müzisyenlerin boz maddelerinin büyümesi gibi, topluluk önünde çok konuşanların da beyinlerindeki dil alanları gelişmektedir
      .
      Tutkunun son ve en büyüleyici bilimsel gerçeği ise bulaşıcı olmasıdır
      . Psikolog Howard Friedman'ın "Duygusal İletişim Testi (ACT)" deneyleri, yüksek karizmalı ve tutkulu insanların aynı odaya girdiklerinde tek bir kelime bile etmeden düşük karizmalı insanların ruh halini olumlu yönde değiştirebildiğini (onları da mutlu ettiğini) kanıtlamıştır
      . Joyce Bono ve Remus Ilies'in çalışmaları da, olumlu duygular ve tutku yayan liderlerin, dinleyiciler üzerinde çok daha ikna edici olduklarını göstermiştir
      . Richard St. John'un 500 TED konuşmacısıyla yaptığı 10 yıllık araştırma sonucunda başarının 8 sırrından "1 numaralı" olanının Tutku çıkması bir tesadüf değildir
      . Eğer insanlara ilham vermek istiyorsanız, tıpkı Ernesto Sirolli'nin Zambia'da yerel halkı dinlemeden domates ektirmesi ve su aygırlarının tarlayı talan etmesi hikayesindeki gibi
      , önce kendi içinizdeki, sonra da karşınızdakilerin içindeki o gerçek "tutkuyu ve kişisel gelişimi" bulup ortaya çıkarmalısınız
      .
      Bu bölümün özü: İkna edici bir iletişimin ve ustalık seviyesinde bir sunumun vazgeçilmez ilk adımı, anlatılan konuya duyulan gerçek, derin ve içsel bir tutkudur. Bilimsel olarak kanıtlandığı üzere, kişinin kendi öz kimliğiyle bütünleşen bu tutku; beyni geliştirir, dinleyicilere bulaşarak onların savunma duvarlarını yıkar ve en mantıklı yatırımcı kararlarını bile doğrudan etkileyen sarsılmaz bir güven ortamı yaratır.
  - baslik: Parça B · Empati ve Bağ Kurma (Bölüm 2-3)
    icerik: |-
      Harika bir aşamaya geçiyoruz! İkna etmenin sadece mantıkla değil, insan beyniyle ve kalbiyle nasıl uyumlandığını göreceğimiz, sunum sanatının gerçek sırlarının açığa çıktığı kısım burası. Gelin, Parça B'yi, yani "Empati ve Bağ Kurma" stratejilerini anlatan 2. ve 3. bölümleri, kahvemizi yudumlarken konuşuyormuşuz gibi ama kitaptaki hiçbir muazzam veriyi, hikayeyi ve bilimsel kanıtı atlamadan detaylıca yeniden anlatalım.
      BÖLÜM 2: Hikâye Anlatma Sanatında Ustalaşın
      Bir insanı gerçekten ikna etmek istiyorsanız, ona sadece rakamlar ve grafikler sunmak yetmez; onun kalbine dokunmanız gerekir. Yazar Carmine Gallo, bu bölümü açarken bizi TED tarihinde en uzun süre ayakta alkışlanan ve 18 dakikalık konuşmasıyla Eşit Adalet İnisiyatifi (Equal Justice Initiative) kurumu için tam 1 milyon dolar bağış toplayan vatandaşlık hakları avukatı Bryan Stevenson ile tanıştırıyor
      . Stevenson sahnede hiçbir PowerPoint slaytı kullanmadı; bunun yerine sunumunun tam %65'ini hikaye anlatarak geçirdi
      ,
      .
      Stevenson konuşmasına, köleliğe doğmuş büyükanne ve büyükbabasından bahsederek başladı
      . Büyükannesinin bir gün onu karşısına alıp "Seni izlediğimi bilmeni istiyorum. Bence sen özelsin," dediğini ve ondan üç söz istediğini anlattı: "Anneni her zaman seveceksin, doğru olanı yapacaksın ve asla alkol kullanmayacaksın"
      . Stevenson, daha dokuz yaşındayken verdiği bu söz yüzünden kardeşinin bira teklifini reddettiğini, hatta 52 yaşına gelmesine rağmen hayatında bir damla bile alkol almadığını itiraf etti
      ,
      . Sonrasında ise mahkemede karşılaştığı ve kendisine "Buraya, bu genç adama, hedeften şaşma, dayan, demeye geldim," diyen yaşlı bir zenci hademenin dokunaklı hikayesini izleyicilere aktardı
      .
      Peki, Stevenson bunu neden yaptı? Çünkü hikayeler, sizinle fikrinize karşı çıkmaya kararlı olan dinleyiciler arasındaki o koca direnç duvarlarını yıkan yegane araçtır
      . Yunan filozofu Aristoteles, binlerce yıl önce iknanın üç bileşeni olduğunu söylemişti: Ethos (güvenilirlik), Logos (mantık/veriler) ve Pathos (duygulara hitap etme)
      . Stevenson'ın o meşhur konuşması incelendiğinde, %10 Ethos, %25 Logos ve tam %65 Pathos kullandığı görülmüştür
      . Yani sadece mantıkla kimseyi ikna edemezsiniz
      .
      Hikayeler Beynimizi Nasıl Hackler? Bunun elbette bilimsel bir altyapısı var. Princeton Üniversitesi'nden psikoloji profesörü Uri Hasson, fonksiyonel MRI (fMRI) cihazlarıyla çığır açan bir deney yaptı
      . İnsanlara madde işaretleriyle dolu sıkıcı bir slayt gösterdiğinizde beynin sadece dili işleyen merkezleri aydınlanırken, bir hikaye anlattığınızda beynin dil, duyusal, görsel ve motor alanları, yani neredeyse tamamı uyarılır
      . Hasson'ın deneyinde, bir kız öğrencisi mezuniyet balosu hakkında prova edilmemiş bir hikaye anlatırken, dinleyicilerin beyin tepkileri konuşmacının beyniyle tam anlamıyla senkronize oldu; araştırmacılar buna "beyinden beyne eşleşme" adını verdiler
      ,
      . Araştırmacı Brené Brown'un o harika tanımıyla: "Hikayeler ruhu olan verilerdir yalnızca"
      .
      Kullanabileceğiniz Üç Basit Hikaye Türü: Yazar, etkili konuşmacıların üç tür hikayeye (kişisel hikayeler, başkalarının hikayeleri, marka hikayeleri) odaklandığını belirtiyor
      :
      1. Kişisel Hikayeler: Bunlar doğrudan sizi ve kimliğinizi anlatan, izleyicide "umulmadık" bir merak uyandıran hikayelerdir. Örneğin davranışsal ekonomist Dan Ariely, yanık ünitesinde tedavi görürken hemşirelerin bandajlarını yavaş yavaş çıkarmak yerine acı çekmesin diye hızlıca çekip kopardığını, ancak sonradan yaptığı araştırmalarla hemşirelerin aslında "yanlış" bildiğini kanıtlamasını anlatır
      ,
      . Ya da yazarın bizzat çalıştığı bir Temsilciler Meclisi üyesinin, televizyonda sıkıcı "mali uçurum" verilerinden bahsetmek yerine, hemşire olan annesinin bu durumdan nasıl etkilendiğini anlattığında medyanın ve halkın dikkatini nasıl çektiğini düşünün
      ,
      .
      2. Başkalarının Hikayeleri: Başarı öyküsü her zaman sizin olmak zorunda değil. İzleyicinin empati kurabileceği, (kendisini onların yerine koyabileceği) başkalarına dair hikayeler de muazzamdır
      . Dünyanın en çok izlenen TED konuşmasının sahibi Sir Ken Robinson, okulda hiperaktif olduğu sanılan ama doktorun "O hasta değil, o bir dansçı" diyerek baleye yönlendirdiği ve sonrasında Cats müzikalinin efsanevi koreografı olan Gillian Lynne'in hikayesini anlatarak hepimizin kalbine dokunmuştur
      ,
      . Benzer şekilde rahip Joel Osteen, vaazlarında sürekli başka insanların -terfisi reddedilen ama yılmayan bir arkadaşının ya da 31 bankadan ret yiyip 32. bankada kredisini alan bir esnafın- empati dolu hikayelerini anlatır
      ,
      .
      3. Marka Hikayeleri: Ürünler de hikayelerle satılır. Mandalay Entertainment başkanı Peter Guber, devasa veriler sunduğu toplantılarda kaybettiği işleri, sadece Sony'nin CEO'suyken Magic Johnson'ın ona gözlerini kapattırıp yabancı ve kazançlı bir "vaat edilmiş ülke" hikayesi anlattığında nasıl kazandığını açıklar
      ,
      . Pazarlama dehası Seth Godin, icat edildikten sonra 15 yıl boyunca kimsenin yüzüne bakmadığı "dilimlenmiş ekmeği" Wonder markasının nasıl akıllıca hikayeleştirerek sattığını, ya da Frank Gehry'nin binalarının koca bir şehri nasıl değiştirdiğini anlatır
      . Genç bir Afrikalı Ludwick Marishane, susuz yıkanmayı sağlayan DryBath ürününü, "Zengin bir adam için kolaylık, yoksul bir adam için hayat kurtarıcı" şeklinde muazzam bir kanca hikayesiyle satmıştır
      ,
      . En çarpıcı veri ise Significant Objects deneyinden gelir: Bir bit pazarından toplam 128 dolar 74 sente alınan eski, ucuz eşyalar, yanlarına profesyonel yazarlarca uydurma, kurgusal hikayeler eklendiğinde eBay'de toplam 3612 dolar 51 sente satılmıştır! 25 sentlik sahte bir muz, hikayesi sayesinde 76 dolara alıcı bulmuştur; hikaye, değer algısını %2700 artırmıştır!
      ,
      . Benzer şekilde, tıbbi bir CT cihazını tanıtan bir firma, sadece teknik veriler vermek yerine, makinenin "David ve Susan" adında kurgusal iki karakterin hayatını nasıl kurtardığını anlattığında doktorların en etkilendiği sunumu yapmış oluyordu
      . Malcolm Gladwell'in Howard Moskowitz isimli adamın spagetti sosunu (Prego ve Ragu markalarını) odak gruplarını dinlemeyip "ekstra iri parçalı" sos yaparak nasıl yeniden icat ettiğini anlattığı hikaye de harika bir marka hikayesi örneğidir
      .
      Hikayenin İskeleti Nasıl Kurulmalı? Efsanevi yazar Kurt Vonnegut, başarılı hikayelerin basit grafiklerini çıkarmıştır. "Başı Derde Giren Adam" (Kötü şansla başlayıp İyi şansla biten) ya da hepimizin bildiği "Külkedisi" (İyiden dibe, oradan sonsuz mutluluğa) grafikleri, izleyiciye kendi mücadelelerini anımsatır
      . Yazar, büyük bir Chase Bankası yöneticisine sunum hazırlatırken, sadece grafikler sunmak isteyen bu yöneticiye kendi hikayesini sorduğunda sarsıcı bir yanıt almıştır. Adam, dört yaşındayken cam kırıkları üstünde yatan annesinin boğazını kesmekle tehdit eden üvey babasını ve içindeki öfkeyi anlatmış, United Way kurumunun onu nasıl kurtarıp "bugünkü iyi baba ve adama" dönüştürdüğünü itiraf etmiştir
      . Bu "Külkedisi"vari dipten çıkış hikayesi, sunumu izleyen çalışanları gözyaşlarına boğmuş ve rekor bağış toplanmasını sağlamıştır
      . Tıpkı romancı Isabel Allende'nin de dediği gibi, sağduyulu iyi insanlar ilginç karakterler oluşturmaz; hikayelerin asilere, kalbi tutkuyla atanlara, başına buyruklara (kahramanlara) ve yenilmesi gereken engellere (hainlere) ihtiyacı vardır
      ,
      .
      Bu bölümün özü: İkna etmenin yolu, dinleyicinin mantığına (Logos) verilerle seslenirken, ondan çok daha büyük oranda duygularına (Pathos) hikayelerle hitap etmekten geçer. Sizi, başka insanları veya markaları konu alan, içinde kahramanlar, inişler ve çıkışlar barındıran hikayeler, beyinleri birbirine bağlayan ve anlattığınız konunun izleyicide sonsuza dek yankılanmasını sağlayan ruhlu verilerdir.
      BÖLÜM 3: Sohbet Edin
      Geldik işin "sahnedeki siz" kısmına. Bir hikayeniz var diyelim; adeta garajınızda duran yepyeni bir Ferrari... Peki onu sürmeyi bilmiyorsanız ne işe yarar? Yazar, bu bölümde "doğallık" denen şeyin aslında nasıl ter dökülerek inşa edildiğini anlatıyor. Amanda Palmer'ın o meşhur "İsteme Sanatı" (The Art of Asking) konuşmasını hatırlayın
      . Sokaklarda yüzü boyalı canlı bir heykel olarak çalışırken öğrendiği bağ kurma sanatını TED'de anlattığında video anında viral oldu
      . Peki Palmer sahneye doğuştan bir yetenekle mi çıkmıştı? Hayır. Blogunda yazdığı üzere o konuşmayı yazıp, silip, kısaltıp hazırlamak için tam 4 ay "köle gibi" çalışmış, Seth Godin ve Thomas Dolby dahil 105 kişiden yardım almıştı
      ,
      ,
      . Doğallık ve sahicilik, kendi kendine birden oluveren bir şey değildir; saatlerce prova etmenin sonucunda elde edilen bir ustalıktır
      . Tıpkı Steve Jobs gibi! Efsanevi "10.000 saat kuralı" onun için de geçerliydi. 1970'lerde ilk röportajlarında kusacak kadar heyecanlanan, tuvaletin yerini soran Jobs, zamanla binlerce saat prova yaparak o zahmetsiz gibi görünen karizmatik liderliğini inşa etmişti
      ,
      .
      İnsanların Dinlemesi İçin Konuşma Hızı Nasıl Olmalı? Sahnede yakın bir dostunuzla sohbet ediyormuş gibi görünmek için sesinizi doğru yönetmelisiniz. Araştırmalara göre ideal bir sesli kitap okuma hızı dakikada 150-160 kelimedir; bu beynin "Goldilocks" bölgesidir, ne çok hızlı ne de çok yavaştır
      . Ancak canlı sahnede mimikler ve jestler olduğu için tempo biraz daha artabilir. Bryan Stevenson'ın o arkadaşça sohbeti tam dakikada 190 kelime hızındaydı
      . Motivasyon gurusu Tony Robbins izleyiciyi hoplatmak için dakikada 250 kelimeye çıkarken, Henry Kissinger sıkıcı bir tempoyla 90 kelime konuşuyordu
      ,
      . Önemli olan metni okumamak, konuşma hızınızı (hız, ses kuvveti, perde, duraklamalar) doğal sohbete uydurmaktır
      .
      Bunu mükemmel yapanlardan biri fotoğrafçı Lisa Kristine'di. Gana'daki yasadışı bir maden kuyusunun 45 metre altındaki dehşeti anlatırken, "Nefes almak zor... Sesleri duyuyorum..." derken sesini kısıp kelimeleri vurgulayarak, izleyicinin gözünde henüz fotoğrafı göstermeden o resmi kelimeleriyle boyamayı başarmıştı
      ,
      . Bir diğeri ise Harvard'lı beyin bilimcisi Dr. Jill Bolte Taylor'dı. Ergen beynini anlatırken ortalama 165 kelimeyle başlar, ancak ergenlerin "tam anlamıyla akıllarının yarısını kaçırdıkları" o amigdala fırtınasını anlatırken hızını 220 kelimeye çıkarır, kollarını sallar ve adeta bir ergen gibi davranarak konuyu canlandırırdı
      ,
      . Bu doğallığı elde etmek için konuşmasını tek aralıklı tam 50 sayfa yazmış ve Cancun plajlarında belki 200 kez prova etmişti!
      .
      Beden Dili: Yalan Mı Söylüyorsunuz, Doğru Mu? Hepimiz Albert Mehrabian'ın o meşhur "iletişimin %93'ü beden dilidir, %7'si sözlerdir" efsanesini duymuşuzdur. Yazar bizzat Mehrabian ile konuşup bunun yanlış yorumlandığını ortaya koyar
      ,
      . Ancak beden dilinin önemi büyüktür. CIA/FBI eğitimcisi Morgan Wright'ın anlattığı NSA deneyinde; sadece dinleyerek yalanı tespit etme oranı %55 iken, işin içine beden dili (video) ve ses girdiğinde başarı %85'e çıkmaktadır
      ,
      . Beden diliniz, sözlerinize gerçekten inanıp inanmadığınızı izleyiciye bas bas bağırır
      .
      Büyük liderlerde, örneğin Mogadişu'da çatışan Matt Eversmann'da veya General Colin Powell'da o fırtınada bile yıkılmayan bir "güven havası" (etkili duruş) vardır
      ,
      . Powell, televizyon röportajlarında bile ilk 10 saniye hariç ellerini hiç bağlamaz, konuşmasına eşlik eden muazzam jestler yapar
      . Chicago Üniversitesi'nden Dr. David McNeill'ın dediği gibi: "Karmaşık düşünürler karmaşık jestler yaparlar"
      . Jestleri kullanırken 4 kurala uyun: Kullanmaktan korkmayın, tutumlu olun (abartmayın), anahtar anlara saklayın ve güç küreniz içinde (gözünüz ile göbeğiniz arasındaki daire) tutun
      . Eski Michigan Valisi Jennifer Granholm'un o muazzam temiz enerji sunumunda yaptığı buydu; "sözsüz hevesli" (nonverbal enthusiastic) denen harika bir enerjiyle elleri hep güç küresinin içindeydi
      .
      Yaygın Hataları Düzeltin ve Taklit Edin Sağda solda sallanmak, kalemi tıklatmak, bozuk para şıngırdatmak
       (örneğin teknoloji yöneticisinin Oracle CEO'su Larry Ellison karşısındaki panik halleri
      ) ya da kaskatı yerinde durmak
      , elleri cebe sokmak
       liderin inandırıcılığını baltalar. Sahneyi kullanın!
      Peki ya kendinize güvenmiyorsanız? Harvard psikoloğu Amy Cuddy'nin çığır açan araştırmasına (ve kendi Princeton tecrübesine) göre, "Yapana kadar taklit etmeyin, ona dönüşene kadar taklit edin"
      ,
      . Sahneye çıkmadan önce iki dakika kollarınızı açarak yapacağınız bir "Güç Pozu" (Power Pose), beyninizde testosteronu artırır ve stres hormonu kortizolü düşürür
      . Tony Robbins'in sahneye çıkmadan önce trambolinde zıplayıp yumruk savurması tam olarak bu yüzdendir
      . Özgüven bedenimizden zihnimize geçer. Ne olursa olsun, gücünüzün içinizden geldiğini unutmayın. Kros kayakçısı Janine Shepherd, o feci kamyon kazasından sonra bedeninin büyük kısmını kullanamasa bile içindeki "pilot alevinin" sönmediğini ve gücünün asla bedeninden gelmediğini 5 sandalyeli harika TED kurgusuyla herkese göstermiştir
      .
      Kendi Şeridinizde Kalın Son olarak, özgünlük... Facebook yöneticisi Sheryl Sandberg, çok profesyonel bir konuşma yapacakken son anda kızının bacağına sarılıp "gitme" diye ağlamasını ve kendisini ne kadar yetersiz hissettiğini anlatarak o muazzam "Şeridinizde Kalın" (Stay in your Lane) dürüstlüğünü yakaladı
      . Grey's Anatomy'deki Dr. Callie'nin TED konuşmasında notları fırlatıp kaza acısını anlattığı gibi
       veya milyarder Warren Buffett'ın 20'li yaşlarında konuşmaktan ölesiye korkup Dale Carnegie kursuna yazılarak kendini bulması gibi
       siz de maskelerinizi atın. Richard Branson'ın dediği gibi: "İşi iş, oyunu oyun gibi görmem. Hepsi yaşamaktır"
      .
      Bu bölümün özü: Muazzam bir sunum doğuştan gelen bir yetenek değil, 10.000 saatlik yorucu bir provanın ve titiz geri bildirimlerin eseridir. Beyniniz beden dilinize uyum sağlar; konuşma hızınızı dostane bir sohbete ayarlayarak, kelimelerinizin altını ellerinizle güç küreniz içinde çizerek ve en önemlisi kendi sahici şeridinizde yürüyerek izleyiciye gerçek bir "siz" sunduğunuzda asıl bağ kurulmuş olur.
  - baslik: Parça C · Zihni Uyandırma Stratejileri (Bölüm 4-5)
    icerik: |-
      Harika bir noktaya geldik! İletişimin en büyüleyici, en zihin açıcı kısmı tam olarak burası. Kahvelerimiz hazırsa, kitabın beyni nasıl "hackleyeceğimizi" gösteren Parça C kısmına, yani 4. ve 5. bölümlerine derinlemesine bir dalış yapalım. Yazar Carmine Gallo’nun izini adım adım takip ederek, hiçbir hikayeyi, veriyi veya bilimsel gerçeği atlamadan, sohbet akıcılığında ama tam bir ustalık dersi ciddiyetinde yeniden anlatalım.
      BÖLÜM 4: Bana Yeni Bir Şey Öğretin
      Hiç bilmediğiniz, karanlık ve devasa bir dünyaya adım attığınızı hayal edin. Derin deniz kâşifi Robert Ballard'ın 2008 yılındaki TED konuşmasında izleyicilerine yaptığı tam olarak buydu. Ballard sahneye çıktı ve izleyicilerini 18 dakikalık büyüleyici bir denizaltı yolculuğuna çıkardı. Dünyanın %72'sini oluşturan okyanusların dibinde yatan sırları anlattı. Ballard'a göre, dünyadaki tüm kaynakların sadece kıtaların üzerinde olduğunu (sanki onları Paskalya Tavşanı getirmiş gibi) düşünmek büyük bir saflıktı. O, 120 farklı denizaltı keşif seferi yapmış, 1985'te Titanik'in enkazını bulmuş bir efsaneydi. Ancak o gün sahnede, NASA'nın sadece bir yıllık bütçesinin, Ulusal Okyanus ve Atmosfer İdaresi'nin (NOAA) tam 1600 yıllık bütçesine denk geldiği gibi çarpıcı gerçekleri önümüze serdi. ABD'nin yarısının sular altında olduğunu, en büyük sıradağların okyanus tabanında yer aldığını, zifiri karanlıkta var olmaması gereken devasa bir canlı bolluğu bulduklarını anlattı. Ballard sunumunu, gözleri hayretten kocaman açılmış bir genç kız fotoğrafıyla bitirdi ve şöyle dedi: "İstediğimiz bu... Eğer ağızları açık bırakırsanız, insanları bilgilendirebilirsiniz."
      İşte yazar Carmine Gallo bu olağanüstü anekdotla Sır #4'ü ortaya koyuyor: İzleyicinize tamamen yeni, farklı paketlenmiş ya da eski bir problemi çözmenin taze ve alışılmamış bir yolunu sunan bir bilgi aktarın.
      İnsan Beyni Neden Yeniliğe Aşıktır? Bunun sebebi beynimizin donanımıdır. Evrimsel olarak, yeni ve dikkat çekici olanı aramaya programlandık. Efsanevi yönetmen James Cameron (Terminatör, Titanik, Avatar filmlerinin yaratıcısı) 2010 yılındaki TED konuşmasında başarısının sırrını teknik değil, tek bir kelimeyle açıkladı: Merak. Cameron lise yıllarından beri okyanusa takıntılıydı. Hatta stüdyolara Titanik filmini "Gemide geçen bir Romeo ve Juliet hikayesi" olarak satarken asıl gizli amacı farklıydı; o batığa gerçekten dalmak ve bunu stüdyoya finanse ettirmek istiyordu! Nitekim kendini Kuzey Atlantik'te, 2,5 mil derinde bir Rus denizaltısından o gerçek enkaza bakarken buldu. Ballard veya Cameron'un yaptığı şey, içimizdeki o doymak bilmez "kaşif" genine, yani yenilik arayışına seslenmektir. (Bu arada ilginç bir not: Ballard'a "Denizin 2,5 mil dibine dalmak mı, yoksa topluluk önünde 18 dakikalık konuşma yapmak mı daha korkutucu?" diye sorulduğunda, denize dalmanın çok daha korkunç olduğunu itiraf etmiş. Ünlü komedyen Jerry Seinfeld'in dediği gibi; istatistiklere göre insanlar konuşma yapmaktansa tabutun içinde yatan kişi olmayı tercih ediyor!)
      Bilim insanı John Medina'ya göre, bugün hayatta kalabilmiş olmamızın tek sebebi, atalarımızın "güçlü" olmaları değil, "akıllı ve meraklı" olmalarıdır. Medina der ki, bebekler dünyayı keşfetmek için saldırgan bir arzuyla doğarlar. Ve bu arzu biz büyüdükçe kaybolmaz. Peki ama bu öğrenme aşkı beynimizde fizyolojik olarak ne yaratır?
      Beynimizin Doğal "Kaydet Tuşu": Dopamin Eğitim sinirbilimcisi Martha Burns, yeni bir şey öğrenmenin beyinde uyuşturucu veya kumarla tamamen aynı ödül merkezlerini (ama tamamen sağlıklı bir şekilde) uyardığını söyler. Yeni ve heyecan verici bir bilgiyle karşılaştığımızda beynimiz dopamin salgılar. Dopamin, beynin "Kaydet Tuşu"dur. Dopamin olmadan hiçbir şey akılda kalmaz. Günlük hayattan düşünün; yeni aldığınız bir akıllı telefonun gizli ve harika bir özelliğini keşfettiğinizde içinizi kaplayan o minik coşku hissi tam olarak dopamindir. Gallo da Kaliforniya'daki Bakersfield İş Konferansı'na katılıp (Reagan, Gorbaçov, Steve Wynn gibi isimleri art arda 20'şer dakika dinledikten sonra) o 5 saatlik dönüş yolunda kendini "dünyayı fethedecekmiş gibi" hissetmesini bu dopamin patlamasına (öğrenme bağımlılığına) bağlar.
      Ünlü markalar da bu sırrı kullanır. Örneğin Intel, yeni "Turbo Boost" çipini satarken "merkezi işlem biriminin saat vuruş sıklığını artıran..." gibi sıkıcı tanımlar yapmak yerine, "Bilgisayarınızın ne yaptığınızı anlayıp, gerektiğinde hızlanıp gerekmediğinde yavaşlayarak pil ömrünü uzatmasıdır" diyerek teknolojiye yepyeni, günlük hayata dokunan (ve beyni uyandıran) taze bir perspektif getirmiş ve basında hep bu "yeni" tanımıyla yer almıştır.
      Aynı Veriyi Yepyeni Bir Paketle Sunmak Bazen elinizdeki veri dünyanın en yeni verisi olmayabilir, ama onu sunuş şekliniz taze olmalıdır. Tıpkı efsanevi istatistikçi Hans Rosling gibi! TIME dergisinin dünyadaki en etkili 100 kişisinden biri seçilen Rosling, 2006'daki konuşmasında Gapminder adındaki yazılımıyla sıkıcı sağlık istatistiklerini bir görsel şölene dönüştürdü. Sahnede, X eksenine doğurganlığı, Y eksenine yaşam süresini koyup 1962'den günümüze ülkelerin (baloncukların) nasıl yer değiştirdiğini adeta bir maç spikeri coşkusuyla anlattı. Çin'in yükselişi, Latin Amerika'nın küçük ailelere geçişi, Bangladeş'te imamların aile planlamasını desteklemesiyle yaşanan mucize, Afrika'yı aşağı çeken HIV salgını... Rosling, "Batı dünyası" ve "Üçüncü dünya" şeklindeki o eski efsaneyi yıkarak zihnimizde yepyeni bir pencere açtı.
      Aynı yöntemi SanDisk'in bir başkan yardımcısı da kullandı. Yatırımcılara yüksek kapasiteli hafıza kartlarının satış grafiklerini göstermek yerine, evindeki 80.000 dijital fotoğrafından, lise çağındaki sporcu kızlarından ve çok yer kaplayan devasa panoramik manzara fotoğraflarından bahsetti. "Panoramik fotoğraflar standart bir fotoğraftan 10 kat daha fazla hafıza ister, bu da SanDisk için 10 kat daha fazla fırsat demektir" dedi. Yatırımcılar (o en zor beğenen kitle) bu sunumu "mükemmel" olarak değerlendirdi. Neden? Çünkü eski bir yatırım konusuna taze, yenilikçi ve hikayeleştirilmiş bir paket sunuldu.
      Aynı şekilde içedönük (introvert) Susan Cain de, "liderlik her zaman dışadönüklere aittir" ön yargısını kırmış, yalnızlığın yaratıcılıktaki hayati önemini anlatarak AOL'nin kurucusu milyarder Steve Case gibi yatırımcıları bile kendisine hayran bırakmıştır. Unutmayın, Sergey Brin ve Larry Page, Google için ilk yatırımlarını Sequoia Capital'dan isterken uzun uzun algoritmalar anlatmadılar; sadece "Google tek bir tıkla dünyanın bilgisine erişim sağlar" diyerek yatırımcıların dünya görüşünü o taptaze 8 kelimeyle baştan aşağı yeniden şekillendirdiler.
      Alanınızın Dışına Çıkın ve Kilit İfadeler (Twitter-Dostu Başlıklar) Yaratın Yazarımız, farklı alanlardan beslenmenin önemini vurguluyor. Apple mağazalarının müşteri hizmetlerini geliştirmek için lüks otel zinciri Ritz-Carlton'u incelemesi gibi. Ya da Katrina Kasırgası sonrası New Orleans için fon arayan bir halkla ilişkiler ajansının, karanlık odalarda PowerPoint hazırlamak yerine yıkım bölgesine (Lower Ninth Ward) gidip çamurlu ayakkabılarla, kalplerinden kopup gelen gerçek bir sunumla ihaleyi kazanması gibi. Arnavutluk'un başkenti Tiran'ın eski belediye başkanı Edi Rama (kendisi eski bir ressamdır), yolsuzluk ve suçla boğuşan o gri, depresif komünist dönemi binalarını canlı renklere boyatarak suç oranlarını düşürmüştür. Beyin, tahmin edilebilir olanı kırıp yeni bir şeyler sunan her şeye aşık olur.
      Ve elbette, fikrinizi süzmek zorundasınız. Yazar Dan Pink, "Drive" kitabını anlattığı sunumunu sadece 58 karakterle özetlemişti: "Güvendiğimiz motive ediciler sandığımız kadar iyi işlemez." Fikrinizi bir tweet'e (140 karaktere) sığdıramıyorsanız, mesajınızı yeterince netleştirememişsiniz demektir.
      Bu bölümün özü: İnsan beyni, genetik olarak yeni olana, alışılmadık olana ve farklı bir perspektifle sunulana karşı koyamaz (bu onun hayatta kalma mekanizmasıdır). Sunumlarınızda eski ve sıkıcı verileri taze, farklı paketlenmiş veya yepyeni bir hikaye ile harmanlayarak sunduğunuzda, dinleyicilerinizin beynine bir doz dopamin (öğrenme keyfi) enjekte eder ve fikirlerinizi unutulmaz kılarsınız.
      BÖLÜM 5: Ağızları Açık Bırakan Anlar Yaratın
      Sıkıcı bir şirket toplantısında oturduğunuzu düşünün. Gözleriniz kapanmak üzere, ekranda yığınla yazı... Sonra birden sahnedeki kişi bir kavanoz dolusu canlı sivrisineği odanın içine salıveriyor! Gözünüzdeki uyku anında kaybolmaz mıydı?
      İşte Bill Gates'in 2009'daki efsanevi TED konuşmasında tam olarak yaptığı buydu. Küresel yoksulluk ve sıtma üzerine konuşurken, "Sıtma sivrisinekler tarafından yayılır. Buraya biraz getirdim. Onların etraf ta uçmasına izin vereceğim. Sadece yoksul insanlara bulaşması için bir sebep yok" deyip kavanozu açtı. İzleyici (basının yazdığı gibi "dehşet içinde" kalmadı) önce şaşırdı, sonra kahkahalara ve alkışlara boğuldu. Tabi ki sineklerde sıtma yoktu, ama mesaj bir balyoz gibi yerine ulaşmıştı. Girişimci Dave Morin hemen tweet attı, eBay kurucusu Pierre Omidyar "Artık önde oturmayacağım" diye şaka yaptı. 18 dakikalık konuşmanın sadece yüzde beşinden bile azını kapsayan bu an, yıllar sonra bile konuşulmaya devam etti.
      Gallo bu bölümle bize Sır #5'i veriyor: Her sunumda, izleyicinin şok olacağı, etkileneceği veya şaşıracağı; dinleyicinin ilgisini anında kendine çeken ve yıllarca unutulmayan "Ağızları Açık Bırakan Bir An" yaratın.
      Duygu Yüklü Olay (Emotionally Competent Stimulus - ECS) Bilim insanı John Medina'nın laboratuvarına dönelim. Medina, beynin sıkıcı şeyleri kaydetmediğini ama "Duygusal Yetkinlik Uyarıcısı" (ECS) veya "Duygu Yüklü Olay" adını verdikleri şeyleri asla unutmadığını söyler. Duygu yüklü bir olay gerçekleştiğinde (korku, şaşkınlık, neşe), beynin amigdalası sisteme adeta dopamin pompalar. Medina buna "Beynin Post-it notu" der. Amigdala, o bilginin üzerine adeta kimyasal bir kalemle "Bunu Hatırla!" yazar.
      Psikolog Rebecca Todd da "Flaş ampulü hatıralar" üzerine bir çalışma yaptı. 11 Eylül saldırıları olduğunda nerede olduğunuzu, kiminle konuştuğunuzu ve hatta yüz ifadelerini milimi milimine hatırlarken; dün sabah arabanızın anahtarını nereye koyduğunuzu neden unutuyorsunuz? Çünkü duygusal olarak uyarıcı şeyler (korku, büyük sevinçler, travmalar veya şaşırtıcı olaylar), beynin görme merkezine ekstra bir canlılıkla kazınır. Todd buna "Duygusal olarak güçlendirilmiş canlılık" (Emotionally enhanced vividness) diyor. Yani Gates sivrisinekleri saldığında, izleyicinin yaşadığı o kısa süreli şok ve panik, beyinlerine o anı adeta yüksek çözünürlükle kaydetmişti.
      İşte bu yüzden soyut kavramlarla kimseyi şaşırtamazsınız. Yazar, Toshiba Medical Systems için yaptıkları çalışmada, devasa tarama cihazını "320 ultra yüksek çözünürlükte dedektör dizisi" diye satmak yerine, somut ve vurucu bir an yaratarak "Bu cihaz, felç geçirip hastaneye geldiğinizde evinize sapağlam dönmek ile ailenizi bir daha asla tanıyamamak arasındaki farktır" şeklinde sunduklarında doktorların nasıl sarsıldığını anlatıyor.
      En Tiksindirici ve En Çarpıcı Sunumlar Bazen ağızları açık bırakan an, biraz iğrenç bile olabilir! Dr. Jill Bolte Taylor'ın meşhur TED konuşmasında sahneye çıkıp (gümüş bir tepsi üzerinde) 43 cm uzunluğunda, omuriliğine kadar sarkan GERÇEK bir insan beynini eldivenleriyle havaya kaldırdığı anı hatırlayın. İzleyiciler mideleri bulanarak dudaklarını buruştursalar da, hepsi koltuklarının ucuna gelmiş, gözlerini sahneye kilitlemişlerdi. 2013'te ergenlere yaptığı konuşmada da aynı beyni kaldırıp "Bu sizin cihazınız, sizin gücünüz!" dediğinde salondaki tüm ergenlerin dikkati tamamen ondaydı. Normalde tıp konferansları sıkıcılığıyla ünlüdür ama Dr. Jill, o duygu yüklü anı yaratarak hafızalara kazındı.
      Hayret Anının Gerçek Kralı: Steve Jobs Eğer bir "Vay Canına" anı tasarlama şampiyonası olsaydı, altın madalya tartışmasız Steve Jobs'un olurdu. O, her ürün lansmanını bir tiyatro sahnesine çevirirdi.
      1984 Macintosh Lansmanı: Büyük veriler vermek yerine, siyah bir bez torbadan bilgisayarı kendi elleriyle çıkardı. Bilgisayara disketi taktı ve "Ateş Arabaları" müziği eşliğinde bilgisayar kendi kendine konuştu: "Kaldıramadığınız bir bilgisayara asla güvenmeyin."
      1997 Apple'a Dönüş: Apple'a döndüğünde yavaşça sesini alçalttı ve "Pek çok kez insanlar onların çılgın olduğunu düşünür. Ama o çılgınlığın içinde biz dahiyi görüyoruz" diyerek izleyicinin kalbini tam 12'den vurdu.
      2001 iPod Lansmanı: Cihazın MP3 transfer hızlarını anlatmak yerine, "Bu harika cihaz 1000 şarkı barındırır ve cebime girer... Bende bir tane var doğal olarak" dedi ve o ikonik cihazı pantolonunun cebinden çıkardı.
      2007 iPhone Lansmanı: Sahneye çıkıp "Bugün 3 devrimsel ürün tanıtacağız: Dokunmatik iPod, devrimsel bir telefon ve internet cihazı... Anlıyor musunuz? Bunlar üç ayrı cihaz değil, tek bir cihaz!" diyerek koca bir salonu şaşkınlığa ve coşkuya boğdu. (Phil Schiller da iPad Mini'yi tanıtırken ekranda cihazı normal bir "kurşun kalem" ile yan yana göstererek aynı şaşırtıcı sadeliği kullanmıştı).
      Vay Canına Anı Yaratmanın 5 Yolu: Gallo, bir Steve Jobs bütçesine veya yaratıcılığına sahip olmasanız bile kullanabileceğiniz 5 pratik teknik sunuyor:
      1. Sahne Malzemeleri ve Demolar: Mark Shaw'ın ıslanmayan Ultra-Ever Dry kaplamasını göstermek için sahnedeki beyaz tahtaya bir kova dolusu kırmızı boya fırlatması ve boya akıp gittiğinde arkada tertemiz "T-E-D" harflerinin kalması muazzam bir şovdu. ABD Enerji Bakanlığı laboratuvarındaki bilim insanları, yeni bir akıllı bombayı meclis üyelerine satmak için odayı bantla işaretleyip "Bu bantın içi yok olacak, dışı çizik bile almayacak" dediklerinde bütçeyi anında kapmışlardı.
      2. Beklenmeyen ve Şok Edici İstatistikler: Vatandaşlık hakları avukatı Bryan Stevenson'ın "1972'de hapishanelerde 300.000 kişi vardı, bugün 2,3 milyon!" demesi ya da yazar Jon Ronson'ın "Şu an bu 1500 kişilik salonda aranızda 15 tane psikopat oturuyor" diyerek izleyiciyi dondurması. Ya da Kaliforniya çileklerinin ABD'deki çileklerin %90'ını üretirken, tarım arazisinin sadece binde 5'ini kaplayıp, yaratılan vergiyle ilçedeki tüm öğretmenlerin maaşını ödediği gerçeği. İstatistikleri bağlama oturtup şok edici şekilde sunun.
      3. Resimler, Şekiller ve Videolar: Sanatçı Raghava KK'nın kafasına taktığı biyolojik geribildirim kulaklığıyla ekrandaki Mona Lisa 2.0'ın yüzündeki gülümsemeyi sadece kendi beynindeki "neşe" veya "stres" dalgalarıyla anlık olarak değiştirdiği o büyüleyici an.
      4. Akılda Kalıcı Başlıklar (Kilit İfadeler - Sound Bites): Fütürist Stewart Brand'ın "Tüylü mamutları geri getireceğiz" cümlesi Twitter'da ve National Geographic'te anında patlamıştı. Sir Ken Robinson'ın "Eğer hatalı olmaya hazır değilseniz, özgün bir şeyle asla ortaya çıkamazsınız" ya da Amy Cuddy'nin "Başarana kadar taklit etmeyin. O olana kadar taklit edin" gibi kolayca tweet atılabilen kilit ifadeler (sound bites) sunuma damga vurur.
      5. Kişisel Hikayeler: Maryland Üni. Rektörü Freeman Hrabowski'nin 12 yaşındayken Birmingham'daki bir yürüyüşte hapse atılmasını ve orada Dr. Martin Luther King ile karşılaşmasını anlatması; veya Intel'de çalışan siyahi bir kadın yöneticinin altı çocuklu yoksul bir evden çıkıp hepsinin nasıl mühendis olduğunu gözyaşları içinde meslektaşlarına itiraf etmesi. Savunmasız kalmak, izleyicinin duvarlarını anında yıkar.
      İyi Bir Sonla Bitirmek Gallo, karısıyla gittiği Pink konserini örnek verir. Şarkıcı Pink, konserin sonlarına doğru altın rengi bir kostümle Tinker Bell gibi havalanıp 17.000 kişilik stadyumun üzerinde süzülerek seyircinin tam üzerinden geçer. İzleyicinin telefonlarına sarıldığı, "akıllara durgunluk veren" tam bir zirve anıdır bu. Tıpkı Pink gibi, sizin de sunumunuzda o son, bitirici ve hatıralara kazınan zirve anına ihtiyacınız var.
      Birlikte çalıştığı bir petrol ve enerji şirketinin yöneticisini örnek gösterir. Yönetici sunum provalarında slaytlarda boğulmuşken, Gallo ona "Gerçekten bu şirket için ne hissediyorsun?" diye sorar. Yönetici duraksar, cebinden kartvizitini çıkarıp ağlamaklı bir sesle şöyle der: "Bu kart bana başbakanların, başkanların kapısını açar. Ama o kapıyı açık tutan şey sözümüzdür. Rusya Başkanı 32 milyar dolarlık o ihaleyi verirken 'Size en değerli servetimizi veriyoruz çünkü koruyacağınıza güveniyoruz' dedi. Bu şirkette çalışmaktan gurur duyuyorum." Gallo ona, "İşte bunu sahneye çıkınca binlerce çalışana söyleyeceksin" der. Yönetici sahnede aynısını yapar, cüzdanından kartını çıkarıp ağlayarak bunu anlattığında binlerce kişi onu ayakta alkışlar ve şirket tarihindeki en yüksek çalışan bağlılık puanını alır.
      Bu bölümün özü: İnsan beyni monotonluk içinde uykuya dalar, ancak duygu yüklü, beklenmedik ve şaşırtıcı olayları (amigdalanın dopamin salgılaması sayesinde) bir fotoğraf karesi gibi beynine kazır. Bir sunumda sadece mantıklı veriler sunmak yetmez; sahnede bir obje, şok edici bir istatistik, çarpıcı bir hikaye veya görsel bir numara kullanarak izleyicinin hafızasına silinmez bir damga vuran o "Vay Canına!" anını mutlaka tasarlamalısınız.
