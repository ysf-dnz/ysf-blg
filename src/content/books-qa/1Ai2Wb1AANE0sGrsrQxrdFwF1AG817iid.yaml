      Fıkra Anlatmadan Komik Olmanın 5 Yolu:
      Anekdotlar, Gözlemler ve Kişisel Hikayeler: İnsanları güldüren TED konuşmacıları, çevrelerindeki dünyaya dair anekdotlar paylaşırlar
      . AIDS Bisiklet Turları'nın kurucusu Dan Pallotta'nın "Eşcinsel olup üçüzlere babalık etmek şimdiye kadar yaptığım açık ara en sosyal yenilikçi... şey," demesi
       veya Dr. Jill Bolte Taylor'ın felç geçirdiği anı "Ben çok meşgul bir kadınım! Felç olacak zamanım yok!" diyerek anlatması bunun en güzel örneklerindendir
      . Hemen büyük bir kahkaha koparmaya çalışmayın; ufak tebessümlerle başlayın
      .
      Analoji ve Metafor: Karmaşık konuları esprili benzetmelerle sunmak beyinde harika bir etki bırakır
      . Intel'in "çift çekirdekli" çipi "bir bilgisayarda iki beyin olması" şeklinde anlatması
       veya depolama dünyasındaki "40 zetabit veriyi" dünyadaki tüm kum tanelerinin 57 katı olarak betimlemesi gibi
      . Bono'nun "Bir İngiliz'in bir İrlandalıdan az ve öz konuşmasını istemesi..."
      , veya Richard Wilkinson'ın "Amerikalılar Amerikan rüyasını yaşamak istiyorsa Danimarka'ya gitsinler" demesi izleyiciyi tebessüm ettiren mükemmel analojilerdir
      .
      Alıntılar: Mizahın yükünü komik bir söz söyleyen başka birine atın
      . Mesela Carmen Agra Deedy annesinin "Külotlu çorabı ve utanmayı bıraktım - ikisi de çok sıkıyor" lafını alıntılayarak salonu neşelendirmiştir
      . Dilbilimci John McWhorter ise gençlerin "mesajlaşma" dilini savunmak için, 1956'dan, 1917'den, 1871'den ve hatta MS 63'ten insanların dilin bozulduğuna dair yakındıkları alıntıları peş peşe göstererek, şikayetlerin hep var olduğunu çok esprili bir yolla ispat etmiştir
      ,
      .
      Video: YouTube trend yöneticisi Kevin Allocca, videoların neden viral olduğunu anlatırken "Cuma (Friday)" şarkısını söyleyen kızın veya "Nyan Kedi"nin saçma ama eğlenceli videolarını göstererek salonu kırmış geçirmiştir
      . Yazarın kendisi de Apple mağazası eğitimlerinde, mağazaya keçi getiren veya pizza ısmarlayan bir komedyenin ya da satış katında dans eden bir çalışanın videolarını göstererek mesajını eğlenceyle perçinler
      .
      Fotoğraflar: Karmaşık konular bir fotoğraf sayesinde anında anlaşılır ve mizahi bir hal alır
      . Ekonomist Juan Enriquez, ABD ekonomisinin durumunu göstermek için kapkaranlık bir slayt göstermiş, ekonomik "kaldıraç" sisteminin tehlikesini anlatmak için havuzun ortasında suya değmek üzere olan fişe takılı bir radyonun etrafında eğlenen insanları ekrana yansıtmış, hükümetin harcamalarını ise önce tatlı bir Noel Baba ile, sonra da golf arabasında oturan çıplak bir adamla resmederek salonu kahkahalara boğmuştur
      ,
      .
      Endorfin Adrenaline Karşı Mizahın beyindeki en büyük rolü, TEDx konuşmacısı Chris Bliss'in anlattığı gibi endorfin salgılanmasını sağlamasıdır
      . Bir konu karşısında öfke veya korku hissettiğimizde beynimiz "fight-or-flight" (savaş ya da kaç) tepkisi vererek adrenalin salgılar ve savunma duvarlarımızı göklere çıkarır
      . Ancak mizah sayesinde salgılanan endorfin, duvarları pencerelere dönüştürerek en hassas konularda (politika, din vb.) bile yeni bakış açıları kazanmamızı sağlar
      .
      Mesela gazeteci Rose George, "kaka" ve sanitasyon gibi tabu bir konuyu anlatırken mizahın gücünü harika kullanmıştır
      . İzleyiciye önce yüksek teknoloji bir tuvalet ile yolda kaka yapan bir çocuğun fotoğraflarını arka arkaya sunmuş
      , ardından ishalin komik sanıldığını belirterek "İshal bir şakadır" deyip tuvalet sırası bekleyen yüzü buruşuk bikinili bir kadının fotoğrafını göstermiş, hemen sonrasında ise ishalden ölmüş ve toprağa gömülü küçük Maria'nın yasını tutan babasının fotoğrafını ekrana yansıtarak salonu şok etmiştir
      . Mizah, şok ve istatistik; bu üçlü sihirli bir ikna formülüdür
      . Son olarak, ALS hastası ve tekerlekli sandalyeye bağlı büyük fizikçi Stephen Hawking'in dahi Jim Carrey ile komedi skeçlerine katılarak
       veya uzaylıların neden hep acayip ve eksantrik kişilere göründüğüyle ilgili şakalar yaparak
       kendi durumunu ciddiye almayıp izleyiciyi rahatlatması, mizahın engel tanımayan gücünü gösterir.
      Bu bölümün özü: İnsan beyni sıkıcı verilere hızla kapanırken, mizaha ve yeniliğe sonuna kadar açılır. Sahnede zorlama fıkralar anlatmak yerine, doğal kişisel hikayeler, akıllıca metaforlar, beklenmedik fotoğraflar veya videolar kullanarak yarattığınız tebessüm dalgası; dinleyicinin savunma duvarlarını yıkarak (endorfin salgısı sayesinde) sunduğunuz mesajı zihinlere çok daha derin bir şekilde kazır.
      BÖLÜM 7: 18 Dakika Kuralına Bağlı Kalın
      Waterloo Üniversitesi ekonomi profesörü Larry Smith'in normalde yaptığı seminerler en az 3 saat sürerdi. Ta ki TEDx sahnesine çıkıp hayatının konuşmasını sadece 15 dakikada yapmak zorunda kalana dek
      . Videonun milyonlarca izlenmeye ulaşmasının ardından yazar Carmine Gallo ona bu kuralın neden bu kadar iyi işlediğini sorduğunda, Smith "Düşünmek zor iştir," cevabını verir. "18 dakikada güçlü bir tartışma yaratabilir ve insanların dikkatini çekebilirsiniz"
      .
      TED konferanslarının belki de en kutsal ve katı kuralı budur: Sır #7: 18 Dakika Kuralına Bağlı Kalın. Bill Gates ya da Tony Robbins olmanız fark etmez; sahnede geçirebileceğiniz maksimum süre budur
      . Eğer mutlaka daha uzun bir sunum yapmanız gerekiyorsa, her 10 dakikada bir araya "yumuşak aralar" (hikayeler, videolar, gösteriler) katmanız gerekir
      . TED yöneticisi Chris Anderson bu kuralın mucizesini şöyle açıklar: "18 dakika ciddi olmak için yeterince uzun, insanların dikkatini canlı tutmak için yeterince kısadır. Bu, internette bir kahve molası uzunluğudur. Twitter'ın insanları 140 karakterde disipline zorlaması gibi, bu da konuşmacıyı ana mesajı neyse onu vermeye zorlayarak netleştirici bir etki yaratır"
      ,
      .
      Dinlemek Tüketicidir ve "Durum Anksiyetesi" Peki neden dinlemek bizim için bu kadar zordur? İletişim uzmanı Dr. Paul King bu konuyu "dinleme performansında durum anksiyetesi" adı altında incelemiştir
      . İnsanların sadece sahnede konuşurken değil, dinlerken de ciddi bir anksiyete (kaygı) yaşadıklarını kanıtlamıştır
      . Dr. King, üniversite öğrencilerini dinlerken incelediğinde, anlatılan bilgi çoğaldıkça öğrencilerin kaygı seviyelerinin "yükseldiğini, yükseldiğini ve sonra tamamen düştüğünü (koptuklarını)" gözlemlemiştir
      .
      Bilgi üst üste yığıldıkça beynimizde "kavramsal birikmişlik" (cognitive backlog) denen ağır bir zihinsel yük oluşur
      . King, lise yıllarında münazara takımındayken bütün gün basketbol oynayıp yorulmadığını, ancak ardı ardına üç münazaraya katıldıktan sonra okul otobüsünde uyuyakalıp eve kadar uyanamadığını anlatır; çünkü çözümsel dinlemek fiziksel olarak inanılmaz derecede yorucu bir deneyimdir
      . Bir sunum beş dakika ise kavramsal yük küçüktür; 18 dakikada biraz daha artar, ancak 60 dakikaya çıktığında kavramsal birikmişlik dağı devasa bir hal alır ve dinleyici yılar, öfkelenir
      . King, üniversitedeki araştırma metotları dersini tek parça halinde 3 saat olarak verdiğinde öğrencilerin hiçbir şey hatırlamadığını görmüş, bunu 50'şer dakikalık üç farklı güne (Pazartesi, Çarşamba, Cuma) yaydığında ise öğrencilerin notlarının dramatik şekilde arttığını kanıtlamıştır
      . Çünkü mesajı sündürerek uzatmak, hafızaya işlenmesini kolaylaştırmaz, tam tersine baltalar
      ,
      .
      Beyin Bir Enerji Oburudur (Glikoz Tüketimi) Beynin çabuk yorulmasının tamamen biyolojik bir sebebi vardır. Roy Baumeister'ın Willpower (İrade) kitabında belirttiği üzere, irademiz ve dikkatimiz sonlu bir kaynaktır
      . Ortalama insan beyni sadece 1,36 kg olmasına rağmen, vücuttaki glikozun, oksijenin ve kan akışının çok büyük bir kısmını tüketen gerçek bir "enerji oburudur"
      . Glikoz, basit bir şeker olarak kan dolaşımından beynimize girer ve nöronların birbirine sinyal yollaması (öğrenme süreci) için yakılır
      .
      Baumeister'ın deneylerinden birinde, insanlara bir video izletilirken ekranın altında beliren dikkat dağıtıcı kelimeleri görmezden gelmeleri söylenir. İzleme öncesi ve sonrası ölçümlerde, rahatça izleyenlerin glikoz seviyesi aynı kalırken, dikkatini zorlayarak kelimelerden kaçınmaya çalışanların glikoz (beyin yakıtı) seviyesinde muazzam bir çöküş görülür
      . Uzun, kafa karıştırıcı, karmaşık bir sunum tam da bunu yapar: Dinleyicinin beynini yorar ve glikozunu sömürür
      . 18 dakika kuralının ardındaki bilimsel deha buradadır; bu süre dinleyiciye bilgiyi alması için yeterli zamanı verirken, sunum sonrası eyleme geçmesi veya düşünmesi için hala bir miktar glikoz ve beyin gücü bırakır
      .
      Kısıtlar Altında Gelişen Yaratıcılık "Verecek çok fazla bilgimiz var!" diyerek sunumu kısaltmaya itiraz eden yöneticilere Gallo hep aynı örneği verir: Yaratıcılık kısıtlar altında gelişir
      ,
      . Matthew May, The Laws of Subtraction (Eksiltmenin Kanunları) adlı eserinde, hayal gücünün asıl motorunun sınırsız özgürlük değil, sınırlar ve engeller olduğunu bilimsel olarak ortaya koyar
      . "Orada olmayan şey, olan şeye üstün gelir." Yahoo CEO'su Marissa Mayer da bunu doğrular; haiku, sonat veya dini resimler gibi en ilham verici sanat biçimlerinin katı kısıtlamalar altında doğduğunu söyler
      .
      Amerikan tarihindeki en büyük liderlerin konuşmaları kısa ve öz olmuştur. John F. Kennedy, "İnsanların geveze olduğumu düşünmelerini istemem" diyerek göreve başlama konuşmasını sadece 15 dakikada (1355 kelime) yapmıştır
      . Daha da önemlisi, Amerika'nın aya gitme vizyonunu açıkladığı, milyonlarca bilim insanını harekete geçiren o efsanevi Rice Üniversitesi konuşması sadece 17 dakika 40 saniye sürmüştür! Yani tam bir TED konuşmasıdır
      . Tarihçi David Christian ise, 13 milyar yıllık evrenin tüm tarihini anlattığı ve normalde 48 yarım saatlik dersten oluşan "Büyük Tarih" müfredatını TED sahnesinde tam 17 dakika 40 saniyede anlatmış ve inanılmaz bir etki yaratmıştır
      ,
      . Leonardo Da Vinci'nin dediği gibi, "Sadelik üst düzeyde sofistikeliktir"
      .
      Üç Kuralı (The Rule of Three) Bilginizi 18 dakikaya nasıl sığdırırsınız? Bunun için insan zihninin şifresini çözen "Üç Kuralı"nı kullanmalısınız
      . İnsan beyni, kısa süreli (işleyen) belleğinde ancak üç (veya en fazla dört) parça bilgiyi rahatça tutabilir
      ,
      . Harvard profesörü George Miller'ın 1956'daki "Sihirli Rakam Yedi, Artı ya da Eksi İki" makalesiyle başlayan bu süreç, bugün sinirbilimcilerin bu sayının 3 ya da 4 olduğunu kanıtlamasıyla sonuçlanmıştır
      .
      Tarih boyunca en güçlü mesajlar hep üçlü gruplar halinde verilmiştir. ABD Bağımsızlık Bildirisi (Hayat, Özgürlük, Mutluluk Arayışı), Fransız Devrimi (Özgürlük, Eşitlik, Kardeşlik), masallar (Üç Küçük Domuzcuk, Üç Silahşörler, Lambadaki Cinin 3 Dileği), bilim (Newton'un 3 kanunu, atomun 3 elementi), olimpiyatlardaki 3 madalya, Hristiyanlıktaki üçleme (Baba, Oğul, Kutsal Ruh) tesadüf değildir
      ,
      . Obama'nın "Yes, we can" (Evet, biz yapabiliriz) sloganı bile üç kelimedir
      .
      Neil Pasricha, "1000 Muhteşem Şey" blogunu TEDx sahnesine taşıdığında 1000 şeyden bahsetmemiş, hayatı muhteşem kılan sadece üç kavrama ("Muhteşemliğin Üç Aşaması") odaklanmıştır: Tavır, Farkındalık, Özgünlük
      ,
      . YouTube yöneticisi Kevin Allocca videoların neden viral olduğunu 3 nedene bağlamıştır (trend belirleyiciler, katılan topluluklar, beklenmedik olma)
      . Eko-girişimci Majora Carter ise koca bir vizyonu anlatmak için sahnede peş peşe sadece 3 kişinin hikayesini anlatmıştır (Brenda, Andy ve Judy)
      ,
      .
      Mesaj Haritası Oluşturmanın 3 Adımı Eğer ürününüzü veya fikrinizi 18 dakikada (veya bir asansörde 15 saniyede) satmak istiyorsanız, bir sayfa kağıda şu "Mesaj Haritası"nı çıkarmalısınız
      ,
      :
      Adım: Twitter-dostu bir başlık yaratın. Ürününüz hakkında bilinmesi gereken TEK ANA FİKİR nedir? Bunu 140 karaktere sığdıracak şekilde en tepeye çizin
      .
      Adım: Başlığı Üç Ana Mesajla Destekleyin. Başlığın altına, beynin kolayca hatırlayabileceği şekilde temayı destekleyen tam üç alt başlık (parça) ekleyin
      .
      Adım: Bu üç mesajı hikayeler, istatistikler ve örneklerle güçlendirin. Her üç alt başlığın altına birkaç kelimelik tetikleyici hikaye notları yazın
      .
      Örneğin, Steve Jobs'un o meşhur Stanford diploma töreni konuşmasının mesaj haritası şöyledir: Ana Başlık: "Sevdiğiniz Şeyi Yapın". Üç Ana Mesaj: 1) Noktaları birleştirin (Garaj, Kovuluş, Dönüş), 2) Sevgi ve Kayıp, 3) Ölüm (Zaman kısıtlı, Aç kal-budala kal)
      ,
      . Bu kadar basit bir sayfalık çerçeveyle, saatlerce konuşmadan ve dinleyiciyi glikoz kıtlığına sürüklemeden dünyaları anlatabilirsiniz.
      Bu bölümün özü: İnsan beyni yeni bilgileri alırken devasa bir glikoz yakar ve kısa sürede "kavramsal birikmişlik" batağına düşerek yorulur. Sunumunuzu, zihnin en rahat işlediği "Üç Kuralı"na göre şablonlayarak maksimum 18 dakika ile sınırlamak, hem sizin yaratıcılığınızı ateşleyecek hem de dinleyicilerin mesajınızı kalıcı olarak hafızalarına kazıyıp harekete geçmelerini sağlayacaktır.
  - baslik: Parça E · Çarpıcı Sahneleme ve Özgünlük (Bölüm 8-9)
    icerik: |-
      Harika bir yolculuğun son, belki de en büyüleyici ve en "sizi siz yapan" durağına geldik. Parça E, yani 8. ve 9. bölümler, anlattığınız hikayeyi izleyicinin zihnine bir sinema filmi gibi nasıl kazıyacağınızı ve tüm bunları yaparken o sahnede nasıl o "maskesiz, gerçek siz" olarak kalacağınızı anlatıyor. Kahveniz tazeyse, kitabın tüm bilimsel verilerini, anekdotlarını ve yazarın argüman zincirini eksiksiz bir şekilde, dostane bir sohbet kıvamında yeniden anlatalım.
      BÖLÜM 8: Çoklu Duyusal Deneyimlerle Zihinsel Bir Resim Boyayın
      Gündelik hayatta suyu ne kadar düşünürsünüz? Muhtemelen sadece susadığınızda, değil mi? Peki ya temiz suyunuz olmasaydı? Michael Pritchard, 2004 Hint Okyanusu tsunamisi ve 2005 Katrina Kasırgası felaketlerinden sonra, insanların temiz su bulamadığı için öldüğünü görünce LIFESAVER adında, pis suyu anında içilebilir hale getiren taşınabilir bir filtre icat etti.
      2009'da TED sahnesine çıktığında, izleyicilere sadece istatistikler verip geçmedi. Sahneye, içinde Thames nehrinden alınmış su bulunan bir akvaryum getirdi. İzleyicinin gözü önünde bu suya çamur, kanalizasyon artığı ve hatta "arkadaşının tavşanından bir hediye" (tavşan dışkısı) ekledi. O pis, kokmuş suyu aldı, icat ettiği filtreden geçirdi ve ortaya çıkan kristal berraklığındaki suyu hem kendi içti hem de TED yöneticisi Chris Anderson'a içirdi. Demo sadece 3 dakika sürdü ama video 3 milyondan fazla izlendi. Neden mi? Çünkü Pritchard, sunumunu unutulmaz kılan Sır #8'i kullanmıştı: Birden fazla duyuya hitap eden unsurlarla (görüntü, ses, dokunuş, tat ve koku) zihinsel bir resim boyayın.
      Neden İşe Yarar? (Multimedya ve İkili Kodlama Bilimi) Bilim insanı Dr. Richard Mayer, "Multimedya Öğrenmenin Kavramsal Bir Teorisi" (Cognitive Theory of Multimedia Learning) çalışmasında, beynin bilgiyi sadece dinleyerek ya da sadece okuyarak tam anlamıyla içselleştiremediğini kanıtlamıştır. Beynimiz, bir konunun hem görsel hem de işitsel modelini aynı anda kurduğunda zihinsel bağlantılar çok daha kuvvetli hale gelir.
      Bunun temelinde "Resim Üstünlüğü Etkisi" (Picture Superiority Effect - PSE) ve psikolog Allan Paivio'nun "İkili-Kodlama" (Dual-Coding) teorisi yatar. Gündelik hayattan düşünün: Beyniniz koca bir dosya dolabı gibidir. Ben size sadece "köpek" dersem, beyniniz bunu tek bir dosyaya (sözel kod) koyar. Ama size "köpek" deyip aynı anda sevimli bir köpek fotoğrafı gösterirsem, beyniniz bunu hem görsel hem sözel iki ayrı dosyaya kaydeder. Araştırmalara göre, bir bilgiyi sadece duyarsanız 3 gün sonra sadece %10'unu hatırlarsınız. Ancak o bilgiye bir resim eklendiğinde hatırlama oranınız %65'e fırlar! Resimler ikili kodlanır, kelimeler ise tekli.
      Bu yüzden mükemmel sunumlar duyularımızı üçe ayırarak fetheder: Görün, Duyun ve Hissedin.
      1. GÖRÜN (Sight): PowerPoint'in Ölümü ve Görsel Şölenler Yazar Carmine Gallo'nun en sert eleştirilerinden biri geleneksel, madde işaretleriyle (bullet points) dolu sıkıcı PowerPoint sunumlarınadır. Ortalama bir slaytta 40 kelime vardır. Oysa en iyi TED sunumlarında 40 kelimeyi tek slaytta bulmak imkansızdır. Moleküler biyolog John Medina'nın dediği gibi: Aynı anda birden fazla iş yapmak (Multitasking) bir efsanedir. Beynimiz bir ekrandaki uzun metni okurken aynı anda konuşmacıyı dinleyemez. O halde ne yapmalıyız? Kelimeleri atıp görselleri kullanmalıyız.
      Al Gore ve İklim Değişikliği: Al Gore'un "Uygunsuz Gerçek" sunumu, sunum uzmanı Nancy Duarte tarafından tasarlanmıştı. Gore, karmaşık karbon salınımı bilimini sıkıcı metinlerle değil, dünyadan uzaya seken kırmızı kızılötesi okların animasyonlarıyla anlattı. Milyarder Richard Branson bu sunumu izleyip şirketinin kârının tamamını temiz enerjiye yatırma kararı aldı. Yapımcı Laurie David bu "görsel şöleni" izleyip onu Oscar ödüllü bir belgesele dönüştürdü.
      Bill Gates ve C02 Formülü: Bill Gates, küresel ısınmayı anlatırken ekrana sadece bir gökyüzü, kurumuş bir toprak resmi ve üzerine "CO2 -> Sıcaklık Artışı -> Olumsuz Etkiler" yazan devasa ama tertemiz bir görsel koydu.
      David Christian ve Çırpılmış Yumurta: 13 milyar yıllık tarihi anlatan Christian, termodinamiğin ikinci kanununu (entropi) anlatmak için tek bir kelime kullanmadı; sadece tavaya kırılan ve geriye doğru sarılarak tekrar kabuğunun içine giren bir yumurta videosu izletti.
      Bono ve Yoksulluk Verileri: Rock yıldızı Bono, yoksulluğun 2000'den 2010'a %33'ten %21'e düştüğünü anlatırken koca tablolar göstermedi. Ekranda devasa bir rakam belirdi. Ardından bu verilerin ruhu olan Michael ve Benedicta adında kurtarılmış iki Afrikalı çocuğun kocaman, gülümseyen fotoğraflarını gösterdi. Slayt başına tek istatistik ve bolca duygu!
      Chris Jordan'ın Sanatı: İstatisikleri "hissettiren" adam. ABD'de her ay yapılan göğüs estetiği ameliyatlarının sayısını göstermek için ekranda devasa bir göğüs silüeti gösterir; yakınlaştırdığında bunun aslında 32.000 adet Barbie bebekten oluştuğu görülür! Sigaradan ölenleri, binlerce sigara paketinden yaptığı Van Gogh'un "Sigara İçen Kafatası" tablosuyla gösterir.
      LinkedIn Vakası: Yazar, LinkedIn'in halka arzından önce satış ekibiyle çalışırken onların sıkıcı slaytlarını attırmıştır. 70 milyon kullanıcıyı anlatırken ekrana rakamların yanında, insanlardan oluşan dev bir LinkedIn logosu koydurtmuş ve "Her ay San Francisco'nun nüfusu kadar yeni insan ekliyoruz" analojisini kullandırtmıştır.
      2. DUYUN (Sound): Sözlerle Resim Çizmek Sadece görseller yetmez; sözcüklerinizin ritmi, sesi ve betimlemeleri de birer fırça darbesidir.
      Lisa Kristine'in Gana Madeni: Dünyadaki köleliği fotoğraflayan Kristine, sahneye çıktığında hemen fotoğraf göstermedi. Önce zifiri karanlık bir odada olduğunuzu, burnunuza dolan tozu, terli bedenlerin size çarpışını ve kazma seslerinin kakofonisini kelimeleriyle betimledi. Beynimiz bu sözleri duyduğunda gerçekten o madendeymişiz gibi çalıştı. Neden mi? Çünkü beynin görme korteksi, gerçekte görülenle çok canlı hayal edilen (betimlenen) arasındaki farkı ayırt edemez.
      Janine Shepherd'ın Bisiklet Kazası: Felçli kros kayakçısı Shepherd, hiçbir slayt kullanmadan Sidney'in Mavi Dağları'nda bisiklet sürerken yüzüne vuran güneşi, ciğerlerine dolan soğuk havayı ve o kamyonun çarpışıyla gelen "karanlığı" sadece ses tonuyla öyle bir boyadı ki, dinleyenlerin tüyleri diken diken oldu.
      Anaphora (Tekrar) Sanatı: Sesin gücünü artırmak için Martin Luther King'in "Bir hayalim var..." cümlesini defalarca tekrar etmesi veya Bono'nun "Kazanacağız çünkü... Kazanacağız çünkü..." diyerek cümlelerini ritmik bir şekilde tekrar etmesi (Anaphora) beyinde inanılmaz bir işitsel etki yaratır.
      Roger Ebert'ın Dijital Sesi: Çenesini kanserden kaybeden efsanevi film eleştirmeni Roger Ebert, TED sahnesinde Macintosh'un "Alex" adlı dijital sesini kullandı. Ancak tek bir bilgisayar sesinin 18 dakika boyunca dinleyiciyi yoracağını (işitsel monotonluk yaratacağını) bildiği için, sahneye eşi Chaz'i ve iki dostunu daha çıkararak konuşmasının belli bölümlerini onlara okuttu. Sesi çeşitlendirdi.
      3. HİSSEDİN (Touch): İzleyiciyi Olayın İçine Çekmek İnsanların konunuzu fiziksel olarak "hissetmesi" gerekir.
      Amanda Palmer'ın Süt Kasası: Müzik endüstrisinin sorunlarını anlatmak için sahneye bir süt kasası koyup, elinde bir çiçekle üstüne çıktı. Geçmişte sokaklarda "yaşayan heykel" olarak çalışırken yaşadığı yalnızlığı, hüznü ve göz temasını, izleyiciye tam o saniyede sahnede heykel gibi durarak hissettirdi.
      USB Bellek Demosu (Acıyı Hissettirmek): Yazar bir teknoloji firmasına, yeni hızlı USB belleklerini satarken "saniyede 190 megabit" gibi soyut terimler kullanmak yerine sahnede canlı bir demo yaptırır. Eski USB ile dosya atarken izleyiciyi 40 saniye boyunca o sessiz, sıkıcı bekleme anına (acıya) maruz bırakır. Sonra yeni USB ile 10 saniyede bitirir. O acıyı fiziksel olarak hissetmek, verilerden çok daha etkilidir.
      Dr. Elliot Krane (Kuştüyü ve Pürmüz): Çocuklardaki "Allodini" (dokunmanın yanma hissi yaratması) hastalığını anlatmak için Dr. Krane cebinden sarı bir kuştüyü çıkarıp koluna sürttü. Sonra devasa bir pürmüz çakmağını ateşleyip "Çocuğunuzun kolunu bu tüyle okşadığınızı ama onun beyninin bu çakmağın alevi gibi hissettiğini hayal edin" dediğinde, salondaki herkes o sıcaklığı ve acıyı zihninde hissetti.
      Stacey Kramer'in Tiffany Kutusu: Kramer sahneye çok şık, mavi bir Tiffany hediye kutusuyla çıktı. "İçinde size hayatı yeniden sevdirecek bir hediye var" dedi. Sonra paketi açtı ve içinden kırmızı, biyolojik tehlike yazılı bir torba ve beynindeki tümörün röntgeni çıktı! Bu muazzam zıtlık (lüks hediye kutusu vs. beyin tümörü) izleyicinin bütün hislerini altüst eden, şoke edici ve dokunsal bir empati kurdurdu.
      Bu bölümün özü: İnsan beyni, bilgiyi sadece kelimelerle değil; renkler, sesler, metaforlar ve fiziksel hislerle kodladığında onu silinmez bir şekilde hafızasına kilitler. Mükemmel bir konuşmacı; PowerPoint slaytlarını metin çöplüğünden kurtarıp devasa resimlerle donatan (görme), kelimelerinin ritmiyle zihinde manzaralar çizen (işitme) ve beklenmedik sahne malzemeleriyle dinleyicinin o anı iliklerine kadar hissetmesini (dokunma/hissetme) sağlayan gerçek bir sanatçıdır.
      BÖLÜM 9: Şeridinizde Kalın
      Eğer buraya kadar öğrendiğimiz hikaye anlatma, çoklu duyusal paketleme ve mizah tekniklerini birer "kıyafet" gibi düşünürsek; bu bölüm, o kıyafetin içindeki sizin tamamen şeffaf, çıplak ve gerçek kalmanız gerektiğiyle ilgilidir. Sır #9 bize şunu söyler: Özgün, açık ve şeffaf olun. İnsanlar bir sahtekarı kilometrelerce öteden tanır. Eğer olmadığınız biri gibi davranırsanız, dünyanın en iyi tekniklerini de kullansanız izleyicinin güvenini asla kazanamazsınız.
      Sheryl Sandberg'in Gözyaşları ve Maskeyi İndirmek Facebook'un 2 numaralı ismi Sheryl Sandberg, 2010 yılında TED sahnesine çıkmadan hemen önce kuliste bekliyordu. Konuşması profesyonel, veri dolu ve "iş dünyasındaki kadınlar" üzerineydi. Fakat aklından çıkmayan bir görüntü vardı: O sabah evden çıkarken küçük kızı onun bacağına sarılmış ve "Gitme anne!" diye ağlamıştı. Sandberg son dakikada Paley Merkezi CEO'su Pat'e "Bunu konuşmama ekleyebilir miyim?" diye sordu. "Kesinlikle," yanıtını alınca sahneye çıktı ve o "yenilmez, her şeyi mükemmel yapan, robot gibi kusursuz kadın yönetici" maskesini çıkarıp attı. Dinleyicilere, her şeye yetişmekte nasıl yetersiz kaldığını itiraf etti. Bu savunmasızlık ve dürüstlük hali (kendi şeridinde, kendi gerçeğinde kalması), o konuşmayı efsanevi yaptı.
      Ünlü televizyoncu Oprah Winfrey, kendisine gelip "Ben bir sonraki Oprah olmak istiyorum" diyen genç bir kadına şu harika öğüdü vermişti: "Hayır bunu istemezsin. Kendi şeridini bulmalı ve o şeritte kalmalısın." Herkesin yürüyebileceği ve sadece ona ait olan tek bir şerit vardır. Kendi şeridinizde kalmak demek, kendi zaaflarınızı, korkularınızı ve gerçekliğinizi cesurca sahneye taşımak demektir.
      Bilim İnsanının "Nirvana" İtirafı: Kalbini Açmak Dr. Jill Bolte Taylor'ı hatırlıyor musunuz? Hani şu kendi geçirdiği felci anlatan nöroanatomist. Konuşmasına bir hafta kala en yakın arkadaşı provalarını izlemiş ve ona çok sert ama hayati bir eleştiri yapmıştı: "Jill, bizi ilk 12 dakika o muazzam ve savunmasız yere götürüyorsun ama sonra birden bize felç hakkında kuru bir tıp dersi vermeye başlıyorsun. Kalbini açmalısın!"
      Bir bilim insanı için "kalbini açmak" ve ruhani şeylerden bahsetmek büyük bir risktir, ciddi bir cesaret ister. Ancak Dr. Jill, arkadaşını dinledi ve konuşmasının sonunu değiştirdi. Felç anında sol beyni susunca hissettiği o devasa evrenle bir olma hissini, "Ruhum bir balina gibi özgürlüğe süzüldü. Nirvana'yı buldum" diyerek anlattı. Bilimsel verilerin (kendi şeridinin sınırları) ötesine geçip, ruhani içgörüsünü (gerçek benliğini) anlattığında, sunumu "iyi" seviyesinden çıkıp "dünyayı değiştiren" bir fenomene dönüştü.
      Grey's Anatomy'den Bir Ders: Notları Bir Kenara Fırlatmak Yazarımız Carmine Gallo, popüler dizi Grey's Anatomy’de kurgusal bir TED konuşması sahnesinden bahseder. Dr. Callie Torres bir TED konuşması yapacaktır ama hazırladığı ortopedi (kıkırdak) sunumu çok sıkıcıdır. Kaza geçirdiği ve en yakın arkadaşını (ve çocuğunun babasını) kaybettiği o korkunç yılın ardından sahneye (daha doğrusu uydu bağlantısına) çıkar. Eline aldığı o ezberlenmiş not kartlarına bakar, meslektaşının "Sadece kendin ol" fısıltısını duyar ve kartları fırlatıp atar. "Çok kötü bir yıl geçirdim... Bizi bir arada tutan şey nedir diye çok düşündüm," diyerek direkt kalbinden konuşmaya başlar. Dizi yazarları bile, TED'in büyüsünün o ezberlenmiş, jilet gibi profesyonel maskelerde değil, savunmasız kalan gerçek insanda yattığını içgüdüsel olarak çok iyi anlamışlardır.
      "İş İştir, Oyun Oyundur" Yalanı Virgin şirketler grubunun çılgın kurucusu Richard Branson'ın dediği gibi: "İşi iş, oyunu oyun gibi görmem. Hepsi yaşamaktır." Yani işte taktığınız bir maske, evde taktığınız başka bir maske olmamalıdır. Yazarımız, kapalı kapılar ardında, toplantı odalarında fıkır fıkır, esprili ve tutku dolu olan devasa şirket CEO'larının; iş sahneye çıkmaya gelince nasıl kaskatı, sıkıcı ve "ruhsuz" heykellere dönüştüklerini anlatır. Neden böyle yapıyorlar diye sorulduğunda "Çünkü sunum yapıyorum" derler. Hayır! Sunum yapmak demek, başka biri gibi davranmak demek değildir. İnsanlar, sahnede "kurum sözcüsü" değil, kanlı canlı bir insan görmek isterler.
      Güvensizlikle Yüzleşmek: Korku Hepimizde Var Çoğu insan, bu mükemmel liderlerin sahnede doğuştan özgüvenli olduğunu sanır. "Ben utangacım, benim konum çok sıkıcı, benim sesim titriyor" deriz. Oysa bu isimlerin hepsi de o yollardan geçmiştir:
      Joel Osteen: Bugün devasa stadyumlara vaaz veren bu ünlü ruhani lider, 1999'daki ilk vaazında korkudan "ölesiye titriyordu." Ustalaşması on yılını aldı.
      Richard Branson: İlk konuşmasında beyni tamamen durmuş, ağzında birkaç kelime geveleyip sahneden kaçmış ve kendi deyimiyle yüzü "Virgin logosu kadar kırmızı" olmuştu!
      Warren Buffett: Dünyanın en zengin yatırımcılarından biri olan Buffett, 20'li yaşlarında topluluk önünde konuşmaktan o kadar dehşete kapılıyordu ki, okulda sunum yapması gereken derslerden kaçıyordu. Sonunda bunun potansiyelini yok edeceğini anlayıp Dale Carnegie kursuna yazıldı (hatta ilkinde korkup kaçtı, sonra tekrar 30 kişiyle birlikte katıldı). Başarısının sırrını tamamen bu "iletişim" yeteneğine bağlar.
      Kendi şeridinizde kalmak pratik ister. Yazar, danışmanlık yaptığı yöneticilere sunumlarını önce eşlerine veya yakın bir arkadaşlarına (yanlarında maske takamayacakları insanlara) yapmalarını önerir. Ancak bu şekilde o "kurumsal" sertlikten kurtulup gerçek benliklerine ulaşabilirler.
      Bu bölümün özü: Dünyanın en harika iletişim tekniklerini kullanabilirsiniz, ancak sahnedeyken bir başkasının "mükemmel" kopyası olmaya çalışırsanız (maske takarsanız), dinleyicinin sezgileri bu sahteliği anında yakalar. Kendi şeridinizde kalın; kusurlarınızı, gerçek hislerinizi ve hikayenizi tıpkı yakın bir dostunuzla konuşur gibi dürüstçe paylaştığınızda, karşınızdaki kitleye sadece bilgi vermekle kalmaz, onların ruhuna dokunarak hayatlarını değiştirme gücüne (gerçek liderliğe) sahip olursunuz.
