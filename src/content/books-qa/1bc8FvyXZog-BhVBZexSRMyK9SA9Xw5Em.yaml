      Kitabın 5 Mantıksal Parçaya Bölünmesi
      Sonraki adımlarda derinlemesine inceleme yapabilmeniz için kitap, konu akışı ve yaratıcı sürecin aşamaları dikkate alınarak 5 mantıksal parçaya ayrılmıştır:
      Parça 1: Yaratıcılığın Temelleri ve Sanatçının Zihniyeti (Bölüm 1-15): Yaratıcılığın ne olduğu, ilhamın evrensel kaynağı, farkındalık, algı (hazne ve süzgeç) ve ilhamı çekmek için gerekli ortamın nasıl hazırlanacağına odaklanır.
      Parça 2: Zihinsel Engelleri Aşmak ve Çalışmaya Başlamak (Bölüm 16-27): Özgüvensizlik, şüphe, dikkat dağıtıcı unsurlar ve eski alışkanlıklar gibi içsel bariyerlerin aşılması; kuralların yıkılıp sabır, dinleme ve "acemi zihniyle" çalışmaya başlanması anlatılır.
      Parça 3: Yaratıcı Sürecin Aşamaları: Tohumdan Üretime (Bölüm 28-40): Somut yaratım aşamalarıdır. Fikirlerin (tohumların) toplanması, kuralsızca test edilmesi (deneme yanılma), eserin inşa edilmesi (üretim) ve son halini alıp (tamamlama) dünyaya sunulması işlenir.
      Parça 4: Eseri Şekillendiren Yaklaşımlar ve Tepkiler (Bölüm 41-58): Yaratım sırasında karşılaşılan coşku, sürprizler, içsel fısıltılar, rekabet yanılgısı ve karar verme anlarında başvurulacak içgüdüsel yöntemler (nasıl seçmeli, açık fikirlilik) derinlemesine incelenir.
      Parça 5: Sanatın Anlamı, Özgürlük ve Evrensel Uyum (Bölüm 59-78): Sanatın nihai amacı, özgürlük, yaratıcı oyunbazlık, içtenlik ikilemi, evrenle uyum (ahenk) ve sanatı bir yaşam tarzı (var olma biçimi) olarak sürdürmenin felsefesi tartışılır.
      Tüm Bölüm (Chapter) Başlıkları ve İçerik Tanımları
      1. Herkes Yaratıcıdır: Yaratıcılık sadece somut sanat eserleri üretmek değil, dünyayı algılama ve deneyimleme biçimidir
      . Hepimiz algılarımız aracılığıyla her an kendi gerçekliğimizi yaratarak bu sürece aktif şekilde katılırız
      . 2. Uyumlanmak: Evren, sürekli dönüşen kesintisiz bir yaratım sürecidir ve insanın sanat üretmesi de ağaçların çiçek açması gibi bu doğanın bir parçasıdır
      . Sanatçılar, evrenin yayınladığı fikir ve enerjileri yakalayıp yansıtan hassas antenler olarak işlev görürler
      . 3. Yaratıcılığın Kaynağı: Ürettiğimiz eserin asıl malzemesi içimizde değil, bizi çepeçevre saran engin evrendeki bilgeliktedir
      . Fikirler tıpkı yok olmayan bulutlar gibi form değiştirerek zamanı geldiğinde bizim aracılığımızla fiziksel dünyada beden bulur
      . 4. Farkındalık: Şimdiki anı ve çevremizde olanları yargılamadan, saf bir bağ kurarak fark etme pratiğidir
      . Bu kabiliyetimizi geliştirmek, olağanlığın ötesini görmemizi ve deneyimlediğimiz evrenin sınırlarını genişletmemizi sağlar
      . 5. Hazne ve Süzgeç: İçimizdeki "hazne", dünyadaki tüm deneyimlerimizin ve toplanan verilerin biriktiği alandır
      . Bilgiler kendimize has "süzgecimizden" geçerek içeri girer; sanatçı bu bilgiyi hikayeler ve kısıtlamalardan arındırarak doğaya en yakın haliyle kabullenmeye çalışmalıdır
      . 6. Görünmeyen: Sanat, sadece fiziksel ürünler (kitap, plak, resim) ortaya koymak değil, bizi görünmeyen tinsel dünyaya ve aşkınlığa ulaştıran bir kapıdır
      . Aklı ön plana çıkaran dar bakış açısının aksine, inançla beslenen tinsellik sanatçıya sınırsız olasılıklar ve olağanüstü bir açıklık sunar
      . 7. İpuçlarını Arayın: Yaratıcı süreçte ihtiyaç duyduğumuz çözümler, çoğunlukla çevremizdeki rastlantısal karşılaşmalara ve doğanın dokusuna gizlenmiş işaretlerde (ipuçlarında) saklıdır
      . Açık bir zihinle bu görünmeyen mesajları aramak, evrenin bizi doğru yöne sevk etmesine olanak tanır
      . 8. Uygulama: Hayatta kalma güdüsüyle daralan odağımızı genişletmek için günlük ritüellerle (örneğin derin nefes almak veya doğa yürüyüşleri) farkındalık pratiği geliştirilmelidir
      . Bu pratikler sayesinde dünyayı algılayış biçimimiz dönüşür ve kendini sürekli yenileyen daha büyük bir bütünün parçası olduğumuzu derinden hissederiz
      . 9. Keşfe Dalın (Büyük Eserleri): Yaratıcılığımızı beslemek için sadece anlık merakla değil, edebiyat, sinema ve resim gibi alanlardaki büyük başyapıtları bilinçli olarak keşfetmek gerekir
      . Nitelikli eserlere maruz kalmak, kendi sanatımızdaki seçkinlik ölçütümüzü hassaslaştırarak çok daha isabetli sanatsal seçimler yapmamızı sağlar
      . 10. Doğadan Ders Almak: Doğanın kusursuz ahengi ve sonsuz çeşitliliği, sanatçı için ulaşabileceği en büyük ve daimi ilham kaynağıdır
      . Doğadaki bu sınırsız paleti gözlemlemek, etiketleme eğilimlerimizi aşmamıza ve eserlerimizde bütünlük hissini yakalamamıza yardımcı olur
      . 11. Hiçbir Şey Durağan Değildir: Dünya ve içindeki her şey, aynı nehre iki kez girilemeyeceği gibi, sürekli bir akış ve değişim içindedir
      . Kendi benliğimizin ve çevremizin bu değişkenliğini kabul etmek, aynı yerde her gün yepyeni detaylar ve anlamlar keşfetmemizi sağlar
      . 12. İçe Bakış: İlham verici bir yaşam sadece dışsal olaylardan ibaret değildir; iç dünyamız da en az dışarısı kadar zengin ve şaşırtıcı bir manzara sunar
      . Kendi duyumlarımıza, duygularımıza ve içsel ritimlerimize odaklanmak, dış dünyayla aramızdaki ayrıklığı bitirip bizi bütünleştirir
      . 13. Hatıralar ve Bilinçaltı: Bilinçaltı ve hatıralarımız, düşündüğümüzden çok daha derin ve engin bir yaratıcılık kaynağı barındırır
      . Rüyaları anında kaydetmek veya serbest yazım pratikleri yapmak, mantığı devreden çıkararak bu kadim bilgeliğe erişmemizi sağlar
      . 14. Hep Oradadır: Aradığımız o eşsiz fikir veya ilham, tıpkı yoğun bulutların ardında hep var olan güneş gibi daima oradadır
      . Kendi farkındalığımızı yüksek tuttuğumuzda, çevremizde zaten hazır bekleyen bu yaratıcı enerjiye anında ulaşabiliriz
      . 15. Ortam: Doğru yaratıcılık ortamı kişiden kişiye farklılık gösterir; kimisi izole bir ormanda kimisi de kalabalık ve gürültülü bir kafede evrenin mesajlarına uyumlanır
      . Dış dünyadan veya içimizdeki eleştirel seslerden arınarak yaratıcı kanalımızı açık tutan o ideal koşulları deneme yanılma yoluyla keşfetmemiz gerekir
      . 16. Özgüvensizlik: Güvensizlik ve insani kusurlarımız, sanat eserlerini ruhsuz olmaktan kurtaran ve sanatçıya özgünlük katan değerli özelliklerdir
      . Japon çömlek sanatı "Kintsugi"deki gibi bu kusurları saklamak yerine kucaklayarak, onları çalışmamızı besleyen eşsiz bir rehbere dönüştürebiliriz
      . 17. Yaratın Gitsin: Yaratım sürecindeki korkuları aşmanın yolu, eserin hayatınızdaki en önemli şey olduğu baskısını bir kenara bırakıp onu kuralsız bir "oyun" ve "deney" olarak görmektir
      . Çıtayı başlangıçta düşük tutarak oynamaya odaklanmak, sonuca takılmadan serbestçe şaşırtıcı eserler üretmenin önünü açar
      . 18. Dikkat Dağıtma: Yaratıcı bir çıkmaza girdiğinizde soruna inatla odaklanmak yerine yürümek veya bulaşık yıkamak gibi basit, otomatik işlere (bilinçli dikkat dağıtıcılara) yönelmek çok etkilidir
      . Zihnin bilinçli kısmı bu eylemlerle meşgulken, bilinçaltı arka planda sorunları sessizce ve çok daha rahat çözer
      . 19. Ortaklık: Sanat, sadece sanatçının tekil çabasıyla değil, kendinden önceki eserlerle, çevresiyle, araçlarıyla ve benliğinin farklı yönleriyle girdiği kolektif bir diyalogdur
      . Ürettiğiniz eser her izleyicide farklı bir anlam ve duygu bulur; bu, sanatın tek ve sabit bir gerçekten ibaret olmadığını kanıtlar
      . 20. Niyet: Eserin gerçek gücü ve sihri, süslemelerde değil; bilinçaltı inançların, deneyimlerin ve yaratıcı enerjinin tam bir uyum içinde esere aktarıldığı o saf niyette gizlidir
      . Bizler, evrenin çok daha büyük kozmik niyetini (senfonisini) kendi niyetimiz aracılığıyla şekillendirip maddeleştiren birer aracıyız
      . 21. Kurallar: Sanattaki kurallar kesin doğa yasaları değil; aksine çoğu zaman sanatçının gelişimini kısıtlayan ve onu vasatlığa sürükleyen varsayımlardır
      . Olağanüstü ve çığır açan bir eser yaratmak için alışılagelmiş standartların ve geçmişten içimize işleyen o görünmez kısıtlamaların cesaretle yıkılması şarttır
      . 22. Tam Tersi de Doğrudur: Sahip olduğunuz bir kuralın, inancın veya formülün tam zıddını uygulamak, yaratıcı süreci besleyen harika bir egzersizdir
      . Terazinin dengesini (Yin ve Yang) anlamak için eserinizdeki karanlığı daha karanlık yapmak ya da fiziksel heykeli soyutlaştırmak gibi zıt uçlarda gezinerek yeni olasılıklar keşfedebilirsiniz
      . 23. Dinlemek: Gerçek dinleme, duyduğumuzu yargılamadan, cevap hazırlamadan ve sadece "şimdiki an"da kalarak bilgiyi tüm benliğimizle kabul etmektir
      . Yeni bilgiyi savunmaya geçmeden safça içine almak süzgecimizi genişletir, önyargılarımızdan özgürleştirir ve dünyayı daha kapsayıcı anlamamızı sağlar
      . 24. Sabır: Yaratıcılıkta kestirme yollar yoktur; bir fikrin, eserin veya ilişkinin olgunlaşmak için kendi doğal kozmik ritmine ve zamanına ihtiyacı vardır
      . Zamanın hızlanmasını dileyen sabırsızlık yerine sürece teslim olmak ve eserin kendini açığa çıkarmasını zorlamadan, faal olarak beklemek başarının anahtarıdır
      . 25. Tertemiz Zihin: Sahip olduğumuz deneyimler ve bildiklerimiz, olaylara "acemi zihniyle" sıfırdan ve saf bir merakla (çocuk gibi) yaklaşmamızı zorlaştırır
      . AlphaGo'nun yapay zekasında olduğu gibi geçmiş kuralların ve öğretilmiş davranışların yükünden kurtulmak, daha önce görülmemiş o çığır açıcı yeniliklerin kapısını aralar
      . 26. İlham: İlham, ansızın içimize dolan ve zihnimizi hazırladığımızda kendini gösteren, yönlendirici ve güç verici kozmik bir aydınlanmadır
      . Zamanlaması bizim kontrolümüzde olmasa da, alışkanlıkları kırarak ve hayret duygumuzu canlı tutarak zihnimizi bu şimşek çakmasına daima hazır bir alıcı haline getirebiliriz
      . 27. Alışkanlıklar: Sürdürülebilir harika eserler üretmek, ayakkabı bağlamak gibi detaylara bile özen gösteren disiplinli günlük ritüeller ve alışkanlıklarla mümkündür
      . İyi ayarlanmış bir disiplin (örneğin aynı kıyafeti giymek), özgürlüğü kısıtlamak yerine gündelik karar yorgunluğunu ortadan kaldırarak yaratıcı zihni özgürleştirir
      . 28. Tohumlar: Yaratıcı sürecin bu ilk adımında asıl hedef, fikirleri (tohumları) erkenden yargılayıp elemeden tamamen açık bir zihinle, bolluk içinde toplamaktır
      . Hangi tohumun görkemli bir esere dönüşeceği zamanla belli olacağından, sadece bize heyecan ve şevk verenlere odaklanıp gelişmelerine alan tanımalıyız
      . 29. Deneme Yanılma: Toplanan tohumların potansiyelini görmek için kurallara bağlı kalmadan ve oyun oynar gibi farklı olasılıkları test ettiğimiz genişleme evresidir
      . Eseri belirli bir hedefe zorlamak yerine sürprizlere açık olmak; beklenmedik hataları ve tuhaf sonuçları muazzam keşifler için birer fırsat olarak kucaklamayı gerektirir
      . 30. Her Şeyi Deneyin: "Kötü fikir yoktur" diyerek zihninizdeki farazi tartışmaları fiziksel dünyaya taşımak ve işe yaramaz görünen seçenekleri bile cesaretle doğrudan test etmektir
      . Yanlış bir yola sapmak zaman kaybı değildir; bizi asıl işe yarayacak çözüme ve bambaşka yepyeni manzaralara götüren güvenilir adımlardır
      . 31. Üretim: Tohum belirli bir yön kazandıktan sonra el emeğiyle duvar örer gibi eseri gerçeğe dönüştürdüğümüz, yapısal sınırların çizildiği inşaa aşamasıdır
      . Sadece detay eklemeyi değil, aynı zamanda fazlalıkları budayıp eksiltmeyi de içeren bu süreçte heyecanımızın bizi yönlendirdiği seçenekleri takip etmeliyiz
      . 32. İvme: Eseri üretirken ilk taslağa takılıp kalmamak ("demo-itis") ve ilerlemeyi sürdürmek için sürekli ileriye dönük bir momentum yakalamak gerekir
      . Eğer bir bölümde (örneğin ortasında) tıkanırsanız orayı atlayıp diğer yerleri tamamlayın; böylece parçalar yerleştikçe eksik olan kısım kendiliğinden çözümünü bulacaktır
      . 33. Bakış Açısı: Sanatın amacı ulaşılamaz bir mükemmellik değil, dünyayı kendi eşsiz süzgecimizden (benlik prizmamızdan) nasıl gördüğümüzü olduğu gibi paylaşmaktır
      . Herhangi bir dış görüş ya da taklit kaygısı taşımadan içsel hakikatimizi samimiyetle ifade ettiğimizde eser, izleyicide çok daha derin ve evrensel bir yankı bulur
      . 34. Tekdüzeliği Kırmak: Yaratıcı süreçte bir duvara tosladığınızda ortamı karartmak, kulaklık sesini kısmak ya da eseri bambaşka biri için üretiyormuş gibi hayal etmek heyecanınızı anında tazeler
      . Zihni alışkın olduğu rutinlerden uzaklaştırıp fiziksel ve duyusal koşulları değiştiren bu oyunbaz egzersizler, yepyeni bir performansın kilidini açar
      . 35. Tamamlama: Üretimin nihayete erdiği, eseri ince detaylarıyla elden geçirip dünyayla buluşmaya (serbest bırakmaya) hazırladığımız yaratıcı yolculuğun son safhasıdır
      . Kusursuzluk arayışıyla esere sonsuza dek bağlanıp onu hapsetmek yerine; zamanı geldiğinde bitiş çizgisini kabul ederek bir sonraki taze projeye yelken açmak asıl evrimdir
      . 36. Bolluk Zihniyeti: İçimizdeki fikir nehrinin kuruyacağından korkup esprileri veya projeleri istiflemek (kıtlık zihniyeti) yerine; ürettikçe çok daha fazlasının geleceğine olan sonsuz inançtır
      . Tek bir büyük projenin hayatımızı sonsuza dek tanımlayacağı yanılgısını bırakıp her yeni eseri devasa yaşam hikayemizin sadece bir bölümü olarak görmeliyiz
      . 37. Deneyciler ve İş Bitiriciler: Sanatçılar genellikle süreci hayal kurarak uzatanlar (Deneyciler) ile hızlıca sonuç odaklı olup eseri hemen netleştirenler (İş Bitiriciler) olarak ikiye ayrılır
      . Her iki grup da kendi zayıf yönünü törpülemek için diğerinden ders almalı; deneyciler işleri parça parça da olsa bitirmeyi, iş bitiriciler ise olasılıklara biraz daha alan tanımayı öğrenmelidir
      . 38. Geçici Kurallar: Genelgeçer kuralları yıkmanın yanı sıra, sanatçının eserine bilerek zorlayıcı geçici kurallar (örneğin tek renk veya elde kamera kullanmak) koyması çok ufuk açıcı bir stratejidir
      . Bu gönüllü kısıtlamalar konfor alanından çıkmayı mecbur kılar ve sanatçının içindeki beklenmedik, tamamen özgün çözümlerin doğmasını sağlar
      . 39. Büyüklük: Herhangi bir eserdeki asıl gayemiz, ticari başarılara veya dış beklentilere aldırmadan kendi yüksek güzellik anlayışımıza göre en seçkin ve büyük eseri yaratmaktır
      . Saf yaratıcı niyetle tüm ruhumuzu ortaya koyduğumuz bu fevkaladelik arayışı, bulaşıcı bir etkiyle etrafımızdaki herkese de büyük işler yapma ilhamı aşılar
      . 40. Başarı: Sanatta gerçek başarı piyasa, para, şöhret veya eleştirel övgü değil; eserin potansiyelini tümüyle ortaya çıkardığınızı hissettiğiniz o içsel ve mahrem tatmin anıdır
      . Dış dünyanın tepkileri ve zamanlaması tamamen kontrol dışı olduğundan, başarı sadece üretip dünyayla paylaşarak yeni bir serüvene (projeye) başlama eyleminin ta kendisidir
      . 41. Kendine Dışarıdan Bakma (Olasılıklar): Felaketler, çıkmazlar veya başarısızlıklar karşısında kederlenip pes etmek yerine, hayatınızdaki olaylara bir film sahnesi izlermiş gibi mesafeyle bakabilme yetisidir
      . Olaylara bu nesnel perspektiften (dışarıdan) bakabilmek, o anki zorluğun hikayenin sonu olmadığını ve ardında yepyeni yaratıcı olasılıklar barındırdığını fark etmemizi sağlar
      . 42. Coşku: İçimizde bir anda uyanan "kıpır kıpır" olma hali, şevk ve haz; çalışmamızın doğru bir temel üzerinde yattığını gösteren en güvenilir içsel pusulamızdır
      . Bu eşsiz coşkuyu mantık süzgecinden geçirip analiz etmek yerine onu ilkel, bedensel bir rehber olarak safça takip etmek bizi derin eserlere kavuşturur
      . 43. Referans Noktası: Alışık olduğumuz kalıpları yıkan yenilikçi eserler başlangıçta bize yabancı, tuhaf ve itici gelebilir; ancak bağlam kazandıkça zamanla en sevdiğimiz başyapıtlara dönüşürler
      . Yeni bir fikre içgüdüsel olarak verdiğimiz sert ve güçlü tepkileri reddetmek yerine dikkatle incelemek, bizi yaratıcılık yolculuğumuzdaki o çığır açıcı bir sonraki adıma taşır
      . 44. Rekabet Etmeme: Her eser sanatçının biricik özünü yansıttığından, sanatta başkalarını alt etmek için girişilen rekabet ve kıyaslama ("kıyaslama neşeyi öldürür") anlamsız ve düşük titreşimli bir eylemdir
      . Gerçek sanatçı sadece dünkü kendisini geçmek için kendiyle yarışır; başkalarının muhteşem eserleri karşısında ise kıskançlık yerine derin bir ilham ve "işbirliği" hisseder
      . 45. Öz: Bir eserde pencereler silinip çatılar değişse de (sürekli denemeler yapılsa da) onu bir arada tutan ve kimliğini oluşturan değişmez bir çekirdeği (özü) vardır
      . Eseri süslemelerinden ve fazlalıklarından arındırıp mümkün olan en yalın ve sade haline indirdiğimizde, kendi gerçek özümüzü anlamaya da o kadar yaklaşmış oluruz
      . 46. Asılsız Hikayeler: Efsanevi sanatçıların yöntemleri, ilham perileri veya "ıstırap çeken dahi" olduklarına dair sonradan anlatılan büyüleyici hikayeler çoğunlukla abartılı tahminler ve kurgulardan ibarettir
      . Bu mitleri mutlak formüller gibi tekrar etmeye çalışmak ya da kendimizi o ilahlaştırılmış figürlerle kıyaslamak yerine, sadece kendi benzersiz sanatsal yolculuğumuza inanmalıyız
      . 47. Duymazdan Gelmek (Dikkat Dağıtıcı Sesleri): Eser dünyaya açıldığında, ticari baskılar, son teslim tarihleri ve onay arayışı gibi dış sesler sanatçının saf yaratıcılık sürecini işgal edip yönlendirmek ister
      . Zihnimizde dönüp duran bu içselleştirilmiş eleştirmen seslerine savaş açmak yerine, onlara enerjimizi harcamadan bir bulut gibi geçip gitmelerine izin vermeli ve sadece üretmeye odaklanmalıyız
      . 48. Öz Farkındalık: Bizi ehlileştirip standartlaştıran toplumsal kuralları aşarak; kendi hislerimiz, duygularımızın yoğunluğu ve iç dünyamızla doğrudan ve yargısızca uyumlanabilme becerisidir
      . Kendimizi kısıtlayıcı egosal hikayelere ve etiketlere hapsetmekten vazgeçtiğimizde, içimizdeki o eşsiz enerjiyi kullanarak evrenle bağ kurduğumuz yüksek bir bilince erişiriz
      . 49. Gözümüzün Önünde: Yaratıcı sürecin tıkandığı anlarda çözüm sanıldığı kadar uzakta değil; eseri bambaşka bir bakış açısıyla gözlemlediğimizde tam da gözümüzün önünde duruyordur
      . Ufak bir kusur yüzünden önyargıyla tüm eseri çöpe atmak ("ya hep ya hiç") yerine, açık zihinle zayıf ve güçlü yanları kabullenip eserin bütününe şans vermeliyiz
      . 50. Gaipten Bir Fısıltı: Bizi yıllar süren devasa projelere yönlendiren fikir veya tohum, genellikle o an sıradan ve önemsiz gibi görünen cılız, kozmik bir fısıltıyla gelir
      . Analitik zihnimizle bu işaretleri zorla yaratmaya veya çözmeye çabalamak yerine, düşüncelerimizi yürüyüş veya yüzme ile dinginleştirerek bu sessiz fısıltıları içeriye buyur etmeliyiz
      . 51. Sürprizlere Hazır Olun: Eserle tam bütünleştiğimiz anlarda bilinçaltından fırlayan "hatalar" veya garip tesadüfler, bizi hedeflediğimizden çok daha çarpıcı çözümlere ulaştıran hediyelerdir
      . Her aşamayı kontrol altında tutmaya çalışıp eseri zorlamak yerine alçakgönüllülükle teslimiyeti seçersek, şaşırtıcı ve eşsiz olasılıkların bizim aracılığımızla ortaya çıkmasına izin vermiş oluruz
      . 52. Büyük Umutlar (Beklentiler): Yeni bir esere başlarken duyduğumuz başaramama korkusu veya kusursuz olma beklentisi, yaratıcı adımlarımızı felç eden zehirli bir baskıdır
      . Sonucun belirsizliğini kabullenip deneysel sürece ve çalışmanın bizzat kendisine bir bilim insanı gibi körü körüne güvenirsek; başarısızlıkları bile hedefimize giden değerli adımlara dönüştürebiliriz
      . 53. Açık Fikirlilik: Güvenlik ihtiyacıyla inandığımız kurallar bizi rahatlatsa da; sanatçı zihnindeki sınırları esneterek, alışık olmadığı tuhaf ve farklı seçenekleri merakla karşılayacak bir genişliğe ulaşmalıdır
      . İşler ters gittiğinde ya da beklenmedik arızalar çıktığında sinirlenmek yerine durumu fırsat bilip, doğaçlama ile sürece bambaşka yönler verebiliriz
      . 54. Şimşek Çakması: İlhamın, zihnimizde bir aydınlanma (şimşek) yaratarak muazzam vizyonlar sunması büyüleyicidir; ancak onu bekleyerek eylemsiz kalmak sanatçıyı tüketir
      . Fırtına avcısı gibi şimşeği beklemek yerine her gün bir zanaatkar edasıyla disiplinle çalışmalı, asıl aydınlanmaların çaba gösterdikçe doğan "a-ha!" anlarında gizli olduğunu bilmeliyiz
      . 55. 7/24 (Kendinizi Vermek): Sanatçılık, 9-5 mesaisi gibi ofiste biten bir iş değil; rüyalarda, yolda, sohbette yani hayatın her anında dikkat ve alıcılık gerektiren kesintisiz bir yaşam biçimidir
      . Fikirlerin ne zaman geleceği belli olmadığı için her an not almaya, dinlemeye ve gözlemlemeye hazır, açık bir radar gibi yaşamak sanatçının yegane sorumluluğudur
      . 56. Kendiliğindenlik (Özel Anlar): Çabasızca, bir çırpıda doğaçlama olarak ortaya çıkan bir eserin; yıllarca ter dökülüp ince elenerek tasarlanmış bir esere nitelik veya değer açısından bir üstünlüğü yoktur
      . Zihni ve planları devreden çıkararak kendiliğindenliğe (örneğin caz müzisyenleri gibi) alan açmak; kayıt ve not tutarak desteklendiğinde sanatçının beklenmedik o eşsiz anları yakalamasını sağlar
      . 57. Nasıl Seçmeli?: Karar verme anlarında, (örneğin A/B testi yaparak) iki seçeneği yan yana koyup bilinçli ve analitik zihni tamamen devreden çıkararak hareket etmeliyiz
      . Hiçbir önyargı taşımadan, bedensel bir haz ve coşkuyla içimizi titreten seçeneğe yöneldiğimizde kalbimizin ilk tepkisi daima en doğru sonucu verir
      . 58. Tonlar ve Ölçüler: Bir eseri yaratırken sarf edilen uzun mesailerle alınan sonuçlar arasında hiçbir zaman adil veya sabit bir matematiksel orantı bulunmaz
      . Mucizevi anlar, devasa değişikliklerden değil; sıradan bir eseri şahesere çeviren, oranları ustalıkla ayarlanmış minicik bir fırça darbesi veya ses ayarı sayesinde gerçekleşir
      . 59. Gizli Anlamlar (Amaç): Bir eseri yaratmak için ulvi, derinlemesine düşünülmüş veya gizli bir "neden" bulmak gibi bir zorunluluğumuz kesinlikle yoktur
      . Kendi hazzımız, merakımız ve içsel tatminimiz için bir şeyler üretmek; hiçbir mantıklı amaca hizmet etmese bile kendi başına yeterli ve kıymetli bir gerekçedir
      . 60. Özgürlük: Sanat, izleyicinin düşüncelerini değiştirmek veya toplumsal normlara sosyal bir mesaj vermek gibi dışsal bir yükümlülük taşımaz
      . Gündelik hayatta kabul görmeyen karanlık ya da tuhaf taraflarımızı cesurca ifade ettiğimizde; sanat hem sanatçıyı özgürleştirir hem de en güçlü, sağaltıcı etkisini doğal yollarla yaratır
      . 61. Mustaripler: Filmlerde yüceltilen "kendine zarar veren, aç, ıstırap çeken dahi sanatçı" klişesi yaratıcılığı zedeleyen kurgusal bir mitten ibarettir
      . Aşırı hassasiyetiyle boğuşan sanatçılar için üretim süreci onlara zarar vermek bir yana, içlerindeki o yoğun ve karanlık duyguları iyileştiren son derece güvenilir bir sığınaktır
      . 62. Sizin İçin İşe Yarayan Şey (İnanmak): Efsanevi sanatçıların ilham gelmesi için denediği tuhaf yöntemler (örneğin şapka koleksiyonuna bakmak) mantıklı olmasalar da, sürece "inanmalarını" sağladığı için mükemmel çalışırlar
      . Başkalarının tavsiyelerini katı kurallar olarak kopyalamak yerine, sanatçı sadece kendi özgün doğasını ateşleyen, istikrarlı ritüeli keşfetmeli ve inanarak benimsemelidir
      . 63. Adaptasyon: Sanatta ustalaşmak için sürekli çabalamak tek başına yeterli değildir; zihne ve bedene öğrenilen pratiği sindirmesi için "dinlenme evresi" (ara vermek) de aynı oranda şarttır
      . Bu durma ve içselleştirme döngüsü, evrenin ilettiği yeni enerjilere açık olmamızı sağlayarak bizi yepyeni kavrayış düzeylerine evrimleştirir
      . 64. Çeviri: Becerilerimizi sürekli alıştırma ile geliştirmek, evrenden (Kaynak'tan) aldığımız o cılız frekansları kendi sanat dilimizle çok daha yetkin ve akıcı şekilde ifade etmemizi (çevirmemizi) sağlar
      . Hünerimizi geliştirmek bir başyapıtın tek garantisi olmasa da; karmaşık olanı olabildiğince basit, zarif ve özgün bir biçimde aktarma kapasitemizi daima yukarı taşır
      . 65. Temiz Bir Sayfa Açmak: Eserle çok uzun süre haşır neşir olduğumuzda oluşan "körleşme" yanılgısını kırmak için, belli dönemlerde tamamen uzaklaşıp farklı uğraşlara yönelmek hayatidir
      . Değişiklikleri egomuzu tatmin eden listelere bağlı kalarak değil, eserle ilk kez karşılaşan yabancı birinin taze, nötr ve berrak kulağıyla (gözüyle) değerlendirmeliyiz
      . 66. Bağlam: Bir eşyanın veya eserin içinde yer aldığı ortam, dönem veya ışıklandırma (bağlam); onun uyandırdığı duygu ve manayı kökünden, bambaşka bir noktaya sürükleyebilir
      . Beklentinizi karşılamayan bir öğeyi silmek yerine farklı bir arka planla, gürültüyü sessizlikle (zıtlıklarla) çerçeveleyerek beklenmedik ve sarsıcı etkiler elde edebilirsiniz
      . 67. Enerji (Eserdeki): Projenin başından sonuna bizi yemek yemeyi unutturacak bir şevkle esere bağlayan şey kendi disiplinimizden ziyade; eserin kendi bünyesindeki kinetik enerjidir (coşkudur)
      . Heyecanın ve parıltının tamamen söndüğü durumlarda, o tükenmiş eserle inatlaşmak yerine süreci durdurup bize enerji verecek yeni bir tohumun peşine düşmeliyiz
      . 68. Yeni Bir Başlangıç Yapmak İçin Elimizdekini Tamamlamak (Yenileme): Doğadaki doğum-ölüm-yenilenme döngüsü gibi, sanatta da bir projeye saplanıp kalmayıp onu serbest bırakmak (tamamlamak) yeni maceralar için yer açar
      . Eserimizi dünyayla paylaşmak ve eleştiriye açmak; ruhumuzu yenileyen, bir sonraki bölümü daha taze ve korkusuz yazmamızı sağlayan yegane ilerleme motorudur
      . 69. Oyun: Yaratıcı eylem ne kadar derin bir adanmışlık istese de özünde sınırların, doğruların ya da üretkenlik kaygısının olmadığı, çocuksu bir "oyun" alanıdır
      . Sürecin can sıktığı anlarda yetişkin ciddiyetini ve kusursuz planları bir kenara atıp kuralsız gelişigüzelliği kucaklamak, zahmetsiz başyapıtların aniden ortaya çıkmasını sağlar
      . 70. Sanat Alışkanlığı (Sangha): Sanatı hayatta kalma baskısıyla "iş"e dönüştürmektense, onu zihni boşaltan sıradan bir meslekle destekleyip özgür bir "hobi" olarak sürdürmek çoğu zaman çok daha verimlidir
      . Bize ilham veren, vizyonumuzu anlayan "kafa dengi" insanlarla aynı toplulukta (Sangha) yer almak; gelişimi ateşleyen, sanatsal yalnızlığı bitiren harika bir yakıttır
      . 71. Benlik Prizması: Kim olduğumuz tek, sabit ve tutarlı bir doğrudan ibaret değildir; duygularımız, tepkilerimiz tıpkı bir prizmadan geçen ışık gibi her an farklı renklerde ve yüzlerde kırılır
      . Eserimizin bizi tek bir açıyla "tam" yansıtması baskısını bir kenara bırakıp, bu eşsiz, bükülen farklı renklerimizi ve çelişkilerimizi olduğu gibi özgürce kucaklamalıyız
      . 72. Bırakın, Olduğu Gibi Kalsın: Tıptaki "önce zarar verme" ilkesi sanatta da geçerlidir; bazen kabataslak bir eskizin taşıdığı büyü o kadar özeldir ki hiçbir ince ayara ihtiyaç duymaz
      . Sırf alışkanlık yüzünden "daha profesyonel" olsun diye mükemmelleştirmeye çalışmak eserin ruhunu öldürebilir; yapılabilecek en büyük katkı bazen hiçbir şey yapmamaktır
      . 73. İşbirliği: Başkalarıyla ortaklaşa eser üretirken egomuzu ve rekabet güdümüzü bir kenara bırakıp; tıpkı bir caz grubunun doğaçlama yaparken yakaladığı uyum gibi farklı bakış açılarını (prizmaları) birleştirmeliyiz
      . Doğru bir işbirliğinde amaç, fedakarlık yapıp kendi fikrinden vazgeçmek (A veya B) değil; her iki tarafın da içine sinen, beklenmedik "C seçeneğini" keşfedene dek çatışmaktan korkmamaktır
      . 74. İçtenlik İkilemi: Bir sanatçının aşırı derecede "içten ve otantik" olma çabası; paradoksal olarak genellikle sahte, yorucu ve anlamdan yoksun eserler doğurur
      . İçtenlik doğrudan hedef alınacak bir şey değil; analitik aklı susturup şiirsel ve sezgisel yaratıcılık sürecine izin verdiğimizde kendiliğinden oluşan doğal bir yan üründür
      . 75. İçimizdeki Bekçi: İçimizdeki "editör", yaratım sürecinde ortaya saçılmış dağınık parçaları toplayıp; bütünlüğü, dengeyi ve eserin nihai kimliğini inşa eden, egodan arınmış, profesyonel taraftır
      . Acımasızca, tavizsiz bir düzenleme yaparak eserin özüne zarar vermeden gereksiz her şeyi törpülemek, ulaşabileceğimiz o en sade ve vurucu ustalığın sırrıdır
      . 76. Neden Sanat Yaparız?: Bir şeyler yaratmak için mantıklı, faydacı ve devasa bir hedef aramak gereksizdir; sanat, nesiller boyu "Ben de buradaydım!" demek için süregelen ilkel bir içgüdünün feryadıdır
      . Farklı zamanların ve algıların kendi prizmalarında yoğrularak paylaşıldığı sanat; insanlığı ayrılık yanılgısından kurtarıp evrensel bağlarla (biz biriz duygusuyla) birbirine bağlayan tek ortak dildir
      . 77. Uyum: Evren (doğanın kendi matematiği) devasa bir dengeye, kusursuz bir ahenge sahiptir; ve muazzam sanat eserleri de doğrudan bu kozmik orantılara paralel gizli bir titreşim yayar
      . Sanatta ahenk yaratmak her zaman kulağa ya da göze "hoş" gelen şeyler yapmak demek değildir; izleyicide merakı ve bağ kurma isteğini perçinleyecek o doğru dengesizlik ve gerilimler de bu büyük uyumun önemli parçasıdır
      . 78. Kendimize Anlattıklarımız: Kim olduğumuza veya sanatımızın ne ifade etmesi gerektiğine dair kurguladığımız o etiketler (kavramsallaştırmalar), gerçeği bulandıran sis perdesinden ve asılsız hikayelerden ibarettir
      . Gerçek sanatçı, eserleri kategorize eden hikayeleri boş vererek, evrenin (Kaynak'ın) o gizemli ve hesapsız yaratıcı akışına, kendi eşsiz benlik prizmasını katarak körü körüne teslim olandır
      .
  - baslik: Parça 1 · Yaratıcılığın Temelleri ve Sanatçının Zihniyeti (Bölüm 1-15)
    icerik: |-
      1. Herkes Yaratıcıdır
      Söz konusu yaratıcılık olduğunda, çoğumuzun aklına hemen fırçasını tuvale süren bir ressam, piyanosunun başında ilham perilerini bekleyen bir besteci veya daktilosunun başında sabahlayan bir yazar gelir. Genelgeçer anlamda sanatla uğraşmayan, yani somut bir eser üretmeyen insanlar kendilerini "sanatçı" olarak adlandırmaktan çekinirler. Yaratıcılığın, sadece doğuştan yetenekli, şanslı ve seçilmiş azınlığa bahşedilmiş istisnai bir yetenek olduğunu düşünme eğilimindeyizdir. Sanki yaratıcılık, bizim kendi sıradan yeteneklerimizi aşan, ulaşılması zor, mistik bir görevmiş gibi gelir.
      Ancak Rick Rubin'in bu bölümde çok net bir iddiası var: Neyse ki işin aslı hiç de öyle değil. Yaratıcılık, ender rastlanan, ulaşılması zor bir beceri veya ayrıcalık değildir; tam aksine, insan olmanın ayrılmaz bir parçasıdır. Her birimizin doğuştan gelen, en temel hakkıdır ve istisnasız hepimize mahsustur.
      Peki, yaratıcılık sadece somut sanat eserleri üretmek değilse nedir? Yaratmak, en basit tanımıyla, önceden var olmayan bir şeyi var etmektir ve bu hepimizin her gün, her an istemsizce gerçekleştirdiği kesintisiz bir eylemdir. Örneğin, bir arkadaşınızla ettiğiniz derin bir sohbet yaratıcı bir eylemdir; çünkü o an orada, daha önce hiç edilmemiş cümleleri yan yana getirerek yeni bir anlam dünyası kurarsınız. Günlük hayatta karşılaştığınız bir probleme bulduğunuz anlık bir çözüm, sevdiklerinize gönderdiğiniz, onları güldürecek zekice ve komik bir mesaj, hatta akşam işten eve dönerken sıkışık trafiği atlatmak için zihninizde çizdiğiniz o yepyeni rota bile birer yaratım sürecidir. Ortaya çıkardığınız şeyin "sanat yapıtı" sayılması için bir galeride sergilenmesi, kaydedilmesi, bir vitrine konması veya satılması gerekmez.
      Aslında, sadece hayatta olduğumuz için bile hepimiz son derece mahir yaratıcılarız. Neden mi? Çünkü algıladığımız dış dünya, aslında bizim onu algıladığımız haliyle, öylece dışarıda var olmaz. Her birimiz, duyularımızla bilgi parçacıklarının sürekli uçuştuğu, biçimlenmemiş bir madde alanının (dünyanın) içinde yaşarız. Gözlerimiz, kulaklarımız, burnumuz ve tenimiz bu verileri alır ve beynimizdeki bir dizi karmaşık elektriksel ve kimyasal tepkime aracılığıyla içsel bir gerçeklik oluşturur. Yani dışarıdaki o devasa ormanları, uçsuz bucaksız okyanusları, havanın kavurucu sıcağını ya da dondurucu soğuğunu aslında kendi zihnimizde "biz" yaratırız. Gördüğümüz sözcükleri okur, sesleri duyar, onlara bir anlam yükler ve göz açıp kapayıncaya kadar bir tepki veririz. Tüm bunlar, kendi zihnimizde sıfırdan yarattığımız bir dünyanın içinde gerçekleşir.
      Dolayısıyla, profesyonel anlamda sanat yapıp yapmadığınıza bakmaksızın, dünyadaki verileri algılayan, kendi iç süzgecinden geçiren, bu bilgileri toplayan ve hem kendisi hem de başkaları için benzersiz bir deneyim inşa eden birer sanatçı olarak yaşıyorsunuz. Hayatta olmak demek, bu süregiden devasa yaratma sürecinin aktif bir katılımcısı olmak demektir.
      İşte tam da bu yüzden Rubin, "sanatçı gibi yaşamak" kavramını sadece bir hobi veya meslek olarak değil; dünyada bir varoluş biçimi, bir algılayış biçimi ve dünyaya farklı bir dikkat verme şekli olarak tanımlar. Sanatçı gibi yaşamak, etrafımızdaki üstü örtülü işaretleri yakalamak için algılama hassasiyetimizi geliştirmeyi gerektirir. Neyin bizi kendine doğru çektiğini, neyin bizi ittiğini keşfetmek; içimizde uyanan o ince duygu tonlarını ve bizi nereye yönlendirdiklerini yargılamadan fark edebilmektir. Siz sadece üretmek için burada değilsiniz, siz aslında bizzat kendi yarattığınız, yaratıcı bir evrenin içinde, eşsiz yaratıcı bir varlık ve "benzersiz bir sanat yapıtı" olarak yaşamaktasınız.
      Bu bölümün özü: Yaratıcılık sadece seçilmiş bir azınlığa ait bir yetenek değil, her insanın duyularıyla dünyayı algılayıp kendi gerçekliğini inşa ederken kullandığı doğal ve evrensel bir varoluş biçimidir. Sanatçı olmak, somut eserler üretmekten ziyade, dünyaya açık bir algıyla, derin bir dikkat ve farkındalıkla yaklaşarak yaşamaktır.
      2. Uyumlanmak
      Bu bölümde yazar bizi evrenin işleyişine, doğanın ritmine ve insanın bu devasa sistemdeki yerine dair oldukça geniş, kozmik bir bakış açısına davet ediyor.
      İşe evreni düşünerek başlayalım. Evren, durağan bir boşluk değil, içindeki her şeyin sürekli dönüşüp geliştiği, hiç durmayan, kesintisiz bir "yaratım süreci"dir. Doğaya baktığınızda bu muazzam enerjiyi her yerde görebilirsiniz: Ağaçlar zamanı geldiğinde çiçek açar, hücresel yapılar sessizce çoğalır ve bölünür, devasa nehirler akarken kendiliğinden yeni kollara ayrılır. İçinde yaşadığımız bu gezegen, baştan aşağı yaratıcı bir enerjiyle titreşmektedir ve var olan her şey, istisnasız bu enerjinin güdümü altındadır.
      Doğadaki bu kesintisiz dönüşüm ve gelişim sürecinin her bir yansıması, aslında evrenin onlara biçtiği yaratıcı dürtülere sadık kalarak, daha büyük bir sistem adına üzerlerine düşen görevi kendi meşreplerince yerine getirmelerinden ibarettir. İşte tam bu noktada Rubin çarpıcı bir paralellik kurar: Tıpkı bir ağacın doğal olarak çiçek ve meyve vermesi gibi, insanlık da doğası gereği sanat eserleri yaratır. Golden Gate Köprüsü'nü, The Beatles'ın unutulmaz "White Album"ünü, Picasso'nun "Guernica"sını, asırlık Ayasofya'yı, gizemli Sfenks'i, uzay mekiğini, Almanya'nın o kusursuz otoyol ağını (Autobahn) ya da çok daha basit görünen Philadelphia usulü peynirli biftekli bir sandviçi düşünün. Bunların hepsi insanlığın yaratıcı dürtülerinin bir sonucudur.
      Çevrenize dikkatlice baktığınızda, insan elinden çıkmış pek çok harikulade, takdir edilesi yapıt göreceksiniz. Bu muazzam eserlerin her biri; tıpkı bir sinekkuşunun yuva yapması, bir şeftali ağacının meyve vermesi veya karanlık bir nimbus bulutunun yağmur üretmesi gibi, insanın kendi içsel varoluşuna, kendi doğasına sadık kalışının somut yansımalarıdır. Elbette her yuva, her şeftali, her yağmur damlası ve her insan yapımı eser birbirinden farklıdır. Bazı ağaçların daha lezzetli meyveler vermesi veya bazı insanların diğerlerinden daha görkemli eserler ortaya koyuyormuş gibi görünmesi doğaldır, zira lezzet ve güzellik algısı her zaman kişiden kişiye değişir. Ancak özündeki eylem (yaratım eylemi) tamamen aynı doğal kaynaktan beslenir.
      Peki, karanlık bir bulut ne zaman yağmur yağdıracağını nereden bilir? Bir ağaç ilkbaharın geldiğini, bir kuş ise yeni bir yuva yapma zamanının çattığını nasıl anlar? Çünkü evren tıkır tıkır işleyen devasa bir saat gibidir. Yazar burada kutsal metinlerden (Vaiz kitabı - Ecclesiastes) çok bilindik bir şiire atıfta bulunur: "Her şeyin mevsimi, göklerin altındaki her olayın zamanı vardır. Doğmanın zamanı var, ölmenin zamanı var. Dikmenin zamanı var, sökmenin zamanı var. Öldürmenin zamanı var, şifa vermenin zamanı var. Gülmenin zamanı var, ağlamanın zamanı var. Yapmanın zamanı var, yıkmanın zamanı var. Oynamanın zamanı var, yas tutmanın zamanı var. Taş atmanın zamanı var, taş toplamanın zamanı var..."
      Bu muazzam düzen bizim tarafımızdan belirlenmemiştir. Bizim yönetmediğimiz, tam aksine bizi yöneten, çok daha büyük çaplı, yaratıcı bir "kozmik takvim" devrededir. Bu takvimin varlığını gündelik hayatta şöyle fark edebilirsiniz: Bazen sizi inanılmaz heyecanlandıran parlak bir fikriniz olur, ancak onu bir türlü hayata geçirmezsiniz. Bir süre sonra aynı fikrin bir başka yazar, ressam ya da girişimci tarafından (başka bir fail aracılığıyla) gerçeğe dönüştürüldüğünü görürsünüz. Rubin'e göre bunun nedeni o kişinin fikrinizi çalmış olması değildir; bunun nedeni o fikrin dünyada var olma "zamanının gelmiş olmasıdır". Evrenin bu büyük çaplı yaratıcı sürecinde; fikirler, düşünceler, melodiler, şarkılar ve diğer sanat yapıtları zaten etrafımızı saran eterde (esirde) potansiyel olarak var olurlar. Sadece tam zamanında olgunlaştıklarında, bir insan aracılığıyla fiziksel dünyada ifade bulurlar.
      İşte bu noktada sanatçıların asıl görevi devreye girer: Sanatçılar olarak bizim işimiz, bu bilgiyi evrenden kendimize çekmek, kendi içimizde dönüştürmek ve dünyayla paylaşmaktır. Çünkü hepimiz, aslında evrenin sürekli olarak yayınladığı mesajların tercümanları, yani birer anteniz. Tarihteki en iyi sanatçılar genellikle, belirli bir anda evrende titreşen enerjiyi en iyi çekebilen, en hassas "antenlere" sahip olanlar arasından çıkar. İşin ilginç yanı, pek çok büyük sanatçı bu olağanüstü hassas antenlerini en başta harika sanat eserleri yaratmak için değil, tamamen "kendilerini korumak" için geliştirmiştir. Çünkü bu denli duyarlı insanlar için dünyadaki her şey daha yoğun bir acı verir; her şeyi sıradan insanlardan çok daha derinden duyumsarlar ve hayatta kalmak için bu radarlarını açık tutmak zorundadırlar.
      Sanatsal ve kültürel yaratımların tarih boyunca genellikle büyük "akımlar" halinde ortaya çıkması da tesadüf değildir. Bauhaus mimarisi, soyut dışavurumculuk, Fransız Yeni Dalga sineması, Beat kuşağı şiiri veya punk rock gibi akımlar adeta devasa bir okyanus dalgası gibi yükselip dünyayı sararlar. Bazı sanatçılar mevcut kültürel rüzgarı iyi analiz eder ve o kabaran dalgaya kendi istekleriyle binerler, bazılarıysa o dalganın ta kendisi olurlar. Elbette bazıları da akıntıya karşı yüzmeyi seçerek kendi alternatif yollarını açarlar.
      Sonuç itibarıyla hepimiz evrendeki yaratıcı düşünceyi çeken birer anteniz. Bazı iletimler bize çok güçlü gelir, bazıları ise çok cılız ve zayıftır. Eğer bir anten olarak kendinizi hassas bir biçimde ayarlamazsanız, evrenden gelen verilerin hayatın gündelik gürültüsü arasında kaybolup gitme olasılığı çok yüksektir. Çünkü bu gelen sinyaller, beş duyumuzla (görme, işitme, koklama vb.) algıladığımız sıradan fiziksel dünyadan çok daha yüksek frekanslarda iletilen, güç algılanabilir seviyedeki enerjilerdir. Bir elektronun aynı anda iki farklı konumda bulunabilmesi gibi, bu enerji de insan mantığına meydan okur. Çok değerlidir, ancak çok az insan bu yakalanması zor enerjiyi içinde tutabilecek kadar açık ve alıcı konumdadır.
      Peki, mantıkla açıklanamayan, kulakla duyulamayan ve tanımlanamayan bu gizemli sinyali nasıl yakalarız? Rubin'in cevabı nettir: Onu zorla arayıp bulmaya çalışmayız. Ona giden kestirme bir yol bulmaya ya da mantıkla çözümlemeye de çalışmayız. Bunun yerine yapmamız gereken tek şey, o sinyali "kabul eden" bir açıklık, bir boşluk yaratmaktır. Zihnimizin o tıka basa dolu, endişelerle ve planlarla meşgul olağan halinden sıyrılmayı başardığımızda, içimizde hiçbir şeyin olmadığı tertemiz bir boşluk oluşur. İşte evrenin kullanıma sunduğu fikirleri bir mıknatıs gibi kendine çeken şey bu boşluktur.
      Böyle bir açıklığa ve özgürlüğe ulaşmak aslında sanıldığı kadar zor değildir; zira hepimiz hayata bu açıklıkla başlarız. Çocukluk dönemimizi düşünün... Bir çocukken, dışarıdan gelen fikirleri alma ve benimseme sürecimizde araya karışan parazitler ve şüpheler çok daha azdır. Yeni bir bilgiyle karşılaştığımızda, onu hemen zihnimizdeki eski inançlarla kıyaslamak, yargılamak ve eleştirmek yerine büyük bir heyecanla kucaklarız. O bilginin ileride ne gibi mantıksal sonuçlar doğuracağı hakkında endişelenmek yerine sadece o anın tadını çıkarır, anı yaşarız. Her şeyi önceden ölçüp biçmek yerine içimizden geldiği gibi, hiçbir sansür uygulamadan davranırız. Bizim için en sıradan deneyimler, mesela uçan bir böcek veya bir su birikintisi bile büyük bir hayretle karşılanır. Derin bir hüzün ağlamasıyla yoğun bir coşku kahkahası birbirini saniyeler içinde takip edebilir; çünkü çocukların dünyasında rol yapmak ya da belirli bir hikayeye (egoya) katı bir şekilde bağlanmak yoktur.
      Hayatları boyunca durmadan, üretken bir şekilde büyük eserler yaratmayı becerebilen gerçek sanatçılar, genellikle büyüdüklerinde bile bu çocuksu niteliklerini, o saf hayret duygusunu korumayı başaranlardır. Dünyayı, hayatta kalma endişesiyle kirlenmemiş, bozulmamış ve saf gözlerle görmenizi sağlayan bir var olma biçimi geliştirdiğinizde, evrenin o kusursuz kozmik takvimiyle uyum içinde hareket etme özgürlüğüne kavuşursunuz.
      Bu bölümün özü: Evren, durmaksızın üreten devasa bir yaratım motorudur ve insanın sanat eserleri üretmesi, doğanın meyve vermesi kadar doğal bir uyumlanma sürecidir. Sanatçı, evrende zaten var olan fikirlerin zamanı geldiğinde fiziksel dünyaya aktarılmasını sağlayan hassas bir "anten" gibi davranarak, mantığı bir kenara bırakıp çocuksu bir açıklıkla bu kozmik iletimlere kendini açmalıdır.
      3. Yaratıcılığın Kaynağı (Kaynak)
      Yeni bir sanat eseri, bir proje, bir şiir veya bir buluş üzerinde çalışırken ihtiyacımız olan malzemenin nereden geldiğini hiç düşündünüz mü? Rubin bu bölümü çok kapsamlı bir liste ile açıyor: Her şeyle başlarız: görülen her şey, yapılan her şey, düşünülen her şey, hissedilen her şey, hayal edilen her şey, unutulan her şey ve içimizde henüz söylenmemiş ve düşünülmemiş olan her şeyle.
      Yaratım sürecinde kullandığımız kaynak malzememiz işte tam olarak budur. Karşılaştığımız her insan, okuduğumuz her kitap, hissettiğimiz her rüzgar ve yuttuğumuz her gözyaşı yaratıcı anlarımızı inşa ettiğimiz devasa bir tuğla yığınıdır. Ancak burada kritik ve zihin açıcı bir ayrım var: Birçok insan ilhamın ve yaratıcılığın sırf kendi zihinlerinin içinde, kişisel dâhiliklerinde saklı olduğuna inanır. Oysa Rubin'e göre bu malzemenin asıl muhtevası kesinlikle içimizde bulunmaz. Kaynak (kitaptaki büyük harfli kullanımıyla 'Kaynak') tamamen dışarıdadır. Bu, bizi çepeçevre saran, tükenmez bir ikram gibi her dem hazır bulunan, engin ve evrensel bir bilgeliktir.
      Bu dışsal Kaynak'tan bilgiyi nasıl alırız? Sadece bilinçli yaşadığımız olaylar ve mantıklı deneyimlerimiz aracılığıyla değil elbette. Gece gördüğümüz kafa karıştırıcı rüyalar, içimize doğan sebepsiz sezgiler, bilinçaltı unsurlar veya dış dünyanın iç dünyamıza sızmasını sağlayan, bilimsel olarak gizemini hala koruyan başka görünmez yollar aracılığıyla bu Kaynak'tan besleniriz.
      Yaratıcı bir fırtına koptuğunda, zihnimize dolan bu muazzam malzemenin içeriden, bizim kendi zekamızdan geliyormuş gibi görünmesi çok doğaldır. Fakat yazar bunun sadece bir yanılsama olduğunu belirtir. İçimizde olan şey, sadece Kaynak'ın enginliğinden kopardığımız küçük kırıntılardır. Bu değerli kırıntılar, bilinçdışımızın derinliklerinden tıpkı sıcak bir buhar gibi yukarıya doğru yükselir ve zihnimizde yoğunlaşarak bir "düşünce" veya parlak bir "fikir" oluşturur.
      Bu kavramı gözümüzde canlandırmak için Rubin harika bir analoji kullanır: Kaynak'ı gökyüzündeki bir "bulut" olarak düşünmek çok faydalı olacaktır. Bulutlar doğada asla tamamen yok olmazlar, sadece biçim değiştirirler. Kara bir bulut yağmura dönüşür ve toprağa düşer, ardından akarak okyanusun bir parçası olur, sonra güneşin ısısıyla yeniden buharlaşır ve gökyüzünde tekrar bir bulut formunu alır.
      Aynı muazzam döngü sanat için de geçerlidir. Sanat dediğimiz şey, aslında son derece yoğun enerjili fikirlerin yüzyıllar boyunca süren dolaşımıdır. Bu fikirler tıpkı bulutlar gibi yok olmazlar. Onların bize her seferinde "yepyeni" ve "orijinal"miş gibi görünmesini sağlayan tek şey, her geri geldiklerinde insanlık süzgecinden geçerken daha farklı bir şekilde birleşmeleri, farklı bir sanatçının ruhunda farklı bir şekilde şekil almalarıdır. Nasıl ki gökyüzünde birbirinin tamamen aynısı olan iki bulut bulamazsanız, evrensel Kaynak'tan beslenen iki sanat eseri de birbirinin aynısı olamaz.
      Bir galeriye gidip yeni bir sanat eseriyle karşılaştığınızda, ya da yeni çıkan bir şarkıyı dinlediğinizde aniden derinden etkilendiğinizi, tüylerinizin diken diken olduğunu düşünün. İçimizde bu denli güçlü bir yankı hissetmemizin sebebi tam olarak budur: O eser, aslında hepimizin ortak olarak beslendiği evrensel Kaynak'tan gelmektedir. Belki de bu derin etkilenme, bizim zaten aşina olduğumuz, evrensel olarak bildiğimiz bir duygunun ya da fikrin, tamamen tanıdık olmayan yepyeni bir biçimde karşımıza çıkmasındandır. Ya da belki de o eser, hayatımız boyunca farkında bile olmadan aradığımız, içimizdeki o sonu olmayan yapbozun gizli, eksik bir parçasını yerine oturtmuştur.
      Bu engin Kaynak'tan bir fikri alıp fiziksel gerçeğe dönüştürmek, bazen onu gözümüzde ufaltabilir. Çünkü hayal gücümüzün ve Kaynak'ın bulunduğu o görünmeyen alemin hiçbir sınırı yoktur. Ancak fiziksel dünya (bir tuvalin boyutu, bir şarkının süresi, kelimelerin anlam kısıtlamaları) sınırlıdır. Olağanüstü olan bir fikir, gerçeğe döküldüğünde fiziksel dünyanın kurallarına tabi olarak olağanlaşır. Gerçek bir sanat eseri, işte bu iki dünya arasında (sınırsız hayal gücü ve sınırlı fiziksel gerçeklik) aynı anda var olabilen bir köprüdür.
      Bu bölümün özü: Yaratıcılığın asıl malzemesi kendi zihnimizin içinde değil, bizi çevreleyen sonsuz, evrensel bir Kaynak'tadır; fikirler tıpkı bulutlar gibi form değiştirerek sürekli dolaşımda kalır ve sanatçı, bu kolektif enerjiyi kendi aracılığıyla fiziksel dünyada yeniden biçimlendiren bir aracıdır.
      5. Farkındalık
      Gündelik hayatımızı yaşarken genellikle kontrolün bizde olduğunu hissederiz. Sabah kalkar, o gün yapacaklarımızın gündemini belirler, işlerimizi bitirmek veya belirlediğimiz hedeflere ulaşmak için zihinsel bir strateji geliştiririz. Kısacası günün "akışını" kendi irademizle biz oluştururuz. Fakat yaratıcılığın temel taşı olan "Farkındalık", bu gündelik kontrol halinden tamamen farklı bir şekilde çalışır. Farkındalık durumundayken akışı biz oluşturmayız; akış zaten çevremizde kendiliğinden gerçekleşir. Dış dünya aktif bir özne gibi hareket ederken, biz sadece pasif ama son derece alıcı bir "gözlemci" konumundayızdır. İçerik (olan biten) üzerinde neredeyse hiçbir kontrolümüz yoktur ve olmamalıdır da.
      Farkındalık becerisi, şimdiki anda (sadece geçmişte ya da gelecekte değil), çevremizde ve bizzat kendi iç dünyamızda neler olup bittiğini saf bir şekilde fark etme olanağı sağlar. Buradaki en kritik nokta, bu fark etme eylemini bağlılık göstermeden, yargılamadan ve sürece hiçbir şekilde müdahil olmadan yapabilmektir. Rüzgarın teninize değdiğinde yarattığı o bedensel duyumları, zihninizden gelip geçici bulutlar gibi akan düşünceleri ve duyguları, uzaktaki kornaları, kuş seslerini veya görsel ipuçlarını, mutfaktan gelen kahve kokusunu ya da ağzınızdaki bir lokmanın bıraktığı tadı fark edebilme becerisidir.
      Farkındalığın doğasını anlamak için yazarın verdiği doğa analojisi çok aydınlatıcıdır: Bir çiçeğin açışını düşünün. Siz müdahale etseniz de etmeseniz de o çiçek kendi zamanı geldiğinde zaten açacaktır. Farkındalık, çiçeğin taçyapraklarını kendi ellerinizle zorla açmaya çalışmak değildir. Siz sadece sessizce kenarda durur ve çiçeğin hiçbir müdahaleniz olmadan kendini size daha fazla gözler önüne sermesine, o mucizevi büyüme anına tanıklık edersiniz. Bu kural, hayatımızdaki her şey için geçerlidir.
      Farkındalık, dişinizi sıkarak, kendinizi zorlayarak ya da kaşlarınızı çatarak erişebileceğiniz stresli bir durum değildir. Aslında çok az aktif çaba gerektirir, ancak sarsılmaz bir kararlılık ve uyanıklık şarttır. Farkındalık, gerçekleşmesine sizin kendi rızanızla "izin verdiğiniz", kapılarınızı sonuna kadar açtığınız bir durumdur. Sonsuz olan "şimdi"de olup bitenlerle birlikte, onları değiştirmeye çalışmadan var olmak ve olanı olduğu gibi kabul etmektir.
      Burada zihnin çalışma mekanizması hakkında çok önemli bir ayrım vardır: Kaynak'ın veya etrafınızdaki herhangi bir şeyin bir yönünü tanımladığınız, etiketlediğiniz veya mantıkla analiz etmeye başladığınız anda, artık onu "fark etmeyi" bırakmış, "irdelemeye" başlamışsınızdır. İster bir sorunu çözmeye çalışın, ister "şu an farkındayım" diye düşünerek zihninize bir madalya takın; bu tür analitik düşüncelerin hepsi, sizi farkındalığınızın nesnesiyle birlikte, saf bir var olma halinden çekip koparır. Çünkü analiz etmek ve çözümleme yapmak her zaman ikincil bir faaliyettir.
      Gerçek farkındalık, dikkatinizi verdiğiniz nesne (ya da an) ile kurduğunuz, kelimelere dökülmeyen "saf bir bağ" olarak gerçekleşir. Örneğin, ormanda yürürken çok ilginç ya da güzel bir yaprak bulursanız, zihniniz hemen "Bu meşe yaprağı, klorofili azalmış" dememelidir. Önce sadece o yaprağın varlığıyla, rengiyle, dokusuyla bir bütün olur, o saf estetik deneyimi yaşarsınız. Ancak bu birleşme anı bittikten sonra onu mantığınızla anlamaya ve sınıflandırmaya çalışabilirsiniz.
      Elbette dünyada fark ettiğimiz şeyin (örneğin yağan yağmurun) ne olduğunu değiştiremeyiz. Ancak bu nesneleri veya anları "fark etme kabiliyetimizi" tıpkı bir kası çalıştırır gibi geliştirebiliriz. Tıpkı bir kamera lensi gibi, farkındalığımızın kapsamını inanılmaz boyutlarda genişletebilir (tüm ormanı hissetmek) veya mikroskobik düzeyde daraltabiliriz (tek bir yapraktaki damara odaklanmak). Farkındalığı gözlerimiz açıkken dünyayı izleyerek ya da gözlerimiz kapalıyken içimizi dinleyerek tecrübe edebiliriz. Dış dünyayı daha fazla ve net algılayabilmek için içimizdeki o bitmek bilmeyen gevezeliği susturabilir; ya da tam tersine, iç dünyamızda koptuğunu hissettiğimiz fırtınaları daha net görebilmek için dışarıdan gelen gürültüleri sessizleştirebiliriz.
      Herhangi bir şeye, onun göründüğü şey olmasını sağlayan özelliklerini (adını, sanını) ona kaybettirecek kadar yakından mikroskobik bir bakışla bakabiliriz. Ya da ona, tamamen yeni, uzaydan inmiş bir şey gibi görünmesini sağlayacak kadar mesafeli ve uzaktan bakabiliriz. İçinde yaşadığımız evren, aslında sadece bizim onu algılayabildiğimiz, dikkatimizi verebildiğimiz kadar geniştir. Dolayısıyla biz kendi farkındalığımızı ve dikkatimizi geliştirdiğimizde, aslında içinde yaşadığımız evrenin sınırlarını da fiziksel olarak genişletmiş oluruz. Sadece sanat eserlerimiz için kullanabileceğimiz yaratıcı malzemelerin miktarını artırmakla kalmaz, aynı zamanda insan olarak yaşamımızın da ufkunu genişletiriz.
      Bu bölümün özü: Farkındalık, şimdiki anı ve çevremizi yargılamadan, analiz etmeden ve müdahale etmeden saf bir gözlemci olarak deneyimleyebilme becerisidir; sıradan olanın ötesine bakabilmeyi sağlayan bu derin algılayış şekli, evrenin sınırlarını genişleterek yaratıcılığın en temel yapıtaşını oluşturur.
      5. Hazne ve Süzgeç (Hazne ve Süzgeç)
      Yaratıcılığın mekanizmasını anlamak için Rick Rubin, iç dünyamızın nasıl işlediğine dair çok güçlü bir metafor sunuyor: Hazne ve Süzgeç. Her birimizin içinde, tıpkı devasa bir kova veya saklama alanı gibi bir "hazne" bulunur. Biz yaşadıkça bu alan durmaksızın, saniye saniye yepyeni verilerle doldurulmaktadır. Bu hazne, doğduğumuz andan itibaren sahip olduğumuz tüm düşüncelerin, bilinçli veya bilinçsiz duygularımızın, kurduğumuz hayallerin ve fiziksel dünyadaki tüm deneyimlerimizin (acıların, sevinçlerin, gördüğümüz manzaraların) toplamını barındırır.
      Ancak dışarıdaki o uçsuz bucaksız evrenden (Kaynak'tan) gelen bilgi, bu hazneye tıpkı yağmur sularının ağzı açık bir varile dolması gibi doğrudan, olduğu gibi ve eksiksiz girmez. Aksine, bilgi her bir insan için benzersiz ve tamamen kişisel bir şekilde süzülerek içeri alınır. Dışarıdaki her şey bu "süzgeç"ten geçmeyi başaramaz. Ve içeri geçmeyi başaran bilgiler de hiçbir zaman evrendeki o ilk, doğru, saf ve eksiksiz halinde kalmaz. Neden mi? Çünkü her bir insanın, devasa Kaynak'ı kendi boyutlarına indirebilmek ve idrak edebilmek için kendine has, evrimsel bir yöntemi vardır. İnsan beyninin bellek kapasitesi fiziksel olarak sınırlıdır. Duyularımız (gözümüz, kulağımız) kusursuz değildir ve sıklıkla verileri yanlış algılayıp bizi yanıltır. Zihnimiz çevremizdeki tüm milyonlarca veriyi aynı anda kavrayacak, devasa bir işlem gücüne sahip değildir. Eğer etrafımızdaki tüm uyaranları (rüzgarın sesi, saatin tik takları, tişörtümüzün tenimize dokunuşu, ışığın açısı) hiçbir süzgeç olmadan anında algılasaydık, beynimiz bu akıl almaz miktardaki veri karşısında kısa devre yapar, baş edemezdi. Dünyayı anlamlandıramaz, bir nesneyi diğerinden ayırt edemezdik.
      İşte bu uçsuz bucaksız, kaotik veri denizinde yolumuzu kaybetmemek ve delirmemek için, çok küçük yaşlardan başlayarak beynimizi eğitmeyi öğreniriz: Bizim hayatta kalmamız için önemli görünen tehlikelere veya özel ilgi duyduğumuz, bize fayda sağlayan bilgilere odaklanmayı ve geri kalan tüm gereksiz (!) bilgileri tamamen yok saymayı öğreniriz. Bu süzgeç, pratik hayatta kalmamız için mükemmeldir.
      Fakat sanatçılar olarak, durum değişir. Amacımız sadece tehlikelerden kaçıp "hayatta kalmak" olmadığı için, çocukluğumuzdaki o geniş, delik deşik ve çok daha geçirgen olan saf algımızı yeniden kazanmaya çalışırız. Hayatta kalma güdüsüyle, toplumsal kurallarla ya da pratik bir "fayda sağlama" zorunluluğuyla körelmemiş, daralmamış bir süzgeç isteriz. Dünyaya karşı saf bir hayret, şaşkınlık ve takdir duyan o ilkel halimizi diriltmeyi amaçlarız.
      Çünkü normal şartlarda yetişkin süzgecimiz, Kaynak'tan gelen eşsiz bilgiyi serbestçe ve olduğu gibi içeri geçirmek yerine, onu kendi dar mantığıyla "yorumlar" ve kaçınılmaz olarak o bilginin değerini ve saflığını azaltır. Haznemiz, bu süzgeçten geçen, dış dünyanın "yeniden düzenlenmiş" (yani bizim tarafımızdan çarpıtılmış) parçalarıyla doldukça, yeni gelen bilgiler içeride halihazırda toplanmış olan eski malzemelerle ilişki kurmaya başlar.
      Bu içsel ilişkiler zamanla katılaşarak inançlar, kanılar ve hikayeler doğurur. Bu hikayeler bizim kim olduğumuz, yeteneklerimiz, etrafımızdaki insanların niyetleri ve içinde yaşadığımız dünyanın ne kadar güvenli olup olmadığı (mahiyeti) hakkındadır. Nihayetinde tüm bu uydurduğumuz hikayeler, kemikleşip birleşerek bizim sarsılmaz sandığımız o meşhur "dünya görüşümüzü" oluşturur.
      İşte sanatçılar olarak en büyük görevimiz, kendi uydurduğumuz bu hikayelere ve dünya görüşüne sıkı sıkıya bağlanmamayı öğrenmektir. Düşünce, önyargı ve inanç sistemimizin o dar sınırları içinde kendine kolayca yer bulamayan, rahatsız edici, tuhaf ama muazzam miktardaki yeni bilgi için haznemizde bilerek boş alan (yer) açmak isteriz. Evrenden ne kadar çok "ham" ve filtrelenmemiş veri alabilir ve süzgecimizle onları ne kadar az şekillendirip (çarpıtıp) içeri alırsak, aslında gerçek doğaya, hakikate o kadar yaklaşmış oluruz.
      Yaratıcı eylemi tam olarak şöyle düşünebiliriz: Kendi haznemizin içerdiği bu devasa birikimi, elimizdeki "potansiyel malzeme" olarak koşulsuz kabul etmek, o anda projemiz için faydalı, uyumlu veya önemli görünen unsurları içinden sezgilerimizle seçip çıkarmak ve onları fiziksel bir araçla (boya, kelime, nota) ifade etmektir. Bu ifade eylemi; haznenizdeki birikimin bir metne, şarkıya, filme, binaya, resme, yeni bir yemeğe veya başarılı bir işletme modeline, kısacası hangi projeye giriştiyseniz ona dönüştürülmesidir.
      Sonrasında, ürettiğimiz bu eseri kendimize saklamayıp dünyayla paylaşmayı tercih edersek, ortaya koyduğumuz bu eser o büyük evrensel döngüye yeniden girer. Ve böylece bizim süzgecimizden geçerek şekillenen bu eser, bir başka sanatçı veya insan için "Kaynak malzeme" haline gelerek onun haznesini doldurmaya başlar.
      Unutmayın ki sistem şöyle işler: Kaynak bilgiyi mevcut ve hazır kılar. Süzgecimiz bu bilgiyi süzer ve eksiltir. Haznemiz ise kalanı alır ve depolar. Ve bu süreç, istesek de istemesek de çoğu zaman kontrolümüz tamamen dışında, arka planda gerçekleşir. Ancak bu varsayılan (otomatik) sistemin, farkındalıkla kırılabileceğini veya atlanabileceğini bilmek bir sanatçı için çok faydalıdır. Alıştırmalar ve meditasyon yaparak, Kaynak ile olan etkileşimimizi sağlayan o arayüzü (süzgecimizi) çok daha geçirgen hale getirebilir ve haznemizin yeni şeyleri kabul etme (alma) kapasitesini uç seviyelerde genişletebiliriz. Enstrümanı (örneğin gitarı) değiştirmek, müziğin tınısını değiştirmenin en kolay yolu gibi görünebilir, ancak en etkili ve kalıcı yol, enstrümanı çalanı (süzgeci) değiştirmektir. Yaratmak için hangi fırçayı, kamerayı ya da programı kullanırsanız kullanın, aslında asıl enstrüman sizsiniz. Ve sizin genişlemiş süzgeciniz aracılığıyla, hepimizi çevreleyen o büyük evren nihayet başkaları için de anlaşılır, görünür hale gelir.
      Bu bölümün özü: Evrenden (Kaynak'tan) gelen sonsuz bilgi, kişisel önyargılarımız ve inançlarımızdan oluşan "süzgecimizden" geçerek "haznemizde" birikir; bir sanatçının görevi, dünya görüşünün yarattığı bu kısıtlayıcı filtreleri gevşeterek doğadan gelen ham veriyi en saf haliyle kabul etmek ve asıl enstrümanın "kendisi" olduğunun bilinciyle yaratmaktır.
      6. Görünmeyen
      Günümüzün modern, tüketim odaklı ve oldukça pratik dünyasında, genelgeçer tanımıyla "sanat"ın amacı sanki sadece fiziksel ve dijital ürünler ortaya çıkarmak, kitapçı raflarını çok satan romanlarla, müzik listelerini popüler plaklarla ya da galerileri fiyat etiketli çanak çömlek ve tablolarla doldurmakmış gibi algılanır. Oysa gerçek bambaşkadır.
      Sanatçılar genellikle, üretim anının o ateşli telaşı içinde bunun farkında olmasalar da, ortaya çıkan somut, nihai sanat eseri (ister bir resim ister bir albüm olsun), aslında çok daha büyük ve derin bir arzunun sadece bir "yan ürünüdür". Biz sanatçılar olarak yaratıcılığımızı, sadece piyasaya sürülecek maddi ürünler üretmek ya da onları satıp para kazanmak için kullanmayız. Rubin'e göre yaratıcı eylem, tüm o fiziksel çabaların ardında, aslen son derece esrarengiz, büyülü ve gizemli bir aleme (Görünmeyen'e) giriş yapma teşebbüsüdür. Ruhun, dünyanın sıradanlığından kurtulup "aşkınlığa" (transcendence) ulaşmaya yönelik ilkel ve durdurulamaz arzudur.
      Yarattığımız o fiziksel nesne, aslında kendi sınırlı kavrayışımızın ve kelimelerimizin ötesinde yer alan muazzam bir "içsel manzaradan", tıpkı bir rüyadan uyanırken aklımızda kalan anlık ve flu fotoğrafları (görüntüleri) başkalarıyla paylaşmamıza olanak sağlayan bir araçtır. Bu anlamda sanat, bizi çevreleyen ama gözle görülmeyen, kelimelerle tam olarak tarif edilemeyen o engin "görünmeyen dünyaya" açılan sihirli bir kapıdır.
      Eğer bir sanatçı çalışırken işin bu "tinsel" (ruhsal/spiritüel) bileşenini yadsır ve yok sayarsa, çok önemli ve temel bir dezavantajla karşı karşıya kalır. Tinsel dünya, bilimin ispatlanabilir ve katı sınırlarının çok ötesine geçer ve sanatçıya başka hiçbir yerde bulamayacağı, muazzam miktarda bir "açık fikirlilik" sağlar. Sadece "aklı" (rasyonaliteyi) ön plana çıkaran, mantığa tapınan bir dünya görüşü; sanatçı için dar, kısıtlayıcı ve çıkmaz sokaklarla dolu bir labirent olabilir. Oysa inançla, hayal gücüyle beslenen tinsel bir bakış açısı tamamen sınırsızdır. Sanatçıya hiçbir mantığın kabul etmeyeceği "fantastik" ve cüretkar olasılıklar sunar. Görünmeyen dünyanın doğası gereği, orada uyulması gereken hiçbir kural ve aşılması gereken hiçbir sınır yoktur.
      Rubin burada bir parantez açıyor: Tinsellik (spirituality) sözcüğü, aklı her şeyin üzerinde tutanlara veya bu sözcüğü doğrudan "kurumsal, dogmatik bir din" ile bir tutanlara ilk başta itici gelebilir ya da hitap etmeyebilir. Eğer isterseniz, tinselliği sadece doğadaki "evrensel bağlantılılığa" (her şeyin birbirine pamuk ipliğiyle bağlı olduğu gerçeğine) inanmak olarak da görebilirsiniz, bunda hiçbir sakınca yoktur. Veya tinsellik dendiğinde kafanızda sadece büyüye, büyücülere, mistisizme inanmak canlanıyorsa, o da tamamen kabul edilebilirdir. Çünkü burada önemli olan, inandığımız şeylerin "laboratuvarda kanıtlanabilir" olup olmaması değil; onların bizim ruhumuzda, psikolojimizde ve üretim sürecimizde taşıdıkları "yük", yani bize verdikleri o devasa itici güç ve enerjidir.
      Tinsellik, en basit haliyle, bu evrende yapayalnız olmadığınız, izole bir kaya parçasında tek başınıza sürüklenmediğiniz bir dünyaya bakmanın bir yoludur. Bu bakış açısına göre, gözle görünür o sıradan yüzeyin (bir bardağın, bir yağmur damlasının) hemen ardında çok daha derin, gizli anlamlar yatar. Sanatçı, ancak çevresindeki bu görünmez enerjiyi hissedip kullanarak çalışmalarını olağanüstü üst seviyelere taşıyabilir. Açıklanabilir olandan (bilimden) çok daha muazzam, mucizevi bir şeyin; uçsuz bucaksız olanaklarla dolu, büyülü bir dünyanın parçası haline gelirsiniz.
      Bu yüksek enerjiden faydalanmak, yaratıcı uğraşlarınızda, takıldığınız noktalarda fevkalade yararlı olabilir. Bu tinsel yaklaşımın yegane temeli sadece "inanmaktır". İnanmak ve sanki o inandığınız şey kesinlikle doğruymuş gibi korkusuzca, o özgüvenle hareket edip davranmaktır. Kimseye bir kanıt sunmanıza veya bir şey ispatlamanıza gerek yoktur.
      Bir proje üzerinde çalışırken bazen öyle anlar olur ki, karşınıza çıkan ve işinizi kolaylaştıran belirgin "tesadüflerin", sadece basit birer şansla açıklanamayacak kadar sık ve düzenli ortaya çıktığını hayretle fark edersiniz. Adeta dışarıdan, evrenden başka, şefkatli bir elin gelip sizin elinizi tuttuğunu ve fırçanızı veya kaleminizi belirli bir yöne doğru hafifçe ittiğini hissedersiniz. O anki sanatsal hareketleriniz, aslında zihninizden ziyade içinizdeki kadim bir "biliş" tarafından sessizce, usulca yönlendiriliyordur sanki. İşte inanç, size tam da o gittiğiniz yöne, ardındaki mantığı "anlamanıza hiç gerek duymadan" sonsuz bir güven duymanızı sağlar ve yaratıcılık akışınızı hızlandırır.
      Görünmeyen dünyayı yakalamak için gündelik hayattaki nefes kesici, mucizevi anlara özel ilgi gösterin. Muhteşem güzellikte bir gün batımına, bir insanın olağan dışı renkteki bir gözüne, kalbinize dokunan eski bir ezgiye ya da çok karmaşık mekanik bir makinenin o tıkır tıkır işleyen zarif tasarımına bakarken durun. Bir eser, bir farkındalık anı ya da doğadaki çok sıradan bir unsur; bir şekilde sizin kendi dar sınırlarınızdan çıkıp daha "büyük bir şeye" (evrenselliğe) erişmenizi sağlıyorsa, biliniz ki bu an, size evrenin o görünmeyen, tinsel yönünü sunan büyülü bir andır.
      Tıpkı bilimin her geçen gün gelişip zamanla doğanın o mükemmel sanatını yakalaması (açıklaması) gibi; sanatın da gelişip derinleşerek eninde sonunda o tarifsiz, aşkın "tinsel olanı" yakalaması hiç de olağandışı bir durum değildir. İkisi de aynı hakikate ulaşmaya çalışır.
      Bu bölümün özü: Sanatın amacı yalnızca fiziksel tüketim ürünleri ortaya koymak değil, mantığın ve aklın dar sınırlarını aşarak ruhsal (tinsel) ve görünmeyen bir dünyaya adım atmaktır. Sanatçı, evrensel bir bağa veya görünmez bir enerjiye (kanıtlanabilir olmasa bile) inandığında, bu inanç ona sanatsal tıkanıklıklarını aşabileceği sınırsız olasılıklar ve yönlendirici bir cesaret sunar.
      7. İpuçlarını Arayın
      Bir sanatçı (veya yaratıcı herhangi bir birey), "Yaratmak için malzemeyi nereden bulacağım?" diye endişelenmemelidir. Çünkü çalışmalarımızda kullanabileceğimiz muazzam zenginlikteki malzeme yelpazesi aslında hepimizi çepeçevre sarar. İlham, sadece müzelerde veya doğanın en el değmemiş köşelerinde değil, gündelik hayatımızın en sıradan köşelerinden, adeta taşların arasından fışkırır. İhtiyacımız olan o ham materyal; kulak misafiri olduğumuz sıradan konuşmaların, doğanın sessiz akışının, otobüsteki rastlantısal karşılaşmaların ve halihazırda var olan mevcut sanat eserlerinin dokusuna derinlemesine işlemiştir.
      Eğer yaratıcı sürecinizde bir yerde tıkandıysanız ve kafanızı kurcalayan bir soruna (örneğin yazamadığınız bir sahneye, melodisini bulamadığınız bir şarkıya) çözüm arıyorsanız, ilk yapmanız gereken şey endişeyi bırakıp etrafınızda olup bitenlere çok dikkatli bir şekilde kulak kesilmektir. Sizi içine düştüğünüz çıkmazdan kurtaracak yeni çalışma yöntemlerine veya mevcut fikirlerinizi çok daha ileriye taşıyacak yollara işaret eden evrensel "ipuçlarını" çevrenizde bulmaya çalışın.
      Rubin çok somut bir senaryo hayal etmemizi ister: Bir yazar düşünün, kalabalık ve gürültülü bir kafede oturmuş, günlerdir kitabının yeni bir sahnesini yazmaya çalışıyor. Ancak bir türlü karakterinin o kritik anda ne söyleyeceğinden, nasıl bir diyalog kuracağından emin olamıyor ve boş ekrana bakıyor. O sırada, arka masada oturan iki yabancının gündelik sohbetine istemeden kulak misafiri olabilir. Ve o yabancılardan birinin söylediği tek bir kelime, tek bir cümle veya seste beliren bir duygu tonu, yazarın günlerdir aradığı kusursuz çözümün ta kendisi olabilir. En azından o konuşma, yazarı çözüme ulaştıracak zihinsel bir kıvılcımı, "muhtemel bir ipucunu" ateşler.
      Benzer şekilde, hepimizin başına gelmiştir: Evde öylesine bir kitap okurken, bir sayfanın ortasından bir alıntı birdenbire gözümüze çarpar ve sanki doğrudan bizim o anki hayatımıza hitap ediyormuş gibi sayfadan fırlar. Ya da bir fılm izlerken, karakterin söylediği kısacık bir replik bizi öylesine çarpar ki, sırf o cümleyi bir kez daha duymak için filmi heyecanla duraklatıp geriye sarmak zorunda hissederiz. Neden? Çünkü o anlarda, evrenin bize sunduğu, tam da hayatımızda veya sanatımızda aradığımız o nokta atışı cevabı bulmuşuzdur. Bazen aradığımız bu gizli mesaj ilk seferde yakalanamaz, ancak başka başka yerlerde, farklı biçimlerde tekrar tekrar karşımıza çıkarak bizim ilgimizi çekmek, bizi dürtmek için adeta yalvarır. Ya da sadece içgüdüsel olarak izlediğimiz yolun "doğru" olduğunu bize onaylamak, sırtımızı sıvazlamak için ortaya çıkar.
      Fakat evrenin (veya Kaynak'ın) bize gönderdiği bu kozmik iletimler her zaman çok bariz değildir; oldukça "örtülüdür". Hep etrafımızda dolanırlar, ancak açık bir zihinle bakmadığımızda kalabalığın içinde gözden kaçmaları işten bile değildir. Eğer biz bu ipuçlarını bilinçli olarak arayıp bulmaya niyet etmezsek, hiç haberimiz bile olmadan, yanımızdan sessizce geçip giderler. Sanatçının görevi, etraftaki bu gizli bağlantıları fark etmek ve bu işaretlerin kendisini nereye götürdüğü üzerinde derinlemesine düşünmektir.
      Hayatınızda sıradışı, tuhaf veya senkronize bir şey gerçekleştiğinde, geçip gitmek yerine durun ve kendinize nedenini sorun: "Bu tesadüfün bana anlatmak istediği, buradaki gizli mesaj ne? Bu olayın dışarıdan görünenin ötesindeki daha derin anlamı ne olabilir?"
      Rubin burada çok kritik bir uyarıda bulunur: Bunu söylerken tamamen mantıksal, analitik ve bilimsel bir süreçten bahsetmiyor. İpuçlarının ne zaman ve nerede karşımıza çıkacağı üzerinde katiyen bir "denetim" kuramayız. İstediğimiz an, irademizi kullanarak onların sihirli bir şekilde açığa çıkmalarını (bize vahiy inmesini) sağlayamayız. Bazen beyninizde belirli bir yanıtı bulmak ya da seçtiğiniz belli bir izleği doğrulamak için "çok güçlü bir niyete" (çözmeye odaklanmış bir zihne) sahip olmanın bu ipuçlarını çekmekte büyük faydası olur. Ancak ilginçtir ki, bazen de size yolunuzu bulmanızda yardım edecek olan en büyük eylem, o sorunu çözme hırsından ve niyetinden "tamamen vazgeçmek", zihni rahat bırakıp teslim olmaktır. İpucu siz aramayı bıraktığınız an, rahatladığınızda kendiliğinden gelir.
      Zamanla bu sinyalleri, evrenin bu gizli dilini deşifre etmek, sanatçının işinin ve varoluşunun ayrılmaz bir parçası haline gelir. Siz bu iletimlere ne kadar "açık" ve yargısız olursanız, etrafınızda o kadar çok ipucu bulmaya başlarsınız ve şaşırtıcı şekilde, bu ipuçlarını bulmak için o kadar "az çaba" harcamanız gerekir. Olaylar üzerinde zorla mantık kurarak (düşünmekle) daha az uğraşır ve sezgilerinizden, içinizden gelen sessiz cevaplara çok daha büyük bir özgüvenle itimat etmeye başlarsınız.
      Dış dünyayı gözünüzde daha somut canlandırmak için, onu devasa bir fabrika gibi düşünün: Üzerinde sürekli küçük, gizemli paketlerin durmaksızın akıp gittiği, sonu gelmeyen devasa bir "taşıma bandı". Bir sanatçı olarak yapmanız gereken ilk adım, hayatın telaşından sıyrılıp, o taşıma bandının (evrenin mesaj akışının) hemen orada, burnunuzun dibinde aktığını "fark etmektir". O bandın varlığını kabul ettikten sonra işiniz çok kolaydır: Ne zaman yaratıcı bir kıvılcıma veya yanıta isterseniz, uzanıp o banttan geçen rastgele paketlerden birini alabilir, açabilir ve "içinde ne olduğuna, evrenin size o gün ne gönderdiğine" bakabilirsiniz.
      Bunun için yapılabilecek çok pratik ve faydalı bir alıştırma vardır: Kitaplığınızdan rastgele bir kitap çekin, rasgele bir sayfasını açın ve gözünüze çarpan ilk satırı okuyun. O satırda yazanların, o anki sanatsal (ya da hayatsal) sorununuzla nasıl bir bağlantısı olabileceğini düşünün. O cümlenin orada, sizin tam da o sorunu yaşadığınız anda karşınıza çıkmasının taşıdığı anlam ve ilgi tamamen tesadüfi olabilir elbet. Ama yine de, işin içinde "tesadüften çok daha fazlasının, bir tür kozmik senkronizasyonun" devrede olma ihtimalini de daima göz önünde bulundurun ve o ipucunu kucaklayın.
      Yazar burada bu senkronizasyonu mükemmel bir şekilde anlatan çok vurucu ve kişisel bir anısını paylaşıyor: "Apandisim iltihaplandığında, bana teşhisi koyan doktor hemen, acilen hastaneye gidip apandisimi ameliyatla aldırmam gerektiği konusunda diretti. Bunun için bana başka hiçbir seçeneğim olmadığını, durumun acil olduğunu söyledi. O anki stresle hastaneye gitmeden önce kendimi nedense yakındaki bir kitapçıda dolaşırken buldum. Kitapçının ön tarafında, dikkat çekici bir masada ünlü Dr. Andrew Weil'ın yeni çıkan kitabı gözüme çarpıyordu. Sanki bir güç beni oraya çekmiş gibi kitabı elime alıp rasgele bir sayfa açtım. Ve inanın, gözüme çarpan ilk pasaj tam olarak şöyle diyordu: 'Bir doktor vücudunuzdan bir parça çıkarmak isterse ve size bunun hiçbir işlevi olmadığını söylerse, ona sakın inanmayın.' O anki problemim için tam da ihtiyacım olan ve aradığım o kritik bilgi, o an, o sayfada önüme serilmişti. Ve bilin bakalım ne oldu? Apandisim hala yerinde duruyor."
      Bazen, işte böylesine inanılmaz ipuçları kendilerini net bir şekilde gösterdiğinde, devasa ve kusursuz saat gibi işleyen kozmik bir mekanizmanın sizin için devreye girdiğini derinden hissedersiniz. Sanki tüm evren, görünmez bir güçle sizi desteklemek, sizinle aynı tarafta (tarafınızda) olduğuna dair size "küçük sevgi dolu hatırlatmalarla" dürtmekte ve sanatsal ya da kişisel amacınıza ulaşmanız için ihtiyaç duyduğunuz her şeyi, tam da zamanında size sağlamak istiyormuş gibidir.
      Etrafınıza bakın. Çevrenizde herkesin bakıp geçtiği ama "başka hiç kimsenin göremediği" o gizli, büyülü işaretleri aramaya başlayın.
      Bu bölümün özü: Yaratıcılık tıkanıklıklarını aşmanın anahtarı; dış dünyayı, doğayı ve sıradan olayları, evrenin bize sürekli sunduğu "ipuçları ve gizli mesajlar" olarak görebilmektir. Sanatçı, rastlantısal gibi görünen olaylardaki bu senkronizasyonları yakalayabilen ve tesadüflerin içindeki yönlendirici anlamı açık bir zihinle okuyabilen kişidir.
      8. Uygulama
      Vahşi doğadaki yaşam mücadelesini düşünün. Bir ceylan veya aslan, ormanda hayatta kalabilmek için doğal bir içgüdüyle "görüş alanlarını daraltmak" zorundadır. Vahşi doğada tehlike her yerdedir ve eğer dikkatleri dağılırsa, bunun bedeli canlarıyla ödenir. Bu nedenle, hayati ihtiyaçlardan (yiyecek, su) sapmayı önlemek için son derece sıkı, adeta lazer gibi bir odaklanmaya ihtiyaç duyarlar. Hayvanın tüm zihni sadece dört temel şeye kilitlenmiştir: Besin bulmak, barınacak güvenli bir yer bulmak, etraftaki yırtıcılardan korunmak ve üremek.
      Ancak, milyonlarca yıllık evrimden bize miras kalan bu güdüsel ve daraltıcı odaklanma davranışı, pratik hayatta bizi korusa da bir "sanatçı" için son derece ket vurucu, yaratıcılığı felç edici bir durumdur. Sanatçının yapması gereken şey, hayatta kalma endişesinin daralttığı o vizörü (görüş alanını) alabildiğine "genişletmektir". Görüş açınız ne kadar genişlerse, dünyadaki ince detayların, daha fazla dikkat çekici ve ilham verici anın fark edilip toplanmasını o kadar iyi sağlarsınız. Çünkü sanatçı, bu geniş vizör sayesinde, daha sonra üretim aşamasında yararlanacağı o devasa ve eşsiz "malzeme rezervini" (haznesini) oluşturur.
      İşte bu noktada "Uygulama" (pratik) devreye girer. Yazarın deyimiyle uygulama; sadece kafamızda kurduğumuz sanatsal ve felsefi kavrama yönelik soyut yaklaşımın, eyleme dökülerek, etten kemikten "somutlaşmasıdır."
      Uygulama, yaratıcı zihnimizin arzuladığı o "sürekli açık, duyarlı zihinsel tutuma" ulaşmamızda bize rehberlik eden ritüeller bütünüdür. Bizler kendimize uygun, doğru farkındalık uygulamaları geliştirdiğimizde ve bunları ısrarla tekrarladığımızda, gün içinde "kesintisiz bir zihinsel açıklık ve duyarlılık" içinde bulunmaya o kadar çok yaklaşırız. Zamanla bu pratikler bir alışkanlık, bir refleks halini alır. Öyle bir alışkanlık ki, o "genişletilmiş farkındalık" durumu, sadece stüdyoya girdiğimizde taktığımız bir maske değil, dünyada tam zamanlı "var olma biçimimiz" haline gelir.
      Bu farkındalığı günlük olarak pratik etmek ve derinleştirmek demek, Kaynak (evren) ile çok daha yoğun, organik ve köklü bir ilişkiye girmek demektir. Pratikler sayesinde zihnimizdeki o yargılayıcı ve kısıtlayıcı süzgecimizin araya girmesi ve müdahalesi azaldıkça, çevremizdeki görünmez ritimleri, enerjileri ve hareketleri çok daha berrak ayırt etmeye başlarız. Onları duyabildiğimizde, bu ritimlere savaş açmak yerine, onlara daha uyumlu bir şekilde eşlik etmemiz kolaylaşır.
      Düşünün ki, beton binalara, ofislere ve bitmek bilmeyen toplantı takvimlerine hapsolmak yerine; gezegenimizin o binlerce yıllık doğal döngülerini dikkate alıp, doğanın mevsimleriyle, ayın hareketleriyle, gündüz ve gecenin ritmiyle uyum içinde yaşamayı seçtiğimizde, içimizde fevkalade bir şey uyanır ve gerçekleşir: Yeniden "bağlantı kurarız."
      Kendimizi artık dünyadan yalıtılmış, yalnız başına bir birey olarak değil, tam aksine sürekli olarak kendini yenileyen, yeşeren, solan ve tekrar doğan "daha büyük, devasa bir bütünün" ayrılmaz bir parçası olarak görmeye başlarız. Yalnızca bu kopmaz bütünlüğü idrak ettiğimizde, evrenin o muazzam ve tükenmez kuvvetine erişim sağlayıp, dalga dalga yayılan devasa yaratıcı enerjisinden kendi sanatımız için sonsuz fayda sağlayabiliriz.
      Peki, bu soyut farkındalık alışkanlığımızı pratik hayatta nasıl pekiştirebiliriz? Rubin bunun için çok basit bir yol öneriyor: Her gün ya da haftanın belirli günleri, belirli saatlerde gerçekleştireceğimiz, bize özel ritüellerle bezeli "günlük bir program" (uygulama) oluşturmalıyız.
      Gözünüzü korkutmasın; öyle şaşaalı, zorlu, saatler süren, pahalı ya da abartılı bir şey yapmamıza kesinlikle gerek yoktur. Bazen en küçük, en mütevazı ritüeller hayatımızda, sanatımızda ve algımızda en büyük, devasa farkı yaratabilir.
      İşte yazarın önerdiği birkaç basit ama dönüştürücü günlük uygulama (ritüel):
      Her sabah gözlerinizi açıp yataktan kalkmadan önce, ya da kalktığınız gibi "üç kez son derece yavaş ve bilinçli derin nefes alıp vermeyi" alışkanlık haline getirebilirsiniz. Bu inanılmaz basit fiziksel eylem, her yeni güne koşturmacayla ve endişeyle değil; dingin, sinir sistemi dengelenmiş ve "tamamen o anda, şimdide kalarak" başlamak için zihninize bir yol haritası sunar.
      Keza yemek yeme alışkanlığımızı da bir farkındalık pratiğine dönüştürebiliriz: Yemeklerimizi televizyona veya telefona bakarak, hızlıca çiğneyip yutmak yerine, tamamen o anki tabağımıza odaklanıp yavaşça yiyebilir, içindeki baharatları hissederek "her lokmanın tadını, dokusunu ve sıcaklığını" fark ederek çiğnemeyi deneyebiliriz.
      Yaşadığınız ortamda, ağaçların, gökyüzünün veya bitkilerin olduğu bir yerde (doğada) "günlük yürüyüşler" yapabilirsiniz. Ancak bu yürüyüş, aklınızdaki faturaları düşünerek atılan adımlar değil; etraftaki her yaprağı, her taşı, her böceği sanki dünyaya yeni gelmişsiniz ve o şeyleri "ilk kez" görüyormuşsunuz gibi muazzam bir hayretle ve merakla gözlemlemeyi denediğiniz bir keşif yürüyüşü olmalıdır.
      Ya da çok daha içsel bir ritüel olarak, gece uyumadan hemen önce sadece birkaç dakikanızı ayırarak yatağa uzanıp nefesinizi, kalp atışlarınızın ritmini ve o sıcak kanın damarlarınızda ne kadar mükemmel bir sistemle akışını izlemeye, bedeninizdeki bu kusursuz döngüyü "hayret ve büyük bir hayranlıkla duyumsamaya" odaklanabilirsiniz.
      Burada çok can alıcı bir nokta var: Meditasyon yapmanın asıl amacının sadece gözleri kapatıp 20 dakika boyunca "meditasyon yapmak" olmaması (yani bir görev tamamlamak olmaması) gibi, bu saydığımız günlük alıştırmalarda da asıl amaç "görev bilinciyle bunları yapmak" değildir. Asıl nihai amaç, bu pratikleri "uygulamadığınız" diğer tüm zamanlarda (işteyken, ailenizleyken, stüdyodayken, sokakta yürürken) dünyayı "algıladığınız biçimi kökten değiştirip geliştirmektir." Aslında sabah 3 nefes alırken veya yürüyüş yaparken bizim yaptığımız şey, evrenle daha derinden bir uyum ve frekans yakalamak için zihnimizin "odaklanma ve farkındalık kaslarını" tıpkı bir sporcuda olduğu gibi çalıştırmaktan ve antrenman yapmaktan ibarettir.
      Ancak dikkat edilmesi gereken bir husus vardır: Farkındalık her zaman taze tutulmalı, üstüne titrenmelidir. Yaptığınız bu günlük uygulama, tamamen otomatikleşmiş, ezberlenmiş ve körü körüne yapılan bir "rutin alışkanlık" haline geldiğinde -ne kadar iyi niyetli bir alışkanlık olursa olsun- etkisini yitirir. Otomatik pilota bağlandığı an, o pratiğin ara sıra durdurulup tekrar tekrar, taze bir niyetle "yeniden canlandırılması" ve uyarılması gerekecektir.
      Eğer pes etmeden, büyük bir disiplinle farkındalığınızı genişletmeye bu küçük pratiklerle devam ederseniz, bir gün gelecek ve şunu göreceksiniz: Artık sadece ritüel anlarında değil; her zaman, her yerde, sokakta, trafikte veya gürültülü bir kafede bile o derin farkındalığı zorlanmadan uygulamayı başardığınızı ve evrenden gelen sinyalleri "almaya hep açık" o muazzam alıcı frekansında kaldığınızı göreceksiniz.
      Rubin bölümü, yaratıcılık felsefesinin en ikonik, vurucu alıntılarından biriyle bitirir: Sanatçı olmak bir yaşam tarzıdır. Ya bir sanatçı olarak (sürekli bir açıklıkla) yaşarsınız ya da yaşamazsınız. Bu konuda 'Ben sanatta iyi değilim, yeteneğim yok' demenin hiçbir anlamı yoktur. Bu tıpkı 'Benden keşiş olmaz' demek gibi anlamsız bir şeydir. Ya bir keşişin adanmışlığıyla yaşarsınız ya da yaşamazsınız. Bizler genellikle sanatçının gerçek eserini, ürettiği kitap veya albüm gibi fiziksel bir 'ürün' olarak düşünme yanılgısına (eğilimine) düşeriz. Oysa gerçek başkadır: Sanatçının nihai, en büyük ve gerçek eseri, bizzat kendisinin 'dünyada var olma biçimidir'.
      Bu bölümün özü: İnsanın doğuştan gelen ve pratik hayatta kalmasını sağlayan dar odaklı bakış açısı yaratıcılığı kısıtlar; sanatçı, nefes egzersizleri veya farkındalıklı yürüyüşler gibi basit ama düzenli günlük ritüeller uygulayarak algı kapasitesini sürekli genişletmeli ve "sanatçı olmayı" sadece eser üretilen anlara değil, tam zamanlı bir var olma biçimine (yaşam tarzına) dönüştürmelidir.
      9. Keşfe Dalın (Büyük Eserleri)
      Eğer farkındalık uygulamalarımızı geliştirmeyi başardıysak, aslında zihnimizin alıcı kapılarını (antenlerini) sonuna kadar açmışız demektir. Artık bu kapılardan içeri neyi alacağımızı, yani algı ufkumuzu genişletecek o malzemeleri "bilinçli seçimlerle" belirlemek her an, her saniye bizim elimizdedir.
      Yaratıcı bir ruh olarak içimizde hep çok güçlü bir dürtü hissederiz. Her ne kadar içimizdeki bu bitmek bilmeyen merak ya da açlık; sürekli olarak daha güzel şeyler görmeye, kulağa harika gelen sesler duymaya, çok daha yoğun ve sarsıcı duygular hissetmeye yönelik olsa da; aynı zamanda öğrenmek, sürekli büyülenmek, nefesimizi kesecek kadar "şaşırmak" için duyulan ve içimizi kemiren bir açlık tarafından körüklense de, aslında bizim yaptığımız şey basit ve pasif bir "arayış" diyemeyiz. Bizimkisi bilinçli bir beslenmedir.
      İşte içimizde cayır cayır yanan bu güçlü estetik açlığı ve merakı gidermek için, "büyük eserleri" (insanlık tarihinin yaratmış olduğu o şaheserleri) büyük bir ciddiyetle keşfe dalma seçeneğini mutlaka değerlendirmelisiniz. Kendinizi, sıradanlığın dışına çıkarın. Gidin ve edebiyat tarihinin en nadide, en çarpıcı klasik romanlarını ve şiirlerini okuyun. Sinema tarihine damga vurmuş, algıyı yıkan başyapıt filmleri, sadece tüketmek için değil "incelemek" için izleyin. Müzelerde, kitaplarda dünyayı sarsan en etkileyici tabloları dakikalarca, yakından ve detaylarıyla inceleyin. Sadece kendi şehrinizdeki değil, dünyadaki en ünlü ve görkemli mimari yapıları (kilise, köprü, tapınak) fırsat buldukça ziyaret edin, fotoğraflarına bakın, oranlarını idrak edin.
      Bunu yaparken endişe etmeyin; tarihteki bu "büyük eserlerin" mutlak ve standart bir listesi, kesin bir kanunu yoktur. Çünkü her insanın, her sanatçının içindeki büyüklük ölçütü (neyin şaheser olduğuna dair süzgeci) birbirinden farklıdır. Üstelik bu "şaheserler listesi", kişinin bulunduğu yere ve zamana, yaşadığı ruh haline ve tecrübelerine göre de sürekli değişir. Ancak önemli olan, o devasa, kanıtlanmış nitelik havuzuna kendinizi korkusuzca fırlatmanızdır. Bu insanüstü çabalara, dehalara ve nitelikli sanat eserlerine maruz kalmak, zihninizde size taptaze ve daha önce hiç düşünmediğiniz fırsat kapıları aralar.
      Rubin bu etkiyi somutlaştırmak için oldukça güçlü bir örnek verir: Eğer hayatınızdan bir yılınızı ele alsanız ve o bir yıl boyunca "her gün", sabahları veya akşamları, zihninizi bulandıran, çoğunlukla negatif ve geçici olan "günlük haberleri okumak" yerine; "klasik edebiyat okumayı" (Dostoyevski, Shakespeare, Tolstoy vs.) bilinçli bir rutin olarak seçerseniz ne olur? Bu bir yıllık sürenin sonunda göreceğiniz şey mucizevi değildir, çok rasyonel bir gelişmedir. Bir yıl boyunca medyanın sığ, telaşlı ve korku pompalayan dili yerine; dünyanın en iyi zihinlerinin kitaplarından kazanacağınız o devasa düşünsel büyüklüğü, kelime dağarcığını, derinliği ve dünyayı algılayışınızdaki "seçkinliği" (kaliteyi) düşünün. 365 günün sonunda dünyadaki olayları ve sanatı fark etme, olayların ardındaki felsefeyi takdir etme ve duyarlılık eşiğiniz; sosyal medya veya haber okuyarak elde edeceğiniz düzeyden çok ama çok daha "gelişmiş, keskinleşmiş ve rafine" olacaktır.
      Bu kural, sadece sanata veya entelektüel tüketime dair seçimlerimiz için geçerli değildir; gün içinde yaptığımız "her seçim" için aynı kesinlikle geçerlidir. Seçtiğiniz arkadaşlarınız, oturduğunuz masada yaptığınız sohbetlerin konusu, ağzınızdan çıkan kelimeler, hatta yalnızken zihninizde üzerinde kafa yorduğunuz, zaman harcadığınız "düşünceler" için bile bu böyledir. Tüm bu günlük tercihlerimiz (kaliteli kitap okumak, ufuk açıcı insanlarla konuşmak); bizim "çok iyiyi" sadece "iyiden", "seçkin ve eşsiz olanı" ise "çok iyiden" ayırt etme yeteneğimizi doğrudan eğitir ve etkiler. Kısacası, bir müzeye gidip şaheserleri izlemek, gündelik hayatta da neyin zamanımıza ve paha biçilmez dikkatimize "değer" olduğunu, neyin ise vakit kaybı olduğunu çok daha iyi ve hızlı belirlememize yardımcı olur.
      Bugünün dünyasında kullanabileceğimiz, okuyabileceğimiz, izleyebileceğimiz sonsuz, sınırsız miktarda bir veri seli (içerik) var. Ancak karşılığında insan olarak zihnimizin ve enerjimizin (bant genişliğimizin) kapasitesi ne yazık ki oldukça sınırlıdır. Tüm o sonsuz veriyi aynı anda algılayamayacağımız ve zihnimize alamayacağımız için, içeri aldıklarımızın (bilginin, sanatın, muhabbetin) "kalitesini" bir mücevher ustası gibi çok dikkatlice seçmemiz gerekir.
      Bunu yapmak, yani en iyi eserleri incelemek sadece amacınız "yüzyıllar boyunca kalıcı olacak devasa bir sanat eseri yaratmak" olduğunda geçerli bir kural değildir. Hayır, amacınız en basitinden akşamüstü "ayaküstü bir yemek yapmak", basit bir sofra kurmak bile olsa; mutfağınızda elinizdeki en iyi, en taze, en kaliteli malzemeleri kullandığınızda, günün sonunda masaya koyduğunuzda ortaya çıkacak yemek muhtemelen çok daha lezzetli, çok daha güzel olacaktır. Öyleyse, bir sanatçı olarak ruhunuzdaki o estetik "lezzet duyunuza" bilinçli bir çabayla seviye atlatın. Zihninizin kilerini en iyi sanat malzemeleriyle doldurun.
      Ancak buradaki amaç, klasik müzik dinleyip klasikleri okuyarak ustaların o "seçkinliğini" çalıp kendi eserlerimizde onları "taklit etmeyi öğrenmek" kesinlikle değildir. Asıl amacımız, zihnimizde yer alan o görünmez, içsel "büyüklük ve seçkinlik ölçütümüzü" (kalite termostatımızı) son derece yüksek bir hassasiyetle ayarlayabilmektir. Bu ince ayarı (kalibrasyonu) yaptığımızda; gün gelip de bizi nihayetinde kendi orijinal, büyük eserimize kavuşturması muhtemel olan o okyanus yolculuğunda, fırçayı vururken, notayı basarken ya da kelimeyi seçerken yapmamız gereken "binlerce küçük seçimi", eskisinden çok daha "isabetli", güçlü ve vizyoner bir şekilde yapabiliriz.
      Bu bölümün özü: İnsan zihninin algılayabileceği bilgi kapasitesi sınırlıdır, bu yüzden sanatçı sınırlı vaktini medyanın veya geçici içeriklerin gürültüsüyle harcamak yerine, insanlık tarihinin kanıtlanmış başyapıtlarını tüketmelidir. Bu usta işi eserleri incelemek (taklit etmek için değil), kendi içsel "kalite çıtamızı ve estetik duyarlılığımızı" hassaslaştırarak eserimizi inşa ederken yapacağımız seçimleri çok daha isabetli hale getirir.
      10. Doğadan Ders Almak
      Eğer bir önceki bölümde büyük sanat eserlerini (insan elinden çıkma şaheserleri) incelemenin öneminden bahsettiysek, şimdi yazar bizi asıl kaynağa, yani tüm şaheserlerin anasına, "doğaya" davet ediyor. Gidip görebileceğimiz, gezebileceğimiz veya işitebileceğimiz insan yapımı tüm o büyük başyapıtlar, binalar, müzikler arasında, bize her saniye en etkileyici, en sarsıcı ve en daimi deneyimi sunan tek ve yegane öğretmen "doğa"dır.
      Doğanın bu görkemini ve kesintisiz yaratıcılığını her yerde; yaprakların sararmasıyla mevsimlerle birlikte yaşanan o devasa değişiminde, zirvesi karlı haşmetli dağlarda, derinliklerinde karanlık sırlar saklayan denizlerde, uçsuz bucaksız kavurucu çöllerde ve güneş ışığının süzüldüğü yemyeşil ormanlarda açıkça görebiliriz. Çok uzağa gitmemize gerek bile yoktur; kafamızı kaldırıp ayın gökyüzünde her gece döngüsel olarak nasıl farklı bir şekilde (hilal, dolunay) değiştiğini, onun ve etrafındaki yıldızların uzay boşluğundaki o muazzam, kusursuz ilişkisini bile her an izleyebiliriz.
      Doğanın içinde bulunduğunuzda, insanda derin bir hayret uyandırıcı ve sarsıcı bir ilham verici anlar silsilesi asla eksik olmaz; doğa ilham vermeyi hiç durdurmaz. Hatta öyle ki, eğer biz insanlar olarak hayatımızı sırf hiçbir şey yapmadan, saatler geçtikçe güneşin açısıyla değişen doğal ışık ve onun yarattığı "gölgedeki değişiklikleri" bile fark etmeye adasaydık (tıpkı izlenimci ressam Monet'nin aynı kiliseyi günün farklı saatlerinde defalarca resmetmesi gibi), yine de sürekli olarak keşfedecek, şaşıracak yepyeni güzellikler, yepyeni şeyler bulurduk.
      Doğayı takdir etmek, onun karşısında büyülenmek için onun bilimsel işleyişini, fotosentezi veya yerçekimi ivmesini anlamamız gerekmez. Tıpkı tüm sanat eserleri için geçerli olduğu gibi, anlamasanız da doğanın o muhteşem güzelliği karşısında nefesinizin kesildiği anların, o büyülenmenin "farkına varmak" bile tek başına yeterlidir. Ve doğa bu nefes kesen anları her formda sunar.
      Bu büyüleyici durum; akşamın o serin, kızıl loşluğunda yerde tek sıra halinde dizilmiş, toprağın üzerinde kıvrıla kıvrıla ilerleyen karıncaları bir tepeye çıkarken saatlerce pür dikkat sezerken de geçerlidir... Veya devasa bir ormanda, gökyüzünü delen üç yüz (yaklaşık yüz metre) yıllık dev bir sekoya ağacının kalın gövdesinin dibinde durup, o antik devin karşısında içinizde derin bir "hayranlık ve huşu (kutsal bir saygı)" içinde küçücük bir nokta olarak dikilirken de geçerlidir. Doğanın bu akıl almaz, engin hikmetini ve kusursuzluğunu fark etmek, kendi içimizde yatan, uykudaki o gizli potansiyeli anında canlandırır. Bizi uyandırır. Çünkü en nihayetinde biz de o doğanın bir parçasıyızdır ve doğayla derin bir bağlantı kurarak, aslında özümüzdeki, kendi "iç doğamıza" yaklaşırız.
      Rubin bu noktada yine insan yapımı dünya ile doğayı çok basit ve etkili bir örnekle karşılaştırır: "Pantone Kataloğu". Bir tasarımcı olarak elinize dünyanın en kapsamlı endüstriyel renk kataloğunu (Pantone) alıp bir renk seçerken, aslında insan yapımı, sınırları belli olan ve belirli sayıda basılmış bir dizi seçenekle sınırlandırılırsınız. Yüzlerce renk vardır ama "sınırlıdır". Ancak ofisinizden çıkıp "doğaya adım attığınızda", oradaki renk paleti kelimenin tam anlamıyla "sonsuzdur". Yerde duran sıradan bir kayaç parçasını bile alıp mikroskopla inceleseniz, o tek bir taşın içinde mineral yapısından kaynaklanan öyle sonsuz bir "renk çeşitliliği" ve geçişi barındırır ki; oradaki o birebir aynı tonu, o geçişi yakalayabileceğimiz bir boya tüpü veya kutusu, insanlık tarihi boyunca asla bulunamaz ve icat edilemez.
      Doğa, her zaman insan aklının "etiketleme, sınıflandırma, kutulara koyma, indirgeme ve sınır çizme" eğilimlerinin çok ötesine geçer. Bize okullarda öğretilen, basit şemalara indirgenmiş doğal dünya (şu otoburdur, şu şöyledir) aslında gerçekte olandan, doğanın bizzat kendisinden çok daha zengin, çok daha iç içe geçmiş, birbirine organik olarak sıkıca bağlı ve kaotik derecede karmaşıktır. Dahası, laboratuvarlarda anlatılandan çok daha "gizemli" ve kelimelerle tarif edilemeyecek kadar "güzeldir".
      İşte bu yüzden, evlerimizden, ekranlarımızdan çıkıp doğayla olan organik bağlarımızı tekrar güçlendirmek, doğrudan bizim "ruhumuza" hizmet eder, ruhumuzu besler. Ve çok doğal bir zincirleme reaksiyon olarak, ruhumuza hizmet eden, onu iyileştiren her şey de aynı şekilde bizim "sanatsal üretimimize", fikirlerimize hizmet edecek ve besleyecektir. Çünkü süzgecimiz temizlenmiş, vizyonumuz genişlemiştir.
      Doğal dünyaya (ormana, denize, gökyüzüne) ne kadar yaklaşırsak ve onun ritmini ne kadar yakından izlersek, ondan "ayrı" bir varlık olmadığımızı (evrenden kopuk olmadığımızı) çok daha çabuk ve sarsıcı bir şekilde fark etmeye başlarız. Bunu idrak ettiğimizde, stüdyomuzda bir şeyler yaratırken (resim çizerken, nota basarken), eserimizde sadece kendi bencil, "benzersiz bireyselliğimizi" ya da kibrimizi değil; köklerimizin bağlı olduğu o sınırsız, bütünsel bir yapıyla (doğayla) kurduğumuz "kusursuz bağı" da ifade ettiğimizi derinden hissederiz.
      Rubin bölümü harika, şiirsel bir gözlemle kapatır: "Sebepsiz yere, bir sahil kenarında oturup saatlerce o engin denizleri seyre dalmanın çekimine boşuna kapılmayız. Derler ki, o hareketli ve engin sular, bizim en derinde 'kim olduğumuzu' bize, dünyadaki diğer tüm pürüzsüz aynalardan çok daha iyi, çok daha gerçek bir şekilde yansıtır."
      Bu bölümün özü: İnsan yapımı hiçbir katalog veya eser, doğanın sunduğu sonsuz çeşitliliğin, ahengin ve karmaşıklığın yerini tutamaz. Sanatçı, doğayı (renklerini, mevsimlerini, döngülerini) gözlemleyip onunla bağ kurdukça sadece ruhunu iyileştirmekle kalmaz, insan aklının kısıtlayıcı etiketlerini aşarak kendi sanatsal üretimini evrensel bir bütünsellikle besler.
      11. Hiçbir Şey Durağan Değildir
      Farkındalık, dikkat ve doğayı gözlemlemekten bahsederken sıkça unuttuğumuz çok temel, kozmik bir kural vardır: Dünya, üzerinde yaşadığımız gezegen, sürekli ve kesintisiz bir şekilde değişiyor. Her saniye!
      Şöyle düşünün: Kendinize doğada harika bir yer buldunuz ve "aynı" farkındalık uygulamasını (örneğin sessizce oturup etrafı izlemeyi) "aynı yerde", "aynı saatte", tam beş gün üst üste yapmaya karar verdiniz. Dışarıdan bakıldığında hiçbir şeyin değişmemesi, her gün aynı şeyleri hissetmeniz gerektiğini düşünebilirsiniz. Oysa oraya her gittiğinizde, her seferinde "bambaşka bir deneyim" yaşarsınız. Asla aynı hissi tekrar edemezsiniz.
      Neden? Çünkü bulunduğunuz o ortamda, bir önceki gün duymadığınız farklı kuş sesleri veya rüzgarın taşıdığı yepyeni kokular mevcut olabilir. Teninize çarpan hiçbir rüzgar esintisi, dün esen esintiyle "tıpatıp aynı" hissi, aynı sıcaklığı veya yönü vermez. Ağaçların arasından süzülen güneş ışığının tonu, rengi, havadaki partiküllere yansıyan kalitesi dakikadan dakikaya, bulutların hareketine göre günden güne tamamen değişir. Doğa, sabit bir fotoğraf karesi değil, sürekli akan bir fılmdir.
      Sadece geniş, dış mekanlar ve doğanın zenginliği içinde değil; sıradan, günlük yaşamımızda da bu değişim ve çeşitlilikleri çok kolayca fark edebiliriz. Bazı değişimler o kadar şiddetlidir ki varlıklarını adeta kulağımıza bağırır, bazıları ise o kadar incedir ki rüzgar gibi sadece usulca fısıldar. Bu kural her şey için geçerlidir. İster Louvre müzesindeki asırlık bir sanat eserine (mesela Mona Lisa'ya) bakın, ister kendi mutfağınızda tezgahın üzerinde duran gündelik, sıradan bir eşyaya (bir çaydanlığa); aslında tamamen "durağan
  - baslik: Parça 2 · Zihinsel Engelleri Aşmak ve Çalışmaya Başlamak (Bölüm 16-27)
    icerik: |-
      Harika bir yolculuğa çıkıyoruz. Rick Rubin’in bu ikinci mantıksal parçasında, zihnimizin bize kurduğu tuzakları nasıl aşacağımızı ve o çok korktuğumuz "ilk adımı" nasıl atacağımızı derinlemesine inceleyeceğiz. Görevimiz sadece ne yazıldığını özetlemek değil; yazarın zihin dünyasına girip, oradaki fikirleri kanıtları ve örnekleriyle adım adım, sanki karşılıklı kahve içip sohbet ediyormuşuz gibi samimi ama bir o kadar da ciddi bir dille yeniden anlatmak.
      İşte Zihinsel Engelleri Aşmak ve Çalışmaya Başlamak (Bölüm 16-27) üzerine derinlemesine yeniden anlatım:
      16. Özgüvensizlik (İçimizdeki Kusurlu İnsan)
      Yaratıcı bir yola baş koyduğumuzda hemen hepimizin hissettiği ilk o ağır duygu "özgüvensizlik"tir. Çoğumuz bu duygudan nefret ederiz, ondan tamamen kurtulmak ve kendimizden yüzde yüz emin bir şekilde eser üretmek isteriz. Ancak Rubin çok çarpıcı bir iddiayla başlıyor: Özgüvensizlik, kurtulmamız gereken bir hastalık değil, sanatımızı insan kılan ve onunla bağ kurulmasını sağlayan çok işlevsel bir araçtır.
      Eğer hepimiz kusursuz olsaydık, tıpkı bir makinenin fabrikasyon üretimi gibi, yaptığımız sanat da tamamen ruhsuz ve duygudan yoksun olurdu
      . İnsanı ve onun eserini ilgi çekici kılan şey tam olarak bu kusurlarıdır. Sanat, bizim kimliğimizi yansıtır ve eğer özgüvensizlik, korku ya da acı bizim kimliğimizin bir parçasıysa, eserimizdeki sahicilik tam da bu duygular sayesinde en yüksek noktaya ulaşır
      .
      Bu durumu günlük hayattan düşünelim. Dünyanın en iyi seslerinden kabul edilen, stadyumları dolduran bazı efsanevi şarkıcıların kendi seslerini dinlemeye bile tahammül edemediğini, kendi seslerinden nefret ettiğini biliyor muydunuz?
       Bu hiç de nadir bir durum değildir. Bir sanatçıyı harika eserler üretmeye iten o "aşırı duyarlılık" ve hassasiyet, aynı zamanda onu dış dünyanın yargılarına karşı inanılmaz derecede kırılgan yapar
      .
      Bazen bu kırılganlık o kadar ağır bir varoluşsal ıstıraba dönüşür ki, tarih boyunca pek çok dahi sanatçının bu acıyı dindirmek için uyuşturucuya yöneldiğine ve çok erken yaşta hayatını kaybettiğine şahit olmuşuzdur
      . Dünyanın geri kalanının sıradan gördüğü bir detayda muazzam bir güzellik veya korkunç bir acı görüyorsanız, bu lanet gibi görünen durum aslında sizin en büyük sanatsal lütfunuzdur
      . Özgüvensizlikle savaşmak yerine onu kabul etmeli ve eserinizi benzersiz kılan bir imza olarak görmeliyiz. "Ben bu işin üstesinden gelemem" diyerek kendinizi kıyaslamak anlamsızdır, çünkü sizin sesinize ve sizin kusurlarınıza sadece siz sahipsiniz
      .
      Bu bölümün özü: Özgüvensizlik ve kusurlar, sanatın ruhsuz bir makine üretimi olmasını engelleyip onu sahici kılan en değerli insani özelliklerimizdir. Sanatçıyı üretime iten aşırı duyarlılık aynı zamanda onu kırılgan yapsa da, bu kırılganlığı saklamak yerine kucaklamak eseri evrensel ve bağ kurulabilir hale getirir.
      17. Yaratın Gitsin (Mükemmeliyetçilik Tuzağından Kurtulmak)
      Özgüvensizliğin üzerimizde yarattığı o felç edici etkiden kurtulup nihayet o ilk adımı nasıl atacağız? Rubin'e göre bizi durduran en büyük engel, esere hak ettiğinden çok daha büyük bir "anlam" yüklememizdir. Üzerinde çalıştığımız şeyin bizi "ebediyen tanımlayacak hayatımızın en önemli eseri" olduğunu düşünürsek donup kalırız
      . Bunun yerine yazar müthiş bir strateji önerir: Beklentileri düşürün ve çıtayı en aşağıya çekin.
      Olayı bir ölüm kalım meselesi olarak görmek yerine, sadece kuralsız ve sonuçsuz bir "deney" ya da bir "oyun" alanı olarak görün
      . Amacınız oyunu kazanmak değil, sadece eğlenerek oynamaktır
      . Mükemmeliyetçilik bizim eğlenmemizi engeller. Oscar Wilde'ın dediği gibi: "Bazı şeyler ciddiye alınamayacak kadar önemlidir. Sanat da bunlardan biridir."
       Çıtayı düşük tuttuğunuzda stres biter ve o serbestlik içinde en iyi işleriniz sizi mutlulukla şaşırtarak aniden ortaya çıkar
      .
      Peki ya kafamızın içinde sürekli konuşan, bizi sabote eden o sesler? Rubin bu sesleri isimlendirmeyi (etiketlemeyi) öneriyor. Budist kültürde buna "papancha" (düşüncelerin baskınlığı / zihnin kafa bulandırıcı gevezeliği) denir
      . Bu sesler geldiğinde "Aha, yine papancha konuşuyor" deyip onu ciddiye almamak, bu şüpheleri normalleştirir
      . Bir keresinde bir toplantıda çok başarılı bir müzisyen artık yeni albüm yapmak istemediğinden şikayet eder. Rubin ona sadece "Müzik yapmaya devam etmek zorunda değilsin, seni mutlu etmiyorsa bırak gitsin" der. Üzerindeki o mecburiyet baskısı kalkan müzisyen, yaratmaya devam etmenin onu mutlu edeceğini o saniye fark edip geri döner
      .
      Ayrıca Rubin, "kendinden şüphe duymak" ile "çalışmadan şüphe duymak" arasında çok ince bir çizgi çeker. "Ben güzel şarkı yazamam" demek bir yıkımdır. Ancak "Bu yazdığım şarkı yeterince iyi oldu mu?" demek, eseri mükemmelleştiren harika bir itici güçtür
      . Bazen düzeltmeye çalıştığımız kusurlar, eseri eşsiz kılan şeyin ta kendisidir. Pisa Kulesi bir mimarlık hatasıdır ama tam da o hata yüzünden yüzlerce yıldır milyonlarca turist çeker
      . Ya da Japon çömlek onarım sanatı Kintsugi'yi düşünün; kırılan çömlek atılmaz, çatlakları altınla doldurularak o kusur göz alıcı bir şekilde vurgulanır
      . Biz de kendi içimizdeki kırıkları ve şüpheleri altınla doldurup, sanatımızın odak noktası yapmalıyız.
      Bu bölümün özü: Yaratım sürecindeki felç edici korkuyu aşmanın yolu, eserimize hayat memat meselesi gibi yaklaşmak yerine onu kuralsız, eğlenceli bir oyun (deney) olarak görmektir. Kendimizden değil sadece eserden şüphe duyarak ve zihnimizin gevezeliğini ciddiye almayarak o çok zor olan "başlama" adımını kolayca atabiliriz.
      18. Dikkat Dağıtma (Zihni Arka Planda Çalıştırmak)
      Bir sorun üzerinde çok uzun süre uğraştığınızda, çözüme ulaşmak yerine sorunun içinde daha da boğulduğunuzu fark ettiniz mi? Rubin'e göre böyle anlarda inatla masada oturup zorlamak işe yaramaz. Ustaca kullanıldığında en iyi yaratıcılık silahlarımızdan biri Dikkat Dağıtmadır
      .
      Meditasyon yaparken zihin tamamen sustuğunda bile araya hemen endişeler girer. Bu yüzden uzak doğu öğretilerinde öğrencilere bir mantra (tekrarlanan bir sözcük) verilir. Bu mantra aslında bilinçli bir "dikkat dağıtıcı"dır; zihni meşgul edip asıl yaratıcı boşluğa girmemizi sağlar
      .
      Sanatta da bir çıkmaza girdiğimizde projeden tamamen uzaklaşmak gerekir
      . Sorunu zihnimizin ön planından alıp arka planda usulca demlenmeye bırakmalıyız. Arabaya binip uzun bir yola çıkmak, bulaşık yıkamak, yüzmek veya yürüyüş yapmak gibi "otomatiğe bağladığımız" fiziksel eylemler bu iş için biçilmiş kaftandır
      . Siz araba kullanırken beyninizin analitik ve endişeli kısmı "araba kullanmakla" meşgul olurken, beyninizin yaratıcı (bilinçdışı) kısmı arka planda o zorlu melodiyi ya da tıkandığınız roman sahnesini sakince çözer
      . Bu bir işi ertelemek ya da tembellik değildir; bu, "düşünmeden düşünme" eylemidir
      .
      Bu bölümün özü: Yaratıcı bir çıkmaza girildiğinde sorunu inatla zorlamak yerine; yürümek veya bulaşık yıkamak gibi basit ve otomatik faaliyetlerle bilinçli zihnin dikkatini dağıtmak gerekir. Bu stratejik uzaklaşma, bilinçaltımızın arka planda sorunu çok daha rahat ve kendiliğinden çözmesine olanak tanır.
      19. Ortaklık (Sanatın Kolektif Doğası)
      Sanatçılar olarak bazen her şeyi tamamen "kendi" içimizden, tek başımıza var ettiğimiz yanılgısına düşeriz. Oysa Rubin, "Hiçbir şey bizimle başlamaz" der
      . Sanat dediğimiz şey devasa ve zamanlar üstü bir ortaklıktır (işbirliğidir).
      Siz bir eser yaratırken aslında sizden önceki ustalarla, kullandığınız fırçayla veya enstrümanla, etrafınızdaki doğayla ve o eseri okuyacak/dinleyecek olan gelecekteki izleyiciyle görünmez bir işbirliği içindesinizdir
      . Daha da ilginci, bizzat kendi içimizdeki farklı benliklerimizle de bir ortaklık yaşarız. İçimizdeki "hayalperest yaratıcı" bir vizyon çizer, ama içimizdeki "zanaatkar" o vizyonu somutlaştırırken yetersiz kalabilir ve aralarında bir içsel pazarlık (çatışma) başlar
      .
      Bir eseri tamamladığınızda onun ne anlama geldiğini çok iyi bildiğinizi sanırsınız. Sonra bir izleyici gelir ve o eserde sizin aklınızın ucundan bile geçmeyen bambaşka bir anlam bulur. Hangisi doğrudur? İkisi de doğrudur ve ikisi de doğru değildir!
       Çünkü sanat, yaratıcı ile alıcı arasında imzalanan gizli bir anlaşmadır. Hatta bazen sanatçının bizzat eseri fiziksel olarak üretmesine bile gerek yoktur. Ünlü sanatçı Marcel Duchamp'ın bir kar küreğini veya pisuvarı alıp galeriye koyarak bunlara "hazır yapıt" adını vermesini düşünün
      . Bir resim çerçevelenip duvara asılana kadar sadece boyalı bir bezdir, asıldığında sanat olur
      . Sanat, olanla ve olmuşla sürekli bir diyalogdur ve asla tek başımıza yürüdüğümüz bir yol değildir
      .
      Bu bölümün özü: Sanat eserleri sadece sanatçının bireysel dehasının değil; geçmiş kültürle, kullanılan malzemeyle, izleyiciyle ve sanatçının içindeki farklı benliklerle kurulan kolektif bir ortaklığın sonucudur. Eserin nihai anlamı sabit değildir; izleyicinin kendi süzgecinden geçerek her seferinde yeniden ve bambaşka bir şekilde anlam kazanır.
      20. Niyet (Eserin Kalbindeki Titreşim)
      Niyet kavramı çok uçucu gelebilir ama Rubin bunu muazzam bir hikayeyle somutlaştırır: Kolkata'da yaşlı bir adam her gün kuyuya gidip toprak bir testiyle su çeker. Testi kırılmasın diye eliyle yavaşça ve büyük bir özenle aşağı indirir ve çeker. Bir gün bir gezgin ona bir makara sistemi gösterir; bu sayede hiç yorulmadan testiyi hızla çekebileceğini söyler
      . Yaşlı adam reddeder ve şöyle der: "Eğer o makarayı kullanırsam işim kolaylaşır, yaparken aklım başka yerlere gider, o büyük özeni göstermem. Özen göstermeyip zaman ayırmazsam, sence bu suyun tadı eskisi gibi güzel olur mu?"
      İşte sanattaki "Niyet" tam olarak budur. Bir eseri değerli kılan şey üstündeki süslemeler ya da harcanan mesai değil, içine katılan o görünmez odak, sevgi ve özen enerjisidir
      . Niyeti eserden çıkardığınızda geriye sadece cansız bir kabuk kalır
      . Tıpkı Uzak Doğu kaligrafisinde sanatçının fırçayı tek bir hareketle kağıda vurması gibi; o tek çizgi, sanatçının tüm geçmişini, niyetini ve ruhunu saniyeler içinde kağıda aktarır
      .
      Daha da geniş bir çerçeveden bakarsak, aslında biz kendi niyetimizi ortaya koyarken evrenin daha büyük kozmik niyetine hizmet ederiz. Orkestrayı kendimiz yönetiyoruz sanırız ama biz o devasa senfonide sadece bir enstrümanız
      . Çiçekten çiçeğe konan arı, dünyadaki bitkilerin döllenmesini sağlayıp doğanın dengesini koruduğunu bilmez, o sadece kendi varoluş amacını (niyetini) yerine getirir
      . Biz sanatçılar da eserlerimizi üretirken niyetimizi saf tuttuğumuzda, o devasa evrensel yapbozda tam da bize ayrılan yeri mükemmel bir şekilde doldurmuş oluruz
      .
      Bu bölümün özü: Bir eserin asıl büyüsü ve kalitesi, onu ortaya çıkarırken harcanan mekanik emekten ziyade; sanatçının ona kattığı bilinçli özende, sevgide ve saf niyetinde gizlidir. Sanatçı kendi saf niyetine sadık kalarak ürettiğinde, aslında evrenin o çok daha büyük, kusursuz kozmik dengesine hizmet etmiş olur.
      21. Kurallar (Görünmez Sınırlarımızı Yıkmak)
      Sanat okullarında veya toplumda bize öğretilen kuralları genellikle doğa yasaları (yerçekimi gibi) sanırız. Oysa Rubin çok nettir: Sanattaki kurallar kesin doğrular değil, sadece test edilmesi gereken "varsayımlardır" ve doğaları gereği her zaman kısıtlayıcıdırlar
      . Eğer amacınız sadece "vasat" ve herkesin kabul edeceği bir şey yapmaksa kurallara uyun. Ancak hedefiniz çığır açan, "olağanüstü" bir eser yaratmaksa, o zaman mevcut kuralların çoğunu çöpe atmanız gerekir
      .
      Bir pop şarkısı yazarken hemen herkes "üç-beş dakika arası olmalı ve akılda kalıcı bir nakaratı olmalı" kuralına uyar. Fakat bir kuşun şakımasını düşünün; onun belli bir süresi veya nakaratı yoktur ama son derece büyüleyici, uyarıcı ve eşsizdir
      . Resim yapacağınızı düşündüğünüzde bile, sanat malzemeleri satan dükkandan "dikdörtgen ve ahşap çerçeveli" bir tuval alırsınız
      . Daha fırçayı elinize bile almadan, şeklin dikdörtgen olacağı kuralına boyun eğmiş ve olasılıkları baştan kısıtlamışsınızdır
      . Aynı şekilde uzun metrajlı filmlerin 90-120 dakika olması ya da kitapların bölümlere ayrılması hep bu görünmez kısıtlamaların eseridir
      .
      Ancak en tehlikeli kurallar bu gördüklerimiz değil, zihnimizin derinliklerine çocukluktan itibaren kodlanmış ve doğru sandığımız "görünmez" kurallardır
      . Ayrıca bazen bir yenilik yaparız ve o yenilik çok başarılı olur. Sonra o yeniliği bir "formüle" dönüştürür ve hayatımız boyunca hep o kuralı tekrar etmeye başlarız
      . Bir yöntemin bir kere çok iyi çalışmış olması, onun tek doğru yol olduğu anlamına gelmez. Eğer yıllardır aynı renk paletiyle resim yapıyorsanız veya aynı ritimle beste yapıyorsanız, sırf bu tekdüzeliği yıkmak için o çok iyi bildiğiniz kuralları ıskartaya çıkarmalısınız
      .
      Bu bölümün özü: Sanatta bize öğretilen standartlar ve kurallar değişmez doğa yasaları değil, bizi vasatlığa ve taklide sürükleyen kısıtlayıcı varsayımlardır. Olağanüstü ve özgün bir eser yaratmak için, zihnimize kazınmış bu formülleri cesaretle sorgulamak ve alışkanlık haline gelmiş sınırları yıkmak şarttır.
      22. Tam Tersi de Doğrudur (Zıtlıkların Gücü)
      Kuralları yıkmanın en radikal ve eğlenceli yollarından biri nedir? Rubin bunu basit bir pratikle açıklıyor: İnandığınız ve olmazsa olmaz dediğiniz kuralın "tam tersini" uygulayın
      .
      Örneğin bir heykeltıraşın en temel kuralı nedir? Heykelin fiziksel, dokunulabilir bir maddeden yapılması. Peki ya fiziksel olarak var olmayan, tamamen dijital ya da sadece "kavramsal" bir heykel yapsaydınız ne olurdu? Belki o güne kadarki en şaheserinizi ortaya çıkarmazdınız ama beyninizi daha önce hiç gitmediği yepyeni nöral yollara ve keşfedilmemiş olasılıklara sokmuş olurdunuz
      .
      Bunu hayatın temel dengesi olan Yin ve Yang gibi düşünebiliriz
      . Aydınlık, karanlık olmadan bir anlam ifade etmez. Bir sanat eserinde sadece tek bir uçta durmak yerine tahterevallinin öbür ucuna gidip dengeyi test etmeniz gerekir
      . Bazen de tam tersi yerine, bulunduğunuz ucu daha da aşırıya çekersiniz; eserdeki karanlık bir temayı "daha da karanlık" yaparsınız
      . Bir kuralı tersine çevirdiğinizde sonucun eskisinden "daha iyi" olması gerekmez, "farklı" olması bile o anki yaratıcı tıkanıklığınızı çözmek için yeterlidir
      .
      Bu bölümün özü: Yaratıcılıkta tıkandığımızda, sıkı sıkıya inandığımız doğruların veya sanatsal yöntemlerimizin tam zıddını uygulamak ufkumuzu muazzam derecede açar. Zıt kutuplarda (karanlık/aydınlık) gezinmek, terazinin dengesini anlamamızı sağlayarak eserimize bambaşka boyutlar katar.
      23. Dinlemek (Tüm Benliğimizle Algılamak)
      Sanatçı sadece iyi konuşan, iyi ifade eden kişi değildir; her şeyden önce "tüm benliğiyle" iyi dinleyen kişidir. Budizm'de ritüellerin bir parçası olarak çan çalınır; o aniden çınlayan ses herkesi anında geçmişin ve geleceğin yükünden koparıp "şimdiki ana" çeker
      . Çünkü kulağın göz gibi kapatılabilecek bir kapağı yoktur, dünyaya daima açıktır
      .
      Ancak işitmek ile "dinlemek" birbirinden çok farklı şeylerdir. Dinlemek, duyduğumuz şeye tam bir bağlılık göstermektir. Müzik dinlerken kulaklık taktığınızda sesin sadece beyninizde yarattığı bir illüzyonu duyarsınız. Oysa kaliteli bir hoparlörle odada müzik dinlediğinizde, basların fiziksel titreşimini göğsünüzde, kemiklerinizde hissedersiniz
      . Birçok insanın hayatı adeta o kulaklıklarla yaşaması gibi yüzeyseldir; titreşimleri ve alt anlamları hissetmezler
      .
      Aynı durum insan ilişkilerinde ve eleştiri alırken de geçerlidir. Biri konuşurken çoğu zaman onu "gerçekten" dinlemeyiz. Zihnimiz hemen arka planda yargılamaya, savunma hazırlamaya veya itiraz etmeye başlar
      . Sabırsızca, cevap yetiştirmek için dinlemek, aslında hiçbir şey duymamak demektir
      . Gerçek bir dinleme, önyargılardan arınarak (kuşkuyu askıya alarak) sadece o an söylenen şeyi saf bir şekilde "içeriye buyur etmektir"
      . Ancak bu şekilde süzgecimiz genişler ve dünyayı çok daha büyük, zengin bir yer olarak algılarız
      .
      Bu bölümün özü: Gerçek dinleme eylemi, duyduğumuz yeni bilgilere hemen bir cevap veya savunma hazırlamadan, önyargısızca ve sadece "şimdiki anda" kalarak onları tüm benliğimizle hissetmektir. Bilgiyi bu saf açıklıkla içeri aldığımızda, inançlarımızın kısıtlayıcı duvarları yıkılır ve dünyayı kavrayışımız derinleşir.
      24. Sabır (Zamanın Ritmini Kabul Etmek)
      Bugünün hız odaklı ve verimlilik saplantılı dünyasında herkes kestirme yollar arıyor. Ancak Rubin kesin bir dille uyarıyor: Sanatta ve yaratıcılıkta kestirme yol yoktur!
      . Alelacele temelsiz çıkılan bir ev ilk fırtınada nasıl yıkılırsa, bir kitabın tek cümlelik özeti de o koskoca eserin derinliğini asla veremez
      .
      Bizler çoğu zaman bu aceleci tavrımız yüzünden bir şeyleri okurken bile gözlerimiz sayfanın üzerinde kayar ama zihnimiz başka yerdedir
      . Geriye dönüp o 3-4 sayfayı tekrar okumak büyük bir yük gibi gelir. Hayatı hep otonom bir "uyurgezer" modunda yaşarız. Oysa bir eylemi gerçekleştirirken (örneğin kahve yaparken ya da bir şey okurken) "uçak indiriyormuşçasına" devasa bir dikkatle orada bulunsaydık, dünyayı çok daha canlı deneyimlerdik
      .
      Sabır tam da bu noktada devreye girer. Sabır, pasif bir bekleyiş değil; zamanın ve olayların kendi doğal ritmini olduğu gibi kabul etmektir
      . Sabırsızlık ise aslında "gerçeklikle kavga etmektir"; yağmurun hemen durmasını ya da henüz olgunlaşmamış bir eserin aniden bitmesini istemektir
      . Yaratıcı süreçte büyük eserleri zor kullanarak, kas gücüyle var edemezsiniz. Tohumun zamanı gelene kadar toprakta demlenmesi gerekir. Sanatçının yapması gereken tek şey, ilhamı veya eseri o olgunlaşma evresinde telaşa kapılmadan "faal olarak beklemek" ve onu ürkütmemektir
      .
      Bu bölümün özü: Bir fikrin veya eserin olgunlaşmak için kendi doğal ritmine ve zamanına ihtiyacı vardır; bunu zorlamak sadece gerçeklikle anlamsız bir kavgaya girmektir. Sanatçı, hızlanmayı dileyen sabırsızlığa teslim olmak yerine, eserin kendi zamanında kendini açığa çıkarmasını "aktif bir uyanıklıkla" beklemeyi bilmelidir.
      25. Tertemiz Zihin (Acemi Zihniyle Bakabilmek)
      Bu kitapta yaratıcılığa dair anlatılmış en sarsıcı örneklerden biri tam da bu bölümde yer alır: AlphaGo
      . Go, üç bin yıllık bir Çin oyunudur ve satrançtan milyarlarca kat daha karmaşıktır. Bilim insanları bu oyunu insandan daha iyi oynayacak bir yapay zeka tasarladılar. Ama bu yapay zekaya (AlphaGo) geçmişteki ünlü ustaların hamlelerini "öğretmediler". Sadece oyunun temel kurallarını verip, yapay zekanın kendi kendine milyonlarca kez oynayarak öğrenmesini sağladılar
      .
      İkinci maçın 37. hamlesinde AlphaGo, üç bin yıllık Go tarihinde hiçbir insanın aklına gelmemiş, hatta usta yorumcuların "bu tam bir hata, çok saçma" dediği bir hamle yaptı
      . Ama oyun ilerledikçe bu hamlenin bir hata değil, tüm oyunu kazandıran deha dolu bir strateji olduğu anlaşıldı ve AlphaGo dünya şampiyonunu yendi
      . Peki yapay zekayı bu denli yenilikçi kılan neydi? Zekası mı? Hayır! Geçmişin yükünden ve "bu oyun böyle oynanır" dogmalarından tamamen bağımsız (bilgisiz) olmasıydı. İnsanların 3000 yıllık kültürel önyargılarıyla kirlenmemiş, tertemiz bir zihne sahipti
      .
      İşte yaratıcılıkta en ulaşılması zor mertebe bu **"Acemi Zihni"**dir (Beginner's Mind)
      . Ne kadar çok bilirsek, deneyimlerimiz o kadar çok bizi dar bir kalıba sokar. Sırf deneyimli olduğumuz için "Bu işe yaramaz" diyerek harika fırsatları çöpe atarız
      . Oysa müzik tarihinde Ramones grubu, kendi çapında basit, ana akım pop yaptıklarını zannederken müzik aletlerini çalmaktaki "bilgisizlikleri" yüzünden farkında bile olmadan Punk Rock gibi dünyayı sarsan yepyeni bir müzik türünü icat etmişlerdi
      .
      Çocuklar bu acemi zihnine doğuştan sahiptir
      . Onlar için geçmişin pişmanlığı ya da geleceğin endişesi yoktur; sadece "Şimdi açım, şimdi oynamak istiyorum" vardır
      . Toplumsal etiketleri yoktur. Denizi hiç görmemiş bir insanın denizi ilk gördüğündeki o nefes kesici hayreti ve saflığı düşünün. İşte biz de dünyayı ve eserimizi, o güne kadar öğrendiğimiz tüm kuralları unutup, ilk kez görüyormuş gibi saf bir bilgisizlikle (merakla) ele aldığımızda çığır açan o yeniliği bulabiliriz
      .
      Bu bölümün özü: Geçmiş deneyimlerimiz ve birikmiş bilgilerimiz, yenilikçi düşüncenin önünde kısıtlayıcı kalıplara dönüşür. Tıpkı AlphaGo yapay zekası veya bir çocuk gibi her türlü kuraldan, beklentiden ve öğretilmiş doğrulardan arınmış, saf bir "acemi zihniyle" sıfırdan bakabilmek, çığır açan eserler yaratmanın en güçlü anahtarıdır.
      26. İlham (Kozmik Şimşeği Yakalamak)
      Hepimizin diline pelesenk olmuş o meşhur kelime: İlham. Bazen öyle anlar olur ki, zihnimizde bir anda şimşek çakar! Günlerce, aylarca uğraşsak bulamayacağımız o kusursuz fikir, melodi ya da cümle adeta gökten inmişçesine tek bir nefeste içimize dolar
      .
      "İlham" (Inspiration) kelimesinin İngilizce kökeni olan inspirare, Latince "içine üflemek, nefes almak" demektir
      . Nasıl ki akciğerlerimizin yeni, temiz bir hava alabilmesi için önce içindeki eski havayı tamamen boşaltması gerekiyorsa; zihnimizin de evrenden gelecek bu yeni ilhamı alabilmesi için önce boşaltılması, o sürekli konuşan gevezeliğinden arındırılması gerekir
      . Evren sürekli olarak bize sinyaller gönderir ama biz içeride kendi dertlerimizle tıka basa doluysak, yeniye yer kalmaz.
      İlham, kapıyı çaldığında bütün programları iptal etmeyi gerektiren, son derece nazlı ve patronluk taslayan bir misafirdir. O aydınlanma geldiğinde, işin zor kısmına hiç aldırmadan, uykusuzluğa rağmen saatlerce akışta kalmak sanatçının en büyük yükümlülüğüdür
      . John Lennon bir keresinde şöyle demiştir: "Bir şarkıya başlandığında, bir oturuşta sonuna kadar yazılmalıdır."
       Çünkü o ilk kıvılcım en güçlü olduğu andır. Masadan kalkıp yarın devam ederim derseniz, o kozmik ilham uçar gider ve geri döndüğünüzde aynı ateşi yakamazsınız. İlk oturuşta çıkan kaba taslak, ne kadar kusurlu olursa olsun, sonradan mantıkla zorlanmış kusursuz bir metinden çok daha değerlidir
      .
      Bu bölümün özü: İlham, zihnimizi eski dertlerden ve düşüncelerden boşalttığımızda ansızın içeri dolan eşsiz bir kozmik aydınlanmadır. Zamanlaması bizim elimizde olmasa da, bu şimşek çaktığında onu ertelememek, tüm işleri bir kenara bırakıp o ilk güçlü enerjiyle eserin kaba taslağını sonuna kadar çıkarmak sanatçının temel sorumluluğudur.
      27. Alışkanlıklar (Gündelik Disiplinin Özgürlüğü)
      Kuralları yıkmaktan, ilham perilerinin peşinde savrulmaktan bahsettik ama tüm bu yaratıcı kaosu ayakta tutan asıl görünmez iskelet nedir? Disiplin ve sağlam alışkanlıklar.
      Rubin bu konuyu Amerikan kolej basketbolunun en efsanevi koçu John Wooden örneğiyle anlatır
      . Wooden, Amerika'nın en büyük yıldız oyuncuları takıma ilk katıldığında onları sahaya sürüp taktik çalıştırmak yerine hepsini sıraya dizer ve onlara ayakkabı ve çoraplarını nasıl düzgün giyeceklerini öğretirdi!
       Çorabın topukta kırışmaması gerektiğini, bağcıkların tek tek nasıl sıkılacağını gösterirdi
      . Çünkü sahada bir çorap kırışırsa oyuncunun ayağı su toplar, ayağı su toplarsa performansı düşer, performansı düşerse takım şampiyonluğu kaybeder. En küçük ayrıntılarda kurulan bu katı disiplin ve doğru alışkanlık, onlara art arda kırılması imkansız şampiyonluklar getirmişti
      .
      Sanatçılar için de kural aynıdır. Özgürlük ile disiplin birbirine zıt gibi görünse de aslında "İyi alışkanlıklar iyi eserler yaratır"
      . Herhangi bir şeyi yapma şekliniz, her şeyi yapma şeklinizdir
      . Gündelik hayatta kendinize sıkı bir rutin ve disiplin kurduğunuzda, zihninizin o kısıtlı "karar verme" enerjisini saçma sapan şeyler için harcamazsınız. Örneğin Albert Einstein her gün aynı gri takım elbiseyi giyerdi, besteci Erik Satie'nin dolabında yedi tane birbirinin aynısı kadife takım elbise vardı
      . Sabah ne giyeceklerini, ne yiyeceklerini düşünmeyerek zihinsel enerjilerini tamamen yaratıcılıklarına saklıyorlardı.
      Bazen de farkında olmadan sahip olduğumuz toksik alışkanlıklarımızla yüzleşmemiz gerekir. Kendimizi "Ben ancak şu marka fırçayla çizebilirim", "Sadece gece 3'te yağmur yağarken yazabilirim" ya da "Yeterince iyi değilim" gibi sahte hikayelere inandırmışızdır
      . Bir yüzücünün çok eskiden öğrendiği, onu zar zor suyun üstünde tutan ama aşırı yoran yanlış bir yüzme stiline alışması gibi, biz de bizi aşağı çeken bu sanatsal alışkanlıkları fark etmeli ve onları söküp atmalıyız
      .
      Bu bölümün özü: Yaratıcılık sadece sınırsız bir ilham havuzunda yüzmek değil, ayakkabı bağcıklarına kadar inen incelikli ve sıkı bir gündelik disiplin kurmaktır. Sanatçı, sıradan kararların (ne giyeceği, ne zaman çalışacağı) getirdiği zihinsel yorgunluğu otomatikleştirdiği sağlam alışkanlıklar sayesinde ortadan kaldırarak asıl enerjisini o büyük, özgürleştirici yaratım sürecine saklayabilir.
  - baslik: "Parça 3 · Tohumdan Üretime: Yaratıcı Sürecin Aşamaları (Bölüm 28-40)"
    icerik: |-
      Harika bir bölüme, yaratıcı sürecin o gizemli ve sancılı mutfağına giriyoruz. Rick Rubin’in "Yaratıcı Eylem" kitabındaki 3. Parça (Tohumdan Üretime), aklımıza düşen o ilk cılız fikrin nasıl ete kemiğe bürünüp dünyaya sunulduğunu adım adım inceliyor. Burada sadece teknik bir süreçten değil, zihinsel bir simyadan bahsediyoruz. Görevimiz sadece özetlemek değil; yazarın zihin dünyasına girip, oradaki fikirleri, örnekleri ve felsefeyi sanki karşılıklı kahve içip sohbet ediyormuşuz gibi samimi ama bir o kadar da derinlemesine yeniden anlatmak.
      İşte Tohumdan Üretime (Bölüm 28-40) uzanan o muazzam yolculuğun derinlemesine incelemesi:
      28. Tohumlar (Fikirleri Toplama Aşaması)
      Yaratıcı sürecin ilk durağına "Tohumlar" diyoruz. Bir çiftçinin tarlaya ekmek için elindeki en iyi tohumları bir araya getirmesi gibi, sanatçı da bu ilk aşamada ilgisini çeken, onda bir kıpırtı uyandıran her şeyi tamamen açık bir zihinle toplamaya başlar. Yazarın burada çok net bir iddiası var: Bu aşamada asla yargılamamalı, elemeye gitmemeli ve tohumları birbiriyle kıyaslamamalısınız.
      Diyelim ki bir müzisyensiniz; sizin tohumunuz mırıldandığınız kısacık bir melodi, basit bir bas dizilimi veya bir ritim olabilir. Bir yazarsanız bu tohum zihninize düşen tek bir cümle, tuhaf bir karakter taslağı, bir mekan betimlemesi veya olay örgüsünün sadece minicik bir parçası olabilir. Bir mimar içinse belli bir malzemenin dokusu ya da mekansal bir özellik tohum işlevi görebilir.
      Peki bu tohumları nasıl buluruz? Rubin'in burada kullandığı analoji çok aydınlatıcıdır: Tohum toplamak aslında ter dökerek, kas gücüyle yapılan bir "arama" eylemi değildir. Tıpkı bir balıkçı gibi suyun başına gidersiniz, oltanıza yeminizi takar, oltayı suya atar ve sadece sabırla beklersiniz. Suyun altındaki balıkları (yani fikirleri) kontrol edemezsiniz, onları zorla oltanıza çekemezsiniz. Yapabileceğiniz tek şey, o an orada "mevcut olmak" ve antenlerinizi açık tutmaktır. Sanatçı, evrenin sonsuz denizine oltasını atan kişidir. İlhamın ne zaman geleceğini seçemeyiz ama geldiğinde onu yakalamak için orada, uyanık bir farkındalık içinde bekleyebiliriz.
      Ancak burada sanatçıların en sık düştüğü devasa bir tuzak vardır: Topladığımız tohumlar hakkında "erkenden sonuçlar çıkarmak". Bir tohumu elinize alıp "Bundan çok iyi bir roman olmaz" diyerek onu çöpe atmak, o tohumun içinde barındırdığı gerçek potansiyelin ortaya çıkmasını en baştan engeller. Başlangıçta son derece sönük, cılız ve "işe yaramaz" görünen bir fikir, ileride en büyük başyapıtınıza dönüşebilir. Ya da tam tersi; ilk başta sizi havalara uçuran çok heyecan verici bir tohum, ileride hiçbir meyve vermeyebilir. Başlangıç aşaması, bunu bilmek için çok erkendir. Sulanmayan bir tohumun meyve verme kapasitesini asla bilemezsiniz.
      Bu yüzden Rubin, "bolluk yaratmayı" tavsiye eder. Elinizde ne kadar çok tohum olursa, onları kendi içlerinde değerlendirmeniz o kadar kolaylaşır. Diyelim ki yüz tane tohum topladınız. Bu devasa yığın içinde 54 numaralı tohumun sizde diğerlerinden bambaşka bir yankı uyandırdığını, içinizde farklı bir rezonans yarattığını çok daha net görebilirsiniz. Eğer elinizde sadece iki tohum olsaydı, bu kıyaslamayı yapacak bağlamdan yoksun kalırdınız.
      Peki, onca tohum arasından hangisinin üzerine eğileceğimize nasıl karar vereceğiz? Zihnimizle mi? Hayır. Rubin, kararı "heyecanımıza ve bedensel tepkilerimize" bırakmamızı söyler. Doğru tohum, size kendini fiziksel bir kıpırtıyla belli eder. İlginiz canlanır, merakınız uyanır, içiniz kıpır kıpır olur ve o tohumun neye dönüşeceğini görmek için sabırsızlanırsınız. Zihninizin devreye girip "Bu satar mı, bu mantıklı mı?" diyeceği zaman ileride gelecektir; ancak tohum aşamasında tek rehberiniz içinizdeki o çocuksu heyecan ve şevk olmalıdır.
      Bu bölümün özü: Yaratıcı sürecin ilk adımı olan "Tohum" aşaması; fikirleri mantık süzgecinden geçirip erkenden yargılamadan, tamamen açık bir zihinle ve bolluk içinde toplama eylemidir. Hangi tohumun görkemli bir esere dönüşeceği başlangıçta bilinemeyeceğinden, sanatçı sadece oltasını suya atıp beklemeli ve kendisine bedensel bir heyecan ve şevk veren fikirlerin yeşermesine alan tanımalıdır.
      29. Deneme Yanılma (Kuralsız Oyun Alanı)
      Tohumlarımızı topladık. Peki şimdi ne yapacağız? Onları alıp hemen katı bir plan çerçevesinde nihai esere mi dönüştüreceğiz? Hayır. Rubin'in "Deneme Yanılma" (Experimentation) adını verdiği bu ikinci aşama, tohumların nasıl gelişmek istediğini bulmak için çeşitli olasılıklarla, kombinasyonlarla ve "Acaba şöyle yapsam ne olur?" sorularıyla oynadığımız, tamamen kuralsız bir oyun alanıdır.
      Bu aşamayı, bir bahçıvanın tohumların büyümesi için en uygun koşulları (güneş, su, toprak) bulmaya çalışması gibi düşünebilirsiniz. En güzel yanı şudur: Bu aşamada riske atılan hiçbir şey yoktur! Kaybedecek bir şeyiniz olmadığı için uymanız gereken hiçbir kural da yoktur. Amacımız seçenekleri elemek değil, eseri farklı yönlere çekecek "yeni olasılıklar" yaratmaktır.
      Yazar, bu kuralsız denemelerin gücünü sinema ve tiyatrodan bir örnekle açıklar: Shakespeare'in oyunlarını düşünün. O klasik metinler (tohumlar), bugüne kadar New York sokak çetelerinden tutun (West Side Story), Japon samuraylarına (Akira Kurosawa filmleri), Santa Monica sahillerinden uzayın derinliklerine kadar bambaşka temalar, dönemler ve gerçeklikler içine uyarlanmıştır. Bir tohumun sınırları yoktur; onu denemeden, hangi ortamda en iyi serpileceğini bilemezsiniz. Bir şarkıcı bir besteyi dinler ve anında harika bir söz yazar. Başka bir şarkıcı aynı besteyi bin kere dinler ama ortaya hiçbir şey çıkmaz. Bu, o besteyi "yanlış" yapmaz, sadece o tohumun o ortamda yeşermediğini gösterir.
      Bu aşamanın en büyüleyici yanlarından biri, "beklenmedik tesadüflere ve hatalara" kucak açmasıdır. İnsanlık tarihi, belirli bir hedefe ulaşmaya çalışırken "yanlışlıkla" bulunan devasa buluşlarla doludur. Rubin bunu tarihi kanıtlarla destekler: Barut, penisilin, plastik, kalp pili ve hatta yapışkanlı not kağıtları (Post-it)... Bunların hiçbiri başlangıçta hedeflenen şeyler değildi; hepsi deneme yanılma aşamasındaki kazalar ve sürprizler sonucunda ortaya çıkmıştır. Eğer bu mucitler, kendi katı hedeflerine saplanıp kalarak gözlerinin önünde beliren bu şaşırtıcı "hataları" görmezden gelselerdi, dünya bu muazzam buluşlardan mahrum kalırdı.
      İşte bu yüzden sanatçı, tohuma müdahale etmekten kaçınmalıdır. Fikrinizi önceden tasarladığınız, zihninizde dondurduğunuz katı bir hedefe doğru zorlamak (dikta etmek) yerine, tıpkı güneşe doğru kendi doğal yolunu bulan bir bitki gibi eserin kendi yolunu izlemesine izin verin. Sanatçı burada bir diktatör değil, bir kaşiftir. "Sadece bir soru işaretiyle yola çıkın ve keşif yolculuğuna kendinizi bırakın."
      Ayrıca, bazı tohumlar inatla yeşermeyebilir. Enerjiniz düşer, zorlanırsınız. Rubin, böyle durumlarda tohumun "kötü" olduğunu düşünmememizi söyler. Doğada bazı tohumlar, büyümelerine en elverişli mevsimi bekleyerek uykuya yatarlar. Sanatta da henüz zamanı gelmemiş fikirler vardır. Gelişmeyen tohumları çöpe atmak yerine onları saklayın; belki de başka bir mevsimde, siz başka bir insana dönüştüğünüzde anında filizleneceklerdir.
      Bu bölümün özü: Deneme Yanılma aşaması, toplanan fikirlerin nasıl gelişmek istediğini görmek için kuralsızca test edildiği, sanatçının sonucu kontrol etmek yerine sürece teslim olduğu bir keşif evresidir. Barutun veya penisilinin kazara bulunması gibi, eserin gerçek potansiyeli çoğu zaman planlanmış hedeflerde değil, bu serbest oyun alanındaki sürprizlerde, tesadüflerde ve "yanlış" yollara sapmalarda gizlidir.
      30. Her Şeyi Deneyin (Kötü Fikir Yoktur)
      Mantık dünyasında kurallar çok basittir: Mavi ile sarıyı karıştırırsanız ortaya yeşil çıkar. İki artı iki dört eder. Hayatın olağan akışında sonuçlar öngörülebilir. Ancak söz konusu bir sanat eseri yaratmak olduğunda, parçaların toplamı her zaman beklentileri yıkar. Dün çok iyi işleyen bir formül, bugün elinizde patlayabilir. Çünkü hayal gücü ile fiziksel gerçeklik arasında aşılması gereken devasa bir uçurum vardır.
      Zihnimizde kusursuz, pırıl pırıl parlayan bir fikir, gerçeğe döküldüğünde (boyaya, kelimeye, notaya dönüştüğünde) korkunç derecede işe yaramaz olabilir. Tam tersine, zihnimizde son derece sıradan, hatta "kötü" gibi duran bir fikir, uygulamaya geçtiğinde bugüne kadar yaptığınız en iyi şeye dönüşebilir.
      İşte Rick Rubin'in bu bölümdeki can alıcı kuralı şudur: Bir fikrin gerçekten işe yarayıp yaramadığını anlamanın tek yolu, onu doğrudan fiziksel olarak sınamaktır. Aklınızda "Bu işe yaramaz" diyerek bir fikri daha doğmadan öldürmek, yaratıcılığa vurulmuş en büyük darbedir. Hedefiniz gerçekten "en iyi fikre" ulaşmaksa, aklınıza gelen her şeyi denemek zorundasınızdır.
      Kendinize zihninizin sınırlarını zorlayan uçuk sorular sorun: "Ya bu yazdığım cümledeki tüm zarfları atarsam ne olur?", "Şarkıdaki en gürültülü yeri fısıltıya dönüştürürsem ne olur?", "Eğer bu resim birinin hayatında gördüğü ilk resim olsaydı nasıl bir renk kullanırdım?" Uçlarda gezinin. "Kötü fikir yoktur" kuralını geçici bir yasa olarak benimseyin.
      Bu kural özellikle müzik grupları gibi birden fazla kişinin işbirliği yaptığı çalışmalarda hayati önem taşır. Bir grupta bir fikir ortaya atıldığında, insanlar genellikle kendi deneyimlerine dayanarak o fikrin nasıl tınlayacağını zihinlerinde canlandırır ve "Hayır, o akor oraya uymaz, çok kötü olur" diyerek sözlü bir tartışmaya girerler. Rubin buna şiddetle karşı çıkar: Bir başkasının zihninde tam olarak ne hayal ettiğini bilmeniz imkansızdır! Kendi fikrimizin bile işe yarayıp yaramayacağını öngöremezken, başkasının hayalini nasıl yargılayabiliriz?
      Bu yüzden, fikirleri zihinsel veya "sözel düzlemde" tartışarak çürütmek yerine, onları derhal "fiziksel dünyaya" taşıyın. Fikri canlandırın, demosu yapın, maketini oluşturun. Fikrin haklı olup olmadığını tartışarak değil, onu duyarak, görerek, dokunarak test edin. Hatta o fikri ilk ortaya atan kişinin, fikri tam olarak kendi hayal ettiği gibi uygulanana kadar sürece nezaret etmesine izin verin. Fikir fiziksel dünyada vücut bulduğunda, itiraz eden kişi bile "Vay canına, aklındaki bu muydu? Bu gerçekten harikaymış!" diyebilir. Veya gerçekten işe yaramadığı açıkça görülür ve herkes bir şey öğrenmiş olur.
      Deneme sürecinde hata yapmak diye bir şey yoktur. Labirentte çıkışı ararken girdiğiniz her "yanlış" yol (çıkmaz sokak), sizi aslında doğru yola bir adım daha yaklaştırır. Sanat eserini zorla kendi kalıbınıza sokmaya çalışmak, bir meşe palamuduna "Sadece benim istediğim yöne doğru büyüyeceksin" diye bağırmak kadar akıl dışıdır.
      Bu bölümün özü: Hayal gücü ile gerçeklik arasındaki uçurum ancak fikirlerin fiziksel dünyada doğrudan test edilmesiyle aşılabilir; bu nedenle "kötü fikir yoktur" ilkesi benimsenmelidir. Seçenekleri zihinsel bir tartışmayla elemek yerine maketini yaparak veya canlandırarak deneyimlemek, yanlış yollara sapmayı bir zaman kaybı değil, bizi asıl çözüme götüren güvenilir adımlar haline getirir.
      31. Üretim (Duvar Örme Zamanı)
      Tohumu bulduk, denemelerimizi yaptık, kuralsızca oynadık. Artık tohumun genetik şifresi kırılmış, eserin neye dönüşmek istediği, hangi biçimi alacağı aşağı yukarı anlaşılmıştır. İşte şimdi, oyun alanından çıkıp "Üretim" (Production) aşamasına geçiyoruz.
      Rubin bu evreyi çok somut bir eylemle tanımlıyor: Eserin inşa edilmesi, el emeğiyle duvarın örülmesi. Sınırların konulmadığı o açık uçlu keşif yolculuğu bitmiş, yönümüz açıkça belli olmuştur. Eskizdeki çizgiler artık çizilmiştir, şimdi o çizgilerin içini doğru renklerle, doğru dokularla doldurma zamanıdır.
      İlginçtir ki, yaratıcı sürecin bu aşaması çoğu sanatçı için işin en "cazip olmayan", en yorucu ve can sıkıcı kısmıdır. Neden mi? Çünkü burada ilhamın o sihirli şimşeklerinden çok, bir amele gibi oturup ter dökmek, sorun çözmek ve saatlerce ince işçilik yapmak gerekir. Birçok hevesli sanatçı yolculuğun tam da bu noktasında pes eder. Çünkü engin ve rahat düzlüğü geride bırakmışlar, önlerinde yüz kat yüksekliğinde, sarp ve dolambaçlı bir merdiven belirmiştir. İnsan doğası gereği, o zorlu tırmanışı yapmak yerine geri dönüp yeni bir "parlak fikir" (başının üzerinde yanan ampul) bulmanın o zahmetsiz heyecanını kovalamayı tercih edebilir. Ancak Rubin çok net bir gerçeği hatırlatır: İlk iki aşama (tohum ve deneme) ne kadar parlak olursa olsun, eserin el emeğiyle inşa edilip tamamlanmadığı sürece hiçbir işlevi ve anlamı yoktur. Sanat ancak üretildiğinde var olur.
      Peki, onca deneme arasından nihai eseri hangisinin üzerine inşa edeceğimize nasıl karar vereceğiz? Cevap yine içsel pusulamızdır: Heyecanın izlerini takip etmek. Bazen birden fazla deneme size ilginç gelebilir. Rubin, böyle durumlarda aynı anda birden fazla deneme üzerinde inşaata başlamayı önerir. Neden mi? Çünkü sadece tek bir projeye saplanıp kaldığınızda vizyonunuz daralır; esere o kadar çok yaklaşırsınız ki, doğru yönde ilerleyip ilerlemediğinizi artık objektif olarak göremezsiniz (körleşme). Ancak birkaç proje arasında geçiş yaparak çalıştığınızda, zihninizin farklı kasları çalışır ve bir projeden uzaklaşıp diğerine döndüğünüzde, tıkanıklıkları aşacak o taze bakış açısını çok daha kolay yakalarsınız.
      Üretim aşamasının sadece "ekleme" (inşa etme) süreci olduğunu düşünmek büyük bir hatadır. Bu aşama aynı zamanda acımasız bir "yıkım ve budama" sürecidir. Eseri güçlendirmek için, sadece detay eklemeyiz; aynı zamanda dikkati dağıtan, eserin özüne hizmet etmeyen fazlalıkları, süslemeleri ve gereksiz ağırlıkları da kesip atarız.
      Ayrıca Rubin, burada üretim ile ilgili zihin açıcı bir perspektif sunar: Üretim aşamasını illa sizin fiziksel olarak ellerinizle yapmanız şart mıdır? Hayır. Bazen sanatçı sadece bir mimar gibi konsepti tasarlar, üretimi başkalarına devreder. Andy Warhol'un dünyaca ünlü pek çok tablosu (ipek baskıları), kendi atölyesindeki asistanları ve makineler tarafından fiziksel olarak üretilmiştir; ancak fikir ve eser sahipliği tamamen Warhol'a aittir. 60'ların ünlü bazı rock grupları, (örneğin The Beach Boys'un Pet Sounds dönemi veya The Monkees), kendi albümlerindeki enstrümanları kendileri çalmamış, arkada usta stüdyo müzisyenleri (The Wrecking Crew) kullanılmıştır. Önemli olan, eseri en kusursuz ve en doğru haline ulaştırmak için ne gerekiyorsa onu yapmaya açık olmaktır. İster duvarı bizzat kendi ellerinizle örün, ister usta bir orkestra şefi gibi inşaatı yönetin; amaç eserin potansiyelini maksimize etmektir.
      Bu bölümün özü: Üretim aşaması; keşif evresinde sınırları çizilen eserin el emeğiyle, tıpkı tuğla üstüne tuğla koyar gibi somutlaştırıldığı, ter ve disiplin gerektiren inşaa sürecidir. Bu aşama sadece yeni detaylar eklemeyi değil, aynı zamanda hedeften saptıran fazlalıkları acımasızca budamayı ve eserin öz potansiyelini ortaya çıkarmak için bazen yapım işini dışarıya (başka ustalara) devretmeyi bile içerir.
      32. İvme (Momentumu Korumak ve Demo-itis)
      Üretim aşamasına girdik, duvarı örmeye başladık. Ancak bu aşamada zaman kısıtlaması olmadığında, işler sonsuza dek uzayabilir ve proje elinizde çürüyebilir. İşte bu yüzden Rubin, "İvme" (Momentum) adını verdiği bu bölümde, süreci canlı tutmanın hayati önemine değinir.
      Gerekli tüm verileri topladıysanız ve vizyonunuz netleştiyse, artık işi tamamlamak için kendinize (gerçek ya da psikolojik) "mühletler" (son teslim tarihleri) belirlemek inanılmaz faydalıdır. Çünkü artık seçenekleriniz sınırsız değildir; temel unsurlar hazırdır ve yapılması gereken iş az çok mekanikleşmiştir. Bina inşaatından örnek verirsek: Binanın çelik iskeleti (özü) dikilmiştir; artık sadece camların ne renk olacağını veya duvarların neyle kaplanacağını seçiyorsunuzdur. Detaylar önemlidir ama eserin bütünlüğünü mahvedemez. Bu noktada kesin teslim tarihleri koymak, eseri sonsuza dek kurcalamaktan sizi kurtarır. (Ancak Rubin uyarır: Bu teslim tarihleri dışarıdan gelen ticari baskılarla değil, tamamen sanatçının kendini motive etmesi için koyduğu içsel sınırlar olmalıdır.)
      Üretim aşamasında bir ivme (momentum) yakaladığınızda, yazarın altın bir kuralı vardır: Asla durmayın ve tamamlanmış bir ilk taslak ortaya çıkarmaya gayret edin. Diyelim ki bir şarkı yazıyorsunuz veya bir kitap bölümü kaleme alıyorsunuz ve ortasında sizi çok zorlayan, içinden çıkamadığınız bir engele (bir duvara) tosladınız. Çoğu insan o engele takılıp kalır ve projenin geri kalanını dondurur. Oysa yapmanız gereken şey o takıldığınız engeli atlamak ve projenin diğer kısımlarını yazmaya (inşa etmeye) devam etmektir.
      Bunu, iki tarafı belli olan bir köprüyü inşa etmeye benzetir yazar. Eğer başını ve sonunu inşa ederseniz, ortadaki boşluğu nasıl dolduracağınızı çok daha kolay görürsünüz. Projenin kalan %90'ı tamamlandığında, eksik olan o küçük parçayı yerine yerleştirmek (çözmek), boş bir masaya bakıp parçanın yerini bulmaya çalışmaktan bin kat daha kolaydır. Üstelik işin sonuna yaklaştığınızı (sadece %5'lik bir kısım kaldığını) bilmek, o zor parçayı tamamlamak için size müthiş bir psikolojik motivasyon ve ivme sağlar.
      Üretim evresinde ivmeyi öldüren ve projeyi zehirleyen çok sinsi bir hastalık daha vardır: Sanatçıların yakalandığı "Demo-itis". (Demo hastalığı). Demo-itis nedir? Bir sanatçının, yarattığı eserin ilk taslağına (demosuna) o kadar uzun süre maruz kalıp sıkı sıkıya bağlanmasıdır ki, o taslağın kusurlu halini eserin "nihai ve doğru versiyonu" olarak beynine kazımasıdır. Bir müzisyen bir şarkıyı 5 dakikada kabataslak kaydeder, sonra evde arabada o bozuk demoyu binlerce kez dinler. Sonunda stüdyoya girip şarkıyı mükemmel bir şekilde, tam potansiyeliyle çaldığında, zihni o ilk bozuk versiyona o kadar alışmıştır ki, yeni ve profesyonel olan her değişiklik kulağına "yanlış ve kabul edilemez" gelir. Geliştirilmemiş versiyona aşırı bağlanmak, eserin gerçek potansiyelini öldürür.
      Bu hastalıktan kurtulmanın çok basit ama katı bir yöntemi vardır: Eseri iyileştirmek için aktif olarak çalışmadığınız sürece, onu dinlemekten, okumaktan, arkadaşlarınıza göstermekten kesinlikle kaçının. Eseri yapın, başından kalkın ve o yarım haliyle sürekli haşır neşir olmayın. Onu beyninize nihai standart olarak kazımayın ki, eserin olgunlaşması ve değişmesi için alan kalsın.
      Son olarak bu bölümde sanatçıları yıkan bir uçurumdan bahsedilir: Zihnimizdeki vizyon ile fiziksel becerimiz arasındaki fark. Hayalinizde duyduğunuz davul ritmi o kadar muazzam ve karmaşıktır ki, bedeniniz bunu çalabilecek ustalığa sahip değildir. İmkansız bir uçurumla karşılaşırsınız. Ancak Rubin, bu "yetersizliğin" aslında büyük bir lütuf olabileceğini söyler. Hayalinizdeki o kusursuz (!) versiyona ulaşamamak, sizi fiziksel olarak yapabildiğiniz çok daha "pratik, gerçekçi ve belki de çok daha orijinal" bir versiyona yönlendirir. Eksik beceriniz, eseri tam da olması gerektiği (size has) o eşsiz forma sokar.
      Bu bölümün özü: Üretim sürecinde ivmeyi kaybetmemek için zorlanılan kısımları atlayıp eserin bütününe odaklanmak (ilk taslağı hızla bitirmek) en etkili stratejidir. Sanatçı, projenin ilk kabataslak haline duygusal olarak aşırı bağlanma hastalığından (demo-itis) kaçınmalı ve zihnindeki o ulaşılamaz mükemmellik vizyonuyla fiziksel yetenekleri arasındaki uçurumu eseri özgün kılan bir avantaj olarak görmelidir.
      33. Bakış Açısı (Benlik Prizmamız)
      Neden sanat yaparız? İnsanlara faydalı olmak için mi? Onlara bir şeyler öğretmek için mi? Bir sorunu çözmek için mi?
      Rick Rubin'in "Bakış Açısı" bölümünde verdiği cevap sanata bakışınızı kökünden değiştirecek niteliktedir: Sanatın amacı ulaşılmaz bir mükemmellik yaratmak ya da insanlara 'faydalı' bir şey sunmak değildir. Sanatın tek amacı, kim olduğumuzu ve dünyayı kendi eşsiz süzgecimizden nasıl gördüğümüzü olduğu gibi paylaşmaktır.
      Bilim ya da teknoloji ürettiğinizde ortaya herkesin kullanabileceği "faydalı" bir alet (mesela bir telefon ya da aşı) çıkarmayı hedeflersiniz. Ancak sanat eseri yaratırken dışarıya hizmet etmeyiz; hayat yolculuğumuzun neresinde olduğumuzu ifade etmek için içimizi dökeriz. Burada ünlü psikolog Carl Rogers'ın efsanevi sözü devreye girer: "En kişisel olan, en evrensel olandır." (What is most personal is most universal). Sizin kendi ruhunuzda hissettiğiniz en mahrem, en tuhaf, en bencilce duyguyu eserinizde anlattığınızda, dünyanın öbür ucundaki bir izleyici o esere bakıp "Aman Tanrım, ben de tam olarak böyle hissediyordum ama kelimelere dökemiyordum!" der. Sanat, sanatçının eşsiz bakış açısıyla insanların kendi gizli yansımalarını gördükleri devasa bir ayna yaratır. Bir eseri değerli kılan şey çizim yeteneği ya da gitar virtüözlüğü değil, tamamen sanatçının o eşsiz "öznel bakış açısıdır".
      Peki kendi "bakış açımızı" nasıl bulacağız? Rubin'e göre bakış açınızı bulmak için oturup felsefi bir düşünceye dalmanız, "Benim vizyonum şudur" diye bir formül yazmanız gerekmez. Hatta bunu bilinçli olarak yapmaya çalışmak, eserinizin yapmacık ve sahte (yanlış temsil) olmasına neden olur. Ünlü yazar Wayne Dyer'ın harika bir portakal analojisi vardır: Bir portakalı sıktığınızda içinden ne çıkar? Portakal suyu. Çünkü içinde o vardır. Sıkılan kişi siz olduğunuzda da, dışarıya sadece ve sadece içinizdeki gerçek neyse o çıkar. Siz isteseniz de istemeseniz de, bilinçaltınız, geçmişiniz, inançlarınız ve o eşsiz bakış açınız; kullandığınız renge, bastığınız notaya, seçtiğiniz kelimeye zaten kendiliğinden sızar. Onu zorlamanıza gerek yoktur; o zaten oradadır.
      Sanatçılar genellikle "İzleyici bunu anlar mı?", "Acaba mesajım doğru geçer mi?" diye büyük bir anksiyete yaşarlar. Yazar bizi uyarır: Çoğu insan kendilerine ne düşünmeleri gerektiğinin dikte edilmesinden nefret eder. Siz eserinizi en samimi halinizle ortaya koyarsınız ve eserin geri kalan %50'sini izleyici kendi hayat tecrübesiyle (kendi süzgeciyle) tamamlar. Herkes eserinizi beğenmek zorunda değildir. Hatta bir adım ileri gidelim: "Herkes eserinizi beğeniyorsa, muhtemelen yeterince ileri gitmemişsinizdir" ve fazla sıradan, suya sabuna dokunmayan bir iş yapmışsınızdır.
      Başkalarına benzemeye çalışmak sanatta bir intihardır. Kendi iç sesinize değer verin. İnsanlar uyum sağlamayı, "moda" olanı yapmayı çok severler. Beatles efsanesini düşünün: Beatles'ın yaptığı müzik o döneme göre çok farklıydı. Ancak onlar masa etrafında toplanıp "Gelin farklı bir şey yapalım, insanları şaşırtalım" diyerek farklı olmadılar. Sadece kendi içlerinden geldiği gibi, kendi doğal halleriyle müzik yaptılar ve bu doğallık dünyayı kökünden sarstı.
      Elbette sevdiğiniz sanatçılardan ilham almak, hatta onların tarzını (bakış açısını) taklit etmeye çalışmak da sanatta meşru ve harika bir keşif yoludur. Ancak bir başkasının bakış açısını "birebir" taklit etmeniz fiziksel olarak imkansızdır. Kendi kusurlarınız ve kendi prizmanız devreye girer. Yönetmen Sergio Leone, o çok sevdiği 1940'lar ve 50'lerin klasik Amerikan Western (kovboy) filmlerini taklit edip aynısını çekmek istemiştir. Ancak onun İtalyan kültürel süzgecinden (bakış açısından) geçen bu çaba, klasik bir Amerikan westerni olmak yerine, sinema tarihine "Spagetti Western" olarak geçen, bambaşka, sürreal, efsanevi yepyeni bir tür yaratmıştır. İtalyan bir yönetmenin Amerikan kültürünü taklit etme "kusuru", sinemayı sonsuza dek değiştirmiştir.
      Bu bölümün özü: Sanatın amacı dış dünyaya faydalı bir mesaj vermek ya da herkesi memnun etmek değil, sanatçının kendi mahrem ve eşsiz bakış açısını (benlik prizmasını) tüm çıplaklığıyla paylaşmasıdır. Kişisel olan en evrensel olandır; sanatçı, izleyicinin ne düşüneceğini kontrol etmeye çalışmaktan vazgeçtiğinde ve sadece kendi içsel hakikatini samimiyetle "sıktığında", eser izleyicide çok daha derin ve öngörülemez bir yankı uyandırır.
      34. Tekdüzeliği Kırmak (Tıkanıklığı Aşan Egzersizler)
      İşte kitabın en pratik, en uygulanabilir ve stüdyoda bizzat test edilmiş taktiklerinin verildiği bölüm. Üretim aşamasındasınız, saatlerdir, günlerdir veya aylardır eser üzerinde çalışıyorsunuz ve duvara tosladınız. İlham yok, ilerleme yok, projenin o ilk günkü heyecanından eser yok. İçinde bulunduğunuz bu boğucu "tekdüzeliği" (rutini) nasıl kıracaksınız?
      Rick Rubin, sanatçının eserle sanki ilk kez karşılaşıyormuş gibi heyecanını tazelemesi için zihni "hackleyen" bir dizi şaşırtıcı ve oyunbaz alıştırma (değişken) önerir. Çıkmazda olun ya da olmayın, bu yöntemler yaratıcılığınızı anında ateşler:
      Küçük Adımlar (Baby Steps): Üstesinden gelinemez, devasa görünen bir proje sizi felç ediyorsa, görevi saçma derecede küçültün. Tıkanmış bir müzisyeni harekete geçirmek için Rubin ona "Her gün sadece tek bir satır yaz" der. Yazdığının iyi ya da kötü olmasının hiçbir önemi yoktur, tek kural bir satır yazmaktır. Bu ufacık görev, o tıkanmış baraj kapağını çatlatır ve müzisyen kısa süre sonra eski hızına kavuşup bestelerini tamamlar.
      Ortamınızı Değiştirin: Hep aynı odada, aynı sandalyede çalışıyorsanız bedeninizi şaşırtın. Stüdyoda ışıkları tamamen kapatıp zifiri karanlıkta şarkı söylemek (veya çalmak) bilincinizde ani bir değişim yaratır. Gece çalışan biriyseniz sabahın köründe çalışmayı deneyin. Ya da çok daha çılgıncası: Rubin'in bir şarkıcıya farklı bir performans yakalaması için "baş aşağı asılı durarak" şarkı söyletmesi gibi fiziksel sınırları zorlayın!
      Önem Derecesiyle Oynayın: Psikolojinizi manipüle edin. Grubunuza "Sanki bu şarkıyı çalmadan önceki son çalışımız, dünyadaki son performansımızmış gibi düşünün" derseniz, o stres ve ciddiyetle ortaya muazzam, vahşi bir kayıt çıkabilir. Ya da tam tersi, ölüm kalım meselesine dönmüş bir kayıtta "Bu sadece basit bir prova, eğlenmenize bakın" diyerek üzerlerindeki o gergin baskıyı kaldırıp en doğal performanslarını yakalayabilirsiniz.
      İzleyici Toplayın: Sanat performansınız sırasında odaya sadece bağlantısı olmayan "tek bir yabancı" seyirci bile çağırmak, sanatçının tavrını anında değiştirir. İzlenmek kimisini abartılı oynamaya, kimisini daha ciddi olmaya iter. Performans anındaki yalnızlığı kırmak yeni bir ruh hali getirir.
      Bağlamı Değiştirin: Tıkanıklık anında eserin hikayesini (kimin için olduğunu) beyninizde değiştirin. Yıllardır bir kadına söylenen romantik bir aşk şarkısı gibi okunan ama ruhu eksik olan bir şarkı için şarkıcıya "Bunu bir aşk şarkısı gibi değil, Tanrı'ya yazılmış bir ilahiymiş gibi söyle" derseniz, aynı sözler bambaşka, çok daha ulvi ve tüyler ürpertici bir duyguyla dışarı çıkar.
      Perspektifi (Duyuları) Değiştirin: Rubin stüdyoda şarkıcıların kulaklığına giden sesi bazen kasıtlı olarak "son seviyeye kadar" açar. Kulaklıkta ses o kadar yüksek patlar ki, müzisyen kendi sesini dengelemek için "çok yumuşak, hatta fısıltıyla" şarkı söylemek zorunda kalır. Tam tersi, çok cılız söyleyen birini gaza getirmek için kulaklıktaki sesini tamamen kısar, böylece şarkıcı müziği bastırabilmek için var gücüyle, bağırarak söylemek zorunda kalır. Sizi doğal olarak istediğiniz sonuca itecek çevreyi yaratın.
      Başkası İçin Yazın (Kişisellikten Çıkın): Bir söz yazarına "En sevdiğin sanatçı (örneğin Aretha Franklin) senden albümü için bir şarkı isteseydi nasıl yazardın?" diye sorun. Bu, egoyu ve "bu benim şarkım" korkusunu aradan çıkarıp sanatçıyı inanılmaz özgürleştirir. Ünlü şarkı (You Make Me Feel Like) A Natural Woman, beyaz ve kadın ruhundan çok uzak görünen Gerry Goffin ve Carole King tarafından Aretha Franklin için işte bu "başkası için yazma" taktiğiyle yaratılmıştır. Bazen kendinize tamamen zıt karakterde (örneğin çok gösterişçi bir şarkıcıya, çok utangaç bir sanatçı profili biçerek) eser üretmesini istemek yepyeni yollar açar.
      İmgelem Kullanın: Bir klavye solosu çok sönük kalıyorsa, "Daha görkemli çal" gibi teknik bir yönlendirme işe yaramaz. Onun yerine müzisyenin beynine bir sinema sahnesi sokun: "Nefes kesici yeşil bir tepede az önce devasa bir savaş bitmiş. Dumanlar yavaşça yükseliyor ve yerde yaralı askerler yardım bekliyor... Şimdi, bana bu sahnenin solosunu çal." Bu görsel hikaye, notaların bir anda duyguyla dolup taşmasını sağlar.
      Bilgiyi Kısıtlayın: Grubunuza çalacakları şarkının ritmini, hızını veya nasıl bir tarzda olduğunu asla söylemeyin. Onlara sadece "akorları" kağıda yazıp verin ve "Çalın" deyin. Bilgiyi bu kadar kısıtlamak, müzisyenlerin yaratıcılığını %100'e çıkarır. Eski, sıkıcı demoyu taklit etmek yerine, tamamen kendilerinden bir şeyler katarak şarkıyı hayal edemeyeceğiniz bambaşka bir boyuta taşırlar.
      Bu bölümün özü: Yaratıcı süreçte bir çıkmaza veya rutin körlüğüne düşüldüğünde; çalışma ortamını, ışığı, kulaklıktaki sesi veya eserin bağlamını aniden değiştiren, zihni kendi kısıtlayıcı alışkanlıklarından söküp çıkaran oyunbaz egzersizler, tıkanıklığı aşmanın ve sanatçının içindeki o taze enerjiyi (beklenmedik performansları) yeniden tetiklemenin en etkili yoludur.
      35. Tamamlama (Bitiş Çizgisini Kabul Etmek)
      Uzun, yorucu ve büyülü bir sürecin ardından nihayet o an gelmiştir. Tohumu bulduk, denedik, inşa ettik, budadık. Eklenecek veya çıkarılacak tek bir nota, tek bir virgül, tek bir fırça darbesi kalmamıştır. Eserin özü tüm çıplaklığıyla karşımızdadır. İşte bu "Tamamlama" (Completion) aşamasıdır.
      Bu aşama, keşif (oyun) ve inşa (amelelik) evresinin geride kaldığı, esere en incelikli nihai formunu verip onu dünyaya, izleyicinin karşısına çıkarmaya hazırladığımız safhadır (renk düzenlemesi, son miks, son okuma vs.). Bu tıpkı montaj hattındaki son durak gibidir; eser standartlarınızı karşılıyorsa onayınızı verir ve onu serbest bırakırsınız.
      Ancak bu noktada sanatçı körleşmesi doruk noktasındadır. Artık esere objektif bakamazsınız. Bu yüzden, tamamlanmasına çok az kaldığını düşündüğünüz eserinizi "ikinci bir çift kulak/göz" (başka bir bakış açısı) ile paylaşmak çok değerlidir. Fakat dikkat edin! Rubin'in buradaki amacı asla başkalarından eleştiri toplayıp eseri onların zevkine göre değiştirmek değildir. Görüşü önemli olan tek izleyici bizzat sizsiniz. Başkasına dinletmenin asıl büyülü amacı şudur: Kendi yazdığınız bir makaleyi veya şarkıyı odada bir başkası varken dinlediğinizde (daha o kişi tek kelime yorum yapmadan bile) o eserle olan "ilişkiniz" anında değişir. Başkasının yanında eseri dinlerken, normalde yalnızken kendinize sormadığınız o kritik soruları sorar, altta yatan şüphelerinizle yüzleşir ve eseri "farklı bir pencereden" duyarsınız.
      Eğer biri size eserinize dair bir yorum veya eleştiri getirirse, şunu asla unutmayın: İnsanlar bir sanat eseri hakkında konuşurken, aslında eserden çok "kendilerine dair, kendi dünya görüşlerine dair" bir şeyler söylerler. Eleştiriyi kişisel bir saldırı olarak alıp eserinizi savunmaya geçmek yerine, o yorumun eserde "geliştirilebilecek bir yöne, bir kör noktaya" işaret edip etmediğine tarafsızca bakın. Mesela biri "Şarkının köprüsü çok kötü, at gitsin" derse, bu köprüyü atmanız gerektiği anlamına gelmez; sadece "köprünün tekrar gözden geçirilmeye değer bir pürüz yarattığı" anlamına gelir.
      Hatta Rubin çıtayı daha da yükseltir: Eğer gerçekten yenilikçi ve muazzam bir eser yarattıysanız, bu eser izleyiciyi mutlaka bölecektir. Kimisi bayılacak, kimisi nefret edecektir. En iyi sanat eserleri izleyicileri kutuplaştırıp bölenlerdir. Herkesin, annenizin, arkadaşınızın, sokaktaki adamın anlaşıp "çok güzel olmuş" dediği bir iş yaptıysanız, aslında suyu bulandırmamış, risk almamış, herkesi memnun eden çok "sıradan" ve vasat bir şey yaratmışsınız demektir.
      Peki bir eserin "tamamlandığına" nasıl karar vereceğiz? Bunun bir matematik formülü yoktur, tamamen sezgiseldir: Eser tamamlandığını hissettiğinizde tamamlanmıştır. İşte sanatçıların en çok tökezlediği, ter döktüğü ve korktuğu an burasıdır. "Tamam, bitti" demek büyük bir cesaret ister. Çoğu sanatçı, henüz her şeyin değiştirilebilir olduğu o yumuşak hamur evresinde kalmayı (Deneme aşamasını) sonsuza dek sürdürmek ister. Eseri dünyaya sunmak, "kalıcılık" demektir. Bu bir "bağlılık korkusu" (fear of commitment) yaratır. Ya eserin içindeki o görünmez kusurlar birileri tarafından bulunursa? Ya ileride çok daha iyi bir son yazabilecekken şimdi bitirerek o fırsatı kaçırdıysam?
      Mükemmeliyetçilik burada sanatçıyı donup kalmaya iter. Öyle ki, sanatçı eseri bitirip yüzleşmektense tüm projeyi çöpe atmanın daha kolay olduğuna inandırır kendini. Bu yüzden, süreci sonsuza dek ertelememek için bu son aşamada kendinize kesin teslim tarihleri (deadline) koymak adeta hayat kurtarıcıdır. Eser, siz ona sonsuz mesai yapsanız da hiçbir zaman "kusursuz" olmayacaktır.
      Korkuyu yenmenin tek sırrı şudur: Bu tek bir eser, sizin tüm hayat hikayenizi, varoluşunuzu ebediyen tanımlayacak o nihai anıt değildir! O sadece, zaman içindeki "o anki halinizin, o günkü duygu durumunuzun" bir şipşak fotoğrafı, geçici bir yansımasıdır. Eğer eserinizi bugün yayınlamaz ve yıllarca beklerseniz, o eser artık sizi yansıtmaz, eski bir vesikalık fotoğrafa dönüşür. Mevsimlerin geçişi bile eserin ruhunuzdaki karşılığını öldürebilir. Sanat icra etmenin asıl ödülü, onca korkuya ve güvensizliğe rağmen o eseri "paylaşabilmektir." Eseri tamamlayıp bırakın ki, içinizde yeni bir esere başlayacak taze enerjiye alan açılsın.
      Bu bölümün özü: Yaratıcı sürecin son durağı olan "Tamamlama", eseri sonsuz bir mükemmelleştirme döngüsüne hapsetme korkusunu (bağlılık korkusunu) aşıp, eserin sadece "o anki halimizin geçici bir yansıması" olduğunu kabul ederek bitiş çizgisini kucaklama aşamasıdır. Eseri başkalarına dinletmek (veya göstermek) eleştiri toplamaktan ziyade sanatçının kendi eseriyle yüzleşmesini sağlar ve en iyi eserler herkesi memnun edenler değil, izleyiciyi ikiye bölen, cesurca dünyayla paylaşılanlardır.
      36. Bolluk Zihniyeti (Sonsuz İçerik Nehri)
      Sanatçıların ve genel olarak insanların dünyayı algılayışını iki temel zihniyete ayırabiliriz: "Kıtlık Zihniyeti" ve "Bolluk Zihniyeti". Sanat üretirken hangi zihniyette olduğunuz, kariyerinizin ve ruh sağlığınızın kaderini belirler.
      Her birimizin içinden akan, fikirlerin, duyguların, rüyaların ve yaratıcılığın durmaksızın çağladığı devasa bir "içerik nehri" vardır. Eğer eserlerinizi tamamlayıp onları dış dünyayla paylaşırsanız, bu nehrin akışı hızlanır ve içiniz sürekli olarak yeni fikirlerle, daha iyi eserlerle dolup taşar.
      Ancak Kıtlık Zihniyeti (Scarcity Mindset) içinde yaşıyorsanız, bu içsel nehrin bir gün kuruyacağından, sahip olduğunuz bu "az sayıdaki" harika fikrin son fikirleriniz olacağından büyük bir korku duyarsınız. Bu korku sizi fikirleri "istiflemeye" yöneltir. Bir komedyen aklına gelen dünyanın en komik esprisini küçük bir kulüpte seyirciye anlatmaktan çekinir; onu "ileride çıkacağı çok daha prestijli, büyük bir televizyon şovu" için cebinde (kasasında) saklar. Bir yazar harika bir karakteri ilk romanında kullanmak yerine ileride yazacağı "başyapıtı" için yıllarca bekletir. Sonuç ne olur? Fikirler paylaşılmadığı, kullanılmadığı için içeride birikir, çürür ve en kötüsü nehrin akışı engellendiği için yepyeni, taze fikirlerin içeri girmesine yer kalmaz. Kıtlık korkusu sizi felç eder ve yıllarca tek bir projeye saplanıp kalmanıza neden olur.
      Buna karşın Bolluk Zihniyeti (Abundance Mindset) bambaşka bir frekansta titreşir. Bu zihniyetteki sanatçı bilir ki; nehir sonsuzdur ve asla kurumaz! Harika fikirleri saklamak yerine onları cesurca, bonkörce o anki eserinde kullanır ve etrafa saçar. Çünkü bilir ki, zihnini boşalttığı anda evren (Kaynak) ona çok daha taze, çok daha büyük ve beklenmedik yeni fikirler gönderecektir. Ne kadar çok paylaşırsak, o "yaratıcılık kasımız" o kadar gelişir.
      Evrensel kural açıktır: Neye odaklanırsanız onu elde edersiniz. Zihninizde "fikirlerim yetersiz, sınırlı" derseniz evren size tam da bu kısıtlı ve kurak dünyayı verir. Ama bolluk dünyasında yaşadığınıza inanırsanız, sayısız fikir ve harika proje durmadan önünüze serilir.
      Tek bir eserin hayatınızı sonsuza dek tanımlayacağını, sizin "altın çağınız" veya "tek kurşununuz" olduğunu düşünmek, sizi yıkıcı bir mükemmelliyetçiliğe iter. Üstünde çalıştığınız albüm veya kitap, aslında sizin koca hayat hikayenizde sadece "bir bölümdür". İnsan hayatı boyunca onlarca bölüm yazar. Bazıları muhteşem olur, bazıları sönük kalır. Altın çağınızın geride kaldığı düşüncesi koca bir yanılsamadır; bir sonraki eserinizin bugüne kadar yaptığınız en iyi iş olmayacağını kim bilebilir? Asıl hedef, mükemmel olanı yapıp durmak değil, "bir bölümü tamamlayıp hemen bir sonrakine geçebilme kararlılığını ve neşesini" sürdürebilmektir.
      Bolluk zihniyeti, bizi şu harika umutla doldurur: En parlak fikirlerimiz ve en büyük eserimiz henüz ortaya çıkmadı!
      Bu bölümün özü: Yaratıcılık tıpkı akan bir nehir gibidir; fikirleri "bir gün lazım olur" veya "tükenir" korkusuyla istiflemek (kıtlık zihniyeti) bu nehrin kuruyup tıkanmasına yol açar. Bir sanatçı, ürettikçe evrenden çok daha fazla fikrin geleceğine olan sonsuz inancıyla (bolluk zihniyetiyle) elindeki en iyi fikirleri bonkörce kullanmalı ve hiçbir eserin hayatını tek başına tanımlayan yegane başyapıtı olmadığı bilinciyle serbest bırakmalıdır.
      37. Deneyciler ve İş Bitiriciler (İki Sanatçı Tipi)
      Rubin, stüdyolarda geçirdiği uzun yıllar boyunca sanatçıların davranış modellerini gözlemlemiş ve onları yaratıcı süreçlerine göre temel olarak iki ana kategoriye ayırmıştır: Deneyciler (Experimenters) ve İş Bitiriciler (Finishers).
      Deneyciler: Bu sanatçı tipi, kitabın başında bahsettiğimiz "Tohum" ve "Deneme" evrelerinin sarhoşudur. Hayal kurmaya, yeni alternatifler yaratmaya, eserin sınırlarıyla oynayıp sınırsız olasılıklar içinde yüzmeye bayılırlar. Dünyanın en yaratıcı, çılgın fikirleri onlardan çıkar. Ancak en büyük kabusları "Tamamlama" aşamasıdır. Eserin nihai kararını verip, onu o sabit, değişmez formuyla dünyayla paylaşmak onlar için adeta bir işkencedir. Seçeneklerin son bulmasından korkarlar. İş Bitiriciler: Deneycilerin tam zıttı kutupta yer alırlar. Bir tohum ellerine geçtiği anda, olasılıklarda gezinmek, sürprizleri beklemek veya denemeler yapmak onları sıkar. Onların tek odağı "sonuca" gitmektir. İşi hemen netleştirip, sınırlarını çizip, paketleyip bitiş çizgisine hızlıca ulaşmak isterler. Çok üretkendirler ama eserleri, deneme aşamasının o büyülü keşiflerinden mahrum kaldığı için genellikle "tahmin edilebilir" ve sığ kalma riski taşır.
      Rubin'in tavsiyesi, bu iki tipin kendi konfor alanlarından çıkıp "diğerinden" ders alarak dengeyi bulmasıdır. Bir "İş Bitirici" iseniz, bilinçli olarak kendinizi yavaşlatın. İlk aklınıza gelen kolay çözümü (minimum gereksinimi) kabul etmeyin. Süreç içinde doğaçlamalara, sürprizlere ve hedeften sapmalara bilerek alan açın. Bir "Deneyci" iseniz, bitmeyen hayal kırıklığını aşmak için hedefinizi devasa bir bütünden (bir albüm veya koca bir roman), "küçük, odaklanılabilir parçalara" indirin. On şarkı yerine sadece iki şarkıyı tamamen bitirmeye odaklanın. İkiden üçe varmak (momentumu hissetmek), sıfırdan ikiye varmaktan her zaman daha kolaydır. Eğer küçük bir kısmı bile baştan sona tamamlamayı başarırsanız, o "bitirme eyleminin" verdiği özgüven, diğer karmaşık kısımlardaki düğümleri (engelleri) çözmenize yarayacak anahtarı size verecektir.
      Bu bölümün özü: Sanatçılar genellikle süreci hayal kurarak uzatıp bitirmekten kaçanlar (Deneyciler) ile aceleyle sonuca odaklanıp eserin olasılıklarını kısıtlayanlar (İş Bitiriciler) olarak ikiye ayrılır. Her iki tip de zayıf yönünü kırmak için diğerinden ilham almalı; iş bitiriciler esnekliğe ve sürprizlere daha çok alan açarken, deneyciler projeleri ufak, ulaşılabilir parçalara bölerek işleri neticelendirme (bitirme) pratiği kazanmalıdır.
      38. Geçici Kurallar (Kısıtlamaların Özgürleştirici Gücü)
      Daha önceki bölümlerde (Bölüm 21), bize öğretilen, toplumun veya eğitim sisteminin dayattığı o genelgeçer "Kuralları" yıkmanın, olağanüstü sanatın tek şartı olduğunu konuşmuştuk. Ancak şimdi Rubin, yaratıcılığı ateşleyen yepyeni, tamamen zıt yönlü ama bir o kadar da etkili bir konsept sunuyor: Sanatçının kendi iradesiyle, kendine kasıtlı olarak koyduğu "Geçici Kurallar" (Kısıtlamalar).
      Zamanınız, malzemeniz ve bütçeniz tamamen sınırsız olduğunda (ki bu bir sanatçı için rüya gibi görünür), devasa bir boşluğun, engin bir okyanusun ortasında felç olursunuz. Seçeneklerin "sınırsızlığı" aslında sanatçıyı dondurur. Oysa sanatçı kendi tasarımıyla veya mecburiyetten belirli "sınırlamaları" (kısıtlamaları) kabul ettiğinde, seçenek yelpazesi daralır ve beyin bu dar alanda hayatta kalmak için o güne dek hiç kullanmadığı "orijinal" çözüm yollarını bulmaya mecbur kalır. Alışılmışın dışında kalan, zorlu problemler, son derece özgün ve çığır açıcı çözümler doğurur!
      Tarihteki en büyük yenilikler genellikle bu kasıtlı, geçici kısıtlamaların (kuralların) ürünüdür. Rubin, sanat tarihinden akıllara durgunluk veren somut örnekler verir:
      Georges Perec: Fransız edebiyatının dahi yazarı Perec, kendine akıl almaz bir geçici kural koymuştur: Bir roman yazacaktır ama Fransız alfabesinde en çok kullanılan harf olan "e" harfini asla kullanmayacaktır! (La Disparition - Kayboluş). Bu deli saçması gibi duran kısıtlama, onu kelimeleri bambaşka yollarla seçmeye itmiş ve modern edebiyatın en ünlü deneysel şaheserlerinden birini doğurmuştur.
      Yves Klein: Ünlü ressam, binlerce rengin olduğu paletini kasıtlı olarak tek bir renkle (maviyle) sınırlamaya karar vermiştir. Bu kısıtlama onu mavinin tonlarıyla o kadar derin bir ilişkiye sokmuştur ki, daha önce insan gözünün görmediği muazzam yoğunlukta yeni bir mavi tonu icat etmiştir. Bu renk daha sonra sanat tarihine "Uluslararası Klein Mavisi" olarak geçmiştir.
      Lars von Trier & Dogma 95: Danimarkalı sinemacı, sinemadaki milyon dolarlık yapaylıklara, devasa ışıklara ve özel efektlere karşı bir isyan olarak "Dogma 95 Saflık Yemini" adında, kendine ve katılan yönetmenlere 10 adet aşırı sert, faşistçe kural koymuştur: Çekimler sadece gerçek mekanda yapılacak (set yok), dışarıdan hiçbir müzik veya ses eklenmeyecek, kamera sadece elde taşınacak (tripod yasak), özel ışık veya filtre kullanılamaz, tür filmi çekilemez, yönetmenin adı bile yazılmayacaktır. Bu akıl almaz kısıtlamalarla çekilen ilk film (Thomas Vinterberg'in Festen - Şölen filmi), yönetmenleri öylesine çiğ ve vurucu bir yaratıcılığa itmiştir ki Cannes Film Festivali'nde Jüri Ödülü kazanmış, sinema dünyasını sarsmıştır.
      Beyzbol veya basketbol gibi sporlarda kurallar sabittir ve değiştirilemez; oyuncular sadece o kurallar içinde yenilik yaparlar. Ancak biz sanatçılar, kendi kurallarımızı her projede sıfırdan kendimiz belirleme özgürlüğüne sahibiz. Hele ki alanınızda deneyimli bir virtüözseniz, kendi bildiğiniz yöntemleri körü körüne tekrarlayıp durursunuz. İşte bu konfor alanını, tekdüzeliği yıkmak için geçici kurallar birer cankurtarandır.
      Sağ elinizle ustaca resim yapıyorsanız, "Bu tabloyu sadece sol elimle çizeceğim" kuralını koyun. Hep dizüstü bilgisayarda, rahatça ve hızlıca yazıyorsanız, "Bu kitabı sadece dolma kalem ve defterle yazacağım" deyin. Hep profesyonel kameralar kullanıyorsanız, "Bu kısa filmi sadece akıllı telefonla çekeceğim" kuralını getirin. Bu kısıtlamalar sizi sarsar, normal ritminizi bozar. Ortaya çıkan eserin eskisi kadar "kusursuz" olup olmayacağının hiçbir önemi yoktur; asıl amaç, sizi yepyeni bir yaratıcı damara, kendinizin bile bilmediği gizli potansiyellerinize ulaştırmasıdır.
      Sizi engelleyen, "konforunuzu bozan" bu gönüllü duvarlar, aslında size engellerin üzerinden aşabilmeniz için yepyeni, devasa bir zıplama tahtası verir.
      Bu bölümün özü: Zaman ve malzeme sınırsız olduğunda sanatçı felç olabilir; bu yüzden sanatçının kendi iradesiyle eserine koyduğu zorlayıcı "geçici kurallar" (sadece tek renk kullanmak, bir harfi dışlamak veya elde kamera taşımak gibi gönüllü kısıtlamalar), konfor alanını yıkarak beyni daha önce hiç gidilmemiş, tamamen özgün ve çığır açıcı çözümler bulmaya mecbur bırakır.
      39. Büyüklük (Kendin İçin Yaratmak)
      Geldik sanatın en saf, en dokunulmaz çekirdeğine. Rubin bu bölümü çok çarpıcı bir zihinsel egzersizle açıyor: Dağın en tepesinde, şehirden tamamen uzak, sonsuza dek tek başınıza yaşayacağınız bir ev inşa ettiğinizi hayal edin. Bu evi sizden başka hiç kimse, ama hiç kimse görmeyecek, ziyaret etmeyecek. Yine de parkeleri, yastıkları, tabakları ve mimariyi şekillendirmek için günlerinizi harcar, her detayı kendi göz zevkinize göre en ince ayrıntısına kadar, büyük bir özenle ve muhteşem olacak şekilde seçersiniz.
      İşte "Büyük" (Great) bir sanat eseri yaratmanın özünde yatan sır, tam olarak o dağın başındaki evi inşa eden kişinin niyetinde gizlidir. Sanat eserini yaratırken bizim "tek bir gerçek izleyicimiz" vardır: O da bizzat kendimizdir. Eserimizi, dış dünyanın (başkalarının) beğenip beğenmeyeceğine göre değil, tamamen "kendi içsel güzellik anlayışımıza", kendi yüksek standartlarımıza göre şekillendiririz. Bu bir ibadet, bir adak sunmak gibidir. Ne olursa olsun, elimizden gelenin en kusursuzunu sadece ve sadece kendimizi tatmin etmek için yaparız.
      Eğer çalışırken aklınızın bir köşesinden "Ben bunu pek beğenmedim ama piyasa bunu sever, radyolar bunu çalar, başkaları bunu kesin beğenir" gibi bir düşünce geçiyorsa, Rubin sert ama çok haklı bir uyarıda bulunur: Artık sanat yapmıyorsunuz demektir! Siz ticarete atılmışsınızdır. (Bunda da yanlış bir şey yoktur, ancak o yaptığınız şeyin ruhu eksiktir). Başkalarının neyi seveceğini "tahmin ederek" (hesaplayarak) yapılan, popülerliğin sığ sularında yüzen eserler, ironik bir şekilde genellikle ticari olarak bile hedefine ulaşamaz. Çünkü en nihayetinde, bir şeyin "güzel" olduğuna dair elimizdeki tek gerçek ölçüt, "bizim onu kalpten seviyor olmamızdır".
      Sanatınızı üretirken; "Eleştirmenler ne der? Albüm satar mı? Bütçemi aşar mıyım? Ya eski eserimle yarışamazsam? Acaba bu eserimle dünyayı değiştirebilir miyim?" gibi kaygılar taşıyorsanız, bunların hepsi o saf "seçkinlik ve büyüklük" (Greatness) arayışını zehirleyen virüslerdir. Siz arabanın aerodinamiğini tasarlayan bir mühendis değilsiniz ki "işlevsel ve pratik" olanı hedefleyesiniz. Siz bir sanatçısınız. İç sesinizi sadece ve sadece o saf, bencil yaratıcı niyete odaklayın: Elimden gelenin en fevkaladesini, en eşsiz olanını yaratmak istiyorum.
      Bunu yaptığınızda, dünyevi kaygılardan arınarak sadece kendi yüksek standardınız için büyük bir eser ürettiğinizde, evrende mucizevi bir dalgalanma (kelebek) etkisi başlar. Bu enerji öyle sarsıcı ve bulaşıcıdır ki, sadece eseri deneyimleyenleri büyülemekle kalmaz, etrafınızdaki diğer insanlara, diğer sanatçılara da kendi alanlarında "büyük işler" (greatness) yapmaları için muazzam bir ilham aşılar. Büyüklük, bulaşıcıdır; büyüklüğü doğurur.
      Bu bölümün özü: Sanat eserindeki asıl gaye; dış dünyanın (piyasanın veya eleştirmenlerin) beklentilerine ya da ticari faydalara göre değil, sanatçının tıpkı kimsenin görmeyeceği bir evi süslerken gösterdiği o saf ve mahrem özenle, kendi kişisel yüksek güzellik anlayışına göre "en mükemmeli" yaratma arayışıdır. Hiçbir dış onay beklemeden sadece "en iyi eseri yaratmak" niyetiyle çalışmak, o eserin etrafa bulaşıcı bir ilham ve enerji (dalgalanma) yaymasını sağlar.
      40. Başarı (Gerçek Tatmin ve Yanılsamalar)
      Kitabın bu "Parça 3" yolculuğunun son durağındayız. Herkesin peşinde koştuğu o sihirli kelime: Başarı (Success). Peki başarı nedir?
      Genellikle bize başarının; banka hesabındaki milyonlar, Billboard listelerinde bir numara olmak, stadyumları dolduran popülerlik veya usta eleştirmenlerden alınan o parlak övgüler (saygınlık) olduğu öğretilir. Rick Rubin, tüm bu ezberleri elinin tersiyle iter ve gerçek sanatçının manifestosunu yazar: Başarı; popülerlik, para veya saygınlık DEĞİLDİR. Başarı, tek bir dış gözlemci eseriniz hakkında yorum yapmadan çok önce, ruhunuzun o sessiz mahremiyetinde gerçekleşen "içsel" bir andır.
      Başarı, eserinizi bitirdiğiniz, potansiyelini sonuna kadar kullandığınızı bildiğiniz, ona elinizden gelen her şeyi verdiğinizi hissettiğiniz o tatmin edici anda gelir. "Evet, bitti. İçime sindi ve onu dünyaya bırakmaya hazırım" dediğiniz o saniye, siz zaten başarılı olmuşsunuzdur. İlerlemek, bir eseri bitirip yenisine başlamak başlı başına bir başarıdır. Sizin dışınızdaki tüm etkenler (piyasa, ödüller) aslında evrenin attığı bir zardan ibarettir. Sizinle ilgisi yoktur.
      Bir eserin listeleri alt üst etmesi (ticari popülerliği), o eserin ne kadar kaliteli olduğuyla nadiren ilgilidir. Şarkınızı veya kitabınızı yayınladığınız o gün dünyada büyük bir savaş çıkabilir veya küresel bir felaket kopabilir; tüm ilgi oraya kayar ve şaheseriniz gölgede kalır. Veya aynı gün dünyanın en ünlü pop starı merakla beklenen albümünü çıkarır, sizin sesiniz duyulmaz bile. Dağıtım ağı, güncel kültürel atmosfer, zamanlama... Bunların hiçbiri sizin elinizde değildir. Siz sadece üretebilir, en iyisini yapabilir ve arkanıza bile bakmadan sıradaki projenize (maceranıza) başlayabilirsiniz.
      Burada Rubin'in değindiği çok hüzünlü ve çarpıcı bir gerçek vardır. Birçok insan, içindeki derin boşluğu, "yetersizlik, sevgisizlik veya dışlanmışlık" hissini (yarasını) iyileştirmesi umuduyla o popüler başarının (şöhretin) peşinden koşar. Şöhreti yakaladıklarında o yaraların tamamen kapanacağını, ruhlarının huzur bulacağını zannederler. Ancak şöhret kapıyı çaldığında tamamen hazırlıksız yakalanırlar. Çünkü popülerlik o boşluğu doldurmaz; tam tersine, sanatçı kendini öncekinden de daha büyük bir boşlukta, daha yalnız ve daha yapayalnız hisseder. Hayatı boyunca uğruna ter döktüğü o parıltılı hedefin (paranın, övgünün) içsel yaralarına merhem olmadığını anladığında, sanatçı korkunç bir bunalıma, depresyona sürüklenir. Üstelik artık o konumunu, parasını, "kaybedecek daha çok şeyi" olduğu için üzerindeki baskı ve stres bin kat artmıştır. Sanat, şifa olmaktan çıkıp bir hapis hayatına dönüşür.
      Başarının getirdiği bir diğer sinsi tuzak da "sadık hayran kitlesi"dir. Diyelim ki country müzik ya da korku filmi yaparak büyük şöhret kazandınız. Ruhunuz değişti ve artık elektronik müzik ya da romantik komedi yapmak istiyorsunuz. İçgüdüleriniz sizi oraya çağırıyor. Ancak etrafınızdaki menajerler, plak şirketleri, basın danışmanları (ekmek kapısı size bağlı olan herkes) ve o sadık hayranlar "Hayır, sen o değilsin! Bizim sevdiğimiz tarzı yapmaya devam et!" diyerek sizi o eski başarının altın kafesine hapsetmeye çalışır. Birçok sanatçı, hayranlarını veya elindekini kaybetme korkusuyla içinden gelmeyen, inanmadığı o eski tarzı yapmaya devam eder. Ama ruhsuzlaşmış, anlamını yitirmiş bir eserin kimseyi etkilemesi zaten mümkün değildir. Sonunda herkes kaybeder.
      Rubin'in tavsiyesi nettir: Sizi o ilk başta başarılı kılan şey, tarzınız değil; o işi yaparken içinizdeki o "saf tutku ve inançtı". Tutkunuz, heyecanınız başka bir türe, başka bir yöne kayarsa, hiç düşünmeden oraya gidin. Hayranları kaybedersiniz veya yenilerini kazanırsınız, fark etmez. İnsanları asıl etkileyen şey, sizin hangi tarzı yaptığınız değil, kendinize, sezgilerinize duyduğunuz o tavizsiz güven ve heyecanınızdır.
      Sanatçının kendi başarı algısını dış dünyanın o değişken, acımasız ve mantıksız tepkilerinden tamamen yalıtması şarttır. Dünya eserinizi feci bir başarısızlık olarak görebilir veya başyapıt ilan edebilir. Siz her yeni eserinize, "Sanki kaybedecek hiçbir şeyiniz yokmuş gibi", dış dünyanın alkışından ya da yuhalamasından tamamen kopuk, özgür bir ruhla başlamalısınız.
      Bu bölümün özü: Sanatta gerçek başarı piyasa, para, şöhret veya eleştirmenlerin övgüsü değil; sanatçının eserin tüm potansiyelini ortaya çıkardığını ve elinden gelenin en iyisini yaptığını hissettiği o mahrem, içsel tatmin anıdır. Dışsal popülerlik kontrol edilemeyen tesadüflere ve zamanlamaya bağlıdır; üstelik şöhret, sanatçının içsel boşluklarını iyileştirmediği gibi onu eski tarzının altın kafesine hapsederek ruhsuzlaşmasına da neden olabilir. Bu yüzden sanatçı daima dış onayı umursamadan ve kaybedecek hiçbir şeyi yokmuş gibi üretmelidir.
      (Parça 3'ün derinlemesine incelemesi burada tamamlanmıştır. Sanatçının tohumları bulmasından, o zorlu kuralsız denemeleri yapmasına, eseri duvar gibi örmesine, kendi eşsiz bakış açısını koyarak ivme kazanmasına ve en nihayetinde dış dünyanın sahte başarı yanılsamalarından arınarak eseri tamamlayıp doğaya geri bırakmasına kadar uzanan bu görkemli süreci detaylarıyla keşfettik. Eğer isterseniz, bu yolculuğun devamındaki "Parça 4" ve "Parça 5" konularına da aynı derinlikle devam edebiliriz.)
  - baslik: Parça 4 · Eseri Şekillendiren Yaklaşımlar ve Tepkiler (Bölüm 41-58)
    icerik: |-
      Harika bir yolculuğa devam ediyoruz. Rick Rubin’in "Yaratıcı Eylem" kitabındaki 4. Parça (Eseri Şekillendiren Yaklaşımlar ve Tepkiler), artık eserle boğuştuğumuz, karar verdiğimiz, kendi zihnimizin ve dış dünyanın tepkileriyle yüzleştiğimiz o en kritik anları kapsıyor. Bu aşama, stüdyoda, masada veya tuvalin başında yaşadığımız o büyülü "Aha!" anlarının, hüsranların ve eşsiz seçimlerin evresidir.
      Görevin doğası gereği hiçbir detayı atlamadan, yüzeysel özetlere kaçmadan, yazarın zihin dünyasına girerek bu bölümleri seninle karşılıklı bir kahve sohbeti sıcaklığında ama konunun hak ettiği tüm felsefi ciddiyetle derinlemesine yeniden anlatacağım.
      İşte Eseri Şekillendiren Yaklaşımlar ve Tepkiler (Bölüm 41-58) üzerine o muazzam derinlikteki yolculuğumuz:
      41. Kendine Dışarıdan Bakma (Olasılıklar)
      Hayatın ve sanatın içinde bazen öyle anlar gelir ki, her şeyin bittiğini, dünyamızın başımıza yıkıldığını hissederiz. Yıllardır üzerinde çalıştığınız ve tek kopyası olan o roman taslağının bir yangında kül olduğunu, çok sevdiğiniz ve güvendiğiniz işinizden aniden kovulduğunuzu ya da harika gittiğini sandığınız romantik ilişkinizin bir saniyede bittiğini hayal edin. İnsan doğası gereği böyle anlarda kederin, öfkenin ve "neden ben?" isyanının içine gömülürüz.
      Ancak Rubin burada çok sarsıcı ve kurtarıcı bir zihinsel pratik önerir: "Kendinize dışarıdan, tıpkı bir film izliyormuş gibi bakın."
      Bunu günlük hayattan bir analojiyle düşünelim. Harika bir sinema filmindesiniz. Filmin tam ortasında ana kahraman (örneğin siz) aşılmaz gibi görünen bir engelle karşılaşır, elindeki her şeyi kaybeder. İzleyici olarak o sahnede filmin bittiğini, her şeyin mahvolduğunu düşünür müsünüz? Hayır. Tam aksine, koltuğunuzda dikleşir ve heyecanla "Acaba kahraman bu imkansız durumdan nasıl kurtulacak? Şimdi ne yapacak?" diye beklersiniz. Çünkü bilirsiniz ki o karanlık an, hikayenin sonu değil, sadece bir dönüm noktasıdır.
      İşte kendi hayatımızdaki felaketlere ve sanatsal çıkmazlarımıza da bu mesafeden, dışarıdan (objektif) bir gözle bakabildiğimizde, o anki acının içinde boğulmak yerine yepyeni olasılıkları görmeye başlarız. Son, aslında son değildir. Hayatta ve sanatta karanlık da aydınlık da birbirine bağımlı bir döngü içinde sürekli devam eder. Onlar iyi ya da kötü değildir; sadece var olurlar. Yaşadığınız o feci olay, belki de çok daha güzel, çok daha büyük ve tatmin edici bir sonraki sahnenin (eserin) ortaya çıkabilmesi için zorunlu bir yıkımdır. Olasılıklara açık bu soğukkanlı tavır, bizi kendi uydurduğumuz kurban hikayelerinden kurtarıp yaratıcı enerjinin akışına yeniden bağlar.
      Bu bölümün özü: Hayatta ve sanatsal süreçte karşılaştığımız krizlere kederlenip pes etmek yerine, bir film kahramanını izler gibi dışarıdan ve mesafeyle bakmak gerekir. Bu nesnel perspektif, yaşanılan zorluğun hikayenin sonu olmadığını kavramamızı ve o yıkımın ardında yatan yepyeni yaratıcı olasılıkları heyecanla kucaklamamızı sağlar.
      42. Coşku (İçsel Pusulamız)
      Bir sanat eseri üzerinde çalışırken, doğru yolda olup olmadığınızı nasıl anlarsınız? Eserin iyiye gittiğinin, o kusursuz dengeye ulaştığının işareti nedir? Rubin'e göre bu sorunun cevabı mantıksal bir analizde değil, tamamen bedensel ve ilkel bir tepkide yatar: Coşku (Enthusiasm).
      Bunu hepimiz yaşamışızdır; çok sevdiğiniz bir müziği dinlerken aniden gözlerinizi kapatıp kendinizi bambaşka bir evrende bulmanız ya da olgunluğunun zirvesindeki o sulu, tatlı meyveyi ısırdığınızda damağınızda patlayan o tarifsiz haz... Yaratım sürecinde de, aylar süren başarısız denemelerden sonra aniden ufak bir değişiklik yaparsınız ve önünüzde nefes kesici yepyeni bir yol belirir. O an içinizde sessiz bir fısıltı sizi güldürür. Bedeninizi tarif edilemez bir enerji, bir neşe, bir aydınlanma hissi kaplar. İşte bu coşkudur!
      Coşku, eserin rotasını bulduğuna dair bize verilen kozmik bir onaydır. İşin en ilginç yanı, sıradan bir taslağı büyük bir başyapıta dönüştüren o "sıçrama" anının her zaman devasa bir değişiklik gerektirmemesidir. Ufacık bir fırça darbesi, mikste bir sesin kısılması ya da tek bir kelimenin değişmesiyle o sihirli aniden gerçekleşir. Bu değişim olduğunda bunu iliklerinize kadar bilirsiniz; kalp atışlarınız hızlanır, yüzünüze şaşkın bir gülümseme yerleşir ve adeta dualarınız kabul olmuş gibi enerjiyle dolup taşarsınız.
      Rubin, bu bedensel tepkilerin (kalp çarpıntısı, aniden gülme, zamanı unutma) mantıklı bir açıklaması olmak zorunda olmadığını vurgular. Zihnimiz daha sonra geriye dönüp "Evet, bu renk buraya uyduğu için güzel oldu" diye analiz edebilir; ancak o an önemli olan zihni susturup sadece o coşkunun peşinden gitmektir. Kimi zaman bu coşku bize bir özgüven patlaması olarak dönerken, kimi zaman da dış dünyadan tamamen koptuğumuz, zamanın durduğu derin bir trans hali olarak kendini gösterir.
      Bu bölümün özü: Yaratıcı süreçte doğru yolda olduğumuzu gösteren en güvenilir rehber, mantıksal analizlerimiz değil; içimizde aniden uyanan, kalp atışımızı hızlandıran ve bize tarifsiz bir neşe veren bedensel "coşku" hissidir. Sanatçı, sıradan bir eseri şahesere çeviren o aydınlanma anlarında zihnini devre dışı bırakıp sadece bu ilkel ve saf heyecanın izini sürmelidir.
      43. Referans Noktası (Yeniye Karşı İlk Direnç)
      Yıllardır hayranlıkla takip ettiğiniz, her şarkısını ezbere bildiğiniz efsanevi bir sanatçı düşünün. Bir gün tamamen yeni, alışılmadık, tarzının çok dışında bir şarkı yayınlıyor. İlk dinlediğinizde tepkiniz ne olur? Çoğu zaman "Bu ne ya? Hiç olmamış, bana göre değil" diyerek reddedersiniz. Şarkı kulağınıza tuhaf ve yabancı gelir.
      Ancak Rubin'in belirttiği gibi, parçayı birkaç gün sonra tekrar dinlersiniz, sonra bir kez daha... Zihninizde yavaş yavaş yeni bir kalıp (bağlam) oluşmaya başlar. Başta size çok itici gelen o tuhaf melodi giderek aşina hale gelir ve gün gelir, o şarkı hayatınızın en sevdiğiniz, onsuz yaşayamayacağınız bir başyapıtına dönüşür. Neden böyle olur?
      Çünkü insan zihni, yeni bir bilgiyi algılayabilmek için eski bilgilere, yani bir "referans noktasına" ihtiyaç duyar. Kökten yenilikçi, devrim yaratan fikirlerin doğaları gereği ait oldukları bir referans noktası (bağlamı) yoktur; onlar kendi bağlamlarını kendileri yaratmak zorundadırlar. Elimizde onu kıyaslayacak bir referans olmadığında zihnimiz onu hemen "yanlış" veya "kötü" olarak etiketler.
      Aynı kural kendi yaratım sürecimiz için de geçerlidir. Stüdyoda ya da masada çalışırken, aklınıza gelen bir fikre veya yaptığınız bir denemeye karşı içinizde aniden "Çok güçlü, olumsuz bir tepki" (soğuma) hissedebilirsiniz. Rubin bizi uyarır: Bu güçlü tepkiyi hemen silip atmayın! Bir şeyden anında ve şiddetle nefret ediyorsanız, bu durum genellikle o fikrin "beklentilerimizle hiç örtüşmeyen, inanılmaz yenilikçi ve devrimci" bir fikir olmasından kaynaklanır. Güçlü tepkiler, altında çok daha derin anlam katmanları barındırır.
      Bu bölümün özü: Çığır açan ve gerçekten yenilikçi fikirler, başlangıçta kıyaslanabilecekleri bir "referans noktaları" (bağlamları) olmadığı için zihnimize tuhaf ve itici gelirler. Kendi üretim sürecimizde ortaya çıkan yeni bir fikre karşı duyduğumuz o ilk güçlü ve olumsuz tepkiyi reddetmek yerine dikkatle incelemek, bizi sanatımızdaki en kalıcı ve devrimci keşiflere götürebilir.
      44. Rekabet Etmeme (Kıyaslama Neşeyi Öldürür)
      Sanat dünyasında (veya genel olarak hayatın her alanında) bize öğretilen büyük bir yalan vardır: "Rekabet bizi daha iyi olmaya iter. Başkalarının başarılarına meydan okumak eserimizi mükemmelleştirir." Rick Rubin bu inancı temelden yıkarak, sanatın doğasında rekabetin hiçbir yeri olmadığını savunur.
      Sanat, her bireyin kim olduğunu, dünyayı kendi eşsiz süzgecinden nasıl gördüğünü ifade etme biçimidir. Siz sizi en iyi temsil eden eseri yaparsınız, başka bir sanatçı da kendisini en iyi temsil edeni. Bu iki eşsiz ruh nasıl birbiriyle kıyaslanabilir ki? Theodore Roosevelt'in o meşhur sözünü hatırlayalım: "Kıyaslama neşeyi öldürür." Bir başkasını alt etmek, onu küçültmek veya ondan daha çok satmak amacıyla üretilen bir sanatın "büyük bir eser" olma ihtimali neredeyse sıfırdır, çünkü bu enerji çok düşük, bencilce bir titreşimdir.
      Ancak burada çok ince ve muazzam bir ayrım vardır: Başkalarının muhteşem eserleri karşısında hissetmemiz gereken şey "kıskançlık veya haset" değil, derin bir "ilham ve işbirliği" arzusudur. Rubin müzik tarihinin en ikonik etkileşimlerinden birini örnek verir:
      The Beach Boys'un dâhisi Brian Wilson, İngiltere'den The Beatles'ın Rubber Soul albümünü ilk dinlediğinde kıskançlık krizlerine girip onları alt etmeye çalışmaz. Aksine, o kadar büyülenir ki; "Hayatta tek bir şey başaracaksam o da bunun kadar iyi bir albüm yapmak olacak" der ve müzik tarihini değiştiren Pet Sounds albümünü yaratır. Hikaye burada bitmez; Paul McCartney (The Beatles) Pet Sounds albümünü dinlediğinde gözyaşlarına boğulur ve "God Only Knows"u yazılmış en iyi şarkı ilan eder. Bu sarsıcı ilhamla The Beatles stüdyoya girer ve sırf Pet Sounds kadar büyük bir şey yapabilmek tutkusuyla efsanevi Sgt. Pepper's Lonely Hearts Club Band albümünü yaratır.
      Gördüğünüz gibi bu, birbirini yok etmeye çalışan düşmanların rekabeti değil; birbirlerinin muazzam eserlerinden karşılıklı sevgiyle ilham alan ustaların "evrensel işbirliğidir". Sanatta var olan tek geçerli ve sağlıklı rekabet, sanatçının sadece dünkü kendisiyle girdiği, kendi becerilerini ve vizyonunu hep bir adım öteye taşımayı amaçladığı içsel gelişim yarışıdır.
      Bu bölümün özü: Her sanat eseri sanatçının biricik özünü yansıttığı için, sanatta başkalarını alt etmeye yönelik rekabet ve kıyaslama anlamsız, neşeyi öldüren yıkıcı bir eylemdir. Gerçek sanatçı, başkalarının başyapıtları karşısında kıskançlık duymak yerine derin bir ilhamla motive olur ve sadece kendi potansiyelini bir adım öteye taşımak (kendiyle yarışmak) için üretir.
      45. Öz (Eserin Çekirdeği)
      Bir sanat eserini, ne kadar karmaşık olursa olsun ayakta tutan değişmez bir iskeleti, yani bir "Özü" (Core/Essence) vardır.
      Bunu anlamak için bir çocuğun çizdiği ev resmini hayal edelim. Çocuğun çizdiği evde bir çatı, pencereler ve bir kapı vardır. Eğer silgiyi alıp pencereyi silerseniz, o resim hala bir "ev"dir. Kapıyı da silerseniz, muhtemelen hala bir evdir. Ancak dış duvarları ve çatıyı silip geriye sadece bir pencere ve kapı bırakırsanız, o çizimin artık bir "ev" olup olmadığı tamamen belirsizleşir. İşte eserin o çatısı ve duvarları, çalışmayı bir arada tutan ve kimliğini veren "öz"dür.
      Bu öz; bazen seçilen malzeme (taş vs. kil), bazen temanın ta kendisi, bazen de sanatçının aktarmak istediği o yoğun duygudur. Eserin yaratım sürecinde (Üretim aşamasında) en büyük görevimiz bu özü karanlıkta bırakmamaktır.
      Rubin, bir eseri gerçekten mükemmelleştirmek ve özüne ulaştırmak için "acımasızca sadeleştirmeyi" önerir. Jazz efsanesi Charles Mingus'ın dediği gibi: "Herkes basit olanı karmaşıklaştırabilir. Asıl mesele, karmaşık olanı basitleştirebilmek, muhteşem bir şekilde basitleştirmektir."
      Oluşturduğunuz esere bakın ve şunu sorun: "Bu eser artık kendisi olmaktan çıkmadan önce ondan daha neleri eksiltebilirim?" Süslemeler, gereksiz kelimeler, fazladan basılan notalar çoğunlukla eserin gücünü artırmaz, aksine o saf çekirdeği (özü) bulanıklaştırır. İki farklı öğeyi birleştirmek için araya "geçişler" koymak yerine, o iki öğeyi çıplakça yan yana koymanın yarattığı çarpıcı etkiyi düşünün. Kusursuzluğa eklenecek bir şey kalmadığında değil, çıkarılacak hiçbir şey kalmadığında (Antoine de Saint-Exupéry'nin dediği gibi) ulaşılır.
      Bu bölümün özü: Her sanat eserinin onu ayakta tutan, değiştirildiğinde eserin kimliğini yok eden değişmez bir "özü" vardır. Eseri gereksiz süslemelerden ve fazlalıklardan acımasızca arındırıp mümkün olan en yalın ve sade haline indirdiğimizde, hem eserin gerçek gücünü hem de dolaylı olarak kendi içsel özümüzü keşfetmiş oluruz.
      46. Asılsız Hikayeler (Efsanelerin Ardındaki Gerçek)
      Hepimizin hayranlık duyduğu, "Nasıl böyle bir dahi olabilir?" diyerek eserlerini incelediği efsanevi sanatçılar vardır. Onların yaratım süreçlerine dair anlatılan büyüleyici hikayeleri okuruz. Biri der ki, "Bu resmi yaparken günlerce aç susuz kaldı, sadece kahve içip tavana baktı." Diğeri, "Bu melodiyi ona bir gece yarısı ormanda yürürken ilham perileri fısıldamış."
      Rubin bizi sert bir gerçekle yüzleştirir: Bu hikayelerin çoğu abartılıdır ve birçoğu tamamen uydurmadır!
      Bırakın o sanatçıyı dışarıdan gözlemleyen biyografi yazarlarını, bizzat sanatçının kendisi bile o muazzam eseri "nasıl ve neden" ortaya çıkardığını tam olarak bilemez. Çünkü insan zihni, doğal bir "yorumlama makinesi"dir. Belirsizliklerle, gizemlerle dolu bir dünyada yaşamaya tahammül edemeyiz. Açıklayamadığımız, mantığa sığdıramadığımız o sihirli yaratım anlarını anlamlandırmak için geriye dönük "asılsız hikayeler" uydururuz. Bu, beynimizin hayatı basitleştirme ve hayatta kalma mekanizmasıdır. Eserin nasıl oluştuğu sorulduğunda sanatçının anlattığı "yaratım süreci", çoğunlukla sadece sonradan yazılmış güzel bir hikayedir. Gerçeklik ise sonsuza dek o stüdyonun kapalı kapıları ardında, bilinmez kalmaya mahkumdur.
      Bu yüzden sanatçılar olarak, o ilahlaştırılmış figürlerin "yöntemlerini" mutlak birer formülmüş gibi kopyalamaya çalışmak büyük bir yanılgıdır. Kendimizi o "üstün varlıklarla" kıyaslamak ve "Ben onun gibi acı çekmiyorum, demek ki benim sanatım yetersiz" diye düşünmek anlamsızdır. Çünkü hayran olduğumuz o dehalar da tıpkı bizim gibi şüpheleri, kusurları, korkuları olan ve el yordamıyla karanlıkta yolunu bulmaya çalışan sıradan ölümlülerdir.
      Bu bölümün özü: Efsanevi sanatçıların o muazzam eserleri nasıl yarattıklarına dair anlatılanlar (ve bizzat kendi anlattıkları), çoğunlukla insan zihninin belirsizliği açıklamak için uydurduğu sonradan yazılmış "asılsız hikayelerdir". Bu yüzden sanatçı, idollerinin kurgusal yaratım mitlerini mutlak formüller gibi taklit etmeye çalışmak yerine, kendi benzersiz ve bilinmez yolculuğuna odaklanmalıdır.
      47. Duymazdan Gelmek (Dikkat Dağıtıcı Sesleri)
      Eserinizi yaratırken o ilk aylarda, yıllarda her şey ne kadar güzeldir, değil mi? Dış dünyadan tamamen kopuk, sadece kendi iç sesinizle ve eserinizle baş başa kaldığınız güvenli, mahrem bir kozanın içindesinizdir. Fakat projeniz bitip de dünyaya açıldığında, birdenbire ortalık karışır.
      Artık stüdyonuzda sadece siz yoksunuzdur; plak şirketleri, yayınevleri, medya, hayranlar, satış beklentileri, son teslim tarihleri ve toplumsal imajınız devreye girer. Bir sonraki projenize başlarken bu "dış sesler", kafanızın içinde yankılanmaya başlar. Birdenbire sanatsal kararlar almayı bırakıp "ticari" kararlar almaya başlarsınız: "Hayranlarım benden ne bekliyor? Hangi şarkı radyoda daha çok çalar?" Bu, saf yaratıcılığın ölüm fermanıdır.
      Ancak tehlike sadece dışarıdan gelmez; içinizdeki sesler (içselleştirilmiş eleştirmenler) çok daha sinsi ve yıkıcıdır. Bu iç sesler genellikle size ait bile değildir. Mükemmeliyetçi bir ebeveynin, sizi küçümseyen eski bir öğretmenin veya sektördeki acımasız bir eleştirmenin sizin bilincinize kazınmış yankılarıdır. Durmadan size fısıldarlar: "Yeterince iyi değilsin, bu yaptığın beş para etmez, kesin başarısız olacaksın..." Ya da tam tersi, egonuzu zehirleyecek şekilde: "Sen bir dâhisisin, ne yapsan muhteşem, herkes sana tapacak!"
      Rubin'in tavsiyesi bir zen ustasının bilgeliği gibidir: Bu seslerle savaşmayın. Onları tartışarak yenmeye çalışmayın. Çünkü onlarla savaştığınızda onlara "enerji" vermiş olursunuz. Sadece onların varlığını kabullenin ve dikkatinizi tekrar önünüzdeki işe verin. Tıpkı devasa bir dağın zirvesine çarpıp dağılan, geçip giden bulutlar gibi o seslerin de gelip geçmesine izin verin. Gözünüzü sadece "harika bir eser yaratma" niyetine dikin. Eğer huzur içinde saf işinize odaklanmayı başarırsanız, zaten o endişe ettiğiniz tüm ticari beklentiler ve başarılar kendiliğinden sağlanacaktır.
      Bu bölümün özü: Eser dünyaya açıldıktan sonra sanatçının zihnini işgal eden ticari beklentiler (dış sesler) ve "yetersizsin" diye fısıldayan içselleştirilmiş eleştirmenler, saf yaratıcılığı zehirleyen unsurlardır. Sanatçı, bu dikkat dağıtıcı seslere savaş açıp enerji harcamak yerine, tıpkı gelip geçici bulutlar gibi onları duymazdan gelerek tamamen "harika bir eser üretmeye" odaklanmalıdır.
      48. Öz Farkındalık (Egodan Sıyrılıp Evrenle Bağlanmak)
      Çocukluğumuzdan itibaren toplum, okul ve sistem tarafından ehlileştiriliriz. Bize duygularımızı bastırmamız, kurallara uymamız ve toplumun "kabul edilebilir" bulduğu şekillerde davranmamız öğretilir. İçimizdeki o doğuştan gelen vahşi, bağımsız ve özgür ruh, sistemin dişlileri arasında yavaş yavaş törpülenir.
      Ancak bir sanatçı için bu toplumsal ehlileştirme, yaratıcılığın katilidir. Sanatçının görevi genelgeçer düşünceye boyun eğmemek, dünyaya ve kendine dair kendi eşsiz, ham ve saf algısını korumaktır. İşte Öz Farkındalık (Self-Awareness) tam da budur: Toplumun dış baskılarından etkilenmeden kendi hislerimizle, duygularımızın yoğunluğuyla ve dünyayı algılayış biçimimizle yargısızca uyumlanabilme becerisidir.
      Burada çok paradoksal (çelişkili gibi duran) ama muazzam bir sır yatar: Çoğu zaman "Öz farkındalık" dendiğinde sadece kendi egomuzu, kendi küçük dertlerimizi düşünmek anlarız. Oysa Rubin'e göre sanattaki öz farkındalık, başkalarının bizi nasıl gördüğünü umursamaktan vazgeçmektir. Kendimize biçtiğimiz o kısıtlayıcı etiketlerden ("Ben böyle biriyim", "Ben bu tarz müzik yaparım") kurtulmaktır.
      Egomuzun o dar sınırlarından (kendi hikayelerimizden) kurtulduğumuzda, yani "benlikten sıyrıldığımızda", aslında tamamen zıttı bir şey olur: Evrenin o devasa, sınırsız potansiyeliyle uyumlanırız. Kendimize ne kadar çok yaklaşırsak, aslında evrenin geri kalanıyla (doğayla, diğer insanlarla) aramızdaki sınırların da o kadar yok olduğunu fark ederiz. Sanatçı olarak yolculuğumuz, birinin nerede başlayıp diğerinin nerede bittiğinin belli olmadığı bu yüksek bilinç (aşkınlık) düzeyine ulaşmaktır.
      Bu bölümün özü: Toplumun ehlileştirici kurallarını aşarak kendi saf duygularımızla ve dünyayı algılayış biçimimizle yargısızca uyumlanabilme becerisi, gerçek öz farkındalıktır. Sanatçı, başkalarının beklentilerinden ve kendi kısıtlayıcı egosundan sıyrıldığında, aslında kendisi olmaktan çıkıp evrenin o devasa ve sınırsız yaratıcı bütünüyle derin bir bağ kurmuş olur.
      49. Gözümüzün Önünde (Çözüme Giden Basit Yollar)
      Bazen yaratıcı sürecin ortasında devasa bir duvara toslarız. Tıkanırız. Aklımıza hiçbir şey gelmez ve "İlham perilerim beni terk etti, yaratıcılık akışım durdu" diyerek umutsuzluğa kapılırız. Rubin, bu yanılgıyı çok net bir şekilde düzeltir: Yaratıcılık akışı asla durmaz! Kesintisizdir. O akışı durduran şey bizim onunla bağlantı kurmayı reddetmemiz, yani önümüze bizzat kendi ellerimizle ördüğümüz zihinsel engellerdir.
      Bir çıkmaza girdiğimizde, o çıkmazdan mantıklı düşünerek, zorlayarak, "Neden yapamıyorum?" diye kendimizi yiyip bitirerek kurtulamayız. Analitik düşünmeyi bırakıp kendimizi o anın akışına bıraktığımızda, genellikle aradığımız çözümün aslında dağların ardında değil, tam olarak gözümüzün önünde durduğunu hayretle fark ederiz. Odadaki sıradan bir eşya, beklenmedik bir ses veya bedenimizdeki bir his anında ihtiyacımız olan o devasa ilhamı verebilir. Yeter ki "Ne olması gerektiğine" dair o katı beklentilerimizi bırakıp, "Nelerin olabileceğine" açık olalım.
      Bu aşamada sanatçıların en sık düştüğü ölümcül tuzak "Ya Hep Ya Hiç" (All or Nothing) zihniyetidir. Aylarca üzerinde çalıştığınız bir tablonun ya da şarkının belli bir köşesinde (örneğin %20'lik kısmında) bir kusur, bir uyuşmazlık fark edersiniz. Ve o anki hayal kırıklığıyla, "Bu iş olmadı, tamamen çöp!" diyerek bütün eseri çöpe atarsınız. Oysa eserin %80'i muazzamdır ve çalışıyordur! Sadece o %20'lik zayıf kısmı nasıl çıkaracağınızı, dönüştüreceğinizi veya başka bir elementle değiştireceğinizi bulmanız gerekir. Sanatçı, olumsuz önyargıyla tüm ormanı yakmak yerine, açık bir zihinle eserin güçlü ve zayıf yanlarını aynı anda görebilme olgunluğuna sahip olmalıdır.
      Bu bölümün özü: Yaratıcı tıkanıklıklar (çıkmazlar) ilhamın yok olmasından değil, bizim o an analitik beklentilere sıkışıp akışa bağlanmayı reddetmemizden kaynaklanır. Eserin küçük bir kusuru yüzünden tamamını çöpe atmak ("ya hep ya hiç" tuzağı) yerine zihni serbest bıraktığımızda, aradığımız çözümün genellikle tam da gözümüzün önünde durduğunu fark ederiz.
      50. Gaipten Bir Fısıltı (İlhamın İnce Sesi)
      Büyük, destansı, yıllarımızı vereceğimiz o devasa projeye (bir filme, koca bir romana) başlarken, içten içe göklerin yarılmasını, meleklerin şarkı söylemesini ve bize "İşte bu o harika fikir!" diye bağıran görkemli bir işaret gelmesini bekleriz. Oysa evrenin işleyişi hiç de böyle Hollywood filmlerindeki gibi dramatik değildir.
      Rubin'e göre, evrenden gelen o en güçlü, en devrimci fikirler, genellikle algılanması çok güç, son derece zayıf ve cılız bir "fısıltı" olarak gelir. Otoparkta yürürken duyduğunuz rastgele bir kelime, sabah uyandığınızda aklınızda kalan silik bir rüya parçası... O an için bunlar çok önemsiz, çok küçük "tohumlar" gibi görünür. Zihnimiz hemen araya girip, "Bu kadar küçük ve saçma bir fikirden koca bir roman çıkar mı?" diye o fısıltıyı küçümseyerek elemek ister.
      İşte en büyük hata budur: Bir fikrin değerini ve potansiyelini, onun büyüklüğüyle veya üzerimizde yarattığı o ilk etkiyle ölçemeyiz. Minicik bir meşe palamudundan, yüzyıllarca yaşayacak devasa bir meşe ağacı doğar. Basit, cılız bir içgörü, ileride yepyeni dünyaların kapılarını açacak o devasa eserin ta kendisi olabilir.
      Bu fısıltıları duyabilmek için sürekli gürültü üreten, analiz yapan, problem çözmeye çalışan zihnimizi susturmamız şarttır. Çırpınmak sadece suyu bulandırır. Meditasyon yaparak, yürüyüşe çıkarak ya da yüzerken zihni rölantiye alarak antenlerimizi bu fısıltılara (kozmik sinyallere) açık hale getirmeliyiz. İlhamı zorla var edemezsiniz, onu sadece evinize (zihninize) sessizce davet edebilirsiniz.
      Bu bölümün özü: Yıllar sürecek devasa projelere yön veren fikirler, genellikle şimşekler çakarak değil; rüyalarda veya sıradan anlarda beliren cılız, kozmik bir fısıltı halinde gelir. Sanatçı, analitik zihniyle çırpınıp suyu bulandırmak yerine zihnini dinginleştirerek bu sessiz işaretleri içeri buyur etmeli ve hiçbir fikrin değerini başlangıçtaki "küçüklüğüne" bakarak yargılamamalıdır.
      51. Sürprizlere Hazır Olun (Beklenmedik Hataların Hediyesi)
      Sanat yaparken her şeyi milimi miline kontrol etmeye çalışırız. Ancak en nefes kesici, en çarpıcı sanatsal kararlarımız genellikle bizim "kontrolü tamamen kaybettiğimiz" anlarda, sanki kazara (yanlışlıkla) ortaya çıkanlardır.
      Rubin bu anları "Yaratıcı Freudyen Dil Sürçmeleri" olarak tanımlar. Siz stüdyoda bir ritmi çalarken eliniz kayar ve "yanlış" bir nota basarsınız. İlk anda "Eyvah, hata yaptım" dersiniz. Ama kaydı dinlediğinizde o "hata"nın, günlerdir aradığınız, parçaya ruh katan o kusursuz sihir olduğunu fark edersiniz. Siz farkında olmadan, bilinçaltınız (o engin bilgelik) devreye girmiş ve bilinçli niyetinizin önüne geçerek size muazzam bir hediye sunmuştur. Nasıl yaptığınız sorulduğunda "Bilmiyorum, elim kaydı, içimden öyle geldi" dersiniz.
      Bu sürprizlerin, bu büyülü "kazaların" sık sık başınıza gelmesini istiyorsanız, yapmanız gereken tek bir şey vardır: Kontrolü elden bırakmak ve teslim olmak.
      Beklentilerinizi, eserin nihai olarak neye benzemesi gerektiğine dair o katı senaryonuzu çöpe atın. Tıpkı ayrıntılı bir kitap taslağı hazırlayıp sonra onu tamamen bir kenara bırakarak yazmak gibi... Siz direksiyonu bırakıp yaratıcı enerjinin o azgın akışına kendinizi (alçakgönüllülükle) teslim ettiğinizde, evren sizin aracılığınızla planlayabileceğinizden çok daha muazzam ve şaşırtıcı şeyleri tekrar tekrar ortaya çıkaracaktır. Bilinmeyene güvenin.
      Bu bölümün özü: Yaratım sürecinde tam bir uyum (akış) halindeyken ortaya çıkan "hatalar", aslında bilinçaltımızın kontrolü ele alıp bize sunduğu eşsiz yaratıcı hediyelerdir (sürprizlerdir). Sanatçı, eserin sonucunu katı bir şekilde kontrol etmeye çalışmak yerine alçakgönüllülükle sürece teslim olduğunda, evrenin o yüksek bilgeliğinin kendi aracılığıyla beklenmedik şaheserler yaratmasına olanak tanır.
      52. Büyük Umutlar (Beklentilerin Baskısını Kırmak)
      İster ilk kez bir eser üreten acemi olun, ister dünyaca ünlü, deneyimli bir sanatçı; yeni bir projeye başladığınız o ilk gün, o boş tuvalin (veya sayfanın) karşısına geçtiğinizde içinizi daima bir endişe kaplar. Bir yanda harika bir iş çıkarma heyecanı varken, diğer yanda "Ya bu sefer başaramazsam? Ya önceki işim kadar iyi olmazsa?" korkusu bedeninizi felç eder.
      Rubin bu felç edici korkunun kaynağının, sonucun bizim kontrolümüzde olmadığı gerçeğine direnmek (beklentilerin altında ezilmek) olduğunu söyler. Bu baskıyı kırmanın yolu, sanatçı kimliğinden biraz sıyrılıp laboratuvardaki bir "bilim insanı" gibi davranmaktır.
      Bir bilim insanı, deney yaparken "Bu deney kesinlikle dünyayı kurtarmalı, yoksa ben bir hiçim" demez. O sadece değişkenleri değiştirir, suyu ısıtır, asidi ekler ve "Bakalım ne olacak?" diyerek sonucu not alır. Başarısız olan bir deney onun için bir yenilgi değil, sadece bir "veridir" (öğrenmedir). Hangi yolun işe yaramadığını öğrenmiş ve doğru çözüme bir adım daha yaklaşmıştır.
      Sanatçı da aynı şekilde deneysel sürece "körü körüne" güvenmelidir. Yaptığınız on denemenin onu da çöpe gitmiş olabilir. Geriye dönüp "Ben başarısız, yeteneksiz biriyim" derseniz orada boğulursunuz. Ama "Harika, bu on yolun işe yaramadığını öğrendim, şimdi on birinci yola bakayım" derseniz, işte o zaman başarısızlık sadece bir basamak olur. Cevabın zaten orada, evrenin bir köşesinde durduğuna ve sadece onu bulana kadar denemeye devam etmeniz gerektiğine (sürece) olan bu sarsılmaz inanç, o korkutucu boşluğa adım atmanızı sağlayan tek güçtür.
      Bu bölümün özü: Yeni bir esere başlarken duyduğumuz "başaramama korkusu" ve mükemmellik beklentisi, yaratıcı adımlarımızı felç eden zehirli bir baskıdır. Sanatçı, sonucu kontrol etmeye çalışmak yerine bir bilim insanı gibi sadece deney yapıp "neler olacağını" gözlemlemeye odaklandığında, başarısızlıkları bile hedefe giden değerli birer veriye dönüştürür.
      53. Açık Fikirlilik (Kuralların Prangalarından Kurtulmak)
      İnsanlık olarak medeniyetten önceki o vahşi doğada hayatta kalabilmek için, çevremizdeki tehlikeleri hızlıca yargılamayı, etiketlemeyi ve kestirme kararlar almayı öğrendik ("Şu çalılık hışırdadı, kesin aslandır, kaç!"). Günümüzün modern dünyasında da, zihnimiz hala bu kestirme yollara ve "katı inançlara" (kurallara) sığınarak o sonsuz belirsizliğin içinde kendini güvende hissetmek ister.
      Ancak hayatta kalmak için harika olan bu "dar, kapalı zihniyet", bir sanatçı için ölümcüldür. Sanatçı "güvenli ve küçük" olanı istemez. Zihnimizi, inançlarımızı daralttığımızda, sanatımızın içine girecek olan o taze ilham kaynaklarının kapılarını da kendi ellerimizle kapatmış oluruz. Yıllarca aynı yöntemi (aynı boyayı, aynı akorları) kullanmak önce verimli olsa da, zamanla körlüğe ve sıkıcı bir tekdüzeliğe dönüşür. Bu katılığı esnetmek, yeni ışıkların içeri girmesine izin verecek açık fikirliliğe (meraka) ulaşmak zorundayız.
      Bu açık fikirlilik, sadece sanat türlerine değil, işbirliği yaptığınız insanlara ve karşılaştığınız aksiliklere karşı da geçerlidir. Diyelim ki film setindesiniz ve kullanacağınız en önemli kamera kırıldı. Veya çok spesifik bir boyanız tükendi. Çoğu insan bu "beklenmedik" pürüz karşısında sinir krizi geçirir, projeyi durdurur. Oysa açık fikirli bir sanatçı bunu bir felaket değil, harika bir "fırsat" olarak görür: "Acaba elimizdeki şu bozuk kamerayla çeksek nasıl bir etki yakalarız? Boya bittiğine göre burayı tamamen boş bıraksam ne olur?" Akışı yeniden yönlendirmek, bizi o an hayal bile edemeyeceğimiz kadar devrimci ve çarpıcı bir çözüme ulaştırabilir.
      Bu bölümün özü: İnsan zihni belirsizlikten kaçmak için kestirme yollara ve katı kurallara sığınsa da, sanatçı bilinçli bir merakla bu sınırları esnetmek (açık fikirli olmak) zorundadır. İşler ters gittiğinde ya da beklenmedik arızalar çıktığında sinirlenip projeyi durdurmak yerine durumu bir fırsat bilip doğaçlama yapmak, sanatçıyı hayal edemeyeceği kadar çarpıcı çözümlere yönlendirir.
      54. Şimşek Çakması (İlham ve Emek Dengesi)
      İlham anları öylesine görkemlidir ki, bazen kafamızın içinde kelimenin tam anlamıyla bir "şimşek" çakar. Aylar sürecek bir projenin tüm vizyonu, tek bir saniye içinde gözlerimizin önüne serilir. Zihnimiz açılır ve evrenin o kusursuz enerjisi içimize dolar. Bu büyüleyici hisse bağımlı olan bazı sanatçılar, hayatlarını birer "fırtına avcısı" gibi geçirirler; sadece o göksel şimşek çaktığında (ilham geldiğinde) çalışırlar.
      Rubin, bu romantik ama tehlikeli yaklaşımı yere çarpar: Sadece ilham geldiğinde çalışan bir sanatçı uzun ömürlü olamaz. Önemli olan o şimşeğin çaktığı saniye değil; o şimşekten "öncesi" ve **"sonrası"**dır.
      Öncesi önemlidir; çünkü siz her gün o masaya oturmazsanız, zihninizi (antenlerinizi) hazırlamazsanız, o şimşek çaksa bile onu yakalayamazsınız. Sonrası önemlidir; çünkü o göksel ilham geldiğinde kollarınızı sıvayıp o enerjiyi kağıda (veya tuvale) aktarmazsanız, o elektrik havaya karışıp dağılır gider.
      Bir sanatçı, en nihayetinde bir "zanaatkardır". Tıpkı bir marangozun ilham beklemeksizin her sabah atölyesini açıp tahtayı yontması gibi, sanatçı da disiplinle her gün işinin başına geçmelidir. Bazen o büyük kozmik şimşekler hiç çakmaz. Siz sadece çalışır, dener, ufak parçaları birleştirirsiniz ve birden bire emeğinizin ortasından "Küçük bir a-ha! anı" doğar. Çaba olmadan, tek başına ilham işe yaramaz bir hevesten ibarettir. Gökyüzü aydınlandığında ona minnettar olun, ama karanlık olduğunda da yontmaya devam edin.
      Bu bölümün özü: Zihnimizde görkemli vizyonlar yaratan ilham "şimşeklerini" bekleyerek eylemsiz kalmak (fırtına avcılığı) sanatçıyı tüketir. Gerçek sanatçı; o ilham gelmeden önce zihnini her gün bir zanaatkar disipliniyle çalışarak hazırlayan, ilham çaktıktan sonra ise o elektriği esere dönüştürmek için ter döken kişidir.
      55. 7/24 (Kendinizi Vermek)
      Günümüz dünyasında meslekler mesai saatleriyle sınırlıdır. Akşam 5'te ofisten çıkarsınız, bilgisayarınızı kapatırsınız ve "işiniz" biter. Sanatçılık ise asla bilgisayarın fişini çekmekle biten bir meslek değildir. Sanatçı olmak, haftanın 7 günü 24 saati "nöbette" olmak demektir. Çünkü sanat, sadece stüdyoda "yaptığınız" bir eylem değil, sokakta yürürken, yemek yerken, rüya görürken "olduğunuz" (var olduğunuz) bir şeydir.
      İlhamın, fısıltıların ve o harika tohumların ne zaman geleceği hiçbir zaman belli olmaz. Arkadaşınızla bir restoranda sıradan bir sohbet ederken, sokağın köşesindeki kırık bir tabelaya bakarken ya da uykuyla uyanıklık arasındaki o loş çizgide gezinirken... İşte o anlarda zihniniz her an bir "not defteri" veya bir "eskiz" çıkarmaya hazır olmalıdır.
      Kendinizi 7/24 bu algıya vermek; dünyaya kesintisiz bir açıklıkla, hayretle ve merakla bakmak demektir. Dış dünyada olup bitenleri, bağlantıları, hikayeleri sürekli olarak bir sünger gibi içinize çekersiniz. Bir sörfçü denizin dalgalarını nasıl kontrol edemezse, sanatçı da evrenin yaratıcı ritmini kontrol edemez. Yapabileceğiniz tek şey sörf tahtanızın üzerinde her an uyanık kalmak ve dalga geldiğinde ona binmektir. En iyi fikir, belki de tam bu akşam yatağa girmeden aklınıza gelecek olan fikirdir; yeter ki onu karşılamaya hazır olun.
      Bu bölümün özü: Sanatçılık, mesai saatleriyle sınırlı bir iş değil; rüyalarda, yolda, sohbette yani hayatın her saniyesinde dikkat ve alıcılık gerektiren kesintisiz (7/24) bir yaşam biçimidir. Fikirlerin (dalgaların) ne zaman geleceği belli olmadığı için, sanatçının yegane görevi her an not almaya, dinlemeye ve gözlemlemeye hazır açık bir radar gibi yaşamaktır.
      56. Kendiliğindenlik (Özel Anlar)
      Sanat dünyasında iki farklı romantikleştirilmiş görüş çarpışır durur. Bir taraf der ki: "Gerçek sanat, Jackson Pollock'un boyayı aniden fırlatması gibi, hiçbir plan olmadan, bir saniyede (doğaçlama) kalpten dökülen sanattır!" Diğer taraf ise der ki: "Hayır! Gerçek sanat, bir dâhinin yıllarca planlayıp, mimari bir kusursuzlukla, milim milim inşa ettiği (emek kokan) sanattır!"
      Rubin, yüzlerce albüm yapmış bir efsane olarak son noktayı koyar: İkisinin de birbirinden hiçbir üstünlüğü ya da aşağı kalır yanı yoktur. Leonard Cohen bir şarkıyı yazmak için yıllarca kan ter içinde kalır; Bob Dylan ise aynı kalibrede bir şarkıyı on beş dakikada, bir peçetenin arkasına karalayıverir. Biz ikisini de aynı derinlikle severiz. Mühim olan eserin harcanan zamanı değil, ortaya çıkan sonucun bizi ve dünyayı ne kadar etkilediğidir.
      Ancak zihinsel ve kontrollü çalışmaya çok alışmış sanatçılar için "Kendiliğindenlik (Doğaçlama)" muazzam bir kilit açıcıdır. Bazen hiçbir plan, hiçbir nota kağıdı olmadan, sırf o anın vahşiliğine (caz müzisyenleri gibi) kendinizi bıraktığınızda, analitik zihnin ulaşamayacağı o "özel anlara" ve bilinçaltı sıçramalara ulaşırsınız.
      Fakat burada çok hayati bir uyarı vardır: O doğaçlama, kendinden geçme anlarında (stüdyodaki partiye benzeyen o çılgın kayıt seanslarında) çıkan harika fikirler genellikle saniyeler içinde "unutulur". Herkes o anın büyüsüne kapılır ve ertesi gün "Dün çaldığımız o harika nakarat nasıldı?" diye birbirine sorar, ama kimse hatırlayamaz. İşte bu yüzden Rubin stüdyoda bu anlar yaşanırken "asla sürece dahil olmayan bir gözlemcinin" aralıksız ve detaylı not tutmasını sağlar. O çılgın, kendiliğinden gelen ilham anlarının rüzgarda kaybolup gitmesini engelleyen tek şey, arka planda tutulan bu titiz kayıtlardır.
      Bu bölümün özü: Hiç çaba harcanmadan, bir çırpıda doğaçlama ortaya çıkan (kendiliğinden) bir eserin, yıllarca ter dökülüp tasarlanmış bir esere nitelik açısından hiçbir üstünlüğü ya da eksikliği yoktur. Ancak zihni devreden çıkararak kendiliğindenliğe alan açmak muazzam keşifler sunar; şartı ise bu vahşi ve uçucu "özel anların" unutulup gitmemesi için sürecin titizlikle not alınmasıdır (kaydedilmesidir).
      57. Nasıl Seçmeli? (Karar Verme Sanatı)
      Yaratıcı süreç baştan sona bir seçimler ağacıdır. Tohumu bulduk, dallanıp budaklandı. Peki gitarı akustik mi çalalım elektro mu? Rengi mavi mi yapalım kırmızı mı? Bir yanda A seçeneği duruyor, diğer yanda B seçeneği. Nasıl seçeceğiz? Zihnimizle mantıklı bir analiz mi yapacağız? Hayır!
      Rubin, mantığı devre dışı bırakıp içgüdünün (evrenin) kararı vermesi için stüdyoda en sık kullandığı inanılmaz basit ama mucizevi bir yöntemi anlatır: A/B Testi (Kör Test).
      Aynı şarkının vokallerini bir eski mikrofonla, bir de son teknoloji yeni mikrofonla kaydettiğinizi düşünün. Eğer hangi sesin hangi mikrofona ait olduğunu bilirseniz, "ego ve önyargınız" devreye girer. "E bu mikrofon 10 bin dolar, kesinlikle bu daha iyi" dersiniz. Ama Rubin şarkıcıyı odaya alır, A ve B kayıtlarını peş peşe "hangisi olduğunu söylemeden (körlemesine)" dinletir. Çoğu zaman bedenin verdiği o saf tepki, sanatçının egosuyla beklediği sonuçtan tamamen farklı, şaşırtıcı ama kesinlikle çok daha doğru bir seçimi işaret eder.
      Peki ya A ve B arasında hiçbir fark göremiyor, tamamen kararsız kalıyorsanız? İşte burada Rubin'in en favori taktiği devreye girer: Yazı tura atmak. "A seçeneği Yazı, B seçeneği Tura olsun" dersiniz ve parayı havaya fırlatırsınız. İşin sırrı paranın yere düşüp hangi yüzünün geldiğine bakmak değildir! Para havada fırıl fırıl dönerken, içinizde aniden "Ne olur yazı gelsin!" diyen o minicik, gizli bir feryat duyarsınız. İşte o feryat, sizin bilinçaltınızın çoktan kararını verdiğini gösterir. Test, para henüz yere düşmeden sonuçlanmıştır! İlk içgüdüsel tepki daima en saf olandır; akıl onu yorumlamaya başlarsa işin büyüsü bozulur.
      Bu bölümün özü: Yaratım sürecindeki kritik karar anlarında, seçenekleri yan yana koyup bilinçli (mantıksal) zihni tamamen devreden çıkaracak "Kör A/B testleri" veya "yazı tura" taktiği kullanılmalıdır. Para havada dönerken içinizden geçen o anlık, saf ve dürtüsel (hangi seçeneğin gelmesini dilediğiniz) his, daima en doğru sanat tercihini gösterir.
      58. Tonlar ve Ölçüler (Çabanın Görünmez Matematiği)
      Matematikte veya fabrikada kural basittir: Bir şeye 10 birim emek verirseniz, 10 birimlik sonuç alırsınız. Sanat söz konusu olduğunda ise bu oran (ölçü) tamamen paramparça olur!
      Aylarınızı verdiğiniz, uykusuz kaldığınız o devasa çalışma günün sonunda hiçbir işe yaramayabilir ve esere zerre kadar katkı sağlamayabilir. Ama bir gün, kahvenizi yudumlarken, sadece fırçanın ucunu hafifçe tuvale dokundurursunuz, miks masasında o çok gürültülü gitarın sesini sadece bir milim aşağıya çekersiniz... Ve o küçücük, mikroskobik dokunuş, yarım ve ölü gibi duran o eseri aniden kusursuz bir "başyapıta" dönüştürür. Mucize gerçekleşmiştir!
      Rubin bize sanattaki efor ile sonucun hiçbir zaman doğru orantılı olmadığını hatırlatır. Eseri büyük yapan şey, aslında doğru "tonların ve ölçülerin" bir araya gelmesidir ve o ölçüyü bazen devasa hamleler değil, bir kum tanesi kadar küçük detaylar belirler. Sanatçı, büyük gayretlerin büyük sonuçlar vereceği yanılgısından kurtulmalı; asıl sihrin, eseri tamamlayan o ufacık, doğru oranlanmış "ince ayarlarda" gizli olduğunu (eserin ancak o ince ayarlarla nefes alıp yaşamaya başlayacağını) bilmelidir.
      Bu bölümün özü: Sanat eserini yaratırken harcanan mesai ile alınan sonuç arasında hiçbir zaman adil veya sabit bir matematiksel orantı bulunmaz. Sıradan bir eseri aniden başyapıta dönüştüren mucizevi anlar, devasa değişikliklerden değil; oranları ve tonları ustalıkla ayarlanmış, esere son nefesini üfleyen o minicik, görünmez detaylardan doğar.
      (Bölüm 41'den 58'e uzanan bu devasa incelemede, sanatçının dış dünyayla ve kendi zihniyle girdiği o en kaotik, en şaşırtıcı mücadeleleri adım adım, en ince detaylarına kadar işledik. Eğer istersen, bu yolculuğun nihai felsefesini tartışacağımız diğer parçalarla derinleşmeye devam edebiliriz!)
  - baslik: Parça 5 · Sanatın Anlamı, Özgürlük ve Evrensel Uyum (Bölüm 59-78)
    icerik: |-
      Harika bir felsefi ve ruhsal derinliğe sahip olan bu son parçaya, yani sanatın nihai amacını, evrensel ahengini ve bizim bu devasa kozmik oyundaki rolümüzü inceleyeceğimiz Parça 5: Sanatın Anlamı, Özgürlük ve Evrensel Uyum bölümüne giriş yapıyoruz. Kahvenizi alın, çünkü burada sadece teknik bir sanat üretiminden değil, doğrudan ruhumuzun derinliklerinden, "Neden buradayız ve neden üretiyoruz?" sorusunun cevabından bahsedeceğiz. Her bir bölümü yazarın argüman zincirini takip ederek, en ince detayına kadar, hayatın içinden analojilerle yeniden inşa edeceğiz.
      59. Gizli Anlamlar (Amaç)
      Sanat yaparken veya yaratıcı bir projeyle boğuşurken çoğumuzun zihnine o varoluşsal, ağır soru düşer: "Bunu neden yapıyorum? Tüm bunların amacı ne?" Saatlerimizi, günlerimizi ve belki de yıllarımızı bir tuvalin, bir klavyenin ya da bir müzik aletinin başında harcarken, yaptığımız eyleme ulvi, mantıklı ve derinlemesine düşünülmüş bir "gizli anlam" bulmaya çalışırız.
      Ancak Rick Rubin, bizi rahatlatan çok sarsıcı bir iddiada bulunur: Yaratmak için mantıklı, ulvi veya açıklanabilir bir nedene ihtiyacımız yoktur
      . Hatta yazar, bu tür soruların aslında pek bir önem taşımadığını, çünkü bizi harekete geçiren şeyin "belirli bir amaç" olmak zorunda olmadığını söyler
      . Bunu günlük hayattan çok basit bir eyleme benzetebiliriz: Sokakta yürürken aniden neşeyle ıslık çalmaya başladığınızı düşünün. O ıslığı çalmanızın dünyayı kurtarmak, birine mesaj vermek ya da bir problemi çözmek gibi bir "amacı" var mıdır? Hayır, sadece o an içinizden geldiği için, o melodiyi dudaklarınızdan dökmek hoşunuza gittiği için çalarsınız. Sanat da tam olarak böyledir.
      Eğer neden ürettiğimiz üzerinde gereğinden fazla kafa yorarsak, zihnimiz o harika ve coşkulu fikrin aslında pratik dünyada "hiçbir işe yaramadığını" söyleyerek bizi sabote edebilir
      . Nedenlerimizin ne olduğu bazen çok açıktır, bazen ise tamamen bir sır olarak kalır ve zamanla sürekli değişir
      . Bizi o an o eseri üretmeye iten binlerce farklı bilinçaltı sebebi olabilir
      . Sanatçı olarak görevimiz, eserin gizli felsefesini dedektif gibi çözmeye çalışmak değildir. Eğer hoşumuza giden, içimizi titreten bir şey ortaya çıkardıysak, görevimiz tamamlanmış demektir
      . Zihnimizde dönüp duran o "Neden?" sorusuna verilecek tek, en saf ve en özgürleştirici yanıt şudur: "Ben sadece yaratmak için buradayım"
      .
      Bu bölümün özü: Bir eser yaratmak için ardında yatan büyük, mantıklı veya gizli bir "neden" bulmaya çalışmak gereksiz bir yüktür ve yaratıcılığı zedeler. Sanatçı, hiçbir amacı olmasa bile sadece üretmenin verdiği haz için yaratma eylemini kucaklamalı ve "sadece yaratmak için burada olduğunu" kabullenmelidir.
      60. Özgürlük
      Toplum, her zaman sanata ve sanatçıya bir görev yüklemeye bayılır. Sanatçının topluma karşı sorumlu olduğu, sanatıyla insanlara bir şeyler öğretmesi, ahlaki bir mesaj vermesi ya da dünyayı değiştirmesi gerektiği fikri her yerde karşımıza çıkar
      . Ancak Rubin, bu "toplumsal sorumluluk" dayatmasının, sanatın asıl değerini ve işlevini hiç anlamamış kişilerin uydurması olduğunu sert bir dille ifade eder
      .
      Yazarın argümanı çok nettir: Sanatın, yaratıcısının sosyal sorumluluk kaygısından tamamen bağımsız, bambaşka bir amacı vardır
      . Eğer bir sanatçı, "İnsanların bu konudaki düşüncelerini değiştireyim, onlara bir mesaj vereyim" niyetiyle yola çıkarsa, bu "öğretmenlik" kaygısı eserin o el değmemiş saflığına ve kalitesine büyük bir gölge düşürür
      . İnsanlara ne düşüneceklerini dikte eden, onlara parmak sallayarak mesaj veren eserler genellikle umulan o toplumsal etkiyi yaratmakta başarısız olurlar
      . Neden mi? Çünkü kimse kendisine ne yapması gerektiğinin söylenmesinden, didaktik bir derse maruz kalmaktan hoşlanmaz. Oysa hiçbir toplumsal soruna değinme amacı gütmeyen, tamamen sanatçının kendi içsel merakından doğan bir eser, paradoksal bir şekilde dünyada çok daha "devrimci" ve sarsıcı bir etki yaratabilir
      .
      Peki sanat tamamen sorumsuz mudur? Hayır, ama onun sorumluluğu insan doğasını tüm karanlığı ve aydınlığıyla, olduğu gibi yansıtmaktır
      . Hepimizin içinde toplumsal normların kabul etmediği, dışlanmaktan korktuğumuz için kimseyle paylaşamadığımız o karanlık, tuhaf, karmaşık düşünceler ve duygular vardır
      . Bir sanatçı, hiçbir ahlaki filtre uygulamadan bu karanlık duygularını (örneğin şiddetli bir kıskançlığı, derin bir depresyonu ya da yasak bir arzuyu) cesurca bir tabloya veya şarkıya döktüğünde, izleyici o esere bakar ve "Aman Tanrım, ben de böyle hissediyordum ama yalnız olduğumu sanıyordum!" der
      . İşte sanatın o efsanevi sağaltıcı (iyileştirici) gücü tam da burada, bize daha insani ve gerçek olduğumuzu göstermesinde yatar
      .
      Sanatçı olarak eserinizin avukatı olmak, onu savunmak ya da eserin sizin tüm kişiliğinizi temsil etmesi gibi bir zorunluluğunuz yoktur
      . Sizin tek ve yegane sorumluluğunuz, dış sansürleri ve kafanızın içindeki "bu kabul edilebilir mi?" diyen o içsel sesleri susturarak, bizzat "sanata karşı" dürüst olmaktır
      . Dünya, ancak siz kendinize bu özgürlüğü tanıdığınız kadar özgür olabilir
      .
      Bu bölümün özü: Sanatın amacı topluma didaktik bir mesaj vermek, ahlak dersi sunmak veya dünyayı değiştirmek gibi dışsal bir yükümlülük taşımamalıdır. Sanatçının yegane sorumluluğu, içindeki en karanlık ve kabul görmez duyguları bile cesurca ve özgürce ifade etmektir; çünkü sanatın asıl iyileştirici gücü, izleyiciye "yalnız değilsin" hissini doğal yollarla verebilmesinde gizlidir.
      61. Mustaripler (Istırap Çeken Sanatçı Miti)
      Sinema filmlerini veya dramatik kitapları düşünün; karşımıza hep aynı o klişe "ıstırap çeken sanatçı" profili çıkar. Kirli bir çatı katında aç susuz yaşayan, kendine zarar veren, deliliğin ince çizgisinde gidip gelen, sürekli bir buhran içindeki dahi...
      . Toplum, bu romantikleştirilmiş imgeler yüzünden büyük sanatın ancak "ruhu yaralanmış" insanlardan çıkabileceğine ya da sanat icra etmenin insanı deliliğe ve hasara sürüklediğine inanmaya başlamıştır
      .
      Rubin bu düşüncenin tamamen yanlış ve kurgusal bir mit (yanılgı) olduğunu belirtir
      . Bu asılsız genellemeler, sanata yeni adım atacak gençlerin gözünü korkutur. Gerçekte durum şudur: Kimi sanatçılar gerçekten derin karanlıklarla ve varoluşsal acılarla boğuşurken, pek çok sanatçı da hayatını büyük bir neşe, denge ve coşku içinde sürdürür
      . Yaratıcılık yelpazesi çok geniştir.
      Dahası, o bahsi geçen "aşırı duyarlı" ve ruhsal sorunlar yaşayan sanatçılar için sanat bir zehir değil, tam aksine hayat kurtarıcı bir sığınaktır
      . Dünyanın ağırlığını kaldıramayan bu aşırı hassas bireyler, içlerindeki o kelimelere dökülemeyecek kadar ağır travmaları, ancak bir sanat eserine kanalize ettiklerinde güvende hissederler
      . Yani sanat onları çöküşe sürükleyen şey değil, o çöküşün önündeki tek "sağaltıcı" kalkandır
      .
      Elbette büyük ve kalıcı eserler ortaya koymak saplantılı bir arzu, yoğun bir disiplin ve emek ister; ancak bu emeğin "acı verici" olması zorunlu değildir
      . Eğer önünüzde iki yol varsa (kendini yıkarak üretmek ya da coşkuyla üretmek), yazarın tavsiyesi daima daha sürdürülebilir olanı, yani kendi hızınızda, neşe ve huzur içinde üretmeyi seçmenizdir
      .
      Bu bölümün özü: Efsaneleşmiş "kendine zarar veren, ıstırap çeken sanatçı" imgesi, büyük sanatın ancak acıdan doğabileceğini savunan kurgusal ve zararlı bir mitten ibarettir. Aşırı duyarlı bireyler için sanat bir yıkım değil, o yoğun duyguları iyileştiren güvenli bir sığınaktır; sanatçı, acı çekme zorunluluğu hissetmeden sürdürülebilir ve coşkulu bir üretim yolunu seçmelidir.
      62. Sizin İçin İşe Yarayan Şey (İnanmak)
      Sanat tarihine baktığımızda dehaların kendilerine has, bazen son derece saçma ve tuhaf ritüelleri olduğunu görürüz. Rubin bu konuyu akıllara durgunluk veren somut örneklerle açar: Tam 30 yıldır darmadağınık, pis bir ofiste beste yapan ve "işin sırrının o odanın dağınıklığında" olduğuna inanan bir söz yazarı
      . Doğal elektrik akımlarıyla hizalandığına inandığı için uyurken yatağını pusulayla her zaman kuzeye çeviren efsanevi yazar Charles Dickens
      . Veya tıkandığında editörüyle birlikte gizli bir dolaptan çıkardığı yüzlerce farklı şapkadan birini takıp birbirlerine bakarak ilham arayan Dr. Seuss
      .
      Bu hikayeler gerçek mi, yoksa birer efsane mi? Yazar, bunun hiçbir öneminin olmadığını vurgular
      . Mesele şapkanın, pusulanın ya da dağınık odanın kendi içinde mistik, büyüleyici bir güce sahip olması değildir. İşin tek bir sırrı vardır: O ritüelin işe yarayacağına "inanmak"
      . Eğer bir sanatçı kırmızı bir kalemle yazdığında daha iyi fikirler bulduğuna kendini inandırmışsa, bu batıl inanç onun o "yaratıcı kanalı" açmasını sağlar. Bizi zihnimizin kısıtlamalarından kurtaran şeyin ne kadar çılgınca göründüğünün hiçbir önemi yoktur; işe yarıyorsa, mükemmel bir yöntemdir.
      Peki biz bu ustalara bakıp onların yöntemlerini kopyalamalı mıyız? Hayır. Rubin, diğer tecrübeli sanatçılardan tavsiye almanın ufkumuzu genişletebileceğini söyler, ancak bu tavsiyeler asla "kesin direktifler" olarak algılanmamalıdır
      . Başka birine harika bir eser verdiren yöntem, sadece "onun" yolculuğuna aittir
      . Belki o kişi güneşte yürüyerek ilham bulur, ama siz gece karanlıkta piyano çalarak bulursunuz. Başkalarının bilgeliğini alın, test edin, işinize yarayanı (size uyanı) cebinize koyun ve uymayanları hiç acımadan çöpe atın
      . Sizin için tek doğru yol, ısrarla ve istikrarla sürdürebildiğiniz kendi özgün ritüelinizdir
      .
      Bu bölümün özü: Efsanevi sanatçıların ilham bulmak için uyguladığı tuhaf ritüeller (kuzeye dönük uyumak veya şapka takmak) mantıksız görünse de, sanatçının sürece "inanmasını" sağladığı için mükemmel şekilde işlerler. Bir sanatçı başkalarının bu öznel yöntemlerini katı kurallar olarak kopyalamamalı; sadece test edip kendi doğasını ateşleyen ve inanarak sürdürebildiği o benzersiz ritüeli keşfetmelidir.
      63. Adaptasyon
      Sanatta ve hayatta ustalaşmanın sadece sürekli olarak, hiç durmadan çalışmak ve pratik yapmaktan (ter dökmekten) ibaret olduğunu sanırız. Ancak Rubin, hepimizin bildiği fiziksel bir gerçeklikten yola çıkarak çok daha derin bir evrensel yasayı önümüze koyar.
      Diyelim ki çok zor bir piyano parçasını öğrenmeye çalışıyorsunuz. Günlerce, saatlerce pratik yaparsınız, parmaklarınız yorulur, bazen biraz ilerler bazen gerilersiniz. Sonra o piyanoyu kapatıp, iki-üç gün boyunca o parçanın yüzüne bile bakmazsınız. Birkaç gün sonra piyanonun başına oturduğunuzda, o geçemediğiniz zorlu düğümün sanki sihirli bir değnek değmişçesine kendiliğinden çözüldüğünü, parmaklarınızın o parçayı sular seller gibi çaldığını hayretle görürsünüz
      . Ne olmuştur? Siz piyanodan uzaktayken bedeniniz ve zihniniz o bilgiyi özümsemiş, "adapte" olmuştur
      .
      Yazar bunu ağırlık antrenmanına benzetir. Spor salonunda ağırlık kaldırdığınızda (aktif alıştırma anında) aslında kaslarınızı yıkarsınız, parçalarsınız. Kaslar, siz ağırlık kaldırırken değil; siz eve gidip uyuduğunuzda, yani "dinlenme (pasif) evresinde" eskisinden çok daha güçlü bir şekilde yeniden inşa edilir
      . Sanat için de kural tıpatıp aynıdır. Durmadan, deliler gibi çalışmak işin sadece yarısıdır. Sanatçı zihnini ve ruhunu geliştirmek için, projeden tamamen koptuğu "dinlenme ve ara verme evrelerine" de aynı derecede muhtaçtır
      .
      Bu adaptasyon sürecinin sadece becerilerimizi geliştirmekten (piyano çalmayı hızlandırmaktan) çok daha devasa, kozmik bir anlamı vardır
      . Evrensel Kaynak'tan gelen bir fikir (tohum) enerjiyle yüklenip dünyaya inmek için bizi bekler. Ancak o anki ruhsal veya teknik kapasitemiz o görkemli fikri tutmaya, kavramaya yetmeyebilir
      . Biz pratik yaptıkça, sonra dinlenip adapte oldukça kapasitemiz genişler, esner ve o devasa evrensel fikri "kucaklayabilecek" bir olgunluğa (adaptasyona) erişir
      . Yani insanın sanatsal evrimi ve adaptasyonu, aslında doğanın milyonlarca yıllık evrim dürtüsünün bir yansımasıdır; evren, bizim aracılığımızla maddeleşmek ve gelişmek için bizi sürekli olarak kendisine uyum sağlamaya (adapte olmaya) iter
      .
      Bu bölümün özü: Sanatta ustalaşmak sadece durmaksızın efor sarf edip pratik yapmakla değil; beynin ve bedenin o yeni bilgiyi sindirmesini sağlayan "dinlenme evreleriyle" (ara vermekle) mümkündür. Sanatçı bu adaptasyon döngüsünü yaşayarak kapasitesini esnettiğinde, evrenden gelen o çok daha karmaşık ve büyük yaratıcı enerjileri kavrayıp kucaklayabilecek bir olgunluğa erişir.
      64. Çeviri
      İçimize doğan bir ilhamı, bir resmi ya da melodiyi kafamızın içinde duyduğumuzda o kusursuzdur, pırıl pırıldır. Ancak o hissi alıp dış dünyadaki fiziksel bir araca (boyaya, notalara, kelimelere) dönüştürdüğümüzde, genellikle bir şeyler eksik kalır. Neden? Çünkü Rubin'in deyimiyle sanat, aslen bir "çeviri" (çözümleme) eylemidir
      . Kaynak'tan gelen o evrensel saf bilgiyi alır, kendi seçtiğimiz sanat dalının diline çeviririz.
      Bu durumu yeni bir yabancı dil öğrenmeye benzetebiliriz
      . Diyelim ki yeni bir dil öğrenmeye başladınız. Markete gidip ekmek istemeyi, adres sormayı ya da ezberlediğiniz güzel bir iltifatı söylemeyi hızlıca başarabilirsiniz. Ancak iş, içinizdeki o en derin kederi, en incelikli felsefi düşünceyi ya da aşık olduğunuzdaki o karmaşık ruh halini o yeni dilde anlatmaya geldiğinde tıkanıp kalırsınız. Çünkü o dildeki "kelime dağarcığınız ve hüneriniz" henüz sizin ruhunuzdaki zenginliği aktaracak kadar gelişmemiştir
      .
      Sanatta teknik beceri (hüner) tam olarak bu "kelime dağarcığıdır". Çizim yeteneğinizi, müzik teorisi bilginizi veya kamera kullanma pratiğinizi ne kadar çok geliştirir, ne kadar çok araştırma yaparsanız; evrenden gelen o karmaşık sinyalleri eserinizde o kadar akıcı, özgür ve engelsiz bir biçimde ifade edebilirsiniz
      . Ünlü güreşçi Arn Anderson'ın sözü bunu mükemmel özetler: "Ben hem öğretmen hem de öğrenciyim. Öğrenciliği bırakırsanız artık kendinize öğretmen deme hakkınız olmaz"
      . Çalamadığınız bir nota yeteneksizliğinizden değil, "henüz" onu öğrenmemiş olmanızdan kaynaklanır
      .
      Peki teknik beceriyi mükemmelleştirmek tek başına bir başyapıt yaratmaya yeter mi? Kesinlikle hayır
      . Bazen dünyanın en karmaşık sololarını, en kusursuz teknikle atan bir gitaristi dinlersiniz, ama ruhunuzda hiçbir şey kımıldamaz. Sonra amatör bir genç gelir, gitarında sadece basit, üç akorlu bir şarkı çalar ve sizi gözyaşlarına boğar
      . Çünkü önemli olan tekniğin zorluğu değil, aktarılan niyetin saflığıdır. Teknik eğitim almanız, ille de o teknikleri kullanmak zorunda olduğunuz anlamına gelmez. Tarihteki büyük ressamlar (Mondrian, Joseph Albers gibi) dünyanın en zor klasik eğitimlerini almış usta ressamlar olmalarına rağmen, kariyerlerini sadece basit kareler ve monokrom renkler çizerek, en sade ifadeyi seçerek geçirmişlerdir
      . Beceri, size sadece hangi kelimeyi kullanacağınız konusunda sonsuz bir "seçme özgürlüğü" verir.
      Bu bölümün özü: Sanat, evrenden (Kaynak'tan) alınan o saf ve kusursuz titreşimleri, kullandığımız fiziksel aracın (notanın, boyanın) diline tercüme etme eylemidir. Teknik hünerlerimizi (sanat dilindeki kelime dağarcığımızı) geliştirmek bizi illa büyük bir sanatçı yapmasa da, o evrensel hisleri karmaşıklıktan uzak, çok daha sade, akıcı ve isabetli bir şekilde ifade edebilme özgürlüğü sağlar.
      65. Temiz Bir Sayfa Açmak
      Yaratıcı bir sürecin ortasında (veya sonlarına doğru), aynı şarkıyı bininci kez dinlediğinizde veya yazdığınız metni yüzüncü kez okuduğunuzda ne olur? Zihniniz uyuşur. Rubin buna "Körleşme" der
      . Eserle o kadar uzun süre, saatlerce haşır neşir olmuşsunuzdur ki, artık ona tarafsız, objektif ve berrak bir gözle bakma yeteneğinizi tamamen yitirirsiniz
      . Sizin yüz saat harcadığınız o tabloya, odaya yeni giren bir yabancı sadece iki dakika bakar ve eserdeki en büyük kusuru (sizin göremediğiniz kör noktayı) anında fark edip söyler
      .
      Sanatçı bu "körleşme" durumundan kurtulup eserine o yabancının taze gözleriyle bakabilmek için bilerek "Temiz Bir Sayfa Açmak" zorundadır
      . Yazar bunu bir müzik stüdyosundaki miks (ses dengeleme) süreciyle mükemmel bir şekilde örneklendirir:
      Diyelim ki bir şarkıyı dinlediniz ve notlar aldınız: "Geçiş bölümünde vokal yükselsin, son nakarattan önceki davul öne çıksın"
      . Gittiniz, masada bu ayarları milimi miline yaptınız. Çoğu sanatçının düştüğü tuzak şudur: Şarkıyı tekrar dinlerken ellerinde o listeyle dinlerler. Beyinleri sadece o listeye odaklanmıştır. "Evet, vokal yükselmiş mi? Yükselmiş. Davul öne çıkmış mı? Çıkmış."
      . Egonuz devreye girer ve "Tamam, dediklerim oldu, iş bitti" der
      . Oysa o yükselen davul, belki de arka plandaki en güzel gitar riffini tamamen yutmuş ve eserin bütününü eskisinden daha kötü bir hale getirmiştir (domino etkisi yaratmıştır)
      . Sırf listenize odaklandığınız için o şarkının "bütününün" nasıl tınladığını duyamaz olursunuz.
      İşte Rubin'in efsanevi taktiği: Bu notları asistanınıza veya ses mühendisinize verin. Onlar değişiklikleri yapsın. Sonra o not kağıdını çöpe atın
      . Stüdyoya geri dönün ve şarkıyı daha önce o notları siz yazmamışsınız gibi, hayatınızda "ilk kez" duyuyormuş gibi, temiz bir sayfayla dinleyin ve yeni bir liste yapın
      . Eserden bir süre tamamen kopmak, ormana yürüyüşe gitmek, ağır bir egzersiz yapmak da zihni sıfırlamak için harika yollardır
      .
      Bu bölümün özü: Bir eser üzerinde çok uzun süre çalışıldığında sanatçının objektif değerlendirme yeteneği kaybolur ve "körleşme" başlar. Bu tehlikeyi aşmak için, yapılan değişiklikleri kontrol etme (ego tatmini) dürtüsünü bir kenara bırakıp projeden belli sürelerle uzaklaşmak ve esere sanki "ilk kez karşılaşıyormuş gibi" yepyeni, temiz bir kulakla (veya gözle) yaklaşmak hayati önem taşır.
      66. Bağlam
      Bir eserin sadece "ne" olduğu değil, "nerede ve nasıl" sunulduğu da onun tüm ruhunu ve uyandırdığı duyguyu saniyeler içinde baştan aşağı değiştirebilir. Yazar buna Bağlam (Context) adını verir
      .
      Bu gücü anlamak için Rubin'in verdiği vurucu görsel analojiyi hayal edelim: Gözünüzün önüne yemyeşil bir çayırda, bahar rüzgarıyla salınan narin, güzel bir çiçek getirin
      . Muhtemelen içiniz huzur, yaşama sevinci ve doğallıkla doldu. Şimdi o çayırı tamamen silin. Aynı güzellikteki o birebir aynı çiçeği alın ve simsiyah, soğuk bir tüfeğin namlusuna yerleştirin
      . Veya aynı çiçeği gri bir mezar taşının üzerine koyun
      . Çiçek fiziksel olarak zerre kadar değişmedi, ancak sizde uyandırdığı duygu huzurdan çıkıp isyana, savaşa karşı barışa, ölüme, hüzne ve yasa dönüştü. Neden? Çünkü etrafındaki "Bağlam" (çerçeve) değişti
      .
      Sanatta, bir tablonun asıldığı duvarın rengi, bir sahnenin karanlık veya aydınlık çekilmesi eserin kimliğini tamamen belirler
      . Andy Warhol'un ünlü "Brillo (Bulaşık Süngeri) Kutuları"nı düşünün. O kutuları sıradan bir süpermarketin rafında görseniz, alışveriş sepetinize atacağınız çöpe gidecek bir karton ambalajdan ibaret sayarsınız
      . Fakat Warhol o kutuyu alıp beyaz duvarlı, şık bir sanat galerisinin ortasına koyduğunda (bağlamı müzeye taşıdığında), o karton kutu milyon dolarlık, üzerinde felsefi makaleler yazılan bir modern sanat harikasına dönüşür
      .
      Bağlam sadece mekanla sınırlı değildir; müzikte sıralama da bir bağlamdır. Albümünüzdeki çok gürültülü, yırtıcı bir rock şarkısını, kendisi gibi 10 tane gürültülü şarkının arasına koyarsanız sıradanlaşır. Ama o gürültülü şarkıdan hemen önce sadece fısıltıyla söylenen, akustik ve çok sakin bir şarkı çalarsanız (zıtlık bağlamı yaratırsanız), ardından patlayan o rock şarkısı dinleyiciye bir bomba gibi, devasa bir şok etkisiyle ulaşır
      . Eğer projenizdeki bir unsur (bir karakter, bir melodi) işe yaramıyor gibi görünüyorsa, onu silip atmadan önce arkasındaki bağlamı (öncesini, sonrasını, ortamını) değiştirmeyi deneyin
      . Beklemediğiniz bir kontrast, o ölü sandığınız unsuru eserin yıldızı yapabilir
      .
      Bu bölümün özü: Bir objenin (veya eserin) içinde yer aldığı ortam, öncesi ve sonrası, ışığı veya dönemi (bağlamı), onun izleyicide uyandırdığı duyguyu ve anlamı kökünden değiştiren yegane güçtür. Sanatçı, beklentisini karşılamayan bir unsuru çöpe atmak yerine; sessizliği gürültüyle, aydınlığı karanlıkla çerçeveleyerek (zıtlıklarla oynayarak) eserinde beklenmedik, çarpıcı yeni manalar yaratabilir.
      67. Enerji (Eserdeki)
      Saatlerce, günlerce, yemek yemeyi veya uyumayı bile unutarak bizi o stüdyo masasına ya da tuvalin başına çivileyen, yorgunluk hissettirmeyen o görünmez güç nedir? Çoğumuz bunun kendi kişisel disiplinimizden, içsel hırsımızdan veya "çok çalışkan" olmamızdan kaynaklandığını sanırız
      . Oysa Rubin'e göre bu devasa çekim kuvvetinin (enerjinin) kaynağı biz değilizdir. O enerji, bizzat eserin kendi bünyesinde (tohumunda) barınan ve eserden bize doğru akan "kinetik bir çekim kuvvetidir"
      .
      Bu çekimi dünyadaki en tanıdık, en güçlü diğer kavrama benzetir yazar: Sevgiye (Aşka)
      . Aşık olduğunuzda o kişiye doğru çekilmeniz mantıklı, rasyonel bir karar mıdır? Hayır, açıklanamaz bir çekimdir. Harika bir tohum (fikir) bulduğunuzda da aynı şey olur. O fikir, havada fırtına öncesi biriken o elektrikli (statik) enerji gibi titreşir; zihninize musallat olur, rüyalarınıza girer ve size kendisini tamamlatmak için adeta yaşama amacı verir
      .
      Fakat yaratım süreci her zaman böyle yüksek bir bulutun üstünde geçmez. Bazen yanlış yollara saparsınız, detaylarda boğulursunuz ve o baştaki "büyülü heyecan" yavaş yavaş azalır, hatta tamamen söner
      . İşte o anlarda iş, yemek yemeyi unuttuğunuz bir tutku olmaktan çıkar, duvara çentik atarak tahliye gününü bekleyen bir mahkumun eziyetine dönüşür
      . Dakikalar saat gibi gelir. Eğer bir proje uzun süredir size hiçbir heyecan vermiyorsa ve sadece "onca zaman harcadığınız için bitirmek zorunda olduğunuz bir yük" gibi geliyorsa, o eser muhtemelen miadını doldurmuş, enerjisi tükenmiştir
      .
      Sanatçı ve eser, doğadaki bitkiler ve arılar gibi birbirine muhtaç, simbiyotik (ortak yaşam) bir ilişki içindedir
      . Eser sizde heyecan ve enerji yaratır, sizin gösterdiğiniz o ilgi ve emek de eserin fiziksel dünyada büyümesini sağlar. İki taraftan biri (özellikle eserin enerjisi) biterse, süreç ölür. Bu yüzden sanatçının yegane görevi ve pusulası daima o "heyecanın (enerjinin)" peşinden gitmektir
      . Enerjiniz tükenmişse projeyi dondurun, birkaç adım gerileyin ya da size yeniden o alevi verecek yepyeni bir tohuma yönelin
      .
      Bu bölümün özü: Bizi günlerce uykusuz bırakıp esere bağlayan şey kendi disiplinimizden ziyade, sevgiye ve aşka benzeyen, eserin kendi bünyesinden bize yayılan o manyetik kinetik enerjidir (coşkudur). Eğer bu karşılıklı enerji tamamen sönmüş ve süreç bir eziyete dönüşmüşse, sanatçı o projeyle inatlaşmak yerine süreci durdurup ruhunu ateşleyecek yeni bir heyecanın peşine düşmelidir.
      68. Yeni Bir Başlangıç Yapmak İçin Elimizdekini Tamamlamak (Yenileme)
      Ünlü psikanalist Carl Jung, İsviçre'de bir göl kıyısında kendine taşlardan yuvarlak bir kule inşa etmeyi kafasına takmıştı
      . Neden köşeli değil de yuvarlak? Çünkü Jung, yaşamı bir çizgi olarak değil; doğumu, yaşamı, ölümü ve "yeniden doğuşu" (yenilenmeyi) barındıran sürekli dönen bir çember (döngü) olarak görüyordu
      . Bedenlerimiz öldüğünde toprağa karışır ve oradan yeni ağaçların, yeni yaşamların filizlenmesini sağlar
      .
      İşte yaratıcı süreç de doğanın bu kusursuz ve acımasız doğum-ölüm döngüsüyle tıpatıp aynı işler
      . Sanatçılar olarak bizler, bir eseri tamamlayarak aslında onu bir nevi "öldürür" (kendi içimizde sona erdirir), onu dünyayla paylaşarak toprağa gömeriz. Ki bu sayede ruhumuzda, o yeni gelecek olan taptaze projeler (yeni doğumlar) için kocaman bir "alan" açılsın
      .
      Eğer ürettiğiniz tek bir esere (şarkıya, kitaba) yıllarca saplanıp kalırsanız, onu bir türlü bitiremez ve dünyayla paylaşmaktan korkarsanız, o eser sizin iç dünyanızı tıkayan devasa bir bariyere dönüşür
      . Hayatınız o tek projeden ibaret hale gelir ve yeni hiçbir enerji içeri giremez. Sanat yapmanın bedeli ve en zorlu sınavı, kendi zaaflarınızı, kusurlarınızı (o eseri) acımasız eleştirilere maruz kalacağını bilseniz bile dünyayla paylaşabilme cesaretidir
      .
      Siz eseri dünyayla buluşturduğunuzda (bitirdiğinizde), muazzam bir "yenilenme" yaşarsınız. Üzerinizden devasa bir yük kalkar, hücreleriniz tazelenir ve bir sonraki bölüme geçmek için ihtiyaç duyduğunuz o taze gücü (enerjiyi) bulursunuz
      . Her büyük sanatçının kariyeri aslında canlı bir müze gibidir. "Başla, tamamla, paylaş. Başla, tamamla, paylaş."
      . Her eser, sadece o anki yaşantımızın, o anki ruh halimizin bir zaman damgası, hayat hikayemizin sadece ufak bir bölümüdür
      . Hiçbir eser sizin nihai varış noktanız değildir; sadece bir sonraki muhteşem durağa geçmenizi sağlayan bir köprüdür
      .
      Bu bölümün özü: Tıpkı doğadaki doğum, ölüm ve yeniden diriliş döngüsü gibi; sanatta da yeni ve taze maceralara yelken açabilmek için mevcut projeye saplanıp kalmayıp onu cesaretle "tamamlamak ve serbest bırakmak" şarttır. Eserimizi korkularımıza rağmen dünyayla paylaşmak; ruhumuzu yenileyen, sanatçılık hikayemizin bir sonraki bölümünü çok daha güçlü yazmamızı sağlayan yegane yaşam pınarıdır.
      69. Oyun
      Sanat üretimi her ne kadar disiplin, uykusuzluk ve ter gerektiren "ciddi" bir iş gibi görünse de; Rick Rubin bize madalyonun diğer, en büyülü tarafını hatırlatır: Sanat, özünde tamamen kuralsız ve çocuksu bir OYUN alanıdır
      .
      Ciddiyet, üzerimize devasa bir ağırlık yükler
      . Bir projenin çok "önemli", dünyayı değiştirecek kadar "değerli" ve "kusursuz" olması gerektiğine inandığımızda, omuzlarımıza binen o sorumluluk bizi felç eder
      . Oysa dört yaşındaki bir çocuğu elinde boya kalemleriyle düşünün. Gökyüzünü çizerken durup "Acaba gökyüzü her zaman mavidir, maviye mi boyamalıyım? Eleştirmenler ne der?" diye düşünür mü? Asla! Kutusunu devirir ve içinden gelen dürtüyle gökyüzünü koyu bir zeytin yeşiline ya da cırtlak bir turuncuya boyar
      . Daha da önemlisi, çocuk o boyamayı yaparken sıkılırsa, oturup onu bitirmek için "kendini zorlamaz", kağıdı atar ve başka bir oyuncağa koşar
      .
      Yaratıcılığın zirvesi, kaybedecek hiçbir şeyin, hedeflenen bir "üretkenlik veya doğruluk kaygısının" olmadığı bu sınırsız özgürlük (oyunbazlık) halidir
      . Stüdyoda saatlerce çalışmaktan tıkandığınızda, her şeyi batırmaktan (ortalığı karıştırmaktan) korkmayın
      . Rubin buna örnek olarak, çok hareketli (yüksek tempolu) bir parça üzerinde çalışırken aniden müzisyenlerden birinin yaptığı akustik bir hatayı yakaladıklarını, o an her şeyi susturup sadece o hatalı küçük bölümün üzerine yepyeni, tamamen plansız ve "körlemesine" bir yoldan giderek o güne kadarki en harika kayıtlarını nasıl yaptıklarını anlatır
      . Bu, önceden planlanmış ciddi bir hedefin değil, anın getirdiği sürprizle "oynamanın" sonucudur
      .
      Yetişkin, analitik zihnimiz ("Bu yaptığım ne anlama geliyor?" diyen tarafımız) ancak oyun bittikten sonra devreye girmelidir
      . Eserinizi yaratırken o ilk günlerdeki, hiçbir kuralı bilmeyen, her sese hayret eden "umut dolu bir acemi" (çocuk) gibi hissetmeyi başardığınızda, en zahmetsiz ve en eşsiz fikirler şelale gibi akmaya başlayacaktır
      .
      Bu bölümün özü: Yaratıcı eylem her ne kadar derin bir adanmışlık ve disiplin gerektirse de, ciddiyetin getirdiği üretkenlik kaygısı ve ağırlık sanatsal süreci felç eder. Sanatçı, tıpkı sınırların veya kaybedecek hiçbir şeyin olmadığı bir alanda gökyüzünü yeşile boyayan bir çocuk gibi; kuralsız gelişigüzelliği, neşeyi ve "oyunbazlığı" kucakladığında en muazzam ve zahmetsiz başyapıtlarına ulaşır.
      70. Sanat Alışkanlığı (Sangha)
      Toplumda şöyle çok yaygın bir hayal vardır: "Şu anki sıkıcı ofis işimi bırakacağım, sadece tutkum olan sanatımı yapacağım ve sanatımla para kazanarak geçineceğim." Kulağa ne kadar harika geliyor değil mi? Ancak Rubin, sanat kariyerinde uzun yıllar geçirmiş biri olarak bunun ne kadar tehlikeli bir tuzak olabileceği konusunda bizi uyarır
      .
      Sanatınızı (hayatınızdaki en değerli, en saf şeyi), evinizin kirasını ödemek, karnınızı doyurmak ve hayatta kalmak gibi ağır bir yükün altına soktuğunuzda, sanat artık bir tutku olmaktan çıkar, "zorunlu bir işe" dönüşür
      . Kira günü yaklaştığında, içinizden gelen deneysel ve riskli o harika fikri yapmak yerine, "Bu satmaz, piyasanın istediği, radyolarda çalacak o garanti (popüler) şarkıyı yapayım" demeye başlarsınız
      . Sanatınızın saflığı ve özgürlüğü tamamen zehirlenir.
      Bu yüzden yazarın tavsiyesi şudur: Geçiminizi sağlamak için sanatınızı kirletmeyen, zihninizi fazla yormayan ve size o yaratıcı projeleriniz için enerji bırakan "sıradan bir günlük işiniz" olması harika bir şeydir
      . Dünyadaki en unutulmaz, en efsanevi şarkıların ve kitapların birçoğu, gündüzleri hiç sevmedikleri o sıradan işlerde çalışan insanlar tarafından, mesai bitimindeki o özgürlük alanlarında (hobi olarak) yazılmıştır
      . Hatta galerilerde, film setlerinde veya stüdyolarda stajyer olarak "parasız bile olsa" bulunmak, o tutku duyduğunuz dünyanın arka planını görmek ve tecrübe edinmek için paha biçilmezdir
      .
      Bu dengeyi kurduktan sonra ihtiyacınız olan ikinci en önemli şey ise bir Topluluktur (Sangha)
      . Yaratıcılık buluşucu bir ateştir
      . Sizinle tamamen aynı müziği veya resmi yapan insanlar olmak zorunda değil; sadece sanat konusunda sizin gibi hevesli, vizyoner, dünyayı hayalperest gözlerle gören "kafa dengi" insanlardan oluşan bir çevrede bulunmanız yeterlidir
      . Budist kültürde ortak bir ruhsal amaca adanmış bu topluluklara Sangha denir
      . Etrafınızda uzun felsefi tartışmalar yapabileceğiniz, çalışmalarınızı yargılamadan değerlendirecek yol arkadaşlarınızın olması, o yapayalnız ve zorlu sanatsal yolculukta ruhunuzu besleyen en büyük yakıttır
      .
      Bu bölümün özü: Sanatı "fatura ödeme ve hayatta kalma" baskısıyla zorunlu bir işe dönüştürmek, sanatın o saf özgürlüğünü ve risk alma yetisini köreltir; bu yüzden onu zihni boşaltan sıradan bir meslekle destekleyip özgürce sürdürmek çok daha verimlidir. Ayrıca, vizyonunuzu anlayan ve dünyayı sizin gibi hayalperest gözlerle gören "kafa dengi" bir topluluğun (Sangha) parçası olmak, yalnızlığı bitiren ve gelişimi ateşleyen en büyük güçtür.
      71. Benlik Prizması
      "Gerçekte ben kimim?" sorusu, insanlık tarihi kadar eski ve bir o kadar da cevapsız bir sorudur. Çünkü bizler tek, yekpare, sabit ve tutarlı bir "benlikten" oluşmayız
      . Sizin ailenizin yanındaki "siz" ile, gece yalnızken ağlayan "siz", bir iş krizinde soğukkanlı davranan "siz" veya uçsuz bucaksız dünyalar hayal eden o "siz" birbirinden tamamen farklı varlıklardır
      . İçimizde cesur olanla korkak olan, pragmatik (gerçekçi) olanla hayalperest olan yanımız sürekli bir çatışma ve pazarlık halindedir
      .
      İşte Rick Rubin insan benliğini kusursuz bir "Prizma" metaforuyla açıklar
      . Dışarıdan, evrenden (Kaynak'tan) gelen tek bir nötr beyaz ışık (sıradan bir olay) gelir ve bizim o karmaşık, çok yüzlü benlik prizmamızın içine girer
      . Orada, o anki ruh halimize, açlığımıza, yorgunluğumuza, çocukluk travmalarımıza çarpıp kırılır ve dışarıya rengarenk, bambaşka "sanat tonları" olarak yansır
      .
      Bunun sanatçı için anlamı şudur: Hiçbir sanat eseri sizin tüm kimliğinizi, o devasa prizmanızın "bütününü" aynı anda yansıtamaz
      . Zaten böyle bir şey imkansızdır. Bir şarkınızda benliğinizin sadece o en karanlık, yıkıcı yüzünü yansıtırsınız; diğer bir tablonuzda ise en ruhani, en neşeli yüzünüzü
      . Bu ikisi birbirine tamamen zıt görünse de, ikisi de sizin prizmanızın "gerçek ve dürüst" yansımalarıdır
      .
      Kendinizi "Ben sadece hüzünlü şarkılar yazan bir sanatçıyım" ya da "Ben kurallara uyan biriyim" gibi etiketlerle (dar çerçevelerle) kısıtlamak, içinizdeki o renk cümbüşünü boğmaktır
      . Bizim görevimiz, o anki duygu ve içgüdülerimizin ne kadar tutarsız veya mantıksız göründüğünü yargılamadan, prizmamızın o gün doğal olarak hangi rengi (ışığı) yaydığını kabullenmek ve o kırılmaya izin vermektir
      .
      Bu bölümün özü: İnsan benliği tek ve tutarlı bir doğrudan ibaret değildir; duygularımız ve kimliğimiz, evrenden gelen ışığı her an farklı renklerde ve yüzlerde kıran çok boyutlu bir "prizma" gibidir. Sanatçı, eserinin kendisini tek bir açıyla (etiketle) yansıtması baskısını bir kenara bırakıp, benliğinin bu çelişkili ve değişken renklerinin o anki doğal kırılmasını yargılamadan özgürce kucaklamalıdır.
      72. Bırakın, Olduğu Gibi Kalsın
      Doktorların (hekimlerin) mesleğe başlarken ettikleri o meşhur Hipokrat Yemini'nin en temel düsturu şudur: "Önce, zarar verme"
      . Rubin, bu hayati ilkenin sanat ve yaratıcılık için de evrensel, sarsılmaz bir yasa olarak kabul edilmesi gerektiğini savunur
      .
      Özellikle başkalarıyla işbirliği yaparken veya kendi eserinizin o ilk kabataslak, vahşi versiyonuna bakarken, genellikle onu "mükemmelleştirme", daha "profesyonel" duyulmasını sağlama veya endüstri standartlarına uydurma dürtüsüne kapılırız
      . Oysa bir eserin o ilk, cilalanmamış kabataslağı bazen kelimelerle açıklanamayacak olağanüstü bir "büyü" ve ruh taşır
      . Bu büyü, pürüzlü olduğu için gerçektir.
      Yazar, stüdyoya gelip fikrini soran bir müzisyen arkadaşıyla olan anısını anlatır. Arkadaşı ona neredeyse bitmiş bir şarkı dinletir. Çoğu müzik yapımcısı (prodüktör) o an egosunu tatmin etmek için "Şuranın sesini aç, buraya şu efekti koy" gibi standart ince ayarlar tavsiye ederdi. Ancak Rubin şarkıyı dinlediğinde, o ham halindeki ruhun zaten kusursuz olduğunu fark eder
      . Arkadaşına verdiği o altın değerindeki tek tavsiye şudur: "Her müzisyenin o son miks sırasında yaptığı o standart ince ses ayarlarının hiçbirini yapma. Şarkıyı atla, olduğu gibi kalsın."
      . Eğer o standart cilalama işlemi yapılsaydı, şarkının o organik başyapıt ruhu tamamen öldürülecek, eser sıradanlaşacaktı. Bazen bir esere yapabileceğiniz en görkemli ve usta işi dokunuş, ellerinizi cebinize koyup hiçbir şey yapmamaktır
      .
      Bu bölümün özü: Tıptaki "önce zarar verme" ilkesi sanat için de geçerlidir; zira bir eserin o ilk kabataslağının taşıdığı ham büyü, çoğu zaman endüstri standartlarındaki o pürüzsüzleştirici ince ayarlarla yok edilir. Sırf "daha profesyonel" görünsün diye eseri mükemmelleştirmeye çalışmak ruhunu öldürebileceğinden, sanatçının veya işbirlikçinin yapabileceği en büyük katkı bazen esere "hiç dokunmamaktır".
      73. İşbirliği
      Sanat üretiminde iki veya daha fazla beynin (farklı prizmaların) bir araya geldiği o eşsiz, bazen sancılı bazen de mucizevi süreç: İşbirliği. Rubin'e göre bu süreç, tıpkı iyi bir caz orkestrasının sahnede doğaçlama çalmasına benzer
      . Caz müzisyenleri önceden yazılmış katı bir senaryoyu oynamazlar. Birbirlerini çok derin bir şekilde dinlerler, anlık tepkiler verirler; bazen gaza basıp öne çıkar ve bir solo atarlar, bazen de sadece diğer enstrümanın parlaması için sessizce (egonun sıfırlandığı bir şekilde) geriye çekilirler
      .
      Ancak işbirliğinde yapılan en büyük hata, onu bir "Rekabet" veya üstünlük kurma (haklı çıkma) mücadelesi sanmaktır
      . "Bu benim fikrim, benim dediğim olacak!" diyen o yıkıcı Ego, sadece projenin kalbini zehirler
      . İşbirliğinin asıl amacı sizin kendi fikrinizi dayatmanız değil, yüksek bir duvarın arkasını (eserin potansiyelini) görebilmek için birbirinize "omuz vermenizdir"
      .
      Rubin, stüdyoda sanatçılarla anlaşmazlığa düştüğünde uyguladığı o efsanevi formülü açıklar. Diyelim ki siz "A" seçeneğini istiyorsunuz, birlikte çalıştığınız kişi ise "B" seçeneğinde diretiyor. Genellikle insanlar bu noktada birinin kalbi kırılmasın diye "orta yolu bulur", yani taviz verirler (Fedakarlık)
      . Ancak Rubin buna şiddetle karşı çıkar: "Eğer bir taraf kendi fikrinden vazgeçip diğerine razı oluyorsa, orada herkes kaybetmiştir."
      .
      Gerçek çözüm, ne A'yı ne de B'yi seçmektir. Çözüm, her iki tarafın da "İşte bu harika!" diyeceği, o an odada henüz var olmayan C seçeneğini (üçüncü, yepyeni bir yolu) bulana kadar kavga etmekten, tartışmaktan ve denemekten vazgeçmemektir
      . O C seçeneği, belki de ikinizin fikrinin bambaşka bir birleşimi olacak ve eseri hayal bile edemeyeceğiniz bir şahesere dönüştürecektir.
      Tabii ki her işbirliği pürüzsüz yürümez. Eğer partnerinizle her konuda, her renkte "aynı fikirdeyseniz", aranızda bir uyum değil, feci bir vizyon eksikliği var demektir. Rubin bunu muazzam bir analojiyle açıklar: "Aynı renk iki filtreyi (örneğin iki sarı camı) üst üste koyup ışığa tutarsanız, yine sadece aynı ton sarı rengi elde edersiniz. Ama tamamen zıt renkli iki filtreyi üst üste koyduğunuzda, ışık oradan geçerken bambaşka, yepyeni bir renk (ton) ortaya çıkar!"
      . Dünyanın en iyi müzik gruplarının sırrı, aralarındaki o sürtüşme, fikir ayrılığı ve o gerilimli dinamiktir; çünkü ateşi yakan şey o sürtünmenin ta kendisidir
      .
      Bu gerilimi sağlıklı tutmanın tek yolu da iletişimdir. Karşınızdakine "Bu rengi hiç beğenmedim, berbat" derseniz bu kişisel ve yaralayıcı bir eleştiridir. Ama "Bu iki bölgedeki renklerin birbiriyle uyumlu olmadığını (esere hizmet etmediğini) düşünüyorum" derseniz, tartışmayı egodan çıkarıp "eserin masasına" koymuş olursunuz
      . Bazen duyduğumuzla karşımızdakinin anlatmak istediği şey bambaşkadır; çünkü dil (kelimeler) kusurlu bir araçtır
      . Sabırla, soru sorarak, karşımızdakinin tam olarak nereyi işaret ettiğini anlamak, işbirliğini bir savaştan çıkarıp, eseri mükemmelleştiren ortak bir inşaya dönüştürür
      .
      Bu bölümün özü: Başkalarıyla ortak eser üretirken egomuzu bir kenara bırakıp, tıpkı bir caz grubunun doğaçlamadaki uyumu gibi farklı bakış açılarını (zıt filtreleri) çarpıştırarak yeni olasılıklar doğurmalıyız. Doğru bir işbirliğinde amaç, tarafların kendi fikrinden (A veya B seçeneğinden) fedakarlık edip taviz vermesi değil; her iki tarafın da heyecanla kabul edeceği o yepyeni, beklenmedik "C seçeneğini" keşfedene dek sürtüşmekten çekinmemektir.
      74. İçtenlik İkilemi
      Günümüz sanat dünyasında herkesin ağzında aynı süslü kelime var: "Otantik ol. Kendi hakikatini yansıt. Eserinde çok içten ol." Sanatçılar da bu baskıyla masaya oturur ve "Ben şimdi öyle bir eser yapacağım ki, dünyadaki en içten, en dürüst ruh halimi anlatacak" diye kendilerini paralarlar
      .
      Fakat Rick Rubin, bu "içtenlik (sincerity) peşinde koşma" çabasının, yaratıcılık tarihindeki en büyük yanılgılardan biri olduğunu söyler
      . Neden mi? Çünkü içtenlik, doğrudan hedeflenebilecek, avlanabilecek bir "amaç" değildir; o sadece sürecin doğal bir "yan ürünüdür"
      .
      Zihnimizle (mantığımızla) "Ben şimdi çok samimi olacağım" diyerek bir söz yazdığımızda, o söz genellikle bir bayram tebrik kartındaki o klişe, içi boş, yapmacık kafiyeler gibi "sahte" ve sığ duyulur
      . Çünkü biz insanlar kendimizi sadece "iyi, tutarlı, rasyonel" özelliklere sahip varlıklar olarak görmek isteriz. Oysa bizim en içten, en gerçek (otantik) ve mantıkdışı yanlarımız, aklımızın o cilalı yüzeyinin çok altında, bilinçaltının derin karanlık sularında gizlidir
      .
      Bu gizli, gerçek yönlerimiz doğrudan üzerlerine gidilmesinden, mantıkla "hadi ortaya çık" denilmesinden hiç hoşlanmazlar. Rubin çok güzel bir doğa analojisi verir: "Dalgalardan yansıyan güneş ışığının ancak tesadüfi anlarda gözümüze çarpıp kaybolması gibi, onlar da ancak biz aradan çekildiğimizde, kendi dolaylı yollarıyla (bir metaforla, bir notayla) açığa çıkmayı tercih ederler."
      .
      Sanat (özellikle de şiirsel ve sezgisel yaratım süreci), bizim kendimiz hakkında inandığımız o kurgusal hikayelerden, mantığımızdan ve "kim olduğumuzdan" çok daha derinlere iner
      . Analitik aklın ördüğü iç duvarları yıkar ve o maskesiz, çıplak hakikate ulaşır. Sanatçının yapması gereken tek şey, "içten olmaya" kasmayı bırakıp, sadece yolun üzerinden çekilmek ve yaratıcı akışın (sanatın) kendi işini yapmasına izin vermektir
      . İzleyicinin, sizin o saçmaladığınızı sandığınız bir eserde "kendi gerçeğini" bulmasını sağlayan o tarifsiz bağ, siz aklınızı susturduğunuzda kendiliğinden oluşacaktır
      .
      Bu bölümün özü: Bir sanatçının eserinde bilinçli ve mantıksal bir çabayla "aşırı derecede içten ve otantik" olmaya çalışması, paradoksal olarak genellikle sahte, yapmacık ve sığ eserler doğurur. İçtenlik doğrudan hedef alınacak bir amaç değil; analitik aklı susturup, benliğimizin o derin, gizli ve mantıkdışı yönlerinin dolaylı yollardan (şiirsel bir akışla) ortaya çıkmasına izin verdiğimizde kendiliğinden oluşan doğal bir yan üründür.
      75. İçimizdeki Bekçi (Editör)
      Yaratıcı sürecin ilk başlarında tohumları bulduk, denemeler yaptık, duvarları ördük, oyunlar oynadık, hiçbir şeye hayır demedik ve devasa bir malzeme yığını (bir kaos) elde ettik. Bütün bu coşkunun ve bolluğun ardından, o dağınık parçaları toplayıp eserin "nihai kimliğini ve bütünlüğünü" inşa edecek o en kritik gücün sahneye çıkma zamanı gelir: İçimizdeki Editör (Bekçi)
      .
      Bu aşama, sanatçının içinde yatan o acımasız ve profesyonel "düzenleyici" benliğin uyanışıdır
      . Editörün elinde bir mercek ve keskin bir makas vardır. Onun görevi yeni şeyler eklemek, hayal kurmak değil; aksine, eserin içinde birbiriyle savaşan, uyumsuz ritimleri, renkleri ve kelimeleri "eserin o ana düzenleyici ilkesine (Ahengine)" göre acımasızca eksiltmek ve törpülemektir
      . Tıpkı görkemli bir saraya son derece şık ama "modern" bir mobilya koyduğunuzda nasıl manasız (uyumsuz) kalırsa, eserinizin içindeki o çok sevdiğiniz ama bütüne hizmet etmeyen gitar solosu veya mükemmel cümle de eseri zehirliyordur
      . Editör o unsuru, ne kadar güzel olursa olsun, tereddütsüz kesip atar.
      Buradaki en büyük tuzak, egomuzdur. Yaratıcı yanımız, o yazdığımız cümleye veya çizdiğimiz detaya "Ben yaptım, çok zekice" diyerek tutkuyla, kibirle bağlanır
      . Ancak profesyonel Editör, egosunu tamamen kapıda bırakmak zorundadır
      . O esere uzaktan, soğukkanlı ve tarafsız bir heykeltıraş gibi bakar; sadece eserin "bütünlüğünü ve dengesini" umursar
      .
      Rubin, Editör'ün bu soğuk tarafsızlığının, asla kafamızın içindeki o zehirli "Eleştirmen" ile karıştırılmaması gerektiğini söyler. Eleştirmen ("bu şarkı beş para etmez, yeteneksizsin" diyen ses) eseri baltalar ve şüphe tohumları eker
      . Editör ise sadece "Bunu nasıl en saf ve güçlü haline ulaştırırım?" diye soran yapıcı, yüceltici güçtür
      .
      Bu eksiltme sürecine "Acımasız Düzenleme" (Ruthless Editing) denir
      . Yazar bize müthiş bir meydan okuma sunar: Eğer 20 şarkılık harika bir albüm kaydettiyseniz, amacınız bunu makul bir 10 şarkıya düşürmek olmamalıdır. Hedefiniz, onu "Sadece ve sadece onsuz yaşayamayacağınız o muazzam 5 şarkıya" (en vurucu öze) indirmek olmalıdır
      . 300 sayfalık bir kitap yazdıysanız, özünü kaybetmeden onu 100 sayfanın altına indirmeye çalışın
      .
      Çünkü eser, kusursuzluğa eklenecek bir şey kalmadığında değil; efsanevi yazar Antoine de Saint-Exupéry'nin dediği gibi, "Çıkarılacak hiçbir şey kalmadığında" ulaşır
      . O kesip attığınız fazlalıklar, eserin ana heykeline ulaşmak için kırdığınız mermer tozlarıdır. Ve bunu başarabilen sanatçı, caz efsanesi Charles Mingus'ın o harika formülüne ulaşır: "Herkes basit olanı karmaşıklaştırabilir. Asıl mesele, karmaşık olanı basitleştirebilmek, muhteşem bir şekilde basitleştirmektir."
      .
      Bu bölümün özü: Yaratım sürecinde ortaya saçılan o devasa malzeme yığınını toplayıp eserin nihai denge ve bütünlüğünü inşa eden güç; sanatçının içindeki egodan arınmış, profesyonel "editör (bekçi)" tarafıdır. Ustalığın ve kusursuzluğun sırrı, esere yeni detaylar eklemekte değil; bütüne hizmet etmeyen en güzel unsurları bile acımasızca kesip atarak, karmaşık olanı muazzam bir yalınlığa (basitliğe) ulaştırmaktır.
      76. Neden Sanat Yaparız?
      Yolculuğumuzun bu evresinde, o büyük varoluşsal sorunun kalbine iniyoruz. İnsanoğlu mağaralarda avlanıp hayatta kalmaya çalışırken bile neden kömürleri ezip duvara resimler çizdi? O ilkel zamanlardan bugüne bizi sanata mecbur bırakan, bu "faydasız" eyleme ömrümüzü adamamızı sağlayan o devasa itici güç nedir?
      Rubin'e göre sanat üretmek, o an için "dünyayı kurtarmak veya ahlaki bir mesaj vermek" gibi planlı, mantıklı bir tercihten ziyade; yeni doğmuş kumsaldaki deniz kaplumbağalarını içgüdüsel olarak denize doğru (suya) çeken o karşı konulamaz, ilkel evrensel güçle aynı şeydir
      . Evrenin yaratıcı döngüsü bizim aracılığımızla akmak için bizi adeta "mecbur" bırakır
      . O fikir içimizde bir kez filizlendiğinde, duygularımız dalga dalga kabarır ve onu dışarıya (başkalanna) aktarma dürtüsü bir feryada dönüşür
      .
      Peki neden başkalarına aktarıyoruz? Sadece onlardan takdir görmek ya da anlaşılmak için mi? Hayır. Bu evrende bir "göz açıp kapayıncaya kadar" kısacık bir an yaşıyoruz ve gelip geçiciyiz
      . Sanat eserleri üretiyoruz, çünkü arkamızda bu dünyadan geçtiğimize dair kalıcı, somut bir "zaman damgası", bir anıt bırakmak istiyoruz
      .
      Michelangelo'nun Rönesans'ta yonttuğu o devasa, kusursuz Davut heykeli ile... On binlerce yıl önce Lascaux mağarasının karanlığında bir avcının duvara çizdiği öküz resmi... Bir çocuğun anaokulunda parmaklarıyla kağıda sürdüğü o karmaşık manzaralar... Hatta ve hatta bir tren istasyonunun tuvalet kapısının arkasına aceleyle kazınmış olan o basit grafiti yazısı... Aslında hepsi, ruhun derinliklerinden kopup gelen tamamen aynı insani çığlığın, aynı varoluşsal feryadın farklı tonlardaki yankısıdır: "Ben de buradaydım!"
      .
      Biz kendi benlik prizmamızdan süzülen bu çığlığı dünyayla paylaştığımızda, başka insanlar kendi süzgeçlerinden o eseri alır, kendi ruhlarında yoğurur ve hayatın o büyük kültürel ortak döngüsüne katarlar
      . Gündelik hayatta kendimizi dünyada yapayalnız, toplumdan kopuk ve anlaşılmaz (izole) bir adada yaşar gibi hissederiz. Ancak farklı zamanlarda, farklı kıtalarda yaratılmış bir esere bakıp kendi acımızın veya sevincimizin orada cisimleştiğini gördüğümüzde, o "ayrılık ve yalnızlık yanılgısı" tuzla buz olur
      . Sanatın o devasa amacı işte tam o anda gerçekleşir; dilin ve kültürlerin çok ötesinde, dünyaya ilk geldiğimizde aslında çok iyi bildiğimiz ama sonra unuttuğumuz o büyük, kadim hakikati bize hatırlatır: Diğer insanlardan, doğadan ayrı olmak diye bir şey yoktur. Hepimiz, tek ve aynı bütünün ayrılmaz birer parçasıyız. Hepimiz biriz.
      .
      Bu bölümün özü: Sanat üretmek pratik veya ahlaki bir fayda sağlama çabası değil; insanın nesiller boyu evrene "Ben de buradaydım!" demek için süregelen ilkel ve karşı konulamaz bir varoluş çığlığıdır. Sanat, farklı dönemlerin ve ruhların o eşsiz (prizmalardan geçen) ifadelerini ortak bir potada eriterek, insanlığı yalnızlık ve ayrılık yanılgısından kurtarıp evrensel bir bütünsellikle (biz biriz duygusuyla) birbirine bağlayan yegane dildir.
      77. Uyum (Ahenk)
      Peki, bizi bazı sanat eserleri karşısında derinden sarsan, o tabloya bakarken gözyaşlarına boğulmamızı ya da bir mimari yapının altında saatlerce huşu (kutsal bir saygı) içinde dikilmemizi sağlayan o görünmez güç nedir? İşi sırrı yetenekte mi, yoksa renklerde mi? Rubin'e göre işin asıl sırrı doğanın ta kalbinde, tüm evreni bir arada tutan o kusursuz Matematikte ve Ahenkte (Uyum) yatar
      .
      Deniz kabuklarının o altın oranlı spirallerinden uçsuz bucaksız galaksilerin dönüş şekillerine, fırtınalı bir kasırganın girdabından DNA molekülümüzün sarmal yapısına ve hatta karşımızdaki insanın yüz hatlarına kadar... Evrendeki her şey aynı ilahi, gizli matematiksel oranlarla ve devasa bir bağlılık sistemiyle örülmüştür
      . Biz de doğanın bir parçası olduğumuz için, ruhumuz (bilinçaltımız) bu kusursuz geometriye doğuştan aşinadır
      .
      İşte insanlık tarihinin gördüğü o büyük başyapıtlar —Atina'daki devasa Partenon tapınağı, Mısır'daki Keops Piramidi, Da Vinci'nin o efsanevi kusursuz orantılı Vitruvius Adamı çizimi, Brancusi'nin Boşluktaki Kuş isimli soyut heykeli ya da Bach'ın beyni uyuşturan o matematiksel Goldberg Varyasyonları— aslında "sıfırdan icat edilmiş" şeyler değildir. Hepsi gücünü doğrudan doğanın bu geometrik, kadim "ahenk ve oran" örüntülerine harfiyen uymalarından (veya onları yansıtmalarından) alırlar
      . Siz aylar süren çalışmanızın ortasında, parçaların tesadüfen bu kozmik simetriye oturduğunu gördüğünüzde, o dingin tatmin hissini (uyumu) içinizde adeta titreşerek hissedersiniz
      .
      Peki sanatta "ahenk ve uyum" kurmak demek, her zaman izleyicinin kulağına "hoş", "tatlı" gelen, rahatlatıcı ninniler çalmak ya da sadece göze "güzel" görünen pastel manzaralar çizmek midir? Kesinlikle hayır!
      . Rubin burada o algıyı paramparça eder. Bazen büyük sanatın tek amacı, izleyiciyi sarsmak, dengesini bozmak ve onu "rahatsız" etmektir
      .
      Bunu müzikten düşünelim. Bazen besteci bilerek birbirine tamamen zıt, kulağı tırmalayan (uyumsuz) iki notayı yan yana basar. O uyumsuzluğun yarattığı "gerilim", dinleyicide bir düğüm, bir merak oluşturur. Ve ardından o gerilim aniden çözülüp uyumlu (ahenkli) bir notaya bağlandığında, yaşadığınız o "rahatlama" hissi (katarsis), sürekli düz ve güzel çalan bir şarkının vereceğinden milyonlarca kat daha etkili, sarsıcı ve büyüleyicidir
      . Yani eserdeki o rahatsız edici dengesizlikler, çatışmalar ve "çirkinlikler" bile, aslında bizi çok daha büyük bir bütünsel "Uyuma" dikkatimizi çekmek için o denkleme (kozmik senfoniye) dahil edilmiştir
      .
      Evrenin o iç işleyişindeki koca matematiği mantığımızla, fırçamızla ya da notamızla "tam olarak kavrayamıyor" olmamız bir kusur değildir. Çünkü asıl mucize ve büyük sanat, her şeyi laboratuvarda analiz edip çözmekte değil; bizim zihnimizi aşan o devasa "bilinmeyenin (sonsuzluğun)" karşısında duyduğumuz o ilkel, sarsıcı hayranlıkta (huşuda) yatar
      .
      Bu bölümün özü: Evren (deniz kabuklarından galaksilere kadar) devasa bir dengeye ve kusursuz bir ilahi matematiğe sahiptir; tarih boyunca insanlığın yarattığı en büyük şaheserler (piramitler, senfoniler) gücünü doğrudan bu kozmik orantılara paralel o gizli titreşimden alır. Sanatta ahenk yaratmak sadece göze veya kulağa "hoş gelen" pürüzsüz eserler üretmek demek değildir; izleyicide merakı ve sarsıcı bir çözülmeyi tetikleyecek o doğru dengesizlikleri, gerilimleri (uyumsuzlukları) kurmak da bu büyük uyumun en çarpıcı parçasıdır.
      78. Kendimize Anlattıklarımız
      Ve geldik "Yaratıcı Eylem"in o koca felsefi yolculuğunun zirve noktasına, her şeyi bir araya bağlayan o son yüzleşmeye: Hikayeler.
      Bütün hayatımız boyunca, özellikle de sanatçı kimliğimizi inşa ederken durmadan bir şeyler kurgularız. "Ben falanca travmalar yüzünden böyle melankolik müzikler yapıyorum," "Benim tarzım kesinlikle şudur," "O eserimi şu toplumsal mesajı vermek için şöyle öfkeyle yarattım." Ve eseri bitirdiğimizde de "Bu eser tam olarak bunu anlatıyor" diyerek noktayı koyduğumuzu sanırız.
      Fakat Rick Rubin kitabın bu en can alıcı finalinde hepimizi sarsar: Kendimize dair inandığımız o kurguladığımız hikayelerin hepsinde anlatılan biz DEĞİLİZ. Eserlerimize dair anlattığımız o iddialı hikayelerin hiçbirinde anlatılan, eserin bizzat KENDİSİ DEĞİLDİR.
      .
      Zihnimiz, doğası gereği kaosu sevmeyen, belirsizlikten korkan ve evrenin o sonsuz verisi içinde hayatta kalabilmek için minicik bir "anahtar deliğinden" bakarak olayları etiketleyen bir "yorumlama makinesidir"
      . Kendimizi, o koca yaratım sürecini (bizi o an tetikleyen milyarlarca rastgele ilhamı, o günkü uykusuzluğumuzu, çocukluk anımızı) alıp çok basit, tutarlı ve düz bir "hikayeye" uydurmaya (eğip bükmeye) çalışırız
      . Ancak bunu yaptığımızda, gerçeği aydınlatmış olmay
