      .

      Resilient, Fault-Tolerant, Robust, Reliable Kavramları Geliştiriciler
      genelde bu kelimeleri birbirinin yerine kullansa da farklıdırlar

      :

      Resilient (Esnek/Toparlanabilir): Bir yıkım olduktan sonra eski haline
