      . -4 ile +6 saniye şaşma payıyla çalışan ve sertifika alan COSC bir saat
      gibi veya %99.99 SLA garantisi veren bir veritabanı gibi

      .

      Fail Open (Açık Başarısızlık) vs. Fail Closed (Kapalı Başarısızlık) Sistem
      hata verdiğinde kontrolü mü yoksa erişimi mi seçeceğiz?
       Yazarın Google'daki ekibi "Safe Removal Service" adlı sistemi yönetiyor (VM Live Migration)
      100

      . Bu sistem makinelerin yeniden başlatılmasına güvenlik kontrolü yaparak
      onay veriyor

      . Eğer bu servisin bağlı olduğu iç sistemler çökerse, servis bilmeden onay
      verip güvenliği riske atmaktansa tüm istekleri reddediyor

      100

      . Buna Fail Closed denir; çünkü sistem erişilebilirliği feda edip
