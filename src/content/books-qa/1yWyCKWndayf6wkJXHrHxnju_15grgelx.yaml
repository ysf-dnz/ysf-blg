      106

      . Tebrikler, zamanla test edilmediği için soft bağımlılığın sessizce hard
      bağımlılığa dönüşmüş oldu

      106

      107

      ! Mühendislikte güvenilirliği artırmanın en kesin yolu; "Hard"
      bağımlılıkları, güçlü ve sürekli test edilen yedek stratejileri (fallback)
      kullanarak "Soft" bağımlılıklara dönüştürmektir

      107

      108

      .

      Bu bölümün özü: Güvenilirlik; esneklik, hata toleransı ve sağlamlık
      üzerine inşa edilen, sistemin kullanıcıya söz verilen süre boyunca "sadece
      çalışması" durumudur. Ağır yük altında tam çöküş yaşamak yerine (Adaptive
      LIFO veya Load Shedding ile) hizmet kalitesini düşürmek, bağımlılıkların
      kırılganlığını izleyip yedek planlarla yumuşatmak ve güvenlik ile
      erişilebilirlik arasında (Fail Open/Closed) doğru takası yapmak sistem
      tasarımının belkemiğidir.

      7.6 - 7.7 Arıza Analizi ve Bilişsel Yanılgılar: Post Hoc ve Gizli
      Değişkenler

      Sistemler ne kadar mükemmel tasarlanırsa tasarlansın çökecektir
      (incident). Çöktüğünde ise kök nedeni (root cause) bulmaya çalışırken
      insan beyni kendi mantık hatalarına ve zihinsel kısayollara (bias) kurban
      gider.

      Post Hoc Ergo Propter Hoc (Bunun Ardından, O Halde Bundan Dolayı) Bu
      havalı Latince terim, en sık düştüğümüz mantık yanılgısını tanımlar:
      Zamansallığı (olayların arka arkaya olmasını), Nedensellik (birbirinin
      sebebi olması) ile karıştırmak

      109

      . Yazar bir Cumartesi sabahı kahvesini yudumlarken LinkedIn'de şu postu
      görür: "TDD (Test-Driven Development) kullanmaya başladığımdan beri
      hayatım çok daha güzel. Artık kodumu debug etmek için her yere
      console.log() yazmak zorunda kalmıyorum!"

      110

      . Postu yazan kişinin zihnindeki şablon şudur: A) Eskiden her yere log
      atıyordum

      110

      . B) Sonra TDD'ye geçtim

      110

      . C) TDD yaparken testler yazdım

      110

      . D) Artık loglara ihtiyacım kalmadı

      110

      . Çıkarım: "TDD yüzünden artık log atmıyorum."

      109
       Bu, koca bir mantık hatasıdır!
      109
       Evet, B olayı D'den önce olmuştur ama D'nin gerçek sebebi B (TDD yaklaşımı) değil, C (Test yazmış olmak) tır!
      109

      . Kişi, TDD olmadan da test yazsaydı yine log atmaktan kurtulacaktı

      109

      . İnsanlar, sevdikleri bir metodolojiyi veya aracı sırf o olaydan önce
      kullandıkları için tüm başarının sebebi ilan etmeye bayılırlar

      111

      . Bir olay diğerinden sonra gerçekleşti diye, diğeri onun sebebi olmak
      zorunda değildir

      109

      . Yazar bu analizle uğraşırken o güzelim Cumartesi kahvesi de soğuyup
      gider...

      112

      Lurking Variables (Gizlenen / Pusuya Yatan Değişkenler) Kök neden
      analizlerini en çok saptıran şey, grafikte görünmeyen ama sonuçları
      manipüle eden "Gizli Değişkenlerdir (Lurking Variables)"

      112

      . Yazar bunu sanal bir bulut sağlayıcısı olan NebuloSky örneğiyle
      açıklıyor

      113

      . NebuloSky, yıllardır stabil çalışan ve 9 milyon sanal makinesi (VM) olan
      "Platform X" ile henüz yeni olan ve sadece 100 bin VM'i olan "Platform Y"
      üzerinden hizmet veriyor

      113

      . Şirket, güvenlik için makinelerin Kernel (çekirdek) sürümlerini sürekli
      güncelliyor

      113

      . Bir gün SRE (Site Reliability Engineer) olarak sana bildirim geliyor:
      Sistemde "Kernel Panics (Çekirdek Çökmeleri)" sayısı aniden iki katına
      çıkmış!

      113
       Metriklere bakıyorsun ve tam o gün "Yeni bir Kernel versiyonunun" dağıtıma çıktığını görüyorsun
      113

      . Sonuç çok net, değil mi? "Yeni sürüm hatalı, hemen geri al (rollback)!"

      113

      . Geri alıyorsun. Saatler geçiyor ama çökme sayısı asla düşmüyor!

      114
       Nerede hata yaptın?
      114

      Hata, Korelasyonu (İki şeyin aynı anda olması), Nedensellik (Causation)
      zannetmekti

      114

      . Hareket eden bir metro vagonunu arkasından iten bir adamı düşün. Vagon
      ilerliyor, adam da o sırada itiyor (Korelasyon var) ama vagon adam ittiği
      için ilerlemiyor!

      114

      . Bizim kernel olayındaki "Pusuya Yatan Değişken" şuydu: Platform Dağılımı

      115

      . Yeni kernel sürümünün dağıtıldığı o gün, şirket aynı zamanda sorunlu
      "Platform Y" üzerine tam 1 Milyon yeni sanal makine eklemişti!

      115

      . Çökmelerin sebebi yeni kernel sürümü (İncelenen Değişken) değil,
      platformlardaki bu oransal değişimdi (Gizli Değişken)

      115

      116

      . Biz Doğrulama Yanlılığına (Confirmation Bias) kurban gittik; yeni sürüm
      dağıtımını görünce varsayımımızı anında doğru kabul ettik ve başka kanıt
      aramadık

      117

      .

      Gizli Değişkenleri Tespit Etmek: Veri Segmentasyonu (Data Segmentation)
      Bunu önlemenin en iyi yolu veriyi farklı kırılımlarla (bölgeye göre,
      platforma göre, kullanıcı tipine göre) segmente edip analiz etmektir

      117

      . Eğer kernel çökme grafiğini "Platform X ve Platform Y" diye iki ayrı
      renk olarak verseydik, Platform X'teki çökmelerin sabit kaldığını, artışın
      tamamen Platform Y'deki devasa yığılmadan kaynaklandığını ilk saniyede
      görecektik

      117


      . Gözlemlenebilirlik (Observability) sistemlerimizde veriyi önceden bu
      şekilde kırılabilecek (slicing and dicing) biçimde tasarlamak, sorun
      anında zihinsel tuzaklara düşmemizi engeller

      120

      121

      .

      Bu bölümün özü: Arıza ve kök neden analizlerinde insan beyni en görünür
      olana ve kendi varsayımlarına (Doğrulama yanlılığı) inanma eğilimindedir.
      İki olayın arka arkaya olması (Post hoc) veya aynı anda yaşanması
      (Korelasyon) aralarında kesin bir neden-sonuç ilişkisi olduğunu
      kanıtlamaz. Bizi asıl yanıltan şey genellikle verilerde açıkça görünmeyen
      gizli (lurking) değişkenlerdir ve bunlarla savaşmanın yolu, verileri
      farklı boyutlarla kırmak (segmentasyon) ve her zaman kendi tezimizi
      çürütecek kanıtlar aramaktır.
  - baslik: Parça D · Donanım ve İşletim Sistemi (Bölüm 8)
    icerik: >-
      Harika bir noktadayız! Kahvelerimizi tazeleyelim, çünkü şimdi kodumuzun
      "altında" yatan o gizemli ve devasa dünyaya, Parça D: Donanım ve İşletim
      Sistemi (Bölüm 8: Systems) alanına giriyoruz.

      Yazar Teiva Harsanyi'nin de harika bir şekilde ifade ettiği gibi, iyi bir
      yazılım mühendisi olmak sadece temiz kod yazmakla bitmez; yazdığımız kodun
      üzerinde çalıştığı donanımı ve işletim sistemini anlamak, onlarla bir tür
      "Mekanik Sempati" (Mechanical Sympathy) kurmak zorundayız. Bu sempati,
      sistemin doğasına aykırı savaşmak yerine, onunla uyum içinde, performanslı
      ve sorunsuz çalışan yapılar kurmamızı sağlar.

      Kurallarına harfiyen uyarak, yazarın argümanlarını adım adım, kitaptaki
      tüm veriler, örnekler ve anekdotlarla birlikte, hiçbir detayı atlamadan
      yeniden anlatıyorum. Her bir bölümün kendi içinde devasa bir derinliği
      var, o yüzden kemerleri bağla!

      8.1 Bilgisayar Mimarisi ve Komut Ardışık Düzeni (Computer Architecture &
      Instruction Pipelining)

      Yazdığımız o yüksek seviyeli, güzel, soyut kodlar (ister Go, ister Java,
      ister Python olsun) eninde sonunda derlenip işlemcinin (CPU) anlayacağı o
      soğuk ve acımasız makine diline dönüşür. İşlemcilerin talimatları nasıl
      işlediğini anlamak, neden bazı kodların diğerlerinden fersah fersah daha
      hızlı çalıştığını kavramanın tek yoludur.

      Yazar, bu konuya sıkıcı ve soyut bir "Komut Ardışık Düzeni (Instruction
      Pipelining)" tanımı vererek başlamıyor. Bunun yerine bizi problemin
      kalbine, CPU'nun mutfağına götürüyor. Bir CPU'nun bir talimatı
      işleyebilmesi için genellikle 4 temel aşamadan geçmesi gerekir:

      Getirme (Fetch - FU): Talimatın kendisini bellekten (memory) alıp getirme
      aşamasıdır. Bunu mutfaktaki aşama olarak düşün: Tarifin yazılı olduğu
      kağıdı depodan alıp tezgaha getirmek.

      Çözümleme (Decode - DU): Gelen o 0 ve 1'lerden oluşan talimatın tam olarak
      ne anlama geldiğini, ne yapılacağını anlama aşamasıdır. Aşçının tarifi
      okuyup "Haa, burada domates doğranacakmış" demesidir.

      Çalıştırma/Yürütme (Execute - EU): Talimatın gerçek anlamda işlendiği
      yerdir. Matematiksel işlemler veya mantıksal sorgular burada yapılır.
      Aşçının bıçağı eline alıp domatesi doğramasıdır.

      Yazma (Write - WU): Çıkan sonucun bir yazmaca (register) veya belleğe geri
      yazılmasıdır. Doğranan domateslerin tabağa konulup servise hazır edilmesi
      gibi düşünebilirsin.

      Monolitik CPU ve Hızlandırma Yolları (Not: Bu 4 aşamalı yapı CPU mikro
      mimarisinin (microarchitecture) basitleştirilmiş bir halidir, örneğin
      Intel'in NetBurst mimarisinde bu aşamaların sayısı 20'yi aşar!) Diyelim ki
      bu aşamaların her biri tam 1 döngü (cycle) sürüyor. Klasik (monolitik) bir
      CPU'da, 1 numaralı talimat (i1) bu 4 aşamayı bitirene kadar, 2 numaralı
      talimat (i2) beklemek zorundadır. Yani i1 için toplam 4 döngü geçer, i1
      biter, ardından t0+5 anında i2 başlar. Bu, inanılmaz derecede verimsiz bir
      yapıdır. Her an CPU'nun sadece %25'i çalışıyor, geri kalan %75'lik kısım
      boşta yatıyordur.

      Peki biz bir donanım tasarımcısı (CPU designer) olsaydık bu sistemi nasıl
      hızlandırırdık?

      1. Yöntem: Saat Frekansını (Clock Frequency) Artırmak: CPU'nun saat hızını
      artırmak ilk akla gelen çözümdür. Örneğin CPU'muz 0.1 GHz hızında
      çalışıyorsa, 8 döngüyü tamamlamak 80 nanosaniye sürer. Eğer hızı iki
      katına, yani 0.2 GHz'e çıkarırsak, aynı 8 döngüyü 40 nanosaniyede
      tamamlarız. Harika değil mi? Değil. Çünkü saat frekansını artırmanın çok
      ağır fiziksel bedelleri vardır: Daha fazla güç tüketimi ve korkunç bir ısı
      açığa çıkması. İşlemci çok ısındığında kendini korumak için hızını düşürür
      (Thermal throttling). Yani bu yöntemin fiziksel bir sınırı vardır, sonsuza
      kadar hızı artıramayız.

      2. Yöntem: Komut Ardışık Düzeni (Instruction Pipelining): Madem frekansı
      artıramıyoruz, o zaman içerideki işleyişi değiştirelim. Neden Fetch birimi
      işini bitirip talimatı Decode birimine verdiğinde, boşta yatan Fetch
      birimi hemen bir sonraki talimatı (i2) getirmeye başlamasın ki? Bir araba
      fabrikasındaki montaj hattı gibi! i1 Execute aşamasındayken, i2 Decode
      ediliyor, i3 ise Fetch ediliyor olabilir.

      İşte bu donanımsal zekanın adı Komut Ardışık Düzeni (Instruction
      Pipelining)'dir. Bu sistem sayesinde, boru hattı (pipeline) tamamen
      dolduğunda, CPU her bir döngüde (cycle) 1 talimatı bitirme (retire)
      kapasitesine ulaşır. 8 talimatı bitirmek monolitik CPU'da 32 döngü
      sürerken, Pipelining ile sadece 11 döngü sürer!

      Yazılımcı Olarak Neden Umrumuzda Olmalı? (Boru Hattı Tıkanıklıkları)
      Hikayenin bizi ilgilendiren kısmına geldik. Bizim işimiz donanım üretmek
      değil, ama bu "boru hattının (pipeline)" her zaman dolu ve akışkan
      kalmasını sağlamak zorundayız. Eğer boru hattında bir birim boşta kalır ve
      bir şeyin olmasını beklerse buna Boru Hattı Tıkanıklığı (Pipeline Stall
      veya Bubble) denir.

      Yazar çok çarpıcı bir kod örneği üzerinden bunu kanıtlıyor:

      // Bir önceki kodlar...

      if (a == 0) {
          foo();
      } else {
          bar();
      }

      // Bir sonraki kodlar...


      Bu kadar basit bir if/else bloğu CPU'nun gözünde neye benzer? Gelin bunu
      kaba bir Assembly diline (pseudo-assembly) çevirelim:

      i1: LOAD R1, a -> 'a' değişkeninin değerini R1 yazmacına (register) yükle.

      i2: CMP R1, #0 -> R1'deki değeri 0 ile karşılaştır (Compare).

      i3: BEQ ELSE -> (DİKKAT!) Eğer eşitse (Branch if EQual) ELSE etiketine
      atla.

      i4: CALL foo -> a == 0 ise foo() fonksiyonunu çağır.

      i5: JMP END -> İşin bitince ELSE bloğunu atlamak için END etiketine zıpla.

      ELSE: CALL bar -> i6: a != 0 ise bar() fonksiyonunu çağır.

      Şimdi CPU'nun yerine kendini koy. i1'i getirdin. i2'yi getirdin. i3'ü (BEQ
      ELSE koşullu dallanmasını) getirdin. Sırada i4'ü mü getireceksin yoksa
      i6'yı mı? Bilmiyorsun! Çünkü i3 komutu, i2'nin (karşılaştırma işleminin)
      sonucuna bağlıdır ve bu sonuç ancak i2 Execute (EU) aşamasını bitirdiğinde
      belli olacaktır! Bu süre zarfında Fetch (Getirme) birimi ne yapacak?
      Hiçbir şey! İki tam döngü boyunca sistem durur, bekler (Stall/Bubble
      oluşur) ve performans yerle bir olur.

      Şube Tahmini (Branch Prediction) Modern CPU'lar bu kilitlenmeyi önlemek
      için muazzam bir büyü yaparlar: Şube Tahmini (Branch Prediction). CPU,
      i3'ün sonucunu beklemek yerine bir tahminde bulunur (kumar oynar). Yazar
      durumu basitleştirmek için CPU'nun her zaman "dalın alınmayacağını (assume
      the branch will not be taken)" yani a'nın 0'a eşit OLDUĞUNU (i4'ün
      çalışacağını) tahmin ettiğini varsayıyor. Eğer CPU'nun tahmini doğru
      çıkarsa, boru hattı hiç tıkanmadan, araya sıfır gecikme girerek şakır
      şakır çalışmaya devam eder (saved 2 cycles!). Ama ya tahmin yanlış
      çıkarsa? İşte o zaman büyük bir yıkım olur. CPU boru hattına yanlışlıkla
      getirdiği tüm talimatları çöpe atar (pipeline flush), sistemi temizler ve
      doğru talimattan (i6) tekrar getirmeye başlar. Buna Şube Yanlış Tahmini
      Cezası (Branch Misprediction Penalty) denir.

      İşte tam da bu yüzden, yazılım mühendisleri olarak algoritmalarımızı
      yazarken "Mekanik Sempati" göstermeli, döngülerin ve koşulların donanım
      dostu olmasına dikkat etmeliyiz. Boru hattı tıkanıklıklarını azaltmanın
      yolları şunlardır:

      Branch Prediction-Friendly Code: Şube tahminini kolaylaştıran kodlar
      yazmak (örneğin döngü içindeki if koşullarını azaltmak veya verileri
      önceden sıralamak).

      Veri Tehlikelerini (Data Hazards) Azaltmak: Bir talimatın anında bir
      öncekinin sonucuna bağımlı olmasını (tight data dependency) engellemek.

      Döngü Açma (Loop Unrolling): Çok kısa süren döngülerdeki jump (başa dön)
      komutlarının yarattığı yükü azaltmak için döngünün içindeki işlemi kodu
      kopyalayarak ardışık hale getirmek.

      Bu bölümün özü: Modern işlemciler performansı artırmak için talimatları
      parçalara bölerek üst üste çalıştıran Komut Ardışık Düzeni'ni (Pipelining)
      kullanırlar. Bizim birer mühendis olarak görevimiz, yazdığımız koşullu
      (if/else) ifadelerin CPU'nun Şube Tahmini (Branch Prediction)
      mekanizmasını yanıltıp boru hattını çöpe atmasına (stall/flush) neden
      olmasını engellemek, donanımın doğasına uygun, öngörülebilir kodlar
      yazmaktır.

      8.2 Eşzamanlı Çoklu Kullanım (Simultaneous Multithreading - SMT)

      Performansı artırmak donanım üreticileri için bitmek bilmeyen bir savaştır
      ve bu savaşta ortaya çıkan en büyük devrimlerden biri Eşzamanlı Çoklu
      Kullanım (Simultaneous Multithreading - SMT) teknolojisidir. Onu daha
      yakından tanımak için yazar bizi donanımın içine davet ediyor.

      SMT Nedir ve Nasıl Doğdu? Önce SMT olmayan, klasik bir CPU hayal edelim. 4
      fiziksel çekirdeği (physical core) var ve her çekirdeğin sadece 1 donanım
      iş parçacığı (hardware thread - T1, T2, T3, T4) var. Bir donanım iş
      parçacığı, CPU içindeki en küçük yürütme birimidir; talimatları getiren,
      çözen ve çalıştıran ana yapıdır. Bu çekirdeklerin her birinin kendine özel
      L1 ve L2 önbellekleri (cache) vardır, L3 önbelleği ise tüm çekirdekler
      arasında ortaktır. (Not: L1, L2, L3 veriye hızlı ulaşmak için vardır.
      Çekirdeğe ne kadar yakınsa o kadar hızlı ama küçüktür. En hızlısı L1, en
      büyüğü ve yavaşı L3'tür).

      Şimdi SMT teknolojisine sahip bir CPU'ya (örneğin efsanevi Intel
      i7-7700K'ya) bakalım. Fiziksel çekirdek sayısı yine 4. Ancak SMT sayesinde
      her bir çekirdeğin içinde iki ayrı donanım iş parçacığı (T1 ve T2 aynı
      çekirdeğin içinde) çalışır! Yani sistemde toplam 8 donanım iş parçacığı
      vardır. İşletim sistemi (OS) fiziksel olarak 4 çekirdek olduğunu bilmez, o
      kendisine sunulan bu iş parçacıklarını Sanal CPU'lar (Virtual CPUs) olarak
      görür. Yani OS'in gözünde makinede 8 ayrı işlemci vardır.

      Peki Intel neden böyle bir şeye ihtiyaç duydu? Bunun tarihsel bağlamı
      büyüleyicidir. 2002 yılında Intel, Pentium 4 işlemcisini piyasaya sürdü ve
      "Hyper-Threading" (Intel'in SMT'ye verdiği ticari isim) devrimini
      başlattı. O zamanlar en büyük pazarlama stratejisi saat frekansını (Clock
      Frequency) yüksek tutmaktı (Pentium 4, tek çekirdekte 3.8 GHz gibi çılgın
      bir hıza ulaşıyordu). Ancak yazarın bir önceki bölümde bahsettiği kuralı
      hatırla: Daha yüksek saat hızı, daha uzun komut ardışık düzeni (longer
      pipelines) gerektirir. Pentium 4'ün boru hattı 20 aşamadan fazlaydı! Bunun
      faturası ne oldu? Şube Tahmini (Branch Prediction) başarısız olduğunda
      sistem tam 20 döngü boyunca (korkunç bir ceza - penalty) duraklıyordu.
      Intel mühendisleri şunu düşündü: "Bir iş parçacığı (thread) bellekten veri
      beklerken veya şube tahmini cezası yüzünden boşta yatarken, aynı
      çekirdeğin içindeki diğer iş parçacığı neden çalışmasın ki?" Böylece
      kaynakların boşta kalmasını engellemek için SMT doğdu.

      SMT Tam Olarak Nasıl Çalışır? (İllüzyonun Arkasındaki Gerçek) Burada çok
      kritik bir yanlış anlamayı düzeltmemiz lazım: SMT, bir donanım çekirdeğini
      fiziksel olarak klonlamak demek değildir. Normal şartlarda işletim
      sistemi, yazılımın oluşturduğu thread'leri donanım thread'lerine dağıtır.
      Aynı donanım thread'ini birden fazla yazılım thread'i kullanmak
      istediğinde, OS aralarında adil bir paylaşım yapar ve birinden diğerine
      geçer. Bu geçişe Bağlam Değişimi (Context Switching) denir. Bağlam
      değişimi son derece pahalı bir işlemdir; çünkü mevcut thread'in CPU
      yazmaçlarındaki (registers) ve program sayacındaki (program counter) tüm
      anlık durumu (buna Mimari Durum - Architectural State denir) kaydedilmeli
      ve diğerinin durumu yüklenmelidir.

      İşte SMT'nin sihri buradadır: SMT'li bir çekirdekte İKİ ayrı Mimari Durum
      (Architectural State) vardır. Çekirdeğin içinde işlemleri fiilen yapan
      "Yürütme Birimleri (Execution Units - EU)" tektir ve ortaktır. Bunlar: Tam
      sayı matematiği yapan ALU (Arithmetic Logic Unit), ondalıklı sayı
      matematiği yapan FPU (Floating-Point Unit) ve bellekle konuşan LSU
      (Load/Store Unit) gibi birimlerdir. Ancak Decode (Çözümleme) biriminin
      altında, iki ayrı thread için iki ayrı "Komut Kuyruğu (Instruction Queue)"
      bulunur. Bu kuyrukların tam altında da bir "Komut Zamanlayıcısı
      (Instruction Scheduler)" trafik polisi gibi bekler.

      Bu trafik polisi (Zamanlayıcı) her döngüde (cycle) şuna bakar:

      Eğer Thread 1 bellekten veri beklediği için duraklamışsa (stalled), hemen
      Thread 2'nin kuyruğundan talimat alır ve Yürütme Birimlerine (EU) yollar.

      Eğer ikisi de aktifse, bir döngüde ondan, bir döngüde diğerinden alarak
      adilce karıştırıp yollar.

      Mimari durumlar zaten donanımda ayrı ayrı tutulduğu için, bu geçişler
      sırasında hiçbir şekilde Bağlam Değişimi (Context Switch) cezası ödenmez!
      Yürütme birimleri, kimin kodunu çalıştırdığını umursamadan sürekli meşgul
      tutulur. Çekirdek adeta hiç uyumayan bir fabrikaya dönüşür.

      Performans, Ölçeklenebilirlik ve SMT'nin Geleceği Peki SMT bize ne
      kazandırır? Intel'in kendi verilerine göre, SMT (Hyper-Threading) tek bir
      fiziksel çekirdekte %30'luk bir performans artışı sağlar. Ancak bunun
      faturası güç tüketiminde %20'lik bir artıştır. Yazar burada harika bir
      matematik yapıyor: i7-7700K işlemcisinde tek bir thread ile çalışan bir
      uygulamayı, SMT sayesinde 8 thread'e paralel olarak böldüğünü düşün.
      Performans %800 artar mı? Asla! Mükemmel bir senaryoda bile tek çekirdek
      %130 verimle çalıştığı için, 4 çekirdek toplamda 130% * 4 = %520 (teorik
      maksimum) verim sağlayacaktır. "Mükemmel doğrusal ölçeklenme (perfect
      linear scaling)" diye bir şey yoktur. Ayrıca SMT her derde deva değildir.
      Eğer uygulamanız CPU-Bound (işlemciyi zorlayan) bir sistemse SMT uçurur;
      ama Memory-Bound (sürekli bellekten veri okuyan) bir sistemse, her iki
      thread de belleği bekleyeceği için SMT performansı daha da düşürebilir! Bu
      yüzden her zaman teorilere güvenmek yerine kendi uygulamanızı test etmeniz
      (benchmark) gerekir.

      Linux Kernel Zamanlaması (Scheduling) Burada çok güzel bir mülakat sorusu
      var: İki tane thread'in var ve SMT açık. Linux çekirdeği bunları aynı
      fiziksel çekirdeğin içindeki iki sanal CPU'ya mı koymayı tercih eder (yan
      yana), yoksa tamamen farklı iki fiziksel çekirdeğe mi dağıtır (uzak
      uzağa)? Cevap: Farklı fiziksel çekirdeklere dağıtır (A seçeneği). Çünkü
      Linux çekirdeğinin asıl amacı tüm donanımı maksimize edip güç
      verimliliğini artırmaktır. Çekirdekleri %50 / %50 doldurmak, birini %100
      doldurup diğerini uyutmaktan daha verimlidir. (Ancak "Core Scheduling"
      adlı özel bir özellikle, birbirinin verisine çok muhtaç olan iki thread'i
      aynı L1/L2 önbelleğini kullansınlar diye aynı çekirdeğe zorlamak
      mümkündür).

      SMT Devrinin Sonu Mu? Eskiden tek pazarlama aracı Saat Hızı'ydı (GHz).
      Bugün ise veri merkezlerinin milyarlarca dolarlık elektrik faturaları
      yüzünden "Watt Başına Performans (Performance-per-watt)" en önemli ölçüt
      haline geldi. Intel'in yeni nesil tasarımı "Lunar Lake" bu değişimin en
      net kanıtıdır. Intel, güç verimliliği sağlamak için P-cores (Performans)
      ve E-cores (Verimlilik) yapılarına geçerken, bu yeni tasarımında
      Hyper-Threading'i tamamen kaldırmıştır! Ve işin garibi, Hyper-Threading
      olmamasına rağmen yepyeni mimari iyileştirmeler ve verimlilik
      çekirdekleriyle önceki nesilden %20 daha hızlı olduklarını iddia
      ediyorlar. SMT tamamen ölmese de, o "altın çağının" geride kaldığını ve
      endüstrinin artık akıllı zamanlama ve fiziksel çekirdek sayısını artırmaya
      yöneldiğini söyleyebiliriz.

      Bu bölümün özü: Eşzamanlı Çoklu Kullanım (SMT), sık sık yaşanan
      duraklamalarda donanımın boşta kalmasını engellemek için tek bir fiziksel
      çekirdeğin içine birden fazla Mimari Durum yerleştirerek işletim sistemine
      ekstra "Sanal CPU'lar" sunan zekice bir yöntemdir. Bize %30'a varan
      performans kazançları sunsa da, gerçek fiziksel çekirdeklerin yerini
      tutamaz; üstelik günümüzün güç verimliliği (performance-per-watt)
      trendleri karşısında endüstrideki popülaritesini yavaş yavaş
      kaybetmektedir.

      8.3 Linux: Yazılımsal ve Donanımsal Kilitlenmeler (Soft vs. Hard Lockup)

      Eğer bir yazılım mühendisiysen veya sistem yöneticisiysen (SysAdmin/SRE),
      gecenin bir yarısı üretim sunucularının (production servers) aniden yanıt
      vermeyi kestiği o korkunç anları bilirsin. Linux dünyasında performans
      sorunlarını ve çökmeleri teşhis edebilmek için "Kilitlenme (Lockup)"
      kavramlarının mekaniğini bilmek hayati önem taşır.

      Kernel.org'un resmi belgelerine göre kilitlenmeler ikiye ayrılır:

      Soft Lockup (Yazılımsal Kilitlenme): Çekirdeğin (kernel), diğer görevlere
      (tasks) çalışma şansı vermeden 20 saniyeden fazla boyunca çekirdek modunda
      (kernel mode) bir döngüye (loop) takılıp kalmasına neden olan bir hatadır.

      Hard Lockup (Donanımsal Kilitlenme): CPU'nun, diğer kesmelere (interrupts)
      bile yanıt verme şansı tanımadan 10 saniyeden fazla boyunca çekirdek
      modunda bir döngüye takılıp kalmasına neden olan çok daha ağır bir
      hatadır.

      Bu iki tanım kulağa biraz karmaşık gelebilir. Yazar, aralarındaki farkı ve
      ciddiyeti tam olarak anlayabilmemiz için bir adım geri atıp bu tanımların
      temelindeki kavramları (Mekanik Sempati'nin özünü) açıklıyor:

      Görevler ve Çekirdek Modu (Tasks & Kernel Mode)

      Görevler (Tasks): Modern işletim sistemleri (Linux, Windows) "Çoklu Görev
      (Multitasking)" yeteneğine sahiptir. Aslında aynı nanosaniyede binlerce
      işlem yapmazlar, ama her bir işleme, uygulamaya veya sürece (process)
      minicik bir zaman dilimi (time slice) verirler ve aralarında çılgın bir
      hızla bağlam değişimi (context switching) yaparlar. Böylece bize her şey
      aynı anda çalışıyormuş illüzyonunu yaşatırlar.

      Çekirdek Modu vs Kullanıcı Alanı (Kernel Space vs User Space): Güvenlik ve
      stabilite için bellek (RAM) ve donanım yetkileri ikiye bölünmüştür. Bizim
      yazdığımız uygulamalar, Node.js sunucuları, tarayıcılar "Kullanıcı
      Alanında (User Space)" çalışır. Kendi bellekleri dışına çıkamaz, donanıma
      doğrudan emir veremezler. Ancak İşletim Sistemi ve Aygıt Sürücüleri
      (Device Drivers) "Çekirdek Alanında (Kernel Space)" yaşar. Onlar tanrıdır;
      donanıma ve tüm belleğe sınırsız (privileged) erişimleri vardır. Bizim
      uygulamalarımız donanımdan bir şey istediğinde (örneğin diske dosya
      yazmak) "Sistem Çağrısı (System Call)" yaparak kısa süreliğine Çekirdek
      Modu'na geçer ve iş bitince Kullanıcı Modu'na döner.

      Kesmeler (Interrupts: Maskable vs Non-maskable) İşletim sisteminin
      kalbinin attığı yer "Kesmeler (Interrupts)"dir. Bir donanım veya yazılım,
      CPU'nun o an yaptığı işi derhal bırakıp kendisine odaklanması için bir
      sinyal gönderir.

      Donanım Kesmeleri: Fareyi oynattığında veya ağ kartına (NIC) bir veri
      paketi geldiğinde CPU'ya giden sinyallerdir.

      Yazılım Kesmeleri: Bir sistem çağrısı yapıldığında veya sıfıra bölme
      (division by zero) gibi bir hata (exception) olduğunda oluşan
      sinyallerdir.

      Bizi kilitlenmeler (lockups) konusunda ilgilendiren asıl ayrım şudur:

      Maskelenebilir Kesmeler (Maskable Interrupts - MI): CPU'nun "Şu an çok
      kritik bir iş yapıyorum, beni rahatsız etme" diyerek geçici olarak devre
      dışı bırakabildiği (susturabildiği/maskeleyebildiği) kesmelerdir.
      Telefonunu "Rahatsız Etmeyin" moduna almak gibidir.

      Maskelenemez Kesmeler (Non-Maskable Interrupts - NMI): CPU'nun asla
      görmezden gelemeyeceği, donanımsal seviyede en yüksek önceliğe sahip
      kesmelerdir. Evde çalan bir yangın alarmı gibidir; ne yapıyorsan yap,
      bırakıp ona bakmak zorundasındır.

      Kilitlenmelerin Gerçek Yüzü: Sistem Ne Tepki Verir? Şimdi tanımlara bu
      bilgiler ışığında tekrar bakalım: Eğer sistem bir Soft Lockup (Yazılımsal
      Kilitlenme) yaşıyorsa; hatalı bir sürücü veya işletim sistemi bug'ı
      yüzünden işlemci "Çekirdek Modunda" sonsuz bir döngüye girmiştir.
      Kullanıcı Alanı'ndaki (User Space) hiçbir programa (senin web sunucuna
      veya Spotify'a) asla zaman dilimi (time slice) vermez. Sistem inanılmaz
      yavaşlar. Ancak! Kesmeleri (interrupts) işlemeye devam edebilir. Bu yüzden
      fareyi oynattığında imleç ekranda zar zor da olsa, takıla takıla hareket
      eder ve ağdan gelen paketlere yavaş da olsa tepki verebilir. Eğer sistem
      bir Hard Lockup (Donanımsal Kilitlenme) yaşıyorsa; durum tam bir
      felakettir. Çekirdek sadece sonsuz döngüye girmekle kalmamış, aynı zamanda
      tüm "Maskelenebilir Kesmeleri (MI)" de sağır etmiş (disable) durumdadır.
      Artık klavye, fare, ağ kartı veya zamanlayıcı (scheduler) CPU'ya ulaşamaz.
      Sistem tamamen donmuştur; fare imleci milim kıpırdamaz, sunucu ağdan
      tamamen kopmuştur.

      Bu Kilitlenmelere Ne Sebep Olur?

      Çekirdek Hataları (Kernel bugs): Çekirdeğin kendi kodundaki veya hatalı
      yazılmış bir donanım sürücüsündeki kusurlar.

      Donanım Arızaları: Arızalı bir RAM modülü, aşırı ısınan ve sapıtan bir
      CPU.

      Sanallaştırma Ortamları (Virtualized environments - ÇOK KRİTİK!): AWS,
      Google Cloud gibi yerlerde sanal makine (VM) kullanıyoruz. Eğer alt
      taraftaki ana makine (Hypervisor) aşırı yük altındaysa (CPU starvation) ve
      bizim VM'mize vaat ettiği CPU gücünü sağlayamayıp onu uzun süre dondurursa
      (scheduling failures), bizim sanal makinemizin içindeki Linux OS bunu bir
      "Soft Lockup" veya "Hard Lockup" olarak algılar ve çöker! Gerçekte
      Linux'ta bir hata yoktur, sorun onu barındıran bulut altyapısındadır.

      Linux Bu Durumu Nasıl Algılar ve Ne Yapar? (The Watchdog) İşletim sistemi
      kendi içinde asılı kaldığını nasıl anlar? Linux'un içinde "Watchdog (Bekçi
      Köpeği)" adında harika bir mekanizma vardır. Watchdog, periyodik
      aralıklarla tüm CPU çekirdeklerine "Maskelenemez Kesme (NMI)" göndererek
      "Hey, hayatta mısın?" diye yoklama çeker (Çünkü Hard Lockup durumunda bile
      NMI'lar asla engellenemez!).

      Biz sunucu yöneticileri olarak Linux'a bu durumlarda ne yapması
      gerektiğini şu dosyalara yazarak söyleyebiliriz:

      $ cat /proc/sys/kernel/watchdog_thresh 10 -> Bu eşik değeridir (varsayılan
      10 saniye).

      Bir CPU, bu değerin 2 katı (20 saniye) boyunca aynı görevde takılı kalırsa
      -> Soft Lockup ilan edilir.

      Bir CPU, bu değerin 1 katı (10 saniye) boyunca kesmelere (interrupts)
      cevap vermezse -> Hard Lockup ilan edilir.

      $ cat /proc/sys/kernel/softlockup_panic 1 -> Bunu 1 yaparsak Linux, Soft
      Lockup hissettiği an sistemi komple çökertecek (Kernel Panic) ve yeniden
      başlatacaktır.

      $ cat /proc/sys/kernel/hardlockup_panic 1 -> Bunu 1 yaparsak Linux, Hard
      Lockup anında sistemi paniğe sürükler.

      Eğer sistem panik yapmayacak şekilde ayarlanmışsa (parametreler 0 ise),
      Linux çekirdeği çaresizce /var/log/messages dosyasına (veya dmesg'e) şu
      çığlığı yazar: BUG: soft lockup - CPU#13 stuck for 21s!. Sistem yöneticisi
      loglarda bu mesajı gördüğünde bilir ki ya sistemde ağır bir sürücü hatası
      var, ya da bulut sağlayıcısı ona yeterli CPU veremiyor.

      Bu bölümün özü: Linux'taki kilitlenmeler (lockups), sistemin çekirdek
      modunda takılı kalarak kontrolü kaybetmesi durumudur; Soft Lockup
      kullanıcı uygulamalarını dondurup sadece donanım kesmelerine sürüne sürüne
      cevap verebilirken, Hard Lockup kesmeleri de sağır ederek sistemi tamamen
      felç eder (fare imlecinin donması gibi). Watchdog mekanizmaları ve NMI
      (maskelenemez kesmeler) sayesinde bu kilitlenmeler tespit edilebilir; bu
      hataların altında yatan gerçek neden genellikle çekirdek/sürücü hataları
      veya sanal makinelerde (VM) bulut sağlayıcısından kaynaklanan CPU açlığı
      (starvation) olabilmektedir.
