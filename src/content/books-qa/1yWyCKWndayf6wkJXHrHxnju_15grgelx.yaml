bolumler:
  - baslik: "Hızlı Bakış"
    sorular:
      - soru: "Bu kitap tek cümlede ne iddia ediyor?"
        cevap: |
          Güvenilir sistem, "hiç hata vermeyen" sistem değil; **hatanın kaçınılmaz olduğunu
          kabul edip nasıl davranacağını önceden planlamış** sistemdir — kullanıcı gözünden
          "sadece çalışan" tutarlılık budur.
      - soru: "Bu kitabı okumasam kaçıracağım en değerli 3 fikir ne?"
        cevap: |
          1. **Graceful degradation:** Aşırı yükte çökmek yerine bilinçli kalite düşürmek —
             load shedding, kritik olmayan özellikleri kapatmak.
          2. **Fail open vs. fail closed:** Hata anında erişilebilirlik mi kontrol mü tercih
             edilecek — bu bir teknik detay değil, ürün kararıdır.
          3. **Sert bağımlılığı yumuşatmak:** Güvenilirliği artırmanın en etkili yolu daha az
             hata yapmak değil, iyi fallback'lerle hard dependency'leri soft'a dönüştürmektir.
  - baslik: "Derinleştirme"
    sorular:
      - soru: "Kitabın omurgası olan zihinsel model/framework nedir?"
        cevap: |
          Üç katmanlı bir güvenilirlik çerçevesi: (1) **hata stratejisi** — degradation,
          fail open/closed, adaptive LIFO gibi önceden verilmiş kararlar; (2) **bağımlılık
          yönetimi** — hard/soft ayrımı ve fallback tasarımı; (3) **veri katmanı teoremleri** —
          ACID, CAP ve PACELC ile tutarlılık/erişilebilirlik/gecikme takasları.
      - soru: "Kitaptaki hangi kavramlar birbirine bağlı?"
        cevap: |
          CAP → PACELC bir genişletmedir (bölünme yokken bile gecikme-tutarlılık takası vardır);
          fail open/closed kararı hard/soft bağımlılık ayrımına dayanır; adaptive LIFO ile
          load shedding, aynı ilkenin (taze isteğe öncelik, bilinçli vazgeçiş) iki yüzüdür.
  - baslik: "Uygulama"
    sorular:
      - soru: "Bu kitabı okuduktan sonra yarın sabah farklı yapacağım ilk şey ne
          olmalı?"
        cevap: |
          Sistemindeki bağımlılıkları iki listeye ayır: hangileri hard, hangileri soft?
          Sonra tek bir hard bağımlılık seç ve "bu servis 30 saniye cevap vermezse ne olur?"
          sorusuna kodda cevabı olan bir fallback yaz.
      - soru: "Kitaptaki fikirleri kendi projeme uygularsam neye benzer?"
        cevap: |
          Bu blogda bile görülebilir: Giscus yorumları ve arama lazy yüklenir ve çalışmazsa
          sayfa çalışmaya devam eder (soft dependency); kutuphanem senkronu başarısız olursa
          eski veri korunur (fail closed yerine bilinçli fail open). Aynı düşünce her API
          entegrasyonuna uygulanır.
  - baslik: "Eleştiri ve Bağlam"
    sorular:
      - soru: "Bu kitabın 80/20'si ne — hangi kavramlar öncelikli?"
        cevap: |
          Kavramların çoğu tanıdıksa bile şu üçlü tek başına kitabın değerinin büyük kısmını
          taşır: hata stratejisini *önceden* seçmek (fail open/closed), hard→soft bağımlılık
          dönüşümü ve PACELC'in hatırlattığı gündelik gerçek — takas, yalnızca felaket anında
          değil her istekte vardır.
ozet:
  - baslik: Kitabın Yapısı ve Yol Haritası (9 Bölüm)
    icerik: >-
      The Coder Cafe kitabı, yazılım mühendisliği temellerini geniş bir
      yelpazede ele alan ve toplam 9 bölümden (chapter) oluşan bir yapıya
      sahiptir


      . İşte kitabın tam yapısı ve her bölümün içeriği:

      Kitabın Bölümleri ve İçerikleri

      Bölüm 1: Algorithms & Data Structures Temel programlama yapıtaşlarını
      oluşturarak diziler, bağlı listeler, ikili yığınlar (binary heaps) ve
      graflar gibi temel veri yapılarının avantajlarını ve takaslarını
      (trade-offs) inceler


      . Ayrıca, bağımlılıkları çözümlemek için Topological Sort ve ağ akış
      problemlerini çözmek için Ford-Fulkerson gibi kritik algoritmaların nasıl
      çalıştığını detaylandırır


      .

      Bölüm 2: Concurrency Eşzamanlılık (concurrency) ve paralellik
      (parallelism) kavramları arasındaki temel farkları açıklayarak, görevlerin
      bağımsız olarak yönetilmesi ile aynı anda çalıştırılması durumlarını
      örneklendirir


      . Çoklu iş parçacığı senaryolarında güvenli kod yazmak için coroutine'ler,
      mutex, semaphore ve yarış durumları (race conditions) gibi mekanizmaları
      öğretir


      .

      Bölüm 3: Functional Programming Fonksiyonel programlamada fonksiyonları
      daha yeniden kullanılabilir hale getiren kısmi uygulama (partially applied
      functions) ve currying tekniklerini açıklar


      . Kodu güvenli bir şekilde sarmalamak ve yan etkileri (side effects)
      yönetmek için Functor, Applicative ve Monad gibi temel ve gelişmiş
      fonksiyonel soyutlamaların (abstractions) mantığını anlatır


      .

      Bölüm 4: Software Engineering Kodun zaman içindeki gelişimini ve sağlığını
      korumayı hedefleyen erken soyutlamadan kaçınma, YAGNI, okunabilirlik ve
      bilişsel yükü (cognitive load) azaltma gibi güçlü mühendislik
      felsefelerine odaklanır


      . Sistemin sürdürülebilirliğini sağlamak için yüksek uyum (cohesion),
      düşük bağlılık (coupling), kontrollü büyüme ve küçük refaktörler (tidy
      first) konularını inceler


      .

      Bölüm 5: Testing Testlerde mantık kullanımından kaçınma (avoiding logic in
      tests), satır/dal kod kapsamı (line/branch coverage) gibi test temellerini
      ve özellik bazlı testler (property-based testing) gibi ileri seviye
      stratejileri öğretir


      . Birim testlerinin (unit tests) sadece kodun çalışıp çalışmadığını
      doğrulamadığını; aynı zamanda yaşayan bir dokümantasyon olduğunu ve
      uygulamaya değil davranışa odaklanması gerektiğini vurgular


      .

      Bölüm 6: Distributed Systems Sistem mimarileri ve veritabanı teorisine
      inerek ACID özellikleri, CAP ve PACELC teoremleri ile dağıtık sistemlerde
      erişilebilirlik (availability) ve tutarlılık (consistency) modellerini
      işler


      . İzolasyon seviyeleri ve olası anomaliler ile Bloom filtreleri gibi
      yaklaşımların yanı sıra, karmaşık (complex) ve karışık (complicated)
      sistemler arasındaki farklara ve bu sistemlerde nasıl yol alınacağına
      odaklanır


      .

      Bölüm 7: Reliability Sistem güvenilirliğinin esneklik (resilience), hata
      toleransı ve sağlamlık (robustness) kavramlarından nasıl ayrıştığını
      netleştirerek, hata durumlarında zarifçe hizmet azaltma (graceful
      degradation) ve açık/kapalı başarısızlık (fail open/closed) stratejilerini
      anlatır


      . Sistemlerin ayakta kalması için bağımlılık türlerinin (soft/hard)
      yönetimini ele alırken, sorun tespitindeki bilişsel ve nedensellik
      yanılgılarına (post hoc ergo propter hoc, lurking variables) dikkat çeker


      .

      Bölüm 8: Systems Yazılımın temelinde çalışan donanımı anlamak için
      geliştiricilerde bir "mekanik sempati" (mechanical sympathy) kurmayı
      hedefler

      . İşlemcilerin nasıl çalıştığını anlamak üzere komut ardışık düzeni
      (instruction pipelining) ve Eşzamanlı Çoklu Kullanım (SMT/Hyper-Threading)
      konularını incelerken, sorun giderme yeteneklerini artırmak için Linux
      çekirdek kilitlenmelerine (soft/hard lockups) değinir


      .

      Bölüm 9: Beyond Code Teknik yeteneklerin dışındaki kritik becerilere
      odaklanarak etkili yardım isteme (XY problemi) ve net teknik metin yazımı
      becerilerini sunar


      . Kariyer gelişimi ve karar alma mekanizması için bilişsel önyargılar
      (cognitive biases), yanal düşünme (lateral thinking), not tutma üzerinden
      etkili bilgi yönetimi (Second Brain / PARA yöntemi) ve zihinsel sağlığı
      koruma üzerine durur


      .

      Kitabın 5 Mantıksal Parçaya Bölünmüş Hali

      Sonraki derinlemesine incelemeler için kitap, içeriğindeki ortak bağlam ve
      temalara göre şu 5 ana parçaya bölünebilir:

      Parça A: Temel Kavramlar ve Paradigmalar (Bölüm 1 - Bölüm 3) Algoritmalar,
      veri yapıları, çok iş parçacıklı güvenli kod (concurrency) ve fonksiyonel
      programlama prensipleriyle kodun en küçük yapıtaşlarını ve mantıksal
      çalışma biçimlerini içerir.

      Parça B: Kod Mimarisi ve Doğrulama (Bölüm 4 - Bölüm 5) Yazılım
      mühendisliği prensipleriyle kodun nasıl daha okunabilir ve bakımı
      yapılabilir şekilde (YAGNI, cohesion/coupling) tasarlanacağına ve bu
      tasarımın testlerle (Testing) nasıl güvence altına alınacağına odaklanır.

      Parça C: Sistem Tasarımı ve İşletme (Bölüm 6 - Bölüm 7) Dağıtık
      sistemlerin ölçeklenmesi, veritabanı teoremleri (CAP/PACELC), yüksek
      erişilebilirlik sağlama ve zorlu şartlar altında sistem güvenilirliğini
      (Reliability) sağlama stratejilerini kapsar.

      Parça D: Donanım ve İşletim Sistemi (Bölüm 8) Kodun doğrudan üzerinde
      çalıştığı CPU mimarisini, pipeline operasyonlarını, multithreading donanım
      seviyesi detaylarını ve Linux çekirdeğindeki temel performans/kilitlenme
      metriklerini ele alır.

      Parça E: Mühendislik Pratikleri ve Zihin Yapısı (Bölüm 9) Sadece kod
      yazmanın dışına çıkarak iletişim becerileri, üretkenliği ve bilgiyi
      organize etmeyi (Knowledge Management/Second Brain), karar
      mekanizmalarındaki bilişsel yanılgıları yönetmeyi ve kariyer için
      psikolojik sürdürülebilirliği inceler.
  - baslik: Parça A · Temel Kavramlar ve Paradigmalar (Bölüm 1-3)
    icerik: >-
      Harika bir başlangıç noktası! "The Coder Cafe" kitabının Parça A: Temel
      Kavramlar ve Paradigmalar bölümü, bir yazılım mühendisinin günlük hayatta
      ve mülakatlarda karşısına çıkacak en hayati yapıtaşlarını kapsıyor


      . Yazar Teiva Harsanyi'nin de dediği gibi, bu kavramları kahvemizi
      yudumlarken acele etmeden, adım adım (Kaizen felsefesiyle) sindirerek
      öğreneceğiz

      .

      Görevin kurallarına uygun olarak, hiçbir detayı atlamadan, her bir bölümü
      sanki karşılıklı kahve içiyormuşuz gibi samimi ama teknik derinliğini
      koruyarak yeniden anlatıyorum. Hazırsan başlayalım!

      ### Bölüm 1: Algoritmalar ve Veri Yapıları (Algorithms & Data Structures)

      Bu bölüm, kod yazarken kullandığımız en temel yapıtaşlarına, yani verileri
      nasıl tuttuğumuza ve onları nasıl işlediğimize odaklanıyor

      . Her veri yapısının ve algoritmanın bir bedeli (trade-off) vardır; önemli
      olan doğru yerde doğru aracı seçmektir

      .

      Diziler (Arrays) ve Bağlı Listeler (Linked Lists) Arasındaki Savaş Veri
      tutmak istediğimizde aklımıza ilk gelen iki seçenek genellikle diziler ve
      bağlı listelerdir


      . İkisi de temelde bir element koleksiyonunu saklar ama bunu yapış
      biçimleri gece ve gündüz kadar farklıdır

      . Bir dizi (array), bellekte yan yana (bitişik - contiguous) duran odalar
      gibidir

      . İki türü vardır: Boyutu baştan belli olan sabit boyutlu diziler
      (fixed-size arrays) ve doldukça kendine yeni yer açan, Java'daki ArrayList
      veya Go'daki slices gibi dinamik diziler (dynamic arrays)

      . Öte yandan, bir bağlı liste (linked list), her biri hem veriyi hem de
      bir sonraki odanın adresini (pointer/reference) tutan düğümlerden (nodes)
      oluşur

      . Bu ekstra adres tutma işi, bağlı listelerin dizilere göre bellek yükünün
      (memory overhead) daha fazla olmasına neden olur

      . Çift yönlü bağlı listelerde (doubly linked list) bu yük, hem önceki hem
      sonraki düğümün adresi tutulduğu için daha da artar

      .

      Yazar burada çok kritik bir karşılaştırma yapıyor: Zaman karmaşıklığı
      (time complexity)

      . Teorik olarak, bağlı listelerin arasına veya başına eleman
      eklemek/silmek O(1) zaman alır (eğer eklenecek yeri biliyorsan), oysa bir
      dizide bu işlem O(n) sürer çünkü tüm elemanları kaydırman veya yeni bir
      diziye kopyalaman gerekir

      . Peki pratikte durum gerçekten böyle mi? Yazar kendi tasarladığı bir
      deneyi paylaşıyor: Bellekte aynı anda bitişik olarak tahsis edilmiş bir
      bağlı listeyi dolaşmak ile bir diziyi dolaşmayı karşılaştırdığında, bağlı
      listenin diziden %230 daha yavaş çalıştığını görmüş!

      . Neden mi? İki sebebi var: Birincisi, bağlı listenin assembly (makine)
      kodu döngü başına daha fazla döngü (cycle) içerir

      . İkincisi ve daha önemlisi, bağlı listelerde adresler arasında atlamak
      CPU için öngörülemez bir durumdur

      . CPU, dizilerdeki gibi yan yana duran verileri önceden tahmin edip
      belleğe getiremez (prefetching yapamaz)

      . Bu da "cache miss" (önbellek ıskalaması) dediğimiz şeye yol açar ve
      performansı yerle bir eder

      . Sonuç: Eğer uygulamanın performansı kritikse, sadece O(1) / O(n)
      teorilerine güvenme, mutlaka test et (benchmark)

      . Kural olarak; listenin sonu haricinde sürekli eleman ekleyip çıkarman
      gerekiyorsa bağlı listeyi düşün, geri kalan durumlarda diziler genelde
      donanımla daha uyumludur


      .

      İkili Yığınlar (Binary Heaps) Eğer bir veri setindeki en küçük veya en
      büyük elemana sürekli ve çok hızlı bir şekilde ulaşman gerekiyorsa,
      sahneye İkili Yığınlar (Binary Heaps) çıkar

      . Bu yapı, tam (complete) bir ikili ağaçtır; yani son seviye hariç her
      seviye tamamen doludur ve soldan sağa doğru doldurulur

      . İki kuralı vardır: Min-Heap (her ebeveyn düğüm çocuklarından küçüktür)
      veya Max-Heap (her ebeveyn çocuklarından büyüktür)

      . İkili arama ağaçlarından (BST) farkı şudur: BST'de küçükler solda,
      büyükler sağdadır; Heap'te ise sadece "ebeveyn büyüktür/küçüktür" kuralı
      vardır, sağ-sol ayrımı yoktur

      . En üstteki elemana O(1) sürede ulaşırsın, yeni eleman eklemek ise O(log
      n) sürer

      . Bu özellikleri onu öncelik kuyrukları (priority queues), Dijkstra
      algoritması ve heapsort için biçilmiş kaftan yapar


      .

      Graflar (Graphs) ve Algoritmaları Sosyal ağlardan haritalara kadar her
      yerde olan graflar, temelde düğümler (vertices/nodes) ve onları birbirine
      bağlayan kenarlardan (edges/links) oluşur


      . Grafların farklı karakterleri vardır:

      Yönlü (Directed) vs Yönsüz (Undirected): Twitter'da birini takip etmen
      (yönlü) ile Facebook'ta karşılıklı arkadaş olmanız (yönsüz) gibi


      .

      Döngüsel (Cyclic) vs Döngüsüz (Acyclic): Düğümler arasında dolaşıp
      başladığın yere dönebiliyorsan döngüseldir


      .

      Ağırlıklı (Weighted) vs Ağırlıksız (Unweighted): Şehirler arası yolculuk
      süresi kenarın ağırlığıdır; herkesin eşit olduğu bir arkadaşlık ağı
      ağırlıksızdır

      .

      Bağlı (Connected) vs Kopuk (Disconnected): Ağa bağlı her makinenin
      birbirine ulaşabilmesi bağlıdır; internetin kopması kopukluğa örnektir

      .

      Yazar burada iki önemli algoritmayı inceliyor: 1. Topolojik Sıralama
      (Topological Sort): Elimizde yönlü ve döngüsüz bir graf (DAG) olduğunu
      düşünelim


      . Mesela, C işinin bitmesi için A'nın bitmesi gerekiyor, B için A
      gerekiyor vs.

      . Topolojik sıralama, bu bağımlılıkları dümdüz bir sıraya koyar

      . A -> B -> C -> D gibi yatay bir akış çıkarır


      . Bunu nasıl yapar? Her düğümün kendisine gelen ok sayısını (in-degree
      counter) sayar


      . Hiç ok gelmeyen (sıfır olan) düğümü sıraya koyar, o düğümü ve oklarını
      grafikten siler, sonra yeni sıfır olanları bulup devam eder

      . Zaman karmaşıklığı düğüm ve kenar sayısının toplamı kadardır O(v + e)

      . Nerede kullanılır? Mac'teki Homebrew paket yöneticisinde paket kurulum
      sırasını bulmakta, GNU Make'te derleme sırasında veya İşletim
      Sistemlerinde kilitlenmeleri (deadlock) tespit etmede

      .

      2. Ford-Fulkerson Algoritması (Max Flow): Bu, bir sistemden maksimum ne
      kadar "şey" (veri, su, araba) geçirebileceğimizi bulmamızı sağlar


      . Bir musluktan (source) lavaboya (sink) giden farklı kalınlıkta borular
      düşün


      . Her borunun bir kapasitesi (capacity) var. Algoritma şu mantıkla
      çalışır: Musluktan lavaboya kapasitesi dolmamış bir yol (augmenting path)
      bul


      . Bu yoldaki en dar boru senin o yol için maksimum kapasitendir
      (bottleneck)

      . Bu değeri toplam akışa ekle ve kullandığın borulardaki kalan kapasiteyi
      güncelle

      . Yazarın burada vurguladığı harika bir detay var: Yolu rastgele (örneğin
      DFS ile) seçtiğimiz için yanlış ve verimsiz bir yol seçmiş olabiliriz


      . Bunu düzeltmek için algoritma her adımda gönderdiği su miktarı kadar
      "geriye doğru bir hayali boru (backward edge)" çizer

      . Bu geriye doğru borular, sistemin daha sonra hata yaptığını anlayıp suyu
      başka bir rotaya kaydırmasını (redistribution of flow) sağlar!


      . Eğer bu yolları bulmak için DFS kullanırsan algoritmanın hızı maksimum
      akış miktarına (U) bağlı olur: O(EU)


      . Ama yolları BFS (Breadth-First Search) ile ararsan (buna Edmonds-Karp
      denir), karmaşıklık tamamen grafın yapısına bağlanır ve O(VE^2) olur

      .

      Bu bölümün özü: Veri yapılarını (dizi, bağlı liste, yığın) seçerken sadece
      kağıt üzerindeki zaman karmaşıklığına değil, donanımın önbellek dostu olup
      olmadığına da dikkat etmeliyiz. Graflar ise karmaşık ilişkileri ve
      bağımlılıkları modellemekte en güçlü silahımızdır; topolojik sıralama
      bağımlılıkları çözerken, Ford-Fulkerson sistemlerin taşıma kapasitelerinin
      sınırlarını geriye dönük telafi yeteneğiyle (backward edges) bulur.

      ### Bölüm 2: Eşzamanlılık (Concurrency)

      Programlamada kavramları birbirine karıştırmak çok sık rastlanan bir
      durumdur. Bu bölüm, en çok karıştırılan konulara odaklanıp onları
      netleştiriyor

      .

      Eşzamanlılık (Concurrency) vs Paralellik (Parallelism) Bu ikisi genellikle
      aynı şey zannedilir ama tamamen farklı kavramlardır

      . Yazarın harika kahve dükkanı analojisiyle anlatalım: Düşün ki bir kafede
      tek bir garson ve tek bir kahve makinesi var

      . Müşteriler sıraya girer, sipariş verir ve bekler

      . Bu standart, sırayla çalışan tek iş parçacıklı (single-threaded)
      modelimiz. İşler yoğunlaşınca dükkan sahibi ikinci bir garson ve ikinci
      bir kahve makinesi alıyor

      . Artık iki garson aynı anda farklı müşterilere hizmet verebiliyor

      . İşte bu Paralellik (Parallelism)'dir; işleri aynı anda yapabilmek için
      sisteme daha fazla kaynak (garson ve makine = thread ve core) eklemektir


      . Bu işlem hızı artırır ama donanım maliyetlidir

      .

      Peki sürekli makine mi alacağız? Hayır, yazar "işin yapılış yapısını
      (structure) değiştirelim" diyor

      . Sipariş alma işlemi kısa sürerken, kahveyi yapmak uzun sürer. O halde
      bir garson sadece siparişleri alsın, diğer garson (ikinci makineye gerek
      olmadan) içeride sadece kahveleri yapsın

      . Müşteriler Starbucks'taki gibi siparişi verip kahve bekleme alanına
      geçerler

      . İşte bu Eşzamanlılık (Concurrency)'dir

      . İşler aslında tam olarak aynı nanosaniyede yapılmak zorunda değildir,
      ancak bağımsız yönetilebilen parçalara ayrılmışlardır

      . Eğer kahve yapmak yine de yetişmiyorsa, içeriye bir kahve yapan garson
      daha eklersin

      . Böylece eşzamanlı bir yapının içine belirli bir adım için paralellik
      eklemiş olursun

      . Yani eşzamanlılık bir tasarım ve yapı (structure) meselesiyken,
      paralellik bir yürütme (execution) meselesidir

      . Bir sistem eşzamanlı olup paralel çalışmayabilir, paralellik için
      tasarlanıp eşzamanlı olmayabilir

      . Çok iş parçacıklı programlama (Multithreading) ise her ikisini de temsil
      edebilir

      .

      Coroutines (Eşyordamlar) Standart fonksiyonları (subroutines) biliyorsun;
      çağırırsın, baştan sona çalışır, bitene kadar bekletir (bloke eder)

      . Ama coroutines (eşyordamlar) farklıdır. Bunlar sihirli bir şekilde
      duraklatılabilen (pause) ve sonra kaldıkları yerden devam edebilen
      (resume) fonksiyonlardır

      . Python'daki yield anahtar kelimesiyle oluşturulan yapılar bunun en iyi
      örneğidir

      . Fonksiyon yield'ı görünce bir değer döner ve durur

      . Sen tekrar next() çağırdığında fonksiyon en baştan başlamaz, o yield'ın
      olduğu satırdan hiçbir şey olmamış gibi devam eder

      . Bunun güzelliği şudur: Coroutine'ler yeni bir thread (iş parçacığı)
      yaratmazlar; tamamen aynı thread içinde çalışırlar

      . Ama bekleme yaparken (örneğin ağdan veri beklerken) diğer coroutine'e
      geçiş yapılabildiği için bize paralellik olmadan eşzamanlılık (concurrency
      without parallelism) sağlarlar

      . Özellikle I/O beklemelerinde, veri boru hatlarında (data pipelines) ve
      hafızayı doldurmadan sayı üreten jeneratörlerde çok faydalıdırlar

      .

      Mutex vs Semaphore (Kilitleme ve Sinyalleşme) İki farklı thread aynı
      kaynağa ulaşmaya çalıştığında bir trafik polisi gerekir.

      Mutex (Mutual Exclusion - Karşılıklı Dışlama): Bir odaya girmek için tek
      bir anahtarın olması gibidir

      . Bir thread anahtarı alır (lock), odaya girer ve işini bitirip çıkana
      kadar anahtarı iade etmez (unlock)

      . Diğerleri kapıda bekler

      . Sahiplik hissi vardır (kitleyen açmalıdır) ve kapasitesi sadece 1'dir


      . "Bu kaynağı ben kullanıyorum, işim bitene kadar kimse dokunamaz" der

      .

      Semaphore (Semafor): İçerisinde 5 arabalık yer olan otopark gibidir

      . Ortada tek bir anahtar yoktur, bir sayaç vardır

      . Giren araba sayacı 1 düşürür, çıkan araba sayacı 1 artırır

      . Sayı sıfırsa gelen araba bekler

      . Burada katı bir sahiplik yoktur; başka bir thread de sayacı artırabilir

      . Kapasitesi birden fazla kaynağı (pool of resources) yönetmek içindir


      . "Ortada şu kadar kaynak var, ihtiyacın varsa al, bitince haber ver" der

      .

      Data Race (Veri Yarışı) vs Race Condition (Yarış Durumu) Bu iki terim de
      genellikle birbirine karıştırılır

      .

      Data Race: İki veya daha fazla thread'in aynı anda aynı hafıza bölgesine
      (memory location) erişmesi ve bunlardan en az birinin yazma (write) işlemi
      yapmasıdır

      . Örneğin bir thread coffee.price = 10 diye fiyatı güncellerken, diğerinin
      o esnada fiyatı ekrana bastırmasıdır

      . Çıktı tamamen şansa bağlıdır ve genellikle sistemde derin hatalara (bug)
      neden olur


      .

      Race Condition: Olayların hangi sırayla (timing) gerçekleşeceğinin kontrol
      edilemediği durumlardır

      . Yazarın çok çarpıcı bir örneği var: Twitter'daki beğeni sayısının birkaç
      saniyeliğine 606 yerine 605 görünmesi zararsız bir Race Condition'dır

      . Ama banka hesabında bakiyenin güncellenmemiş eski halini görmek
      tehlikeli bir Race Condition'dır

      .

      Buradaki altın kural şudur: Tüm Data Race'ler aynı zamanda bir Race
      Condition'dır, ancak her Race Condition bir Data Race değildir


      . Mutex kullanarak Data Race'i önleyebilirsin, ancak işlemlerin hangi
      sırayla çalışacağını (örneğin veritabanı gecikmeleri yüzünden) garanti
      edemediğin sürece hala bir Race Condition içinde olabilirsin


      .

      Bu bölümün özü: Eşzamanlılık programın işleri nasıl parçalara ayırarak
      planladığıyla ilgiliyken, paralellik işleri fiziksel olarak aynı anda
      yaptırmakla ilgilidir. Coroutine'ler aynı iş parçacığı içinde paralel
      olmadan eşzamanlılık sunarken; Mutex ve Semaforlar paylaşılan kaynakları
      yöneterek, zamanlamaya ve hafıza erişimine dayalı çökertici hataların
      (data race ve race condition) önüne geçmemizi sağlayan kritik polislerdir.

      ### Bölüm 3: Fonksiyonel Programlama (Functional Programming)

      Nesne yönelimli programlamanın (OOP) hakim olduğu dünyamızda, fonksiyonel
      programlama ilk başta biraz uzaylı dili gibi gelebiliyor

      . Ancak bu bölüm, fonksiyonları daha esnek ve test edilebilir hale getiren
      çok güçlü soyutlamaları (abstractions) öğretiyor

      .

      Kısmi Uygulama (Partially Applied Functions) ve Currying Üç sayıyı
      toplayan bir fonksiyonumuz olsun: add(x, y, z)


      . Diyelim ki kodun belli bir yerinde x her zaman 5 olacak şekilde
      kullanılıyor. Sürekli add(5, y, z) yazmak yerine, Kısmi Uygulama
      (Partially Applied Function) yaparak, bazı parametreleri sabitleriz

      . Yeni bir fonksiyon yaratırız: val addFive = add(5, _, _). Alt çizgiler,
      geriye kalan y ve z argümanlarının yer tutucusudur (placeholder)


      . Currying ise biraz daha farklıdır

      . Çok parametreli bir fonksiyonu, her biri tek bir argüman alan ardışık
      fonksiyonlar zincirine dönüştürme işlemidir

      . Yani add(x, y, z) fonksiyonunu curriedAdd(x)(y)(z) formuna getirirsin

      . Peki Currying kendi başına ne işe yarar? Yazar da bu soruyu sorup
      cevaplıyor: Kendi başına çok işe yaramazmış gibi görünse de Kısmi Uygulama
      ile birleşince çok temiz bir yazım sunar

      . Alt çizgilerle uğraşmak yerine doğrudan val addFive = curriedAdd(5)
      diyerek 5'i sabitlersin, o sana geriye sadece kalan iki argümanı bekleyen
      yepyeni bir fonksiyon döndürür


      . Temiz, modüler ve şık

      .

      Functors, Applicatives ve Monads (Kutu Metaforu) Fonksiyonel
      programlamanın "Kutsal Üçlüsü" olan bu kavramları anlamak için yazar
      harika bir metafor kullanıyor: Kapalı bir mavi kutu


      . Kutu açılmadan içinde ne olduğunu bilemeyiz

      . Kutuyu açıyoruz ve içinden Hayatın, Evrenin ve Her Şeyin Cevabı olan
      "42" çıkıyor!

      . Programlamada bu kutu, değeri sarmalayan (wrap) bir bağlamdır (context)

      . Mesela Java'daki Optional, Rust'taki Option veya Haskell'deki Maybe tipi
      bu kutudur

      . Değer olabilir (Just 42) veya kutu boş olabilir (Nothing)


      .

      Functor (Kutuya Dışarıdan Müdahale): Elimizde kutunun içindeki 42 değeri
      ve dışarıda standart bir (+1) toplama fonksiyonu var

      . (+1) normalde sade sayılarla çalışır, kutulu değerlerle değil

      . İşte Functor, kutunun bağlamını (içinde değer olup olmama durumunu) hiç
      bozmadan dışarıdaki bu fonksiyonu kutunun içine sokup çalıştırmamızı
      sağlayan yapıdır

      . Haskell'deki fmap fonksiyonu tam olarak bunu yapar

      . fmap (+1) (Just 42) dediğinde sana Just 43 döner

      . Eğer kutu boşsa (Nothing), 1 eklemeye çalışmaz, doğrudan boş kutu
      (Nothing) döner

      . Kutu bir liste olsa bile (Yeşil kutu), fmap o fonksiyonu listenin tüm
      elemanlarına uygular

      . Functor = Dışarıdaki bir fonksiyonu, kutunun içindeki veriye
      uygulamaktır

      .

      Applicative (Kutudaki Fonksiyonu Kutudaki Değere Uygulamak): Peki ya
      uygulayacağımız (+1) fonksiyonunun kendisi de bir kutunun (Maybe veya
      Liste) içindeyse?


      . Mesela fonksiyon hata verdiği için gelmemiş olabilir (opsiyonel) veya
      birden fazla fonksiyon listesi olabilir

      . fmap burada derleme hatası verir çünkü o, dışarıda özgür bir fonksiyon
      bekler

      . İşte burada Applicative Functors (Applicatives) devreye girer

      . Haskell'de <*> operatörüyle gösterilir


      . Bu operatör, "Kutunun içindeki fonksiyonu al, diğer kutunun içindeki
      veriye uygula ve sonucu yeni bir kutuya koy" der

      . Just (+1) <*> Just 42 dersen, sonuç Just 43 olur

      . Hatta listenin içinde [+1, +10] gibi iki fonksiyon ve diğer yanda 

       listesi varsa, hepsini birbirine uygular
      . Ancak bir şart var: İki kutunun da türü (context) aynı olmak zorundadır

      .

      Monads (Final Boss): Geldik işin en civcivli kısmına

      . Şimdiye kadar hep A -> B (A'dan B'ye giden) fonksiyonlardan bahsettik

      . Peki ya fonksiyon dışarıdaki normal bir değeri (A) alıp, onu işleyip
      kutu içinde bir değer (Maybe B) döndürüyorsa ne olacak?

      . Mesela, yaşı alıp geçerliyse Just yas, değilse Nothing dönen bir
      validateAge(age) fonksiyonu ve ismi alıp "Hello İsim" dönen greet(name)
      fonksiyonumuz olsun

      . Diyelim ki yaşı doğrulayıp o kişiye merhaba demek istiyoruz. greet <$>
      Just name <*> validateAge age yazmayı deniyoruz ama kod patlıyor (type
      mismatch error)!


      . Çünkü Applicative (<*>), greet <$> Just name işleminden gelen "kutu
      içindeki String->String" fonksiyonuyla, validateAge'in döndürdüğü "Kutu
      içindeki Int" (Maybe Int) değerini birleştiremez


      . İşte Monad, "Normal değer alıp Kutu (Context) döndüren bağımlı
      fonksiyonları arka arkaya zincirlememizi (sequence and compose) sağlayan
      yapıdır"


      . Haskell'de bunu ya >>= operatörüyle ya da kodun imperatif (satır satır)
      görünmesini sağlayan do notasyonuyla yaparız

      .

      Burada validateAge eğer Nothing dönerse (yaş 18'den küçükse), zincir
      anında kopar ve sonuç otomatik olarak Nothing olur

      . Devamındaki satırlar hiç çalıştırılmaz!

      . Eğer yaş uygunsa, return komutu (ki Haskell'de işlemi sonlandıran bir
      komut değil, değeri bir Monad kutusunun içine koyan fonksiyondur)
      sayesinde "Hello John" yazısı Just kutusunun içine konularak döndürülür


      . Monad'ların büyüklüğü sadece null (Nothing) kontrolü yapmalarında
      değildir. Veritabanı veya dosya okuma (I/O) gibi tamamen yan etkili
      (impure/side-effect) işlemleri bile saf (pure) fonksiyonel dünyanın içinde
      "Monad kutularına" hapsederek güvenle kullanabilmemizi sağlarlar

      .

      Bu bölümün özü: Fonksiyonel programlamada Currying ve Kısmi Uygulama ile
      fonksiyonlarımızı lego parçaları gibi modülerleştirirken; Functor,
      Applicative ve Monad üçlüsü sayesinde yan etkilere, boş değerlere (null)
      ve hatalara karşı kendi güvenli "bağlam (context) kutularımızı" inşa
      edebiliriz. Özellikle Monad'lar, normal değerler alıp kutulu veri dönen
      fonksiyonları, hata durumlarında tüm zinciri otomatik olarak kıracak
      şekilde harika bir zarafetle (do notasyonu ile) birbirine bağlamamızı
      sağlar.
  - baslik: Parça B · Kod Mimarisi ve Doğrulama (Bölüm 4-5)
    icerik: >-
      Harika bir tercih! Kahvelerimiz taze, zihnimiz açıkken yazılım
      mühendisliğinin en derin ama bir o kadar da pratik konularına, Parça B:
      Kod Mimarisi ve Doğrulama bölümüne geçiş yapıyoruz. Yazar Teiva
      Harsanyi’nin "The Coder Cafe" kitabında vurguladığı gibi, sadece çalışan
      kod yazmak yetmez; o kodun zaman içindeki yolculuğunda (bakım, test,
      okunabilirlik) hayatta kalabilmesi gerekir

      .

      Görevin kurallarına harfiyen uyarak, bu bölümlerdeki hiçbir fikri,
      anekdotu veya örneği atlamadan, adım adım ve sohbet havasında yeniden
      anlatıyorum. Başlıyoruz!

      4.1 Erken Soyutlamalar (Premature Abstractions)

      Kod yazarken hepimizin aklında o sihirli kelime yankılanır: Soyutlama
      (Abstraction). İster arayüzler (interfaces) olsun, ister modüller veya
      fonksiyonlar olsun; soyutlama, karmaşık uygulama detaylarını gizleyerek
      bize sadece gerekli özellikleri sunan basitleştirilmiş bir temsildir

      . Ancak yazar, hepimizin çok iyi bildiği bir tuzağa dikkat çekiyor.

      Eminim Donald Knuth'un o meşhur sözünü duymuşsundur: "Erken optimizasyon
      (premature optimization) bütün kötülüklerin anasıdır"

      . İnsanlar, kodun performansını hiç kritik olmayan %97'lik kısımlarda
      optimize etmek için devasa zaman harcarlar ve bu durum kodun bakımını
      felakete sürükler

      . Yazar, bu sözün çok doğru olduğunu kabul etse de, günümüz kod
      tabanlarında çok daha yıkıcı bir problem olduğunu iddia ediyor: Erken
      Soyutlamalar (Premature Abstractions)

      .

      Kitaptaki o harika "Çan Eğrisi (Bell Curve)" memini gözünün önüne getir:
      Sol tarafta "basit kod" yazan bir Junior, ortada "Her yerde soyutlamalar
      olmalı!" diye ağlayan bir Mid-level (orta seviye) geliştirici ve sağ
      tarafta yine "basit kod" yazan bilge bir Senior

      . Neden ortadaki grup bu kadar acı çekiyor? Çünkü varsayımlar
      (conjectures) üzerine, yani henüz elimizde tam kanıtlar yokken geleceği
      tahmin ederek kod yazıyorlar

      . "Gelecekte X'i yapmamız gerekebilir, o yüzden Y fonksiyonunu yeterince
      jenerik (esnek) yapalım" veya "Gelecekteki olası ihtiyaçları karşılayacak
      jenerik bir veri yapısı tasarlayalım" düşüncesi, bu tuzağın temelidir

      .

      Yazar burada kendi acı tecrübesini paylaşıyor: Eski şirketinde, gelecekte
      "kesin gelir" diye bekledikleri ihtiyaçlar için kod tabanını yeterince
      jenerik hale getirmek uğruna koca bir sprint'i (haftalarca süren emeği)
      feda etmişler. Sonuç mu? O beklenen ihtiyaçlar hiçbir zaman gelmemiş

      . Bu, geliştirme süresinin ve eforunun devasa bir israfıdır. Elbette tüm
      jenerik çözümler veya soyutlamalar kötü değildir; ancak biz mühendislerin
      işleri "çok erkenden" karmaşıklaştırma gibi bir huyu vardır

      . Kural basit: İhtiyacın olduğunu "tahmin ettiğin" zaman değil, o özelliğe
      "gerçekten ihtiyacın olduğu" zaman o soyutlamayı yap

      .

      Bu bölümün özü: İhtiyacımız olmayan özellikleri gelecekte lazım olur
      varsayımıyla koda eklemek (erken soyutlama), sistemi gereksiz yere
      karmaşıklaştırır ve geliştirme hızını düşürür. Kodumuzu her zaman bugünün
      gerçek ihtiyaçlarına göre, en basit haliyle tasarlamalıyız.

      4.2 YAGNI ve Ürün Fikirlerine Odaklanmak

      Eğer erken soyutlama bir hastalıksa, bunun en bilinen ilacı YAGNI (You
      Aren't Gonna Need It - Buna İhtiyacın Olmayacak) prensibidir

      . YAGNI, hipotetik (varsayımsal) gelecekteki gereksinimlere dayanarak koda
      işlevsellik eklememizi yasaklar

      . Neden mi? Çünkü yazılım mühendisliği araştırmalarına göre, bir yazılımın
      toplam maliyetinin %40 ila %80'i "bakım" (maintenance) aşamasında harcanır

      . Olmayan bir özellik için yazdığın kodu ömür boyu taşımak, test etmek ve
      bakımını yapmak zorundasın.

      YAGNI prensibini uygulamanın iki devasa faydası vardır:

      Azaltılmış Karmaşıklık (Reduced complexity): Gereksiz özellikleri silmek,
      kod tabanını çok daha sade tutar

      .

      Daha İyi Çeviklik (Better agility): Karmaşıklığı dizginlenmiş bir kod,
      değişen müşteri gereksinimlerine çok daha hızlı adapte olur

      .

      Peki kodumuzun YAGNI'yi ihlal ettiğini nasıl anlarız? Yazar bize 5 adet
      "kötü koku" (smell) veriyor:

      Basit bir uygulama yetecekken aşırı soyutlanmış sınıflar (Overly
      abstracted code)

      .

      Hiç gereği yokken kullanılan jenerik (generic) tipler

      .

      Mevcut durumda istenmeyen ama "belki lazım olur" diye eklenen özellikler

      .

      Üretimde (production) hiç kullanılmayan veya sadece testler geçsin diye
      yazılmış ölü kodlar

      .

      Performansa zerre etkisi olmayan yerlerde yapılan yersiz optimizasyonlar

      .

      Ancak her kural gibi YAGNI'nin de bir sınırı var. Uzun vadeli mimari
      kararlar alırken, aşırı kullanıcı büyümesi (growth) beklenirken veya yasal
      uyumluluk (regulatory compliance) gibi konularda ileriye dönük planlama
      yapmak şarttır

      . İşte tam burada, YAGNI'yi esnetmeden sistemi geleceğe hazırlamanın bir
      yolu olarak yazar "Gereksinimlere (Requirements) Değil, Ürün Fikirlerine
      (Product Ideas) Odaklanmayı" öneriyor

      .

      Diyelim ki Starbucks'ın ilk online sipariş sistemini yazan bir Java
      mühendisisin. Müşteri senden "kahve teslimatı" yapmanı istedi. Gidip şöyle
      bir interface yazdın

      : public void deliverCoffee(List<Coffee> coffees); Harika, çalışıyor. Peki
      yarın Starbucks "Biz artık kahvenin yanında yiyecek de teslim edeceğiz"
      derse ne olacak? Gidip şu metodu mu ekleyeceksin

      ,

      ? public void deliverCoffeeAndFood(List<Coffee> coffees, List<Food>
      foods); Sonra çay, meyve suyu, kupa bardak eklendiğinde bu interface
      yüzlerce metodla dolup çöpe dönecek

      . Sorun neydi? Sorun, bize verilen dar "gereksinime" (sadece kahve
      teslimatı) körü körüne bağlı kalıp, ürünün "ana fikrini" kaçırmamızdı

      . Starbucks ne yapmak istiyor? "Teslimat (Delivery)" yapmak istiyor

      . Bunun yerine domain (iş alanı) objelerini kullanarak şöyle bir yapı
      kursaydık: public void deliver(DeliveryList items);
       İşte bu! DeliveryList objesi domain'i temsil eder ve gelecekte ne eklenirse eklensin ana kodumuz değişmez
      . YAGNI'yi katı bir şekilde ihlal etmedik, sadece sistemi "ürün fikri"
      etrafında modelleyerek gelecekteki değişikliklere karşı esnek hale
      getirdik

      .

      Bu bölümün özü: İhtiyacın olmayan kodu "ileride lazım olur" diye yazmak
      bakım maliyetlerini patlatır (YAGNI). Ancak sistemi günübirlik dar
      gereksinimlere göre değil, ürünün asıl varoluş amacına (domain) göre
      genelleştirmek, YAGNI'yi ihlal etmeden esneklik kazanmanın en zeki
      yoludur.

      4.4 Bilişsel Yük (Cognitive Load)

      Bir koda baktığında beyninin "yanıyormuş" gibi hissettiği oldu mu? İşte
      bunun teknik bir adı var: Bilişsel Yük (Cognitive Load)

      . Bilişsel yük, bir kodun ne yaptığını anlamak, yeni bir özellik eklemek
      veya bir hatayı çözmek için harcamamız gereken zihinsel çabadır

      . Yazar bunu ikiye ayırıyor:

      İçsel (Intrinsic) Yük: Çözmeye çalıştığın problemin doğasından gelen
      zorluktur. Mesela çok karmaşık kuralları olan bir bankacılık domaininde
      çalışıyorsan, bu iş zaten zordur. Domaini basitleştiremezsin, bu yük
      kaçınılmazdır

      .

      Dışsal (Extraneous) Yük: Bilginin nasıl sunulduğundan kaynaklanan,
      problemle doğrudan ilgisi olmayan yüktür

      . İğrenç tasarlanmış bir API veya isimlendirmeleri berbat bir kod
      okuyorsan, domain ne kadar basit olursa olsun beynin yorulur

      .

      Bir makine olmadığımızı unutmamalıyız. İnsan beyninin "çalışan belleği
      (working memory)" son derece sınırlıdır. 20 satırlık basit bir fonksiyonu
      bile birebir aynı değişken isimleriyle ezberden kağıda yazmaya çalış, ne
      kadar zor olduğunu göreceksin

      . Bu yüzden mühendis olarak asıl işimiz, kaçınılmaz olan içsel yükle
      savaşmak değil; dışsal bilişsel yükü en aza indirmektir

      . Herhangi bir işi olabildiğince doğrudan (straightforward) hale
      getirmeliyiz

      .

      Peki bu yükü nasıl yöneteceğiz? Yazar 5 strateji sunuyor

      :

      Kod Karmaşıklığı: İç içe geçmiş (nested) kodu azalt, if/else'leri
      basitleştir, kalıtım (inheritance) seviyelerini sığ tut

      .

      Soyutlamalar (Abstractions): Koda zerre faydası olmayan, sadece
      karmaşıklık yaratan erken soyutlamalardan kaçın

      .

      Dokümantasyon: README dosyaları, yorum satırları ve hatta yazılan testler
      (evet, testler de yaşayan dokümantasyondur!) güncel ve temiz olsun

      .

      İletişim: Takım içi iletişim net olmalı. Yanlış anlaşılmalar ve eksik
      tasarımlar beyni en çok yoran şeydir

      .

      Bağlam Değiştirme (Context Switching): Kod yazarken sürekli toplantıya
      girmek, bir yandan kod incelemesi (code review) yapmak veya debug yapmak
      zihni tüketir. Eğer sürekli bağlam değiştiriyorsan yöneticinle konuşup
      bunu çözmelisin

      .

      Bizim sorumluluğumuz "Domain çok zor abi, kod ondan karmaşık" bahanesine
      sığınmak değil, dışsal yükleri hafifleterek o zor domaini bile anlaşılır
      kılmaktır

      .

      Bu bölümün özü: İnsan beyninin anlık hafıza kapasitesi sınırlıdır, bu
      yüzden okuyucuyu asıl iş mantığı dışındaki kötü tasarımlarla ve dağınık
      yapılarla (dışsal yük) yormamak gerekir. Yazılım mühendisinin temel
      görevi, kendi kodunu başkaları (ve gelecekteki kendisi) için en düşük
      zihinsel eforla anlaşılır hale getirmektir.

      4.5, 4.6 ve 4.7 Okunabilirlik, İfadeleri Sadeleştirmek ve İç İçe Kodlar
      (Readability & Code Structures)

      İşte en çok kavga edilen konuya geldik: "Bu kod okunabilir değil!"

      . Pull Request'lerde bunu ne kadar çok gördüğümüzü biliyorsun. Clean Code
      kitabının o meşhur sözünü hatırlayalım: "Kodunuzu okunabilir yapmak, onu
      çalıştırılabilir yapmak kadar önemlidir."

      . Peki ama "okunabilir" ne demek?

      Yazarın mükemmel tanımına göre okunabilirlik; okuyucunun kodun niyetini
      (ne yapmaya çalıştığını - what), gerekçesini (bunu neden böyle yaptığını -
      why) ve mantığını (nasıl çalıştığını - how) ne kadar kolay
      anlayabildiğiyle ölçülür

      . Özellikle "neden (rationale)" kısmı çok kritiktir. Çoğu kodda yazarın o
      mimariyi "neden" öyle seçtiğini asla anlayamayız

      .

      Bunu sağlamanın prensipleri şunlardır

      :

      İlgili soyutlamalar ve mantıklı isimlendirmeler (Naming things is hard!)

      .

      Görsel estetik: Kodun paragraf paragraf, iç içe geçmeden hizalanması

      .

      Yorumlar (Comments): Kodun ne yaptığını (what) değil, koddan anlaşılamayan
      niyet ve gerekçeyi (intent/rationale) anlatmalıdır

      .

      Zekice (clever) yazılmış janjanlı kod değil, açık ve dilin standartlarına
      uygun (idiomatic) "ortalama" kod yazmak

      .

      Tüm kod tabanında tutarlılık (consistency)

      .

      Kendi yazdığın kod sana hep "okunabilir" gelir. O yüzden kod incelemeleri
      (code reviews) şarttır. Google'da her dil için özel bir "readability
      badge" (okunabilirlik rozeti) olan mühendisler vardır ve 5 satırdan büyük
      her kod değişikliğinde bu taze, ön yargısız gözlerin onayı şarttır

      . Performans gerektiren kritik yerlerde okunabilirlikten bazen feragat
      edilebilir, ama denge şarttır

      . Hatta yazarın bir ipucu var: Bazen IDE'yi uzaklaştırıp (zoom out) koda
      dışarıdan "şekil" olarak bakmak bile kodun ne kadar dağınık olduğunu
      gösterebilir

      .

      Karmaşık if İfadeleri (Complex IF Statements): Diyelim ki bir kahve
      dükkanının bildirim sistemine bakıyorsun. Karşına şöyle bir kod çıktı

      :

      if ((((notification.orderID == orderID) || (notification.customerID ==
      customerID) || ... ) && (isAdmin || ...)) {
          send(notification);
      }


      Okuması işkence, değil mi

      ? Bunu çözmenin ilk adımı, o upuzun koşulları anlamlı boolean değişkenlere
      atamaktır

      : boolean orderMatches = notification.orderID == orderID; boolean
      customerMatches = notification.customerID == customerID; vb. Böylece
      zihinsel yük inanılmaz azalır

      . Ancak bu 7 satırlık değişken yığını kodun ortasında duruyorsa,
      okuyucunun dikkatini dağıtır

      . İkinci ve asıl adım, bu mantığı tek bir amaca hizmet eden (bildirim
      kullanıcıyla eşleşiyor mu?) ayrı bir fonksiyona (notificationMatchesUser)
      taşımaktır

      ,

      . Kural şu: İçinde iki veya daha fazla && veya || barındıran her if
      koşulu, sadeleştirilmeye muhtaçtır

      .

      İç İçe Kodlar (Nested Code): Eğer bir if veya for bloğunun içine başka bir
      if, onun içine başka bir if daha atarsan o kod çekilmez hale gelir

      . Yazarın Go dilinde verdiği örneğe bakalım: Bir join(s1, s2, max)
      fonksiyonu. s1 boşsa hata dön, değilse s2 boşsa hata dön, değilse
      concatenate yap, hata varsa dön, hata yoksa max'ı geçip geçmediğine bak...
      Sürekli sağa doğru kayan "ok ucu" (arrow) şeklinde bir kod

      ,

      .

      Bunun panzehiri, "Mutlu Yolu Sola Hizalamaktır (Align the happy path to
      the left)" (Mat Ryer)

      . Yani edge case'leri (uç durumları) ve hataları anında if (hata) return;
      şeklinde aradan çıkar

      . Böylece fonksiyonun asıl iş yaptığı "mutlu yol" (happy path) dümdüz,
      hizalı bir sütun olarak kalır; hatalar ise yan tarafta bağımsız bir sütun
      gibi durur

      . Ne kadar az iç içelik (nesting), o kadar yüksek okunabilirlik!

      .

      Bu bölümün özü: Okunabilir kod; zekice numaralarla (cleverness) değil,
      açık niyetle ve tutarlılıkla yazılmış koddur. Karmaşık koşulları
      fonksiyonlara taşıyıp, iç içe geçmiş (nested) yapıları "erken dönüşler
      (early returns)" ile düzleştirerek kodun hem "mutlu yolunu" hem de uç
      durumlarını bir bakışta anlaşılır hale getirmeliyiz.

      4.8 ve 4.9 Uyum (Cohesion) ve Bağlılık (Coupling)

      Yazılım mimarisinin en ayrılmaz ikilisine (Yin ve Yang'ına) geldik.

      Uyum (Cohesion) Uyum, bir yapı taşı (sınıf, modül veya fonksiyon) içindeki
      elemanların birbirine "ne kadar ait olduğunu" (belong together) ölçer

      . Günlük hayattan müthiş bir analojiyle anlatalım: Yatak odası. Eğer bir
      yatak odasına yatak, çatal-bıçak dolabı ve şampuan koyarsan, bu
      elemanların hiçbirbiri aynı amaca hizmet etmez (biri uyumak, biri yemek
      yemek, biri yıkanmak için). İşte bu düşük uyumdur (low cohesion)

      . Ama odaya yatak, gardırop ve çalar saat koyarsan, hepsi "dinlenmek ve
      sabah hazırlanmak" ortak amacına hizmet eder. Bu yüksek uyumdur (high
      cohesion)

      .

      Yazılımda da bir sınıfın tüm metodları tek bir sorumluluğa (single
      intention) odaklanmalıdır

      . Yüksek uyum; kodu okunabilir, bakımı kolay, test edilebilir ve yeniden
      kullanılabilir kılar

      . Eğer sisteminde şu kokular (smells) varsa uyumun düşüktür:

      Shotgun Surgery (Pompalı Tüfek Cerrahisi): Bir davranışı değiştirmek için
      sistemin bambaşka 5 yerindeki sınıfları da değiştirmen gerekiyorsa, o
      davranışa ait elemanlar bir araya getirilmemiştir

      .

      God Object (Tanrı Objesi): Her şeyi bilen, her şeyi yapan, devasa
      sorumlulukları olan obez sınıflardır

      .

      Middle Man (Aracı): Hiçbir değer katmadan sadece bir isteği alıp başka bir
      sınıfa paslayan gereksiz sınıflardır

      .

      Uyumun da seviyeleri vardır

      -

      . En mükemmeli Fonksiyonel (Functional) uyumdur; CoffeeOrder sınıfının
      sadece sipariş ekleme, çıkarma ve hesaplama metodlarını (tek bir görevi
      yerine getirmek için) içermesi gibi

      . Ardından sırasıyla; Çıktının diğerinin girdisi olduğu Sıralı
      (Sequential), Aynı veri üzerinde çalışan İletişimsel (Communicational),
      aynı işlemleri yapsa da sıra gerektirmeyen Prosedürel, sadece sistem
      başlarken beraber çalıştıkları için yan yana konan Zamansal (Temporal),
      sırf aynı kategorideler diye yan yana konan Mantıksal (Logical - Utility
      sınıfları gibi) uyum gelir. En kötüsü ise metodların tamamen rastgele aynı
      sınıfa tıkıştırıldığı Tesadüfi (Coincidental) uyumdur

      ,

      .

      Bağlılık (Coupling) Bağlılık ise, iki farklı bileşenin (component)
      birbirine ne kadar muhtaç olduğuyla ilgilidir

      . Evinin su tesisatını düşün (plumbing analojisi). Tuvaletin sifonunu
      çektiğinde, ikisi de aynı su hattına çok sıkı bağlıysa (tight coupling),
      duştaki su aniden soğur veya buz gibi olur

      . Ama doğru tasarlanmış, gevşek bağlı (loosely coupled) bir sistemde,
      sifon çekildiğinde duşta sadece çok hafif ve tolere edilebilir bir basınç
      düşüşü olur, sıcaklık değişmez

      .

      Gevşek bağlılığın sırrı, iki bileşenin birbirinin "iç yapısı" hakkında en
      az varsayımda bulunmasıdır (reducing assumptions)

      . Sıkı bağlı sistemlerin bakımı kabustur (biri değişince diğeri bozulur),
      anlaması çok daha zordur ve test etmesi (mock'lama gerektirdiği için) tam
      bir eziyettir

      ,

      .

      Uyum ve Bağlılık birbirine dik (orthogonal) kavramlar değildir

      . Yüksek uyum, genellikle düşük bağlılık getirir. Çünkü kendi işine
      odaklanan (single responsibility) bir sınıf, diğer sınıflarla daha az
      iletişim kurar

      . Shotgun Surgery veya God Object gibi uyumsuzluk kokuları, aslında
      sistemin sıkı bağlı (tight coupling) olduğunun da göstergesidir

      . Bağlılık türleri

      -

      :

      İçerik (Content) Bağlılığı: Bir sınıfın diğerinin özel (private) verisini
      doğrudan değiştirmesi.

      Ortak (Common) Bağlılık: Birden fazla bileşenin aynı global değişkeni
      kullanması.

      Kontrol (Control) Bağlılığı: Bir bileşenin diğerine ne yapması gerektiğini
      "flag" (bayrak) parametrelerle dikte etmesi.

      Damga (Stamp) Bağlılığı: Sadece küçük bir kısmı kullanılacakken devasa bir
      veri yapısının (struct) bütünüyle diğer bileşene geçirilmesi.

      Zamansal (Temporal) Bağlılık: Bir servisin çalışması için diğerinin aynı
      anda ayakta (senkron) olmasının zorunlu olması.

      Bu bölümün özü: Sağlıklı bir yazılım mimarisinin altın kuralı "Yüksek Uyum
      (High Cohesion)" ve "Gevşek Bağlılık (Loose Coupling)" tır. Kod
      parçalarımız kendi içinde tek bir amaca kilitlenmiş, birbirleriyle olan
      ilişkilerinde ise karşılıklı iç yapı varsayımlarından olabildiğince
      arındırılmış olmalıdır.

      4.10 ve 4.11 "Tidy First?" (Önce Toparla) ve Kodun Güzelliği

      Hepimiz o durumu yaşadık: Sprint planlamasında yöneticiye gidip "Benim 2
      hafta boyunca eski kodları refactor etmem lazım" demek büyük bir cesaret
      ister, genelde de reddedilir

      . Kent Beck'in yazdığı "Tidy First?" kitabı tam da bu acıya merhem oluyor.
      Kitap diyor ki: "Refactoring" kelimesi artık "yeni özellik geliştirmeyi
      uzun süre durduran devasa molalar" anlamına geldiği için itibarını
      kaybetti

      . Bunun yerine, kimsenin itiraz edemeyeceği kadar küçük, sevimli (cute,
      fuzzy) "Toparlamalar (Tidying)" yapmalıyız

      .

      Tidying (Toparlama), bir kod tabanında anlık ve küçük müdahalelerle
      kaliteyi artırmaktır. Yazarın bu kitaptan çıkardığı temel dersler şunlar:

      Simetrileri Normalleştirmek: Kod tabanları organik olarak büyür. Zamanla
      aynı sorun, 5 farklı geliştirici tarafından 5 farklı şekilde çözülmüş
      olabilir. Bir koda bakıp okuyucunun kafasının karışmaması için "Birini seç
      ve her yerde onu kullan" kuralı geçerlidir

      . İsimlendirmede bile (örneğin bir yerde "cfg", diğer yerde "config"
      yazmak) tutarlı olmak zorundasın. Tutarlılık (consistency) her şeydir!

      .

      Okuma Sırası (Reading Order): Dosyadaki kodu, okuyucunun mantıksal olarak
      en çok ihtiyaç duyacağı sırayla diz. Mesela Java'da "önce statik metodlar
      gelir" gibi katı kurallar yerine, birbiriyle eşleşen (coupled) ve beraber
      okunan metodları yan yana koy

      ,

      .

      Açıklayıcı Değişkenler: Sırf "bir kez kullanılıyor" diye upuzun karmaşık
      mantıkları tek satıra gömme. O mantığı x := // uzun ifade şeklinde,
      niyetini anlatan değişkenlere ata. Değişkenler sadece "yeniden kullanım"
      için değil, "açıklık" için de vardır

      ,

      .

      İfadeleri Gruplama (Chunk Statements): Temiz kod (Clean Code) kitapları
      her şeyi bölüp milyonlarca küçük fonksiyona ayırmayı över. Ama bu her
      zaman pratik değildir. Kent Beck'in harika çözümü: "Bu kod bloğu veriyi
      alıyor, şurası işliyor." O zaman aralarına sadece boş bir satır (blank
      line) koy! Kod, tıpkı düz bir metin gibi tek bir fikre odaklanan
      paragraflardan oluşmalıdır

      ,

      .

      Açıklayıcı Yorumlar: Yorum satırını, kodu yazmadan 15 dakika önceki haline
      veya gelecekteki okuyucuya "Keşke bunu bilseydim" diyeceğin o kritik,
      koddan çıkarılamayan detaylar için yaz

      .

      Peki Kodun Güzel Olması Ne Demektir? (Bölüm 4.11) Bir kodun güzel olması
      için zekice algoritmalarla dolu olması veya son teknoloji örüntüler
      içermesi mi gerekir? Yazar bu soruya beklenmedik bir cevap veriyor: "Güzel
      kod, 'ortalama (average)' koddur."
       Beynimiz bir desen eşleştirme (pattern-making) makinesidir
      . Daha önce gördüğü ve tanıdığı yapılara enerji harcamadan uyum sağlar.
      Standart isimlendirme kullanan, dilin deyimlerine (idioms) sadık kalan,
      zekice oyunlar yerine netliği seçen ve sürpriz barındırmayan kod,
      okuyucuya bir yük bindirmez

      . Dolayısıyla, yazılım dünyasında "Ne kadar parlak bir Pull Request!"
      demek yerine, verilebilecek en büyük iltifat aslında "Ne kadar ortalama
      bir Pull Request!" demektir

      .

      Bu bölümün özü: Devasa ve yıkıcı refactor oturumları yerine, kodumuzu
      küçük adımlarla (boşluk bırakmak, değişken ismi değiştirmek, birbirine
      bağlı mantıkları yan yana koymak) sürekli toparlamalıyız (tidying). En
      güzel ve sürdürülebilir kod; sürprizlerden uzak, standartlara uyan ve
      okuyucuyu şaşırtmayan "ortalama" koddur.

      4.12 Organik Büyümeye Karşı Kontrollü Büyüme (Organic vs. Controlled
      Growth)

      Japonların Samuray felsefesi Bushido, tek bir kişinin icadı değildir; yüz
      yıllar boyunca insanların deneyimleriyle "organik" olarak büyümüş ve
      şekillenmiştir

      . Birçok kod tabanı da böyledir. Geliştiriciler gelir, gider, herkes kendi
      vizyonunu katar ve yıllar içinde binlerce küçük değişikliğin yığılmasıyla
      sistem organik olarak büyür

      ,

      .

      Yazar X (eski Twitter) üzerinden bir anket yaptığında geliştiricilerin
      %100'ü "Organik Büyüme"yi iyi bir şey olarak oylamış

      . Ancak yazar buna katılmıyor ve harika bir Bahçe (Garden) analojisi
      yapıyor: Organik büyüme, herkesin istediği bitkiyi istediği yere ektiği,
      rengarenk ama karmakarışık, plansız bir kamu bahçesine benzer
      (fotoğraftaki yabani bahçe)

      . Belli bir vizyonu ve tasarımı yoktur

      . Oysa Kontrollü Büyüme (Controlled Growth); nereye neyin ekileceğine
      karar verilen, sürekli yabani otların temizlendiği, bakımlı ve uyumlu bir
      Japon bahçesi gibidir

      ,

      .

      Organik büyüme teknik borçları halı altına süpürürken, Kontrollü büyüme şu
      5 kuralla uygulanır

      :

      Tutarlı Olun: Kod standartlarına ve yazılı olmayan kurallara uyun. Orada X
      yazıyorsa gidip "cowboy"luk yapıp Y yazmayın

      .

      Büyük Değişiklikleri Önceden Planlayın: Büyük özellikleri (features) tek
      seferde kaos yaratarak değil, "Tasarım Dokümanları" (Design docs) ile
      takımla tartışarak küçük fazlara bölün

      .

      Retrospektifler Yapın: Büyük işlerden sonra "Ne iyi gitti, neyi daha iyi
      yaparız?" diyerek sürekli iyileşme (Kaizen) kültürünü besleyin

      .

      İzci Kuralını (Boy Scout Rule) Uygulayın: Kamp alanını bulduğundan daha
      temiz bırak! Bir Pull Request açtığında, geçerken bir iki değişken ismini
      düzeltmekten, ölü bir kodu silmekten zarar gelmez

      .

      Takım İçi Sahiplenme: Kontrollü büyüme sadece Tech Lead'in değil,
      psikolojik güvenliğin (psychological safety) olduğu bir ortamda herkesin
      sorumluluğudur

      ,

      .

      Bu bölümün özü: Kod tabanının gelişigüzel, anlık yamalar ve herkesin kendi
      tarzıyla (organik) büyümesi uzun vadede sistemi kaosa sürükler. Bunun
      yerine; ortak standartların uygulandığı, değişikliklerin önceden
      planlandığı ve her kod dokunuşunda sistemin biraz daha temizlendiği (İzci
      kuralı) "kontrollü büyüme" yaklaşımı benimsenmelidir.

      5.1 Test Temelleri (Testing Fundamentals)

      Şimdi yazılım mühendisliğinin en tartışmalı ve en çok baş ağrıtan
      konularından birine, testlere (Bölüm 5) geçiyoruz

      .

      Testlerde Mantık (Logic) Kullanmaktan Kaçınmak Kodlarımızı test ederken
      düştüğümüz en büyük tuzaklardan biri, fonksiyonun içine yazdığımız
      mantığın aynısını testin içine de yazmaktır

      . Diyelim ki bir ürün listesindeki fiyatlara indirim uygulayıp ne kadar
      "tasarruf" (economy) ettiğimizi hesaplayan bir Go fonksiyonumuz var

      :

      func economy(prices []float64, discountPercentage float64) float64 {
          var total float64
          for _, price := range prices {
              total += price * (-discountPercentage / 100) // DİKKAT: EKSİ İŞARETİ VAR
          }
          return total
      }


      Bunu test etmek istedin ve testin içinde de aynı for döngüsünü kurup,
      price * (-discountPercentage / 100) mantığıyla bir "beklenen değer
      (expectedEconomy)" hesaplattın

      . Test yemyeşil geçti, her şey harika! ✅ Ta ki kodu canlıya (production)
      çıkana kadar

      . Canlıda müşteri tasarrufunu bir anda eksi değer (-17.5) olarak gördü

      . Çünkü ana kodda, tasarrufu hesaplarken yanlışlıkla negatif (-) bir
      çarpan eklemiştin! Peki test bunu neden yakalamadı? Çünkü testin içine de
      aynı kusurlu mantığı kopyalamıştın! Testteki hesaplama da eksi ürettiği
      için birbirini doğruladılar

      .

      Testlerin amacı kodu tekrar yazmak değildir. Çözüm çok basit: Beklenen
      değerleri (expected results) her zaman elle (hardcoded) yazın

      ,

      . Evet, döngüler kurup dinamik hesaplama yapmaktan daha "ilkel"
      görünebilir ama test okuyucusuna zihinsel bir işlem (mental computation)
      yaptırmamış olursun ve kodda bir hata varsa hardcoded olan 17.5 değeri,
      koddan gelen -17.5 ile çatışarak anında hatayı yakalar

      ,

      .

      Kod Kapsamı (Code Coverage) Yanılgısı Testlerimizin kalitesini nasıl
      ölçeceğiz? Endüstrinin standart metriği "Satır Kapsamı"dır (Line Coverage)

      . Yazarın eski bir meslektaşının dediği gibi: "Kod kapsamıyla ilgili en
      önemli şey, onun var olmasıdır."

      . Ancak, %100 kapsama sahip olmak kodunda bug olmadığı anlamına gelmez,
      sadece o satırların test sırasında "çalıştırıldığını (executed)" gösterir

      .

      Google'ın yaklaşımı şudur: Kapsamı artırmak, hata oranlarını düşürür

      . Ancak bunu katı bir zorunluluğa (örn: "%80 altı kod merge edilemez")
      dönüştürmek felakettir

      . Neden mi? Goodhart Kanunu der ki: "Bir ölçüm, hedef haline geldiğinde,
      iyi bir ölçüm olmaktan çıkar."

      . Geliştiriciler sadece kutucuğa tik atmak ve %80'i tutturmak için zerre
      mantığı olmayan anlamsız testler yazmaya başlarlar

      . Google'da katı bir limit yoktur; %60 kabul edilebilir, %75 övgüye değer,
      %90 ise örnek teşkil edici (exemplary) olarak görülür

      . Ayrıca %90'dan %95'e çıkmak, %55'ten %60'a çıkmaktan fersah fersah daha
      zordur ve maliyetlidir (non-linear efor)

      . Bu yüzden her şey sağduyu ve kod incelemelerindeki yorumlarla (judgment)
      yönetilmelidir

      .

      Satır Kapsamı (Line Coverage) vs. Dal Kapsamı (Branch Coverage) Bazen %100
      satır kapsamanız olsa bile kodunuz çökebilir. Neden mi? Şu Java koduna
      bakalım

      :

      public int getNameLength(boolean isCoolUser) {
          User user = null;
          if (isCoolUser) {
              user = new John();
          }
          return user.getName().length();
      }


      Testini isCoolUser = true ile yazarsan, kod bloğunun içindeki her satır
      çalışır ve kapsama %100 olur

      . Fakat canlıda bu fonksiyona false gelirse ne olur? if bloğu çalışmaz,
      user null kalır ve user.getName() satırında Null Pointer Exception yersin

      . İşte "Dal Kapsamı (Branch Coverage)" burada devreye girer. Dal kapsamı,
      if koşullarının hem true hem de false senaryolarının test edilip
      edilmediğine bakar

      . Bu örnekte satır kapsamı %100 iken dal kapsamı %50'dir ve sana tehlikeyi
      haber verir

      .

      Bu bölümün özü: Testlerinizin içine ana koddaki matematiksel veya
      mantıksal işlemleri kopyalamayın; beklenen sonuçları her zaman statik
      (hardcoded) verin. %100 kod kapsamı kusursuzluk demek değildir; kapsamı
      körü körüne bir zorunluluk (hedef) haline getirmek yerine, sadece
      satırları değil, dalları (branch) ve uç durumları da kapsayan anlamlı
      testler yazmaya odaklanılmalıdır.

      5.2 Özellik Bazlı Testler (Property-Based Testing)

      Geleneksel testlerin mantığını hepimiz biliyoruz: Bir başlangıç durumu
      tanımla, belirli girdiler (inputs) ver, sistemden çıkan çıktıyı (output)
      beklentinle (assertions) karşılaştır

      ,

      . Bu yöntem on yıllardır çalışıyor ama bazı çok ciddi sınırları var

      .

      Bunu anlamak için yazar harika bir görsel benzetme yapıyor. Sistemini
      devasa beyaz bir kare kutu olarak düşün. Bu kutunun üst tarafı yeşil
      (yazılımın doğru ve beklenen davranışları), alt tarafı ise kırmızıdır
      (hata barındıran, invalid davranışlar/buglar)

      . Sen geleneksel testler yazdığında aslında bu kutunun üstüne üç farklı
      test seti (A, B, C) yerleştirirsin

      ,

      :

      Test Set A: Yeşil alanın belli bir kısmını kaplar (örneğin %50). Bunlar
      düzgün çalışan, doğru özellikleri test eden faydalı testlerdir

      . Ancak yeşil alanda test edilmemiş devasa bir boşluk kalır, burası
      gelecekte regresyon (bozulma) yaşarsa ruhun duymaz (Test coverage gaps)

      .

      Test Set B: Sistemin hata fırlatmasını (kırmızı alanı) beklediğin yerleri
      test eder. Ancak bu test senin kendi yazdığın kusurlu bir mantığa
      dayandığı için (False negative) bazı kırmızı alanların üstünü örtemez.
      Yani bug vardır ama test bunu yakalayamaz (Flawed tests hiding bugs)

      ,

      . Bu en tehlikelisidir çünkü sana sahte bir güven (false sense of
      security) verir

      .

      Test Set C: Sistemin tamamen dışında (kutunun dışında) durur. Ürün
      sahibini yanlış anladığın için aslında sistemde hiç var olmayan bir
      özelliği test edersin

      .

      Peki bu sınırları nasıl aşarız? İnsan beyni test senaryolarını "manuel"
      olarak ürettiği için her uç durumu hayal edemez

      . İşte burada sahneye Property-Based Testing (PBT - Özellik Bazlı Testler)
      çıkıyor

      .

      PBT, "Şu spesifik girdiyi verirsem şu çıktıyı alırım" demek yerine; "Girdi
      ne kadar rastgele (random) ve mantıksız olursa olsun, sistemin her zaman
      sağlaması gereken 'evrensel kurallar' (properties) nelerdir?" sorusunu
      sorar

      .

      Örneğin, bir String manipülasyon fonksiyonu yazdın. Geleneksel testte
      "Elma" verip sonucunu beklersin. PBT'nin bir alt kümesi olan Fuzzing
      (Bulanıklaştırma) testinde ise sisteme binlerce kez tamamen rastgele,
      devasa, içinde garip semboller olan veriler fırlatırsın

      . Fuzzing'in asıl baktığı kural/özellik (property) şudur: "Ne verirsem
      vereyim, yazılımım çökmemelidir (crash)"

      . PBT ise fuzzing'in bu rastgeleliğini alır ama "çökmemenin" ötesinde
      sistemin iş kurallarının da asla bozulmadığını kontrol eder

      ,

      .

      PBT ile hangi evrensel özellikleri (properties) test edebilirsin?

      Yapısal (Structural): Fonksiyona ne girerse girsin, dönen verinin uzunluğu
      her zaman girenle aynı olmalıdır.

      Idempotency (Etkisizlik): Bir işlemi bir kez yapmakla, üst üste 100 kez
      yapmak her zaman aynı sonucu vermelidir.

      Commutativity (Değişmelilik): A ve B parametrelerinin yerini değiştirsem
      bile (A+B veya B+A) sonuç aynı olmalıdır.

      Roundtrip (Gidiş-Dönüş): Bir veriyi şifreleyip (encode), hemen ardından
      çözersen (decode) her halükarda orijinal veriyi elde etmelisin.

      Hatta PBT sadece birim (unit) seviyesinde kalmaz. Tüm sistemi kapsayan
      devasa kurallar için de kullanılabilir (Going Beyond)

      -

      :

      Zamansal (Temporal): API çağrılarının %99'u 30ms'den kısa sürmelidir

      .

      Uygulama Değişmezleri (Application Invariants): Finansal bir işlemde
      borçlar her zaman alacaklara eşit (debits = credits) olmalıdır

      .

      PBT, geleneksel testlerin yerini almaz, onları tamamlar (complementary
      approach)

      . Geleneksel testler senin öngördüklerini doğrular, PBT ise senin aklına
      bile gelmeyen uç durumları sisteme rastgele enjekte ederek arka plandaki o
      "kutsal kuralların" yıkılıp yıkılmadığını kontrol eder

      ,

      .

      Bu bölümün özü: İnsanlar tarafından kurgulanan geleneksel testler, bizim
      kendi önyargılarımız ve hayal gücümüzle sınırlıdır; bu da sistemde ciddi
      boşluklar ve sahte güven hissi bırakır. Property-Based Testing (PBT),
      sisteme rastgele ve ekstrem veriler göndererek, girdilerden bağımsız
      olarak her koşulda korunması gereken evrensel doğruları (sistemin
      çökmemesi, verinin şifrelenip eksiksiz geri dönmesi vb.) test eden
      mükemmel bir tamamlayıcıdır.

      5.3 Birim Testleri (Unit Tests), Davranış ve TDD Tartışması

      Yazılım geliştirirken en çok direnç gösterilen konulardan biri "Birim
      Testi (Unit Test)" yazmaktır

      . Kod incelemelerinde en çok duyduğumuz o meşhur bahanelere (argümanlara)
      yazarın verdiği sert ama gerçekçi cevaplara bakalım

      -

      :

      "Kod test yazmaya değmeyecek kadar basit." -> En basit kod bile geliştikçe
      karmaşıklaşır. Cidden basitse, testini yazmak zaten 2 dakikanı alır

      .

      "Testleri daha sonra ekleyeceğim." -> Hayır eklemeyeceksin! Kod zihninde
      en tazeyken testi yazmak her zaman daha kolaydır. Testleri bir külfet
      değil, uzun vadeli bir sağlık sigortası olarak gör

      .

      "Test etmek tester'ların (QA) işidir." -> Yazarın eski projesinde tam
      olarak bu yaşanmış. Geliştiriciler sadece özellik geliştirmiş, testleri
      QA'e atmış. Sonuçta QA ekibi geliştirici ekibinden daha büyük hale gelmiş
      ve küçücük bir bug'ı bulmak bile devasa bir eziyete dönüşmüş. Kendi
      kodunun çalıştığından önce sen sorumlusun

      .

      "Entegrasyon testleri nasılsa yakalar." -> Entegrasyon testleri sadece
      mutlu yolu (nominal cases) test eder, her uç durumu bilemez. Üstelik yavaş
      çalışırlar ve hata verdiklerinde sorunun nerede olduğunu bulmak samanlıkta
      iğne aramaktır

      .

      "Bu sadece geçici bir PoC (Kavram Kanıtı), üretime çıkmayacak." -> Geçici
      kodlar her zaman kalıcı olur! Yazar bir keresinde test yazmadığı bir
      PoC'yi aniden canlıya çıkması istendiğinde, testleri eklemeye çalışırken
      kodun aslında çalışmadığını fark edip sıfırdan yazmak zorunda kalmış

      . PoC'de bile en azından temel bir güvenlik ağı şarttır

      .

      İyi bir birim testi nasıl olmalıdır? Yazar bunun 10 özelliğini sayıyor:
      Odaklı (Focused), Anlaşılabilir (Understandable), Bakımı kolay
      (Maintainable), Açıklayıcı hata mesajları veren (Informative), Hızlı
      (Fast), Her çalışmada aynı sonucu veren (Deterministic), Alakasız
      değişikliklerde kırılmayan (Resilient), Birbirinden İzole (Isolated), Dış
      dünyayla bağlantısı olmayan (Local) ve içinde asla sleep beklemeleri
      barındırmayan (Without sleep) testler olmalıdır

      -

      .

      Testler Aynı Zamanda Yaşayan Bir Dokümantasyondur Bir projeye yeni
      katıldın. Sınıfın ne işe yaradığını anlamak için README dosyasına veya
      Confluence'a baktın ama aylar öncesinde kalmışlar (outdated)

      . Oysa testler, kodun kendisiyle birlikte sürekli güncellenmek zorunda
      olan yaşayan dokümantasyonlardır (living documentation)

      ,

      . Bir test fonksiyonunun düzgün verilmiş bir ismi ve atomik (tek bir şeye
      odaklanan) yapısı varsa, kodu okuyan kişi "Haa, demek ki bu fonksiyon bu
      uç durumda bu hatayı fırlatıyormuş" diye anında sistemi öğrenir

      .

      Uygulamayı (Implementation) Değil, Davranışı (Behavior) Test Et İşte
      testlerin sürekli kırılmasına (brittle) yol açan o büyük hataya geldik.
      Diyelim ki müşterilerin cüzdan bakiyelerini (balance) tutan, arka planda
      bunu bir hashmap içinde saklayan bir CustomerBalance sınıfımız var. Bir
      set bir de get metodu var

      .

      Eğer testi şu mantıkla yazarsan:

      set çağır.

      Arka plandaki o "gizli" (private) hashmap'i aç, içine gerçekten 42
      yazılmış mı diye kontrol et. İşte bu Uygulamayı (Implementation) test
      etmektir

      . Sıkı bir bağlılık (tight coupling) yarattın. Neden mi? Yarın öbür gün
      hashmap yerine B-Tree kullanmaya karar verirsen (dışarıdan bakıldığında
      hiçbir şey değişmese bile) senin testin çöp olacak ve patlayacaktır

      .

      Doğrusu şudur: Davranışı (Behavior) test et

      .

      Sınıfın public API'sinden set(foo, 42) çağır.

      Sınıfın yine public API'sinden get(foo) çağır ve dönen değerin 42 olup
      olmadığını kontrol et

      . İçeride ister hashmap kullan, ister B-Tree, ister verileri uzaya
      yollayıp geri al. Davranış (müşterinin parayı verip geri alması)
      değişmediği sürece testin ASLA kırılmaz (Maintainability)

      ,

      . Sadece API'nin dış dünyayla nasıl konuştuğunu test etmek, yeniden
      düzenlemeyi (refactoring) korkusuzca yapabilmeni sağlar

      .

      (Not: Bunu BDD (Behavior-Driven Development) ile karıştırmamak lazım. BDD,
      iş birimleriyle ortak bir dil kullanarak test yazmaktır. Bizim
      bahsettiğimiz ise tamamen teknik bir prensiptir

      .)

      Test-Driven Development (TDD) Üzerine TDD hepimizin duyduğu o meşhur
      Red-Green-Refactor döngüsüdür: Önce test yazıp çökmesini izle (Red),
      sadece onu geçirecek kadar kod yaz (Green), sonra dönüp kodu güzelleştir
      (Refactor)

      100

      . Yazar TDD'nin özellikle Array sıralama (sorting) gibi net girdi-çıktısı
      belli olan Utility fonksiyonlarda uç durumları baştan düşünmek için çok
      faydalı olduğunu söylüyor

      101

      ,

      102

      . Ayrıca "Green-Refactor" kısmını sürekli kullandığını, testler yeşilken
      kodu düzenlemenin çok güvenli olduğunu itiraf ediyor

      102

      .

      Ancak yazar TDD'ye karşı büyük bir tepki de taşıyor. Çoğu zaman bir koda
      başlarken API'nin veya dış bağımlılıkların nasıl şekilleneceğini bilemeyiz

      102

      . Kod yazdıkça tasarım şekillenir

      103

      . LinkedIn'de gördüğü şu iş ilanına ise isyan ediyor: "En yüksek kalitede
      kod yazmanızı bekliyoruz, bu yüzden TDD tecrübesi şarttır."

      103
       Yazar diyor ki: Bu koca bir saçmalıktır!
      104
       Pull Request'lerde bir kodu incelerken kimsenin "Bu kodu TDD ile mi yazdın?" diye sormadığını, asıl önemli olanın "Testler izole mi? Açıklayıcı mı? Davranışı mı test ediyor?" gibi kalite metrikleri olduğunu hatırlatıyor
      104

      . Kısacası TDD, kodun kalitesini ölçen bir metrik değil, tamamen kişisel
      bir tercihtir (personal choice)

      104

      . Eğer sana iyi geliyorsa kullan, ama kullanmıyorsun diye kimse senin
      testlerinin kalitesiz olduğunu iddia edemez

      105

      .

      Bu bölümün özü: Test yazmamak için üretilen bahanelerin tümü kısa vadeli
      yanılgılardır. Etkili bir birim testi; asla içsel veri yapılarını
      (implementation) deşmemeli, her zaman modülün dışarıya sunduğu kamuya açık
      işlevleri (behavior) test etmelidir. Ayrıca endüstrinin TDD'yi bir kalite
      şartı gibi dayatması anlamsızdır; aslolan testin TDD ile yazılıp
      yazılmadığı değil, izole, hızlı ve sistemin davranışını netçe belgeleyen
      yüksek kalitede bir test olmasıdır.
  - baslik: Parça C · Sistem Tasarımı ve İşletme (Bölüm 6-7)
    icerik: >-
      Harika bir noktadayız! Kahvelerimiz hazırsa, yazılım mühendisliğinin en
      kritik, en çok baş ağrıtan ama doğru kurgulandığında sistemleri ayakta
      tutan o büyük konularına, Parça C: Sistem Tasarımı ve İşletme (Bölüm 6-7:
      Distributed Systems, Reliability) dünyasına dalıyoruz.

      Yazar Teiva Harsanyi'nin "The Coder Cafe" kitabında vurguladığı gibi, kod
      yazmak işin sadece bir boyutudur; asıl mesele o kodun binlerce sunucuda,
      milyonlarca kullanıcıya, donanım arızalarına ve ağ kesintilerine rağmen
      "sadece çalışmasını" (it just works) sağlamaktır


      . Görevin kurallarına harfiyen uyarak, bu devasa konuları hiçbir detayı,
      anekdotu veya veriyi atlamadan, adım adım ve sohbet havasında yeniden
      anlatıyorum.

      6.1 - 6.7 Veritabanı Temelleri: ACID, CAP, PACELC ve Tutarlılık

      Dağıtık sistemlerin kalbi veritabanlarında atar. Veritabanı teorisini
      anlamak, sadece doğru aracı seçmek için değil, üretim (production)
      ortamında yaşanabilecek felaketleri önlemek için de hayati bir
      gerekliliktir

      .

      ACID Prensipleri Bu dört harf, ilişkisel veritabanlarının temelini
      oluşturur:

      Atomicity (Atomiklik): Bir işlemin (transaction) tüm adımlarının ya
      tamamen başarılı olması ya da hiçbirinin gerçekleşmemesidir

      . "Ya hep ya hiç" kuralıdır

      . Bir banka transferinde senin hesabından para düşüp karşıya geçmezse, tüm
      işlem geri alınır (rollback) ve veritabanı eski haline döner

      . Yazar burada ince bir detay veriyor: Atomiklik sadece veritabanı ile
      sınırlı kalmak zorunda değildir

      . Örneğin, hem veritabanına yazıp hem de Kafka'ya mesaj gönderdiğin
      dağıtık bir sistemde, biri başarısız olursa diğerini geri alacak bir
      mekanizma kurarsan, bu tüm sistemin "atomik" olduğu anlamına gelir


      .

      Consistency (Tutarlılık): Veritabanının her zaman bir geçerli durumdan
      (valid state) diğer bir geçerli duruma geçmesidir

      . Bu ikiye ayrılır: İşlem seviyesinde tutarlılık, yabancı anahtar (foreign
      key) veya veri tipi kurallarının ihlal edilmemesidir

      . Uygulama seviyesinde tutarlılık ise, örneğin "müşteri bakiyelerinin
      toplamı her zaman pozitif olmalıdır" gibi, veritabanının tek başına
      garanti edemeyeceği iş (domain) kurallarının korunmasıdır

      . Dağıtık sistemlerdeki "Nihai Tutarlılık" (Eventual Consistency) ile
      karıştırılmamalıdır; ACID'deki 'C' veri çoğaltmasıyla değil, veri
      bütünlüğüyle ilgilidir

      .

      Isolation (İzolasyon): Devam eden bir işlemin, eşzamanlı çalışan diğer
      işlemlerden etkilenmemesidir

      . İdeal dünyada bu, işlemlerin aynı anda çalışsalar bile sanki "sırayla
      (serializability)" çalışıyormuş gibi davranmasını gerektirir

      .

      Durability (Dayanıklılık): Bir işlem onaylandığında (commit), sistem çökse
      bile bu değişikliğin asla kaybolmamasıdır

      . Bu genellikle Write-Ahead Logging (WAL) gibi diske yazma teknikleriyle
      sağlanır

      .

      CAP Teoremi Dağıtık sistemlerin acı gerçeğiyle yüzleşelim: Her şeye aynı
      anda sahip olamayız. CAP teoremi; Tutarlılık (Consistency),
      Erişilebilirlik (Availability) ve Bölünme Toleransı (Partition tolerance)
      arasından sadece ikisini seçebileceğimizi söyler


      .

      Tutarlılık (C): Her okuma isteğinin her zaman en güncel veriyi veya bir
      hatayı döndürmesidir (Linearizability)

      .

      Erişilebilirlik (A): Her isteğin, veri en güncel olmasa bile mutlaka
      hatasız bir yanıt almasıdır

      .

      Bölünme Toleransı (P): Ağ sorunları yüzünden düğümler (nodes)
      birbirleriyle iletişim kuramasa bile sistemin çalışmaya devam etmesidir

      .

      Gerçek dünyada ağ kesintileri (partition) kaçınılmaz olduğu için "CA"
      (Tutarlı ve Erişilebilir) bir sistem imkansızdır

      . Bir ağ kesintisi anında sistemin önünde iki seçenek vardır: Ya
      tutarlılığı seçip (CP), kesinti bitene kadar bazı düğümlerin yanıt
      vermesini durdurursun (erişilebilirlikten feragat); ya da erişilebilirliği
      seçip (AP), tüm düğümlerin eski verilerle de olsa yanıt vermesini
      sağlarsın (tutarlılıktan feragat)

      .

      PACELC Teoremi CAP teoreminin büyük bir eksiği vardır: Gecikmeyi (Latency)
      hesaba katmaz

      . Sadece ağ kesintisi olduğunda ne yapılacağını söyler

      . Oysa bir sistem ağ kesintisi yokken de, kullanıcılara yanıt vermek için
      30 dakika bekletiyorsa, CAP teoremine göre teorik olarak "erişilebilir"
      sayılır ki bu pratikte tamamen saçmalıktır!
       PACELC teoremi bu boşluğu doldurur:
      Eğer bir kesinti varsa (Partition), Erişilebilirlik (Availability) veya
      Tutarlılık (Consistency) arasında seçim yap

      .

      Eğer kesinti yoksa (Else), Gecikme (Latency) veya Tutarlılık (Consistency)
      arasında seçim yap

      . Örneğin; Amazon DynamoDB veya Cassandra gibi NoSQL sistemleri PA/EL
      modelindedir (Kesintide erişilebilirliği, normalde düşük gecikmeyi
      seçerler)

      . Google Spanner veya CockroachDB gibi SQL/NewSQL sistemleri ise PC/EC
      modelindedir (Her koşulda tutarlılığı seçerler)


      .

      Safety (Güvenlik) ve Liveness (Canlılık) Bir sistemin doğru çalışması için
      bu iki özelliğe ihtiyacı vardır

      :

      Safety (Güvenlik): "Kötü bir şeyin asla olmayacağını" garanti eder

      . Örneğin, bir kilitlenmenin (deadlock) oluşmaması veya lider seçiminde
      iki sunucunun birden yanlışlıkla kendini "lider" sanmaması bir güvenlik
      (safety) özelliğidir (invariant)


      .

      Liveness (Canlılık): "İyi bir şeyin eninde sonunda olacağını" garanti eder

      . Kilidin eninde sonunda bırakılması veya lider seçim sürecinin bir
      noktada başarıyla tamamlanmasıdır


      . Linux'taki CFS (Completely Fair Scheduler) gibi mekanizmalar, her
      sürecin adil bir şekilde CPU zamanı almasını (Fairness) sağlayarak
      canlılığı destekler

      . Sistem tasarımında bu ikisi arasında takas yapılır: Safety'yi seçen
      sistemler (fail-safe) hata durumunda durmayı tercih ederken, Liveness'ı
      seçen sistemler (fail-fast) ne olursa olsun ilerlemeyi tercih eder


      .

      Consensus (Fikir Birliği) ve Tutarlılık Modelleri Dağıtık sistemlerde
      sunucuların (düğümlerin) ağ sorunlarına veya çökmelere rağmen ortak bir
      karara varmasına Consensus denir

      . Lider seçimi, veri çoğaltması (replication) veya dağıtık sorguların
      çalıştırılması hep buna dayanır

      . Paxos ve Raft gibi algoritmalar bu işi yapar ve mutlaka Sonlanma
      (Termination), Bütünlük (Integrity) ve Anlaşma (Agreement) kurallarını
      sağlamalıdırlar


      .

      Peki kullanıcılar (clients) dağıtık bir sistemden veri okuduğunda ne
      beklemeli? İşte bu Tutarlılık Modelleri (Consistency Models) ile
      belirlenir

      . Google Docs kullanan Alice ve Bob'u düşün: Alice yeni bir paragraf
      ekledi, Bob ise başka birini değiştirdi

      . Herkes bu değişiklikleri aynı sırayla mı görecek (Order)?
       Bob, Alice'in değişimini anında mı görecek yoksa bir gecikme olacak mı (Visibility)?
       Güçlü tutarlılık (Linearizability) herkesin her şeyi anında aynı sırayla görmesini sağlarken, Zayıf tutarlılık (Eventual Consistency) performansı artırır ama gecikmelere göz yumar

      .

      Bu bölümün özü: Dağıtık bir veritabanı tasarlarken veya seçerken hiçbir
      sistem bize her şeyi aynı anda mükemmel şekilde veremez. Ağ kesintilerinde
      tutarlılık ve erişilebilirlik arasında (CAP), normal şartlar altında ise
      düşük gecikme ve tutarlılık arasında (PACELC) bilinçli bir takas yapmak
      zorundayız.

      6.8 - 6.10 İzolasyon Seviyeleri, Anomaliler ve Erişilebilirlik Modelleri

      Gelelim veritabanlarındaki en tehlikeli, en gizinsi hataların
      (anomalilerin) yaşandığı izolasyon dünyasına. Aynı veriye aynı anda
      müdahale etmeye çalışan işlemler (transactions) arasına koyduğumuz
      duvarların kalınlığına İzolasyon Seviyesi diyoruz

      . Duvar ne kadar inceyse sistem o kadar hızlı çalışır, ama o kadar çok
      mantıksal hata (anomali) yaşarız. Adım adım bu hataları ve hangi seviyede
      çözüldüklerini inceleyelim.

      1. Dirty Writes (Kirli Yazmalar) ve Read Uncommitted Seviyesi Bir işlem,
      henüz tamamlanmamış (in-flight) başka bir işlemin yazdığı verinin üzerine
      yazarsa Dirty Write oluşur

