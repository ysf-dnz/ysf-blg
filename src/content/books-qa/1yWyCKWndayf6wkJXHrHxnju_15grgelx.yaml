      nasıl koruduğumuzdur

      .

      Kurallara harfiyen uyarak, hiçbir anekdotu, örneği veya veriyi atlamadan,
      bu derin konuları sanki seninle karşılıklı kahve içiyormuşuz gibi samimi
      ama teknik derinliğini koruyarak yeniden anlatıyorum. Hazırsan başlayalım!

      9.1 İletişim ve Teknik Yazım (Communication & Technical Writing)

      Yazılım mühendisliği, sanılanın aksine bilgisayarlarla değil, insanlarla
      iletişim kurma sanatıdır. Bu bölümde yazar, yardım isterken veya teknik
      bir metin yazarken düştüğümüz iletişim tuzaklarına ve bunlardan nasıl
      kurtulacağımıza odaklanıyor

      .

      XY Problemi (The XY Problem) Günlük iş hayatında en sık karşılaştığımız
      iletişim kazalarından biri "XY Problemi"dir

      . Bu sorun, bir kişinin asıl çözmeye çalıştığı problemi (X) anlatmak
      yerine, o problemi çözmek için kendi bulduğu ama çalışmayan "deneme
      yanılma çözümünü" (Y) sormasıyla ortaya çıkar

      . Bunu hastaneye giden bir hasta gibi düşün. Karnın inanılmaz ağrıyor
      (Problem X). Ama sen doktora gidip "Karnım ağrıyor, neyim var?" demek
      yerine, internetten okuduğun bilgilerle "Doktor bey, bana acil bir
      apandisit ameliyatı (Çözüm Y) yapabilir misiniz?" diyorsun. Doktor senin
      apandisitine odaklanıyor, tahliller yapıyor, her şey normal çıkıyor.
      Saatler süren bir boğuşmadan sonra doktor sana "Senin apandisitin sağlam,
      sen neden ameliyat olmak istiyorsun?" diye sorduğunda "Çünkü karnım
      ağrıyor" diyorsun. Ve doktor "E senin mideni üşütmüşsün, al şu ilacı
      geçsin" diyor. İşte iş hayatındaki XY problemi tam olarak budur! Yazar
      bunu bir yazılım örneğiyle somutlaştırıyor: Bir geliştirici takıma gelip
      "Şu RegEx ifadesinde (Düzenli İfade) bir hata alıyorum, şunu nasıl
      düzeltirim? ^[^@]+@[^@]+.[^@" diye sorar

      . Takımdakiler dakikalarca bu karmaşık RegEx (Y çözümü) üzerinde kafa
      patlatır, çalışmayan yeri bulmaya çalışırlar

      . Oysa soruyu soran kişi cümlenin sonuna şunu ekleseydi: "Bu arada, ben
      müşterilerin e-posta adreslerini doğrulamaya çalışıyorum (X problemi)"

      . O zaman yardım eden kişi anında "Neden RegEx ile uğraşıyorsun ki?
      Sistemimizde zaten validateEmail() diye hazır bir fonksiyon var, onu
      kullansana!" diyebilirdi

      . Bu tuzağı önlemenin yolu açıktır: Yardım isteyen (Asker) kişi her zaman
      asıl problemi (bağlamı) baştan vermelidir

      . Yardım eden (Helper) kişi ise bağlamın eksik olduğunu hissettiğinde,
      doğrudan çözüme atlamak yerine nazikçe "Tam olarak neyi başarmaya
      çalışıyorsun?" diye sormalıdır

      .

      Teknik Yazım İçin 10 Altın Kural Yazar, kendi kitabı 100 Go Mistakes and
      How to Avoid Them'i yazarken edindiği ve bizim tasarım dokümanları (design
      docs) veya PR açıklamaları yazarken kullanabileceğimiz 10 kritik kuralı
      paylaşıyor

      :

      Okuyucu Beklentilerini Yönetin: Okuyucular sadece okumaz, yorumlarlar

      . Yazar olarak, okuyucunun çıkarımlarını şansa bırakmamalı,
      belirsizlikleri ortadan kaldırmalıyız

      .

      Çıplak İddialardan (Naked Assertions) Kaçının: Asla altını doldurmadığınız
      bir iddia ortaya atmayın

      . "Bu kod yapısından kaçınılmalıdır" deyip bırakmayın; okuyucuya "Neden?
      Bu yapıyı sorunlu yapan şey tam olarak nedir?" sorusunun cevabını verin ki
      okuyucu kendi kafasında yanlış varsayımlar kurmasın

      .

      Sonuçları Netleştirin: "Ne yazık ki X, Y'ye neden olur" dediğinizde
      durmayın

      . "Peki Y'nin olması neden bir problem?" sorusunu da mutlaka cevaplayın

      .

      Basit Olduğunu Varsaymayın: "Bu çözüm çok basittir" gibi cümlelerden
      kaçının

      . O an bir konuyu anlamakta zorlanan bir okuyucuya "bu çok basit" demek,
      empati yoksunluğudur ve okuyucuyu aptal hissettirir

      . Sana basit gelen, başkası için basit olmayabilir

      .

      Belirsiz Zamirleri Netleştirin: "O", "Bu", "Şu" gibi zamirler çok
      tehlikelidir

      . Eğer "O" kelimesi bir önceki cümleye atıfta bulunuyorsa ve ufak bir
      belirsizlik varsa, zamir kullanmak yerine doğrudan öznenin adını (örneğin
      "Veritabanı bağlantısı") tekrar yazın

      .

      Kilit Kavramları Pekiştirin: Bir konunun zor olduğunu düşünüyorsanız, onu
      tek bir şekilde anlatıp geçmeyin

      . Aynı konuyu farklı bir açıdan veya farklı bir analojiyle tekrar
      açıklayarak pekiştirin

      .

      Temel Prensipleri Tekrarlayın: Okuyucunun anlamasını garantilemek için
      bazen aynı kilit noktaları farklı kelimelerle tekrar etmekten çekinmeyin

      .

      Düşündürücü Sorular Sorun: "Bu kodun nesi yanlış?" veya "Bu varsayımı
      nasıl doğrularız?" gibi sorular sorarak okuyucunun pasif bir izleyici
      olmaktan çıkıp, zihinsel olarak metne dahil olmasını sağlayın

      .

      Kod Bloklarını Açıklayın: Bir kod bloğunu asla kendi başına bırakmayın

      . Koddan önce, o kodun "ne yapmayı amaçladığını" söyleyin; koddan sonra
      ise, kodun "ne yaptığını" ve o kodda "neyin önemli olduğunu" açıkça
      belirtin

      .

      JIC (Just-In-Case) Yerine JIT (Just-In-Time) Öğretimi Seçin: Okuyucuya
      "Belki ileride lazım olur (Just-In-Case)" diyerek konuyla alakasız bir
      yığın bilgi verip zihnini bulandırmayın


      . Sadece o anki argümanı anlaması için "Tam Zamanında (Just-In-Time)"
      gereken bilgiyi mantıksal bir sırayla verin


      . Sonuç bölümlerinde ise sadece soyut bir bilgi vermek yerine, okuyucunun
      kazandığı "beceriye (skills)" odaklanın

      .

      Bu bölümün özü: İletişimde XY problemine düşmemek için yardım isterken
      sadece kendi bulduğumuz kusurlu çözümü değil, her zaman asıl problemi
      (bağlamı) anlatmalıyız. Teknik yazılarımızda ise okuyucunun zihnini
      okuyamayacağımızı kabul edip; "bu basittir" demekten kaçınmalı, çıplak
      iddiaların altını doldurmalı ve kod bloklarını şansa bırakmadan net bir
      şekilde açıklamalıyız.

      9.2, 9.3 ve 9.4 Bilişsel Önyargılar: Zihnimizin Görünmez Tuzakları
      (Cognitive Biases)

      Neden bazen elimizde tüm gerçekler ve veriler olmasına rağmen tamamen
      mantıksız (irrational) kararlar veririz? Yazar, bu sorunun cevabının
      beynimizin kullandığı zihinsel kısayollarda, yani Bilişsel Önyargılarda
      (Cognitive Biases) yattığını söylüyor

      .

      Bilişsel önyargıyı anlamak için önce ne olmadığını bilmeliyiz. Bir
      Kültürel Önyargı, insanları kendi kültürel normlarımıza göre yargılamaktır

      . Bir Mantıksal Safsata (Logical Fallacy), bir argümanın mantığındaki
      çöküştür (kötü bir çıkarım yapmaktır)


      . Ancak Bilişsel Önyargı, beynimizin bilgiyi işlerken normdan ve
      rasyonaliteden sistematik olarak sapmasıdır

      . Bunu bir okçuluk hedef tahtası (target) analojisiyle düşünelim. Eğer
      sürekli tam 12'den veya merkezin çok yakınından vuruyorsak, doğru kararlar
      veriyoruz demektir

      . Ama eğer oklarımız sürekli, birbiri ardına hedef tahtasının "sol alt
      köşesine" saplanıyorsa, ortada rastgele bir hata değil, sistematik bir
      sapma (deviate) vardır


      . Yani zihnimizde kararlarımızı hep aynı yanlış yöne çeken bir çekim
      kuvveti, bir önyargı vardır

      .

      Aslında bu önyargılar doğuştan kötü değildir; beynimiz milyonlarca yıllık
      evrim sürecinde hayatta kalmak ve hızlı (efficiency) karar verebilmek için
      bu kısayolları geliştirmiştir

      . John Manoogian ve Buster Benson'ın hazırladığı "Bilişsel Önyargı Kodeksi
      (Cognitive Bias Codex)" bunu 4 ana nedene ayırır: Beynimizin aşırı bilgi
      yüklenmesiyle başa çıkması (Too much information), karmaşık olayları
      basitleştirip anlam arayışı (Not enough meaning), baskı altında çok hızlı
      hareket etme zorunluluğu (Need to act fast) ve nelerin hatırlanıp nelerin
      silineceği (What we should remember) seçimi


      . Mühendisler olarak hedefimiz bu önyargıları tamamen yok etmek değil,
      onların varlığını kabul edip sistem tasarlarken veya olayları çözerken
      kendi kararlarımızı sorgulamaktır


      .

      İşte yazılım mühendisliğinde en çok düştüğümüz 3 büyük önyargı:

      1. Doğrulama Yanlılığı (Confirmation Bias) Bu önyargı, sadece kendi
      inancımızı veya varsayımımızı destekleyen bilgileri arama, bulma ve
      lehimize yorumlama eğilimidir

      . Bunu Düz Dünya'ya inanan (Flat-Earth) insanlarda çok net görürüz: Sadece
      kendi teorilerini destekleyen videolar izlerler, aksini kanıtlayan devasa
      bilimsel kanıtları reddederler ve ufkun düz görünmesi gibi muğlak
      (ambiguous) bilgileri "İşte kanıt!" diye sunarlar

      .

      Peki yazılımda bu nasıl karşımıza çıkar? Yazar Google'da yaşadığı bir
      "incident" (sistem çökmesi/arıza) anısını anlatıyor

      . Bir sistem çöktüğünde yazar "Sanırım bu çökme kullanıcı trafiğindeki ani
      artıştan (spike) kaynaklandı" diye bir varsayımda bulunuyor

      . Buraya kadar sorun yok. Ama sorun şu ki; yazar sadece trafiği gösteren
      dashboard'lara bakıp "Evet trafik artmış, sorun kesin bu" diyerek diğer
      her şeyi (yeni atılan bir kodu veya altyapı sorununu) görmezden geliyor


      . Sonuç? Yanlış teşhis ve boşa giden saatler

      . Başka bir örnek: Eski şirketindeki bir Ürün Yöneticisi (PM), yeni
      geliştirdiği bir özelliğin sistemi iyileştireceğine o kadar emindir ki,
      A/B testi kurarken sadece kendi fikrini haklı çıkaracak metrikleri toplar,
      fikrini çürütecek olanları analizden çıkarır

      . Tüm şirket bu yeni özelliği canlıya alır ve aylar sonra sistem
      verimliliğinin aslında yerle bir olduğunu fark edip her şeyi geri almak
      (rollback) zorunda kalırlar!

      . Nasıl Kurtuluruz? Kendi kendimize "Şeytanın Avukatlığını (Devil's
      advocate)" yapmalıyız

      . Bir varsayımda bulunduğumuz an, onu destekleyen değil, onu çürütecek
      (contradictory) kanıtlar aramalıyız


      . Yazarın harika bir taktiği var: Defterine "Varsayım: Uygulama trafikten
      çöktü" yazar ve "Varsayım" kelimesinin altını kalınca çizer


      . Bu ona "Şu an sadece varsayıyorsun, bu bir gerçek değil, yanılıyor
      olabilirsin" sinyalini verir

      .

      2. Sokak Lambası Etkisi (Streetlight Effect) Çok karanlık bir sokakta, tek
      bir sokak lambasının altında bir şeyler arayan sarhoş bir adamı düşün.
      Yanına bir polis yaklaşır ve "Ne arıyorsun?" diye sorar

      . Adam "Anahtarlarımı kaybettim" der. Beraber dakikalarca lambanın altında
      ararlar. Sonunda polis dayanamaz "Anahtarlarını tam olarak burada
      düşürdüğüne emin misin?" der

      . Sarhoş adamın cevabı ibretliktir: "Hayır, ama burası ışığın olduğu tek
      yer (where the light is best)."

      . İşte Sokak Lambası etkisi; insanların bir sorunun asıl kaynağına veya en
      önemli yere değil, bakması ve ölçmesi en kolay (easily visible) yere
      odaklanmasıdır

      .

      Yazılımda bunun 5 yıkıcı örneği vardır

      :

      Gözlemlenebilirlik (Observability): Ekipler sadece mevcut dashboard'lara
      bakar ve "Tüm grafikler yeşil, demek ki sistem harika" der

      . Oysa müşteri tarafında (karanlıkta kalan yerde) sistem tamamen çökmüş
      olabilir

      .

      Teknik Borç (Tech Debt): Geliştiriciler kod tabanında sadece kendi iyi
      bildikleri ve kolay görünen yerlerdeki ufak tefek teknik borçları
      temizlerler; ama sistemin asıl köklerinde yatan devasa ve tehlikeli mimari
      borçları (karanlıkta kaldığı için) görmezden gelirler

      .

      A/B Testleri: Kullanıcının gerçek deneyimini (bütünsel) ölçmek çok zor
      olduğu için, sadece tıklama oranı gibi "ölçülmesi en kolay" metriklere
      bakarak bir özelliğin başarılı olduğuna karar verilir

      .

      Kod İncelemeleri (Code Reviews): PR inceleyen bir geliştiricinin, kodun
      derinlerindeki karmaşık mimari hataları yakalamak yerine, gözüne ilk
      çarpan "syntax (sözdizimi)" veya "boşluk" hatalarına yorum atıp PR'ı
      onaylamasıdır

      .

      Optimizasyon: Sistemin genel darboğazını bulmak yerine, sadece ölçülmesi
      kolay olan spesifik bir fonksiyonun gecikmesini (latency) optimize edip
      sistemin hızlandığını sanmaktır

      .

      3. Hayatta Kalan Yanlılığı (Survivor Bias) İkinci Dünya Savaşı'ndasın.
      Amacın, uçakların savaştan sağ salim dönmesi için zırhlarını güçlendirmek.
      Önüne bir rapor geliyor: Savaştan üsse geri dönebilen uçakların
      gövdelerinde ve kanat uçlarında devasa kurşun delikleri (kırmızı noktalar)
      var


      . Hemen "Uçaklar en çok buralardan vuruluyor, hemen gövdeyi ve kanat
      uçlarını zırhla kaplayalım!" diyorsun

      . Uyguluyorsun, ama düşen uçak sayısında hiçbir azalma olmuyor!
       Neden mi? Çünkü sen sadece "Hayatta Kalan (Survivor)" uçaklara baktın!
      . Kanadından veya gövdesinden vurulan uçaklar zaten bir şekilde üsse
      dönebiliyorlardı

      . Asıl zırhlanması gereken yerler, önündeki o kırmızı noktalı grafikte
      "hiç mermi izi olmayan" yerlerdi (örneğin motor veya kokpit); çünkü
      oralardan vurulan uçaklar hayatta kalamayıp okyanusun dibini boyluyor,
      senin veri setine (dashboard'una) hiç giremiyorlardı!

      .

      Biz geliştiriciler de sadece "başarılı" olan örneklere bakıp, başarısız
      olanları görmezden gelerek devasa hatalar yaparız

      . Örneğin, "FAANG (Google, Amazon vs.) İdolizasyonu". Birçok şirket Google
      kullanıyor diye tüm sistemlerini Monorepo (tek kod deposu) veya Kubernetes
      yapısına taşır

      . Ama bu yapıya geçip de batan, iflas eden, projesi çöken binlerce şirketi
      (okyanusun dibindeki uçakları) görmezden gelirler

      . Veya sadece "Açık kaynak projelere katkı yaptığı için" çok başarılı
      olmuş bir Senior mühendise bakıp, yıllarını açık kaynağa verip kariyerinde
      bir adım bile ileri gidememiş insanları hesaba katmayız

      .

      Bu bölümün özü: Zihnimiz, karmaşıklığı yönetmek için bize oyunlar oynar.
      Kendi varsayımımıza aşık olup karşıt kanıtları reddetmemeli (Doğrulama
      Yanlılığı), sorunu sadece ölçmesi en kolay yerde aramamalı (Sokak Lambası
      Etkisi) ve bir teknolojiyi/yöntemi seçerken sadece onu kullanarak başarılı
      olmuş şirketlere değil, onu kullanıp da batmış olan görünmez vakalara da
      (Hayatta Kalan Yanlılığı) bakmalıyız.

      9.3 Eleştirel Düşünce ve Hata Yönetimi (Critical Thinking & Mistake
      Journal)

      Eleştirel düşünce, ilk içgüdümüze teslim olmak yerine; varsayımları,
      kanıtları ve alternatifleri masaya yatırıp sorgulama pratiğidir

      . Yazar bu bölümde yaratıcılığımızı artıracak yanal düşünmeyi ve
      hatalarımızdan ders çıkarma sanatını anlatıyor.

      Yanal Düşünce (Lateral Thinking) Geleneksel problem çözme yöntemimiz Dikey
      Düşüncedir (Vertical Thinking)

      . Bu, adım adım, her adımın bir öncekine mantıksal olarak dayandığı
      yapısal bir yaklaşımdır

      . Matematik problemi çözer gibi; her aşamada haklı olmak zorundasındır


      . Ancak bu yöntem bizi her zaman bildiğimiz, tanıdığımız aynı yollara
      hapseder

      . Beynimiz bir "örüntü oluşturma (pattern-making)" makinesi olduğu için,
      daha önce bir sorunu A yöntemiyle çözdüysek, yeni ve farklı bir sorunda da
      inatla A yöntemini kullanmaya (stick to that method) çalışır

      .

      İşte Yanal Düşünce (Lateral Thinking) bizi bu kısır döngüden kurtarır.
      Yanal düşünce; birbirinden tamamen alakasız bilgileri (unlikely
      information) bir araya getirip, soruna bambaşka ve beklenmedik bir açıdan
      (fresh angle) bakabilmektir

      . Yanal düşüncenin en muhteşem yanı şudur: Sürecin her adımında haklı
      olmak zorunda değilsindir!
       Bazen geçici olarak mantıksız, saçma veya tamamen yanlış bir argümanı kullanarak (invalid arrangements), günün sonunda tamamen geçerli ve harika bir çözüme (valid restructuring) ulaşabilirsin
      . Düşünsene, bir toplantıdasın ve birisi çıkıp gerçekten tamamen yanlış,
      uçuk bir fikir ortaya atıyor

      . Çoğu takımda o kişi susturulur. Oysa o "yanlış" fikir, odadaki başka
      birinin zihninde bir kıvılcım yaratıp, asıl harika çözümün doğmasını
      sağlayabilir!
       Yanlış olmaktan korkup hiç fikir üretmemektense, çalışmayan birkaç fikir üretmek bin kat daha iyidir

      . "Biz bunu hep böyle yapardık" cümlesine karşı açılmış bir savaştır bu

      .

      Yanal düşünceyi tetiklemek için 4 eyleme geçirilebilir teknik vardır

      :

      Tersine Çevirme Tekniği (Reversal): Geleneksel bakış açısını tam tersine
      çevir

      . "Bu uygulamayı kullanıcı için nasıl daha kolay yaparım?" diye düşünmek
      yerine, "Bu uygulamayı bir kullanıcı için nasıl cehenneme çeviririm, onu
      nasıl delirtirim?" diye sor!

      . Bunu sorduğunda, kullanıcının nerelerde acı çekebileceğini (pain points)
      bulursun ve sonra o acı noktalarını yok edersin

      .

      SCAMPER Tekniği: Bir dizi tetikleyici sorudur. (Substitute-Yerine koy,
      Combine-Birleştir, Adapt-Uyarla, Modify-Değiştir, Put to another use-Başka
      amaçla kullan, Eliminate-Yok et, Reverse-Tersine çevir)

      . "Şu özellikle şu özelliği birleştirsem ne olur?" veya "Bu fonksiyonun
      yerine bambaşka bir şey koysam çalışır mı?" diye sormaktır

      .

      Varsayımlara Meydan Okuma (Challenging Assumptions): Bir sorunu çözerken
      farkında bile olmadığımız varsayımlarımız vardır

      . "Bu sorunu çözmek için kesinlikle X aracını kullanmalıyız" varsayımına
      karşı çık: "Eğer dünyada X aracı hiç var olmasaydı, bu sorunu nasıl
      çözerdim?" diye sor

      .

      Provokatif Teknik (Provocative Technique): Zihni sarsmak için kasıtlı
      olarak absürt ve kışkırtıcı sorular sormaktır

      . "Ya sistemimizde hiçbir veri saklamamız (store data) yasak olsaydı?"
      veya "Ya uygulamadaki arayüzde (UI) hiçbir buton olmasaydı ne yapardık?"


      . Bu çılgın (outrageous) senaryolar, bizi sınırlayıcı düşünce
      kalıplarından koparıp inovasyona iter

      .

      Hata Günlüğü Tutmak (Keeping a Mistake Journal) Yazar kendi hatalarıyla
      yüzleşmekten çekinmeyen biri (hatta "Hatalar" üzerine kitabı var)

      . Hata yapmak kaçınılmazdır

      . Ancak asıl felaket, aynı hatayı defalarca yapmaktır

      . Bilişsel bilimci Janet Metcalfe'nin araştırmasına göre; hatalarımız
      üzerinde bilinçli olarak düşünmek (reflecting on errors), öğrenmeyi
      güçlendirmenin ve o hatayı zihnimizde yeniden şekillendirip bir daha
      yapmamanın en etkili yoludur

      .

      Yazar, kendine kızdığı veya hayal kırıklığına uğradığı (frustrated)
      hataları tekrar etmemek için Notion üzerinde bir "Hata Günlüğü" tutuyor ve
      şu harika formatı kullanıyor


      :

      İsim: Hataya verilen kısa ad. (Örn: Dikkatlice okumak yerine göz gezdirmek
      - Skimming)


      .

      Etiketler: Kategoriler (Eleştirel düşünce, detaya dikkat vb.)


      .

      Bağlam: Bu hata nerede oldu? (Örn: Bir PR'ı, e-postayı veya teknik
      dokümanı incelerken)


      .

      Problem: Neydi bu hata? (Örn: Zaman kazanmak için uzun bir metni okumak
      yerine sadece hızlıca göz gezdirdim)


      .

      Etkileri: Ne gibi sonuçlar doğurdu? (Örn: Konuyu eksik anladım, yanlış
      kararlar verdim, gereksiz e-posta trafiği yarattım ve günün sonunda bir
      "aptal" gibi göründüm)

      .

      Alınan Ders: Buradan ne öğrendim?

      Düzeltme Planı: Gelecekte ne yapacağım? (Örn: Eğer bir konu tam
      odaklanmamı gerektiriyorsa, o dokümanı yarım yamalak okumayacağıma kendime
      söz veriyorum)

      .

      Son Oluşumu ve Tekrar Sayısı: Bu hatayı en son ne zaman yaptım ve bugüne
      kadar kaç kere tekrarladım?

      Bu basit sistemin 3 devasa faydası var: Aynı hataları daha az yapmak,
      kendi hatalarındaki "örüntüleri (pattern)" keşfedip zihinsel önyargılarını
      fark etmek ve potansiyel hataları henüz yapmadan önce yakalamak (Better
      decision-making)

      .

      Bu bölümün özü: Yaratıcılık, sadece dikey (mantıksal) düşünmekle değil;
      geçici olarak saçma veya mantıksız görünse de alakasız kavramları
      birleştirip soruna bambaşka bir açıdan bakabilmekle (yanal düşünce)
      gelişir. Hata yapmaktan korkmak yerine; hatalarımızı bir günlüğe kaydedip,
      etkilerini ve düzeltme planımızı yazarak, hataları zihinsel bir gelişim ve
      öğrenme aracına dönüştürebiliriz.

      9.4 Bilgi Yönetimi ve İkinci Beyin (Knowledge Management & Second Brain)

      Günde onlarca makale okuyor, podcast dinliyor, videolar izliyor ve harika
      kitaplar bitiriyoruz. Peki 2 ay sonra o okuduğun harika kitaptan aklında
      ne kalıyor? Neredeyse hiçbir şey! İşte yazar, 10 yıl boyunca yaşadığı bu
      "bilgi kaybetme" acısını Tiago Forte'nin İkinci Beyin (Building a Second
      Brain) felsefesiyle nasıl çözdüğünü anlatıyor

      .

      10 Yıllık Başarısızlık Yazar 10 yıl boyunca neden başarısız oldu? İki
      sebebi vardı: Birincisi, notları darmadağınıktı. Birazı Notion'da, birazı
      Apple Notes'ta, birazı fiziksel defterde, birazı Kindle altı çizmelerinde,
      birazı Anki uygulamasındaydı (Centralized place yoktu)

      . İkincisi, her şey için farklı bir formatı vardı; bir kitap özeti ile bir
      kodlama notu tamamen farklı yapılardaydı (Generic değildi)

      . Sonuç: Zihin sürekli bilgi tüketiyordu ama bu bilgiler kısa sürede uçup
      gidiyordu

      . Eğer okuduklarımızdan çalışan, kullanılabilir bir bilgi (working
      knowledge) çıkarıp saklayamıyorsak, öğrenme sürecimiz tamamen verimsizdir

      .

      İkinci Beyin Felsefesi: Zihin Fikir Üretmek İçindir, Depolamak İçin Değil
      Kitaptaki en çarpıcı cümle şudur: "Zihniniz (beyniniz) fikir üretmek
      (having ideas) içindir, o fikirleri elinde tutmak (holding them) için
      değil."

      . Beynimiz bilgisayar hard diski gibi çalışmaz. Yeni ve o an işine yarayan
      fikirlere yer açmak için, kullanmadığı eski bilgileri acımasızca budar ve
      siler (Synaptic pruning)

      . İşte İkinci Beyin, beynimizin bu unutma yükünü (offload notes) üzerinden
      alıp güvende tuttuğumuz harici bir sistemdir

      . Yazarın hayatını değiştiren ikinci aydınlanma ise "mükemmeliyetçiliği"
      bırakmasıdır

      . Bizler bir ansiklopedi veya kusursuz bir kütüphane inşa etmiyoruz; biz,
      kusurlu (imperfect) da olsa günlük hayatımızda bizim için "çalışan ve işe
      yarayan" (working system) bir destek sistemi kuruyoruz


      .

      Zihin Yapısı: Bilgiyi Projeye Dönüştürmek Normalde bir bilgi (Information)
      alırız ve onu hemen bir projede/işte (Project) kullanırız

      . Ama iş bittiğinde o bilgi uçar gider

      . İkinci Beyin, bu düz çizginin arasına bir "Geri Bildirim Döngüsü
      (Feedback loop)" ekler

      . Aldığımız bilgi, sadece o anki proje için değil, gelecekte tekrar
      kullanılabilecek kalıcı bir "Bilgiye (Knowledge)" dönüşür

      . Notlara artık "okuyup sakladığım ölü metinler" olarak bakmamalıyız.
      Notlar, gelecekteki yeni fikirlerimizi inşa edeceğimiz Yapı Taşlarıdır
      (Building blocks)

      . Nörobilimci Nancy C. Andreasen'in dediği gibi: "Yaratıcı insanlar;
      ilişkileri tanıma, çağrışımlar yapma ve bağlantılar (connections) kurma
      konusunda daha iyidirler."

      . Tek bir merkezi yerde duran notlar, senin aylar sonra bambaşka iki
      konuyu birleştirip devasa bir yaratıcılık (creativity) patlaması yaşamana
      olanak tanır

      . Yaratıcılık doğuştan gelen bir yetenek değil, bilgiyi işleme biçimidir
      (way of operating)

      .

      Nasıl Not Almalıyız? İlerlemeli Özetleme (Progressive Summarization) Not,
      sadece kopyala-yapıştır yapılmış bir metin değildir. Senin süzgecinden
      geçmiş (curated), sana özel kelimelerle ifade edilmiş ve kendi yaşamından
      beslenmiş bir içeriktir

      . Karşımıza çıkan her şeyi not almak zorunda değiliz (ansiklopedi
      yazmıyoruz). Kendimize 4 soru sormalıyız: Bana ilham veriyor mu?
      Kullanışlı mı? Kişisel mi? Şaşırtıcı mı?

      . Sende duygusal bir tepki uyandıran (resonates), sana "işte bu ilginç"
      dedirten 30 saniyelik bir video, herkesin övdüğü ama sana hitap etmeyen
      kalın bir kitaptan çok daha değerlidir


      . Not alırken asıl soru şudur: "Bunu gelecekteki kendim (future self) için
      nasıl en kullanışlı hale getiririm?"

      . Gelecekteki senin zamanı kısıtlı. Ona yüzlerce satır okutamazsın. Metnin
      "Özünü, kalbini (essence)" bulmalısın

      . Çok yoğun ve teknik bir belge okuyorsak (Örneğin Google'ın F1 Dağıtık
      Veritabanı makalesi), yazarın İlerlemeli Özetleme (Progressive
      Summarization) dediği katmanlı (layering) yapıyı kullanmalıyız

      :

      Katman 1 (Yakalanan Notlar - Captured): Kendi cümlelerinle veya
      kopyala-yapıştır ile aldığın ham metin


      .

      Katman 2 (Kalın Metinler - Bolded): Ham metni oku ve sadece en kilit
      cümleleri kalın (bold) yap


      .

      Katman 3 (Vurgulanan Metinler - Highlighted): Kalın yaptığın yerleri bir
      daha oku ve içlerindeki en can alıcı kelimelerin/cümlelerin üstünü sarı
      kalemle (highlight) çiz


      .

      Katman 4 (Özet - Summary): Tüm bunlara bakarak, makalenin sana kattığı ana
      fikirleri en tepeye 3-5 maddelik kısa bir özet olarak yaz


      . Böylece aylar sonra bu nota geri döndüğünde sadece "Summary" kısmını
      okuyup geçebilirsin. Eğer daha fazla detay lazımsa sadece "Sarı" yerlere,
      o da yetmezse "Kalın" yerlere inebilirsin

      . Zamanın sana kalır.

      PARA ve CODE Sistemleri Notlarımızı türüne göre (kitaplar, podcastler)
      değil, "Eyleme Dönüşebilirlik (Actionability)" seviyesine göre ayırmalıyız


      . PARA sistemi 4 klasörden oluşur

      :

      Projects (Projeler): Bitiş tarihi ve net bir hedefi olan kısa vadeli
      çabalar (Örn: İkinci beyin hakkında bir blog yazısı yayınlamak)

      .

      Areas (Alanlar): Sürekli dikkat gerektiren, bitiş tarihi olmayan,
      hayatındaki sorumluluk standartları

      . (Yazarın örneği: Fitness yapmak, sağlıklı beslenmek ve buna adanmış
      olmak bir "Alan"dır)

      .

      Resources (Kaynaklar): Şu an bir projeye veya alana ait olmayan ama "ilgi
      duyduğun" her türlü bilgi

      . (Yazarın örneği: Tırmanış (climbing) yapmayı seviyor ama fitness gibi
      buna kendini adamamış, ara sıra yapıyor. O halde tırmanış notları bir
      "Kaynak" tır)

      .

      Archives (Arşivler): Artık aktif olmayan, bitmiş projeler veya eski
      kaynakların atıldığı dondurucu

      . Ve tüm bu süreç CODE döngüsüyle çalışır: Capture (Sadece sende yankı
      uyandıranı yakala), Organize (PARA ile eyleme göre düzenle), Distill
      (İlerlemeli özetlemeyle özünü damıt), Express (Öğrendiklerini kendi
      işinde/projende dışa vurarak göster)

      .

      Bu bölümün özü: İnsan beyni bilgiyi depolamak için değil, bilgileri
      birleştirip yeni fikirler üretmek (yaratıcılık) için tasarlanmıştır. Bu
      yüzden okuduklarımızı unutmamak ve gelecekteki projelerimizde birer "yapı
      taşı" olarak kullanabilmek için kusursuz olmak zorunda olmayan, bizi
      hızlandıracak özetleme teknikleri (katmanlı özet) ve eylem odaklı
      klasörleme (PARA) ile çalışan dijital bir "İkinci Beyin" inşa etmeliyiz.

      9.5 Zihin Yapısı ve Psikolojik Sürdürülebilirlik (Mindset)

      Yazılım mühendisliği, kodlarla boğuştuğumuz kadar kendi zihnimizle de
      boğuştuğumuz bir meslektir. Belirsizlik, başarısızlık hissi ve sektörün
      bitmek bilmeyen temposuyla başa çıkabilmek için sağlam bir psikoloji
      (Mindset) inşa etmek zorundayız

      .

      "Bilmiyorum" Demekten Utanma Geçen ay yazar ve eşi, yeni doğacak bebekleri
      için hastanedeydiler

      . Eşi bir semptom yaşar ve bunu odadaki ebeyi (midwife) çağırıp sorarlar

      . Ebe bir an duraklar, gözlerinde bir tereddüt belirir ama "sahte bir
      özgüvenle" bir cevap uydurup verir. Yazar ve eşi onun aslında bilmediğini
      anlarlar

      . Sonra vardiya değişir, yeni gelen ebeye aynı soruyu sorarlar; o da
      tereddüt eder ve bu kez "bambaşka" bir cevap uydurur

      . En sonunda üçüncü bir ebe gelir. Aynı soruyu ona da sorarlar. Ebe durur,
      düşünür ve o büyülü 3 kelimeyi söyler: "Bunu bilmiyorum (I don't know)."

      . Yazar diyor ki: "Kulağa mantıksız gelebilir ama bu üç kelime, ona
      diğerlerinden daha fazla güvenmemizi sağladı."

      . İşin daha da güzeli, o ebe 20 dakika sonra odaya geri döner ve "Gidip
      doktora sordum, sebebi şuymuş. Bana bu soruyu sorduğunuz için teşekkür
      ederim, sayenizde yeni bir şey öğrendim" der

      .

      Biz yazılımcılar olarak çoğu zaman "Her şeyi bilen otorite" pozunu
      (posture) takınırız

      . O mimarinin, o kodun sahibi bizizdir. Ve o pozisyondayken "Bilmiyorum"
      demek, sanki inşa ettiğimiz iskambil kartlarından (house of cards)
      evimizin altındaki o kilit kartı çekmek ve her şeyin yıkılacağını
      hissetmek gibidir

      . Oysa gerçeği bilmeden "biliyormuş gibi yapmak", takımı yanlış
      yönlendirir ve felaket kararlara yol açar

      . "Bilmiyorum" demek bir zayıflık değil, güvenilirliğin (reliability) ta
      kendisidir

      . Otorite her şeyi bilmekle değil, dürüstlükle kurulur. Google'ın kendi
      araştırmasına göre, takımların başarılı olmasındaki en büyük etken
      "Psikolojik Güvenliktir (Psychological safety)"; yani insanların ceza veya
      yargılanma korkusu olmadan belirsizliklerini ve bilmediklerini rahatça
      söyleyebilmesidir

      . Unutma: Merak + Alçakgönüllülük = Gerçek Öğrenme

      .

      Zamanı Değil, Enerjiyi Yönet (Manage Your Energy, Not Your Time)
      Sektörümüzde sürekli "Daha çok kod yaz, daha hızlı teslim et, işten sonra
      açık kaynak projelere katkı yap (constant hustle)" kültürü pompalanır

      . Ruh sağlığımız (mental health) genelde en sona atılır

      . Zaman sabittir; herkesin günde 24 saati vardır

      . Ancak takvimindeki iki gün tamamen aynı saatlere sahip olsa bile, bir
      gün kendini inanılmaz üretken hissederken diğer gün hiçbir şey yapmak
      istemezsin


      . Bunun sebebi zamanının değil, zihinsel enerjinin bitmiş olmasıdır

      . Tükenmişlik (Burnout) mesaisi bittiği için değil, enerjisi bittiği halde
      takviminde "boş vakti" var diye kendini zorlamaya devam eden insanları
      vurur

      . Enerjin düştüğünde sistemin sana "dur" diyordur. Dinlenmek, yürüyüşe
      çıkmak veya video oyunu oynamak tembellik (laziness) değildir; enerjini
      yeniden doldurmak için stratejik bir zorunluluktur

      . Kariyer bir kısa mesafe koşusu (sprint) değil, bir maratondur

      . Sürdürülebilir bir tempo için saatlerine değil, enerjine odaklan

      .

      Başkalarıyla Kıyaslama ve Zorlanmayı Kabul Etme Yazar bir gün Netflix'te
      "Senior" mühendis olarak çalışan eski bir okul arkadaşını (classmate)
      görür ve anında "Ben çok geride kaldım" diyerek kendini yetersiz hisseder

      . Zihinsel sağlığına en büyük darbeyi, kendini başkalarıyla kıyasladığında
      vurursun

      . Hele ki sosyal medya (Social media) sadece başarıların, parlak
      kısımların sergilendiği, reddedilmelerin ve başarısızlıkların ustaca
      gizlendiği bir vitrinken, bu kıyaslama tam bir zehirdir


      . Sosyal medya seni boğuyorsa ara ver

      . Sen başkalarıyla aynı piste değilsin; kendi yolculuğunda, kendi hızında
      (our own journey at our own pace) ilerliyorsun

      .

      Ve bazen sadece kötü bir gün değil; haftalar, aylar süren odaklanma
      sorunları, tükenmişlik veya anksiyete yaşayabilirsin (It's okay to
      struggle sometimes)

      . Zorlanmak senin zayıf (weak) olduğunu değil, sadece bir insan (human)
      olduğunu gösterir

      . Böyle zamanlarda yapacağın en güçlü şey, bunu bir arkadaşına veya
      profesyonele anlatarak içindeki o ağır yükü sesli olarak dışa vurmaktır


      . Eğer çalıştığın şirket senin zihinsel sağlığını konuşmaktan bile
      korktuğun bir yerse, sorun sende değil şirkettedir; orası senin için doğru
      yer değildir

      . Ruh sağlığı işin bir parçası değil, tam kalbidir

      .

      Bu bölümün özü: İtibarı kaybetme korkusuyla sahte cevaplar vermek yerine,
      alçakgönüllülükle "Bilmiyorum" diyebilmek takım içindeki psikolojik
      güvenliği ve gerçek öğrenmeyi tetikler. Başarılı ve uzun soluklu bir
      kariyerin sırrı; başkalarının sosyal medyadaki sahte parlaklığıyla kendini
      kıyaslamayı bırakmak, makine olmadığımızı (bazen zorlanabileceğimizi)
      kabul etmek ve boş saatlerimizi değil zihinsel enerjimizi doğru
      yönetmektir. Bizler önce insan, sonra mühendisisiz.
