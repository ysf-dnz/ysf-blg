      yerine elindeki önbellekten daha az doğru ama hızlı sonuçlar dönmesi de
      (availability over accuracy) zarifçe hizmet azaltmaya bir örnektir


      .

      Uyarlamalı LIFO (Adaptive LIFO) Yük atmanın farklı bir versiyonu olarak
      Facebook'un bulduğu çok çarpıcı bir yöntem var

      . Normalde HTTP sunucuları, işletim sistemi sınırlarına (SOMAXCONN gibi)
      dayanana kadar istekleri bir kuyrukta İlk Giren İlk Çıkar (FIFO)
      mantığıyla tutar


      . Sistem felç olup kuyruk tıkandığında ise yavaş yavaş en eski işleri
      eritmeye başlar

      . Ama durup düşündüğümüzde, 2 dakikadır kuyrukta bekleyen bir kullanıcı
