       Read Committed izolasyon seviyesi, sadece onaylanmış verilerin okunmasına izin vererek bu anomalileri engeller
      .

      3. Fuzzy Reads (Bulanık Okumalar) ve Repeatable Reads Seviyesi Aynı işlem
      (transaction) içinde aynı satırı iki kez okuyup, arada başkasının o satırı
