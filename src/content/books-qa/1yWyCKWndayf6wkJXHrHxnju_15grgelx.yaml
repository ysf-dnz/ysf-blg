      . Bakiye ne olacak? İki işlemin yazdıkları birbirine karıştığı için sistem
      çöküş yaşar

      . En düşük izolasyon seviyesi olan Read Uncommitted dahil tüm seviyeler
      veritabanlarında satırları kilitleyerek bu ölümcül hatayı önler

      .

      2. Dirty Reads (Kirli Okumalar) ve Read Committed Seviyesi Bir işlem,
      henüz commit edilmemiş "havadaki" bir veriyi okuduğunda Dirty Read
      gerçekleşir

