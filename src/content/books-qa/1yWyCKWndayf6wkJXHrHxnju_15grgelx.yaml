      101

      102

      .

      Bunu bilmek ne işe yarar?

      103
       Hard bağımlılıklarda SLA hedeflerin çok katı olmalı, kod yayınlamaları (rollout) son derece dikkatli yapılmalı ve kusursuz izleme (observability) kurulmalıdır
      103


      . Ama en büyük tehlike, zamanla sessizce şekil değiştiren bağımlılıklardır

      106

      . Sistemin yavaşlığını çözmek için araya bir "Önbellek (Cache)" koydun
