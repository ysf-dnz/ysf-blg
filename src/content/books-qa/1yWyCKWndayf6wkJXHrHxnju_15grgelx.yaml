      .

      5. Write Skew (Yazma Çarpıklığı) ve Serializable Snapshot Isolation (SSI)
      İki işlemin aynı veriyi okuyup, o veriye dayanarak farklı kararlar alması
      ve ardından veriyi bozmasıdır

      . Harika bir örnek: Bir hastanede "Her an en az 1 doktor nöbetçi
      kalmalıdır" kuralı var

      . Alice ve Bob nöbetçi, ikisi de hasta hissediyor

      . T1 (Alice) sisteme sorar: "Kaç nöbetçi var?" Yanıt: 2

      . T2 (Bob) sorar: "Kaç nöbetçi var?" Yanıt: 2

      . İkisi de sistemde 2 kişi olduğunu gördüğü için "Ben çıksam da 1 kişi
      kalır" diye düşünerek nöbetten çıkar ve commit eder

      . Sonuç? Nöbetçi sayısı 0'a düşer ve kural ihlal edilir!

      . SSI seviyesi commit aşamasında ekstra kontroller ekleyerek bu gizli
      çarpıklığı önler

      .

      6. Phantom Reads (Hayalet Okumalar) ve Serializability Seviyesi Bir işlem
      içindeki WHERE gibi koşullu (predicate) okumaların sonuç kümesinin, başka
      bir işlemin yeni satır eklemesi/silmesi yüzünden değişmesidir

      . T1, "Algo101 sınıfındaki en yaşlı öğrencinin" yaşını çeker

      . T2 sisteme yeni (ve çok yaşlı) öğrenciler ekler

      . T1 ardından aynı sınıfın "yaş ortalamasını" çeker

      . T1'in elindeki ortalama yaş, az önce çektiği "en yüksek yaştan" daha
      büyük çıkar!

      . En katı seviye olan Serializability, her işlemin tamamen seri (arka
      arkaya) çalışıyormuş gibi davranmasını sağlayarak bu hayalet okumaları
      engeller, ancak performansı ciddi şekilde düşürür


      .

      Erişilebilirlik Modelleri (Availability Models) Beyaz kağıtları
      (whitepapers) okurken şirketlerin "Yüksek Erişilebilirlik (High
      Availability)" terimini kafalarına göre kullandıklarını görürüz

      . Google Megastore ile Amazon Dynamo'nun "yüksek erişilebilirlik" tanımı
      birbirinden tamamen farklıdır

      . Antithesis'in tanımına göre bu kavram, "tek bir sunucudan daha sık
      ayakta olan sistem" demektir

      . Ancak daha net anlaşılması için üç modele bakmalıyız


      :

      Majority Available (Çoğunluk Erişilebilirliği): 5 düğümlü bir
      veritabanında 2'si çökse bile, kalan 3'ü kendi arasında anlaşıp (çoğunluk
      - majority) işlemlere devam ediyorsa sistem erişilebilirdir

      . Google Megastore bu modeli kullanır, güçlü tutarlılığı korur

      . Eğer 3 düğüm çökerse sistem durur

      .

      Totally Available (Tam Erişilebilirlik): 5 düğümün 3'ü çökse bile, ayakta
      kalan tek bir düğüm diğerlerine sormadan kendi başına isteklere yanıt
      verebiliyorsa sistem tam erişilebilirdir


      . Amazon Dynamo bu modeli kullanır

      . Gecikmeyi en aza indirir ancak tutarlılığı (consistency) feda eder

      .

      Sticky Available (Yapışkan Erişilebilirlik): Bir istemcinin (client) her
      zaman kendi yaptığı işlemleri bilen (kendi geçmişini yansıtan) bir
      sunucuya bağlanarak işlemlerine devam edebilmesidir

      . Sistemde büyük ağ kesintileri olsa bile, Müşteri A kendi yaptığı
      değişiklikleri her zaman görebilir


      .

      Bu bölümün özü: Veritabanlarındaki izolasyon seviyeleri, kirli okumalardan
      hayalet okumalara kadar sistemin mantıksal bütünlüğünü tehdit eden
      anomalileri engeller ancak seviye yükseldikçe sistem yavaşlar. Dağıtık
      mimarilerde "yüksek erişilebilirlik" sihirli bir kelime değildir; sistemin
      tasarımına göre çoğunluk, tam veya yapışkan erişilebilirlik (majority,
      total, sticky) gibi farklı teknik sınırlara ve tutarlılık tavizlerine
      dayanır.

      6.11 - 6.14 Sistem Tasarımı: Ölçeklendirme, Gecikme, Bloom Filtreleri ve
      Karmaşık Sistemler

      Sistem tasarımında (System Design) mülakatlarda veya devasa ölçekli üretim
      ortamlarında hayat kurtaran, sezgilere aykırı ama çok güçlü kavramlar
      vardır.

      Olasılıksal Artış (Probabilistic Increment) Yeni bir sosyal medya
      uygulamasında "Beğeni (Like)" butonunu tasarladığını düşün

      . Çok popüler bir paylaşıma saniyede binlerce beğeni gelirse, veritabanına
      gidip sürekli +1 yapmak sistemi tıkayacaktır

      . Eğer mutlak bir kesinlik gerekmiyorsa (yani 27.001 ile 27.003 beğeni
      arasındaki fark kimsenin umurunda değilse) yazar çok zekice bir yöntem
      öneriyor: Her beğeni isteğinde 0'dan 10'a kadar rastgele bir sayı üret
      (randomInt(10))

      . Eğer sayı 0 çıkarsa (yani %10 ihtimal) veritabanına git ve +10 ekle!

      . Diğer durumlarda hiçbir şey yapma

      . Büyük Sayılar Yasası (Law of large numbers - yazı tura örneği gibi)
      sayesinde sistem milyonlarca işlemde kendini dengeleyecek ve sen
      veritabanı yükünü anında onda birine düşürmüş olacaksın


      .

      Gecikme (Latency) ve Kullanıcı Deneyimi Gecikme sadece teknik bir metrik
      değil, doğrudan ticari bir kayıptır


      . Amazon'un verilerine göre yükleme süresindeki her 100 milisaniyelik
      artış satışlarda %1'lik bir düşüşe yol açıyor

      . Google ise arama sonuçlarındaki 500 milisaniyelik artışın trafiği %20
      düşürdüğünü saptamış

      . Kullanıcı tarafında bu gecikmeyi çözmenin 3 yolu vardır

      :

      Gerçekten hızlandır: Kodu optimize et, CDN kullan

      .

      Kullanıcıyı öngör: Kullanıcının tıklayacağı bağlantıları önceden tahmin
      edip veriyi önceden yükle (prefetch)

      .

      Hız yanılsaması (Illusion of speed) yarat: Houston havalimanındaki bagaj
      bekleme şikayetleri inanılmaz bir zekayla çözülmüştür

      . Bagajların daha hızlı gelmesini sağlayamadıkları için, uçakları
      terminalden daha uzağa park ettirmişlerdir

      . Yolcular bagaj beklerken hareketsiz kalmak (ki bu bekleme süresini çok
      uzun hissettirir) yerine o süreyi yürüyerek geçirmiş ve şikayetler sıfıra
      inmiştir!
       Benzer bir teknik Cool Maze uygulamasında var
      . Uygulama QR kod taraması yapmadan saniyeler önce kamera lensini açıp
      arka planda bağlantıyı kurduğu için kullanıcılara anında çalışıyormuş
      hissi verir

      .

      Bloom Filtreleri Yüksek trafikli bir sistemde bir kullanıcının siteyi daha
      önce ziyaret edip etmediğini hızlıca bilmen gerekiyor

      . Tüm kullanıcıları bir Hashmap (sözlük) içinde tutmak devasa bellek (RAM)
      israfıdır


      . Her seferinde veritabanına sormak ise korkunç bir gecikme yaratır

      .

      Bloom Filtresi, veriyi tutmak yerine sadece "ayak izini" tutan, son derece
      bellek dostu olasılıksal bir veri yapısıdır


      . İçi sıfırlarla dolu bir bit dizisi (bitvector) ve MD5, Murmur gibi
      birden fazla hash (kriptolama) fonksiyonundan oluşur


      . Bir veriyi eklerken ("foo"), hash fonksiyonlarına sokar ve dizideki
      ilgili indeksleri 1 yaparız


      . Veriyi ararken ("baz"), yine hash'e sokarız. Eğer o indekslerden biri
      bile 0 ise, verinin sistemde OLMADIĞINA %100 eminizdir (Asla False
      Negative vermez)


      . Ama tüm indeksler 1 ise, veri BÜYÜK İHTİMALLE sistemde vardır (False
      Positive verebilir çünkü başka verilerin ayak izleriyle çakışmış olabilir)


      . Yazar burada matematiğe de giriyor: Hatalı pozitif oranını (p)
      belirlemek için formül kullanırız ve bu formül için sisteme girecek
      "beklenen eleman sayısını (n)" doğru tahmin etmek hayati önem taşır


      . Ancak Bloom filtrelerinin bir kusuru vardır: Rastgele erişim (random
      access) yaptığı için CPU önbelleklerinde "cache miss" yaratır (dizilerdeki
      gibi verileri blok halinde alamaz)

      . Eğer işin nanosaniyelerle ölçülüyorsa, verilerin aynı CPU önbellek
      satırına (cache line) düştüğü "Blocked Bloom Filters" alternatifini
      kullanmak gerekir


      .

      Karışık (Complicated) ve Karmaşık (Complex) Sistemler Arasındaki Fark
      Yazar kariyerindeki tecrübelerini kıyaslarken harika bir tespit yapıyor.
      Eski şirketinde, Uber benzeri bir sistemde "yolcuya en yakın sürücüyü
      bulma" problemi Karışık (Complicated) bir problemdi


      . Karışık problemler zordur ama öngörülebilirdir ve geo-hashing gibi
      bilinen yapısal çözümleri vardır (vergi dairesine beyanname vermek gibi)


      . Şu an Google SRE (Site Reliability Engineer) ekibinde ML (Makine
      Öğrenmesi) altyapısında çalışırken uğraştığı sorunlar ise Karmaşık
      (Complex)

      . İklim değişikliğiyle mücadele etmek gibi; ezberlenmiş yöntemler işe
      yaramaz, sürekli değişen yenilikçi çözümler gerekir

      .

      Karmaşık sistemlerin 5 temel karakteristiği vardır


      :

      Emergent Behavior (Beliren Davranış): Parçaları tek tek incelesen bile
      sistemin bütününün nasıl davranacağını öngöremezsin

      . Gemini yapay zekasının hiç beklenmedik sonuçlar üretmesi bunun en iyi
      örneğidir

      .

      Gecikmeli Sonuçlar (Delayed Consequences): Bugün canlıya aldığın bir
      değişikliğin patlaması haftalar sonra ortaya çıkabilir, bu da kök neden
      (root cause) analizini felç eder

      .

      Yerel vs Global Optimizasyon: Bir parçayı iyileştirmek, sürpriz bir
      şekilde tüm sistemi kötüleştirebilir

      . Bütün, parçaların toplamından fazlasıdır

      .

      Histeresis (Hysteresis): Sorunu çözsen bile sistemin kendine gelmesi
      saatler sürebilir

      . Trafik kazası kalkan bir yolda trafiğin hemen açılmaması gibi; yazılımda
      da önbelleklerin (cache) tekrar dolması veya kuyruktaki bekleyen
      isteklerin eritilmesi yüzünden sistemin yavaşlığı devam eder

      .

      Doğrusal Olmazlık (Nonlinearity): Ufak bir yük artışı, tepki süresini
      doğrusal değil üstel (exponential) olarak artırıp sistemi anında
      çökertebilir (Kuyruk teorisindeki doyum noktası)

      .

      Bu devasa kaosun içinde nasıl hayatta kalacağız? Yazarın stratejileri
      şunlar


      : Amazon'un taktiğiyle kararların çoğunu geri alınabilir (Reversibility -
      two-way doors) yapıp deneme yanılmaya izin ver


      . Sadece yerel metriklere kanma, sistemin bütünsel sağlığına (global
      metrics) bak

      . Kademeli yayılım (Feature flags, canary, shadow testing) ile patlama
      yarıçapını (blast radius) sınırla


      . Yeni kod yayınlamadan sistemin bilinmeyen herhangi bir durumunu
      (novel/bizarre state) anlamanı sağlayacak kusursuz bir Gözlemlenebilirlik
      (Observability) kur


      . Olayları canlıya almadan önce geçmiş verilerle (replaying past events)
      veya deterministik simülasyonlarla test et


      . Ve en önemlisi; her senaryoyu manuel kurgulayamayacağın için Makine
      Öğrenmesi (ML) gibi adaptif teknolojilere güven ve takımınla psikolojik
      olarak güvenli bir ortamda varsayımları tartış


      .

      Bu bölümün özü: Yüksek trafikli sistemlerde kesinlik yerine olasılıklara
      dayanarak ölçeklenebilirlik sağlamak (Probabilistic increment, Bloom
      filtreleri) veya gecikmeyi psikolojik hilelerle örtbas etmek kritik
      stratejilerdir. Karmaşık (Complex) sistemlerin kaosunu yönetmek ise
      ezberlenmiş çözümlerle değil; geri alınabilir kararlar, kademeli yayılım
      ve kusursuz bir gözlemlenebilirlik (observability) kültürü kurmakla
      mümkündür.

      7.1 - 7.5 Güvenilirliğin Temelleri: Zarifçe Hizmet Azaltma ve Bağımlılık
      Yönetimi

      Yazar, kariyerini tamamen değiştiren bir anısını paylaşıyor. Hava trafik
      yönetimi gibi güvenlik açısından son derece kritik bir alanda çalışmaya
      başladığı ilk gün, tüm yeni gelenlerle birlikte büyük bir konferans
      salonunda eğitimdedir


      . Eğitmen herkese sırayla geçmişini sorar ve yazarımız sigorta sektöründen
      geldiğini söyler

      . Herkes bitirdiğinde eğitmen o dondurucu cümleyi kurar: "Bize katılarak
      anlamanız gereken çok önemli bir şey var: Eğer burada bir sorun yaşarsak
      para kaybetmeyiz, müşteri kaybetmeyiz... İnsanların hayatlarını
      kaybederiz."

      Yazar yıllar sonra Google'a geçtiğinde şunu fark eder: Hava trafiği olmasa
      bile, örneğin insanların yıllarca biriktirdiği paha biçilmez anılarını,
      çocuklarının fotoğraflarını tutan bir bulut servisinin çöküp tüm veriyi
      silmesi de inanılmaz derecede yıkıcıdır

      . Uygulamanın ne kadar janjanlı özelliği olursa olsun, Güvenilirlik
      (Reliability) diğer tüm özelliklerin var olabilmesi için temel şarttır

      . Kullanıcı gözünden tanımı basittir: "Sadece çalışması" (it just works)

      .

      Peki bunu sistem tasarımı bağlamında nasıl sağlayacağız?

      Zarifçe Hizmet Azaltma (Graceful Degradation) Sistemlerimiz her zaman
      beklenmedik olaylarla, devasa trafik artışlarıyla karşılaşır

      . Tüm sistemin çökmesini izlemektense, hizmet kalitesini bilinçli olarak
      düşürmek çok daha zekicedir

      . Yazar kendi tecrübesinden bir felaket senaryosu anlatıyor: Sistem aniden
      yüksek trafik alıyor

      . Veritabanına bağlanan 100 kapasiteli bağlantı havuzu (connection pool)
      anında doluyor ve istekler kuyruğa birikiyor

      . Bunu gören Kubernetes "Aha sistem zorlanıyor" deyip otomatik
      ölçeklendirme (autoscaling) yapıyor ve yeni sunucular ayağa kaldırıyor

      . Ama o yeni sunucular da veritabanından bağlantı (connection) istemeye
      başlıyor!
       Sonuç olarak veritabanı tamamen felç oluyor ve istisnasız HER kullanıcı hata (timeout) alıyor
      . Oysa bu durum, Yük Atma (Load Shedding) yöntemiyle çözülebilirdi. Sistem
      dar boğaza girdiğinde trafiğin bir kısmını bilinçli olarak reddetmek (hata
