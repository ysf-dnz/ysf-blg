name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit + component testleri
        run: npm test
      - name: Build
        run: npm run build
      - name: Lighthouse CI
        run: npx lhci autorun
      - name: Playwright
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
