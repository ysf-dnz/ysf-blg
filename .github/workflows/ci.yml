name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit + component testleri
        run: npm test
      - name: Build
        run: npm run build
      # Server-mode (Vercel adapter): statik çıktı dist/client'ta (lighthouserc.json staticDistDir)
      - name: Lighthouse CI
        run: npx lhci autorun
      # e2e CI'da YOK: dev sunucusu Clerk anahtarı + DB ister (canlı Neon'a CI'dan bağlanılmaz) →
      # yerelde `npm run qa` (check + birim + build + çıktı bekçisi + e2e).
